3e83e1510d1aca2f2e8a7c081c7645042b 18aba9d1fad1bd9c' ] ] ] ) c.2. single signer examples c.2.1. single ecdsa signature this example uses the following: * signature algorithm: ecdsa w/ sha-256, curve p-256 size of binary file is 98 bytes 18( [ / protected h'a10126' / << { / alg / 1:-7 / ecdsa 256 / } >>, / unprotected / { / kid / 4:'11' }, / payload / 'this is the content.', / signature / h'8eb33e4ca31d1c465ab05aac34cc6b23d58fef5c083106c4 d25a91aef0b0117e2af9a291aa32e14ab834dc56ed2a223444547e01f11d3b0916e5 a4c345cacb36' ] ) c.3. examples of enveloped messages c.3.1. direct ecdh this example uses the following: * cek: aes-gcm w/ 128-bit key * recipient class: ecdh ephemeral-static, curve p-256 size of binary file is 151 bytes 96( [ / protected h'a10101' / << { / alg / 1:1 / aes-gcm 128 / } >>, / unprotected / { / iv / 5:h'c9cf4df2fe6c632bf7886413' }, / ciphertext / h'7adbe2709ca818fb415f1e5df66f4e1a51053ba6d65a1a0 c52a357da7a644b8070a151b0', / recipients / [ [ / protected h'a1013818' / << { / alg / 1:-25 / ecdh-es + hkdf-256 / } >>, / unprotected / { / ephemeral / -1:{ / kty / 1:2, / crv / -1:1, / x / -2:h'98f50a4ff6c05861c8860d13a638ea56c3f5ad7590bbf bf054e1c7b4d91d6280', / y / -3:true }, / kid / 4:'meriadoc.brandybuck@buckland.example' }, / ciphertext / h'' ] ] ] ) c.3.2. direct plus key derivation this example uses the following: * cek: aes-ccm w/ 128-bit key, truncate the tag to 64 bits * recipient class: use hkdf on a shared secret with the following implicit fields as part of the context. - salt: \"aabbccddeeffgghh\" - partyu identity: \"lighting-client\" - partyv identity: \"lighting-server\" - supplementary public other: \"encryption example 02\" size of binary file is 91 bytes 96( [ / protected h'a1010a' / << { / alg / 1:10 / aes-ccm-16-64-128 / } >>, / unprotected / { / iv / 5:h'89f52f65a1c580933b5261a76c' }, / ciphertext / h'753548a19b1307084ca7b2056924ed95f2e3b17006dfe93 1b687b847', / recipients / [ [ / protected h'a10129' / << { / alg / 1:-10 } >>, / unpr
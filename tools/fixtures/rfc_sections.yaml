\"Formal Security Proofs\n              for a Signature Scheme with Partial Message Recovery\",\n              LNCS Volume 2020, DOI 10.1007/3-540-45353-9_11, June 2000,\n              <https://www.certicom.com/content/dam/certicom/images/\n              pdfs/CerticomWP-PVSigSec_login.pdf>.\n\n   [RFC2633]  Ramsdell, B., Ed., \"S/MIME Version 3 Message\n              Specification\", RFC 2633, DOI 10.17487/RFC2633, June 1999,\n              <https://www.rfc-editor.org/info/rfc2633>.\n\n   [RFC3394]  Schaad, J. and R. Housley, \"Advanced Encryption Standard\n              (AES) Key Wrap Algorithm\", RFC 3394, DOI 10.17487/RFC3394,\n              September 2002, <https://www.rfc-editor.org/info/rfc3394>.\n\n   [RFC3851]  Ramsdell, B., Ed., \"Secure/Multipurpose Internet Mail\n              Extensions (S/MIME) Version 3.1 Message Specification\",\n              RFC 3851, DOI 10.17487/RFC3851, July 2004,\n              <https://www.rfc-editor.org/info/rfc3851>.\n\n   [RFC4262]  Santesson, S., \"X.509 Certificate Extension for Secure/\n              Multipurpose Internet Mail Extensions (S/MIME)\n              Capabilities\", RFC 4262, DOI 10.17487/RFC4262, December\n              2005, <https://www.rfc-editor.org/info/rfc4262>.\n\n   [RFC4949]  Shirey, R., \"Internet Security Glossary, Version 2\",\n              FYI 36, RFC 4949, DOI 10.17487/RFC4949, August 2007,\n              <https://www.rfc-editor.org/info/rfc4949>.\n\n   [RFC5116]  McGrew, D., \"An Interface and Algorithms for Authenticated\n              Encryption\", RFC 5116, DOI 10.17487/RFC5116, January 2008,\n              <https://www.rfc-editor.org/info/rfc5116>.\n\n   [RFC5652]  Housley, R., \"Cryptographic Message Syntax (CMS)\", STD 70,\n              RFC 5652, DOI 10.17487/RFC5652, September 2009,\n              <https://www.rfc-editor.org/info/rfc5652>.\n\n   [RFC5751]  Ramsdell, B. and S. Turner, \"Secure/Multipurpose Internet\n              Mail Extensions (S/MIME) Version 3.2 Message\n              Specification\", RFC 5751, DOI 10.17487/RFC5751, January\n              2010, <https://www.rfc-editor.org/info/rfc5751>.\n\n   [RFC5752]  Turner, S. and J. Schaad, \"Multiple Signatures in\n              Cryptographic Message Syntax (CMS)\", RFC 5752,\n              DOI 10.17487/RFC5752, January 2010,\n              <https://www.rfc-editor.org/info/rfc5752>.\n\n   [RFC5990]  Randall, J., Kaliski, B., Brainard, J., and S. Turner,\n              \"Use of the RSA-KEM Key Transport Algorithm in the\n              Cryptographic Message Syntax (CMS)\", RFC 5990,\n              DOI 10.17487/RFC5990, September 2010,\n              <https://www.rfc-editor.org/info/rfc5990>.\n\n   [RFC6838]  Freed, N., Klensin, J., and T. Hansen, \"Media Type\n              Specifications and Registration Procedures\", BCP 13,\n              RFC 6838, DOI 10.17487/RFC6838, January 2013,\n              <https://www.rfc-editor.org/info/rfc6838>.\n\n   [RFC7252]  Shelby, Z., Hartke, K., and C. Bormann, \"The Constrained\n              Application Protocol (CoAP)\", RFC 7252,\n              DOI 10.17487/RFC7252, June 2014,\n              <https://www.rfc-editor.org/info/rfc7252>.\n\n   [RFC7515]  Jones, M., Bradley, J., and N. Sakimura, \"JSON Web\n              Signature (JWS)\", RFC 7515, DOI 10.17487/RFC7515, May\n              2015, <https://www.rfc-editor.org/info/rfc7515>.\n\n   [RFC7516]  Jones, M. and J. Hildebrand, \"JSON Web Encryption (JWE)\",\n              RFC 7516, DOI 10.17487/RFC7516, May 2015,\n              <https://www.rfc-editor.org/info/rfc7516>.\n\n   [RFC7517]  Jones, M., \"JSON Web Key (JWK)\", RFC 7517,\n              DOI 10.17487/RFC7517, May 2015,\n              <https://www.rfc-editor.org/info/rfc7517>.\n\n   [RFC7518]  Jones, M., \"JSON Web Algorithms (JWA)\", RFC 7518,\n              DOI 10.17487/RFC7518, May 2015,\n              <https://www.rfc-editor.org/info/rfc7518>.\n\n   [RFC8032]  Josefsson, S. and I. Liusvaara, \"Edwards-Curve Digital\n              Signature Algorithm (EdDSA)\", RFC 8032,\n              DOI 10.17487/RFC8032, January 2017,\n              <https://www.rfc-editor.org/info/rfc8032>.\n\n   [RFC8126]  Cotton, M., Leiba, B., and T. Narten, \"Guidelines for\n              Writing an IANA Considerations Section in RFCs\", BCP 26,\n              RFC 8126, DOI 10.17487/RFC8126, June 2017,\n              <https://www.rfc-editor.org/info/rfc8126>.\n\n   [RFC8152]  Schaad, J., \"CBOR Object Signing and Encryption (COSE)\",\n              RFC 8152, DOI 10.17487/RFC8152, July 2017,\n              <https://www.rfc-editor.org/info/rfc8152>.\n\n   [RFC8230]  Jones, M., \"Using RSA Algorithms with CBOR Object Signing\n              and Encryption (COSE) Messages\", RFC 8230,\n              DOI 10.17487/RFC8230, September 2017,\n              <https://www.rfc-editor.org/info/rfc8230>.\n\n   [RFC8551]  Schaad, J., Ramsdell, B., and S. Turner, \"Secure/\n              Multipurpose Internet Mail Extensions (S/MIME) Version 4.0\n              Message Specification\", RFC 8551, DOI 10.17487/RFC8551,\n              April 2019, <https://www.rfc-editor.org/info/rfc8551>.\n\n   [RFC8610]  Birkholz, H., Vigano, C., and C. Bormann, \"Concise Data\n              Definition Language (CDDL): A Notational Convention to\n              Express Concise Binary Object Representation (CBOR) and\n              JSON Data Structures\", RFC 8610, DOI 10.17487/RFC8610,\n              June 2019, <https://www.rfc-editor.org/info/rfc8610>.\n\n   [RFC8613]  Selander, G., Mattsson, J., Palombini, F., and L. Seitz,\n              \"Object Security for Constrained RESTful Environments\n              (OSCORE)\", RFC 8613, DOI 10.17487/RFC8613, July 2019,\n              <https://www.rfc-editor.org/info/rfc8613>.\n\n   [RFC9054]  Schaad, J., \"CBOR Object Signing and Encryption (COSE):\n              Hash Algorithms\", RFC 9054, DOI 10.17487/RFC9054, August\n              2022, <https://www.rfc-editor.org/info/rfc9054>.\n\n   [RFC9106]  Biryukov, A., Dinu, D., Khovratovich, D., and S.\n              Josefsson, \"Argon2 Memory-Hard Function for Password\n              Hashing and Proof-of-Work Applications\", RFC 9106,\n              DOI 10.17487/RFC9106, September 2021,\n              <https://www.rfc-editor.org/info/rfc9106>.\n\n   [STD90]    Bray, T., Ed., \"The JavaScript Object Notation (JSON) Data\n              Interchange Format\", STD 90, RFC 8259, December 2017,\n              <https://www.rfc-editor.org/info/std90>.\n\n   [W3C.WebCrypto]\n              Watson, M., Ed., \"Web Cryptography API\", W3C\n              Recommendation, 26 January 2017,\n              <https://www.w3.org/TR/WebCryptoAPI/>.\n\nAppendix A.  Guidelines for External Data Authentication of Algorithms\n\n   During development of COSE, the requirement that the algorithm\n   identifier be located in the protected attributes was relaxed from a\n   must to a should.  Two basic reasons have been advanced to support\n   this position.  First, the resulting message will be smaller if the\n   algorithm identifier is omitted from the most common messages in a\n   CoAP environment.  Second, there is a potential bug that will arise\n   if full checking is not done correctly between the different places\n   that an algorithm identifier could be placed (the message itself, an\n   application statement, the key structure that the sender possesses,\n   and the key structure the recipient possesses).\n\n   This appendix lays out how such a change can be made and the details\n   that an application needs to specify in order to use this option.\n   Two different sets of details are specified: those needed to omit an\n   algorithm identifier and those needed to use the variant on the\n   countersignature attribute that contains no attributes about itself.\n\n   Three sets of recommendations are laid out.  The first set of\n   recommendations applies to having an implicit algorithm identified\n   for a single layer of a COSE object.  The second set of\n   recommendations applies to having multiple implicit algorithms\n   identified for multiple layers of a COSE object.  The third set of\n   recommendations applies to having implicit algorithms for multiple\n   COSE object constructs.\n\n   The key words from BCP 14 ([RFC2119] and [RFC8174]) are deliberately\n   not used here.  This specification can provide recommendations, but\n   it cannot enforce them.\n\n   This set of recommendations applies to the case where an application\n   is distributing a fixed algorithm along with the key information for\n   use in a single COSE object.  This normally applies to the smallest\n   of the COSE objects -- specifically, COSE_Sign1, COSE_Mac0, and\n   COSE_Encrypt0 -- but could apply to the other structures as well.\n\n   The following items should be taken into account:\n\n   *  Applications need to list the set of COSE structures that implicit\n      algorithms are to be used in.  Applications need to require that\n      the receipt of an explicit algorithm identifier in one of these\n      structures will lead to the message being rejected.  This\n      requirement is stated so that there will never be a case where\n      there is any ambiguity about the question of which algorithm\n      should be used, the implicit or the explicit one.  This applies\n      even if the transported algorithm identifier is a protected\n      attribute.  This applies even if the transported algorithm is the\n      same as the implicit algorithm.\n\n   *  Applications need to define the set of information that is to be\n      considered to be part of a context when omitting algorithm\n      identifiers.  At a minimum, this would be the key identifier (if\n      needed), the key, the algorithm, and the COSE structure it is used\n      with.  Applications should restrict the use of a single key to a\n      single algorithm.  As noted for some of the algorithms in\n      [RFC9053], the use of the same key in different, related\n      algorithms can lead to leakage of information about the key,\n      leakage about the data, or the ability to perform forgeries.\n\n   *  In many cases, applications that make the algorithm identifier\n      implicit will also want to make the context identifier implicit\n      for the same reason.  That is, omitting the context identifier\n      will decrease the message size (potentially significantly,\n      depending on the length of the identifier).  Applications that do\n      this will need to describe the circumstances where the context\n      identifier is to be omitted and how the context identifier is to\n      be inferred in these cases.  (An exhaustive search over all of the\n      keys would normally not be considered to be acceptable.)  An\n      example of how this can be done is to tie the context to a\n      transaction identifier.  Both would be sent on the original\n      message, but only the transaction identifier would need to be sent\n      after that point, as the context is tied into the transaction\n      identifier.  Another way would be to associate a context with a\n      network address.  All messages coming from a single network\n      address can be assumed to be associated with a specific context.\n      (In this case, the address would normally be distributed as part\n      of the context.)\n\n   *  Applications cannot rely on key identifiers being unique unless\n      they take significant efforts to ensure that they are computed in\n      such a way as to create this guarantee.  Even when an application\n      does this, the uniqueness might be violated if the application is\n      run in different contexts (i.e., with a different context\n      provider) or if the system combines the security contexts from\n      different applications together into a single store.\n\n   *  Applications should continue the practice of protecting the\n      algorithm identifier.  Since this is not done by placing it in the\n      protected attributes field, applications should define an\n      application-specific external data structure that includes this\n      value.  This external data field can be used as such for content\n      encryption, MAC, and signature algorithms.  It can be used in the\n      SuppPrivInfo field for those algorithms that use a KDF to derive a\n      key value.  Applications may also want to protect other\n      information that is part of the context structure as well.  It\n      should be noted that those fields, such as the key or a Base IV,\n      that are protected by virtue of being used in the cryptographic\n      computation do not need to be included in the external data field.\n\n   The second case is having multiple implicit algorithm identifiers\n   specified for a multiple-layer COSE object.  An example of how this\n   would work is the encryption context that an application specifies,\n   which contains a content encryption algorithm, a key wrap algorithm,\n   a key identifier, and a shared secret.  The sender omits sending the\n   algorithm identifier for both the content layer and the recipient\n   layer, leaving only the key identifier.  The receiver then uses the\n   key identifier to get the implicit algorithm identifiers.\n\n   The following additional items need to be taken into consideration:\n\n   *  Applications that want to support this will need to define a\n      structure that allows for, and clearly identifies, both the COSE\n      structure to be used with a given key and the structure and\n      algorithm to be used for the secondary layer.  The key for the\n      secondary layer is computed as normal from the recipient layer.\n\n   The third case is having multiple implicit algorithm identifiers, but\n   targeted at potentially unrelated layers or different COSE objects.\n   There are a number of different scenarios where this might be\n   applicable.  Some of these scenarios are:\n\n   *  Two contexts are distributed as a pair.  Each of the contexts is\n      for use with a COSE_Encrypt message.  Each context will consist of\n      distinct secret keys and IVs and potentially even different\n      algorithms.  One context is for sending messages from party A to\n      party B, and the second context is for sending messages from party\n      B to party A.  This means that there is no chance for a reflection\n      attack to occur, as each party uses different secret keys to send\n      its messages; a message that is reflected back to it would fail to\n      decrypt.\n\n   *  Two contexts are distributed as a pair.  The first context is used\n      for encryption of the message, and the second context is used to\n      place a countersignature on the message.  The intention is that\n      the second context can be distributed to other entities\n      independently of the first context.  This allows these entities to\n      validate that the message came from an individual without being\n      able to decrypt the message and see the content.\n\n   *  Two contexts are distributed as a pair.  The first context\n      contains a key for dealing with MACed messages, and the second\n      context contains a different key for dealing with encrypted\n      messages.  This allows for a unified distribution of keys to\n      participants for different types of messages that have different\n      keys, but where the keys may be used in a coordinated manner.\n\n   For these cases, the following additional items need to be\n   considered:\n\n   *  Applications need to ensure that the multiple contexts stay\n      associated.  If one of the contexts is invalidated for any reason,\n      all of the contexts associated with it should also be invalidated.\n\nAppendix B.  Two Layers of Recipient Information\n\n   All of the currently defined recipient algorithm classes only use two\n   layers of the COSE structure.  The first layer (COSE_Encrypt) is the\n   message content, and the second layer (COSE_Recipient) is the content\n   key encryption.  However, if one uses a recipient algorithm such as\n   the RSA Key Encapsulation Mechanism (RSA-KEM) (see Appendix A of RSA-\n   KEM [RFC5990]), then it makes sense to have two layers of the\n   COSE_Recipient structure.\n\n   These layers would be:\n\n   *  Layer 0: The content encryption layer.  This layer contains the\n      payload of the message.\n\n   *  Layer 1: The encryption of the CEK by a KEK.\n\n   *  Layer 2: The encryption of a long random secret using an RSA key\n      and a key derivation function to convert that secret into the KEK.\n\n   This is an example of what a triple-layer message would look like.\n   To make it easier to read, it is presented using the extended CBOR\n   diagnostic notation (defined in [RFC8610]) rather than as a binary\n   dump.  The message has the following layers:\n\n   *  Layer 0: Has content encrypted with AES-GCM using a 128-bit key.\n\n   *  Layer 1: Uses the AES Key Wrap algorithm with a 128-bit key.\n\n   *  Layer 2: Uses ECDH Ephemeral-Static direct to generate the Layer 1\n      key.\n\n   In effect, this example is a decomposed version of using the ECDH-\n   ES+A128KW algorithm.\n\n   Size of binary file is 183 bytes\n\n   96(\n     [ / COSE_Encrypt /\n       / protected h'a10101' / << {\n           / alg / 1:1 / AES-GCM 128 /\n         } >>,\n       / unprotected / {\n         / iv / 5:h'02d1f7e6f26c43d4868d87ce'\n       },\n       / ciphertext / h'64f84d913ba60a76070a9a48f26e97e863e2852948658f0\n   811139868826e89218a75715b',\n       / recipients / [\n         [ / COSE_Recipient /\n           / protected / h'',\n           / unprotected / {\n             / alg / 1:-3 / A128KW /\n           },\n           / ciphertext / h'dbd43c4e9d719c27c6275c67d628d493f090593db82\n   18f11',\n           / recipients / [\n             [ / COSE_Recipient /\n               / protected h'a1013818' / << {\n                   / alg / 1:-25 / ECDH-ES + HKDF-256 /\n                 } >> ,\n               / unprotected / {\n                 / ephemeral / -1:{\n                   / kty / 1:2,\n                   / crv / -1:1,\n                   / x / -2:h'b2add44368ea6d641f9ca9af308b4079aeb519f11\n   e9b8a55a600b21233e86e68',\n                   / y / -3:false\n                 },\n                 / kid / 4:'meriadoc.brandybuck@buckland.example'\n               },\n               / ciphertext / h''\n             ]\n           ]\n         ]\n       ]\n     ]\n   )\n\nAppendix C.  Examples\n\n   This appendix includes a set of examples that show the different\n   features and message types that have been defined in this document.\n   To make the examples easier to read, they are presented using the\n   extended CBOR diagnostic notation (defined in [RFC8610]) rather than\n   as a binary dump.\n\n   A GitHub project has been created at [GitHub-Examples] that contains\n   not only the examples presented in this document, but a more complete\n   set of testing examples as well.  Each example is found in a JSON\n   file that contains the inputs used to create the example, some of the\n   intermediate values that can be used in debugging the example, and\n   the output of the example presented both as a hex dump and in CBOR\n   diagnostic notation format.  Some of the examples at the site are\n   designed to be failure-testing cases; these are clearly marked as\n   such in the JSON file.  If errors in the examples in this document\n   are found, the examples on GitHub will be updated, and a note to that\n   effect will be placed in the JSON file.\n\n   As noted, the examples are presented using CBOR's diagnostic\n   notation.  A Ruby-based tool exists that can convert between the\n   diagnostic notation and binary.  This tool can be installed with the\n   command line:\n\n   gem install cbor-diag\n\n   The diagnostic notation can be converted into binary files using the\n   following command line:\n\n   diag2cbor.rb < inputfile > outputfile\n\n   The examples can be extracted from the XML version of this document\n   via an XPath expression, as all of the source code is tagged with the\n   attribute type='cbor-diag'.  (Depending on the XPath evaluator one is\n   using, it may be necessary to deal with &gt; as an entity.)\n\n   //sourcecode[@type='cbor-diag']/text()\n\nC.1.  Examples of Signed Messages\n\nC.1.1.  Single Signature\n\n   This example uses the following:\n\n   *  Signature Algorithm: ECDSA w/ SHA-256, Curve P-256\n\n   Size of binary file is 103 bytes\n\n   98(\n     [\n       / protected / h'',\n       / unprotected / {},\n       / payload / 'This is the content.',\n       / signatures / [\n         [\n           / protected h'a10126' / << {\n               / alg / 1:-7 / ECDSA 256 /\n             } >>,\n           / unprotected / {\n             / kid / 4:'11'\n           },\n           / signature / h'e2aeafd40d69d19dfe6e52077c5d7ff4e408282cbefb\n   5d06cbf414af2e19d982ac45ac98b8544c908b4507de1e90b717c3d34816fe926a2b\n   98f53afd2fa0f30a'\n         ]\n       ]\n     ]\n   )\n\nC.1.2.  Multiple Signers\n\n   This example uses the following:\n\n   *  Signature Algorithm: ECDSA w/ SHA-256, Curve P-256\n\n   *  Signature Algorithm: ECDSA w/ SHA-512, Curve P-521\n\n   Size of binary file is 277 bytes\n\n   98(\n     [\n       / protected / h'',\n       / unprotected / {},\n       / payload / 'This is the content.',\n       / signatures / [\n         [\n           / protected h'a10126' / << {\n               / alg / 1:-7 / ECDSA 256 /\n             } >>,\n           / unprotected / {\n             / kid / 4:'11'\n           },\n           / signature / h'e2aeafd40d69d19dfe6e52077c5d7ff4e408282cbefb\n   5d06cbf414af2e19d982ac45ac98b8544c908b4507de1e90b717c3d34816fe926a2b\n   98f53afd2fa0f30a'\n         ],\n         [\n           / protected h'a1013823' / << {\n               / alg / 1:-36 / ECDSA 521 /\n             } >> ,\n           / unprotected / {\n             / kid / 4:'bilbo.baggins@hobbiton.example'\n           },\n           / signature / h'00a2d28a7c2bdb1587877420f65adf7d0b9a06635dd1\n   de64bb62974c863f0b160dd2163734034e6ac003b01e8705524c5c4ca479a952f024\n   7ee8cb0b4fb7397ba08d009e0c8bf482270cc5771aa143966e5a469a09f613488030\n   c5b07ec6d722e3835adb5b2d8c44e95ffb13877dd2582866883535de3bb03d01753f\n   83ab87bb4f7a0297'\n         ]\n       ]\n     ]\n   )\n\nC.1.3.  Signature with Criticality\n\n   This example uses the following:\n\n   *  Signature Algorithm: ECDSA w/ SHA-256, Curve P-256\n\n   *  There is a criticality marker on the \"reserved\" header parameter.\n\n   Size of binary file is 125 bytes\n\n   98(\n     [\n       / protected h'a2687265736572766564f40281687265736572766564' /\n       << {\n           \"reserved\":false,\n           / crit / 2:[\n             \"reserved\"\n           ]\n         } >>,\n       / unprotected / {},\n       / payload / 'This is the content.',\n       / signatures / [\n         [\n           / protected h'a10126' / << {\n               / alg / 1:-7 / ECDSA 256 /\n             } >>,\n           / unprotected / {\n             / kid / 4:'11'\n           },\n           / signature / h'3fc54702aa56e1b2cb20284294c9106a63f91bac658d\n   69351210a031d8fc7c5ff3e4be39445b1a3e83e1510d1aca2f2e8a7c081c7645042b\n   18aba9d1fad1bd9c'\n         ]\n       ]\n     ]\n   )\n\nC.2.  Single Signer Examples\n\nC.2.1.  Single ECDSA Signature\n\n   This example uses the following:\n\n   *  Signature Algorithm: ECDSA w/ SHA-256, Curve P-256\n\n   Size of binary file is 98 bytes\n\n   18(\n     [\n       / protected h'a10126' / << {\n           / alg / 1:-7 / ECDSA 256 /\n         } >>,\n       / unprotected / {\n         / kid / 4:'11'\n       },\n       / payload / 'This is the content.',\n       / signature / h'8eb33e4ca31d1c465ab05aac34cc6b23d58fef5c083106c4\n   d25a91aef0b0117e2af9a291aa32e14ab834dc56ed2a223444547e01f11d3b0916e5\n   a4c345cacb36'\n     ]\n   )\n\nC.3.  Examples of Enveloped Messages\n\nC.3.1.  Direct ECDH\n\n   This example uses the following:\n\n   *  CEK: AES-GCM w/ 128-bit key\n\n   *  Recipient class: ECDH Ephemeral-Static, Curve P-256\n\n   Size of binary file is 151 bytes\n\n   96(\n     [\n       / protected h'a10101' / << {\n           / alg / 1:1 / AES-GCM 128 /\n         } >>,\n       / unprotected / {\n         / iv / 5:h'c9cf4df2fe6c632bf7886413'\n       },\n       / ciphertext / h'7adbe2709ca818fb415f1e5df66f4e1a51053ba6d65a1a0\n   c52a357da7a644b8070a151b0',\n       / recipients / [\n         [\n           / protected h'a1013818' / << {\n               / alg / 1:-25 / ECDH-ES + HKDF-256 /\n             } >>,\n           / unprotected / {\n             / ephemeral / -1:{\n               / kty / 1:2,\n               / crv / -1:1,\n               / x / -2:h'98f50a4ff6c05861c8860d13a638ea56c3f5ad7590bbf\n   bf054e1c7b4d91d6280',\n               / y / -3:true\n             },\n             / kid / 4:'meriadoc.brandybuck@buckland.example'\n           },\n           / ciphertext / h''\n         ]\n       ]\n     ]\n   )\n\nC.3.2.  Direct Plus Key Derivation\n\n   This example uses the following:\n\n   *  CEK: AES-CCM w/ 128-bit key, truncate the tag to 64 bits\n\n   *  Recipient class: Use HKDF on a shared secret with the following\n      implicit fields as part of the context.\n\n      -  salt: \"aabbccddeeffgghh\"\n\n      -  PartyU identity: \"lighting-client\"\n\n      -  PartyV identity: \"lighting-server\"\n\n      -  Supplementary Public Other: \"Encryption Example 02\"\n\n   Size of binary file is 91 bytes\n\n   96(\n     [\n       / protected h'a1010a' / << {\n           / alg / 1:10 / AES-CCM-16-64-128 /\n         } >>,\n       / unprotected / {\n         / iv / 5:h'89f52f65a1c580933b5261a76c'\n       },\n       / ciphertext / h'753548a19b1307084ca7b2056924ed95f2e3b17006dfe93\n   1b687b847',\n       / recipients / [\n         [\n           / protected h'a10129' / << {\n               / alg / 1:-10\n             } >>,\n           / unprotected / {\n             / salt / -20:'aabbccddeeffgghh',\n             / kid / 4:'our-secret'\n           },\n           / ciphertext / h''\n         ]\n       ]\n     ]\n   )\n\nC.3.3.  Encrypted Content with External Data\n\n   This example uses the following:\n\n   *  CEK: AES-GCM w/ 128-bit key\n\n   *  Recipient class: ECDH Static-Static, Curve P-256 with AES Key Wrap\n\n   *  Externally Supplied AAD: h'0011bbcc22dd44ee55ff660077'\n\n   Size of binary file is 173 bytes\n\n   96(\n     [\n       / protected h'a10101' / << {\n           / alg / 1:1 / AES-GCM 128 /\n         } >> ,\n       / unprotected / {\n         / iv / 5:h'02d1f7e6f26c43d4868d87ce'\n       },\n       / ciphertext / h'64f84d913ba60a76070a9a48f26e97e863e28529d8f5335\n   e5f0165eee976b4a5f6c6f09d',\n       / recipients / [\n         [\n           / protected / h'a101381f' / {\n               \\ alg \\ 1:-32 \\ ECDH-SS+A128KW \\\n             } / ,\n           / unprotected / {\n             / static kid / -3:'peregrin.took@tuckborough.example',\n             / kid / 4:'meriadoc.brandybuck@buckland.example',\n             / U nonce / -22:h'0101'\n           },\n           / ciphertext / h'41e0d76f579dbd0d936a662d54d8582037de2e366fd\n   e1c62'\n         ]\n       ]\n     ]\n   )\n\nC.4.  Examples of Encrypted Messages\n\nC.4.1.  Simple Encrypted Message\n\n   This example uses the following:\n\n   *  CEK: AES-CCM w/ 128-bit key and a 64-bit tag\n\n   Size of binary file is 52 bytes\n\n   16(\n     [\n       / protected h'a1010a' / << {\n           / alg / 1:10 / AES-CCM-16-64-128 /\n         } >> ,\n       / unprotected / {\n         / iv / 5:h'89f52f65a1c580933b5261a78c'\n       },\n       / ciphertext / h'5974e1b99a3a4cc09a659aa2e9e7fff161d38ce71cb45ce\n   460ffb569'\n     ]\n   )\n\nC.4.2.  Encrypted Message with a Partial IV\n\n   This example uses the following:\n\n   *  CEK: AES-CCM w/ 128-bit key and a 64-bit tag\n\n   *  Prefix for IV is 89F52F65A1C580933B52\n\n   Size of binary file is 41 bytes\n\n   16(\n     [\n       / protected h'a1010a' / << {\n           / alg / 1:10 / AES-CCM-16-64-128 /\n         } >> ,\n       / unprotected / {\n         / partial iv / 6:h'61a7'\n       },\n       / ciphertext / h'252a8911d465c125b6764739700f0141ed09192de139e05\n   3bd09abca'\n     ]\n   )\n\nC.5.  Examples of MACed Messages\n\nC.5.1.  Shared Secret Direct MAC\n\n   This example uses the following:\n\n   *  MAC: AES-CMAC, 256-bit key, truncated to 64 bits\n\n   *  Recipient class: direct shared secret\n\n   Size of binary file is 57 bytes\n\n   97(\n     [\n       / protected h'a1010f' / << {\n           / alg / 1:15 / AES-CBC-MAC-256//64 /\n         } >> ,\n       / unprotected / {},\n       / payload / 'This is the content.',\n       / tag / h'9e1226ba1f81b848',\n       / recipients / [\n         [\n           / protected / h'',\n           / unprotected / {\n             / alg / 1:-6 / direct /,\n             / kid / 4:'our-secret'\n           },\n           / ciphertext / h''\n         ]\n       ]\n     ]\n   )\n\nC.5.2.  ECDH Direct MAC\n\n   This example uses the following:\n\n   *  MAC: HMAC w/SHA-256, 256-bit key\n\n   *  Recipient class: ECDH key agreement, two static keys, HKDF w/\n      context structure\n\n   Size of binary file is 214 bytes\n\n   97(\n     [\n       / protected h'a10105' / << {\n           / alg / 1:5 / HMAC 256//256 /\n         } >> ,\n       / unprotected / {},\n       / payload / 'This is the content.',\n       / tag / h'81a03448acd3d305376eaa11fb3fe416a955be2cbe7ec96f012c99\n   4bc3f16a41',\n       / recipients / [\n         [\n           / protected h'a101381a' / << {\n               / alg / 1:-27 / ECDH-SS + HKDF-256 /\n             } >> ,\n           / unprotected / {\n             / static kid / -3:'peregrin.took@tuckborough.example',\n             / kid / 4:'meriadoc.brandybuck@buckland.example',\n             / U nonce / -22:h'4d8553e7e74f3c6a3a9dd3ef286a8195cbf8a23d\n   19558ccfec7d34b824f42d92bd06bd2c7f0271f0214e141fb779ae2856abf585a583\n   68b017e7f2a9e5ce4db5'\n           },\n           / ciphertext / h''\n         ]\n       ]\n     ]\n   )\n\nC.5.3.  Wrapped MAC\n\n   This example uses the following:\n\n   *  MAC: AES-MAC, 128-bit key, truncated to 64 bits\n\n   *  Recipient class: AES Key Wrap w/ a preshared 256-bit key\n\n   Size of binary file is 109 bytes\n\n   97(\n     [\n       / protected h'a1010e' / << {\n           / alg / 1:14 / AES-CBC-MAC-128//64 /\n         } >> ,\n       / unprotected / {},\n       / payload / 'This is the content.',\n       / tag / h'36f5afaf0bab5d43',\n       / recipients / [\n         [\n           / protected / h'',\n           / unprotected / {\n             / alg / 1:-5 / A256KW /,\n             / kid / 4:'018c0ae5-4d9b-471b-bfd6-eef314bc7037'\n           },\n           / ciphertext / h'711ab0dc2fc4585dce27effa6781c8093eba906f227\n   b6eb0'\n         ]\n       ]\n     ]\n   )\n\nC.5.4.  Multi-Recipient MACed Message\n\n   This example uses the following:\n\n   *  MAC: HMAC w/ SHA-256, 128-bit key\n\n   *  Recipient class: Uses two different methods.\n\n      1.  ECDH Ephemeral-Static, Curve P-521, AES Key Wrap w/ 128-bit\n          key\n\n      2.  AES Key Wrap w/ 256-bit key\n\n   Size of binary file is 309 bytes\n\n   97(\n     [\n       / protected h'a10105' / << {\n           / alg / 1:5 / HMAC 256//256 /\n         } >> ,\n       / unprotected / {},\n       / payload / 'This is the content.',\n       / tag / h'bf48235e809b5c42e995f2b7d5fa13620e7ed834e337f6aa43df16\n   1e49e9323e',\n       / recipients / [\n         [\n           / protected h'a101381c' / << {\n               / alg / 1:-29 / ECDH-ES+A128KW /\n             } >> ,\n           / unprotected / {\n             / ephemeral / -1:{\n               / kty / 1:2,\n               / crv / -1:3,\n               / x / -2:h'0043b12669acac3fd27898ffba0bcd2e6c366d53bc4db\n   71f909a759304acfb5e18cdc7ba0b13ff8c7636271a6924b1ac63c02688075b55ef2\n   d613574e7dc242f79c3',\n               / y / -3:true\n             },\n             / kid / 4:'bilbo.baggins@hobbiton.example'\n           },\n           / ciphertext / h'339bc4f79984cdc6b3e6ce5f315a4c7d2b0ac466fce\n   a69e8c07dfbca5bb1f661bc5f8e0df9e3eff5'\n         ],\n         [\n           / protected / h'',\n           / unprotected / {\n             / alg / 1:-5 / A256KW /,\n             / kid / 4:'018c0ae5-4d9b-471b-bfd6-eef314bc7037'\n           },\n           / ciphertext / h'0b2c7cfce04e98276342d6476a7723c090dfdd15f9a\n   518e7736549e998370695e6d6a83b4ae507bb'\n         ]\n       ]\n     ]\n   )\n\nC.6.  Examples of MAC0 Messages\n\nC.6.1.  Shared-Secret Direct MAC\n\n   This example uses the following:\n\n   *  MAC: AES-CMAC, 256-bit key, truncated to 64 bits\n\n   *  Recipient class: direct shared secret\n\n   Size of binary file is 37 bytes\n\n   17(\n     [\n       / protected h'a1010f' / << {\n           / alg / 1:15 / AES-CBC-MAC-256//64 /\n         } >> ,\n       / unprotected / {},\n       / payload / 'This is the content.',\n       / tag / h'726043745027214f'\n     ]\n   )\n\n   Note that this example uses the same inputs as Appendix C.5.1.\n\nC.7.  COSE Keys\n\nC.7.1.  Public Keys\n\n   This is an example of a COSE Key Set.  This example includes the\n   public keys for all of the previous examples.\n\n   In order, the keys are:\n\n   *  An EC key with a kid of \"meriadoc.brandybuck@buckland.example\"\n\n   *  An EC key with a kid of \"11\"\n\n   *  An EC key with a kid of \"bilbo.baggins@hobbiton.example\"\n\n   *  An EC key with a kid of \"peregrin.took@tuckborough.example\"\n\n   Size of binary file is 481 bytes\n\n   [\n     {\n       -1:1,\n       -2:h'65eda5a12577c2bae829437fe338701a10aaa375e1bb5b5de108de439c0\n   8551d',\n       -3:h'1e52ed75701163f7f9e40ddf9f341b3dc9ba860af7e0ca7ca7e9eecd008\n   4d19c',\n       1:2,\n       2:'meriadoc.brandybuck@buckland.example'\n     },\n     {\n       -1:1,\n       -2:h'bac5b11cad8f99f9c72b05cf4b9e26d244dc189f745228255a219a86d6a\n   09eff',\n       -3:h'20138bf82dc1b6d562be0fa54ab7804a3a64b6d72ccfed6b6fb6ed28bbf\n   c117e',\n       1:2,\n       2:'11'\n     },\n     {\n       -1:3,\n       -2:h'0072992cb3ac08ecf3e5c63dedec0d51a8c1f79ef2f82f94f3c737bf5de\n   7986671eac625fe8257bbd0394644caaa3aaf8f27a4585fbbcad0f2457620085e5c8\n   f42ad',\n       -3:h'01dca6947bce88bc5790485ac97427342bc35f887d86d65a089377e247e\n   60baa55e4e8501e2ada5724ac51d6909008033ebc10ac999b9d7f5cc2519f3fe1ea1\n   d9475',\n       1:2,\n       2:'bilbo.baggins@hobbiton.example'\n     },\n     {\n       -1:1,\n       -2:h'98f50a4ff6c05861c8860d13a638ea56c3f5ad7590bbfbf054e1c7b4d91\n   d6280',\n       -3:h'f01400b089867804b8e9fc96c3932161f1934f4223069170d924b7e03bf\n   822bb',\n       1:2,\n       2:'peregrin.took@tuckborough.example'\n     }\n   ]\n\nC.7.2.  Private Keys\n\n   This is an example of a COSE Key Set.  This example includes the\n   private keys for all of the previous examples.\n\n   In order the keys are:\n\n   *  An EC key with a kid of \"meriadoc.brandybuck@buckland.example\"\n\n   *  An EC key with a kid of \"11\"\n\n   *  An EC key with a kid of \"bilbo.baggins@hobbiton.example\"\n\n   *  A shared-secret key with a kid of \"our-secret\"\n\n   *  An EC key with a kid of \"peregrin.took@tuckborough.example\"\n\n   *  A shared-secret key with kid \"our-secret2\"\n\n   *  A shared-secret key with a kid of \"018c0ae5-4d9b-471b-\n      bfd6-eef314bc7037\"\n\n   Size of binary file is 816 bytes\n\n   [\n     {\n       1:2,\n       2:'meriadoc.brandybuck@buckland.example',\n       -1:1,\n       -2:h'65eda5a12577c2bae829437fe338701a10aaa375e1bb5b5de108de439c0\n   8551d',\n       -3:h'1e52ed75701163f7f9e40ddf9f341b3dc9ba860af7e0ca7ca7e9eecd008\n   4d19c',\n       -4:h'aff907c99f9ad3aae6c4cdf21122bce2bd68b5283e6907154ad911840fa\n   208cf'\n     },\n     {\n       1:2,\n       2:'11',\n       -1:1,\n       -2:h'bac5b11cad8f99f9c72b05cf4b9e26d244dc189f745228255a219a86d6a\n   09eff',\n       -3:h'20138bf82dc1b6d562be0fa54ab7804a3a64b6d72ccfed6b6fb6ed28bbf\n   c117e',\n       -4:h'57c92077664146e876760c9520d054aa93c3afb04e306705db609030850\n   7b4d3'\n     },\n     {\n       1:2,\n       2:'bilbo.baggins@hobbiton.example',\n       -1:3,\n       -2:h'0072992cb3ac08ecf3e5c63dedec0d51a8c1f79ef2f82f94f3c737bf5de\n   7986671eac625fe8257bbd0394644caaa3aaf8f27a4585fbbcad0f2457620085e5c8\n   f42ad',\n       -3:h'01dca6947bce88bc5790485ac97427342bc35f887d86d65a089377e247e\n   60baa55e4e8501e2ada5724ac51d6909008033ebc10ac999b9d7f5cc2519f3fe1ea1\n   d9475',\n       -4:h'00085138ddabf5ca975f5860f91a08e91d6d5f9a76ad4018766a476680b\n   55cd339e8ab6c72b5facdb2a2a50ac25bd086647dd3e2e6e99e84ca2c3609fdf177f\n   eb26d'\n     },\n     {\n       1:4,\n       2:'our-secret',\n       -1:h'849b57219dae48de646d07dbb533566e976686457c1491be3a76dcea6c4\n   27188'\n     },\n     {\n       1:2,\n       -1:1,\n       2:'peregrin.took@tuckborough.example',\n       -2:h'98f50a4ff6c05861c8860d13a638ea56c3f5ad7590bbfbf054e1c7b4d91\n   d6280',\n       -3:h'f01400b089867804b8e9fc96c3932161f1934f4223069170d924b7e03bf\n   822bb',\n       -4:h'02d1f7e6f26c43d4868d87ceb2353161740aacf1f7163647984b522a848\n   df1c3'\n     },\n     {\n       1:4,\n       2:'our-secret2',\n       -1:h'849b5786457c1491be3a76dcea6c4271'\n     },\n     {\n       1:4,\n       2:'018c0ae5-4d9b-471b-bfd6-eef314bc7037',\n       -1:h'849b57219dae48de646d07dbb533566e976686457c1491be3a76dcea6c4\n   27188'\n     }\n   ]\n\nAcknowledgments\n\n   This document is a product of the COSE Working Group of the IETF.\n\n   The following individuals are to blame for getting me started on this\n   project in the first place: Richard Barnes, Matt Miller, and Martin\n   Thomson.\n\n   The initial draft version of the specification was based to some\n   degree on the outputs of the JOSE and S/MIME Working Groups.\n\n   The following individuals provided input into the final form of the\n   document: Carsten Bormann, John Bradley, Brian Campbell, Michael\n   B. Jones, Ilari Liusvaara, Francesca Palombini, Ludwig Seitz, and\n   Göran Selander.\n\nAuthor's Address\n\n   Jim Schaad\n   August Cellars\n"
  full_text_normalized: "\uFEFF internet engineering task force (ietf) j. schaad request for comments: 9052 august cellars std: 96 august 2022 obsoletes: 8152 category: standards track issn: 2070-1721 cbor object signing and encryption (cose): structures and process abstract concise binary object representation (cbor) is a data format designed for small code size and small message size. there is a need to be able to define basic security services for this data format. this document defines the cbor object signing and encryption (cose) protocol. this specification describes how to create and process signatures, message authentication codes, and encryption using cbor for serialization. this specification additionally describes how to represent cryptographic keys using cbor. this document, along with rfc 9053, obsoletes rfc 8152. status of this memo this is an internet standards track document. this document is a product of the internet engineering task force (ietf). it represents the consensus of the ietf community. it has received public review and has been approved for publication by the internet engineering steering group (iesg). further information on internet standards is available in section 2 of rfc 7841. information about the current status of this document, any errata, and how to provide feedback on it may be obtained at https://www.rfc-editor.org/info/rfc9052. copyright notice copyright (c) 2022 ietf trust and the persons identified as the document authors. all rights reserved. this document is subject to bcp 78 and the ietf trust's legal provisions relating to ietf documents (https://trustee.ietf.org/license-info) in effect on the date of publication of this document. please review these documents carefully, as they describe your rights and restrictions with respect to this document. code components extracted from this document must include revised bsd license text as described in section 4.e of the trust legal provisions and are provided without warranty as described in the revised bsd license. table of contents 1. introduction 1.1. requirements terminology 1.2. changes from rfc 8152 1.3. design changes from jose 1.4. cddl grammar for cbor data structures 1.5. cbor-related terminology 1.6. document terminology 2. basic cose structure 3. header parameters 3.1. common cose header parameters 4. signing objects 4.1. signing with one or more signers 4.2. signing with one signer 4.3. externally supplied data 4.4. signing and verification process 5. encryption objects 5.1. enveloped cose structure 5.1.1. content key distribution methods 5.2. single recipient encrypted 5.3. how to encrypt and decrypt for aead algorithms 5.4. how to encrypt and decrypt for ae algorithms 6. mac objects 6.1. maced message with recipients 6.2. maced messages with implicit key 6.3. how to compute and verify a mac 7. key objects 7.1. cose key common parameters 8. taxonomy of algorithms used by cose 8.1. signature algorithms 8.2. message authentication code (mac) algorithms 8.3. content encryption algorithms 8.4. key derivation functions (kdfs) 8.5. content key distribution methods 8.5.1. direct encryption 8.5.2. key wrap 8.5.3. key transport 8.5.4. direct key agreement 8.5.5. key agreement with key wrap 9. cbor encoding restrictions 10. application profiling considerations 11. iana considerations 11.1. cose header parameters registry 11.2. cose key common parameters registry 11.3. media type registrations 11.3.1. cose security message 11.3.2. cose key media type 11.4. coap content-formats registry 11.5. cbor tags registry 11.6. expert review instructions 12. security considerations 13. references 13.1. normative references 13.2. informative references appendix a. guidelines for external data authentication of algorithms appendix b. two layers of recipient information appendix c. examples c.1. examples of signed messages c.1.1. single signature c.1.2. multiple signers c.1.3. signature with criticality c.2. single signer examples c.2.1. single ecdsa signature c.3. examples of enveloped messages c.3.1. direct ecdh c.3.2. direct plus key derivation c.3.3. encrypted content with external data c.4. examples of encrypted messages c.4.1. simple encrypted message c.4.2. encrypted message with a partial iv c.5. examples of maced messages c.5.1. shared secret direct mac c.5.2. ecdh direct mac c.5.3. wrapped mac c.5.4. multi-recipient maced message c.6. examples of mac0 messages c.6.1. shared-secret direct mac c.7. cose keys c.7.1. public keys c.7.2. private keys acknowledgments author's address 1. introduction there has been an increased focus on small, constrained devices that make up the internet of things (iot). one of the standards that has come out of this process is \"concise binary object representation (cbor)\" [std94]. cbor extended the data model of javascript object notation (json) [std90] by allowing for binary data, among other changes. cbor has been adopted by several of the ietf working groups dealing with the iot world as their method of encoding data structures. cbor was designed specifically to be small in terms of both messages transported and implementation size and to have a schema-free decoder. a need exists to provide message security services for iot, and using cbor as the message-encoding format makes sense. the jose working group produced a set of documents [rfc7515] [rfc7516] [rfc7517] [rfc7518] that specified how to process encryption, signatures, and message authentication code (mac) operations and how to encode keys using json. this document defines the cbor object signing and encryption (cose) standard, which does the same thing for the cbor encoding format. this document is combined with [rfc9053], which provides an initial set of algorithms. while there is a strong attempt to keep the flavor of the original json object signing and encryption (jose) documents, two considerations are taken into account: * cbor has capabilities that are not present in json and are appropriate to use. one example of this is the fact that cbor has a method of encoding binary data directly without first converting it into a base64-encoded text string. * cose is not a direct copy of the jose specification. in the process of creating cose, decisions that were made for jose were re-examined. in many cases, different results were decided on, as the criteria were not always the same. this document contains: * the description of the structure for the cbor objects that are transmitted over the wire. two objects each are defined for encryption, signing, and message authentication. one object is defined for transporting keys and one for transporting groups of keys. * the procedures used to build the inputs to the cryptographic functions required for each of the structures. * a set of attributes that apply to the different security objects. this document does not contain the rules and procedures for using specific cryptographic algorithms. details on specific algorithms can be found in [rfc9053] and [rfc8230]. details for additional algorithms are expected to be defined in future documents. cose was initially designed as part of a solution to provide security to constrained restful environments (core), and this is done using [rfc8613] and [core-groupcomm]. however, cose is not restricted to just these cases and can be used in any place where one would consider either jose or cryptographic message syntax (cms) [rfc5652] for the purpose of providing security services. cose, like jose and cms, is only for use in store-and-forward or offline protocols. the use of cose in online protocols needing encryption requires that an online key establishment process be done before sending objects back and forth. any application that uses cose for security services first needs to determine what security services are required and then select the appropriate cose structures and cryptographic algorithms based on those needs. section 10 provides additional information on what applications need to specify when using cose. one feature that is present in cms that is not present in this standard is a digest structure. this omission is deliberate. it is better for the structure to be defined in each protocol as different protocols will want to include a different set of fields as part of the structure. while an algorithm identifier and the digest value are going to be common to all applications, the two values may not always be adjacent, as the algorithm could be defined once with multiple values. applications may additionally want to define additional data fields as part of the structure. one such application-specific element would be to include a uri or other pointer to where the data that is being hashed can be obtained. [rfc9054] contains one such possible structure and defines a set of digest algorithms. during the process of advancing cose to internet standard, it was noticed that the description of the security properties of countersignatures was incorrect for the cose_sign1 structure. since the security properties that were described -- those of a true countersignature -- were those that the working group desired, the decision was made to remove all of the countersignature text from this document and create a new document [cose-countersign] to both deprecate the old countersignature algorithm and header parameters and define a new algorithm and header parameters with the desired security properties. 1.1. requirements terminology the key words \"must\", \"must not\", \"required\", \"shall\", \"shall not\", \"should\", \"should not\", \"recommended\", \"not recommended\", \"may\", and \"optional\" in this document are to be interpreted as described in bcp 14 [rfc2119] [rfc8174] when, and only when, they appear in all capitals, as shown here. 1.2. changes from rfc 8152 * split the original document into this document and [rfc9053]. * added some text describing why there is no digest structure defined by cose. * made text clarifications and changes in terminology. * removed all of the details relating to countersignatures and placed them in [cose-countersign]. 1.3. design changes from jose * a single overall message structure has been defined so that encrypted, signed, and maced messages can easily be identified and still have a consistent view. * signed messages distinguish between the protected and unprotected header parameters that relate to the content and those that relate to the signature. * maced messages are separated from signed messages. * maced messages have the ability to use the same set of recipient algorithms as enveloped messages for obtaining the mac authentication key. * binary encodings are used, rather than base64url encodings, to encode binary data. * the authentication tag for encryption algorithms has been combined with the ciphertext. * the set of cryptographic algorithms has been expanded in some directions and trimmed in others. 1.4. cddl grammar for cbor data structures when cose was originally written, the concise data definition language (cddl) [rfc8610] had not yet been published in an rfc, so it could not be used as the data description language to normatively describe the cbor data structures employed by cose. for that reason, the cbor data objects defined here are described in prose. additional (non-normative) descriptions of the cose data objects are provided in a subset of cddl, described below. this document was developed by first working on the grammar and then developing the prose to go with it. an artifact of this is that the prose was written using the primitive-type strings defined by concise data definition language (cddl) [rfc8610]. in this specification, the following primitive types are used: any: a nonspecific value that permits all cbor values to be placed here. bool: a boolean value (true: major type 7, value 21; false: major type 7, value 20). bstr: byte string (major type 2). int: an unsigned integer or a negative integer. nil: a null value (major type 7, value 22). nint: a negative integer (major type 1). tstr: a utf-8 text string (major type 3). uint: an unsigned integer (major type 0). three syntaxes from cddl appear in this document as shorthand. these are: foo / bar: indicates that either foo or bar can appear here. [+ foo]: indicates that the type foo appears one or more times in an array. * foo: indicates that the type foo appears zero or more times. two of the constraints defined by cddl are also used in this document. these are: type1 .cbor type2: indicates that the contents of type1, usually bstr, contains a value of type2. type1 .size integer: indicates that the contents of type1 is integer bytes long. as well as the prose description, a grammar for the cbor data structures is presented in the subset of cddl described previously. the cddl grammar is informational; the prose description is normative. the collected cddl can be extracted from the xml version of this document via the xpath expression below. (depending on the xpath evaluator one is using, it may be necessary to deal with &gt; as an entity.) //sourcecode[@type='cddl']/text() cddl expects the initial nonterminal symbol to be the first symbol in the file. for this reason, the first fragment of cddl is presented here. start = cose_messages / cose_key / cose_keyset / internal_types ; this is defined to make the tool quieter: internal_types = sig_structure / enc_structure / mac_structure the nonterminal internal_types is defined for dealing with the automated validation tools used during the writing of this document. it references those nonterminals that are used for security computations but are not emitted for transport. 1.5. cbor-related terminology in json, maps are called objects and only have one kind of map key: a text string. in cose, we use text strings, negative integers, and unsigned integers as map keys. the integers are used for compactness of encoding and easy comparison. the inclusion of text strings allows for an additional range of short encoded values to be used as well. since the word \"key\" is mainly used in its other meaning, as a cryptographic key, we use the term \"label\" for this usage as a map key. in a cbor map defined by this specification, the presence a label that is neither a text string nor an integer is an error. applications can either fail processing or process messages by ignoring incorrect labels; however, they must not create messages with incorrect labels. a cddl grammar fragment defines the nonterminal \"label\", as in the previous paragraph, and \"values\", which permits any value to be used. label = int / tstr values = any 1.6. document terminology in this document, we use the following terminology: byte: a synonym for octet. constrained application protocol (coap): a specialized web transfer protocol for use in constrained systems. it is defined in [rfc7252]. authenticated encryption (ae) algorithms [rfc5116]: encryption algorithms that provide an authentication check of the contents along with the encryption service. an example of an ae algorithm used in cose is aes key wrap [rfc3394]. these algorithms are used for key encryption, but authenticated encryption with associated data (aead) algorithms would be preferred. aead algorithms [rfc5116]: encryption algorithms that provide the same authentication service of the content as ae algorithms do, and also allow associated data that is not part of the encrypted body to be included in the authentication service. an example of an aead algorithm used in cose is aes-gcm [rfc5116]. these algorithms are used for content encryption and can be used for key encryption as well. \"context\" is used throughout the document to represent information that is not part of the cose message. information that is part of the context can come from several different sources, including protocol interactions, associated key structures, and program configuration. the context to use can be implicit, identified using the \"kid context\" header parameter defined in [rfc8613], or identified by a protocol-specific identifier. context should generally be included in the cryptographic construction; for more details, see section 4.3. the term \"byte string\" is used for sequences of bytes, while the term \"text string\" is used for sequences of characters. 2. basic cose structure the cose object structure is designed so that there can be a large amount of common code when parsing and processing the different types of security messages. all of the message structures are built on the cbor array type. the first three elements of the array always contain the same information: 1. the protected header parameters, encoded and wrapped in a bstr. 2. the unprotected header parameters as a map. 3. the content of the message. the content is either the plaintext or the ciphertext, as appropriate. the content may be detached (i.e., transported separately from the cose structure), but the location is still used. the content is wrapped in a bstr when present and is a nil value when detached. elements after this point are dependent on the specific message type. cose messages are built using the concept of layers to separate different types of cryptographic concepts. as an example of how this works, consider the cose_encrypt message (section 5.1). this message type is broken into two layers: the content layer and the recipient layer. the content layer contains the encrypted plaintext and information about the encrypted message. the recipient layer contains the encrypted content encryption key (cek) and information about how it is encrypted, for each recipient. a single-layer version of the encryption message cose_encrypt0 (section 5.2) is provided for cases where the cek is preshared. identification of which type of message has been presented is done by the following methods: 1. the specific message type is known from the context. this may be defined by a marker in the containing structure or by restrictions specified by the application protocol. 2. the message type is identified by a cbor tag. messages with a cbor tag are known in this specification as tagged messages, while those without the cbor tag are known as untagged messages. this document defines a cbor tag for each of the message structures. these tags can be found in table 1. 3. when a cose object is carried in a media type of \"application/ cose\", the optional parameter \"cose-type\" can be used to identify the embedded object. the parameter is optional if the tagged version of the structure is used. the parameter is required if the untagged version of the structure is used. the value to use with the parameter for each of the structures can be found in table 1. 4. when a cose object is carried as a coap payload, the coap content-format option can be used to identify the message content. the coap content-format values can be found in table 2. the cbor tag for the message structure is not required, as each security message is uniquely identified. +==========+===============+===============+=======================+ | cbor tag | cose-type | data item | semantics | +==========+===============+===============+=======================+ | 98 | cose-sign | cose_sign | cose signed data | | | | | object | +----------+---------------+---------------+-----------------------+ | 18 | cose-sign1 | cose_sign1 | cose single signer | | | | | data object | +----------+---------------+---------------+-----------------------+ | 96 | cose-encrypt | cose_encrypt | cose encrypted data | | | | | object | +----------+---------------+---------------+-----------------------+ | 16 | cose-encrypt0 | cose_encrypt0 | cose single recipient | | | | | encrypted data object | +----------+---------------+---------------+-----------------------+ | 97 | cose-mac | cose_mac | cose maced data | | | | | object | +----------+---------------+---------------+-----------------------+ | 17 | cose-mac0 | cose_mac0 | cose mac w/o | | | | | recipients object | +----------+---------------+---------------+-----------------------+ table 1: cose message identification +===========================+==========+=====+===========+ | media type | encoding | id | reference | +===========================+==========+=====+===========+ | application/cose; cose- | | 98 | rfc 9052 | | type=\"cose-sign\" | | | | +---------------------------+----------+-----+-----------+ | application/cose; cose- | | 18 | rfc 9052 | | type=\"cose-sign1\" | | | | +---------------------------+----------+-----+-----------+ | application/cose; cose- | | 96 | rfc 9052 | | type=\"cose-encrypt\" | | | | +---------------------------+----------+-----+-----------+ | application/cose; cose- | | 16 | rfc 9052 | | type=\"cose-encrypt0\" | | | | +---------------------------+----------+-----+-----------+ | application/cose; cose- | | 97 | rfc 9052 | | type=\"cose-mac\" | | | | +---------------------------+----------+-----+-----------+ | application/cose; cose- | | 17 | rfc 9052 | | type=\"cose-mac0\" | | | | +---------------------------+----------+-----+-----------+ | application/cose-key | | 101 | rfc 9052 | +---------------------------+----------+-----+-----------+ | application/cose-key-set | | 102 | rfc 9052 | +---------------------------+----------+-----+-----------+ table 2: coap content-formats for cose the following cddl fragment identifies all of the top messages defined in this document. separate nonterminals are defined for the tagged and untagged versions of the messages. cose_messages = cose_untagged_message / cose_tagged_message cose_untagged_message = cose_sign / cose_sign1 / cose_encrypt / cose_encrypt0 / cose_mac / cose_mac0 cose_tagged_message = cose_sign_tagged / cose_sign1_tagged / cose_encrypt_tagged / cose_encrypt0_tagged / cose_mac_tagged / cose_mac0_tagged 3. header parameters the structure of cose has been designed to have two buckets of information that are not considered to be part of the payload itself, but are used for holding information about content, algorithms, keys, or evaluation hints for the processing of the layer. these two buckets are available for use in all of the structures except for keys. while these buckets are present, they may not always be usable in all instances. for example, while the protected bucket is defined as part of the recipient structure, some of the algorithms used for recipient structures do not provide for authenticated data. if this is the case, the protected bucket is left empty. both buckets are implemented as cbor maps. the map key is a \"label\" (section 1.5). the value portion is dependent on the definition for the label. both maps use the same set of label/value pairs. the integer and text-string values for labels have been divided into several sections, including a standard range, a private use range, and a range that is dependent on the algorithm selected. the defined labels can be found in the \"cose header parameters\" iana registry (section 11.1). the two buckets are: protected: contains parameters about the current layer that are cryptographically protected. this bucket must be empty if it is not going to be included in a cryptographic computation. this bucket is encoded in the message as a binary object. this value is obtained by cbor encoding the protected map and wrapping it in a bstr object. senders should encode a zero-length map as a zero- length byte string rather than as a zero-length map (encoded as h'a0'). the zero-length byte string encoding is preferred, because it is both shorter and the version used in the serialization structures for cryptographic computation. recipients must accept both a zero-length byte string and a zero- length map encoded in a byte string. wrapping the encoding with a byte string allows the protected map to be transported with a greater chance that it will not be altered accidentally in transit. (badly behaved intermediates could decode and re-encode, but this will result in a failure to verify unless the re-encoded byte string is identical to the decoded byte string.) this avoids the problem of all parties needing to be able to do a common canonical encoding of the map for input to cryptographic operations. unprotected: contains parameters about the current layer that are not cryptographically protected. only header parameters that deal with the current layer are to be placed at that layer. as an example of this, the header parameter \"content type\" describes the content of the message being carried in the message. as such, this header parameter is placed only in the content layer and is not placed in the recipient or signature layers. in principle, one should be able to process any given layer without reference to any other layer. with the exception of the cose_sign structure, the only data that needs to cross layers is the cryptographic key. the buckets are present in all of the security objects defined in this document. the fields, in order, are the \"protected\" bucket (as a cbor \"bstr\" type) and then the \"unprotected\" bucket (as a cbor \"map\" type). the presence of both buckets is required. the header parameters that go into the buckets come from the iana \"cose header parameters\" registry (section 11.1). some header parameters are defined in the next section. labels in each of the maps must be unique. when processing messages, if a label appears multiple times, the message must be rejected as malformed. applications should verify that the same label does not occur in both the protected and unprotected header parameters. if the message is not rejected as malformed, attributes must be obtained from the protected bucket, and only if an attribute is not found in the protected bucket can that attribute be obtained from the unprotected bucket. the following cddl fragment represents the two header-parameter buckets. a group \"headers\" is defined in cddl that represents the two buckets in which attributes are placed. this group is used to provide these two fields consistently in all locations. a type is also defined that represents the map of common header parameters. headers = ( protected : empty_or_serialized_map, unprotected : header_map ) header_map = { generic_headers, * label => values } empty_or_serialized_map = bstr .cbor header_map / bstr .size 0 3.1. common cose header parameters this section defines a set of common header parameters. a summary of these header parameters can be found in table 3. this table should be consulted to determine the value of the label and the type of the value. the set of header parameters defined in this section is as follows: alg: this header parameter is used to indicate the algorithm used for the security processing. this header parameter must be authenticated where the ability to do so exists. this support is provided by aead algorithms or construction (e.g., cose_sign and cose_mac0). this authentication can be done either by placing the header parameter in the protected-header-parameters bucket or as part of the externally supplied data (section 4.3). the value is taken from the \"cose algorithms\" registry (see [cose.algorithms]). crit: this header parameter is used to indicate which protected header parameters an application that is processing a message is required to understand. header parameters defined in this document do not need to be included, as they should be understood by all implementations. additionally, the header parameter \"counter signature\" (label 7) defined by [rfc8152] must be understood by new implementations, to remain compatible with senders that adhere to that document and assume all implementations will understand it. when present, the \"crit\" header parameter must be placed in the protected-header-parameters bucket. the array must have at least one value in it. not all header-parameter labels need to be included in the \"crit\" header parameter. the rules for deciding which header parameters are placed in the array are: * integer labels in the range of 0 to 7 should be omitted. * integer labels in the range -1 to -128 can be omitted. algorithms can assign labels in this range where the ability to process the content of the label is considered to be core to implementing the algorithm. algorithms can assign labels outside of this range and include them in the \"crit\" header parameter when the ability to process the content of the label is not considered to be core functionality of the algorithm but does need to be understood to correctly process this instance. integer labels in the range -129 to -65536 should be included, as these would be less common header parameters that might not be generally supported. * labels for header parameters required for an application may be omitted. applications should have a statement declaring whether or not the label can be omitted. the header parameters indicated by \"crit\" can be processed by either the security-library code or an application using a security library; the only requirement is that the header parameter is processed. if the \"crit\" value list includes a label for which the header parameter is not in the protected-header- parameters bucket, this is a fatal error in processing the message. content type: this header parameter is used to indicate the content type of the data in the \"payload\" or \"ciphertext\" field. integers are from the \"coap content-formats\" iana registry table [coap.formats]. text values follow the syntax of \"<type- name>/<subtype-name>\", where <type-name> and <subtype-name> are defined in section 4.2 of [rfc6838]. leading and trailing whitespace is not permitted. textual content type values, along with parameters and subparameters, can be located using the iana \"media types\" registry. applications should provide this header parameter if the content structure is potentially ambiguous. kid: this header parameter identifies one piece of data that can be used as input to find the needed cryptographic key. the value of this header parameter can be matched against the \"kid\" member in a cose_key structure. other methods of key distribution can define an equivalent field to be matched. applications must not assume that \"kid\" values are unique. there may be more than one key with the same \"kid\" value, so all of the keys associated with this \"kid\" may need to be checked. the internal structure of \"kid\" values is not defined and cannot be relied on by applications. key identifier values are hints about which key to use. this is not a security-critical field. for this reason, it can be placed in the unprotected-header-parameters bucket. iv: this header parameter holds the initialization vector (iv) value. for some symmetric encryption algorithms, this may be referred to as a nonce. the iv can be placed in the unprotected bucket, since for ae and aead algorithms, modifying the iv will cause the decryption to fail. partial iv: this header parameter holds a part of the iv value. when using the cose_encrypt0 structure, a portion of the iv can be part of the context associated with the key (context iv), while a portion can be changed with each message (partial iv). this field is used to carry a value that causes the iv to be changed for each message. the partial iv can be placed in the unprotected bucket, as modifying the value will cause the decryption to yield plaintext that is readily detectable as garbled. the \"initialization vector\" and \"partial initialization vector\" header parameters must not both be present in the same security layer. the message iv is generated by the following steps: 1. left-pad the partial iv with zeros to the length of iv (determined by the algorithm). 2. xor the padded partial iv with the context iv. +=========+=======+========+=====================+==================+ | name | label | value | value registry | description | | | | type | | | +=========+=======+========+=====================+==================+ | alg | 1 | int / | cose algorithms | cryptographic | | | | tstr | registry | algorithm to use | +---------+-------+--------+---------------------+------------------+ | crit | 2 | [+ | cose header | critical header | | | | label] | parameters | parameters to be | | | | | registry | understood | +---------+-------+--------+---------------------+------------------+ | content | 3 | tstr / | coap content- | content type of | | type | | uint | formats or media | the payload | | | | | types registries | | +---------+-------+--------+---------------------+------------------+ | kid | 4 | bstr | | key identifier | +---------+-------+--------+---------------------+------------------+ | iv | 5 | bstr | | full | | | | | | initialization | | | | | | vector | +---------+-------+--------+---------------------+------------------+ | partial | 6 | bstr | | partial | | iv | | | | initialization | | | | | | vector | +---------+-------+--------+---------------------+------------------+ table 3: common header parameters the cddl fragment that represents the set of header parameters defined in this section is given below. each of the header parameters is tagged as optional, because they do not need to be in every map; header parameters required in specific maps are discussed above. generic_headers = ( ? 1 => int / tstr, ; algorithm identifier ? 2 => [+label], ; criticality ? 3 => tstr / int, ; content type ? 4 => bstr, ; key identifier ? ( 5 => bstr // ; iv 6 => bstr ) ; partial iv ) 4. signing objects cose supports two different signature structures. cose_sign allows for one or more signatures to be applied to the same content. cose_sign1 is restricted to a single signer. the structures cannot be converted between each other; as the signature computation includes a parameter identifying which structure is being used, the converted structure will fail signature validation. 4.1. signing with one or more signers the cose_sign structure allows for one or more signatures to be applied to a message payload. header parameters relating to the content and header parameters relating to the signature are carried along with the signature itself. these header parameters may be authenticated by the signature, or just be present. an example of a header parameter about the content is the content type header parameter. an example of a header parameter about the signature would be the algorithm and key used to create the signature. [rfc5652] indicates that: | when more than one signature is present, the successful validation | of one signature associated with a given signer is usually treated | as a successful signature by that signer. however, there are some | application environments where other rules are needed. an | application that employs a rule other than one valid signature for | each signer must specify those rules. also, where simple matching | of the signer identifier is not sufficient to determine whether | the signatures were generated by the same signer, the application | specification must describe how to determine which signatures were | generated by the same signer. support of different communities of | recipients is the primary reason that signers choose to include | more than one signature. for example, the cose_sign structure might include signatures generated with the edwards-curve digital signature algorithm (eddsa) [rfc8032] and the elliptic curve digital signature algorithm (ecdsa) [dss]. this allows recipients to verify the signature associated with one algorithm or the other. more detailed information on multiple signature evaluations can be found in [rfc5752]. the signature structure can be encoded as either tagged or untagged, depending on the context it will be used in. a tagged cose_sign structure is identified by the cbor tag 98. the cddl fragment that represents this is: cose_sign_tagged = #6.98(cose_sign) a cose signed message is defined in two parts. the cbor object that carries the body and information about the message is called the cose_sign structure. the cbor object that carries the signature and information about the signature is called the cose_signature structure. examples of cose signed messages can be found in appendix c.1. the cose_sign structure is a cbor array. the fields of the array, in order, are: protected: this is as described in section 3. unprotected: this is as described in section 3. payload: this field contains the serialized content to be signed. if the payload is not present in the message, the application is required to supply the payload separately. the payload is wrapped in a bstr to ensure that it is transported without changes. if the payload is transported separately (\"detached content\"), then a nil cbor object is placed in this location, and it is the responsibility of the application to ensure that it will be transported without changes. note: when a signature with a message recovery algorithm is used (section 8.1), the maximum number of bytes that can be recovered is the length of the original payload. the size of the encoded payload is reduced by the number of bytes that will be recovered. if all of the bytes of the original payload are consumed, then the transmitted payload is encoded as a zero-length byte string rather than as being absent. signatures: this field is an array of signatures. each signature is represented as a cose_signature structure. the cddl fragment that represents the above text for cose_sign follows. cose_sign = [ headers, payload : bstr / nil, signatures : [+ cose_signature] ] the cose_signature structure is a cbor array. the fields of the array, in order, are: protected: this is as described in section 3. unprotected: this is as described in section 3. signature: this field contains the computed signature value. the type of the field is a bstr. algorithms must specify padding if the signature value is not a multiple of 8 bits. the cddl fragment that represents the above text for cose_signature follows. cose_signature = [ headers, signature : bstr ] 4.2. signing with one signer the cose_sign1 signature structure is used when only one signature is going to be placed on a message. the header parameters dealing with the content and the signature are placed in the same pair of buckets, rather than having the separation of cose_sign. the structure can be encoded as either tagged or untagged depending on the context it will be used in. a tagged cose_sign1 structure is identified by the cbor tag 18. the cddl fragment that represents this is: cose_sign1_tagged = #6.18(cose_sign1) the cbor object that carries the body, the signature, and the information about the body and signature is called the cose_sign1 structure. examples of cose_sign1 messages can be found in appendix c.2. the cose_sign1 structure is a cbor array. the fields of the array, in order, are: protected: this is as described in section 3. unprotected: this is as described in section 3. payload: this is as described in section 4.1. signature: this field contains the computed signature value. the type of the field is a bstr. the cddl fragment that represents the above text for cose_sign1 follows. cose_sign1 = [ headers, payload : bstr / nil, signature : bstr ] 4.3. externally supplied data one of the features offered in cose is the ability for applications to provide additional data that is to be authenticated but is not carried as part of the cose object. the primary reason for supporting this can be seen by looking at the coap message structure [rfc7252], where the facility exists for options to be carried before the payload. examples of data that can be placed in this location would be the coap code or coap options. if the data is in the headers of the coap message, then it is available for proxies to help in performing proxying operations. for example, the accept option can be used by a proxy to determine if an appropriate value is in the proxy's cache. the sender can use the additional-data functionality to enable detection of any changes to the set of accept values made by a proxy or an attacker. by including the field in the externally supplied data, any subsequent modification will cause the server processing of the message to result in failure. this document describes the process for using a byte array of externally supplied authenticated data; the method of constructing the byte array is a function of the application. applications that use this feature need to define how the externally supplied authenticated data is to be constructed. such a construction needs to take into account the following issues: * if multiple items are included, applications need to ensure that the same byte string cannot be produced if there are different inputs. an example of how the problematic scenario could arise would be by concatenating the text strings \"ab\" and \"cde\" or by concatenating the text strings \"abc\" and \"de\". this is usually addressed by making fields a fixed width and/or encoding the length of the field as part of the output. using options from coap [rfc7252] as an example, these fields use a tlv structure so they can be concatenated without any problems. * if multiple items are included, an order for the items needs to be defined. using options from coap as an example, an application could state that the fields are to be ordered by the option number. * applications need to ensure that the byte string is going to be the same on both sides. using options from coap might give a problem if the same relative numbering is kept. an intermediate node could insert or remove an option, changing how the relative numbering is done. an application would need to specify that the relative number must be re-encoded to be relative only to the options that are in the external data. 4.4. signing and verification process in order to create a signature, a well-defined byte string is needed. the sig_structure is used to create the canonical form. this signing and verification process takes in the body information (cose_sign or cose_sign1), the signer information (cose_signature), and the application data (external source). a sig_structure is a cbor array. the fields of the sig_structure, in order, are: 1. a context text string identifying the context of the signature. the context text string is: \"signature\" for signatures using the cose_signature structure. \"signature1\" for signatures using the cose_sign1 structure. 2. the protected attributes from the body structure, encoded in a bstr type. if there are no protected attributes, a zero-length byte string is used. 3. the protected attributes from the signer structure, encoded in a bstr type. if there are no protected attributes, a zero-length byte string is used. this field is omitted for the cose_sign1 signature structure. 4. the externally supplied data from the application, encoded in a bstr type. if this field is not supplied, it defaults to a zero- length byte string. (see section 4.3 for application guidance on constructing this field.) 5. the payload to be signed, encoded in a bstr type. the full payload is used here, independent of how it is transported. the cddl fragment that describes the above text is: sig_structure = [ context : \"signature\" / \"signature1\", body_protected : empty_or_serialized_map, ? sign_protected : empty_or_serialized_map, external_aad : bstr, payload : bstr ] how to compute a signature: 1. create a sig_structure and populate it with the appropriate fields. 2. create the value tobesigned by encoding the sig_structure to a byte string, using the encoding described in section 9. 3. call the signature creation algorithm, passing in k (the key to sign with), alg (the algorithm to sign with), and tobesigned (the value to sign). 4. place the resulting signature value in the correct location. this is the \"signature\" field of the cose_signature or cose_sign1 structure. the steps for verifying a signature are: 1. create a sig_structure and populate it with the appropriate fields. 2. create the value tobesigned by encoding the sig_structure to a byte string, using the encoding described in section 9. 3. call the signature verification algorithm, passing in k (the key to verify with), alg (the algorithm used to sign with), tobesigned (the value to sign), and sig (the signature to be verified). in addition to performing the signature verification, the application performs the appropriate checks to ensure that the key is correctly paired with the signing identity and that the signing identity is authorized before performing actions. 5. encryption objects cose supports two different encryption structures. cose_encrypt0 is used when a recipient structure is not needed because the key to be used is known implicitly. cose_encrypt is used the rest of the time. this includes cases where there are multiple recipients or a recipient algorithm other than direct (i.e., preshared secret) is used. 5.1. enveloped cose structure the enveloped structure allows for one or more recipients of a message. there are provisions for header parameters about the content and header parameters about the recipient information to be carried in the message. the protected header parameters associated with the content are authenticated by the content encryption algorithm. the protected header parameters associated with the recipient (when the algorithm supports it) are authenticated by the recipient algorithm. examples of header parameters about the content are the type of the content and the content encryption algorithm. examples of header parameters about the recipient are the recipient's key identifier and the recipient's encryption algorithm. the same techniques and nearly the same structure are used for encrypting both the plaintext and the keys. this is different from the approach used by both \"cryptographic message syntax (cms)\" [rfc5652] and \"json web encryption (jwe)\" [rfc7516], where different structures are used for the content layer and the recipient layer. two structures are defined: cose_encrypt to hold the encrypted content and cose_recipient to hold the encrypted keys for recipients. examples of enveloped messages can be found in appendix c.3. the cose_encrypt structure can be encoded as either tagged or untagged, depending on the context it will be used in. a tagged cose_encrypt structure is identified by the cbor tag 96. the cddl fragment that represents this is: cose_encrypt_tagged = #6.96(cose_encrypt) the cose_encrypt structure is a cbor array. the fields of the array, in order, are: protected: this is as described in section 3. unprotected: this is as described in section 3. ciphertext: this field contains the ciphertext, encoded as a bstr. if the ciphertext is to be transported independently of the control information about the encryption process (i.e., detached content), then the field is encoded as a nil value. recipients: this field contains an array of recipient information structures. the type for the recipient information structure is a cose_recipient. the cddl fragment that corresponds to the above text is: cose_encrypt = [ headers, ciphertext : bstr / nil, recipients : [+cose_recipient] ] the cose_recipient structure is a cbor array. the fields of the array, in order, are: protected: this is as described in section 3. unprotected: this is as described in section 3. ciphertext: this field contains the encrypted key, encoded as a bstr. all encoded keys are symmetric keys; the binary value of the key is the content. if there is not an encrypted key, then this field is encoded as a nil value. recipients: this field contains an array of recipient information structures. the type for the recipient information structure is a cose_recipient (an example of this can be found in appendix b). if there are no recipient information structures, this element is absent. the cddl fragment that corresponds to the above text for cose_recipient is: cose_recipient = [ headers, ciphertext : bstr / nil, ? recipients : [+cose_recipient] ] 5.1.1. content key distribution methods an encrypted message consists of an encrypted content and an encrypted cek for one or more recipients. the cek is encrypted for each recipient, using a key specific to that recipient. the details of this encryption depend on which class the recipient algorithm falls into. specific details on each of the classes can be found in section 8.5. a short summary of the five content key distribution methods is: direct: the cek is the same as the identified previously distributed symmetric key or is derived from a previously distributed secret. no cek is transported in the message. symmetric key-encryption keys (keks): the cek is encrypted using a previously distributed symmetric kek. also known as key wrap. key agreement: the recipient's public key and a sender's private key are used to generate a pairwise secret, a key derivation function (kdf) is applied to derive a key, and then the cek is either the derived key or encrypted by the derived key. key transport: the cek is encrypted with the recipient's public key. passwords: the cek is encrypted in a kek that is derived from a password. as of when this document was published, no password algorithms have been defined. 5.2. single recipient encrypted the cose_encrypt0 encrypted structure does not have the ability to specify recipients of the message. the structure assumes that the recipient of the object will already know the identity of the key to be used in order to decrypt the message. if a key needs to be identified to the recipient, the enveloped structure ought to be used. examples of encrypted messages can be found in appendix c.4. the cose_encrypt0 structure can be encoded as either tagged or untagged, depending on the context it will be used in. a tagged cose_encrypt0 structure is identified by the cbor tag 16. the cddl fragment that represents this is: cose_encrypt0_tagged = #6.16(cose_encrypt0) the cose_encrypt0 structure is a cbor array. the fields of the array, in order, are: protected: this is as described in section 3. unprotected: this is as described in section 3. ciphertext: this is as described in section 5.1. the cddl fragment for cose_encrypt0 that corresponds to the above text is: cose_encrypt0 = [ headers, ciphertext : bstr / nil, ] 5.3. how to encrypt and decrypt for aead algorithms the encryption algorithm for aead algorithms is fairly simple. the first step is to create a consistent byte string for the authenticated data structure. for this purpose, we use an enc_structure. the enc_structure is a cbor array. the fields of the enc_structure, in order, are: 1. a context text string identifying the context of the authenticated data structure. the context text string is: \"encrypt0\" for the content encryption of a cose_encrypt0 data structure. \"encrypt\" for the first layer of a cose_encrypt data structure (i.e., for content encryption). \"enc_recipient\" for a recipient encoding to be placed in a cose_encrypt data structure. \"mac_recipient\" for a recipient encoding to be placed in a maced message structure. \"rec_recipient\" for a recipient encoding to be placed in a recipient structure. 2. the protected attributes from the body structure, encoded in a bstr type. if there are no protected attributes, a zero-length byte string is used. 3. the externally supplied data from the application encoded in a bstr type. if this field is not supplied, it defaults to a zero- length byte string. (see section 4.3 for application guidance on constructing this field.) the cddl fragment that describes the above text is: enc_structure = [ context : \"encrypt\" / \"encrypt0\" / \"enc_recipient\" / \"mac_recipient\" / \"rec_recipient\", protected : empty_or_serialized_map, external_aad : bstr ] how to encrypt a message: 1. create an enc_structure and populate it with the appropriate fields. 2. encode the enc_structure to a byte string (additional authenticated data (aad)), using the encoding described in section 9. 3. determine the encryption key (k). this step is dependent on the class of recipient algorithm being used. for: no recipients: the key to be used is determined by the algorithm and key at the current layer. examples are key wrap keys (section 8.5.2) and preshared secrets. direct encryption and direct key agreement: the key is determined by the key and algorithm in the recipient structure. the encryption algorithm and size of the key to be used are inputs into the kdf used for the recipient. (for direct, the kdf can be thought of as the identity operation.) examples of these algorithms are found in sections 6.1 and 6.3 of [rfc9053]. other: the key is randomly generated. 4. call the encryption algorithm with k (the encryption key), p (the plaintext), and aad. place the returned ciphertext into the \"ciphertext\" field of the structure. 5. for recipients of the message using non-direct algorithms, recursively perform the encryption algorithm for that recipient, using k (the encryption key) as the plaintext. how to decrypt a message: 1. create an enc_structure and populate it with the appropriate fields. 2. encode the enc_structure to a byte string (aad), using the encoding described in section 9. 3. determine the decryption key. this step is dependent on the class of recipient algorithm being used. for: no recipients: the key to be used is determined by the algorithm and key at the current layer. examples are key wrap keys (section 8.5.2) and preshared secrets. direct encryption and direct key agreement: the key is determined by the key and algorithm in the recipient structure. the encryption algorithm and size of the key to be used are inputs into the kdf used for the recipient. (for direct, the kdf can be thought of as the identity operation.) other: the key is determined by decoding and decrypting one of the recipient structures. 4. call the decryption algorithm with k (the decryption key to use), c (the ciphertext), and aad. 5.4. how to encrypt and decrypt for ae algorithms how to encrypt a message: 1. verify that the \"protected\" field is a zero-length byte string. 2. verify that there was no external additional authenticated data supplied for this operation. 3. determine the encryption key. this step is dependent on the class of recipient algorithm being used. for: no recipients: the key to be used is determined by the algorithm and key at the current layer. examples are key wrap keys (section 8.5.2) and preshared secrets. direct encryption and direct key agreement: the key is determined by the key and algorithm in the recipient structure. the encryption algorithm and size of the key to be used are inputs into the kdf used for the recipient. (for direct, the kdf can be thought of as the identity operation.) examples of these algorithms are found in sections 6.1 and 6.3 of [rfc9053]. other: the key is randomly generated. 4. call the encryption algorithm with k (the encryption key to use) and p (the plaintext). place the returned ciphertext into the \"ciphertext\" field of the structure. 5. for recipients of the message using non-direct algorithms, recursively perform the encryption algorithm for that recipient, using k (the encryption key) as the plaintext. how to decrypt a message: 1. verify that the \"protected\" field is a zero-length byte string. 2. verify that there was no external additional authenticated data supplied for this operation. 3. determine the decryption key. this step is dependent on the class of recipient algorithm being used. for: no recipients: the key to be used is determined by the algorithm and key at the current layer. examples are key wrap keys (section 8.5.2) and preshared secrets. direct encryption and direct key agreement: the key is determined by the key and algorithm in the recipient structure. the encryption algorithm and size of the key to be used are inputs into the kdf used for the recipient. (for direct, the kdf can be thought of as the identity operation.) examples of these algorithms are found in sections 6.1 and 6.3 of [rfc9053]. other: the key is determined by decoding and decrypting one of the recipient structures. 4. call the decryption algorithm with k (the decryption key to use) and c (the ciphertext). 6. mac objects cose supports two different mac structures. cose_mac0 is used when a recipient structure is not needed because the key to be used is implicitly known. cose_mac is used for all other cases. these include a requirement for multiple recipients, the key being unknown, or a recipient algorithm other than direct. in this section, we describe the structure and methods to be used when doing mac authentication in cose. this document allows for the use of all of the same classes of recipient algorithms as are allowed for encryption. there are two modes in which mac operations can be used. the first is just a check that the content has not been changed since the mac was computed. any class of recipient algorithm can be used for this purpose. the second mode is to both check that the content has not been changed since the mac was computed and use the recipient algorithm to verify who sent it. the classes of recipient algorithms that support this are those that use a preshared secret or do static- static (ss) key agreement (without the key wrap step). in both of these cases, the entity that created and sent the message mac can be validated. (this knowledge of the sender assumes that there are only two parties involved and that you did not send the message to yourself.) the origination property can be obtained with both of the mac message structures. 6.1. maced message with recipients a multiple-recipient maced message uses two structures: the cose_mac structure defined in this section for carrying the body and the cose_recipient structure (section 5.1) to hold the key used for the mac computation. examples of maced messages can be found in appendix c.5. the mac structure can be encoded as either tagged or untagged depending on the context it will be used in. a tagged cose_mac structure is identified by the cbor tag 97. the cddl fragment that represents this is: cose_mac_tagged = #6.97(cose_mac) the cose_mac structure is a cbor array. the fields of the array, in order, are: protected: this is as described in section 3. unprotected: this is as described in section 3. payload: this field contains the serialized content to be maced. if the payload is not present in the message, the application is required to supply the payload separately. the payload is wrapped in a bstr to ensure that it is transported without changes. if the payload is transported separately (i.e., detached content), then a nil cbor value is placed in this location, and it is the responsibility of the application to ensure that it will be transported without changes. tag: this field contains the mac value. recipients: this is as described in section 5.1. the cddl fragment that represents the above text for cose_mac follows. cose_mac = [ headers, payload : bstr / nil, tag : bstr, recipients : [+cose_recipient] ] 6.2. maced messages with implicit key in this section, we describe the structure and methods to be used when doing mac authentication for those cases where the recipient is implicitly known. the maced message uses the cose_mac0 structure defined in this section for carrying the body. examples of maced messages with an implicit key can be found in appendix c.6. the mac structure can be encoded as either tagged or untagged, depending on the context it will be used in. a tagged cose_mac0 structure is identified by the cbor tag 17. the cddl fragment that represents this is: cose_mac0_tagged = #6.17(cose_mac0) the cose_mac0 structure is a cbor array. the fields of the array, in order, are: protected: this is as described in section 3. unprotected: this is as described in section 3. payload: this is as described in section 6.1. tag: this field contains the mac value. the cddl fragment that corresponds to the above text is: cose_mac0 = [ headers, payload : bstr / nil, tag : bstr, ] 6.3. how to compute and verify a mac in order to get a consistent encoding of the data to be authenticated, the mac_structure is used to create the canonical form. the mac_structure is a cbor array. the fields of the mac_structure, in order, are: 1. a context text string that identifies the structure that is being encoded. this context text string is \"mac\" for the cose_mac structure. this context text string is \"mac0\" for the cose_mac0 structure. 2. the protected attributes from the body structure. if there are no protected attributes, a zero-length bstr is used. 3. the externally supplied data from the application, encoded as a bstr type. if this field is not supplied, it defaults to a zero- length byte string. (see section 4.3 for application guidance on constructing this field.) 4. the payload to be maced, encoded in a bstr type. the full payload is used here, independent of how it is transported. the cddl fragment that corresponds to the above text is: mac_structure = [ context : \"mac\" / \"mac0\", protected : empty_or_serialized_map, external_aad : bstr, payload : bstr ] the steps to compute a mac are: 1. create a mac_structure and populate it with the appropriate fields. 2. create the value tobemaced by encoding the mac_structure to a byte string, using the encoding described in section 9. 3. call the mac creation algorithm, passing in k (the key to use), alg (the algorithm to mac with), and tobemaced (the value to compute the mac on). 4. place the resulting mac in the \"tag\" field of the cose_mac or cose_mac0 structure. 5. for cose_mac structures, encrypt and encode the mac key for each recipient of the message. the steps to verify a mac are: 1. create a mac_structure and populate it with the appropriate fields. 2. create the value tobemaced by encoding the mac_structure to a byte string, using the encoding described in section 9. 3. for cose_mac structures, obtain the cryptographic key by decoding and decrypting one of the recipient structures. 4. call the mac creation algorithm, passing in k (the key to use), alg (the algorithm to mac with), and tobemaced (the value to compute the mac on). 5. compare the mac value to the \"tag\" field of the cose_mac or cose_mac0 structure. 7. key objects a cose key structure is built on a cbor map. the set of common parameters that can appear in a cose key can be found in the iana \"cose key common parameters\" registry [cose.keyparameters] (see section 11.2). additional parameters defined for specific key types can be found in the iana \"cose key type parameters\" registry [cose.keytypes]. a cose key set uses a cbor array object as its underlying type. the values of the array elements are cose keys. a cose key set must have at least one element in the array. examples of cose key sets can be found in appendix c.7. each element in a cose key set must be processed independently. if one element in a cose key set is either malformed or uses a key that is not understood by an application, that key is ignored, and the other keys are processed normally. the element \"kty\" is a required element in a cose_key map. the cddl grammar describing cose_key and cose_keyset is: cose_key = { 1 => tstr / int, ; kty ? 2 => bstr, ; kid ? 3 => tstr / int, ; alg ? 4 => [+ (tstr / int) ], ; key_ops ? 5 => bstr, ; base iv * label => values } cose_keyset = [+cose_key] 7.1. cose key common parameters this document defines a set of common parameters for a cose key object. table 4 provides a summary of the parameters defined in this section. there are also parameters that are defined for specific key types. key-type-specific parameters can be found in [rfc9053]. +=========+=======+========+============+====================+ | name | label | cbor | value | description | | | | type | registry | | +=========+=======+========+============+====================+ | kty | 1 | tstr / | cose key | identification of | | | | int | types | the key type | +---------+-------+--------+------------+--------------------+ | kid | 2 | bstr | | key identification | | | | | | value -- match to | | | | | | \"kid\" in message | +---------+-------+--------+------------+--------------------+ | alg | 3 | tstr / | cose | key usage | | | | int | algorithms | restriction to | | | | | | this algorithm | +---------+-------+--------+------------+--------------------+ | key_ops | 4 | [+ | | restrict set of | | | | (tstr/ | | permissible | | | | int)] | | operations | +---------+-------+--------+------------+--------------------+ | base iv | 5 | bstr | | base iv to be xor- | | | | | | ed with partial | | | | | | ivs | +---------+-------+--------+------------+--------------------+ table 4: key map labels kty: this parameter is used to identify the family of keys for this structure and, thus, the set of key-type-specific parameters to be found. the set of values defined in this document can be found in [cose.keytypes]. this parameter must be present in a key object. implementations must verify that the key type is appropriate for the algorithm being processed. the key type must be included as part of the trust-decision process. alg: this parameter is used to restrict the algorithm that is used with the key. if this parameter is present in the key structure, the application must verify that this algorithm matches the algorithm for which the key is being used. if the algorithms do not match, then this key object must not be used to perform the cryptographic operation. note that the same key can be in a different key structure with a different or no algorithm specified; however, this is considered to be a poor security practice. kid: this parameter is used to give an identifier for a key. the identifier is not structured and can be anything from a user- provided byte string to a value computed on the public portion of the key. this field is intended for matching against a \"kid\" parameter in a message in order to filter down the set of keys that need to be checked. the value of the identifier is not a unique value and can occur in other key objects, even for different keys. key_ops: this parameter is defined to restrict the set of operations that a key is to be used for. the value of the field is an array of values from table 5. algorithms define the values of key ops that are permitted to appear and are required for specific operations. the set of values matches that in [rfc7517] and [w3c.webcrypto]. base iv: this parameter is defined to carry the base portion of an iv. it is designed to be used with the partial iv header parameter defined in section 3.1. this field provides the ability to associate a base iv with a key that is then modified on a per- message basis with the partial iv. extreme care needs to be taken when using a base iv in an application. many encryption algorithms lose security if the same iv is used twice. if different keys are derived for each sender, starting at the same base iv is likely to satisfy this condition. if the same key is used for multiple senders, then the application needs to provide for a method of dividing the iv space up between the senders. this could be done by providing a different base point to start from or a different partial iv to start with and restricting the number of messages to be sent before rekeying. +=========+=======+==============================================+ | name | value | description | +=========+=======+==============================================+ | sign | 1 | the key is used to create signatures. | | | | requires private key fields. | +---------+-------+----------------------------------------------+ | verify | 2 | the key is used for verification of | | | | signatures. | +---------+-------+----------------------------------------------+ | encrypt | 3 | the key is used for key transport | | | | encryption. | +---------+-------+----------------------------------------------+ | decrypt | 4 | the key is used for key transport | | | | decryption. requires private key fields. | +---------+-------+----------------------------------------------+ | wrap | 5 | the key is used for key wrap encryption. | | key | | | +---------+-------+----------------------------------------------+ | unwrap | 6 | the key is used for key wrap decryption. | | key | | requires private key fields. | +---------+-------+----------------------------------------------+ | derive | 7 | the key is used for deriving keys. requires | | key | | private key fields. | +---------+-------+----------------------------------------------+ | derive | 8 | the key is used for deriving bits not to be | | bits | | used as a key. requires private key fields. | +---------+-------+----------------------------------------------+ | mac | 9 | the key is used for creating macs. | | create | | | +---------+-------+----------------------------------------------+ | mac | 10 | the key is used for validating macs. | | verify | | | +---------+-------+----------------------------------------------+ table 5: key operation values 8. taxonomy of algorithms used by cose in this section, a taxonomy of the different algorithm types that can be used in cose is laid out. this taxonomy should not be considered to be exhaustive. new algorithms will be created that will not fit into this taxonomy. 8.1. signature algorithms signature algorithms provide data-origination and data-integrity services. data origination provides the ability to infer who originated the data based on who signed the data. data integrity provides the ability to verify that the data has not been modified since it was signed. there are two general signature algorithm schemes. the first is signature with appendix. in this scheme, the message content is processed and a signature is produced; the signature is called the appendix. this is the scheme used by algorithms such as ecdsa and the rsa probabilistic signature scheme (rsassa-pss). (in fact, the ssa in rsassa-pss stands for signature scheme with appendix.) the signature functions for this scheme are: signature = sign(message content, key) valid = verification(message content, key, signature) the second scheme is signature with message recovery; an example of such an algorithm is [pvsig]. in this scheme, the message content is processed, but part of it is included in the signature. moving bytes of the message content into the signature allows for smaller signed messages; the signature size is still potentially large, but the message content has shrunk. this has implications for systems implementing these algorithms and applications that use them. the first is that the message content is not fully available until after a signature has been validated. until that point, the part of the message contained inside of the signature is unrecoverable. the second implication is that the security analysis of the strength of the signature can be very much dependent on the structure of the message content. finally, in the event that multiple signatures are applied to a message, all of the signature algorithms are going to be required to consume the same bytes of message content. this means that the mixing of the signature-with-message-recovery and signature- with-appendix schemes in a single message is not supported. the signature functions for this scheme are: signature, message sent = sign(message content, key) valid, message content = verification(message sent, key, signature) no message recovery signature algorithms have been formally defined for cose yet. given the new constraints arising from this scheme, while some issues have already been identified, there is a high probability that additional issues will arise when integrating message recovery signature algorithms. the first algorithm defined is going to need to make decisions about these issues, and those decisions are likely to be binding on any further algorithms defined. we use the following terms below: message content bytes: the byte string provided by the application to be signed. to-be-signed bytes: the byte string passed into the signature algorithm. recovered bytes: the bytes recovered during the signature verification process. some of the issues that have already been identified are: * the to-be-signed bytes are not the same as the message content bytes. this is because we build a larger to-be-signed message during the signature processing. the length of the recovered bytes may exceed the length of the message content, but not the length of the to-be-signed bytes. this may lead to privacy considerations if, for example, the externally supplied data contains confidential information. * there may be difficulties in determining where the recovered bytes match up with the to-be-signed bytes, because the recovered bytes contain data not in the message content bytes. one possible option would be to create a padding scheme to prevent that. * not all message recovery signature algorithms take the recovered bytes from the end of the to-be-signed bytes. this is a problem, because the message content bytes are at the end of the to-be- signed bytes. if the bytes to be recovered are taken from the start of the to-be-signed bytes, then, by default, none of the message content bytes may be included in the recovered bytes. one possible option to deal with this is to reverse the to-be-signed data in the event that recovered bytes are taken from the start rather than the end of the to-be-signed bytes. signature algorithms are used with the cose_signature and cose_sign1 structures. at the time of this writing, only signatures with appendices are defined for use with cose; however, considerable interest has been expressed in using a signature-with-message- recovery algorithm, due to the effective size reduction that is possible. 8.2. message authentication code (mac) algorithms message authentication codes (macs) provide data authentication and integrity protection. they provide either no or very limited data origination. a mac, for example, cannot be used to prove the identity of the sender to a third party. macs use the same scheme as signature-with-appendix algorithms. the message content is processed, and an authentication code is produced. the authentication code is frequently called a tag. the mac functions are: tag = mac_create(message content, key) valid = mac_verify(message content, key, tag) mac algorithms can be based on either a block cipher algorithm (i.e., aes-mac) or a hash algorithm (i.e., a hash-based message authentication code (hmac)). [rfc9053] defines a mac algorithm using each of these constructions. mac algorithms are used in the cose_mac and cose_mac0 structures. 8.3. content encryption algorithms content encryption algorithms provide data confidentiality for potentially large blocks of data using a symmetric key. they provide integrity on the data that was encrypted; however, they provide either no or very limited data origination. (one cannot, for example, be used to prove the identity of the sender to a third party.) the ability to provide data origination is linked to how the cek is obtained. cose restricts the set of legal content encryption algorithms to those that support authentication both of the content and additional data. the encryption process will generate some type of authentication value, but that value may be either explicit or implicit in terms of the algorithm definition. for simplicity's sake, the authentication code will normally be defined as being appended to the ciphertext stream. the encryption functions are: ciphertext = encrypt(message content, key, additional data) valid, message content = decrypt(ciphertext, key, additional data) most aead algorithms are logically defined as returning the message content only if the decryption is valid. many, but not all, implementations will follow this convention. the message content must not be used if the decryption does not validate. these algorithms are used in cose_encrypt and cose_encrypt0. 8.4. key derivation functions (kdfs) kdfs are used to take some secret value and generate a different one. the secret value comes in three flavors: * secrets that are uniformly random. this is the type of secret that is created by a good random number generator. * secrets that are not uniformly random. this is the type of secret that is created by operations like key agreement. * secrets that are not random. this is the type of secret that people generate for things like passwords. general kdfs work well with the first type of secret, can do reasonably well with the second type of secret, and generally do poorly with the last type of secret. functions like argon2 [rfc9106] need to be used for nonrandom secrets. the same kdf can be set up to deal with the first two types of secrets in different ways. the kdf defined in section 5.1 of [rfc9053] is such a function. this is reflected in the set of algorithms defined around the hmac-based extract-and-expand key derivation function (hkdf). when using kdfs, one component that is included is context information. context information is used to allow for different keying information to be derived from the same secret. the use of context-based keying material is considered to be a good security practice. 8.5. content key distribution methods content key distribution methods (recipient algorithms) can be defined into a number of different classes. cose has the ability to support many classes of recipient algorithms. in this section, a number of classes are listed. for the recipient algorithm classes defined in [rfc7516], the same names are used. other specifications use different terms for the recipient algorithm classes or do not support some of the recipient algorithm classes. 8.5.1. direct encryption the direct encryption class of algorithms share a secret between the sender and the recipient that is used either directly or after manipulation as the cek. when direct-encryption mode is used, it must be the only mode used on the message. the cose_recipient structure for the recipient is organized as follows: * the \"protected\" field must be a zero-length byte string unless it is used in the computation of the content key. * the \"alg\" header parameter must be present. * a header parameter identifying the shared secret should be present. * the \"ciphertext\" field must be a zero-length byte string. * the \"recipients\" field must be absent. 8.5.2. key wrap in key wrap mode, the cek is randomly generated, and that key is then encrypted by a shared secret between the sender and the recipient. all of the currently defined key wrap algorithms for cose are ae algorithms. key wrap mode is considered to be superior to direct encryption if the system has any capability for doing random-key generation. this is because the shared key is used to wrap random data rather than data that has some degree of organization and may in fact be repeating the same content. the use of key wrap loses the weak data origination that is provided by the direct-encryption algorithms. the cose_recipient structure for the recipient is organized as follows: * the \"protected\" field must be a zero-length byte string if the key wrap algorithm is an ae algorithm. * the \"recipients\" field is normally absent but can be used. applications must deal with a recipient field being present that has an unsupported algorithm. failing to decrypt that specific recipient is an acceptable way of dealing with it. failing to process the message is not an acceptable way of dealing with it. * the plaintext to be encrypted is the key from the next layer down (usually the content layer). * at a minimum, the \"unprotected\" field must contain the \"alg\" header parameter and should contain a header parameter identifying the shared secret. 8.5.3. key transport key transport mode is also called key encryption mode in some standards. key transport mode differs from key wrap mode in that it uses an asymmetric encryption algorithm rather than a symmetric encryption algorithm to protect the key. a set of key transport algorithms is defined in [rfc8230]. when using a key transport algorithm, the cose_recipient structure for the recipient is organized as follows: * the \"protected\" field must be a zero-length byte string. * the plaintext to be encrypted is the key from the next layer down (usually the content layer). * at a minimum, the \"unprotected\" field must contain the \"alg\" header parameter and should contain a parameter identifying the asymmetric key. 8.5.4. direct key agreement the direct key agreement class of recipient algorithms uses a key agreement method to create a shared secret. a kdf is then applied to the shared secret to derive a key to be used in protecting the data. this key is normally used as a cek or mac key but could be used for other purposes if more than two layers are in use (see appendix b). the most commonly used key agreement algorithm is diffie-hellman, but other variants exist. since cose is designed for a store-and-forward environment rather than an online environment, many of the dh variants cannot be used, as the receiver of the message cannot provide any dynamic key material. one side effect of this is that forward secrecy (see [rfc4949]) is not achievable. a static key will always be used for the receiver of the cose object. two variants of dh that are supported are: ephemeral-static (es) dh: the sender of the message creates a one- time dh key and uses a static key for the recipient. the use of the ephemeral sender key means that no additional random input is needed, as this is randomly generated for each message. static-static (ss) dh: a static key is used for both the sender and the recipient. the use of static keys allows for the recipient to get a weak version of data origination for the message. when static-static key agreement is used, then some piece of unique data for the kdf is required to ensure that a different key is created for each message. when direct key agreement mode is used, there must be only one recipient in the message. this method creates the key directly, and that makes it difficult to mix with additional recipients. if multiple recipients are needed, then the version with key wrap needs to be used. the cose_recipient structure for the recipient is organized as follows: * at a minimum, headers must contain the \"alg\" header parameter and should contain a header parameter identifying the recipient's asymmetric key. * the headers should identify the sender's key for the static-static versions and must contain the sender's ephemeral key for the ephemeral-static versions. 8.5.5. key agreement with key wrap key agreement with key wrap uses a randomly generated cek. the cek is then encrypted using a key wrap algorithm and a key derived from the shared secret computed by the key agreement algorithm. the function for this would be: encryptedkey = keywrap(kdf(dh-shared, context), cek) the cose_recipient structure for the recipient is organized as follows: * the \"protected\" field is fed into the kdf context structure. * the plaintext to be encrypted is the key from the next layer down (usually the content layer). * the \"alg\" header parameter must be present in the layer. * a header parameter identifying the recipient's key should be present. a header parameter identifying the sender's key should be present. 9. cbor encoding restrictions this document limits the restrictions it imposes on how the cbor encoder needs to work. the new encoding restrictions are aligned with the core deterministic encoding requirements specified in section 4.2.1 of rfc 8949 [std94]. it has been narrowed down to the following restrictions: * the restriction applies to the encoding of the sig_structure, the enc_structure, and the mac_structure. * encoding must be done using definite lengths, and the length of the (encoded) argument must be the minimum possible length. this means that the integer 1 is encoded as \"0x01\" and not \"0x1801\". * applications must not generate messages with the same label used twice as a key in a single map. applications must not parse and process messages with the same label used twice as a key in a single map. applications can enforce the parse-and-process requirement by using parsers that will fail the parse step or by using parsers that will pass all keys to the application, and the application can perform the check for duplicate keys. 10. application profiling considerations this document is designed to provide a set of security services but not impose algorithm implementation requirements for specific usage. the interoperability requirements are provided for how each of the individual services are used and how the algorithms are to be used for interoperability. the requirements about which algorithms and which services are needed are deferred to each application. an example of a profile can be found in [rfc8613], where one was developed for carrying content in combination with coap headers. it is intended that a profile of this document be created that defines the interoperability requirements for that specific application. this section provides a set of guidelines and topics that need to be considered when profiling this document. * applications need to determine the set of messages defined in this document that they will be using. the set of messages corresponds fairly directly to the needed set of security services and security levels. * applications may define new header parameters for a specific purpose. applications will oftentimes select specific header parameters to use or not to use. for example, an application would normally state a preference for using either the iv or the partial iv header parameter. if the partial iv header parameter is specified, then the application also needs to define how the fixed portion of the iv is determined. * when applications use externally defined authenticated data, they need to define how that data is encoded. this document assumes that the data will be provided as a byte string. more information can be found in section 4.3. * applications need to determine the set of security algorithms that is to be used. when selecting the algorithms to be used as the mandatory-to-implement set, consideration should be given to choosing different types of algorithms when two are chosen for a specific purpose. an example of this would be choosing hmac- sha512 and aes-cmac (cipher-based message authentication code) as different mac algorithms; the construction is vastly different between these two algorithms. this means that a weakening of one algorithm would be unlikely to lead to a weakening of the other algorithms. of course, these algorithms do not provide the same level of security and thus may not be comparable for the desired security functionality. additional guidance can be found in [bcp201]. * applications may need to provide some type of negotiation or discovery method if multiple algorithms or message structures are permitted. the method can range from something as simple as requiring preconfiguration of the set of algorithms to providing a discovery method built into the protocol. s/mime provided a number of different ways to approach the problem that applications could follow: - advertising in the message (s/mime capabilities) [rfc8551]. - advertising in the certificate (capabilities extension) [rfc4262]. - minimum requirements for the s/mime, which have been updated over time [rfc2633] [rfc3851] [rfc5751] [rfc8551]. (note that [rfc2633] was obsoleted by [rfc3851], which was obsoleted by [rfc5751], which was obsoleted by [rfc8551].) 11. iana considerations the registries and registrations listed below were defined by rfc 8152 [rfc8152]. the majority of the following actions are to update the references to point to this document. note that while [rfc9053] also updates the registries and registrations originally established by [rfc8152], the requested updates are mutually exclusive. the updates requested in this document do not conflict or overlap with the updates requested in [rfc9053], and vice versa. 11.1. cose header parameters registry the \"cose header parameters\" registry was defined by [rfc8152]. iana has updated the reference for this registry to point to this document instead of [rfc8152]. iana has also updated all entries that referenced [rfc8152], except \"counter signature\" and \"countersignature0\", to refer to this document. the references for \"counter signature\" and \"countersignature0\" continue to reference [rfc8152]. 11.2. cose key common parameters registry the \"cose key common parameters\" registry [cose.keyparameters] was defined in [rfc8152]. iana has updated the reference for this registry to point to this document instead of [rfc8152]. iana has also updated the entries that referenced [rfc8152] to refer to this document. 11.3. media type registrations 11.3.1. cose security message iana has registered the \"application/cose\" media type in the \"media types\" registry. this media type is used to indicate that the content is a cose message. type name: application subtype name: cose required parameters: n/a optional parameters: cose-type encoding considerations: binary security considerations: see the security considerations section of rfc 9052. interoperability considerations: n/a published specification: rfc 9052 applications that use this media type: iot applications sending security content over http(s) transports. fragment identifier considerations: n/a additional information: * deprecated alias names for this type: n/a * magic number(s): n/a * file extension(s): cbor * macintosh file type code(s): n/a person & email address to contact for further information: iesg@ietf.org intended usage: common restrictions on usage: n/a author: jim schaad change controller: iesg provisional registration? no 11.3.2. cose key media type iana has registered the \"application/cose-key\" and \"application/cose- key-set\" media types in the \"media types\" registry. these media types are used to indicate, respectively, that the content is a cose_key or cose_keyset object. the template for \"application/cose-key\" is as follows: type name: application subtype name: cose-key required parameters: n/a optional parameters: n/a encoding considerations: binary security considerations: see the security considerations section of rfc 9052. interoperability considerations: n/a published specification: rfc 9052 applications that use this media type: distribution of cose-based keys for iot applications. fragment identifier considerations: n/a additional information: * deprecated alias names for this type: n/a * magic number(s): n/a * file extension(s): cbor * macintosh file type code(s): n/a person & email address to contact for further information: iesg@ietf.org intended usage: common restrictions on usage: n/a author: jim schaad change controller: iesg provisional registration? no the template for registering \"application/cose-key-set\" is: type name: application subtype name: cose-key-set required parameters: n/a optional parameters: n/a encoding considerations: binary security considerations: see the security considerations section of rfc 9052. interoperability considerations: n/a published specification: rfc 9052 applications that use this media type: distribution of cose-based keys for iot applications. fragment identifier considerations: n/a additional information: * deprecated alias names for this type: n/a * magic number(s): n/a * file extension(s): cbor * macintosh file type code(s): n/a person & email address to contact for further information: iesg@ietf .org intended usage: common restrictions on usage: n/a author: jim schaad change controller: iesg provisional registration? no 11.4. coap content-formats registry iana added entries to the \"coap content-formats\" registry as indicated in [rfc8152]. iana has updated the reference to point to this document instead of [rfc8152]. 11.5. cbor tags registry iana added entries to the \"cbor tags\" registry as indicated in [rfc8152]. iana has updated the references to point to this document instead of [rfc8152]. 11.6. expert review instructions all of the iana registries established by [rfc8152] are, at least in part, defined as expert review [rfc8126]. this section gives some general guidelines for what the experts should be looking for, but they are being designated as experts for a reason, so they should be given substantial latitude. expert reviewers should take the following into consideration: * point squatting should be discouraged. reviewers are encouraged to get sufficient information for registration requests to ensure that the usage is not going to duplicate an existing registration and that the code point is likely to be used in deployments. the ranges tagged as private use are intended for testing purposes and closed environments; code points in other ranges should not be assigned for testing. * standards track or bcp rfcs are required to register a code point in the standards action range. specifications should exist for specification required ranges, but early assignment before an rfc is available is considered to be permissible. specifications are needed for the first-come, first-served range if the points are expected to be used outside of closed environments in an interoperable way. when specifications are not provided, the description provided needs to have sufficient information to identify what the point is being used for. * experts should take into account the expected usage of fields when approving code point assignment. the fact that the standards action range is only available to standards track documents does not mean that a standards track document cannot have points assigned outside of that range. the length of the encoded value should be weighed against how many code points of that length are left and the size of device it will be used on. * when algorithms are registered, vanity registrations should be discouraged. one way to do this is to require registrations to provide additional documentation on security analysis of the algorithm. another thing that should be considered is requesting an opinion on the algorithm from the crypto forum research group (cfrg). algorithms are expected to meet the security requirements of the community and the requirements of the message structures in order to be suitable for registration. 12. security considerations there are a number of security considerations that need to be taken into account by implementers of this specification. while some considerations have been highlighted here, additional considerations may be found in the documents listed in the references. implementations need to protect the private key material for all individuals. some cases in this document need to be highlighted with regard to this issue. * use of the same key for two different algorithms can leak information about the key. it is therefore recommended that keys be restricted to a single algorithm. * use of \"direct\" as a recipient algorithm combined with a second recipient algorithm exposes the direct key to the second recipient; section 8.5 forbids combining \"direct\" recipient algorithms with other modes. * several of the algorithms in [rfc9053] have limits on the number of times that a key can be used without leaking information about the key. the use of elliptic curve diffie-hellman (ecdh) and direct plus kdf (with no key wrap) will not directly lead to the private key being leaked; the one-way function of the kdf will prevent that. there is, however, a different issue that needs to be addressed. having two recipients requires that the cek be shared between two recipients. the second recipient therefore has a cek that was derived from material that can be used for the weak proof of origin. the second recipient could create a message using the same cek and send it to the first recipient; the first recipient would, for either static- static ecdh or direct plus kdf, make an assumption that the cek could be used for proof of origin, even though it is from the wrong entity. if the key wrap step is added, then no proof of origin is implied and this is not an issue. although it has been mentioned before, it bears repeating that the use of a single key for multiple algorithms has been demonstrated in some cases to leak information about a key, providing the opportunity for attackers to forge integrity tags or gain information about encrypted content. binding a key to a single algorithm prevents these problems. key creators and key consumers are strongly encouraged to not only create new keys for each different algorithm, but to include that selection of algorithm in any distribution of key material and strictly enforce the matching of algorithms in the key structure to algorithms in the message structure. in addition to checking that algorithms are correct, the key form needs to be checked as well. do not use an \"ec2\" key where an \"okp\" key is expected. before using a key for transmission, or before acting on information received, a trust decision on a key needs to be made. is the data or action something that the entity associated with the key has a right to see or a right to request? a number of factors are associated with this trust decision. some highlighted here are: * what are the permissions associated with the key owner? * is the cryptographic algorithm acceptable in the current context? * have the restrictions associated with the key, such as algorithm or freshness, been checked, and are they correct? * is the request something that is reasonable, given the current state of the application? * have any security considerations that are part of the message been enforced (as specified by the application or \"crit\" header parameter)? one area that has been getting exposure is traffic analysis of encrypted messages based on the length of the message. this specification does not provide a uniform method for providing padding as part of the message structure. an observer can distinguish between two different messages (for example, \"yes\" and \"no\") based on the length for all of the content encryption algorithms that are defined in [rfc9053]. this means that it is up to the applications to document how content padding is to be done in order to prevent or discourage such analysis. (for example, the text strings could be defined as \"yes\" and \"no \".) 13. references 13.1. normative references [rfc2119] bradner, s., \"key words for use in rfcs to indicate requirement levels\", bcp 14, rfc 2119, doi 10.17487/rfc2119, march 1997, <https://www.rfc-editor.org/info/rfc2119>. [rfc8174] leiba, b., \"ambiguity of uppercase vs lowercase in rfc 2119 key words\", bcp 14, rfc 8174, doi 10.17487/rfc8174, may 2017, <https://www.rfc-editor.org/info/rfc8174>. [rfc9053] schaad, j., \"cbor object signing and encryption (cose): initial algorithms\", rfc 9053, doi 10.17487/rfc9053, august 2022, <https://www.rfc-editor.org/info/rfc9053>. [std94] bormann, c. and p. hoffman, \"concise binary object representation (cbor)\", std 94, rfc 8949, december 2020, <https://www.rfc-editor.org/info/std94>. 13.2. informative references [bcp201] housley, r., \"guidelines for cryptographic algorithm agility and selecting mandatory-to-implement algorithms\", bcp 201, rfc 7696, november 2015, <https://www.rfc-editor.org/info/bcp201>. [coap.formats] iana, \"coap content-formats\", <https://www.iana.org/assignments/core-parameters/>. [core-groupcomm] dijk, e., wang, c., and m. tiloca, \"group communication for the constrained application protocol (coap)\", work in progress, internet-draft, draft-ietf-core-groupcomm-bis- 07, 11 july 2022, <https://datatracker.ietf.org/doc/html/ draft-ietf-core-groupcomm-bis-07>. [cose-countersign] schaad, j. and r. housley, \"cbor object signing and encryption (cose): countersignatures\", work in progress, internet-draft, draft-ietf-cose-countersign-08, 22 august 2022, <https://datatracker.ietf.org/doc/html/draft-ietf- cose-countersign-08>. [cose.algorithms] iana, \"cose algorithms\", <https://www.iana.org/assignments/c
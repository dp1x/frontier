ment that the algorithm identifier be located in the protected attributes was relaxed from a must to a should. two basic reasons have been advanced to support this position. first, the resulting message will be smaller if the algorithm identifier is omitted from the most common messages in a coap environment. second, there is a potential bug that will arise if full checking is not done correctly between the different places that an algorithm identifier could be placed (the message itself, an application statement, the key structure that the sender possesses, and the key structure the recipient possesses). this appendix lays out how such a change can be made and the details that an application needs to specify in order to use this option. two different sets of details are specified: those needed to omit an algorithm identifier and those needed to use the variant on the countersignature attribute that contains no attributes about itself. three sets of recommendations are laid out. the first set of recommendations applies to having an implicit algorithm identified for a single layer of a cose object. the second set of recommendations applies to having multiple implicit algorithms identified for multiple layers of a cose object. the third set of recommendations applies to having implicit algorithms for multiple cose object constructs. the key words from bcp 14 ([rfc2119] and [rfc8174]) are deliberately not used here. this specification can provide recommendations, but it cannot enforce them. this set of recommendations applies to the case where an application is distributing a fixed algorithm along with the key information for use in a single cose object. this normally applies to the smallest of the cose objects -- specifically, cose_sign1, cose_mac0, and cose_encrypt0 -- but could apply to the other structures as well. the following items should be taken into account: * applications need to list the set of cose structures that implicit algorithms are to be used in. applications need to require that the receipt of an explicit algorithm identifier in one of these structures will lead to the message being rejected. this requirement is stated so that there will never be a case where there is any ambiguity about the question of which algorithm should be used, the implicit or the explicit one. this applies even if the transported algorithm identifier is a protected attribute. this applies even if the transported algorithm is the same as the implicit algorithm. * applications need to define the set of information that is to be considered to be part of a context when omitting algorithm identifiers. at a minimum, this would be the key identifier (if needed), the key, the algorithm, and the cose structure it is used with. applications should restrict the use of a single key to a single algorithm. as noted for some of the algorithms in [rfc9053], the use of the same key in different, related algorithms can lead to leakage of information about the key, leakage about the data, or the ability to perform forgeries. * in many cases, applications that make the algorithm identifier implicit will also want to make the context identifier implicit for the same reason. that is, omitting the context identifier will decrease the message size (potentially significantly, depending on the length of the identifier). applications that do this will need to describe the circumstances where the context identifier is to be omitted and how the context identifier is to be inferred in these cases. (an exhaustive search over all of the keys would normally not be considered to be acceptable.) an example of how this can be done is to tie the context to a transaction identifier. both would be sent on the original message, but only the transaction identifier would need to be sent after that point, as the context is tied into the transaction identifier. another way would be to associate a context with a network address. all messages coming from a single network address can be assumed to be associated with a specific context. (in this case, the address would normally be distributed as part of the context.) * applications cannot rely on key identifiers being unique unless they take significant efforts to ensure that they are computed in such a way as to create this guarantee. even when an application does this, the uniqueness might be violated if the application is run in different contexts (i.e., with a different context provider) or if the system combines the security contexts from different applications together into a single store. * applications should continue the practice of protecting the algorithm identifier. since this is not done by placing it in the protected attributes field, applications should define an application-specific external data structure that includes this value. this external data field can be used as such for content encryption, mac, and signature algorithms. it can be used in the suppprivinfo field for those algorithms that use a kdf to derive a key value. applications may also want to protect other information that is part of the context structure as well. it should be noted that those fields, such as the key or a base iv, that are protected by virtue of being used in the cryptographic computation do not need to be included in the external data field. the second case is having multiple implicit algorithm identifiers specified for a multiple-layer cose object. an example of how this would work is the encryption context that an application specifies, which contains a content encryption algorithm, a key wrap algorithm, a key identifier, and a shared secret. the sender omits sending the algorithm identifier for both the content layer and the recipient layer, leaving only the key identifier. the receiver then uses the key identifier to get the implicit algorithm identifiers. the following additional items need to be taken into consideration: * applications that want to support this will need to define a structure that allows for, and clearly identifies, both the cose structure to be used with a given key and the structure and algorithm to be used for the secondary layer. the key for the secondary layer is computed as normal from the recipient layer. the third case is having multiple implicit algorithm identifiers, but targeted at potentially unrelated layers or different cose objects. there are a number of different scenarios where this might be applicable. some of these scenarios are: * two contexts are distributed as a pair. each of the contexts is for use with a cose_encrypt message. each context will consist of distinct secret keys and ivs and potentially even different algorithms. one context is for sending messages from party a to party b, and the second context is for sending messages from party b to party a. this means that there is no chance for a reflection attack to occur, as each party uses different secret keys to send its messages; a message that is reflected back to it would fail to decrypt. * two contexts are distributed as a pair. the first context is used for encryption of the message, and the second context is used to place a countersignature on the message. the intention is that the second context can be distributed to other entities independently of the first context. this allows these entities to validate that the message came from an individual without being able to decrypt the message and see the content. * two contexts are distributed as a pair. the first context contains a key for dealing with maced messages, and the second context contains a different key for dealing with encrypted messages. this allows for a unified distribution of keys to participants for different types of messages that have different keys, but where the keys may be used in a coordinated manner. for these cases, the following additional items need to be considered: * applications need to ensure that the multiple contexts stay associated. if one of the contexts is invalidated for any reason, all of the contexts associated with it should also be invalidated. appendix b. two layers of recipient information all of the currently defined recipient algorithm classes only use two layers of the cose structure. the first layer (cose_encrypt) is the message content, and the second layer (cose_recipient) is the content key encryption. however, if one uses a recipient algorithm such as the rsa key encapsulation mechanism (rsa-kem) (see appendix a of rsa- kem [rfc5990]), then it makes sense to have two layers of the cose_recipient structure. these layers would be: * layer 0: the content encryption layer. this layer contains the payload of the message. * layer 1: the encryption of the cek by a kek. * layer 2: the encryption of a long random secret using an rsa key and a key derivation function to convert that secret into the kek. this is an example of what a triple-layer message would look like. to make it easier to read, it is presented using the extended cbor diagnostic notation (defined in [rfc8610]) rather than as a binary dump. the message has the following layers: * layer 0: has content encrypted with aes-gcm using a 128-bit key. * layer 1: uses the aes key wrap algorithm with a 128-bit key. * layer 2: uses ecdh ephemeral-static direct to generate the layer 1 key. in effect, this example is a decomposed version of using the ecdh- es+a128kw algorithm. size of binary file is 183 bytes 96( [ / cose_encrypt / / protected h'a10101' / << { / alg / 1:1 / aes-gcm 128 / } >>, / unprotected / { / iv / 5:h'02d1f7e6f26c43d4868d87ce' }, / ciphertext / h'64f84d913ba60a76070a9a48f26e97e863e2852948658f0 811139868826e89218a75715b', / recipients / [ [ / cose_recipient / / protected / h'', / unprotected / { / alg / 1:-3 / a128kw / }, / ciphertext / h'dbd43c4e9d719c27c6275c67d628d493f090593db82 18f11', / recipients / [ [ / cose_recipient / / protected h'a1013818' / << { / alg / 1:-25 / ecdh-es + hkdf-256 / } >> , / unprotected / { / ephemeral / -1:{ / kty / 1:2, / crv / -1:1, / x / -2:h'b2add44368ea6d641f9ca9af308b4079aeb519f11 e9b8a55a600b21233e86e68', / y / -3:false }, / kid / 4:'meriadoc.brandybuck@buckland.example' }, / ciphertext / h'' ] ] ] ] ] ) appendix c. examples this appendix includes a set of examples that show the different features and message types that have been defined in this document. to make the examples easier to read, they are presented using the extended cbor diagnostic notation (defined in [rfc8610]) rather than as a binary dump. a github project has been created at [github-examples] that contains not only the examples presented in this document, but a more complete set of testing examples as well. each example is found in a json file that contains the inputs used to create the example, some of the intermediate values that can be used in debugging the example, and the output of the example presented both as a hex dump and in cbor diagnostic notation format. some of the examples at the site are designed to be failure-testing cases; these are clearly marked as such in the json file. if errors in the examples in this document are found, the examples on github will be updated, and a note to that effect will be placed in the json file. as noted, the examples are presented using cbor's diagnostic notation. a ruby-based tool exists that can convert between the diagnostic notation and binary. this tool can be installed with the command line: gem install cbor-diag the diagnostic notation can be converted into binary files using the following command line: diag2cbor.rb < inputfile > outputfile the examples can be extracted from the xml version of this document via an xpath expression, as all of the source code is tagged with the attribute type='cbor-diag'. (depending on the xpath evaluator one is using, it may be necessary to deal with &gt; as an entity.) //sourcecode[@type='cbor-diag']/text() c.1. examples of signed messages c.1.1. single signature this example uses the following: * signature algorithm: ecdsa 
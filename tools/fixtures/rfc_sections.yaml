nprotected / {}, / payload / 'this is the content.', / tag / h'9e1226ba1f81b848', / recipients / [ [ / protected / h'', / unprotected / { / alg / 1:-6 / direct /, / kid / 4:'our-secret' }, / ciphertext / h'' ] ] ] ) c.5.2. ecdh direct mac this example uses the following: * mac: hmac w/sha-256, 256-bit key * recipient class: ecdh key agreement, two static keys, hkdf w/ context structure size of binary file is 214 bytes 97( [ / protected h'a10105' / << { / alg / 1:5 / hmac 256//256 / } >> , / unprotected / {}, / payload / 'this is the content.', / tag / h'81a03448acd3d305376eaa11fb3fe416a955be2cbe7ec96f012c99 4bc3f16a41', / recipients / [ [ / protected h'a101381a' / << { / alg / 1:-27 / ecdh-ss + hkdf-256 / } >> , / unprotected / { / static kid / -3:'peregrin.took@tuckborough.example', / kid / 4:'meriadoc.brandybuck@buckland.example', / u nonce / -22:h'4d8553e7e74f3c6a3a9dd3ef286a8195cbf8a23d 19558ccfec7d34b824f42d92bd06bd2c7f0271f0214e141fb779ae2856abf585a583 68b017e7f2a9e5ce4db5' }, / ciphertext / h'' ] ] ] ) c.5.3. wrapped mac this example uses the following: * mac: aes-mac, 128-bit key, truncated to 64 bits * recipient class: aes key wrap w/ a preshared 256-bit key size of binary file is 109 bytes 97( [ / protected h'a1010e' / << { / alg / 1:14 / aes-cbc-mac-128//64 / } >> , / unprotected / {}, / payload / 'this is the content.', / tag / h'36f5afaf0bab5d43', / recipients / [ [ / protected / h'', / unprotected / { / alg / 1:-5 / a256kw /, / kid / 4:'018c0ae5-4d9b-471b-bfd6-eef314bc7037' }, / ciphertext / h'711ab0dc2fc4585dce27effa6781c8093eba906f227 b6eb0' ] ] ] ) c.5.4. multi-recipient maced message this example uses the following: * mac: hmac w/ sha-256, 128-bit key * recipient class: uses two different methods. 1. ecdh ephemeral-static, curve p-521, aes key wrap w/ 128-bit key 2. aes key wrap w/ 256-bit key size of binary file is 309 bytes 97( [ / protected h'a10105' / << { / alg / 1:5 / hmac 256//256 / } >> , / unprotected / {}, / payload / 'this is the content.', / tag / h'bf48235e809b5c42e995f2b7d5fa13620e7ed834e337f6aa43df16 1e49e9323e', / recipients / [ [ / protected h'a101381c' / << { / alg / 1:-29 / ecdh-es+a128kw / } >> , / unprotected / { / ephemeral / -1:{ / kty / 1:2, / crv / -1:3, / x / -2:h'0043b12669acac3fd27898ffba0bcd2e6c366d53bc4db 71f909a759304acfb5e18cdc7ba0b13ff8c7636271a6924b1ac63c02688075b55ef2 d613574e7dc242f79c3', / y / -3:true }, / kid / 4:'bilbo.baggins@hobbiton.example' }, / ciphertext / h'339bc4f79984cdc6b3e6ce5f315a4c7d2b0ac466fce a69e8c07dfbca5bb1f661bc5f8e0df9e3eff5' ], [ / protected / h'', / unprotected / { / alg / 1:-5 / a256kw /, / kid / 4:'018c0ae5-4d9b-471b-bfd6-eef314bc7037' }, / ciphertext / h'0b2c7cfce04e98276342d6476a7723c090dfdd15f9a 518e7736549e998370695e6d6a83b4ae507bb' ] ] ] ) c.6. examples of mac0 messages c.6.1. shared-secret direct mac this example uses the following: * mac: aes-cmac, 256-bit key, truncated to 64 bits * recipient class: direct shared secret size of binary file is 37 bytes 17( [ / protected h'a1010f' / << { / alg / 1:15 / aes-cbc-mac-256//64 / } >> , / unprotected / {}, / payload / 'this is the content.', / tag / h'726043745027214f' ] ) note that this example uses the same inputs as appendix c.5.1. c.7. cose keys c.7.1. public keys this is an example of a cose key set. this example includes the public keys for all of the previous examples. in order, the keys are: * an ec key with a kid of \"meriadoc.brandybuck@buckland.example\" * an ec key with a kid of \"11\" * an ec key with a kid of \"bilbo.baggins@hobbiton.example\" * an ec key with a kid of \"peregrin.took@tuckborough.example\" size of binary file is 481 bytes [ { -1:1, -2:h'65eda5a12577c2bae829437fe338701a10aaa375e1bb5b5de108de439c0 8551d', -3:h'1e52ed75701163f7f9e40ddf9f341b3dc9ba860af7e0ca7ca7e9eecd008 4d19c', 1:2, 2:'meriadoc.brandybuck@buckland.example' }, { -1:1, -2:h'bac5b11cad8f99f9c72b05cf4b9e26d244dc189f745228255a219a86d6a 09eff', -3:h'20138bf82dc1b6d562be0fa54ab7804a3a64b6d72ccfed6b6fb6ed28bbf c117e', 1:2, 2:'11' }, { -1:3, -2:h'0072992cb3ac08ecf3e5c63dedec0d51a8c1f79ef2f82f94f3c737bf5de 7986671eac625fe8257bbd0394644caaa3aaf8f27a4585fbbcad0f2457620085e5c8 f42ad', -3:h'01dca6947bce88bc5790485ac97427342bc35f887d86d65a089377e247e 60baa55e4e8501e2ada5724ac51d6909008033ebc10ac999b9d7f5cc2519f3fe1ea1 d9475', 1:2, 2:'bilbo.baggins@hobbiton.example' }, { -1:1, -2:h'98f50a4ff6c05861c8860d13a638ea56c3f5ad7590bbfbf054e1c7b4d91 d6280', -3:h'f01400b089867804b8e9fc96c3932161f1934f4223069170d924b7e03bf 822bb', 1:2, 2:'peregrin.took@tuckborough.example' } ] c.7.2. private keys this is an example of a cose key set. this example includes the private keys for all of the previous examples. in order the keys are: * an ec key with a kid of \"meriadoc.brandybuck@buckland.example\" * an ec key with a kid of \"11\" * an ec key with a kid of \"bilbo.baggins@hobbiton.example\" * a shared-secret key with a kid of \"our-secret\" * an ec key with a kid of \"peregrin.took@tuckborough.example\" * a shared-secret key with kid \"our-secret2\" * a shared-secret key with a kid of \"018c0ae5-4d9b-471b- bfd6-eef314bc7037\" size of binary file is 816 bytes [ { 1:2, 2:'meriadoc.brandybuck@buckland.example', -1:1, -2:h'65eda5a12577c2bae829437fe338701a10aaa375e1bb5b5de108de439c0 8551d', -3:h'1e52ed75701163f7f9e40ddf9f341b3dc9ba860af7e0ca7ca7e9eecd008 4d19c', -4:h'aff907c99f9ad3aae6c4cdf21122bce2bd68b5283e6907154ad911840fa 208cf' }, { 1:2, 2:'11', -1:1, -2:h'bac5b11cad8f99f9c72b05cf4b9e26d244dc189f745228255a219a86d6a 09eff', -3:h'20138bf82dc1b6d562be0fa54ab7804a3a64b6d72ccfed6b6fb6ed28bbf c117e', -4:h'57c92077664146e876760c9520d054aa93c3afb04e306705db609030850 7b4d3' }, { 1:2, 2:'bilbo.baggins@hobbiton.example', -1:3, -2:h'0072992cb3ac08ecf3e5c63dedec0d51a8c1f79ef2f82f94f3c737bf5de 7986671eac625fe8257bbd0394644caaa3aaf8f27a4585fbbcad0f2457620085e5c8 f42ad', -3:h'01dca6947bce88bc5790485ac97427342bc35f887d86d65a089377e247e 60baa55e4e8501e2ada5724ac51d6909008033ebc10ac999b9d7f5cc2519f3fe1ea1 d9475', -4:h'00085138ddabf5ca975f5860f91a08e91d6d5f9a76ad4018766a476680b 55cd339e8ab6c72b5facdb2a2a50ac25bd086647dd3e2e6e99e84ca2c3609fdf177f eb26d' }, { 1:4, 2:'our-secret', -1:h'849b57219dae48de646d07dbb533566e976686457c1491be3a76dcea6c4 27188' }, { 1:2, -1:1, 2:'peregrin.took@tuckborough.example', -2:h'98f50a4ff6c05861c8860d13a638ea56c3f5ad7590bbfbf054e1c7b4d91 d6280', -3:h'f01400b089867804b8e9fc96c3932161f1934f4223069170d924b7e03bf 822bb', -4:h'02d1f7e6f26c43d4868d87ceb2353161740aacf1f7163647984b522a848 df1c3' }, { 1:4, 2:'our-secret2', -1:h'849b5786457c1491be3a76dcea6c4271' }, { 1:4, 2:'018c0ae5-4d9b-471b-bfd6-eef314bc7037', -1:h'849b57219dae48de646d07dbb533566e976686457c1491be3a76dcea6c4 27188' } ] acknowledgments this document is a product of the cose working group of the ietf. the following individuals are to blame for getting me started on this project in the first place: richard barnes, matt miller, and martin thomson. the initial draft version of the specification was based to some degree on the outputs of the jose and s/mime working groups. the following individuals provided input into the final form of the document: carsten bormann, john bradley, brian campbell, michael b. jones, ilari liusvaara, francesca palombini, ludwig seitz, and göran selander. author's address jim schaad august cellars "
- rfc: 8949
  url: https://www.rfc-editor.org/rfc/rfc8949.txt
  recorded_at: '2026-10-03T15:35:53+00:00'
  body_sha256: f1164a5b31a39350ad46abe29b83575eb933ca6c45366989c118b6b1058a214a

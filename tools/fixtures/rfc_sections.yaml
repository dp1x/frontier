    | follows)                                       |\n      +------------+------------------------------------------------+\n      | 0x39       | negative integer -1-n (two-byte uint16_t for n |\n      |            | follows)                                       |\n      +------------+------------------------------------------------+\n      | 0x3a       | negative integer -1-n (four-byte uint32_t for  |\n      |            | n follows)                                     |\n      +------------+------------------------------------------------+\n      | 0x3b       | negative integer -1-n (eight-byte uint64_t for |\n      |            | n follows)                                     |\n      +------------+------------------------------------------------+\n      | 0x40..0x57 | byte string (0x00..0x17 bytes follow)          |\n      +------------+------------------------------------------------+\n      | 0x58       | byte string (one-byte uint8_t for n, and then  |\n      |            | n bytes follow)                                |\n      +------------+------------------------------------------------+\n      | 0x59       | byte string (two-byte uint16_t for n, and then |\n      |            | n bytes follow)                                |\n      +------------+------------------------------------------------+\n      | 0x5a       | byte string (four-byte uint32_t for n, and     |\n      |            | then n bytes follow)                           |\n      +------------+------------------------------------------------+\n      | 0x5b       | byte string (eight-byte uint64_t for n, and    |\n      |            | then n bytes follow)                           |\n      +------------+------------------------------------------------+\n      | 0x5f       | byte string, byte strings follow, terminated   |\n      |            | by \"break\"                                     |\n      +------------+------------------------------------------------+\n      | 0x60..0x77 | UTF-8 string (0x00..0x17 bytes follow)         |\n      +------------+------------------------------------------------+\n      | 0x78       | UTF-8 string (one-byte uint8_t for n, and then |\n      |            | n bytes follow)                                |\n      +------------+------------------------------------------------+\n      | 0x79       | UTF-8 string (two-byte uint16_t for n, and     |\n      |            | then n bytes follow)                           |\n      +------------+------------------------------------------------+\n      | 0x7a       | UTF-8 string (four-byte uint32_t for n, and    |\n      |            | then n bytes follow)                           |\n      +------------+------------------------------------------------+\n      | 0x7b       | UTF-8 string (eight-byte uint64_t for n, and   |\n      |            | then n bytes follow)                           |\n      +------------+------------------------------------------------+\n      | 0x7f       | UTF-8 string, UTF-8 strings follow, terminated |\n      |            | by \"break\"                                     |\n      +------------+------------------------------------------------+\n      | 0x80..0x97 | array (0x00..0x17 data items follow)           |\n      +------------+------------------------------------------------+\n      | 0x98       | array (one-byte uint8_t for n, and then n data |\n      |            | items follow)                                  |\n      +------------+------------------------------------------------+\n      | 0x99       | array (two-byte uint16_t for n, and then n     |\n      |            | data items follow)                             |\n      +------------+------------------------------------------------+\n      | 0x9a       | array (four-byte uint32_t for n, and then n    |\n      |            | data items follow)                             |\n      +------------+------------------------------------------------+\n      | 0x9b       | array (eight-byte uint64_t for n, and then n   |\n      |            | data items follow)                             |\n      +------------+------------------------------------------------+\n      | 0x9f       | array, data items follow, terminated by        |\n      |            | \"break\"                                        |\n      +------------+------------------------------------------------+\n      | 0xa0..0xb7 | map (0x00..0x17 pairs of data items follow)    |\n      +------------+------------------------------------------------+\n      | 0xb8       | map (one-byte uint8_t for n, and then n pairs  |\n      |            | of data items follow)                          |\n      +------------+------------------------------------------------+\n      | 0xb9       | map (two-byte uint16_t for n, and then n pairs |\n      |            | of data items follow)                          |\n      +------------+------------------------------------------------+\n      | 0xba       | map (four-byte uint32_t for n, and then n      |\n      |            | pairs of data items follow)                    |\n      +------------+------------------------------------------------+\n      | 0xbb       | map (eight-byte uint64_t for n, and then n     |\n      |            | pairs of data items follow)                    |\n      +------------+------------------------------------------------+\n      | 0xbf       | map, pairs of data items follow, terminated by |\n      |            | \"break\"                                        |\n      +------------+------------------------------------------------+\n      | 0xc0       | text-based date/time (data item follows; see   |\n      |            | Section 3.4.1)                                 |\n      +------------+------------------------------------------------+\n      | 0xc1       | epoch-based date/time (data item follows; see  |\n      |            | Section 3.4.2)                                 |\n      +------------+------------------------------------------------+\n      | 0xc2       | unsigned bignum (data item \"byte string\"       |\n      |            | follows)                                       |\n      +------------+------------------------------------------------+\n      | 0xc3       | negative bignum (data item \"byte string\"       |\n      |            | follows)                                       |\n      +------------+------------------------------------------------+\n      | 0xc4       | decimal Fraction (data item \"array\" follows;   |\n      |            | see Section 3.4.4)                             |\n      +------------+------------------------------------------------+\n      | 0xc5       | bigfloat (data item \"array\" follows; see       |\n      |            | Section 3.4.4)                                 |\n      +------------+------------------------------------------------+\n      | 0xc6..0xd4 | (tag)                                          |\n      +------------+------------------------------------------------+\n      | 0xd5..0xd7 | expected conversion (data item follows; see    |\n      |            | Section 3.4.5.2)                               |\n      +------------+------------------------------------------------+\n      | 0xd8..0xdb | (more tags; 1/2/4/8 bytes of tag number and    |\n      |            | then a data item follow)                       |\n      +------------+------------------------------------------------+\n      | 0xe0..0xf3 | (simple value)                                 |\n      +------------+------------------------------------------------+\n      | 0xf4       | false                                          |\n      +------------+------------------------------------------------+\n      | 0xf5       | true                                           |\n      +------------+------------------------------------------------+\n      | 0xf6       | null                                           |\n      +------------+------------------------------------------------+\n      | 0xf7       | undefined                                      |\n      +------------+------------------------------------------------+\n      | 0xf8       | (simple value, one byte follows)               |\n      +------------+------------------------------------------------+\n      | 0xf9       | half-precision float (two-byte IEEE 754)       |\n      +------------+------------------------------------------------+\n      | 0xfa       | single-precision float (four-byte IEEE 754)    |\n      +------------+------------------------------------------------+\n      | 0xfb       | double-precision float (eight-byte IEEE 754)   |\n      +------------+------------------------------------------------+\n      | 0xff       | \"break\" stop code                              |\n      +------------+------------------------------------------------+\n\n                    Table 7: Jump Table for Initial Byte\n\nAppendix C.  Pseudocode\n\n   The well-formedness of a CBOR item can be checked by the pseudocode\n   in Figure 1.  The data is well-formed if and only if:\n\n   *  the pseudocode does not \"fail\";\n\n   *  after execution of the pseudocode, no bytes are left in the input\n      (except in streaming applications).\n\n   The pseudocode has the following prerequisites:\n\n   *  take(n) reads n bytes from the input data and returns them as a\n      byte string.  If n bytes are no longer available, take(n) fails.\n\n   *  uint() converts a byte string into an unsigned integer by\n      interpreting the byte string in network byte order.\n\n   *  Arithmetic works as in C.\n\n   *  All variables are unsigned integers of sufficient range.\n\n   Note that \"well_formed\" returns the major type for well-formed\n   definite-length items, but 99 for an indefinite-length item (or -1\n   for a \"break\" stop code, only if \"breakable\" is set).  This is used\n   in \"well_formed_indefinite\" to ascertain that indefinite-length\n   strings only contain definite-length strings as chunks.\n\n   well_formed(breakable = false) {\n     // process initial bytes\n     ib = uint(take(1));\n     mt = ib >> 5;\n     val = ai = ib & 0x1f;\n     switch (ai) {\n       case 24: val = uint(take(1)); break;\n       case 25: val = uint(take(2)); break;\n       case 26: val = uint(take(4)); break;\n       case 27: val = uint(take(8)); break;\n       case 28: case 29: case 30: fail();\n       case 31:\n         return well_formed_indefinite(mt, breakable);\n     }\n     // process content\n     switch (mt) {\n       // case 0, 1, 7 do not have content; just use val\n       case 2: case 3: take(val); break; // bytes/UTF-8\n       case 4: for (i = 0; i < val; i++) well_formed(); break;\n       case 5: for (i = 0; i < val*2; i++) well_formed(); break;\n       case 6: well_formed(); break;     // 1 embedded data item\n       case 7: if (ai == 24 && val < 32) fail(); // bad simple\n     }\n     return mt;                    // definite-length data item\n   }\n\n   well_formed_indefinite(mt, breakable) {\n     switch (mt) {\n       case 2: case 3:\n         while ((it = well_formed(true)) != -1)\n           if (it != mt)           // need definite-length chunk\n             fail();               //    of same type\n         break;\n       case 4: while (well_formed(true) != -1); break;\n       case 5: while (well_formed(true) != -1) well_formed(); break;\n       case 7:\n         if (breakable)\n           return -1;              // signal break out\n         else fail();              // no enclosing indefinite\n       default: fail();            // wrong mt\n     }\n     return 99;                    // indefinite-length data item\n   }\n\n               Figure 1: Pseudocode for Well-Formedness Check\n\n   Note that the remaining complexity of a complete CBOR decoder is\n   about presenting data that has been decoded to the application in an\n   appropriate form.\n\n   Major types 0 and 1 are designed in such a way that they can be\n   encoded in C from a signed integer without actually doing an if-then-\n   else for positive/negative (Figure 2).  This uses the fact that\n   (-1-n), the transformation for major type 1, is the same as ~n\n   (bitwise complement) in C unsigned arithmetic; ~n can then be\n   expressed as (-1)^n for the negative case, while 0^n leaves n\n   unchanged for nonnegative.  The sign of a number can be converted to\n   -1 for negative and 0 for nonnegative (0 or positive) by arithmetic-\n   shifting the number by one bit less than the bit length of the number\n   (for example, by 63 for 64-bit numbers).\n\n   void encode_sint(int64_t n) {\n     uint64t ui = n >> 63;    // extend sign to whole length\n     unsigned mt = ui & 0x20; // extract (shifted) major type\n     ui ^= n;                 // complement negatives\n     if (ui < 24)\n       *p++ = mt + ui;\n     else if (ui < 256) {\n       *p++ = mt + 24;\n       *p++ = ui;\n     } else\n          ...\n\n             Figure 2: Pseudocode for Encoding a Signed Integer\n\n   See Section 1.2 for some specific assumptions about the profile of\n   the C language used in these pieces of code.\n\nAppendix D.  Half-Precision\n\n   As half-precision floating-point numbers were only added to IEEE 754\n   in 2008 [IEEE754], today's programming platforms often still only\n   have limited support for them.  It is very easy to include at least\n   decoding support for them even without such support.  An example of a\n   small decoder for half-precision floating-point numbers in the C\n   language is shown in Figure 3.  A similar program for Python is in\n   Figure 4; this code assumes that the 2-byte value has already been\n   decoded as an (unsigned short) integer in network byte order (as\n   would be done by the pseudocode in Appendix C).\n\n   #include <math.h>\n\n   double decode_half(unsigned char *halfp) {\n     unsigned half = (halfp[0] << 8) + halfp[1];\n     unsigned exp = (half >> 10) & 0x1f;\n     unsigned mant = half & 0x3ff;\n     double val;\n     if (exp == 0) val = ldexp(mant, -24);\n     else if (exp != 31) val = ldexp(mant + 1024, exp - 25);\n     else val = mant == 0 ? INFINITY : NAN;\n     return half & 0x8000 ? -val : val;\n   }\n\n               Figure 3: C Code for a Half-Precision Decoder\n\n   import struct\n   from math import ldexp\n\n   def decode_single(single):\n       return struct.unpack(\"!f\", struct.pack(\"!I\", single))[0]\n\n   def decode_half(half):\n       valu = (half & 0x7fff) << 13 | (half & 0x8000) << 16\n       if ((half & 0x7c00) != 0x7c00):\n           return ldexp(decode_single(valu), 112)\n       return decode_single(valu | 0x7f800000)\n\n             Figure 4: Python Code for a Half-Precision Decoder\n\nAppendix E.  Comparison of Other Binary Formats to CBOR's Design\n             Objectives\n\n   The proposal for CBOR follows a history of binary formats that is as\n   long as the history of computers themselves.  Different formats have\n   had different objectives.  In most cases, the objectives of the\n   format were never stated, although they can sometimes be implied by\n   the context where the format was first used.  Some formats were meant\n   to be universally usable, although history has proven that no binary\n   format meets the needs of all protocols and applications.\n\n   CBOR differs from many of these formats due to it starting with a set\n   of objectives and attempting to meet just those.  This section\n   compares a few of the dozens of formats with CBOR's objectives in\n   order to help the reader decide if they want to use CBOR or a\n   different format for a particular protocol or application.\n\n   Note that the discussion here is not meant to be a criticism of any\n   format: to the best of our knowledge, no format before CBOR was meant\n   to cover CBOR's objectives in the priority we have assigned them.  A\n   brief recap of the objectives from Section 1.1 is:\n\n   1.  unambiguous encoding of most common data formats from Internet\n       standards\n\n   2.  code compactness for encoder or decoder\n\n   3.  no schema description needed\n\n   4.  reasonably compact serialization\n\n   5.  applicability to constrained and unconstrained applications\n\n   6.  good JSON conversion\n\n   7.  extensibility\n\n   A discussion of CBOR and other formats with respect to a different\n   set of design objectives is provided in Section 5 and Appendix C of\n   [RFC8618].\n\nE.1.  ASN.1 DER, BER, and PER\n\n   [ASN.1] has many serializations.  In the IETF, DER and BER are the\n   most common.  The serialized output is not particularly compact for\n   many items, and the code needed to decode numeric items can be\n   complex on a constrained device.\n\n   Few (if any) IETF protocols have adopted one of the several variants\n   of Packed Encoding Rules (PER).  There could be many reasons for\n   this, but one that is commonly stated is that PER makes use of the\n   schema even for parsing the surface structure of the data item,\n   requiring significant tool support.  There are different versions of\n   the ASN.1 schema language in use, which has also hampered adoption.\n\nE.2.  MessagePack\n\n   [MessagePack] is a concise, widely implemented counted binary\n   serialization format, similar in many properties to CBOR, although\n   somewhat less regular.  While the data model can be used to represent\n   JSON data, MessagePack has also been used in many remote procedure\n   call (RPC) applications and for long-term storage of data.\n\n   MessagePack has been essentially stable since it was first published\n   around 2011; it has not yet had a transition.  The evolution of\n   MessagePack is impeded by an imperative to maintain complete\n   backwards compatibility with existing stored data, while only few\n   bytecodes are still available for extension.  Repeated requests over\n   the years from the MessagePack user community to separate out binary\n   and text strings in the encoding recently have led to an extension\n   proposal that would leave MessagePack's \"raw\" data ambiguous between\n   its usages for binary and text data.  The extension mechanism for\n   MessagePack remains unclear.\n\nE.3.  BSON\n\n   [BSON] is a data format that was developed for the storage of JSON-\n   like maps (JSON objects) in the MongoDB database.  Its major\n   distinguishing feature is the capability for in-place update, which\n   prevents a compact representation.  BSON uses a counted\n   representation except for map keys, which are null-byte terminated.\n   While BSON can be used for the representation of JSON-like objects on\n   the wire, its specification is dominated by the requirements of the\n   database application and has become somewhat baroque.  The status of\n   how BSON extensions will be implemented remains unclear.\n\nE.4.  MSDTP: RFC 713\n\n   Message Services Data Transmission (MSDTP) is a very early example of\n   a compact message format; it is described in [RFC0713], written in\n   1976.  It is included here for its historical value, not because it\n   was ever widely used.\n\nE.5.  Conciseness on the Wire\n\n   While CBOR's design objective of code compactness for encoders and\n   decoders is a higher priority than its objective of conciseness on\n   the wire, many people focus on the wire size.  Table 8 shows some\n   encoding examples for the simple nested array [1, [2, 3]]; where some\n   form of indefinite-length encoding is supported by the encoding,\n   [_ 1, [2, 3]] (indefinite length on the outer array) is also shown.\n\n       +=============+============================+================+\n       | Format      | [1, [2, 3]]                | [_ 1, [2, 3]]  |\n       +=============+============================+================+\n       | RFC 713     | c2 05 81 c2 02 82 83       |                |\n       +-------------+----------------------------+----------------+\n       | ASN.1 BER   | 30 0b 02 01 01 30 06 02 01 | 30 80 02 01 01 |\n       |             | 02 02 01 03                | 30 06 02 01 02 |\n       |             |                            | 02 01 03 00 00 |\n       +-------------+----------------------------+----------------+\n       | MessagePack | 92 01 92 02 03             |                |\n       +-------------+----------------------------+----------------+\n       | BSON        | 22 00 00 00 10 30 00 01 00 |                |\n       |             | 00 00 04 31 00 13 00 00 00 |                |\n       |             | 10 30 00 02 00 00 00 10 31 |                |\n       |             | 00 03 00 00 00 00 00       |                |\n       +-------------+----------------------------+----------------+\n       | CBOR        | 82 01 82 02 03             | 9f 01 82 02 03 |\n       |             |                            | ff             |\n       +-------------+----------------------------+----------------+\n\n           Table 8: Examples for Different Levels of Conciseness\n\nAppendix F.  Well-Formedness Errors and Examples\n\n   There are three basic kinds of well-formedness errors that can occur\n   in decoding a CBOR data item:\n\n   Too much data:  There are input bytes left that were not consumed.\n      This is only an error if the application assumed that the input\n      bytes would span exactly one data item.  Where the application\n      uses the self-delimiting nature of CBOR encoding to permit\n      additional data after the data item, as is done in CBOR sequences\n      [RFC8742], for example, the CBOR decoder can simply indicate which\n      part of the input has not been consumed.\n\n   Too little data:  The input data available would need additional\n      bytes added at their end for a complete CBOR data item.  This may\n      indicate the input is truncated; it is also a common error when\n      trying to decode random data as CBOR.  For some applications,\n      however, this may not actually be an error, as the application may\n      not be certain it has all the data yet and can obtain or wait for\n      additional input bytes.  Some of these applications may have an\n      upper limit for how much additional data can appear; here the\n      decoder may be able to indicate that the encoded CBOR data item\n      cannot be completed within this limit.\n\n   Syntax error:  The input data are not consistent with the\n      requirements of the CBOR encoding, and this cannot be remedied by\n      adding (or removing) data at the end.\n\n   In Appendix C, errors of the first kind are addressed in the first\n   paragraph and bullet list (requiring \"no bytes are left\"), and errors\n   of the second kind are addressed in the second paragraph/bullet list\n   (failing \"if n bytes are no longer available\").  Errors of the third\n   kind are identified in the pseudocode by specific instances of\n   calling fail(), in order:\n\n   *  a reserved value is used for additional information (28, 29, 30)\n\n   *  major type 7, additional information 24, value < 32 (incorrect)\n\n   *  incorrect substructure of indefinite-length byte string or text\n      string (may only contain definite-length strings of the same major\n      type)\n\n   *  \"break\" stop code (major type 7, additional information 31) occurs\n      in a value position of a map or except at a position directly in\n      an indefinite-length item where also another enclosed data item\n      could occur\n\n   *  additional information 31 used with major type 0, 1, or 6\n\nF.1.  Examples of CBOR Data Items That Are Not Well-Formed\n\n   This subsection shows a few examples for CBOR data items that are not\n   well-formed.  Each example is a sequence of bytes, each shown in\n   hexadecimal; multiple examples in a list are separated by commas.\n\n   Examples for well-formedness error kind 1 (too much data) can easily\n   be formed by adding data to a well-formed encoded CBOR data item.\n\n   Similarly, examples for well-formedness error kind 2 (too little\n   data) can be formed by truncating a well-formed encoded CBOR data\n   item.  In test suites, it may be beneficial to specifically test with\n   incomplete data items that would require large amounts of addition to\n   be completed (for instance by starting the encoding of a string of a\n   very large size).\n\n   A premature end of the input can occur in a head or within the\n   enclosed data, which may be bare strings or enclosed data items that\n   are either counted or should have been ended by a \"break\" stop code.\n\n   End of input in a head:  18, 19, 1a, 1b, 19 01, 1a 01 02, 1b 01 02 03\n      04 05 06 07, 38, 58, 78, 98, 9a 01 ff 00, b8, d8, f8, f9 00, fa 00\n      00, fb 00 00 00\n\n   Definite-length strings with short data:  41, 61, 5a ff ff ff ff 00,\n      5b ff ff ff ff ff ff ff ff 01 02 03, 7a ff ff ff ff 00, 7b 7f ff\n      ff ff ff ff ff ff 01 02 03\n\n   Definite-length maps and arrays not closed with enough items:  81, 81\n      81 81 81 81 81 81 81 81, 82 00, a1, a2 01 02, a1 00, a2 00 00 00\n\n   Tag number not followed by tag content:  c0\n\n   Indefinite-length strings not closed by a \"break\" stop code:  5f 41\n      00, 7f 61 00\n\n   Indefinite-length maps and arrays not closed by a \"break\" stop\n   code:  9f, 9f 01 02, bf, bf 01 02 01 02, 81 9f, 9f 80 00, 9f 9f 9f 9f\n      9f ff ff ff ff, 9f 81 9f 81 9f 9f ff ff ff\n\n   A few examples for the five subkinds of well-formedness error kind 3\n   (syntax error) are shown below.\n\n   Subkind 1:\n      Reserved additional information values:  1c, 1d, 1e, 3c, 3d, 3e,\n         5c, 5d, 5e, 7c, 7d, 7e, 9c, 9d, 9e, bc, bd, be, dc, dd, de, fc,\n         fd, fe,\n\n   Subkind 2:\n      Reserved two-byte encodings of simple values:  f8 00, f8 01, f8\n         18, f8 1f\n\n   Subkind 3:\n      Indefinite-length string chunks not of the correct type:  5f 00\n         ff, 5f 21 ff, 5f 61 00 ff, 5f 80 ff, 5f a0 ff, 5f c0 00 ff, 5f\n         e0 ff, 7f 41 00 ff\n\n      Indefinite-length string chunks not definite length:  5f 5f 41 00\n         ff ff, 7f 7f 61 00 ff ff\n\n   Subkind 4:\n      Break occurring on its own outside of an indefinite-length\n      item:  ff\n\n      Break occurring in a definite-length array or map or a tag:  81\n         ff, 82 00 ff, a1 ff, a1 ff 00, a1 00 ff, a2 00 00 ff, 9f 81 ff,\n         9f 82 9f 81 9f 9f ff ff ff ff\n\n      Break in an indefinite-length map that would lead to an odd\n      number of items (break in a value position):  bf 00 ff, bf 00 00\n         00 ff\n\n   Subkind 5:\n      Major type 0, 1, 6 with additional information 31:  1f, 3f, df\n\nAppendix G.  Changes from RFC 7049\n\n   As discussed in the introduction, this document formally obsoletes\n   RFC 7049 while keeping full compatibility with the interchange format\n   from RFC 7049.  This document provides editorial improvements, added\n   detail, and fixed errata.  This document does not create a new\n   version of the format.\n\nG.1.  Errata Processing and Clerical Changes\n\n   The two verified errata on RFC 7049, [Err3764] and [Err3770],\n   concerned two encoding examples in the text that have been corrected\n   (Section 3.4.3: \"29\" -> \"49\", Section 5.5: \"0b000_11101\" ->\n   \"0b000_11001\").  Also, RFC 7049 contained an example using the\n   numeric value 24 for a simple value [Err5917], which is not well-\n   formed; this example has been removed.  Errata report 5763 [Err5763]\n   pointed to an error in the wording of the definition of tags; this\n   was resolved during a rewrite of Section 3.4.  Errata report 5434\n   [Err5434] pointed out that the Universal Binary JSON (UBJSON) example\n   in Appendix E no longer complied with the version of UBJSON current\n   at the time of the errata report submission.  It turned out that the\n   UBJSON specification had completely changed since 2013; this example\n   therefore was removed.  Other errata reports [Err4409] [Err4963]\n   [Err4964] complained that the map key sorting rules for canonical\n   encoding were onerous; these led to a reconsideration of the\n   canonical encoding suggestions and replacement by the deterministic\n   encoding suggestions (described below).  An editorial suggestion in\n   errata report 4294 [Err4294] was also implemented (improved symmetry\n   by adding \"Second value\" to a comment to the last example in\n   Section 3.2.2).\n\n   Other clerical changes include:\n\n   *  the use of new xml2rfc functionality [RFC7991];\n\n   *  more explanation of the notation used;\n\n   *  the update of references, e.g., from RFC 4627 to [RFC8259], from\n      CNN-TERMS to [RFC7228], and from the 5.1 edition to the 11th\n      edition of [ECMA262]; the addition of a reference to [IEEE754] and\n      importation of required definitions; the addition of references to\n      [C] and [Cplusplus20]; and the addition of a reference to\n      [RFC8618] that further illustrates the discussion in Appendix E;\n\n   *  in the discussion of diagnostic notation (Section 8), the\n      \"Extended Diagnostic Notation\" (EDN) defined in [RFC8610] is now\n      mentioned, the gap in representing NaN payloads is now\n      highlighted, and an explanation of representing indefinite-length\n      strings with no chunks has been added (Section 8.1);\n\n   *  the addition of this appendix.\n\nG.2.  Changes in IANA Considerations\n\n   The IANA considerations were generally updated (clerical changes,\n   e.g., now pointing to the CBOR Working Group as the author of the\n   specification).  References to the respective IANA registries were\n   added to the informative references.\n\n   In the \"Concise Binary Object Representation (CBOR) Tags\" registry\n   [IANA.cbor-tags], tags in the space from 256 to 32767 (lower half of\n   \"1+2\") are no longer assigned by First Come First Served; this range\n   is now Specification Required.\n\nG.3.  Changes in Suggestions and Other Informational Components\n\n   While revising the document, beyond the addressing of the errata\n   reports, the working group drew upon nearly seven years of experience\n   with CBOR in a diverse set of applications.  This led to a number of\n   editorial changes, including adding tables for illustration, but also\n   emphasizing some aspects and de-emphasizing others.\n\n   A significant addition is Section 2, which discusses the CBOR data\n   model and its small variations involved in the processing of CBOR.\n   The introduction of terms for those variations (basic generic,\n   extended generic, specific) enables more concise language in other\n   places of the document and also helps to clarify expectations of\n   implementations and of the extensibility features of the format.\n\n   As a format derived from the JSON ecosystem, RFC 7049 was influenced\n   by the JSON number system that was in turn inherited from JavaScript\n   at the time.  JSON does not provide distinct integers and floating-\n   point values (and the latter are decimal in the format).  CBOR\n   provides binary representations of numbers, which do differ between\n   integers and floating-point values.  Experience from implementation\n   and use suggested that the separation between these two number\n   domains should be more clearly drawn in the document; language that\n   suggested an integer could seamlessly stand in for a floating-point\n   value was removed.  Also, a suggestion (based on I-JSON [RFC7493])\n   was added for handling these types when converting JSON to CBOR, and\n   the use of a specific rounding mechanism has been recommended.\n\n   For a single value in the data model, CBOR often provides multiple\n   encoding options.  A new section (Section 4) introduces the term\n   \"preferred serialization\" (Section 4.1) and defines it for various\n   kinds of data items.  On the basis of this terminology, the section\n   then discusses how a CBOR-based protocol can define \"deterministic\n   encoding\" (Section 4.2), which avoids terms \"canonical\" and\n   \"canonicalization\" from RFC 7049.  The suggestion of \"Core\n   Deterministic Encoding Requirements\" (Section 4.2.1) enables generic\n   support for such protocol-defined encoding requirements.  This\n   document further eases the implementation of deterministic encoding\n   by simplifying the map ordering suggested in RFC 7049 to a simple\n   lexicographic ordering of encoded keys.  A description of the older\n   suggestion is kept as an alternative, now termed \"length-first map\n   key ordering\" (Section 4.2.3).\n\n   The terminology for well-formed and valid data was sharpened and more\n   stringently used, avoiding less well-defined alternative terms such\n   as \"syntax error\", \"decoding error\", and \"strict mode\" outside of\n   examples.  Also, a third level of requirements that an application\n   has on its input data beyond CBOR-level validity is now explicitly\n   called out.  Well-formed (processable at all), valid (checked by a\n   validity-checking generic decoder), and expected input (as checked by\n   the application) are treated as a hierarchy of layers of\n   acceptability.\n\n   The handling of non-well-formed simple values was clarified in text\n   and pseudocode.  Appendix F was added to discuss well-formedness\n   errors and provide examples for them.  The pseudocode was updated to\n   be more portable, and some portability considerations were added.\n\n   The discussion of validity has been sharpened in two areas.  Map\n   validity (handling of duplicate keys) was clarified, and the domain\n   of applicability of certain implementation choices explained.  Also,\n   while streamlining the terminology for tags, tag numbers, and tag\n   content, discussion was added on tag validity, and the restrictions\n   were clarified on tag content, in general and specifically for tag 1.\n\n   An implementation note (and note for future tag definitions) was\n   added to Section 3.4 about defining tags with semantics that depend\n   on serialization order.\n\n   Tag 35 is not defined by this document; the registration based on the\n   definition in RFC 7049 remains in place.\n\n   Terminology was introduced in Section 3 for \"argument\" and \"head\",\n   simplifying further discussion.\n\n   The security considerations (Section 10) were mostly rewritten and\n   significantly expanded; in multiple other places, the document is now\n   more explicit that a decoder cannot simply condone well-formedness\n   errors.\n\nAcknowledgements\n\n   CBOR was inspired by MessagePack.  MessagePack was developed and\n   promoted by Sadayuki Furuhashi (\"frsyuki\").  This reference to\n   MessagePack is solely for attribution; CBOR is not intended as a\n   version of, or replacement for, MessagePack, as it has different\n   design goals and requirements.\n\n   The need for functionality beyond the original MessagePack\n   specification became obvious to many people at about the same time\n   around the year 2012.  BinaryPack is a minor derivation of\n   MessagePack that was developed by Eric Zhang for the binaryjs\n   project.  A similar, but different, extension was made by Tim Caswell\n   for his msgpack-js and msgpack-js-browser projects.  Many people have\n   contributed to the discussion about extending MessagePack to separate\n   text string representation from byte string representation.\n\n   The encoding of the additional information in CBOR was inspired by\n   the encoding of length information designed by Klaus Hartke for CoAP.\n\n   This document also incorporates suggestions made by many people,\n   notably Dan Frost, James Manger, Jeffrey Yasskin, Joe Hildebrand,\n   Keith Moore, Laurence Lundblade, Matthew Lepinski, Michael\n   Richardson, Nico Williams, Peter Occil, Phillip Hallam-Baker, Ray\n   Polk, Stuart Cheshire, Tim Bray, Tony Finch, Tony Hansen, and Yaron\n   Sheffer.  Benjamin Kaduk provided an extensive review during IESG\n   processing. Éric Vyncke, Erik Kline, Robert Wilton, and Roman Danyliw\n   provided further IESG comments, which included an IoT directorate\n   review by Eve Schooler.\n\nAuthors' Addresses\n\n   Carsten Bormann\n   Universität Bremen TZI\n   Postfach 330440\n   D-28359 Bremen\n   Germany\n\n   Phone: +49-421-218-63921\n   Email: cabo@tzi.org\n\n\n   Paul Hoffman\n   ICANN\n\n   Email: paul.hoffman@icann.org\n"
  full_text_normalized: "\uFEFF internet engineering task force (ietf) c. bormann request for comments: 8949 universität bremen tzi std: 94 p. hoffman obsoletes: 7049 icann category: standards track december 2020 issn: 2070-1721 concise binary object representation (cbor) abstract the concise binary object representation (cbor) is a data format whose design goals include the possibility of extremely small code size, fairly small message size, and extensibility without the need for version negotiation. these design goals make it different from earlier binary serializations such as asn.1 and messagepack. this document obsoletes rfc 7049, providing editorial improvements, new details, and errata fixes while keeping full compatibility with the interchange format of rfc 7049. it does not create a new version of the format. status of this memo this is an internet standards track document. this document is a product of the internet engineering task force (ietf). it represents the consensus of the ietf community. it has received public review and has been approved for publication by the internet engineering steering group (iesg). further information on internet standards is available in section 2 of rfc 7841. information about the current status of this document, any errata, and how to provide feedback on it may be obtained at https://www.rfc-editor.org/info/rfc8949. copyright notice copyright (c) 2020 ietf trust and the persons identified as the document authors. all rights reserved. this document is subject to bcp 78 and the ietf trust's legal provisions relating to ietf documents (https://trustee.ietf.org/license-info) in effect on the date of publication of this document. please review these documents carefully, as they describe your rights and restrictions with respect to this document. code components extracted from this document must include simplified bsd license text as described in section 4.e of the trust legal provisions and are provided without warranty as described in the simplified bsd license. table of contents 1. introduction 1.1. objectives 1.2. terminology 2. cbor data models 2.1. extended generic data models 2.2. specific data models 3. specification of the cbor encoding 3.1. major types 3.2. indefinite lengths for some major types 3.2.1. the \"break\" stop code 3.2.2. indefinite-length arrays and maps 3.2.3. indefinite-length byte strings and text strings 3.2.4. summary of indefinite-length use of major types 3.3. floating-point numbers and values with no content 3.4. tagging of items 3.4.1. standard date/time string 3.4.2. epoch-based date/time 3.4.3. bignums 3.4.4. decimal fractions and bigfloats 3.4.5. content hints 3.4.5.1. encoded cbor data item 3.4.5.2. expected later encoding for cbor-to-json converters 3.4.5.3. encoded text 3.4.6. self-described cbor 4. serialization considerations 4.1. preferred serialization 4.2. deterministically encoded cbor 4.2.1. core deterministic encoding requirements 4.2.2. additional deterministic encoding considerations 4.2.3. length-first map key ordering 5. creating cbor-based protocols 5.1. cbor in streaming applications 5.2. generic encoders and decoders 5.3. validity of items 5.3.1. basic validity 5.3.2. tag validity 5.4. validity and evolution 5.5. numbers 5.6. specifying keys for maps 5.6.1. equivalence of keys 5.7. undefined values 6. converting data between cbor and json 6.1. converting from cbor to json 6.2. converting from json to cbor 7. future evolution of cbor 7.1. extension points 7.2. curating the additional information space 8. diagnostic notation 8.1. encoding indicators 9. iana considerations 9.1. cbor simple values registry 9.2. cbor tags registry 9.3. media types registry 9.4. coap content-format registry 9.5. structured syntax suffix registry 10. security considerations 11. references 11.1. normative references 11.2. informative references appendix a. examples of encoded cbor data items appendix b. jump table for initial byte appendix c. pseudocode appendix d. half-precision appendix e. comparison of other binary formats to cbor's design objectives e.1. asn.1 der, ber, and per e.2. messagepack e.3. bson e.4. msdtp: rfc 713 e.5. conciseness on the wire appendix f. well-formedness errors and examples f.1. examples of cbor data items that are not well-formed appendix g. changes from rfc 7049 g.1. errata processing and clerical changes g.2. changes in iana considerations g.3. changes in suggestions and other informational components acknowledgements authors' addresses 1. introduction there are hundreds of standardized formats for binary representation of structured data (also known as binary serialization formats). of those, some are for specific domains of information, while others are generalized for arbitrary data. in the ietf, probably the best-known formats in the latter category are asn.1's ber and der [asn.1]. the format defined here follows some specific design goals that are not well met by current formats. the underlying data model is an extended version of the json data model [rfc8259]. it is important to note that this is not a proposal that the grammar in rfc 8259 be extended in general, since doing so would cause a significant backwards incompatibility with already deployed json documents. instead, this document simply defines its own data model that starts from json. appendix e lists some existing binary formats and discusses how well they do or do not fit the design objectives of the concise binary object representation (cbor). this document obsoletes [rfc7049], providing editorial improvements, new details, and errata fixes while keeping full compatibility with the interchange format of rfc 7049. it does not create a new version of the format. 1.1. objectives the objectives of cbor, roughly in decreasing order of importance, are: 1. the representation must be able to unambiguously encode most common data formats used in internet standards. * it must represent a reasonable set of basic data types and structures using binary encoding. \"reasonable\" here is largely influenced by the capabilities of json, with the major addition of binary byte strings. the structures supported are limited to arrays and trees; loops and lattice-style graphs are not supported. * there is no requirement that all data formats be uniquely encoded; that is, it is acceptable that the number \"7\" might be encoded in multiple different ways. 2. the code for an encoder or decoder must be able to be compact in order to support systems with very limited memory, processor power, and instruction sets. * an encoder and a decoder need to be implementable in a very small amount of code (for example, in class 1 constrained nodes as defined in [rfc7228]). * the format should use contemporary machine representations of data (for example, not requiring binary-to-decimal conversion). 3. data must be able to be decoded without a schema description. * similar to json, encoded data should be self-describing so that a generic decoder can be written. 4. the serialization must be reasonably compact, but data compactness is secondary to code compactness for the encoder and decoder. * \"reasonable\" here is bounded by json as an upper bound in size and by the implementation complexity, which limits the amount of effort that can go into achieving that compactness. using either general compression schemes or extensive bit-fiddling violates the complexity goals. 5. the format must be applicable to both constrained nodes and high- volume applications. * this means it must be reasonably frugal in cpu usage for both encoding and decoding. this is relevant both for constrained nodes and for potential usage in applications with a very high volume of data. 6. the format must support all json data types for conversion to and from json. * it must support a reasonable level of conversion as long as the data represented is within the capabilities of json. it must be possible to define a unidirectional mapping towards json for all types of data. 7. the format must be extensible, and the extended data must be decodable by earlier decoders. * the format is designed for decades of use. * the format must support a form of extensibility that allows fallback so that a decoder that does not understand an extension can still decode the message. * the format must be able to be extended in the future by later ietf standards. 1.2. terminology the key words \"must\", \"must not\", \"required\", \"shall\", \"shall not\", \"should\", \"should not\", \"recommended\", \"not recommended\", \"may\", and \"optional\" in this document are to be interpreted as described in bcp 14 [rfc2119] [rfc8174] when, and only when, they appear in all capitals, as shown here. the term \"byte\" is used in its now-customary sense as a synonym for \"octet\". all multi-byte values are encoded in network byte order (that is, most significant byte first, also known as \"big-endian\"). this specification makes use of the following terminology: data item: a single piece of cbor data. the structure of a data item may contain zero, one, or more nested data items. the term is used both for the data item in representation format and for the abstract idea that can be derived from that by a decoder; the former can be addressed specifically by using the term \"encoded data item\". decoder: a process that decodes a well-formed encoded cbor data item and makes it available to an application. formally speaking, a decoder contains a parser to break up the input using the syntax rules of cbor, as well as a semantic processor to prepare the data in a form suitable to the application. encoder: a process that generates the (well-formed) representation format of a cbor data item from application information. data stream: a sequence of zero or more data items, not further assembled into a larger containing data item (see [rfc8742] for one application). the independent data items that make up a data stream are sometimes also referred to as \"top-level data items\". well-formed: a data item that follows the syntactic structure of cbor. a well-formed data item uses the initial bytes and the byte strings and/or data items that are implied by their values as defined in cbor and does not include following extraneous data. cbor decoders by definition only return contents from well-formed data items. valid: a data item that is well-formed and also follows the semantic restrictions that apply to cbor data items (section 5.3). expected: besides its normal english meaning, the term \"expected\" is used to describe requirements beyond cbor validity that an application has on its input data. well-formed (processable at all), valid (checked by a validity-checking generic decoder), and expected (checked by the application) form a hierarchy of layers of acceptability. stream decoder: a process that decodes a data stream and makes each of the data items in the sequence available to an application as they are received. terms and concepts for floating-point values such as infinity, nan (not a number), negative zero, and subnormal are defined in [ieee754]. where bit arithmetic or data types are explained, this document uses the notation familiar from the programming language c [c], except that \"..\" denotes a range that includes both ends given, and superscript notation denotes exponentiation. for example, 2 to the power of 64 is notated: 2^(64). in the plain-text version of this specification, superscript notation is not available and therefore is rendered by a surrogate notation. that notation is not optimized for this rfc; it is unfortunately ambiguous with c's exclusive-or (which is only used in the appendices, which in turn do not use exponentiation) and requires circumspection from the reader of the plain-text version. examples and pseudocode assume that signed integers use two's complement representation and that right shifts of signed integers perform sign extension; these assumptions are also specified in sections 6.8.1 (basic.fundamental) and 7.6.7 (expr.shift) of the 2020 version of c++ (currently available as a final draft, [cplusplus20]). similar to the \"0x\" notation for hexadecimal numbers, numbers in binary notation are prefixed with \"0b\". underscores can be added to a number solely for readability, so 0b00100001 (0x21) might be written 0b001_00001 to emphasize the desired interpretation of the bits in the byte; in this case, it is split into three bits and five bits. encoded cbor data items are sometimes given in the \"0x\" or \"0b\" notation; these values are first interpreted as numbers as in c and are then interpreted as byte strings in network byte order, including any leading zero bytes expressed in the notation. words may be _italicized_ for emphasis; in the plain text form of this specification, this is indicated by surrounding words with underscore characters. verbatim text (e.g., names from a programming language) may be set in \"monospace\" type; in plain text, this is approximated somewhat ambiguously by surrounding the text in double quotes (which also retain their usual meaning). 2. cbor data models cbor is explicit about its generic data model, which defines the set of all data items that can be represented in cbor. its basic generic data model is extensible by the registration of \"simple values\" and tags. applications can then create a subset of the resulting extended generic data model to build their specific data models. within environments that can represent the data items in the generic data model, generic cbor encoders and decoders can be implemented (which usually involves defining additional implementation data types for those data items that do not already have a natural representation in the environment). the ability to provide generic encoders and decoders is an explicit design goal of cbor; however, many applications will provide their own application-specific encoders and/or decoders. in the basic (unextended) generic data model defined in section 3, a data item is one of the following: * an integer in the range -2^(64)..2^(64)-1 inclusive * a simple value, identified by a number between 0 and 255, but distinct from that number itself * a floating-point value, distinct from an integer, out of the set representable by ieee 754 binary64 (including non-finites) [ieee754] * a sequence of zero or more bytes (\"byte string\") * a sequence of zero or more unicode code points (\"text string\") * a sequence of zero or more data items (\"array\") * a mapping (mathematical function) from zero or more data items (\"keys\") each to a data item (\"values\"), (\"map\") * a tagged data item (\"tag\"), comprising a tag number (an integer in the range 0..2^(64)-1) and the tag content (a data item) note that integer and floating-point values are distinct in this model, even if they have the same numeric value. also note that serialization variants are not visible at the generic data model level. this deliberate absence of visibility includes the number of bytes of the encoded floating-point value. it also includes the choice of encoding for an \"argument\" (see section 3) such as the encoding for an integer, the encoding for the length of a text or byte string, the encoding for the number of elements in an array or pairs in a map, or the encoding for a tag number. 2.1. extended generic data models this basic generic data model has been extended in this document by the registration of a number of simple values and tag numbers, such as: * \"false\", \"true\", \"null\", and \"undefined\" (simple values identified by 20..23, section 3.3) * integer and floating-point values with a larger range and precision than the above (tag numbers 2 to 5, section 3.4) * application data types such as a point in time or date/time string defined in rfc 3339 (tag numbers 1 and 0, section 3.4) additional elements of the extended generic data model can be (and have been) defined via the iana registries created for cbor. even if such an extension is unknown to a generic encoder or decoder, data items using that extension can be passed to or from the application by representing them at the application interface within the basic generic data model, i.e., as generic simple values or generic tags. in other words, the basic generic data model is stable as defined in this document, while the extended generic data model expands by the registration of new simple values or tag numbers, but never shrinks. while there is a strong expectation that generic encoders and decoders can represent \"false\", \"true\", and \"null\" (\"undefined\" is intentionally omitted) in the form appropriate for their programming environment, the implementation of the data model extensions created by tags is truly optional and a matter of implementation quality. 2.2. specific data models the specific data model for a cbor-based protocol usually takes a subset of the extended generic data model and assigns application semantics to the data items within this subset and its components. when documenting such specific data models and specifying the types of data items, it is preferable to identify the types by their generic data model names (\"negative integer\", \"array\") instead of referring to aspects of their cbor representation (\"major type 1\", \"major type 4\"). specific data models can also specify value equivalency (including values of different types) for the purposes of map keys and encoder freedom. for example, in the generic data model, a valid map may have both \"0\" and \"0.0\" as keys, and an encoder must not encode \"0.0\" as an integer (major type 0, section 3.1). however, if a specific data model declares that floating-point and integer representations of integral values are equivalent, using both map keys \"0\" and \"0.0\" in a single map would be considered duplicates, even while encoded as different major types, and so invalid; and an encoder could encode integral-valued floats as integers or vice versa, perhaps to save encoded bytes. 3. specification of the cbor encoding a cbor data item (section 2) is encoded to or decoded from a byte string carrying a well-formed encoded data item as described in this section. the encoding is summarized in table 7 in appendix b, indexed by the initial byte. an encoder must produce only well- formed encoded data items. a decoder must not return a decoded data item when it encounters input that is not a well-formed encoded cbor data item (this does not detract from the usefulness of diagnostic and recovery tools that might make available some information from a damaged encoded cbor data item). the initial byte of each encoded data item contains both information about the major type (the high-order 3 bits, described in section 3.1) and additional information (the low-order 5 bits). with a few exceptions, the additional information's value describes how to load an unsigned integer \"argument\": less than 24: the argument's value is the value of the additional information. 24, 25, 26, or 27: the argument's value is held in the following 1, 2, 4, or 8 bytes, respectively, in network byte order. for major type 7 and additional information value 25, 26, 27, these bytes are not used as an integer argument, but as a floating-point value (see section 3.3). 28, 29, 30: these values are reserved for future additions to the cbor format. in the present version of cbor, the encoded item is not well-formed. 31: no argument value is derived. if the major type is 0, 1, or 6, the encoded item is not well-formed. for major types 2 to 5, the item's length is indefinite, and for major type 7, the byte does not constitute a data item at all but terminates an indefinite- length item; all are described in section 3.2. the initial byte and any additional bytes consumed to construct the argument are collectively referred to as the _head_ of the data item. the meaning of this argument depends on the major type. for example, in major type 0, the argument is the value of the data item itself (and in major type 1, the value of the data item is computed from the argument); in major type 2 and 3, it gives the length of the string data in bytes that follow; and in major types 4 and 5, it is used to determine the number of data items enclosed. if the encoded sequence of bytes ends before the end of a data item, that item is not well-formed. if the encoded sequence of bytes still has bytes remaining after the outermost encoded item is decoded, that encoding is not a single well-formed cbor item. depending on the application, the decoder may either treat the encoding as not well- formed or just identify the start of the remaining bytes to the application. a cbor decoder implementation can be based on a jump table with all 256 defined values for the initial byte (table 7). a decoder in a constrained implementation can instead use the structure of the initial byte and following bytes for more compact code (see appendix c for a rough impression of how this could look). 3.1. major types the following lists the major types and the additional information and other bytes associated with the type. major type 0: an unsigned integer in the range 0..2^(64)-1 inclusive. the value of the encoded item is the argument itself. for example, the integer 10 is denoted as the one byte 0b000_01010 (major type 0, additional information 10). the integer 500 would be 0b000_11001 (major type 0, additional information 25) followed by the two bytes 0x01f4, which is 500 in decimal. major type 1: a negative integer in the range -2^(64)..-1 inclusive. the value of the item is -1 minus the argument. for example, the integer -500 would be 0b001_11001 (major type 1, additional information 25) followed by the two bytes 0x01f3, which is 499 in decimal. major type 2: a byte string. the number of bytes in the string is equal to the argument. for example, a byte string whose length is 5 would have an initial byte of 0b010_00101 (major type 2, additional information 5 for the length), followed by 5 bytes of binary content. a byte string whose length is 500 would have 3 initial bytes of 0b010_11001 (major type 2, additional information 25 to indicate a two-byte length) followed by the two bytes 0x01f4 for a length of 500, followed by 500 bytes of binary content. major type 3: a text string (section 2) encoded as utf-8 [rfc3629]. the number of bytes in the string is equal to the argument. a string containing an invalid utf-8 sequence is well-formed but invalid (section 1.2). this type is provided for systems that need to interpret or display human-readable text, and allows the differentiation between unstructured bytes and text that has a specified repertoire (that of unicode) and encoding (utf-8). in contrast to formats such as json, the unicode characters in this type are never escaped. thus, a newline character (u+000a) is always represented in a string as the byte 0x0a, and never as the bytes 0x5c6e (the characters \"\\\" and \"n\") nor as 0x5c7530303061 (the characters \"\\\", \"u\", \"0\", \"0\", \"0\", and \"a\"). major type 4: an array of data items. in other formats, arrays are also called lists, sequences, or tuples (a \"cbor sequence\" is something slightly different, though [rfc8742]). the argument is the number of data items in the array. items in an array do not need to all be of the same type. for example, an array that contains 10 items of any type would have an initial byte of 0b100_01010 (major type 4, additional information 10 for the length) followed by the 10 remaining items. major type 5: a map of pairs of data items. maps are also called tables, dictionaries, hashes, or objects (in json). a map is comprised of pairs of data items, each pair consisting of a key that is immediately followed by a value. the argument is the number of _pairs_ of data items in the map. for example, a map that contains 9 pairs would have an initial byte of 0b101_01001 (major type 5, additional information 9 for the number of pairs) followed by the 18 remaining items. the first item is the first key, the second item is the first value, the third item is the second key, and so on. because items in a map come in pairs, their total number is always even: a map that contains an odd number of items (no value data present after the last key data item) is not well- formed. a map that has duplicate keys may be well-formed, but it is not valid, and thus it causes indeterminate decoding; see also section 5.6. major type 6: a tagged data item (\"tag\") whose tag number, an integer in the range 0..2^(64)-1 inclusive, is the argument and whose enclosed data item (_tag content_) is the single encoded data item that follows the head. see section 3.4. major type 7: floating-point numbers and simple values, as well as the \"break\" stop code. see section 3.3. these eight major types lead to a simple table showing which of the 256 possible values for the initial byte of a data item are used (table 7). in major types 6 and 7, many of the possible values are reserved for future specification. see section 9 for more information on these values. table 1 summarizes the major types defined by cbor, ignoring section 3.2 for now. the number n in this table stands for the argument. +============+=======================+=========================+ | major type | meaning | content | +============+=======================+=========================+ | 0 | unsigned integer n | - | +------------+-----------------------+-------------------------+ | 1 | negative integer -1-n | - | +------------+-----------------------+-------------------------+ | 2 | byte string | n bytes | +------------+-----------------------+-------------------------+ | 3 | text string | n bytes (utf-8 text) | +------------+-----------------------+-------------------------+ | 4 | array | n data items (elements) | +------------+-----------------------+-------------------------+ | 5 | map | 2n data items (key/ | | | | value pairs) | +------------+-----------------------+-------------------------+ | 6 | tag of number n | 1 data item | +------------+-----------------------+-------------------------+ | 7 | simple/float | - | +------------+-----------------------+-------------------------+ table 1: overview over the definite-length use of cbor major types (n = argument) 3.2. indefinite lengths for some major types four cbor items (arrays, maps, byte strings, and text strings) can be encoded with an indefinite length using additional information value 31. this is useful if the encoding of the item needs to begin before the number of items inside the array or map, or the total length of the string, is known. (the ability to start sending a data item before all of it is known is often referred to as \"streaming\" within that data item.) indefinite-length arrays and maps are dealt with differently than indefinite-length strings (byte strings and text strings). 3.2.1. the \"break\" stop code the \"break\" stop code is encoded with major type 7 and additional information value 31 (0b111_11111). it is not itself a data item: it is just a syntactic feature to close an indefinite-length item. if the \"break\" stop code appears where a data item is expected, other than directly inside an indefinite-length string, array, or map -- for example, directly inside a definite-length array or map -- the enclosing item is not well-formed. 3.2.2. indefinite-length arrays and maps indefinite-length arrays and maps are represented using their major type with the additional information value of 31, followed by an arbitrary-length sequence of zero or more items for an array or key/ value pairs for a map, followed by the \"break\" stop code (section 3.2.1). in other words, indefinite-length arrays and maps look identical to other arrays and maps except for beginning with the additional information value of 31 and ending with the \"break\" stop code. if the \"break\" stop code appears after a key in a map, in place of that key's value, the map is not well-formed. there is no restriction against nesting indefinite-length array or map items. a \"break\" only terminates a single item, so nested indefinite-length items need exactly as many \"break\" stop codes as there are type bytes starting an indefinite-length item. for example, assume an encoder wants to represent the abstract array [1, [2, 3], [4, 5]]. the definite-length encoding would be 0x8301820203820405: 83 -- array of length 3 01 -- 1 82 -- array of length 2 02 -- 2 03 -- 3 82 -- array of length 2 04 -- 4 05 -- 5 indefinite-length encoding could be applied independently to each of the three arrays encoded in this data item, as required, leading to representations such as: 0x9f018202039f0405ffff 9f -- start indefinite-length array 01 -- 1 82 -- array of length 2 02 -- 2 03 -- 3 9f -- start indefinite-length array 04 -- 4 05 -- 5 ff -- \"break\" (inner array) ff -- \"break\" (outer array) 0x9f01820203820405ff 9f -- start indefinite-length array 01 -- 1 82 -- array of length 2 02 -- 2 03 -- 3 82 -- array of length 2 04 -- 4 05 -- 5 ff -- \"break\" 0x83018202039f0405ff 83 -- array of length 3 01 -- 1 82 -- array of length 2 02 -- 2 03 -- 3 9f -- start indefinite-length array 04 -- 4 05 -- 5 ff -- \"break\" 0x83019f0203ff820405 83 -- array of length 3 01 -- 1 9f -- start indefinite-length array 02 -- 2 03 -- 3 ff -- \"break\" 82 -- array of length 2 04 -- 4 05 -- 5 an example of an indefinite-length map (that happens to have two key/ value pairs) might be: 0xbf6346756ef563416d7421ff bf -- start indefinite-length map 63 -- first key, utf-8 string length 3 46756e -- \"fun\" f5 -- first value, true 63 -- second key, utf-8 string length 3 416d74 -- \"amt\" 21 -- second value, -2 ff -- \"break\" 3.2.3. indefinite-length byte strings and text strings indefinite-length strings are represented by a byte containing the major type for byte string or text string with an additional information value of 31, followed by a series of zero or more strings of the specified type (\"chunks\") that have definite lengths, and finished by the \"break\" stop code (section 3.2.1). the data item represented by the indefinite-length string is the concatenation of the chunks. if no chunks are present, the data item is an empty string of the specified type. zero-length chunks, while not particularly useful, are permitted. if any item between the indefinite-length string indicator (0b010_11111 or 0b011_11111) and the \"break\" stop code is not a definite-length string item of the same major type, the string is not well-formed. the design does not allow nesting indefinite-length strings as chunks into indefinite-length strings. if it were allowed, it would require decoder implementations to keep a stack, or at least a count, of nesting levels. it is unnecessary on the encoder side because the inner indefinite-length string would consist of chunks, and these could instead be put directly into the outer indefinite-length string. if any definite-length text string inside an indefinite-length text string is invalid, the indefinite-length text string is invalid. note that this implies that the utf-8 bytes of a single unicode code point (scalar value) cannot be spread between chunks: a new chunk of a text string can only be started at a code point boundary. for example, assume an encoded data item consisting of the bytes: 0b010_11111 0b010_00100 0xaabbccdd 0b010_00011 0xeeff99 0b111_11111 5f -- start indefinite-length byte string 44 -- byte string of length 4 aabbccdd -- bytes content 43 -- byte string of length 3 eeff99 -- bytes content ff -- \"break\" after decoding, this results in a single byte string with seven bytes: 0xaabbccddeeff99. 3.2.4. summary of indefinite-length use of major types table 2 summarizes the major types defined by cbor as used for indefinite-length encoding (with additional information set to 31). +============+===================+==================================+ | major type | meaning | enclosed up to \"break\" stop code | +============+===================+==================================+ | 0 | (not well- | - | | | formed) | | +------------+-------------------+----------------------------------+ | 1 | (not well- | - | | | formed) | | +------------+-------------------+----------------------------------+ | 2 | byte string | definite-length byte strings | +------------+-------------------+----------------------------------+ | 3 | text string | definite-length text strings | +------------+-------------------+----------------------------------+ | 4 | array | data items (elements) | +------------+-------------------+----------------------------------+ | 5 | map | data items (key/value pairs) | +------------+-------------------+----------------------------------+ | 6 | (not well- | - | | | formed) | | +------------+-------------------+----------------------------------+ | 7 | \"break\" stop | - | | | code | | +------------+-------------------+----------------------------------+ table 2: overview of the indefinite-length use of cbor major types (additional information = 31) 3.3. floating-point numbers and values with no content major type 7 is for two types of data: floating-point numbers and \"simple values\" that do not need any content. each value of the 5-bit additional information in the initial byte has its own separate meaning, as defined in table 3. like the major types for integers, items of this major type do not carry content data; all the information is in the initial bytes (the head). +=============+===================================================+ | 5-bit value | semantics | +=============+===================================================+ | 0..23 | simple value (value 0..23) | +-------------+---------------------------------------------------+ | 24 | simple value (value 32..255 in following byte) | +-------------+---------------------------------------------------+ | 25 | ieee 754 half-precision float (16 bits follow) | +-------------+---------------------------------------------------+ | 26 | ieee 754 single-precision float (32 bits follow) | +-------------+---------------------------------------------------+ | 27 | ieee 754 double-precision float (64 bits follow) | +-------------+---------------------------------------------------+ | 28-30 | reserved, not well-formed in the present document | +-------------+---------------------------------------------------+ | 31 | \"break\" stop code for indefinite-length items | | | (section 3.2.1) | +-------------+---------------------------------------------------+ table 3: values for additional information in major type 7 as with all other major types, the 5-bit value 24 signifies a single- byte extension: it is followed by an additional byte to represent the simple value. (to minimize confusion, only the values 32 to 255 are used.) this maintains the structure of the initial bytes: as for the other major types, the length of these always depends on the additional information in the first byte. table 4 lists the numeric values assigned and available for simple values. +=========+==============+ | value | semantics | +=========+==============+ | 0..19 | (unassigned) | +---------+--------------+ | 20 | false | +---------+--------------+ | 21 | true | +---------+--------------+ | 22 | null | +---------+--------------+ | 23 | undefined | +---------+--------------+ | 24..31 | (reserved) | +---------+--------------+ | 32..255 | (unassigned) | +---------+--------------+ table 4: simple values an encoder must not issue two-byte sequences that start with 0xf8 (major type 7, additional information 24) and continue with a byte less than 0x20 (32 decimal). such sequences are not well-formed. (this implies that an encoder cannot encode \"false\", \"true\", \"null\", or \"undefined\" in two-byte sequences and that only the one-byte variants of these are well-formed; more generally speaking, each simple value only has a single representation variant). the 5-bit values of 25, 26, and 27 are for 16-bit, 32-bit, and 64-bit ieee 754 binary floating-point values [ieee754]. these floating- point values are encoded in the additional bytes of the appropriate size. (see appendix d for some information about 16-bit floating- point numbers.) 3.4. tagging of items in cbor, a data item can be enclosed by a tag to give it some additional semantics, as uniquely identified by a _tag number_. the tag is major type 6, its argument (section 3) indicates the tag number, and it contains a single enclosed data item, the _tag content_. (if a tag requires further structure to its content, this structure is provided by the enclosed data item.) we use the term _tag_ for the entire data item consisting of both a tag number and the tag content: the tag content is the data item that is being tagged. for example, assume that a byte string of length 12 is marked with a tag of number 2 to indicate it is an unsigned _bignum_ (section 3.4.3). the encoded data item would start with a byte 0b110_00010 (major type 6, additional information 2 for the tag number) followed by the encoded tag content: 0b010_01100 (major type 2, additional information 12 for the length) followed by the 12 bytes of the bignum. in the extended generic data model, a tag number's definition describes the additional semantics conveyed with the tag number. these semantics may include equivalence of some tagged data items with other data items, including some that can be represented in the basic generic data model. for instance, 0xc24101, a bignum the tag content of which is the byte string with the single byte 0x01, is equivalent to an integer 1, which could also be encoded as 0x01, 0x1801, or 0x190001. the tag definition may specify a preferred serialization (section 4.1) that is recommended for generic encoders; this may prefer basic generic data model representations over ones that employ a tag. the tag definition usually defines which nested data items are valid for such tags. tag definitions may restrict their content to a very specific syntactic structure, as the tags defined in this document do, or they may define their content more semantically. an example for the latter is how tags 40 and 1040 accept multiple ways to represent arrays [rfc8746]. as a matter of convention, many tags do not accept \"null\" or \"undefined\" values as tag content; instead, the expectation is that a \"null\" or \"undefined\" value can be used in place of the entire tag; section 3.4.2 provides some further considerations for one specific tag about the handling of this convention in application protocols and in mapping to platform types. decoders do not need to understand tags of every tag number, and tags may be of little value in applications where the implementation creating a particular cbor data item and the implementation decoding that stream know the semantic meaning of each item in the data flow. the primary purpose of tags in this specification is to define common data types such as dates. a secondary purpose is to provide conversion hints when it is foreseen that the cbor data item needs to be translated into a different format, requiring hints about the content of items. understanding the semantics of tags is optional for a decoder; it can simply present both the tag number and the tag content to the application, without interpreting the additional semantics of the tag. a tag applies semantics to the data item it encloses. tags can nest: if tag a encloses tag b, which encloses data item c, tag a applies to the result of applying tag b on data item c. iana maintains a registry of tag numbers as described in section 9.2. table 5 provides a list of tag numbers that were defined in [rfc7049] with definitions in the rest of this section. (tag number 35 was also defined in [rfc7049]; a discussion of this tag number follows in section 3.4.5.3.) note that many other tag numbers have been defined since the publication of [rfc7049]; see the registry described at section 9.2 for the complete list. +=======+=============+==================================+ | tag | data item | semantics | +=======+=============+==================================+ | 0 | text string | standard date/time string; see | | | | section 3.4.1 | +-------+-------------+----------------------------------+ | 1 | integer or | epoch-based date/time; see | | | float | section 3.4.2 | +-------+-------------+----------------------------------+ | 2 | byte string | unsigned bignum; see | | | | section 3.4.3 | +-------+-------------+----------------------------------+ | 3 | byte string | negative bignum; see | | | | section 3.4.3 | +-------+-------------+----------------------------------+ | 4 | array | decimal fraction; see | | | | section 3.4.4 | +-------+-------------+----------------------------------+ | 5 | array | bigfloat; see section 3.4.4 | +-------+-------------+----------------------------------+ | 21 | (any) | expected conversion to base64url | | | | encoding; see section 3.4.5.2 | +-------+-------------+----------------------------------+ | 22 | (any) | expected conversion to base64 | | | | encoding; see section 3.4.5.2 | +-------+-------------+----------------------------------+ | 23 | (any) | expected conversion to base16 | | | | encoding; see section 3.4.5.2 | +-------+-------------+----------------------------------+ | 24 | byte string | encoded cbor data item; see | | | | section 3.4.5.1 | +-------+-------------+----------------------------------+ | 32 | text string | uri; see section 3.4.5.3 | +-------+-------------+----------------------------------+ | 33 | text string | base64url; see section 3.4.5.3 | +-------+-------------+----------------------------------+ | 34 | text string | base64; see section 3.4.5.3 | +-------+-------------+----------------------------------+ | 36 | text string | mime message; see | | | | section 3.4.5.3 | +-------+-------------+----------------------------------+ | 55799 | (any) | self-described cbor; see | | | | section 3.4.6 | +-------+-------------+----------------------------------+ table 5: tag numbers defined in rfc 7049 conceptually, tags are interpreted in the generic data model, not at (de-)serialization time. a small number of tags (at this time, tag number 25 and tag number 29 [iana.cbor-tags]) have been registered with semantics that may require processing at (de-)serialization time: the decoder needs to be aware of, and the encoder needs to be in control of, the exact sequence in which data items are encoded into the cbor data item. this means these tags cannot be implemented on top of an arbitrary generic cbor encoder/decoder (which might not reflect the serialization order for entries in a map at the data model level and vice versa); their implementation therefore typically needs to be integrated into the generic encoder/decoder. the definition of new tags with this property is not recommended. iana allocated tag numbers 65535, 4294967295, and 18446744073709551615 (binary all-ones in 16-bit, 32-bit, and 64-bit). these can be used as a convenience for implementers who want a single-integer data structure to indicate either the presence of a specific tag or absence of a tag. that allocation is described in section 10 of [cbor-tags]. these tags are not intended to occur in actual cbor data items; implementations may flag such an occurrence as an error. protocols can extend the generic data model (section 2) with data items representing points in time by using tag numbers 0 and 1, with arbitrarily sized integers by using tag numbers 2 and 3, and with floating-point values of arbitrary size and precision by using tag numbers 4 and 5. 3.4.1. standard date/time string tag number 0 contains a text string in the standard format described by the \"date-time\" production in [rfc3339], as refined by section 3.3 of [rfc4287], representing the point in time described there. a nested item of another type or a text string that doesn't match the format described in [rfc4287] is invalid. 3.4.2. epoch-based date/time tag number 1 contains a numerical value counting the number of seconds from 1970-01-01t00:00z in utc time to the represented point in civil time. the tag content must be an unsigned or negative integer (major types 0 and 1) or a floating-point number (major type 7 with additional information 25, 26, or 27). other contained types are invalid. nonnegative values (major type 0 and nonnegative floating-point numbers) stand for time values on or after 1970-01-01t00:00z utc and are interpreted according to posix [time_t]. (posix time is also known as \"unix epoch time\".) leap seconds are handled specially by posix time, and this results in a 1-second discontinuity several times per decade. note that applications that require the expression of times beyond early 2106 cannot leave out support of 64-bit integers for the tag content. negative values (major type 1 and negative floating-point numbers) are interpreted as determined by the application requirements as there is no universal standard for utc count-of-seconds time before 1970-01-01t00:00z (this is particularly true for points in time that precede discontinuities in national calendars). the same applies to non-finite values. to indicate fractional seconds, floating-point values can be used within tag number 1 instead of integer values. note that this generally requires binary64 support, as binary16 and binary32 provide nonzero fractions of seconds only for a short period of time around early 1970. an application that requires tag number 1 support may restrict the tag content to be an integer (or a floating-point value) only. note that platform types for date/time may include \"null\" or \"undefined\" values, which may also be desirable at an application protocol level. while emitting tag number 1 values with non-finite tag content values (e.g., with nan for undefined date/time values or with infinity for an expiry date that is not set) may seem an obvious way to handle this, using untagged \"null\" or \"undefined\" avoids the use of non-finites and results in a shorter encoding. application protocol designers are encouraged to consider these cases and include clear guidelines for handling them. 3.4.3. bignums protocols using tag numbers 2 and 3 extend the generic data model (section 2) with \"bignums\" representing arbitrarily sized integers. in the basic generic data model, bignum values are not equal to integers from the same model, but the extended generic data model created by this tag definition defines equivalence based on numeric value, and preferred serialization (section 4.1) never makes use of bignums that also can be expressed as basic integers (see below). bignums are encoded as a byte string data item, which is interpreted as an unsigned integer n in network byte order. contained items of other types are invalid. for tag number 2, the value of the bignum is n. for tag number 3, the value of the bignum is -1 - n. the preferred serialization of the byte string is to leave out any leading zeroes (note that this means the preferred serialization for n = 0 is the empty byte string, but see below). decoders that understand these tags must be able to decode bignums that do have leading zeroes. the preferred serialization of an integer that can be represented using major type 0 or 1 is to encode it this way instead of as a bignum (which means that the empty string never occurs in a bignum when using preferred serialization). note that this means the non-preferred choice of a bignum representation instead of a basic integer for encoding a number is not intended to have application semantics (just as the choice of a longer basic integer representation than needed, such as 0x1800 for 0x00, does not). for example, the number 18446744073709551616 (2^(64)) is represented as 0b110_00010 (major type 6, tag number 2), followed by 0b010_01001 (major type 2, length 9), followed by 0x010000000000000000 (one byte 0x01 and eight bytes 0x00). in hexadecimal: c2 -- tag 2 49 -- byte string of length 9 010000000000000000 -- bytes content 3.4.4. decimal fractions and bigfloats protocols using tag number 4 extend the generic data model with data items representing arbitrary-length decimal fractions of the form m*(10^(e)). protocols using tag number 5 extend the generic data model with data items representing arbitrary-length binary fractions of the form m*(2^(e)). as with bignums, values of different types are not equal in the generic data model. decimal fractions combine an integer mantissa with a base-10 scaling factor. they are most useful if an application needs the exact representation of a decimal fraction such as 1.1 because there is no exact representation for many decimal fractions in binary floating- point representations. \"bigfloats\" combine an integer mantissa with a base-2 scaling factor. they are binary floating-point values that can exceed the range or the precision of the three ieee 754 formats supported by cbor (section 3.3). bigfloats may also be used by constrained applications that need some basic binary floating-point capability without the need for supporting ieee 754. a decimal fraction or a bigfloat is represented as a tagged array that contains exactly two integer numbers: an exponent e and a mantissa m. decimal fractions (tag number 4) use base-10 exponents; the value of a decimal fraction data item is m*(10^(e)). bigfloats (tag number 5) use base-2 exponents; the value of a bigfloat data item is m*(2^(e)). the exponent e must be represented in an integer of major type 0 or 1, while the mantissa can also be a bignum (section 3.4.3). contained items with other structures are invalid. an example of a decimal fraction is the representation of the number 273.15 as 0b110_00100 (major type 6 for tag, additional information 4 for the tag number), followed by 0b100_00010 (major type 4 for the array, additional information 2 for the length of the array), followed by 0b001_00001 (major type 1 for the first integer, additional information 1 for the value of -2), followed by 0b000_11001 (major type 0 for the second integer, additional information 25 for a two-byte value), followed by 0b0110101010110011 (27315 in two bytes). in hexadecimal: c4 -- tag 4 82 -- array of length 2 21 -- -2 19 6ab3 -- 27315 an example of a bigfloat is the representation of the number 1.5 as 0b110_00101 (major type 6 for tag, additional information 5 for the tag number), followed by 0b100_00010 (major type 4 for the array, additional information 2 for the length of the array), followed by 0b001_00000 (major type 1 for the first integer, additional information 0 for the value of -1), followed by 0b000_00011 (major type 0 for the second integer, additional information 3 for the value of 3). in hexadecimal: c5 -- tag 5 82 -- array of length 2 20 -- -1 03 -- 3 decimal fractions and bigfloats provide no representation of infinity, -infinity, or nan; if these are needed in place of a decimal fraction or bigfloat, the ieee 754 half-precision representations from section 3.3 can be used. 3.4.5. content hints the tags in this section are for content hints that might be used by generic cbor processors. these content hints do not extend the generic data model. 3.4.5.1. encoded cbor data item sometimes it is beneficial to carry an embedded cbor data item that is not meant to be decoded immediately at the time the enclosing data item is being decoded. tag number 24 (cbor data item) can be used to tag the embedded byte string as a single data item encoded in cbor format. contained items that aren't byte strings are invalid. a contained byte string is valid if it encodes a well-formed cbor data item; validity checking of the decoded cbor item is not required for tag validity (but could be offered by a generic decoder as a special option). 3.4.5.2. expected later encoding for cbor-to-json converters tag numbers 21 to 23 indicate that a byte string might require a specific encoding when interoperating with a text-based representation. these tags are useful when an encoder knows that the byte string data it is writing is likely to be later converted to a particular json-based usage. that usage specifies that some strings are encoded as base64, base64url, and so on. the encoder uses byte strings instead of doing the encoding itself to reduce the message size, to reduce the code size of the encoder, or both. the encoder does not know whether or not the converter will be generic, and therefore wants to say what it believes is the proper way to convert binary strings to json. the data item tagged can be a byte string or any other data item. in the latter case, the tag applies to all of the byte string data items contained in the data item, except for those contained in a nested data item tagged with an expected conversion. these three tag numbers suggest conversions to three of the base data encodings defined in [rfc4648]. tag number 21 suggests conversion to base64url encoding (section 5 of [rfc4648]) where padding is not used (see section 3.2 of [rfc4648]); that is, all trailing equals signs (\"=\") are removed from the encoded string. tag number 22 suggests conversion to classical base64 encoding (section 4 of [rfc4648]) with padding as defined in rfc 4648. for both base64url and base64, padding bits are set to zero (see section 3.5 of [rfc4648]), and the conversion to alternate encoding is performed on the contents of the byte string (that is, without adding any line breaks, whitespace, or other additional characters). tag number 23 suggests conversion to base16 (hex) encoding with uppercase alphabetics (see section 8 of [rfc4648]). note that, for all three tag numbers, the encoding of the empty byte string is the empty text string. 3.4.5.3. encoded text some text strings hold data that have formats widely used on the internet, and sometimes those formats can be validated and presented to the application in appropriate form by the decoder. there are tags for some of these formats. * tag number 32 is for uris, as defined in [rfc3986]. if the text string doesn't match the \"uri-reference\" production, the string is invalid. * tag numbers 33 and 34 are for base64url- and base64-encoded text strings, respectively, as defined in [rfc4648]. if any of the following apply: - the encoded text string contains non-alphabet characters or only 1 alphabet character in the last block of 4 (where alphabet is defined by section 5 of [rfc4648] for tag number 33 and section 4 of [rfc4648] for tag number 34), or - the padding bits in a 2- or 3-character block are not 0, or - the base64 encoding has the wrong number of padding characters, or - the base64url encoding has padding characters, the string is invalid. * tag number 36 is for mime messages (including all headers), as defined in [rfc2045]. a text string that isn't a valid mime message is invalid. (for this tag, validity checking may be particularly onerous for a generic decoder and might therefore not be offered. note that many mime messages are general binary data and therefore cannot be represented in a text string; [iana.cbor-tags] lists a registration for tag number 257 that is similar to tag number 36 but uses a byte string as its tag content.) note that tag numbers 33 and 34 differ from 21 and 22 in that the data is transported in base-encoded form for the former and in raw byte string form for the latter. [rfc7049] also defined a tag number 35 for regular expressions that are in perl compatible regular expressions (pcre/pcre2) form [pcre] or in javascript regular expression syntax [ecma262]. the state of the art in these regular expression specifications has since advanced and is continually advancing, so this specification does not attempt to update the references. instead, this tag remains available (as registered in [rfc7049]) for applications that specify the particular regular expression variant they use out-of-band (possibly by limiting the usage to a defined common subset of both pcre and ecma262). as this specification clarifies tag validity beyond [rfc7049], we note that due to the open way the tag was defined in [rfc7049], any contained string value needs to be valid at the cbor tag level (but then may not be \"expected\" at the application level). 3.4.6. self-described cbor in many applications, it will be clear from the context that cbor is being employed for encoding a data item. for instance, a specific protocol might specify the use of cbor, or a media type is indicated that specifies its use. however, there may be applications where such context information is not available, such as when cbor data is stored in a file that does not have disambiguating metadata. here, it may help to have some distinguishing characteristics for the data itself. tag number 55799 is defined for this purpose, specifically for use at the start of a stored encoded cbor data item as specified by an application. it does not impart any special semantics on the data item that it encloses; that is, the semantics of the tag content enclosed in tag number 55799 is exactly identical to the semantics of the tag content itself. the serialization of this tag's head is 0xd9d9f7, which does not appear to be in use as a distinguishing mark for any frequently used file types. in particular, 0xd9d9f7 is not a valid start of a unicode text in any unicode encoding if it is followed by a valid cbor data item. for instance, a decoder might be able to decode both cbor and json. such a decoder would need to mechanically distinguish the two formats. an easy way for an encoder to help the decoder would be to tag the entire cbor item with tag number 55799, the serialization of which will never be found at the beginning of a json text. 4. serialization considerations 4.1. preferred serialization for some values at the data model level, cbor provides multiple serializations. for many applications, it is desirable that an encoder always chooses a preferred serialization (preferred encoding); however, the present specification does not put the burden of enforcing this preference on either the encoder or decoder. some constrained decoders may be limited in their ability to decode non-preferred serializations: for example, if only integers below 1_000_000_000 (one billion) are expected in an application, the decoder may leave out the code that would be needed to decode 64-bit arguments in integers. an encoder that always uses preferred serialization (\"preferred encoder\") interoperates with this decoder for the numbers that can occur in this application. generally speaking, a preferred encoder is more universally interoperable (and also less wasteful) than one that, say, always uses 64-bit integers. similarly, a constrained encoder may be limited in the variety of representation variants it supports such that it does not emit preferred serializations (\"variant encoder\"). for instance, a constrained encoder could be designed to always use the 32-bit variant for an integer that it encodes even if a short representation is available (assuming that there is no application need for integers that can only be represented with the 64-bit variant). a decoder that does not rely on receiving only preferred serializations (\"variation-tolerant decoder\") can therefore be said to be more universally interoperable (it might very well optimize for the case of receiving preferred serializations, though). full implementations of cbor decoders are by definition variation tolerant; the distinction is only relevant if a constrained implementation of a cbor decoder meets a variant encoder. the preferred serialization always uses the shortest form of representing the argument (section 3); it also uses the shortest floating-point encoding that preserves the value being encoded. the preferred serialization for a floating-point value is the shortest floating-point encoding that preserves its value, e.g., 0xf94580 for the number 5.5, and 0xfa45ad9c00 for the number 5555.5. for nan values, a shorter encoding is preferred if zero-padding the shorter significand towards the right reconstitutes the original nan value (for many applications, the single nan encoding 0xf97e00 will suffice). definite-length encoding is preferred whenever the length is known at the time the serialization of the item starts. 4.2. deterministically encoded cbor some protocols may want encoders to only emit cbor in a particular deterministic format; those protocols might also have the decoders check that their input is in that deterministic format. those protocols are free to define what they mean by a \"deterministic format\" and what encoders and decoders are expected to do. this section defines a set of restrictions that can serve as the base of such a deterministic format. 4.2.1. core deterministic encoding requirements a cbor encoding satisfies the \"core deterministic encoding requirements\" if it satisfies the following restrictions: * preferred serialization must be used. in particular, this means that arguments (see section 3) for integers, lengths in major types 2 through 5, and tags must be as short as possible, for instance: - 0 to 23 and -1 to -24 must be expressed in the same byte as the major type; - 24 to 255 and -25 to -256 must be expressed only with an additional uint8_t; - 256 to 65535 and -257 to -65536 must be expressed only with an additional uint16_t; - 65536 to 4294967295 and -65537 to -4294967296 must be expressed only with an additional uint32_t. floating-point values also must use the shortest form that preserves the value, e.g., 1.5 is encoded as 0xf93e00 (binary16) and 1000000.5 as 0xfa49742408 (binary32). (one implementation of this is to have all floats start as a 64-bit float, then do a test conversion to a 32-bit float; if the result is the same numeric value, use the shorter form and repeat the process with a test conversion to a 16-bit float. this also works to select 16-bit float for positive and negative infinity as well.) * indefinite-length items must not appear. they can be encoded as definite-length items instead. * the keys in every map must be sorted in the bytewise lexicographic order of their deterministic encodings. for example, the following keys are sorted correctly: 1. 10, encoded as 0x0a. 2. 100, encoded as 0x1864. 3. -1, encoded as 0x20. 4. \"z\", encoded as 0x617a. 5. \"aa\", encoded as 0x626161. 6. [100], encoded as 0x811864. 7. [-1], encoded as 0x8120. 8. false, encoded as 0xf4. | implementation note: the self-delimiting nature of the cbor | encoding means that there are no two well-formed cbor encoded | data items where one is a prefix of the other. the bytewise | lexicographic comparison of deterministic encodings of | different map keys therefore always ends in a position where | the byte differs between the keys, before the end of a key is | reached. 4.2.2. additional deterministic encoding considerations cbor tags present additional considerations for deterministic encoding. if a cbor-based protocol were to provide the same semantics for the presence and absence of a specific tag (e.g., by allowing both tag 1 data items and raw numbers in a date/time position, treating the latter as if they were tagged), the deterministic format would not allow the presence of the tag, based on the \"shortest form\" principle. for example, a protocol might give encoders the choice of representing a url as either a text string or, using section 3.4.5.3, tag number 32 containing a text string. this protocol's deterministic encoding needs either to require that the tag is present or to require that it is absent, not allow either one. in a protocol that does require tags in certain places to obtain specific semantics, the tag needs to appear in the deterministic format as well. deterministic encoding considerations also apply to the content of tags. if a protocol includes a field that can express integers with an absolute value of 2^(64) or larger using tag numbers 2 or 3 (section 3.4.3), the protocol's deterministic encoding needs to specify whether smaller integers are also expressed using these tags or using major types 0 and 1. preferred serialization uses the latter choice, which is therefore recommended. protocols that include floating-point values, whether represented using basic floating-point values (section 3.3) or using tags (or both), may need to define extra requirements on their deterministic encodings, such as: * although ieee floating-point values can represent both positive and negative zero as distinct values, the application might not distinguish these and might decide to represent all zero values with a positive sign, disallowing negative zero. (the application may also want to restrict the precision of floating-point values in such a way that there is never a need to represent 64-bit -- or even 32-bit -- floating-point values.) * if a protocol includes a field that can express floating-point values, with a specific data model that declares integer and floating-point values to be interchangeable, the protocol's deterministic encoding needs to specify whether, for example, the integer 1.0 is encoded as 0x01 (unsigned integer), 0xf93c00 (binary16), 0xfa3f800000 (binary32), or 0xfb3ff0000000000000 (binary64). example rules for this are: 1. encode integral values that fit in 64 bits as values from major types 0 and 1, and other values as the preferred (smallest of 16-, 32-, or 64-bit) floating-point representation that accurately represents the value, 2. encode all values as the preferred floating-point representation that accurately represents the value, even for integral values, or 3. encode all values as 64-bit floating-point representations. rule 1 straddles the boundaries between integers and floating- point values, and rule 3 does not use preferred serialization, so rule 2 may be a good choice in many cases. * if nan is an allowed value, and there is no intent to support nan payloads or signaling nans, the protocol needs to pick a single representation, typically 0xf97e00. if that simple choice is not possible, specific attention will be needed for nan handling. * subnormal numbers (nonzero numbers with the lowest possible exponent of a given ieee 754 number format) may be flushed to zero outputs or be treated as zero inputs in some floating-point implementations. a protocol's deterministic encoding may want to specifically accommodate such implementations while creating an onus on other implementations by excluding subnormal numbers from interchange, interchanging zero instead. * the same number can be represented by different decimal fractions, by different bigfloats, and by different forms under other tags that may be defined to express numeric values. depending on the implementation, it may not always be practical to determine whether any of these forms (or forms in the basic generic data model) are equivalent. an application protocol that presents choices of this kind for the representation format of numbers needs to be explicit about how the formats for deterministic encoding are to be chosen. 4.2.3. length-first map key ordering the core deterministic encoding requirements (section 4.2.1) sort map keys in a different order from the one suggested by section 3.9 of [rfc7049] (called \"canonical cbor\" there). protocols that need to be compatible with the order specified in [rfc7049] can instead be specified in terms of this specification's \"length-first core deterministic encoding requirements\": a cbor encoding satisfies the \"length-first core deterministic encoding requirements\" if it satisfies the core deterministic encoding requirements except that the keys in every map must be sorted such that: 1. if two keys have different lengths, the shorter one sorts earlier; 2. if two keys have the same length, the one with the lower value in (bytewise) lexical order sorts earlier. for example, under the length-first core deterministic encoding requirements, the following keys are sorted correctly: 1. 10, encoded as 0x0a. 2. -1, encoded as 0x20. 3. false, encoded as 0xf4. 4. 100, encoded as 0x1864. 5. \"z\", encoded as 0x617a. 6. [-1], encoded as 0x8120. 7. \"aa\", encoded as 0x626161. 8. [100], encoded as 0x811864. | although [rfc7049] used the term \"canonical cbor\" for its form | of requirements on deterministic encoding, this document avoids | this term because \"canonicalization\" is often associated with | specific uses of deterministic encoding only. the terms are | essentially interchangeable, however, and the set of core | requirements in this document could also be called \"canonical | cbor\", while the length-first-ordered version of that could be | called \"old canonical cbor\". 5. creating cbor-based protocols data formats such as cbor are often used in environments where there is no format negotiation. a specific design goal of cbor is to not need any included or assumed schema: a decoder can take a cbor item and decode it with no other knowledge. of course, in real-world implementations, the encoder and the decoder will have a shared view of what should be in a cbor data item. for example, an agreed-to format might be \"the item is an array whose first value is a utf-8 string, second value is an integer, and subsequent values are zero or more floating-point numbers\" or \"the item is a map that has byte strings for keys and contains a pair whose key is 0xab01\". cbor-based protocols must specify how their decoders handle invalid and other unexpected data. cbor-based protocols may specify that they treat arbitrary valid data as unexpected. encoders for cbor- based protocols must produce only valid items, that is, the protocol cannot be designed to make use of invalid items. an encoder can be capable of encoding as many or as few types of values as is required by the protocol in which it is used; a decoder can be capable of understanding as many or as few types of values as is required by the protocols in which it is used. this lack of restrictions allows cbor to be used in extremely constrained environments. the rest of this section discusses some considerations in creating cbor-based protocols. with few exceptions, it is advisory only and explicitly excludes any language from bcp 14 [rfc2119] [rfc8174] other than words that could be interpreted as \"may\" in the sense of bcp 14. the exceptions aim at facilitating interoperability of cbor- based protocols while making use of a wide variety of both generic and application-specific encoders and decoders. 5.1. cbor in streaming applications in a streaming application, a data stream may be composed of a sequence of cbor data items concatenated back-to-back. in such an environment, the decoder immediately begins decoding a new data item if data is found after the end of a previous data item. not all of the bytes making up a data item may be immediately available to the decoder; some decoders will buffer additional data until a complete data item can be presented to the application. other decoders can present partial information about a top-level data item to an application, such as the nested data items that could already be decoded, or even parts of a byte string that hasn't completely arrived yet. such an application also must have a matching streaming security mechanism, where the desired protection is available for incremental data presented to the application. note that some applications and protocols will not want to use indefinite-length encoding. using indefinite-length encoding allows an encoder to not need to marshal all the data for counting, but it requires a decoder to allocate increasing amounts of memory while waiting for the end of the item. this might be fine for some applications but not others. 5.2. generic encoders and decoders a generic cbor decoder can decode all well-formed encoded cbor data items and present the data items to an application. see appendix c. (the diagnostic notation, section 8, may be used to present well- formed cbor values to humans.) generic cbor encoders provide an application interface that allows the application to specify any well-formed value to be encoded as a cbor data item, including simple values and tags unknown to the encoder. even though cbor attempts to minimize these cases, not all well- formed cbor data is valid: for example, the encoded text string \"0x62c0ae\" does not contain valid utf-8 (because [rfc3629] requires always using the shortest form) and so is not a valid cbor item. also, specific tags may make semantic constraints that may be violated, for instance, by a bignum tag enclosing another tag or by an instance of tag number 0 containing a byte string or containing a text string with contents that do not match the \"date-time\" production of [rfc3339]. there is no requirement that generic encoders and decoders make unnatural choices for their application interface to enable the processing of invalid data. generic encoders and decoders are expected to forward simple values and tags even if their specific codepoints are not registered at the time the encoder/ decoder is written (section 5.4). 5.3. validity of items a well-formed but invalid cbor data item (section 1.2) presents a problem with interpreting the data encoded in it in the cbor data model. a cbor-based protocol could be specified in several layers, in which the lower layers don't process the semantics of some of the cbor data they forward. these layers can't notice any validity errors in data they don't process and must forward that data as-is. the first layer that does process the semantics of an invalid cbor item must pick one of two choices: 1. replace the problematic item with an error marker and continue with the next item, or 2. issue an error and stop processing altogether. a cbor-based protocol must specify which of these options its decoders take for each kind of invalid item they might encounter. such problems might occur at the basic validity level of cbor or in the context of tags (tag validity). 5.3.1. basic validity two kinds of validity errors can occur in the basic generic data model: duplicate keys in a map: generic decoders (section 5.2) make data available to applications using the native cbor data model. that data model includes maps (key-value mappings with unique keys), not multimaps (key-value mappings where multiple entries can have the same key). thus, a generic decoder that gets a cbor map item that has duplicate keys will decode to a map with only one instance of that key, or it might stop processing altogether. on the other hand, a \"streaming decoder\" may not even be able to notice. see section 5.6 for more discussion of keys in maps. invalid utf-8 string: a decoder might or might not want to verify that the sequence of bytes in a utf-8 string (major type 3) is actually valid utf-8 and react appropriately. 5.3.2. tag validity two additional kinds of validity errors are introduced by adding tags to the basic generic data model: inadmissible type for tag content: tag numbers (section 3.4) specify what type of data item is supposed to be used as their tag content; for example, the tag numbers for unsigned or negative bignums are supposed to be put on byte strings. a decoder that decodes the tagged data item into a native representation (a native big integer in this example) is expected to check the type of the data item being tagged. even decoders that don't have such native representations available in their environment may perform the check on those tags known to them and react appropriately. inadmissible value for tag content: the type of data item may be admissible for a tag's content, but the specific value may not be; e.g., a value of \"yesterday\" is not acceptable for the content of tag 0, even though it properly is a text string. a decoder that normally ingests such tags into equivalent platform types might present this tag to the application in a similar way to how it would present a tag with an unknown tag number (section 5.4). 5.4. validity and evolution a decoder with validity checking will expend the effort to reliably detect data items with validity errors. for example, such a decoder needs to have an api that reports an error (and does not return data) for a cbor data item that contains any of the validity errors listed in the previous subsection. the set of tags defined in the \"concise binary object representation (cbor) tags\" registry (section 9.2), as well as the set of simple values defined in the \"concise binary object representation (cbor) simple values\" registry (section 9.1), can grow at any time beyond the set understood by a generic decoder. a validity-checking decoder can do one of two things when it encounters such a case that it does not recognize: * it can report an error (and not return data). note that treating this case as an error can cause ossification and is thus not encouraged. this error is not a validity error, per se. this kind of error is more likely to be raised by a decoder that would be performing validity checking if this were a known case. * it can emit the unknown item (type, value, and, for tags, the decoded tagged data item) to the application calling the decoder, and then give the application an indication that the decoder did not recognize that tag number or simple value. the latter approach, which is also appropriate for decoders that do not support validity checking, provides forward compatibility with newly registered tags and simple values without the requirement to update the encoder at the same time as the calling application. (for this, the decoder's api needs the ability to mark unknown items so that the calling application can handle them in a manner appropriate for the program.) since some of the processing needed for validity checking may have an appreciable cost (in particular with duplicate detection for maps), support of validity checking is not a requirement placed on all cbor decoders. some encoders will rely on their applications to provide input data in such a way that valid cbor results from the encoder. a generic encoder may also want to provide a validity-checking mode where it reliably limits its output to valid cbor, independent of whether or not its application is indeed providing api-conformant data. 5.5. numbers cbor-based protocols should take into account that different language environments pose different restrictions on the range and precision of numbers that are representable. for example, the basic javascript number system treats all numbers as floating-point values, which may result in the silent loss of precision in decoding integers with more than 53 significant bits. another example is that, since cbor keeps the sign bit for its integer representation in the major type, it has one bit more for signed numbers of a certain length (e.g., -2^(64)..2^(64)-1 for 1+8-byte integers) than the typical platform signed integer representation of the same length (-2^(63)..2^(63)-1 for 8-byte int64_t). a protocol that uses numbers should define its expectations on the handling of nontrivial numbers in decoders and receiving applications. a cbor-based protocol that includes floating-point numbers can restrict which of the three formats (half-precision, single- precision, and double-precision) are to be supported. for an integer-only application, a protocol may want to completely exclude the use of floating-point values. a cbor-based protocol designed for compactness may want to exclude specific integer encodings that are longer than necessary for the application, such as to save the need to implement 64-bit integers. there is an expectation that encoders will use the most compact integer representation that can represent a given value. however, a compact application that does not require deterministic encoding should accept values that use a longer-than-needed encoding (such as encoding \"0\" as 0b000_11001 followed by two bytes of 0x00) as long as the application can decode an integer of the given size. similar considerations apply to floating-point values; decoding both preferred serializations and longer-than-needed ones is recommended. cbor-based protocols for constrained applications that provide a choice between representing a specific number as an integer and as a decimal fraction or bigfloat (such as when the exponent is small and nonnegative) might express a quality-of-implementation expectation that the integer representation is used directly. 5.6. specifying keys for maps the encoding and decoding applications need to agree on what types of keys are going to be used in maps. in applications that need to interwork with json-based applications, conversion is simplified by limiting keys to text strings only; otherwise, there has to be a specified mapping from the other cbor types to text strings, and this often leads to implementation errors. in applications where keys are numeric in nature, and numeric ordering of keys is important to the application, directly using the numbers for the keys is useful. if multiple types of keys are to be used, consideration should be given to how these types would be represented in the specific programming environments that are to be used. for example, in javascript maps [ecma262], a key of integer 1 cannot be distinguished from a key of floating-point 1.0. this means that, if integer keys are used, the protocol needs to avoid the use of floating-point keys the values of which happen to be integer numbers in the same map. decoders that deliver data items nested within a cbor data item immediately on decoding them (\"streaming decoders\") often do not keep the state that is necessary to ascertain uniqueness of a key in a map. similarly, an encoder that can start encoding data items before the enclosing data item is completely available (\"streaming encoder\") may want to reduce its overhead significantly by relying on its data source to maintain uniqueness. a cbor-based protocol must define what to do when a receiving application sees multiple identical keys in a map. the resulting rule in the protocol must respect the cbor data model: it cannot prescribe a specific handling of the entries with the identical keys, except that it might have a rule that having identical keys in a map indicates a malformed map and that the decoder has to stop with an error. when processing maps that exhibit entries with duplicate keys, a generic decoder might do one of the following: * not accept maps with duplicate keys (that is, enforce validity for maps, see also section 5.4). these generic decoders are universally useful. an application may still need to perform its own duplicate checking based on application rules (for instance, if the application equates integers and floating-point values in map key positions for specific maps). * pass all map entries to the application, including ones with duplicate keys. this requires that the application handle (check against) duplicate keys, even if the application rules are identical to the generic data model rules. * lose some entries with duplicate keys, e.g., deliver only the final (or first) entry out of the entries with the same key. with such a generic decoder, applications may get different results for a specific key on different runs, and with different generic decoders, which value is returned is based on generic decoder implementation and the actual order of keys in the map. in particular, applications cannot validate key uniqueness on their own as they do not necessarily see all entries; they may not be able to use such a generic decoder if they need to validate key uniqueness. these generic decoders can only be used in situations where the data source and transfer always provide valid maps; this is not possible if the data source and transfer can be attacked. generic decoders need to document which of these three approaches they implement. the cbor data model for maps does not allow ascribing semantics to the order of the key/value pairs in the map representation. thus, a cbor-based protocol must not specify that changing the key/value pair order in a map changes the semantics, except to specify that some orders are disallowed, for example, where they would not meet the requirements of a deterministic encoding (section 4.2). (any secondary effects of map ordering such as on timing, cache usage, and other potential side channels are not considered part of the semantics but may be enough reason on their own for a protocol to require a deterministic encoding format.) applications for constrained devices should consider using small integers as keys if they have maps with a small number of frequently used keys; for instance, a set of 24 or fewer keys can be encoded in a single byte as unsigned integers, up to 48 if negative integers are also used. less frequently occurring keys can then use integers with longer encodings. 5.6.1. equivalence of keys the specific data model that applies to a cbor data item is used to determine whether keys occurring in maps are duplicates or distinct. at the generic data model level, numerically equivalent integer and floating-point values are distinct from each other, as they are from the various big numbers (tags 2 to 5). similarly, text strings are distinct from byte strings, even if composed of the same bytes. a tagged value is distinct from an untagged value or from a value tagged with a different tag number. within each of these groups, numeric values are distinct unless they are numerically equal (specifically, -0.0 is equal to 0.0); for the purpose of map key equivalence, nan values are equivalent if they have the same significand after zero-extending both significands at the right to 64 bits. both byte strings and text strings are compared byte by byte, arrays are compared element by element, and are equal if they have the same number of bytes/elements and the same values at the same positions. two maps are equal if they have the same set of pairs regardless of their order; pairs are equal if both the key and value are equal. tagged values are equal if both the tag number and the tag content are equal. (note that a generic decoder that provides processing for a specific tag may not be able to distinguish some semantically equivalent values, e.g., if leading zeroes occur in the content of tag 2 or tag 3 (section 3.4.3).) simple values are equal if they simply have the same value. nothing else is equal in the generic data model; a simple value 2 is not equivalent to an integer 2, and an array is never equivalent to a map. as discussed in section 2.2, specific data models can make values equivalent for the purpose of comparing map keys that are distinct in the generic data model. note that this implies that a generic decoder may deliver a decoded map to an application that needs to be checked for duplicate map keys by that application (alternatively, the decoder may provide a programming interface to perform this service for the application). specific data models are not able to distinguish values for map keys that are equal for this purpose at the generic data model level. 5.7. undefined values in some cbor-based protocols, the simple value (section 3.3) of \"undefined\" might be used by an encoder as a substitute for a data item with an encoding problem, in order to allow the rest of the enclosing data items to be encoded without harm. 6. converting data between cbor and json this section gives non-normative advice about converting between cbor and json. implementations of converters may use whichever advice here they want. it is worth noting that a json text is a sequence of characters, not an encoded sequence of bytes, while a cbor data item consists of bytes, not characters. 6.1. converting from cbor to json most of the types in cbor have direct analogs in json. however, some do not, and someone implementing a cbor-to-json converter has to consider what to do in those cases. the following non-normative advice deals with these by converting them to a single substitute value, such as a json null. * an integer (major type 0 or 1) becomes a json number. * a byte string (major type 2) that is not embedded in a tag that specifies a proposed encoding is encoded in base64url without padding and becomes a json string. * a utf-8 string (major type 3) becomes a json string. note that json requires escaping certain characters ([rfc8259], section 7): quotation mark (u+0022), reverse solidus (u+005c), and the \"c0 control characters\" (u+0000 through u+001f). all other characters are copied unchanged into the json utf-8 string. * an array (major type 4) becomes a json array. * a map (major type 5) becomes a json object. this is possible directly only if all keys are utf-8 strings. a converter might also convert other keys into utf-8 strings (such as by converting integers into strings containing their decimal representation); however, doing so introduces a danger of key collision. note also that, if tags on utf-8 strings are ignored as proposed below, this will cause a key collision if the tags are different but the strings are the same. * false (major type 7, additional information 20) becomes a json false. * true (major type 7, additional information 21) becomes a json true. * null (major type 7, additional information 22) becomes a json null. * a floating-point value (major type 7, additional information 25 through 27) becomes a json number if it is finite (that is, it can be represented in a json number); if the value is non-finite (nan, or positive or negative infinity), it is represented by the substitute value. * any other simple value (major type 7, any additional information value not yet discussed) is represented by the substitute value. * a bignum (major type 6, tag number 2 or 3) is represented by encoding its byte string in base64url without padding and becomes a json string. for tag number 3 (negative bignum), a \"~\" (ascii tilde) is inserted before the base-encoded value. (the conversion to a binary blob instead of a number is to prevent a likely numeric overflow for the json decoder.) * a byte string with an encoding hint (major type 6, tag number 21 through 23) is encoded as described by the hint and becomes a json string. * for all other tags (major type 6, any other tag number), the tag content is represented as a json value; the tag number is ignored. * indefinite-length items are made definite before conversion. a cbor-to-json converter may want to keep to the json profile i-json [rfc7493], to maximize interoperability and increase confidence that the json output can be processed with predictable results. for example, this has implications on the range of integers that can be represented reliably, as well as on the top-level items that may be supported by older json implementations. 6.2. converting from json to cbor all json values, once decoded, directly map into one or more cbor values. as with any kind of cbor generation, decisions have to be made with respect to number representation. in a suggested conversion: * json numbers without fractional parts (integer numbers) are represented as integers (major types 0 and 1, possibly major type 6, tag number 2 and 3), choosing the shortest form; integers longer than an implementation-defined threshold may instead be represented as floating-point values. the default range that is represented as integer is -2^(53)+1..2^(53)-1 (fully exploiting the range for exact integers in the binary64 representation often used for decoding json [rfc7493]). a cbor-based protocol, or a generic converter implementation, may choose -2^(32)..2^(32)-1 or -2^(64)..2^(64)-1 (fully using the integer ranges available in cbor with uint32_t or uint64_t, respectively) or even -2^(31)..2^(31)-1 or -2^(63)..2^(63)-1 (using popular ranges for two's complement signed integers). (if the json was generated from a javascript implementation, its precision is already limited to 53 bits maximum.) * numbers with fractional parts are represented as floating-point values, performing the decimal-to-binary conversion based on the precision provided by ieee 754 binary64. the mathematical value of the json number is converted to binary64 using the roundtiestoeven procedure in section 4.3.1 of [ieee754]. then, when encoding in cbor, the preferred serialization uses the shortest floating-point representation exactly representing this conversion result; for instance, 1.5 is represented in a 16-bit floating-point value (not all implementations will be capable of efficiently finding the minimum form, though). instead of using the default binary64 precision, there may be an implementation- defined limit to the precision of the conversion that will affect the precision of the represented values. decimal representation should only be used on the cbor side if that is specified in a protocol. cbor has been designed to generally provide a more compact encoding than json. one implementation strategy that might come to mind is to perform a json-to-cbor encoding in place in a single buffer. this strategy would need to carefully consider a number of pathological cases, such as that some strings represented with no or very few escapes and longer (or much longer) than 255 bytes may expand when encoded as utf-8 strings in cbor. similarly, a few of the binary floating-point representations might cause expansion from some short decimal representations (1.1, 1e9) in json. this may be hard to get right, and any ensuing vulnerabilities may be exploited by an attacker. 7. future evolution of cbor successful protocols evolve over time. new ideas appear, implementation platforms improve, related protocols are developed and evolve, and new requirements from applications and protocols are added. facilitating protocol evolution is therefore an important design consideration for any protocol development. for protocols that will use cbor, cbor provides some useful mechanisms to facilitate their evolution. best practices for this are well known, particularly from json format development of json- based protocols. therefore, such best practices are outside the scope of this specification. however, facilitating the evolution of cbor itself is very well within its scope. cbor is designed to both provide a stable basis for development of cbor-based protocols and to be able to evolve. since a successful protocol may live for decades, cbor needs to be designed for decades of use and evolution. this section provides some guidance for the evolution of cbor. it is necessarily more subjective than other parts of this document. it is also necessarily incomplete, lest it turn into a textbook on protocol development. 7.1. extension points in a protocol design, opportunities for evolution are often included in the form of extension points. for example, there may be a codepoint space that is not fully allocated from the outset, and the protocol is designed to tolerate and embrace implementations that start using more codepoints than initially allocated. sizing the codepoint space may be difficult because the range required may be hard to predict. protocol designs should attempt to make the codepoint space large enough so that it can slowly be filled over the intended lifetime of the protocol. cbor has three major extension points: the \"simple\" space (values in major type 7): of the 24 efficient (and 224 slightly less efficient) values, only a small number have been allocated. implementations receiving an unknown simple data item may easily be able to process it as such, given that the structure of the value is indeed simple. the iana registry in section 9.1 is the appropriate way to address the extensibility of this codepoint space. the \"tag\" space (values in major type 6): the total codepoint space is abundant; only a tiny part of it has been allocated. however, not all of these codepoints are equally efficient: the first 24 only consume a single (\"1+0\") byte, and half of them have already been allocated. the next 232 values only consume two (\"1+1\") bytes, with nearly a quarter already allocated. these subspaces need some curation to last for a few more decades. implementations receiving an unknown tag number can choose to process just the enclosed tag content or, preferably, to process the tag as an unknown tag number wrapping the tag content. the iana registry in section 9.2 is the appropriate way to address the extensibility of this codepoint space. the \"additional information\" space: an implementation receiving an unknown additional information value has no way to continue decoding, so allocating codepoints in this space is a major step beyond just exercising an extension point. there are also very few codepoints left. see also section 7.2. 7.2. curating the additional information space the human mind is sometimes drawn to filling in little perceived gaps to make something neat. we expect the remaining gaps in the codepoint space for the additional information values to be an attractor for new ideas, just because they are there. the present specification does not manage the additional information codepoint space by an iana registry. instead, allocations out of this space can only be done by updating this specification. for an additional information value of n >= 24, the size of the additional data typically is 2^(n-24) bytes. therefore, additional information values 28 and 29 should be viewed as candidates for 128-bit and 256-bit quantities, in case a need arises to add them to the protocol. additional information value 30 is then the only additional information value available for general allocation, and there should be a very good reason for allocating it before assigning it through an update of the present specification. 8. diagnostic notation cbor is a binary interchange format. to facilitate documentation and debugging, and in particular to facilitate communication between entities cooperating in debugging, this section defines a simple human-readable diagnostic notation. all actual interchange always happens in the binary format. note that this truly is a diagnostic format; it is not meant to be parsed. therefore, no formal definition (as in abnf) is given in this document. (implementers looking for a text-based format for representing cbor data items in configuration files may also want to consider yaml [yaml].) the diagnostic notation is loosely based on json as it is defined in rfc 8259, extending it where needed. the notation borrows the json syntax for numbers (integer and floating-point), true (>true<), false (>false<), null (>null<), utf-8 strings, arrays, and maps (maps are called objects in json; the diagnostic notation extends json here by allowing any data item in the key position). undefined is written >undefined< as in javascript. the non-finite floating-point numbers infinity, -infinity, and nan are written exactly as in this sentence (this is also a way they can be written in javascript, although json does not allow them). a tag is written as an integer number for the tag number, followed by the tag content in parentheses; for instance, a date in the format specified by rfc 3339 (iso 8601) could be notated as: 0(\"2013-03-21t20:04:00z\") or the equivalent relative time as the following: 1(1363896240) byte strings are notated in one of the base encodings, without padding, enclosed in single quotes, prefixed by >h< for base16, >b32< for base32, >h32< for base32hex, >b64< for base64 or base64url (the actual encodings do not overlap, so the string remains unambiguous). for example, the byte string 0x12345678 could be written h'12345678', b32'ci2fm6a', or b64'ejrwea'. unassigned simple values are given as \"simple()\" with the appropriate integer in the parentheses. for example, \"simple(42)\" indicates major type 7, value 42. a number of useful extensions to the diagnostic notation defined here are provided in appendix g of [rfc8610], \"extended diagnostic notation\" (edn). similarly, this notation could be extended in a separate document to provide documentation for nan payloads, which are not covered in this document. 8.1. encoding indicators sometimes it is useful to indicate in the diagnostic notation which of several alternative representations were actually used; for example, a data item written >1.5< by a diagnostic decoder might have been encoded as a half-, single-, or double-precision float. the convention for encoding indicators is that anything starting with an underscore and all following characters that are alphanumeric or underscore is an encoding indicator, and can be ignored by anyone not interested in this information. for example, \"_\" or \"_3\". encoding indicators are always optional. a single underscore can be written after the opening brace of a map or the opening bracket of an array to indicate that the data item was represented in indefinite-length format. for example, [_ 1, 2] contains an indicator that an indefinite-length representation was used to represent the data item [1, 2]. an underscore followed by a decimal digit n indicates that the preceding item (or, for arrays and maps, the item starting with the preceding bracket or brace) was encoded with an additional information value of 24+n. for example, 1.5_1 is a half-precision floating-point number, while 1.5_3 is encoded as double precision. this encoding indicator is not shown in appendix a. (note that the encoding indicator \"_\" is thus an abbreviation of the full form \"_7\", which is not used.) the detailed chunk structure of byte and text strings of indefinite length can be notated in the form (_ h'0123', h'4567') and (_ \"foo\", \"bar\"). however, for an indefinite-length string with no chunks inside, (_ ) would be ambiguous as to whether a byte string (0x5fff) or a text string (0x7fff) is meant and is therefore not used. the basic forms ''_ and \"\"_ can be used instead and are reserved for the case of no chunks only -- not as short forms for the (permitted, but not really useful) encodings with only empty chunks, which need to be notated as (_ ''), (_ \"\"), etc., to preserve the chunk structure. 9. iana considerations iana has created two registries for new cbor values. the registries are separate, that is, not under an umbrella registry, and follow the rules in [rfc8126]. iana has also assigned a new media type, an associated coap content-format entry, and a structured syntax suffix. 9.1. cbor simple values registry iana has created the \"concise binary object representation (cbor) simple values\" registry at [iana.cbor-simple-values]. the initial values are shown in table 4. new entries in the range 0 to 19 are assigned by standards action [rfc8126]. it is suggested that iana allocate values starting with the number 16 in order to reserve the lower numbers for contiguous blocks (if any). new entries in the range 32 to 255 are assigned by specification required. 9.2. cbor tags registry iana has created the \"concise binary object representation (cbor) tags\" registry at [iana.cbor-tags]. the tags that were defined in [rfc7049] are described in detail in section 3.4, and other tags have already been defined since then. new entries in the range 0 to 23 (\"1+0\") are assigned by standards action. new entries in the ranges 24 to 255 (\"1+1\") and 256 to 32767 (lower half of \"1+2\") are assigned by specification required. new entries in the range 32768 to 18446744073709551615 (upper half of \"1+2\", \"1+4\", and \"1+8\") are assigned by first come first served. the template for registration requests is: * data item * semantics (short form) in addition, first come first served requests should include: * point of contact * description of semantics (url) -- this description is optional; the url can point to something like an internet-draft or a web page. applicants exercising the first come first served range and making a suggestion for a tag number that is not representable in 32 bits (i.e., larger than 4294967295) should be aware that this could reduce interoperability with implementations that do not support 64-bit numbers. 9.3. media types registry the internet media type [rfc6838] (\"mime type\") for a single encoded cbor data item is \"application/cbor\" as defined in the \"media types\" registry [iana.media-types]: type name: application subtype name: cbor required parameters: n/a optional parameters: n/a encoding considerations: binary security considerations: see section 10 of rfc 8949. interoperability considerations: n/a published specification: rfc 8949 applications that use this media type: many additional information: magic number(s): n/a file extension(s): .cbor macintosh file type code(s): n/a person & email address to contact for further information: ietf cbor working group (cbor@ietf.org) or ietf applications and real-time area (art@ietf.org) intended usage: common restrictions on usage: none author: ietf cbor working group (cbor@ietf.org) change controller: the iesg (iesg@ietf.org) 9.4. coap content-format registry the coap content-format for cbor has been registered in the \"coap content-formats\" subregistry within the \"constrained restful environments (core) parameters\" registry [iana.core-parameters]: media type: application/cbor encoding: - id: 60 reference: rfc 8949 9.5. structured syntax suffix registry the structured syntax suffix [rfc6838] for media types based on a single encoded cbor data item is +cbor, which iana has registered in the \"structured syntax suffixes\" registry [iana.structured-suffix]: name: concise binary object representation (cbor) +suffix: +cbor references: rfc 8949 encoding considerations: cbor is a binary format. interoperability considerations: n/a fragment identifier considerations: the syntax and semantics of fragment identifiers specified for +cbor should be as specified for \"application/cbor\". (at publication of rfc 8949, there is no fragment identification syntax defined for \"application/cbor\".) the syntax and semantics for fragment identifiers for a specific \"xxx/yyy+cbor\" should be processed as follows: * for cases defined in +cbor, where the fragment identifier resolves per the +cbor rules, then process as specified in +cbor. * for cases defined in +cbor, where the fragment identifier does not resolve per the +cbor rules, then process as specified in \"xxx/yyy+cbor\". * for cases not defined in +cbor, then process as specified in \"xxx/yyy+cbor\". security considerations: see section 10 of rfc 8949. contact: ietf cbor working group (cbor@ietf.org) or ietf applications and real-time area (art@ietf.org) author/change controller: ietf 10. security considerations a network-facing application can exhibit vulnerabilities in its processing logic for incoming data. complex parsers are well known as a likely source of such vulnerabilities, such as the ability to remotely crash a node, or even remotely execute arbitrary code on it. cbor attempts to narrow the opportunities for introducing such vulnerabilities by reducing parser complexity, by giving the entire range of encodable values a meaning where possible. because cbor decoders are often used as a first step in processing unvalidated input, they need to be fully prepared for all types of hostile input that may be designed to corrupt, overrun, or achieve control of the system decoding the cbor data item. a cbor decoder needs to assume that all input may be hostile even if it has been checked by a firewall, has come over a secure channel such as tls, is encrypted or signed, or has come from some other source that is presumed trusted. section 4.1 gives examples of limitations in interoperability when using a constrained cbor decoder with input from a cbor encoder that uses a non-preferred serialization. when a single data item is consumed both by such a constrained decoder and a full decoder, it can lead to security issues that can be exploited by an attacker who can inject or manipulate content. as discussed throughout this document, there are many values that can be considered \"equivalent\" in some circumstances and \"not equivalent\" in others. as just one example, the numeric value for the number \"one\" might be expressed as an integer or a bignum. a system interpreting cbor input might accept either form for the number \"one\", or might reject one (or both) forms. such acceptance or rejection can have security implications in the program that is using the interpreted input. hostile input may be constructed to overrun buffers, to overflow or underflow integer arithmetic, or to cause other decoding disruption. cbor data items might have lengths or sizes that are intentionally extremely large or too short. resource exhaustion attacks might attempt to lure a decoder into allocating very big data items (strings, arrays, maps, or even arbitrary precision numbers) or exhaust the stack depth by setting up deeply nested items. decoders need to have appropriate resource management to mitigate these attacks. (items for which very large sizes are given can also attempt to exploit integer overflow vulnerabilities.) a cbor decoder, by definition, only accepts well-formed cbor; this is the first step to its robustness. input that is not well-formed cbor causes no further processing from the point where the lack of well- formedness was detected. if possible, any data decoded up to this point should have no impact on the application using the cbor decoder. in addition to ascertaining well-formedness, a cbor decoder might also perform validity checks on the cbor data. alternatively, it can leave those checks to the application using the decoder. this choice needs to be clearly documented in the decoder. beyond the validity at the cbor level, an application also needs to ascertain that the input is in alignment with the application protocol that is serialized in cbor. the input check itself may consume resources. this is usually linear in the size of the input, which means that an attacker has to spend resources that are commensurate to the resources spent by the defender on input validation. however, an attacker might be able to craft inputs that will take longer for a target decoder to process than for the attacker to produce. processing for arbitrary-precision numbers may exceed linear effort. also, some hash-table implementations that are used by decoders to build in-memory representations of maps can be attacked to spend quadratic effort, unless a secret key (see section 7 of [siphash_lncs], also [siphash_open]) or some other mitigation is employed. such superlinear efforts can be exploited by an attacker to exhaust resources at or before the input validator; they therefore need to be avoided in a cbor decoder implementation. note that tag number definitions and their implementations can add security considerations of this kind; this should then be discussed in the security considerations of the tag number definition. cbor encoders do not receive input directly from the network and are thus not directly attackable in the same way as cbor decoders. however, cbor encoders often have an api that takes input from another level in the implementation and can be attacked through that api. the design and implementation of that api should assume the behavior of its caller may be based on hostile input or on coding mistakes. it should check inputs for buffer overruns, overflow and underflow of integer arithmetic, and other such errors that are aimed to disrupt the encoder. protocols should be defined in such a way that potential multiple interpretations are reliably reduced to a single interpretation. for example, an attacker could make use of invalid input such as duplicate keys in maps, or exploit different precision in processing numbers to make one application base its decisions on a different interpretation than the one that will be used by a second application. to facilitate consistent interpretation, encoder and decoder implementations should provide a validity-checking mode of operation (section 5.4). note, however, that a generic decoder cannot know about all requirements that an application poses on its input data; it is therefore not relieving the application from performing its own input checking. also, since the set of defined tag numbers evolves, the application may employ a tag number that is not yet supported for validity checking by the generic decoder it uses. generic decoders therefore need to document which tag numbers they support and what validity checking they provide for those tag numbers as well as for basic cbor (utf-8 checking, duplicate map key checking). section 3.4.3 notes that using the non-preferred choice of a bignum representation instead of a basic integer for encoding a number is not intended to have application semantics, but it can have such semantics if an application receiving cbor data is using a decoder in the basic generic data model. this disparity causes a security issue if the two sets of semantics differ. thus, applications using cbor need to specify the data model that they are using for each use of cbor data. it is common to convert cbor data to other formats. in many cases, cbor has more expressive types than other formats; this is particularly true for the common conversion to json. the loss of type information can cause security issues for the systems that are processing the less-expressive data. section 6.2 describes a possibly common usage scenario of converting between cbor and json that could allow an attack if the attacker knows that the application is performing the conversion. security considerations for the use of base16 and base64 from [rfc4648], and the use of utf-8 from [rfc3629], are relevant to cbor as well. 11. references 11.1. normative references [c] international organization for standardization, \"information technology - programming languages - c\", fourth edition, iso/iec 9899:2018, june 2018, <https://www.iso.org/standard/74528.html>. [cplusplus20] international organization for stan
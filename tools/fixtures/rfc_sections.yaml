ata items follow) | +------------+------------------------------------------------+ | 0xbf | map, pairs of data items follow, terminated by | | | \"break\" | +------------+------------------------------------------------+ | 0xc0 | text-based date/time (data item follows; see | | | section 3.4.1) | +------------+------------------------------------------------+ | 0xc1 | epoch-based date/time (data item follows; see | | | section 3.4.2) | +------------+------------------------------------------------+ | 0xc2 | unsigned bignum (data item \"byte string\" | | | follows) | +------------+------------------------------------------------+ | 0xc3 | negative bignum (data item \"byte string\" | | | follows) | +------------+------------------------------------------------+ | 0xc4 | decimal fraction (data item \"array\" follows; | | | see section 3.4.4) | +------------+------------------------------------------------+ | 0xc5 | bigfloat (data item \"array\" follows; see | | | section 3.4.4) | +------------+------------------------------------------------+ | 0xc6..0xd4 | (tag) | +------------+------------------------------------------------+ | 0xd5..0xd7 | expected conversion (data item follows; see | | | section 3.4.5.2) | +------------+------------------------------------------------+ | 0xd8..0xdb | (more tags; 1/2/4/8 bytes of tag number and | | | then a data item follow) | +------------+------------------------------------------------+ | 0xe0..0xf3 | (simple value) | +------------+------------------------------------------------+ | 0xf4 | false | +------------+------------------------------------------------+ | 0xf5 | true | +------------+------------------------------------------------+ | 0xf6 | null | +------------+------------------------------------------------+ | 0xf7 | undefined | +------------+------------------------------------------------+ | 0xf8 | (simple value, one byte follows) | +------------+------------------------------------------------+ | 0xf9 | half-precision float (two-byte ieee 754) | +------------+------------------------------------------------+ | 0xfa | single-precision float (four-byte ieee 754) | +------------+------------------------------------------------+ | 0xfb | double-precision float (eight-byte ieee 754) | +------------+------------------------------------------------+ | 0xff | \"break\" stop code | +------------+------------------------------------------------+ table 7: jump table for initial byte appendix c. pseudocode the well-formedness of a cbor item can be checked by the pseudocode in figure 1. the data is well-formed if and only if: * the pseudocode does not \"fail\"; * after execution of the pseudocode, no bytes are left in the input (except in streaming applications). the pseudocode has the following prerequisites: * take(n) reads n bytes from the input data and returns them as a byte string. if n bytes are no longer available, take(n) fails. * uint() converts a byte string into an unsigned integer by interpreting the byte string in network byte order. * arithmetic works as in c. * all variables are unsigned integers of sufficient range. note that \"well_formed\" returns the major type for well-formed definite-length items, but 99 for an indefinite-length item (or -1 for a \"break\" stop code, only if \"breakable\" is set). this is used in \"well_formed_indefinite\" to ascertain that indefinite-length strings only contain definite-length strings as chunks. well_formed(breakable = false) { // process initial bytes ib = uint(take(1)); mt = ib >> 5; val = ai = ib & 0x1f; switch (ai) { case 24: val = uint(take(1)); break; case 25: val = uint(take(2)); break; case 26: val = uint(take(4)); break; case 27: val = uint(take(8)); break; case 28: case 29: case 30: fail(); case 31: return well_formed_indefinite(mt, breakable); } // process content switch (mt) { // case 0, 1, 7 do not have content; just use val case 2: case 3: take(val); break; // bytes/utf-8 case 4: for (i = 0; i < val; i++) well_formed(); break; case 5: for (i = 0; i < val*2; i++) well_formed(); break; case 6: well_formed(); break; // 1 embedded data item case 7: if (ai == 24 && val < 32) fail(); // bad simple } return mt; // definite-length data item } well_formed_indefinite(mt, breakable) { switch (mt) { case 2: case 3: while ((it = well_formed(true)) != -1) if (it != mt) // need definite-length chunk fail(); // of same type break; case 4: while (well_formed(true) != -1); break; case 5: while (well_formed(true) != -1) well_formed(); break; case 7: if (breakable) return -1; // signal break out else fail(); // no enclosing indefinite default: fail(); // wrong mt } return 99; // indefinite-length data item } figure 1: pseudocode for well-formedness check note that the remaining complexity of a complete cbor decoder is about presenting data that has been decoded to the application in an appropriate form. major types 0 and 1 are designed in such a way that they can be encoded in c from a signed integer without actually doing an if-then- else for positive/negative (figure 2). this uses the fact that (-1-n), the transformation for major type 1, is the same as ~n (bitwise complement) in c unsigned arithmetic; ~n can then be expressed as (-1)^n for the negative case, while 0^n leaves n unchanged for nonnegative. the sign of a number can be converted to -1 for negative and 0 for nonnegative (0 or positive) by arithmetic- shifting the number by one bit less than the bit length of the number (for example, by 63 for 64-bit numbers). void encode_sint(int64_t n) { uint64t ui = n >> 63; // extend sign to whole length unsigned mt = ui & 0x20; // extract (shifted) major type ui ^= n; // complement negatives if (ui < 24) *p++ = mt + ui; else if (ui < 256) { *p++ = mt + 24; *p++ = ui; } else ... figure 2: pseudocode for encoding a signed integer see section 1.2 for some specific assumptions about the profile of the c language used in these pieces of code. appendix d. half-precision as half-precision floating-point numbers were only added to ieee 754 in 2008 [ieee754], today's programming platforms often still only have limited support for them. it is very easy to include at least decoding support for them even without such support. an example of a small decoder for half-precision floating-point numbers in the c language is shown in figure 3. a similar program for python is in figure 4; this code assumes that the 2-byte value has already been decoded as an (unsigned short) integer in network byte order (as would be done by the pseudocode in appendix c). #include <math.h> double decode_half(unsigned char *halfp) { unsigned half = (halfp[0] << 8) + halfp[1]; unsigned exp = (half >> 10) & 0x1f; unsigned mant = half & 0x3ff; double val; if (exp == 0) val = ldexp(mant, -24); else if (exp != 31) val = ldexp(mant + 1024, exp - 25); else val = mant == 0 ? infinity : nan; return half & 0x8000 ? -val : val; } figure 3: c code for a half-precision decoder import struct from math import ldexp def decode_single(single): return struct.unpack(\"!f\", struct.pack(\"!i\", single))[0] def decode_half(half): valu = (half & 0x7fff) << 13 | (half & 0x8000) << 16 if ((half & 0x7c00) != 0x7c00): return ldexp(decode_single(valu), 112) return decode_single(valu | 0x7f800000) figure 4: python code for a half-precision decoder appendix e. comparison of other binary formats to cbor's design objectives the proposal for cbor follows a history of binary formats that is as long as the history of computers themselves. different formats have had different objectives. in most cases, the objectives of the format were never stated, although they can sometimes be implied by the context where the format was first used. some formats were meant to be universally usable, although history has proven that no binary format meets the needs of all protocols and applications. cbor differs from many of these formats due to it starting with a set of objectives and attempting to meet just those. this section compares a few of the dozens of formats with cbor's objectives in order to help the reader decide if they want to use cbor or a different format for a particular protocol or application. note that the discussion here is not meant to be a criticism of any format: to the best of our knowledge, no format before cbor was meant to cover cbor's objectives in the priority we have assigned them. a brief recap of the objectives from section 1.1 is: 1. unambiguous encoding of most common data formats from internet standards 2. code compactness for encoder or decoder 3. no schema description needed 4. reasonably compact serialization 5. applicability to constrained and unconstrained applications 6. good json conversion 7. extensibility a discussion of cbor and other formats with respect to a different set of design objectives is provided in section 5 and appendix c of [rfc8618]. e.1. asn.1 der, ber, and per [asn.1] has many serializations. in the ietf, der and ber are the most common. the serialized output is not particularly compact for many items, and the code needed to decode numeric items can be complex on a constrained device. few (if any) ietf protocols have adopted one of the several variants of packed encoding rules (per). there could be many reasons for this, but one that is commonly stated is that per makes use of the schema even for parsing the surface structure of the data item, requiring significant tool support. there are different versions of the asn.1 schema language in use, which has also hampered adoption. e.2. messagepack [messagepack] is a concise, widely implemented counted binary serialization format, similar in many properties to cbor, although somewhat less regular. while the data model can be used to represent json data, messagepack has also been used in many remote procedure call (rpc) applications and for long-term storage of data. messagepack has been essentially stable since it was first published around 2011; it has not yet had a transition. the evolution of messagepack is impeded by an imperative to maintain complete backwards compatibility with existing stored data, while only few bytecodes are still available for extension. repeated requests over the years from the messagepack user community to separate out binary and text strings in the encoding recently have led to an extension proposal that would leave messagepack's \"raw\" data ambiguous between its usages for binary and text data. the extension mechanism for messagepack remains unclear. e.3. bson [bson] is a data format that was developed for the storage of json- like maps (json objects) in the mongodb database. its major distinguishing feature is the capability for in-place update, which prevents a compact representation. bson uses a counted representation except for map keys, which are null-byte terminated. while bson can be used for the representation of json-like objects on the wire, its specification is dominated by the requirements of the database application and has become somewhat baroque. the status of how bson extensions will be implemented remains unclear. e.4. msdtp: rfc 713 message services data transmission (msdtp) is a very early example of a compact message format; it is described in [rfc0713], written in 1976. it is included here for its historical value, not because it was ever widely used. e.5. conciseness on the wire while cbor's design objective of code compactness for encoders and decoders is a higher priority than its objective of conciseness on the wire, many people focus on the wire size. table 8 shows some encoding examples for the simple nested array [1, [2, 3]]; where some form of indefinite-length encoding is supported by the encoding, [_ 1, [2, 3]] (indefinite length on the outer array) is also shown. +=============+============================+================+ | format | [1, [2, 3]] | [_ 1, [2, 3]] | +=============+============================+================+ | rfc 713 | c2 05 81 c2 02 82 83 | | +-------------+----------------------------+----------------+ | asn.1 ber | 30 0b 02 01 01 30 06 02 01 | 30 80 02 01 01 | | | 02 02 01 03 | 30 06 02 01 02 | | | | 02 01 03 00 00 | +-------------+----------------------------+----------------+ | messagepack | 92 01 92 02 03 | | +-------------+----------------------------+----------------+ | bson | 22 00 00 00 10 30 00 01 00 | | | | 00 00 04 31 00 13 00 00 00 | | | | 10 30 00 02 00 00 00 10 31 | | | | 00 03 00 00 00 00 00 | | +-------------+----------------------------+----------------+ | cbor | 82 01 82 02 03 | 9f 01 82 02 03 | | | | ff | +-------------+----------------------------+----------------+ table 8: examples for different levels of conciseness appendix f. well-formedness errors and examples there are three basic kinds of well-formedness errors that can occur in decoding a cbor data item: too much data: there are input bytes left that were not consumed. this is only an error if the application assumed that the input bytes would span exactly one data item. where the application uses the self-delimiting nature of cbor encoding to permit additional data after the data item, as is done in cbor sequences [rfc8742], for example, the cbor decoder can simply indicate which part of the input has not been consumed. too little data: the input data available would need additional bytes added at their end for a complete cbor data item. this may indicate the input is truncated; it is also a common error when trying to decode random data as cbor. for some applications, however, this may not actually be an error, as the application may not be certain it has all the data yet and can obtain or wait for additional input bytes. some of these applications may have an upper limit for how much additional data can appear; here the decoder may be able to indicate that the encoded cbor data item cannot be completed within this limit. syntax error: the input data are not consistent with the requirements of the cbor encoding, and this cannot be remedied by adding (or removing) data at the end. in appendix c, errors of the first kind are addressed in the first paragraph and bullet list (requiring \"no bytes are left\"), and errors of the second kind are addressed in the second paragraph/bullet list (failing \"if n bytes are no longer available\"). errors of the third kind are identified in the pseudocode by specific instances of calling fail(), in order: * a reserved value is used for additional information (28, 29, 30) * major type 7, additional information 24, value < 32 (incorrect) * incorrect substructure of indefinite-length byte string or text string (may only contain definite-length strings of the same major type) * \"break\" stop code (major type 7, additional information 31) occurs in a value position of a map or except at a position directly in an indefinite-length item where also another enclosed data item could occur * additional information 31 used with major type 0, 1, or 6 f.1. examples of cbor data items that are not well-formed this subsection shows a few examples for cbor data items that are not well-formed. each example is a sequence of bytes, each shown in hexadecimal; multiple examples in a list are separated by commas. examples for well-formedness error kind 1 (too much data) can easily be formed by adding data to a well-formed encoded cbor data item. similarly, examples for well-formedness error kind 2 (too little data) can be formed by truncating a well-formed encoded cbor data item. in test suites, it may be beneficial to specifically test with incomplete data items that would require large amounts of addition to be completed (for instance by starting the encoding of a string of a very large size). a premature end of the input can occur in a head or within the enclosed data, which may be bare strings or enclosed data items that are either counted or should have been ended by a \"break\" stop code. end of input in a head: 18, 19, 1a, 1b, 19 01, 1a 01 02, 1b 01 02 03 04 05 06 07, 38, 58, 78, 98, 9a 01 ff 00, b8, d8, f8, f9 00, fa 00 00, fb 00 00 00 definite-length strings with short data: 41, 61, 5a ff ff ff ff 00, 5b ff ff ff ff ff ff ff ff 01 02 03, 7a ff ff ff ff 00, 7b 7f ff ff ff ff ff ff ff 01 02 03 definite-length maps and arrays not closed with enough items: 81, 81 81 81 81 81 81 81 81 81, 82 00, a1, a2 01 02, a1 00, a2 00 00 00 tag number not followed by tag content: c0 indefinite-length strings not closed by a \"break\" stop code: 5f 41 00, 7f 61 00 indefinite-length maps and arrays not closed by a \"break\" stop code: 9f, 9f 01 02, bf, bf 01 02 01 02, 81 9f, 9f 80 00, 9f 9f 9f 9f 9f ff ff ff ff, 9f 81 9f 81 9f 9f ff ff ff a few examples for the five subkinds of well-formedness error kind 3 (syntax error) are shown below. subkind 1: reserved additional information values: 1c, 1d, 1e, 3c, 3d, 3e, 5c, 5d, 5e, 7c, 7d, 7e, 9c, 9d, 9e, bc, bd, be, dc, dd, de, fc, fd, fe, subkind 2: reserved two-byte encodings of simple values: f8 00, f8 01, f8 18, f8 1f subkind 3: indefinite-length string chunks not of the correct type: 5f 00 ff, 5f 21 ff, 5f 61 00 ff, 5f 80 ff, 5f a0 ff, 5f c0 00 ff, 5f e0 ff, 7f 41 00 ff indefinite-length string chunks not definite length: 5f 5f 41 00 ff ff, 7f 7f 61 00 ff ff subkind 4: break occurring on its own outside of an indefinite-length item: ff break occurring in a definite-length array or map or a tag: 81 ff, 82 00 ff, a1 ff, a1 ff 00, a1 00 ff, a2 00 00 ff, 9f 81 ff, 9f 82 9f 81 9f 9f ff ff ff ff break in an indefinite-length map that would lead to an odd number of items (break in a value position): bf 00 ff, bf 00 00 00 ff subkind 5: major type 0, 1, 6 with additional information 31: 1f, 3f, df appendix g. changes from rfc 7049 as discussed in the introduction, this document formally obsoletes rfc 7049 while keeping full compatibility with the interchange format from rfc 7049. this document provides editorial improvements, added detail, and fixed errata. this document does not create a new version of the format. g.1. errata processing and clerical changes the two verified errata on rfc 7049, [err3764] and [err3770], concerned two encoding examples in the text that have been corrected (section 3.4.3: \"29\" -> \"49\", section 5.5: \"0b000_11101\" -> \"0b000_11001\"). also, rfc 7049 contained an example using the numeric value 24 for a simple value [err5917], which is not well- formed; this example has been removed. errata report 5763 [err5763] pointed to an error in the wording of the definition of tags; this was resolved during a rewrite of section 3.4. errata report 5434 [err5434] pointed out that the universal binary json (ubjson) example in appendix e no longer complied with the version of ubjson current at the time of the errata report submission. it turned out that the ubjson specification had completely changed since 2013; this example therefore was removed. other errata reports [err4409] [err4963] [err4964] complained that the map key sorting rules for canonical encoding were onerous; these led to a reconsideration of the canonical encoding suggestions and replacement by the deterministic encoding suggestions (described below). an editorial suggestion in errata report 4294 [err4294] was also implemented (improved symmetry by adding \"second value\" to a comment to the last example in section 3.2.2). other clerical changes include: * the use of new xml2rfc functionality [rfc7991]; * more explanation of the notation used; * the update of references, e.g., from rfc 4627 to [rfc8259], from cnn-terms to [rfc7228], and from the 5.1 edition to the 11th edition of [ecma262]; the addition of a reference to [ieee754] and importation of required definitions; the addition of references to [c] and [cplusplus20]; and the addition of a reference to [rfc8618] that further illustrates the discussion in appendix e; * in the discussion of diagnostic notation (section 8), the \"extended diagnostic notation\" (edn) defined in [rfc8610] is now mentioned, the gap in representing nan payloads is now highlighted, and an explanation of representing indefinite-length strings with no chunks has been added (section 8.1); * the addition of this appendix. g.2. changes in iana considerations the iana considerations were generally updated (clerical changes, e.g., now pointing to the cbor working group as the author of the specification). references to the respective iana registries were added to the informative references. in the \"concise binary object representation (cbor) tags\" registry [iana.cbor-tags], tags in the space from 256 to 32767 (lower half of \"1+2\") are no longer assigned by first come first served; this range is now specification required. g.3. changes in suggestions and other informational components while revising the document, beyond the addressing of the errata reports, the working group drew upon nearly seven years of experience with cbor in a diverse set of applications. this led to a number of editorial changes, including adding tables for illustration, but also emphasizing some aspects and de-emphasizing others. a significant addition is section 2, which discusses the cbor data model and its small variations involved in the processing of cbor. the introduction of terms for those variations (basic generic, extended generic, specific) enables more concise language in other places of the document and also helps to clarify expectations of implementations and of the extensibility features of the format. as a format derived from the json ecosystem, rfc 7049 was influenced by the json number system that was in turn inherited from javascript at the time. json does not provide distinct integers and floating- point values (and the latter are decimal in the format). cbor provides binary representations of numbers, which do differ between integers and floating-point values. experience from implementation and use suggested that the separation between these two number domains should be more clearly drawn in the document; language that suggested an integer could seamlessly stand in for a floating-point value was removed. also, a suggestion (based on i-json [rfc7493]) was added for handling these types when converting json to cbor, and the use of a specific rounding mechanism has been recommended. for a single value in the data model, cbor often provides multiple encoding options. a new section (section 4) introduces the term \"preferred serialization\" (section 4.1) and defines it for various kinds of data items. on the basis of this terminology, the section then discusses how a cbor-based protocol can define \"deterministic encoding\" (section 4.2), which avoids terms \"canonical\" and \"canonicalization\" from rfc 7049. the suggestion of \"core deterministic encoding requirements\" (section 4.2.1) enables generic support for such protocol-defined encoding requirements. this document further eases the implementation of deterministic encoding by simplifying the map ordering suggested in rfc 7049 to a simple lexicographic ordering of encoded keys. a description of the older suggestion is kept as an alternative, now termed \"length-first map key ordering\" (section 4.2.3). the terminology for well-formed and valid data was sharpened and more stringently used, avoiding less well-defined alternative terms such as \"syntax error\", \"decoding error\", and \"strict mode\" outside of examples. also, a third level of requirements that an application has on its input data beyond cbor-level validity is now explicitly called out. well-formed (processable at all), valid (checked by a validity-checking generic decoder), and expected input (as checked by the application) are treated as a hierarchy of layers of acceptability. the handling of non-well-formed simple values was clarified in text and pseudocode. appendix f was added to discuss well-formedness errors and provide examples for them. the pseudocode was updated to be more portable, and some portability considerations were added. the discussion of validity has been sharpened in two areas. map validity (handling of duplicate keys) was clarified, and the domain of applicability of certain implementation choices explained. also, while streamlining the terminology for tags, tag numbers, and tag content, discussion was added on tag validity, and the restrictions were clarified on tag content, in general and specifically for tag 1. an implementation note (and note for future tag definitions) was added to section 3.4 about defining tags with semantics that depend on serialization order. tag 35 is not defined by this document; the registration based on the definition in rfc 7049 remains in place. terminology was introduced in section 3 for \"argument\" and \"head\", simplifying further discussion. the security considerations (section 10) were mostly rewritten and significantly expanded; in multiple other places, the document is now more explicit that a decoder cannot simply condone well-formedness errors. acknowledgements cbor was inspired by messagepack. messagepack was developed and promoted by sadayuki furuhashi (\"frsyuki\"). this reference to messagepack is solely for attribution; cbor is not intended as a version of, or replacement for, messagepack, as it has different design goals and requirements. the need for functionality beyond the original messagepack specification became obvious to many people at about the same time around the year 2012. binarypack is a minor derivation of messagepack that was developed by eric zhang for the binaryjs project. a similar, but different, extension was made by tim caswell for his msgpack-js and msgpack-js-browser projects. many people have contributed to the discussion about extending messagepack to separate text string representation from byte string representation. the encoding of the additional information in cbor was inspired by the encoding of length information designed by klaus hartke for coap. this document also incorporates suggestions made by many people, notably dan frost, james manger, jeffrey yasskin, joe hildebrand, keith moore, laurence lundblade, matthew lepinski, michael richardson, nico williams, peter occil, phillip hallam-baker, ray polk, stuart cheshire, tim bray, tony finch, tony hansen, and yaron sheffer. benjamin kaduk provided an extensive review during iesg processing. éric vyncke, erik kline, robert wilton, and roman danyliw provided further iesg comments, which included an iot directorate review by eve schooler. authors' addresses carsten bormann universität bremen tzi postfach 330440 d-28359 bremen germany phone: +49-421-218-63921 email: cabo@tzi.org paul hoffman icann email: paul.hoffman@icann.org "

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Validate research state
        run: python -m frontier.cli validate
      - name: Artifact envelope lint
        # Every tracked artifact must parse and carry the required envelope
        # fields. This was never wired in, which is why a two-byte "{}" stub sat
        # in knowledge/indices undetected through an entire session.
        run: python tools/lint_artifacts.py
      - name: Promotion gate selftest
        # The gate is the instrument that decides whether a finding may be
        # promoted. Its selftest exercises nine refusal modes plus one ALLOW
        # control. A gate that is never run is not a gate: this session found and
        # fixed a splice defect in it, and without this step nothing would have
        # noticed the fix regress.
        run: python tools/promotion_gate.py --selftest

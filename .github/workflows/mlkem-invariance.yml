name: mlkem-invariance-matrix

# msn-2026-0002 cross-path invariance matrix: OpenSSL raw vs SPKI, default vs FIPS,
# liboqs auto vs forced-ref, .NET CNG vs OpenSSL backings.
# All jobs are public runners, no secrets, contents:read.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mission/msn-2026-0002*
  pull_request:
    paths:
      - crypto/mlkem-input-checks/**
      - .github/workflows/mlkem-invariance.yml

permissions:
  contents: read

jobs:
  openssl-invariance:
    name: OpenSSL 3.5.7 invariance (raw/SPKI x default/FIPS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install perl for Configure
        run: sudo apt-get update && sudo apt-get install -y perl
      - name: Build pinned OpenSSL with FIPS
        run: |
          git clone --depth 1 --branch openssl-3.5.7 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          ./Configure enable-fips no-shared --prefix=$PWD/../openssl-install
          make -j4 > build.log 2>&1 || (tail -100 build.log && exit 1)
          make install_sw > /dev/null
          make install_fips > /dev/null || echo "install_fips optional"
          echo "Running fipsinstall to generate fipsmodule.cnf"
          ./apps/openssl fipsinstall -out ../openssl-install/ssl/fipsmodule.cnf -module ../openssl-install/lib64/ossl-modules/fips.so || ./apps/openssl fipsinstall -out ../openssl-install/ssl/fipsmodule.cnf -module ../openssl-install/lib/ossl-modules/fips.so || echo "fipsinstall fallback"
          cat ../openssl-install/ssl/fipsmodule.cnf | head -20
          echo "OPENSSL_CONF=../openssl-install/ssl/openssl.cnf"
          cat openssl.cnf 2>/dev/null | head -20 || echo "no openssl.cnf yet"
      - name: Compile invariance runner
        run: |
          gcc -O2 -Wall -o openssl_invar_runner crypto/mlkem-input-checks/harnesses/openssl_invar_runner.c \
            -I openssl-install/include -L openssl-install/lib64 -L openssl-install/lib -lcrypto \
            -Wl,-rpath,$PWD/openssl-install/lib64 -Wl,-rpath,$PWD/openssl-install/lib
          ./openssl_invar_runner --help 2>&1 || true
      - name: Run invariance matrix
        run: |
          ./openssl_invar_runner crypto/mlkem-input-checks/stimuli/stimuli.tsv openssl_invar_report.tsv
          cat openssl_invar_report.tsv | head -20
          cat openssl_invar_report.tsv | grep META
          cat openssl_invar_report.tsv | tail -20
      - uses: actions/upload-artifact@v4
        with:
          name: openssl_invar_report
          path: openssl_invar_report.tsv

  liboqs-auto:
    name: liboqs auto backend (ubuntu-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build liboqs auto
        run: |
          git clone --depth 1 --branch 0.16.0 https://github.com/open-quantum-safe/liboqs.git liboqs
          cmake -S liboqs -B build-auto -DCMAKE_BUILD_TYPE=Release -DOQS_MINIMAL_BUILD="KEM_ml_kem_512;KEM_ml_kem_768;KEM_ml_kem_1024" -DOQS_DIST_BUILD=ON
          cmake --build build-auto -j4
          cat build-auto/CMakeCache.txt | grep -i mlkem | head -20
          cat build-auto/CMakeCache.txt | grep -i DIST | head -20
      - name: Compile runner (auto)
        run: |
          gcc -O2 -Wall -o oqs_auto_runner crypto/mlkem-input-checks/harnesses/oqs_runner.c \
            -I build-auto/include -I liboqs/src -L build-auto/lib -loqs -lcrypto
          echo "compiled auto"
      - name: Run auto
        run: |
          ./oqs_auto_runner crypto/mlkem-input-checks/stimuli/stimuli.tsv oqs_auto_report.tsv || LD_LIBRARY_PATH=build-auto/lib ./oqs_auto_runner crypto/mlkem-input-checks/stimuli/stimuli.tsv oqs_auto_report.tsv
          cat oqs_auto_report.tsv | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: oqs_auto_report
          path: oqs_auto_report.tsv

  liboqs-ref:
    name: liboqs forced-ref backend (ubuntu-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build liboqs forced-ref
        run: |
          git clone --depth 1 --branch 0.16.0 https://github.com/open-quantum-safe/liboqs.git liboqs
          cmake -S liboqs -B build-ref -DCMAKE_BUILD_TYPE=Release -DOQS_MINIMAL_BUILD="KEM_ml_kem_512;KEM_ml_kem_768;KEM_ml_kem_1024" -DOQS_DIST_BUILD=OFF
          cmake --build build-ref -j4
          cat build-ref/CMakeCache.txt | grep -i mlkem | head -20
          cat build-ref/CMakeCache.txt | grep -i DIST | head -20
      - name: Compile runner (ref)
        run: |
          gcc -O2 -Wall -DBACKEND_NAME=\"ref\" -o oqs_ref_runner crypto/mlkem-input-checks/harnesses/oqs_runner.c \
            -I build-ref/include -I liboqs/src -L build-ref/lib -loqs -lcrypto
          echo "compiled ref"
      - name: Run ref
        run: |
          ./oqs_ref_runner crypto/mlkem-input-checks/stimuli/stimuli.tsv oqs_ref_report.tsv || LD_LIBRARY_PATH=build-ref/lib ./oqs_ref_runner crypto/mlkem-input-checks/stimuli/stimuli.tsv oqs_ref_report.tsv
          cat oqs_ref_report.tsv | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: oqs_ref_report
          path: oqs_ref_report.tsv

  dotnet-invariance:
    name: .NET MLKem backing invariance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build OpenSSL 3.5.7 for Linux backing (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          git clone --depth 1 --branch openssl-3.5.7 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          ./Configure no-shared --prefix=$PWD/../openssl-install
          make -j4 > build.log 2>&1 || (tail -100 build.log && exit 1)
          make install_sw > /dev/null
          echo "OPENSSL_INSTALL=$PWD/../openssl-install" >> $GITHUB_ENV
          ls ../openssl-install/lib64/*.so* | head -5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build runner
        run: dotnet publish crypto/mlkem-input-checks/harnesses/dotnet_runner -c Release -o out
      - name: Run
        run: |
          if ($IsWindows) { $exe = "out/dotnet_runner.exe"; & $exe crypto/mlkem-input-checks/stimuli/stimuli.tsv dotnet_invar_${{ matrix.os }}_report.tsv }
          else { LD_LIBRARY_PATH=$PWD/openssl-install/lib64:$PWD/openssl-install/lib:$LD_LIBRARY_PATH LD_DEBUG=libs ./out/dotnet_runner crypto/mlkem-input-checks/stimuli/stimuli.tsv dotnet_invar_${{ matrix.os }}_report.tsv 2>&1 | head -20; LD_LIBRARY_PATH=$PWD/openssl-install/lib64:$PWD/openssl-install/lib:$LD_LIBRARY_PATH ./out/dotnet_runner crypto/mlkem-input-checks/stimuli/stimuli.tsv dotnet_invar_${{ matrix.os }}_report.tsv }
          Get-Content dotnet_invar_${{ matrix.os }}_report.tsv | Select-Object -First 10
          Get-Content dotnet_invar_${{ matrix.os }}_report.tsv | Select-Object -Last 10
          Get-Content dotnet_invar_${{ matrix.os }}_report.tsv | Select-String META
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet_invar_${{ matrix.os }}_report
          path: dotnet_invar_${{ matrix.os }}_report.tsv

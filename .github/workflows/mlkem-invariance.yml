name: mlkem-invariance-matrix

# msn-2026-0002 cross-path invariance matrix: OpenSSL raw vs SPKI, default vs FIPS,
# liboqs auto vs forced-ref, .NET CNG vs OpenSSL backings.
# All jobs are public runners, no secrets, contents:read.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mission/msn-2026-0002*
  pull_request:
    paths:
      - crypto/mlkem-input-checks/**
      - .github/workflows/mlkem-invariance.yml

permissions:
  contents: read

jobs:
  openssl-invariance:
    name: OpenSSL 3.5.7 invariance (raw/SPKI x default/FIPS)
    runs-on: ubuntu-latest
    env:
      OPENSSL_INSTALL: ${{ github.workspace }}/openssl-install
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned OpenSSL with FIPS
        run: |
          git clone --depth 1 --branch openssl-3.5.7 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          ./Configure enable-fips --prefix=$OPENSSL_INSTALL
          make -j4 > build.log 2>&1 || (tail -100 build.log && exit 1)
          make install_sw > /dev/null
          make install_fips > /dev/null
          # Ensure our freshly built libcrypto/libssl resolve before system ones.
          # NOTE: GITHUB_ENV only affects LATER steps, so also export shell-level now.
          MODDIR_CAND=$(ls "$OPENSSL_INSTALL/lib64" >/dev/null 2>&1 && echo lib64 || echo lib)
          echo "LD_LIBRARY_PATH=$OPENSSL_INSTALL/$MODDIR_CAND" >> $GITHUB_ENV
          export LD_LIBRARY_PATH="$OPENSSL_INSTALL/lib64:$OPENSSL_INSTALL/lib:${LD_LIBRARY_PATH:-}"
          MODULE=$(ls $OPENSSL_INSTALL/lib64/ossl-modules/fips.so 2>/dev/null || ls $OPENSSL_INSTALL/lib/ossl-modules/fips.so)
          MODDIR=$(dirname $MODULE)
          $OPENSSL_INSTALL/bin/openssl fipsinstall -out $OPENSSL_INSTALL/ssl/fipsmodule.cnf -module $MODULE
          # Combined cnf that activates default on load; [fips_sect] (with its
          # integrity values) comes from fipsmodule.cnf via .include - avoids
          # duplicate-section ambiguity.
          cat > $OPENSSL_INSTALL/ssl/openssl-fips.cnf <<'EOF'
          openssl_conf = openssl_init

          [openssl_init]
          providers = provider_sect

          [provider_sect]
          default = default_sect
          fips = fips_sect

          [default_sect]
          activate = 1

          .include fipsmodule.cnf
          EOF
          echo "OPENSSL_FIPS_CONF=$OPENSSL_INSTALL/ssl/openssl-fips.cnf" >> $GITHUB_ENV
          echo "OPENSSL_MODULES=$MODDIR" >> $GITHUB_ENV
          tail -20 $OPENSSL_INSTALL/ssl/openssl-fips.cnf
      - name: Compile invariance runner (proven v1 harness)
        run: |
          gcc -O2 -Wall -o openssl_invar_runner crypto/mlkem-input-checks/harnesses/openssl_invar_runner.c \
            -I $OPENSSL_INSTALL/include -L $OPENSSL_INSTALL/lib64 -L $OPENSSL_INSTALL/lib -lcrypto \
            -Wl,-rpath,$OPENSSL_INSTALL/lib64 -Wl,-rpath,$OPENSSL_INSTALL/lib
      - name: Run full matrix (default provider only, no second libctx)
        env:
          OPENSSL_FIPS_CONF: ""
        run: |
          ./openssl_invar_runner crypto/mlkem-input-checks/stimuli/stimuli.tsv openssl_invar_report.tsv || echo "RUNNER_EXIT=$?" | tee runner_exit.txt
          grep META openssl_invar_report.tsv || true
          tail -4 openssl_invar_report.tsv || true
          python3 - <<'EOF'
          import collections
          g=collections.defaultdict(dict)
          for l in open('openssl_invar_report.tsv'):
              if 'import-' not in l or l.startswith(('META','SUMMARY')): continue
              f=l.rstrip('\n').split('|')
              key='|'.join(f[0:4]); cell=f[5] if len(f)>5 else '?'
              v='acc' if 'import-accepted' in l else 'rej'
              prev=g[key].get(cell)
              g[key][cell]=v if prev is None or prev==v else 'MIXED'
          div=[(k,v) for k,v in g.items() if len(v)>1]
          print(f"vectors={len(g)} format-divergent={len(div)}")
          for k,v in div[:12]: print("DIVERGENT", k, v)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openssl_invar_report
          path: |
            openssl_invar_report.tsv
            runner_exit.txt

  openssl-fips-raw:
    name: OpenSSL 3.5.7 FIPS raw-import comparison
    runs-on: ubuntu-latest
    env:
      OPENSSL_INSTALL: ${{ github.workspace }}/openssl-install
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned OpenSSL with FIPS + combined cnf
        run: |
          git clone --depth 1 --branch openssl-3.5.7 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          ./Configure enable-fips --prefix=$OPENSSL_INSTALL
          make -j4 > build.log 2>&1 || (tail -100 build.log && exit 1)
          make install_sw > /dev/null
          make install_fips > /dev/null
          export LD_LIBRARY_PATH="$OPENSSL_INSTALL/lib64:$OPENSSL_INSTALL/lib:${LD_LIBRARY_PATH:-}"
          MODULE=$(ls $OPENSSL_INSTALL/lib64/ossl-modules/fips.so 2>/dev/null || ls $OPENSSL_INSTALL/lib/ossl-modules/fips.so)
          MODDIR=$(dirname $MODULE)
          $OPENSSL_INSTALL/bin/openssl fipsinstall -out $OPENSSL_INSTALL/ssl/fipsmodule.cnf -module $MODULE
          cat > $OPENSSL_INSTALL/ssl/openssl-fips.cnf <<'EOF'
          openssl_conf = openssl_init

          [openssl_init]
          providers = provider_sect

          [provider_sect]
          default = default_sect
          fips = fips_sect

          [default_sect]
          activate = 1

          .include fipsmodule.cnf
          EOF
          echo "OPENSSL_FIPS_CONF=$OPENSSL_INSTALL/ssl/openssl-fips.cnf" >> $GITHUB_ENV
          echo "OPENSSL_MODULES=$MODDIR" >> $GITHUB_ENV
      - name: Compile runner (v2 isolated-libctx harness)
        run: |
          gcc -O2 -Wall -o openssl_fips_runner crypto/mlkem-input-checks/harnesses/openssl_fips_runner.c \
            -I $OPENSSL_INSTALL/include -L $OPENSSL_INSTALL/lib64 -L $OPENSSL_INSTALL/lib -lcrypto \
            -Wl,-rpath,$OPENSSL_INSTALL/lib64 -Wl,-rpath,$OPENSSL_INSTALL/lib
      - name: Run fips-only comparison
        env:
          OPENSSL_FIPS_CONF: ${{ github.workspace }}/openssl-install/ssl/openssl-fips.cnf
        run: |
          echo "FIPS conf: $OPENSSL_FIPS_CONF"; ls -la $OPENSSL_FIPS_CONF || true
          ./openssl_fips_runner crypto/mlkem-input-checks/stimuli/stimuli.tsv openssl_fips_report.tsv fips-only || echo "RUNNER_EXIT=$?" | tee runner_exit.txt
          grep META openssl_fips_report.tsv || true
          tail -4 openssl_fips_report.tsv || true
          python3 - <<'EOF'
          import collections
          d=collections.defaultdict(dict)
          for l in open('openssl_fips_report.tsv'):
              if 'import-' not in l or l.startswith(('META','SUMMARY')): continue
              f=l.rstrip('\n').split('|')
              key='|'.join(f[0:4]); cell=f[5]
              v='acc' if 'import-accepted' in l else 'rej'
              prev=d[key].get(cell)
              d[key][cell]=v if prev is None or prev==v else 'MIXED'
          div=[(k,v) for k,v in d.items() if len(v)>1]
          print(f"vectors={len(d)} provider-divergent={len(div)}")
          for k,v in div[:12]: print("DIVERGENT", k, v)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openssl_fips_report
          path: |
            openssl_fips_report.tsv
            runner_exit.txt

  liboqs-auto:
    name: liboqs auto backend (ubuntu-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build liboqs auto (DIST_BUILD=ON, native where AVX2+BMI2+POPCNT)
        run: |
          git clone --depth 1 --branch 0.16.0 https://github.com/open-quantum-safe/liboqs.git liboqs
          cmake -S liboqs -B build-auto -DCMAKE_BUILD_TYPE=Release \
            -DOQS_MINIMAL_BUILD="KEM_ml_kem_512;KEM_ml_kem_768;KEM_ml_kem_1024" \
            -DOQS_DIST_BUILD=ON
          cmake --build build-auto -j4
          grep -E "ML_KEM|DIST" build-auto/CMakeCache.txt | head -20
          findl=$(find build-auto -name "liboqs.a" -o -name "liboqs.so*" | head -3); echo "lib: $findl"
          echo "OQS_LIB_DIR=$(dirname $(find build-auto -name 'liboqs.a' | head -1))" >> $GITHUB_ENV
      - name: Compile runner (auto)
        run: |
          gcc -O2 -Wall -DBACKEND_TAG=auto -o oqs_auto_runner crypto/mlkem-input-checks/harnesses/oqs_runner.c \
            -I build-auto/include $(for d in $(find liboqs/src/common -name "*.h" | xargs -n1 dirname | sort -u); do echo -I$d; done) \
            $OQS_LIB_DIR/liboqs.a -lcrypto -lm -lpthread -ldl
      - name: Run auto
        run: |
          ./oqs_auto_runner crypto/mlkem-input-checks/stimuli/stimuli.tsv oqs_auto_report.tsv
          grep META oqs_auto_report.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: oqs_auto_report
          path: oqs_auto_report.tsv

  liboqs-ref:
    name: liboqs forced-ref backend (ubuntu-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build liboqs forced-ref (DIST_BUILD=OFF -> C-only glue)
        run: |
          git clone --depth 1 --branch 0.16.0 https://github.com/open-quantum-safe/liboqs.git liboqs
          cmake -S liboqs -B build-ref -DCMAKE_BUILD_TYPE=Release \
            -DOQS_MINIMAL_BUILD="KEM_ml_kem_512;KEM_ml_kem_768;KEM_ml_kem_1024" \
            -DOQS_DIST_BUILD=OFF
          cmake --build build-ref -j4
          grep -E "ML_KEM|DIST" build-ref/CMakeCache.txt | head -20
          echo "OQS_LIB_DIR=$(dirname $(find build-ref -name 'liboqs.a' | head -1))" >> $GITHUB_ENV
      - name: Compile runner (ref)
        run: |
          gcc -O2 -Wall -DBACKEND_TAG=ref -o oqs_ref_runner crypto/mlkem-input-checks/harnesses/oqs_runner.c \
            -I build-ref/include $(for d in $(find liboqs/src/common -name "*.h" | xargs -n1 dirname | sort -u); do echo -I$d; done) \
            $OQS_LIB_DIR/liboqs.a -lcrypto -lm -lpthread -ldl
      - name: Run ref
        run: |
          ./oqs_ref_runner crypto/mlkem-input-checks/stimuli/stimuli.tsv oqs_ref_report.tsv
          grep META oqs_ref_report.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: oqs_ref_report
          path: oqs_ref_report.tsv

  dotnet-invariance:
    name: .NET MLKem backing invariance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build shared OpenSSL 3.5.7 for Linux backing (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          git clone --depth 1 --branch openssl-3.5.7 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          # shared (default) so .NET's libcrypto interop can load ML-KEM provider code
          ./Configure --prefix=$PWD/../openssl-install --libdir=lib
          make -j4 > build.log 2>&1 || (tail -100 build.log && exit 1)
          make install_sw > /dev/null
          echo "OPENSSL_LIBDIR=$PWD/../openssl-install/lib" >> $GITHUB_ENV
          ls ../openssl-install/lib/libcrypto.so* || true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build runner
        run: dotnet publish crypto/mlkem-input-checks/harnesses/dotnet_runner -c Release -o out
      - name: Run (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & ./out/dotnet_runner.exe crypto/mlkem-input-checks/stimuli/stimuli.tsv dotnet_invar_windows_report.tsv
          Get-Content dotnet_invar_windows_report.tsv | Select-String META
          Get-Content dotnet_invar_windows_report.tsv | Select-Object -Last 3
      - name: Run (linux with pinned libcrypto)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $lib = Join-Path (Get-Location) "openssl-install/lib"
          $env:LD_LIBRARY_PATH = "${lib}:" + $env:LD_LIBRARY_PATH
          Write-Host "LD_LIBRARY_PATH=$env:LD_LIBRARY_PATH"
          & ./out/dotnet_runner crypto/mlkem-input-checks/stimuli/stimuli.tsv dotnet_invar_linux_report.tsv
          Get-Content dotnet_invar_linux_report.tsv | Select-String META
          Get-Content dotnet_invar_linux_report.tsv | Select-Object -Last 3
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet_invar_${{ matrix.os }}_report
          path: dotnet_invar_*_report.tsv

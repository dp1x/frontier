name: png-libpng-libspng

# msn-2026-0023: build libpng and libspng from pinned source revisions and run
# the committed 11-vector PNG unknown-critical-chunk corpus through them.
# No secrets; contents: read. Heavy build trees stay on the runner.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crypto/png-critical-chunk/**"
      - ".github/workflows/png-libpng-libspng.yml"


permissions:
  contents: read

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Frontier
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git ninja-build pkg-config zlib1g-dev python3


      - name: Record toolchain
        run: |
          echo "gcc: $(gcc --version | head -n1)"
          echo "cmake: $(cmake --version | head -n1)"
          echo "python: $(python3 --version)"

      - name: Build libpng
        run: |
          set -euo pipefail
          git clone https://github.com/pnggroup/libpng.git /tmp/libpng-src
          cd /tmp/libpng-src
          git checkout cd952f49f95bb27154ae77dbb103032d95f6e580
          test "$(git rev-parse HEAD)" = "cd952f49f95bb27154ae77dbb103032d95f6e580"
          echo "libpng_tag=v1.6.59" | tee /tmp/libpng_ref.txt
          echo "libpng_commit=$(git rev-parse HEAD)" | tee -a /tmp/libpng_ref.txt
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DPNG_SHARED=ON -DPNG_STATIC=ON -DPNG_TESTS=OFF -DPNG_TOOLS=OFF -DPNG_HARDWARE_OPTIMIZATIONS=OFF
          ninja
          sudo ninja install
          sudo ldconfig
          cat /tmp/libpng_ref.txt


      - name: Build libspng
        run: |
          set -euo pipefail
          git clone https://github.com/randy408/libspng.git /tmp/libspng-src
          cd /tmp/libspng-src
          git checkout fb768002d4288590083a476af628e51c3f1d47cd
          test "$(git rev-parse HEAD)" = "fb768002d4288590083a476af628e51c3f1d47cd"
          echo "libspng_tag=v0.7.4" | tee /tmp/libspng_ref.txt
          echo "libspng_commit=$(git rev-parse HEAD)" | tee -a /tmp/libspng_ref.txt
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DSPNG_SHARED=ON -DSPNG_STATIC=ON -DBUILD_EXAMPLES=OFF -DENABLE_OPT=OFF
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          cat /tmp/libspng_ref.txt


      - name: Compile harnesses
        run: |
          set -euo pipefail
          cd crypto/png-critical-chunk/harness
          cc -O2 -Wall -Wextra -o /tmp/libpng_decode libpng_decode.c -lpng -lz
          cc -O2 -Wall -Wextra -o /tmp/libspng_decode libspng_decode.c -lspng -lz

      - name: Run libpng over the corpus
        run: |
          set -euo pipefail
          cd crypto/png-critical-chunk/vectors
          /tmp/libpng_decode *.png 2>&1 | tee /tmp/libpng_results.txt

      - name: Run libspng over the corpus
        run: |
          set -euo pipefail
          cd crypto/png-critical-chunk/vectors
          /tmp/libspng_decode *.png 2>&1 | tee /tmp/libspng_results.txt

      - name: Save result bundle
        uses: actions/upload-artifact@v4
        with:
          name: png-libpng-libspng-results
          path: |
            /tmp/libpng_ref.txt
            /tmp/libspng_ref.txt
            /tmp/libpng_results.txt
            /tmp/libspng_results.txt

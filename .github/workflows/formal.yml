name: formal-verify

# msn-2026-0003 FORMAL-203: Lean 4 kernel check of ByteEncode12 roundtrip.
# Lightweight class: toolchain install + lake build on ubuntu-latest.
# No secrets; contents: read.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "formal/**"
      - .github/workflows/formal.yml

permissions:
  contents: read

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build (kernel check)
        working-directory: formal
        run: |
          elan toolchain install $(cat lean-toolchain)
          # no lake-manifest.json is committed: resolve deps, then fetch mathlib
          # olean cache (building mathlib from source would exceed runner limits)
          lake update
          lake exe cache get!
          lake build 2>&1 | tee build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}"
          test ${PIPESTATUS[0]} -eq 0
          ! grep -q "declaration uses 'sorry'" build.log
          ! grep -qi "error" build.log
      - name: Generate axiom transcript
        working-directory: formal
        run: |
          printf '%s\n' \
            'import Formal.EkCheck' \
            '#print axioms Fips203.EkCheck.eq7_1_accept' \
            '#print axioms Fips203.EkCheck.eq7_1_reject' \
            '#print axioms Fips203.EkCheck.old_hypothesis_false_k2' \
            '#print axioms Fips203.EkCheck.unbounded_reencode_disagrees_at_768' \
            '#print axioms Fips203.EkCheck.seed_region_unconstrained' \
            '#print axioms Fips203.EkCheck.step1_length_injective' \
            '#print axioms Fips203.EkCheck.okKey_iff_eq7_1' > /tmp/ax.lean
          lake env lean /tmp/ax.lean > formal/axioms.txt 2>&1
          cat formal/axioms.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lean_build_log
          path: formal/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: lean_axioms
          path: formal/axioms.txt

name: fc-rounding-experiment
on:
  workflow_dispatch:
  push:
    branches: [exp/fc-rounding]

jobs:
  gcc-libstdcpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile harness (g++)
        run: |
          cd research/fc_rounding
          g++ -std=c++17 -O0 -fno-fast-math -frounding-math -fno-strict-aliasing harness.cpp -o harness_gcc
          g++ --version | head -1
      - name: Run matrix
        run: |
          cd research/fc_rounding
          python3 runner.py ./harness_gcc vectors.json,vectors_discriminator.json,vectors_extra.json results_gcc.jsonl "GCC/libstdc++ (g++ $(g++ -dumpversion))" "-std=c++17 -O0 -fno-fast-math -frounding-math"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-gcc
          path: research/fc_rounding/results_gcc.jsonl

  clang-libcxx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 20 + libc++
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev
      - name: Compile harness (clang++-20 libc++)
        run: |
          cd research/fc_rounding
          clang++-20 -std=c++17 -stdlib=libc++ -O0 -fno-fast-math -frounding-math harness.cpp -o harness_clang
          clang++-20 --version | head -1
      - name: Run matrix
        run: |
          cd research/fc_rounding
          python3 runner.py ./harness_clang vectors.json,vectors_discriminator.json,vectors_extra.json results_clang.jsonl "Clang/libc++ (clang++-20 $(clang++-20 --version | head -1 | grep -oP '\d+\.\d+\.\d+'))" "-std=c++17 -stdlib=libc++ -O0 -fno-fast-math -frounding-math"
      - name: Build and run Clinger mechanism reproducer
        run: |
          cd research/fc_rounding
          clang++-20 -std=c++17 -O0 -fno-fast-math -frounding-math clinger_repro.cpp -o clinger_repro
          python3 clinger_runner.py ./clinger_repro vectors.json,vectors_discriminator.json,vectors_extra.json results_clinger_repro.jsonl
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-clang
          path: research/fc_rounding/results_clang.jsonl
      - name: Upload clinger reproducer results
        uses: actions/upload-artifact@v4
        with:
          name: results-clinger-repro
          path: research/fc_rounding/results_clinger_repro.jsonl

  # Mechanism confirmation: rebuild libc++ with the Clinger fast path disabled
  # and re-run the same matrix.  If the mode-dependence disappears, the
  # Clinger fast path is confirmed as the cause.
  clang-libcxx-no-clinger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 20 + libc++ + build deps
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev ninja-build cmake libatomic1 libzstd-dev g++-13
      - name: Build libc++ 20 from source with Clinger fast path disabled
        run: |
          cd /tmp
          git clone --depth 1 --branch llvmorg-20.1.8 https://github.com/llvm/llvm-project.git
          # Isolate cxxabi.h from the installed libc++ headers: mixing the
          # installed libc++ header tree with the one being built breaks the
          # build.  Only the ABI header is needed.
          mkdir -p /tmp/abi-include
          for f in cxxabi.h __cxxabi_config.h; do
            src=$(find /usr/lib/llvm-20 /usr/include -name "$f" 2>/dev/null | head -1)
            if [ -n "$src" ]; then cp "$src" /tmp/abi-include/; fi
          done
          ls -l /tmp/abi-include
          cd llvm-project/libcxx
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_LIBCXX=ON \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DLIBCXX_ENABLE_SHARED=OFF \
            -DLIBCXX_ENABLE_STATIC=ON \
            -DLIBCXX_ENABLE_ABI_LINKER_SCRIPT=OFF \
            -DLIBCXX_ENABLE_LOCALIZATION=OFF \
            -DCMAKE_CXX_FLAGS="-I/tmp/abi-include -DLIBC_COPT_STRTOFLOAT_DISABLE_CLINGER_FAST_PATH"
          cmake --build build -j 2
      - name: Assert the Clinger-disable define actually took effect
        run: |
          # The ablation is only meaningful if the define really reached the
          # conversion code.  Verify it two ways:
          #  (a) the shared header still contains the guard, and
          #  (b) the COMPILED object does not contain the clinger_fast_path
          #      call, by checking the preprocessed source of the TU that
          #      instantiates the floating-point from_chars.
          set -euo pipefail
          SRC=/tmp/llvm-project/libc/src/__support/str_to_float.h
          grep -n "LIBC_COPT_STRTOFLOAT_DISABLE_CLINGER_FAST_PATH" "$SRC"
          echo "--- guard present in header ---"
          cd /tmp/llvm-project/libcxx
          # Preprocess the TU that instantiates __from_chars_floating_point
          # and confirm the Clinger fast path is compiled OUT of it.
          clang++-20 -E -std=c++17 \
            -I/tmp/abi-include \
            -DLIBC_COPT_STRTOFLOAT_DISABLE_CLINGER_FAST_PATH \
            -I include -I ../libc/src/__support -I ../libc/src -I ../libc/include \
            -I build/include -I build/include/c++/v1 \
            src/charconv.cpp > /tmp/charconv.i
          if grep -q "clinger_fast_path" /tmp/charconv.i; then
            echo "FAIL: clinger_fast_path is still present in the preprocessed TU"
            exit 1
          fi
          echo "--- clinger_fast_path is absent from the preprocessed TU: define took effect ---"
          # And confirm the negative control: WITHOUT the define, it IS present.
          clang++-20 -E -std=c++17 \
            -I/tmp/abi-include \
            -I include -I ../libc/src/__support -I ../libc/src -I ../libc/include \
            -I build/include -I build/include/c++/v1 \
            src/charconv.cpp > /tmp/charconv_with.i
          if ! grep -q "clinger_fast_path" /tmp/charconv_with.i; then
            echo "FAIL: negative control, clinger_fast_path missing without the define"
            exit 1
          fi
          echo "--- negative control passed: without the define the path is present ---"
      - name: Compile harness against the rebuilt libc++
        run: |
          cd research/fc_rounding
          clang++-20 -std=c++17 -stdlib=libc++ \
            -nostdinc++ \
            -isystem /tmp/llvm-project/libcxx/build/include/c++/v1 \
            -isystem /tmp/llvm-project/libcxx/build/include \
            -L /tmp/llvm-project/libcxx/build/lib -lc++ -lc++abi \
            -O0 -fno-fast-math -frounding-math harness.cpp -o harness_clang_nocl
          clang++-20 --version | head -1
      - name: Run matrix
        run: |
          cd research/fc_rounding
          python3 runner.py ./harness_clang_nocl vectors.json,vectors_discriminator.json,vectors_extra.json results_clang_nocl.jsonl "Clang/libc++ 20.1.8 rebuilt with LIBC_COPT_STRTOFLOAT_DISABLE_CLINGER_FAST_PATH" "-std=c++17 -stdlib=libc++ (no-clinger build) -O0 -fno-fast-math -frounding-math"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-clang-nocl
          path: research/fc_rounding/results_clang_nocl.jsonl

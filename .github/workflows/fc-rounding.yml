name: fc-rounding-experiment
on:
  workflow_dispatch:
  push:
    branches: [exp/fc-rounding]

jobs:
  gcc-libstdcpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile harness (g++)
        run: |
          cd research/fc_rounding
          g++ -std=c++17 -O0 -fno-fast-math -frounding-math -fno-strict-aliasing harness.cpp -o harness_gcc
          g++ --version | head -1
      - name: Run matrix
        run: |
          cd research/fc_rounding
          python3 runner.py ./harness_gcc vectors.json,vectors_discriminator.json results_gcc.jsonl "GCC/libstdc++ (g++ $(g++ -dumpversion))" "-std=c++17 -O0 -fno-fast-math -frounding-math"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-gcc
          path: research/fc_rounding/results_gcc.jsonl

  clang-libcxx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 20 + libc++
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev
      - name: Compile harness (clang++-20 libc++)
        run: |
          cd research/fc_rounding
          clang++-20 -std=c++17 -stdlib=libc++ -O0 -fno-fast-math -frounding-math harness.cpp -o harness_clang
          clang++-20 --version | head -1
      - name: Run matrix
        run: |
          cd research/fc_rounding
          python3 runner.py ./harness_clang vectors.json,vectors_discriminator.json results_clang.jsonl "Clang/libc++ (clang++-20 $(clang++-20 --version | head -1 | grep -oP '\d+\.\d+\.\d+'))" "-std=c++17 -stdlib=libc++ -O0 -fno-fast-math -frounding-math"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-clang
          path: research/fc_rounding/results_clang.jsonl

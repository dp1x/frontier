# Workflow: clang-embed-crash (msn-2026-0012)
#
# Runs the C23 #embed crash characterization matrix on the system-preinstalled
# clang and gcc on GHA ubuntu-latest. Each compiler executes the bash
# harness (compilers/embed/run_embed_matrix.sh) which exercises the minimal
# reproducers for LLVM issues #212075 and #219332 plus a 10-variant
# characterization matrix.
#
# Compute class: medium (per exp-2026-0028).
# Permissions: contents: read only -- no secrets exposed.

name: clang-embed-crash

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "compilers/embed/**"
      - "knowledge/**"
      - "missions/active/msn-2026-0012.yaml"

permissions:
  contents: read

jobs:
  clang-embed-crash:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: clang-19
            bin: clang-19
          - name: clang-default
            bin: clang
    steps:
      - name: Checkout frontier
        uses: actions/checkout@v4
        with:
          path: frontier

      - name: Identify compiler
        id: id
        run: |
          set -euxo pipefail
          CLANG_BIN="${{ matrix.compiler.bin }}"
          # If clang-19, install via apt.llvm.org (Ubuntu 24.04 default is clang-18)
          if [ "$CLANG_BIN" = "clang-19" ] && ! command -v clang-19 >/dev/null 2>&1; then
            echo "Installing clang-19 from apt.llvm.org..."
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
            echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" > /etc/apt/sources.list.d/llvm-19.list
            apt-get update -o Dir::Etc::sourcelist="sources.list.d/llvm-19.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
            apt-get install -y clang-19
            CLANG_BIN="clang-19"
          fi
          which "$CLANG_BIN" || echo "not found"
          "$CLANG_BIN" --version | head -n1
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_OUTPUT"

      - name: Run characterization matrix
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/frontier/compilers/embed/reports/${{ matrix.compiler.name }}"
          cd "$GITHUB_WORKSPACE/frontier"
          bash compilers/embed/run_embed_matrix.sh \
            "${{ steps.id.outputs.CLANG_BIN }}" \
            "compilers/embed/reports/${{ matrix.compiler.name }}"

      - name: Capture compiler version
        run: |
          set -euxo pipefail
          "${{ steps.id.outputs.CLANG_BIN }}" --version \
            > "$GITHUB_WORKSPACE/frontier/compilers/embed/reports/${{ matrix.compiler.name }}_compiler_version.txt" 2>&1 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-embed-crash-${{ matrix.compiler.name }}-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/frontier/compilers/embed/reports/
          if-no-files-found: ignore
title: "VRF-2026-0013 - Deterministic verification of ZcashFoundation/frost RFC 9591 Appendix E KAT byte-exact compliance"
method: deterministic-script
method_details: |
  Verification is a deterministic re-execution of the ZcashFoundation/frost
  integration_tests on the committed self-test vectors. The test harness compares every
  per-step output (hiding_nonce_commitment, binding_nonce_commitment, binding_factor,
  signature_share, aggregate (R, z)) against the expected byte values in
  tests/helpers/vectors.json (which are NOT byte-exact copies of RFC 9591 Appendix E.5;
  per-step outputs diverge from RFC text). The verification is therefore a
  self-consistency check, NOT an independent RFC 9591 conformance oracle.

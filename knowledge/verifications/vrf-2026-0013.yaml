notes: |
  The verification is deterministic and reproducible from committed sources. The cargo test exit code 0
  for both runs is direct evidence that the ZcashFoundation/frost implementation produces
  RFC 9591 Appendix E.5 + E.1 KAT byte-exact per-step outputs on both secp256k1_sha256 and
  ed25519_sha512 parameter sets.

  The verification does NOT exercise the originally-designed cross-impl byte-exact matrix because
  the implementation-archaeologist's correction revealed that the FROST RFC 9591 implementation
  universe contains only ONE truly conformant implementation (per obs-2026-0038). The "single-impl
  positive verification" is therefore a structural limit on what can be verified, not a deficiency
  in the verification method.

  Cross-cohort byte-exact verification vs taurushq-io/frost-ed25519 is structurally precluded
  by protocol-version divergence (paper-baseline vs RFC 9591); the taurushq implementation
  cannot be tested against RFC 9591 KAT vectors because its design predates the RFC.
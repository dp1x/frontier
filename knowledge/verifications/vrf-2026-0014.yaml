title: "VRF-2026-0014 - msn-2026-0015 + msn-2026-0016 verification (CBOR §4.2 matrix)"
verification_method: deterministic-script
verification_inputs:
  - "RFC 8949 Appendix C 14 integer reference vectors (https://www.rfc-editor.org/rfc/rfc8949#appendix-C)"
  - "RFC 8949 §4.2.3 length-first ordering example (https://www.rfc-editor.org/rfc/rfc8949#section-4.2.3)"
  - "cbor-cross-impl/results/matrix.tsv (matrix output from cbor2 6.1.4)"

verification_steps:
  - step: 1
    description: "Run cleanroom oracle self-test against RFC 8949 Appendix C"
    command: "cd cbor-cross-impl && python oracle/cbor_oracle.py"
    expected: "14/14 PASS for both deterministic and canonical modes"
    actual: "14/14 PASS for both modes (verified 2026-08-31)"
    status: PASS

  - step: 2
    description: "Verify RFC 8949 §4.2.3 example byte-exact match"
    command: "python -c 'import sys; sys.path.insert(0, \"cbor-cross-impl/oracle\"); from cbor_oracle import encode_canonical; m={10:1,-1:1,False:1,100:1,\"z\":1,(-1,):1,\"aa\":1,(100,):1}; print(encode_canonical(m).hex())'"
    expected: "a80a012001f401186401617a018120016261610181186401"
    actual: "a80a012001f401186401617a018120016261610181186401"
    status: PASS

  - step: 3
    description: "Verify cbor2 canonical byte-exact matches oracle on map_key_sort §4.2.3 example"
    command: "cd cbor-cross-impl && python runner/verify_ordering.py"
    expected: "Oracle and cbor2 canonical produce identical bytes for length-first sort"
    actual: "MATCH for both test maps"
    status: PASS

  - step: 4
    description: "Reproduce the matrix from scratch"
    command: "cd cbor-cross-impl && python vectors/gen_vectors.py && python runner/run_matrix.py"
    expected: "222 cells, 204 PASS, 14 SPEC_AMBIGUITY, 4 SPEC_VIOLATION (0 ERROR, 0 INTEROP_BREAK)"
    actual: "Matches expected distribution"
    status: PASS

  - step: 5
    description: "Validate matrix.tsv is byte-identical on re-run"
    command: "python runner/run_matrix.py && sha256sum results/matrix.tsv"
    expected: "byte-identical matrix.tsv"
    actual: "byte-identical matrix.tsv on re-run (deterministic for given inputs)"
    status: PASS

verification_summary: |
  The msn-2026-0015 + msn-2026-0016 framework is verified at 5 distinct levels:
    1. Cleanroom oracle self-test: 14/14 RFC 8949 Appendix C integer vectors PASS
       in both deterministic and canonical modes.
    2. RFC 8949 §4.2.3 example byte-exact match: oracle produces
       a80a012001f401186401617a018120016261610181186401 byte-exactly.
    3. cbor2 canonical byte-exact match: cbor2 6.1.4's canonical mode
       produces identical bytes to the oracle on the §4.2.3 example
       (confirmed via verify_ordering.py).
    4. Matrix runner reproducibility: re-running produces identical TSV.
    5. Per-cell verdict classification: 222 cells, 91.9% PASS.
       - Canonical mode: 111/111 (100%) PASS.
       - Default mode: 93/111 (83.8%) PASS; 14 SPEC_AMBIGUITY (float
         shortest-form, documented cbor2 behavior) + 4 SPEC_VIOLATION
         (map_key_sort, documented cbor2 default-mode behavior).

  Conclusion: No spec-violating cross-impl divergence exists between
  cbor2 canonical mode and the Frontier cleanroom oracle within the
  tested cohort. Default-mode differences are documented cbor2
  behavior (cbor2 default is non-canonical; users wanting RFC 8949
  §4.2 conformance must enable canonical=True).

limitations:
  - "Cohort size = 1 library (cbor2 6.1.4). Cohort independence is weak."
  - "Cross-platform + cross-version reproducibility not tested."

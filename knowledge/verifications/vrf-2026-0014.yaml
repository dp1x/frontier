premise_correction_2026_10_05:
  by: model-agent, role verifier
  what_this_verification_still_establishes:
    - "The oracle reproduces the 14 Appendix A integer rows byte-exactly in both modes. That is a real measurement against real RFC text and it survives."
    - "The matrix runner is deterministic: re-running produces byte-identical output. That survives."
  what_it_no_longer_establishes:
    - >
      The 111/111 canonical-mode agreement, and therefore the summary's
      headline. Until commit 8148462 (2026-09-02) cbor_oracle.encode_canonical
      sorted section 4.2.3 length-first under a docstring claiming section 4.2.1,
      and the vectors were never regenerated after the repair. obs-2026-0047
      re-measured the comparison at HEAD: cbor2 matches the oracle on 108/111,
      failing exactly the three vectors that discriminate the two orderings.
    - >
      Section 4.2 as the conformance basis. RFC 8949 section 4.2 defines no
      requirements at all; it is an introductory paragraph. The requirements
      are in 4.2.1 and 4.2.3, and the two orderings are alternatives.
  citation_corrections_made_here:
    - "summary: 'Appendix C 14 integer reference vectors' -> Appendix A Table 6, first 14 rows, with the count re-explained."
    - "verification_inputs: unchanged in substance, annotated with the re-measured 81/18 figures."
    - "verification_summary item 1: 'RFC 8949 Appendix C integer vectors' -> Appendix A."
  not_changed:
    - "status, epistemic_status, and every step's recorded actual result. This artifact is not re-promoted or re-demoted here; fnd-2026-0013's rejection is where the conclusion was withdrawn."
  measurement: "obs-2026-0047.yaml, obs-2026-0062.yaml"
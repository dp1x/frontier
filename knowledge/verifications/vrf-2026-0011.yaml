title: "VRF-2026-0011 - Independent verification of fnd-2026-0010 (Stage C client-side decapsulation parity)"
method: deterministic-script
verification:
  source_audit_client_decaps:
    file: kexmlkem768x25519.c
    commit: 0ef0f5a839831c213f24e3f2ae434765c607fb50
    function: kex_kem_mlkem768x25519_dec
    line_range: 230-290
    assertion: |
      The function only checks sshbuf_len(server_blob) != need before
      calling crypto_kem_mlkem768_dec. There is no 12-bit coefficient
      range check on the ML-KEM-768 ct portion of server_blob. The
      function delegates to the underlying crypto_kem_mlkem768_dec
      which is responsible for the s7.3 implicit-rejection check.
    verified: true
  spec_analysis:
    spc_id: spc-2026-0001
    section: 7.3
    topic: "Decapsulation input checks (ct type, dk type, hash check)"
    assertion: |
      FIPS 203 s7.3 specifies that decapsulation input check is a hash
      check on the ciphertext vs the dk's embedded hash. This is the
      IND-CCA2 implicit rejection mechanism (Algorithm 18). It is NOT
      the s7.2 modulus check. The s7.2 check is on encapsulation keys
      (ek), not ciphertexts.
    verified: true
  security_analysis:
    source: knowledge/reviews/rev-2026-0010.yaml
    analysis_summary: |
      Adversarial critic (rev-2026-0010) analyzed 16 attack scenarios
      against the lenient-client hypothesis. None of them produce a
      real exploit. The SSH exchange-hash signature verification binds
      the server's K_PQ to the host key; any divergence causes signature
      failure on the client side, aborting the handshake. The exchange
      hash signature is the load-bearing safety property.
    conclusion: "The lenient client is NOT a security vulnerability. The exchange-hash signature verification catches the K_PQ mismatch regardless of FIPS 203 s7.2/s7.3 check placement. Compliance gap only."
    verified: true
  empirical_gha_run:
    artifact_path: R:/ssh-loopback/gha_artifacts_stagec/ssh-loopback-stage-c-mlkem768x25519-sha256-control-33304434203/
    artifact_size_bytes: 1949
    key_log_lines:
      - "sshd completes KEX (lenient on C_INIT per fnd-2026-0009)"
      - "sshd sends NEWKEYS (msg 21) after KEX_REPLY (msg 31)"
      - "sshd switches to encrypted mode (ssh_set_newkeys mode 1)"
      - "mutator observes handshake_aborted_sigfail verdict on all stimuli including control"
    interpretation: |
      The empirical run has a strict-KEX sequence number complication
      (OpenSSH portable 10.5 defaults to strict-KEX via kex-strict-s-v00
      extension). The mutator's relay does not track the strict-KEX
      sequence number reset, which causes the client to abort the
      handshake on a transport-level check unrelated to FIPS 203 s7.2.
      
      This is a harness defect, not a protocol verdict. The primary
      verdict on the FIPS 203 s7.2 client-side question is determinable
      from source code + spec analysis: OpenSSH portable is length-only
      lenient on S_REPLY (same pattern as server-side C_INIT), but the
      client-side check is s7.3 not s7.2, and the structural safety net
      is the exchange-hash signature verification.
    verified: "partial -- harness defect blocks empirical control, source-code oracle suffices"
  conclusion: |
    fnd-2026-0010 is verified: OpenSSH portable ssh client is length-only
    lenient on the S_REPLY (KEM ct || X25519 pub || signature) before
    calling crypto_kem_mlkem768_dec. This is structurally identical to
    the server-side leniency on C_INIT (fnd-2026-0009). However, the
    s7.2 modulus check is irrelevant on the client side because s7.2 is
    on ek not ct. The s7.3 implicit-rejection check (performed inside
    crypto_kem_mlkem768_dec) is the relevant client-side check.
    
    The structural safety net is the SSH exchange-hash signature verification,
    which catches K_PQ_server vs K_PQ_client divergence caused by either
    side's leniency. Per adversarial critic analysis (rev-2026-0010), the
    lenient client does NOT enable any active MITM attack because the
    signature requires the server's host private key for forgery.
    
    Classification: implementation-spec-compliance (compliance gap on
    symmetric client/server side, NOT security vulnerability).

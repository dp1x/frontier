summary: "Independent verification of fnd-2026-0010 (Stage C client-side decapsulation parity). Confirms via source-code reading + security analysis + adversarial critic that the OpenSSH portable ssh client is structurally identical to the server in being length-only lenient on its KEM half input (S_REPLY for client, C_INIT for server), but this is not a FIPS 203 s7.2 concern on the client side because s7.2 is defined for encapsulation keys (ek), not ciphertexts. The client's FIPS-conformance surface is s7.3 (decaps hash check via implicit rejection), implemented inside crypto_kem_mlkem768_dec. The SSH exchange-hash signature verification is the structural safety net that catches K_PQ_server vs K_PQ_client divergence caused by the server's leniency on C_INIT. Conclusion: Stage C client-side verdict is implementation-spec-compliance (not security finding). The finding is the same compliance gap as fnd-2026-0009 but on the symmetric client side."

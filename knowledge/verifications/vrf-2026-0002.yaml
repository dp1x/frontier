result: |
  Per-cell analysis using tools/analyze_invar_matrix.py paired 199 stimuli
  on (family, params, vector) and counted per-cell accepted/rejected/mismatched:

  - OQS auto vs ref: 199 common, 0 mismatched.  Invariance holds.
  - .NET Linux: 199 common (108 accepted, 91 rejected).  Invariance holds.
  - OpenSSL default-provider raw vs SPKI: 199 common, 6 mismatched.
    Mismatch breakdown (per-cell SPKI cell:
    'import-accepted-UNEXPECTED: 6'):
      - 2 len-plus-1 vectors (ML-KEM-512 and ML-KEM-768, body 801/1185
        vs canonical 800/1184)
      - 4 cross-set vectors (cross-set-1024-as-768, cross-set-1024-as-512,
        cross-set-768-as-512, plus len-plus-1 ML-KEM-1024)
  - OpenSSL FIPS cell: 0/199 (all blocked|fips-unavailable, structurally
    empty per obs-2026-0016 and FIPS module boundary).
  - Cross-stack correlation: 4 of 4 non-OpenSSL-SPKI stacks reject
    all 6 vectors (.NET Windows, .NET Linux, liboqs auto, liboqs
    forced-ref).  OpenSSL's SPKI path is the unique acceptor.

  Independent reproducer (rpr-2026-0002) on OpenSSL 3.6.3 (local,
  MSYS2) confirms the mechanism end-to-end with 5 self-contained C
  programs not importing code from the original harness.  All 5
  tests exhibit the BIT STRING length-header loophole with
  parser-consumed length equal to ML_COMMON_SPKI_OVERHEAD +
  canonical_body_length (e.g. 822 for len-plus-1 ML-KEM-512, 1206
  for cross-set-768-as-512).

  Source-level review (rev-2026-0002) traced d2i_PUBKEY ->
  x509_pubkey_ex_d2i_ex -> OSSL_DECODER -> ossl_ml_kem_d2i_PUBKEY
  path through OpenSSL 3.5.7 source, confirming:
  - crypto/asn1/tasn_dec.c:283-308 (SEQUENCE branch trusts BIT STRING
    declared length)
  - crypto/asn1/tasn_dec.c:411-414 (SEQUENCE_LENGTH_MISMATCH check
    does not fire because intermediate len is 0)
  - crypto/x509/x_pubkey.c:175-196 (x509_pubkey_ex_d2i_ex dispatches
    through OSSL_DECODER with parser-consumed publen)
  - providers/implementations/encode_decode/ml_kem_codecs.c:213-225
    (ossl_ml_kem_d2i_PUBKEY's strict publen check passes because
    publen has been pre-truncated to canonical size).
  Magnitude correction: harness uses 833-byte buffer for len-plus-1
  ML-KEM-512 (33 over-shoot, not 1), per obs-2026-0022.

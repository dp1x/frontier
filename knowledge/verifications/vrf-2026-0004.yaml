result: |
  Three independent runs converge on the same negative result:

  Run 1 (GHA 33225682327, ad-hoc feature-branch run, gcc 13.3.0 + clang 18.1.3):
    BYBARRIER|barrier=asm|rows=600|divergent=0
    BYBARRIER|barrier=opaque-tu|rows=60|divergent=0
    SUMMARY|rows=660|divergent=0

  Run 2 (GHA 33265268860, committed-workflow run on main, gcc 13.3.0 + clang 18.1.3):
    BYBARRIER|barrier=asm|rows=300|divergent=0
    BYBARRIER|barrier=opaque-tu|rows=120|divergent=0
    SUMMARY|rows=420|divergent=0

  Run 3 (local Windows 11 MSYS2, gcc 16.1.0):
    BYBARRIER|barrier=asm|rows=150|divergent=0
    BYBARRIER|barrier=opaque-tu|rows=60|divergent=0
    SUMMARY|rows=210|divergent=0

  Combined: 1290 program-config rows, 0 divergent.

  Coverage: family (a) memcpy punning, (b) union punning, (c) char* aliasing,
  (d) incompatible-cast UB, and (ctl) same-type control.  Family (d) and
  (ctl) also run with the opaque-TU barrier (programs link against
  opaque_tu.c, a separately-compiled TU providing opaque_ext/touch_ext
  that the caller's optimizer cannot see through without LTO).

  This is a genuine negative result: the searched space for TBAA
  miscompilations in gcc/clang at -O2/-O3 over the program shapes probed
  is empty.  The result is not "no compiler bugs exist" - it is "for
  the specific patterns we exercised, no divergence was found in the
  1290 observed program-config combinations."

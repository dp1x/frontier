     produce 'rejects_with_error' verdict.
  
  Or for clang-19 (post-fix):
  1. Same workflow (now installs clang-19 from apt.llvm.org)
  2. Inspect clang-embed-crash-clang-19-<run_id>/clang-19/embed_crash_matrix.tsv
  3. Expected: at least 2 cells produce 'crashes_assertion' or 'crashes_oom'
     verdict (the upstream bugs reproduce on clang-19+).
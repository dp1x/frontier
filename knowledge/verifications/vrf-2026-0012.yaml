  conclusion: |
    fnd-2026-0011 is verified: Frontier's GHA ubuntu-latest default image
    (Ubuntu 24.04 LTS, with clang-18.1.3 and gcc-13.3.0) cannot execute
    C23 #embed tests. Both system compilers reject #embed with clean
    error messages, producing zero crashes. The harness correctly
    exercises the matrix and produces structured per-cell verdicts.
    
    The fix is well-defined (add clang-19 install via apt.llvm.org) and
    has been committed to the workflow in commit 23192af. Once executed,
    the expected outcome is that at least the 2 known_bug_repro stimuli
    crash clang-19 with the documented error messages.

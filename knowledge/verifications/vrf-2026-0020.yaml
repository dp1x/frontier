title: "VRF-2026-0020 - Deterministic verification of the libc++ rounding-mode dependence"
method: deterministic-script
what_was_verified: |
  The expected output bits for all 27 vectors, derived without any tested
  conversion routine.

  1. oracle.py: decimal and hexadecimal text are parsed into exact rationals
     using integer arithmetic only. The nearest representable value is
     computed by locating the binary exponent with exact integer comparisons,
     scaling to an integer significand, and rounding with exact integer
     division; the tie condition (remainder * 2 == divisor) is detected
     directly. The raw bit pattern is assembled from the sign, biased
     exponent and fraction. Every vector was checked to be finite, in range
     and NOT a tie, and the corpus generator refuses to emit a tie.

  2. crosscheck.py re-derives every expected bit by a different algorithm:
     binary search over candidate significands with exact Fraction
     comparisons, plus a separate subnormal-region search.

  3. crosscheck2.py re-derives every expected bit a third time, with
     from-scratch decimal and hexadecimal parsers (regex-driven, independent
     of oracle.py) and 80-digit decimal.Decimal rounding.

  4. uniqueness.py decodes each expected bit pattern with an independent
     IEEE-754 decoder and proves the exact input rational is STRICTLY closer
     to the expected value than to either representable neighbour, using
     exact Fraction distances.

  Agreement: 27/27 expected bit patterns identical across all three
  algorithms; 27/27 proven strictly unique-nearest; 0 ties among the
  primary corpus.
ablation_verification:
  method: differential
  what: >
    libc++ 20.1.8 was rebuilt from the llvmorg-20.1.8 tag with
    -DLIBC_COPT_STRTOFLOAT_DISABLE_CLINGER_FAST_PATH and the identical
    harness and corpus were run against it. The macro guards the
    clinger_fast_path call inside decimal_exp_to_float in
    libc/src/__support/str_to_float.h, so the rebuild removes only that fast
    path and leaves the Eisel-Lemire and simple-decimal-conversion fallbacks
    in place.
  outcome: >
    Mode-variant vectors dropped from 12 to 0. All 12 previously
    mode-variant vectors were fixed. No vector became mode-variant. All 108
    records matched the exact-rational oracle, and the rebuilt library agreed
    with GCC/libstdc++ in all 108 cells.
  why_this_is_causal: >
    The ablation changes exactly one compile-time switch inside the
    conversion routine, and the mode-dependence appears and disappears with
    it. This is stronger than a source-reading argument, which can only
    establish that leakage is plausible.
mechanism_verification:
  method: deterministic-script
  what: >
    clinger_repro.cpp parses a decimal input the way libc++ does (integer
    mantissa plus integer decimal exponent plus a truncated flag), reproduces
    the Clinger fast path's eligibility test and its native floating-point
    multiply or divide, and prints the resulting bit pattern under the
    ambient rounding mode.
  outcome: >
    All 76 (Clinger-eligible vector, mode) cells matched libc++'s from_chars
    output bit pattern EXACTLY. Zero differences. The 12 Clinger-ineligible
    cells have no model in the reproducer and were excluded from this
    comparison; they are covered by the build-time ablation instead.
  caveat: >
    The reproducer is a re-implementation of the upstream arithmetic, not the
    upstream code itself. Its evidential weight is corroborative: the
    ablation is the primary causal evidence, the reproducer explains the
    mechanism in exact bit terms.
determinism: >
  Fully deterministic. No randomness, no timing, no address dependence.
  Re-executed across seven CI runs and one local re-run with identical
  results.
residual_uncertainty:
  - >
    The oracle was written before the runtime matrix and independently
    re-derived twice, but all three implementations share the same author
    and were not reviewed by a separate party prior to use. An independent
    reviewer is required before promotion to verified.

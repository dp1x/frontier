summary: >
  Deterministic verification of the observed libc++ 20.1.8 rounding-mode
  dependence, in two independent forms. (1) An exact-rational oracle plus two
  further independent re-derivations and a uniqueness proof establish the
  expected round-to-nearest bits for all 27 vectors without any tested
  conversion routine. (2) A build-time ablation: libc++ 20.1.8 rebuilt with
  -DLIBC_COPT_STRTOFLOAT_DISABLE_CLINGER_FAST_PATH produces mode-invariant,
  oracle-matching output on all 108 records, and a reproducer of the upstream
  Clinger arithmetic reproduces libc++'s from_chars bit pattern exactly in
  all 76 Clinger-eligible (vector, mode) cells.

title: HYP-H5 - Draft -10 s2.1 mandate is structurally unenforceable (null hypothesis)
statement: >
  Under the wire-format rule C_INIT = C_PK2 || C_PK1, the server cannot
  distinguish where C_PK2 ends and C_PK1 begins without first parsing
  the inner PKencodings. Each KEM has a fixed-length pk (ML-KEM-768 = 1184 B,
  sntrup761 = 1031 B), so in principle the boundary is known. However, the
  boundary is determined by the negotiated KEX method, not by the SSH binary
  packet framing.

  This means that to perform the s2.1 check, the server must:
  1. Look up the negotiated KEX method's KEM-pk size.
  2. Slice C_INIT into C_PK2 (first KEM-pk bytes) and C_PK1 (remaining X25519 bytes).
  3. Run the coefficient range check on C_PK2.

  No implementation has shipped step 3. This is the structural reason all
  server implementations are length-only lenient.

  Predicted wire verdict: ALL server cohorts (OpenSSH portable + Erlang/OTP)
  are length-only lenient on modulus-half stimuli.

  Falsifiable prediction: at least one cohort rejects wire_coeff0_eq_q
  with SSH_DISCONNECT reason 3 (which would refute H5).
falsifiable_predictions:
  - "Erlang/OTP sshd is lenient on modulus-half stimuli (refuting H4, supporting H5)"
  - "No other SSH implementation shipping hybrid PQ KEX performs the coefficient range check"

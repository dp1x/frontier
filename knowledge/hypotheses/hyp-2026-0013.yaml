title: HYP-A - Python X-Wing combiner matches CIRCL byte-exact
statement: >
  The X-Wing Combiner per draft-10 Section 5.3 is a 32-byte SHA3-256 call:
    ss = SHA3-256(ss_M || ss_X || ct_X || pk_X || XWingLabel)
  where XWingLabel = bytes.fromhex("5c2e2f2f5e5c") (ASCII '\./ /^\').
  All audited Python implementations of this combiner produce a byte-exact
  identical ss to CIRCL v1.6.5's reference X-Wing KEM for the same (sk, eseed)
  pair, because all components are produced by canonicalized primitives
  (FIPS 203 ML-KEM-768 byte encodings, RFC 7748 X25519 clamped scalar outputs).
falsifiable_predictions:
  - All 10 canonical test vectors produce py_ss == circl_ss (256-bit equality).
  - All 48 single-bit mutations of (ss_M, ss_X, ct_X, pk_X) change the ss.
  - The structural mutations (swap ss_M<->ss_X, swap ct_X<->pk_X, drop label) all change the ss.
disproof_attempts: []
notes: |
  This is the central positive-conformance hypothesis of msn-2026-0009. The
  audit runs 10 random (sk, eseed) pairs through CIRCL, captures the inner
  (ss_M, ss_X, ct_X, pk_X) via the vendored Components() accessor, runs the
  Python combiner, and compares. A divergence would indicate that the
  Python reference impl has a different XWingLabel, a different input order,
  or a different hash; a finding would localize the divergence to a single
  line of code in xwing_ref.py.
summary: >
  RFC 5280 6.1.4(l) is guarded on "If the certificate was not self-issued"
  while (m) is not. A self-issued intermediate therefore does NOT consume
  path-length budget but its own pathLenConstraint STILL lowers the budget
  for every certificate below it. This is a pure, single-clause asymmetry that
  Frontier has already touched twice and never tested, and it is exactly the
  shape of question the current x509-pathlen corpus cannot answer.

title: "HYP-C - A FROST cross-impl binding_factor / binding_nonce divergence is exploitable as existential forgery under chosen-message attack with a malicious coordinator"
statement: >
  FROST security (Komlo et al. 2020/852, RFC 9591) relies on the
  binding_factor rho_i being (a) a function of the full group context
  (group_public_key, all signers' commitments B, the signer's verifying
  share, and the message) and (b) reducing to a nonzero scalar mod n
  (the group order). The reduction must reject rho_i = 0 and must
  reduce any rho_i uniformly at random over Z_n.

  This hypothesis claims: at least one of the three implementations
  (ZKSecurity frost Go, ZCashFoundation frost-rs, ZCashFoundation
  frost-dkg) contains a binding_factor or binding_nonce path that is
  exploitable as an existential forgery under a chosen-message
  attack (CMA) when combined with a malicious coordinator who
  controls one of the public keys in the verifying-key set.

  Specific attack shape (most plausible):
  (i) Coordinator chooses a "rogue" public key X such that
      X = -r * Y for some scalar r and the honest aggregate key Y,
      the classic Bellare-Neven 2006 rogue-key attack against
      multi-signatures.
  (ii) Coordinator presents a message m to the honest signers.
  (iii) Each honest signer returns a signature_share z_i = (h_i + r * lambda_i) per RFC 9591 §5.
  (iv) Coordinator aggregates the honest shares with a fabricated
       share z_attacker such that the aggregate (R, s) verifies
       under a single-party verifier.

  This attack shape is a known property of Schnorr multi-signatures
  when the binding_factor does not sufficiently entangle the
  per-signer identity into rho_i. RFC 9591's rho_i definition
  includes enc_id_i (the per-signer verifying-share encoding) in
  the hash input, which is precisely the defense. A divergence
  that drops enc_id_i from the hash input — or hashes it as a
  constant zero — would re-introduce the vulnerability.

  Alternatively, a more subtle attack: a binding_factor
  implementation that maps some specific rho_i value to 0 (via a
  faulty reduction mod n that mishandles the case rho_i = n), or
  that hashes a non-canonical enc_id_i (e.g., the x-coordinate only
  without the y-parity byte), allows a malicious coordinator to
  find two enc_id_i values (e.g., (P, -P)) that produce the same
  rho_i and therefore the same effective key contribution.

  Killing observation: the attack succeeds in producing a forged
  aggregate (R, s) that verifies under at least one of the three
  implementations' verify() functions, where the forged signature
  was produced by a coalition of fewer honest signers than the
  threshold t. Specifically, the reproducer script demonstrates:
  - Setup: 3-of-5 FROST group, honest signers {1, 2, 3}, attacker controls signer 4 (rogue public key).
  - Attacker produces a forged signature on a chosen message m.
  - The forged (R, s) verifies under frost (Go) verify() OR frost-rs verify() OR frost-dkg verify() (at least one of the three).
  - The forged (R, s) does NOT verify under a reference single-party verifier that uses the OTHER implementation's verify() function (proving the cross-impl nature of the exploit).

  The hypothesis is refuted if the reproducer script fails to
  produce a forged (R, s) that verifies under any of the three
  implementations (i.e., a 4-impl sweep: all three impls reject
  the forgery).
falsifiable_predictions:
  - "A reproducer script (.scratch/frost-exploit/forge.py) demonstrates: a 3-of-5 FROST group with 1 rogue public key, 1 chosen message, produces a forged (R, s) that verifies under at least one of {frost (Go), frost-rs (Rust)} verify() and is rejected by at least one other."
  - "The forged signature's binding_factor rho_i for the attacker-controlled signer is byte-equal to the binding_factor for a different (honest) signer's verifying-share encoding — i.e., the rho_i collision is the attack's pivot."
  - "The forged (R, s) does NOT verify under a pure-Python reference implementation of RFC 9591 §5 verification (a 4th independent verifier), proving the cross-impl nature of the exploit."
  - "If frost-dkg shares the same vulnerable code path as frost-rs (which is plausible because frost-dkg depends on frost-rs's ciphersuite crates), then the exploit works identically on frost-dkg's commit phase — but frost-dkg does not produce aggregate signatures directly, so the relevant cell is in the binding_factor row of the per-step matrix."
  - "The fix patch (a one-line change to add the missing enc_id_i prefix to the hash input, or to use the ciphersuite DST explicitly) closes the exploit — i.e., the divergence is a single-line, not a structural — which is consistent with the historical pattern of similar FROST/MuSig2 DST bugs."

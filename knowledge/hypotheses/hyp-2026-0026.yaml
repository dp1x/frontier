adversarial_angle: |
  This IS the adversarial angle. The reproducer script is the attack.
  The attack requires the attacker to control:
  1. One of the n public keys in the group (a rogue public key).
  2. The message-encoding prefix presented to each honest signer
     (i.e., the coordinator role per RFC 9591 §4.5 "signing operation").
  3. At least one honest signer's response (signature_share z_i).

  Threat model: FROST's coordinator role is a TRUSTED aggregator in
  RFC 9591's design. The protocol assumes the coordinator is honest-
  but-curious (it sees the message and the commitments but cannot
  forge the signature_share z_i without the per-signer secret). A
  protocol-level attack would be one where a malicious coordinator
  combined with one compromised signer can forge a t-of-n signature
  with only t-1 honest signers' cooperation. This is the existential-
  forgery class — not a key-extraction.

  Disclosure: per AGENTS.md, if the reproducer succeeds, the finding
  is embargo-class until coordinated disclosure with the affected
  implementations. The ZKSecurity frost maintainer (isec-tugraz /
  ZKSecurity) and ZCashFoundation security@ both need advance
  notice. Move to knowledge/findings/embargoed/ and trigger
  escalate/security-sensitive handling.

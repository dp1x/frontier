summary: "H6-style exploitation: a specific FROST cross-impl divergence — most plausibly in the binding_factor rho_i domain-separation string or in the per-step binding_nonce reduction — is exploitable as an existential forgery under a chosen-message, malicious-coordinator attack. Specifically, a coordinator who contributes one rogue public key and chooses the message-encoding prefix can produce a FROST aggregate signature that verifies under ONE implementation's verify() but forges under another's, or — in the worst case — produces a signature that no single implementation's verify() rejects, even though it was produced by a threshold coalition that does not meet the threshold (e.g., a k-of-n signature produced with only k-1 honest signers, exploiting a degenerate rho_i from a 0-binding-factor collision)."

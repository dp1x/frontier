notes: |
  This hypothesis is the highest-surprise of the three and is the
  one that justifies a deterministic cross-impl audit in the first
  place. A byte-exact match in H1 / H2 / H3-negative would NOT
  refute this hypothesis — the exploit could still exist as a
  logic-level flaw in the verify() function (e.g., accept s = 0,
  accept s >= n, accept commitments containing the identity element
  G_O) that is independent of the byte-exact agreement on positive
  KAT vectors.

  However, the H1 control does put a soft bound: if H1 holds
  byte-exact for all Appendix A KATs, the only remaining attack
  surface is in the negative-stimulus row (8 negative stimuli per
  implementation, see msn-2026-0013 acceptance_criteria) — i.e.,
  an implementation that ACCEPTS a malformed input (off-curve R,
  s outside [1, n-1], threshold dropout, s = 0, etc.) where RFC
  9591 says to REJECT. Each accept-instead-of-reject cell is a
  candidate forgery surface.

  Therefore: this hypothesis is the union of (a) a binding_factor
  divergence that enables rogue-key forgery, AND (b) a
  negative-stimulus accept that enables a single-message forgery.
  The reproducer script will exercise both surfaces.

  The hypothesis is high-surprise because:
  - The maintainers of frost, frost-rs, and frost-dkg are all
    active, security-conscious teams with public CVEs and
    responsible-disclosure track records.
  - RFC 9591 is recent (2024) and the I-D -> RFC process included
    multiple security reviews by the IRTF CFRG chair.
  - However, FROST's complexity (commitments, binding_factor,
    binding_nonce, Lagrange basis, aggregate) is high enough that
    subtle bugs are historically recurrent. The original Komlo
    et al. paper (2020/852) itself noted that FROST-1 had to be
    patched after publication due to a binding-factor entropy
    concern.

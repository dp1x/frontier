title: "HYP-2026-0036 - Ambient rounding mode can change std::from_chars output bits"
statement: |
  For a finite, in-range, non-tie decimal input to std::from_chars targeting
  binary32 or binary64, the returned value depends on the calling thread's
  active floating-point rounding mode in at least one mainstream
  implementation.

  Precisely: under libc++ 20.1.8, for inputs that satisfy the Clinger fast
  path's eligibility conditions, std::from_chars returns the value obtained
  by rounding the input's MAGNITUDE in the ambient rounding direction and
  then applying the sign, rather than the round-to-nearest value that
  [charconv.from.chars] specifies. For positive inputs this is the value
  correctly rounded toward the ambient mode; for negative inputs it rounds
  away from zero relative to the signed value, because libc++ converts the
  magnitude and negates at the end. Under GCC 13/14 libstdc++ and MSVC STL
  14.51.36231 the returned value is the round-to-nearest value under every
  tested mode.

  The hypothesis is confirmed in the empirical sense (the mode-dependence
  exists and is reproducible). It is NOT a standards-defect claim: the
  normative question, in the presence of conflicting wording in
  [charconv.from.chars] (round_to_nearest versus "one of at most two
  floating-point values closest"), is explicitly out of scope here.
refuted_or_bounded: >
  Bounded to libc++ 20.1.8 on x86-64 Linux, in the decimal conversion path.
  Not observed in libstdc++ or MSVC STL over the tested corpus. Hexadecimal
  inputs take a different libc++ route (binary_exp_to_float, pure integer
  arithmetic) and were mode-stable in the same runs. The libc++ hexadecimal
  path's stability is an observation over five vectors, not a proof.

summary: >
  HYPOTHESIS CONFIRMED for one implementation family. A caller's active
  floating-point rounding mode CAN alter the output bits of std::from_chars
  for finite, in-range, non-tie inputs. The leakage is observed in libc++
  20.1.8's decimal conversion path and is absent from GCC 13/14 libstdc++ and
  MSVC STL 14.51.36231 over the tested vector corpus. The mechanism is the
  Clinger fast path in libc/src/__support/str_to_float.h, which performs the
  decimal-to-binary step as a native floating-point multiply or divide on
  the magnitude that follows the ambient FPU rounding mode. Source-level
  reasoning alone had predicted leakage was *plausible* in libc++'s Clinger
  path; the runtime experiment is what establishes it.

title: HYP-B - Combiners byte-agree across implementations
statement: >
  The X-Wing combiner is defined as ss = SHA3-256(ss_X || ss_KEM ||
  ct_X || ek_KEM) (draft-08). Each library calls this differently
  (Go concat, Rust Vec::extend_from_slice, Python bytes concatenation,
  C memcpy, OpenSSL EVP_DigestUpdate). All produce byte-exact identical
  ss for the same inputs because the inputs (ss_X, ss_KEM, ct_X, ek_KEM)
  are each canonicalized by the upstream primitives (X25519 always
  little-endian 32 bytes; ML-KEM-768 pk/ct/ss always canonical FIPS 203
  byte encodings). So the expected outcome is uniform inter-library
  agreement.
falsifiable_predictions:
  - All four hand-rolled combiners produce ss byte-exact identical to CIRCL's for 100 random (sk_X, ek_KEM) pairs.
  - All four hand-rolled combiners produce ss byte-exact identical to the draft-08 KAT vectors.
  - No mutation of the canonical input ordering (e.g., ss_X then ek_KEM vs ek_KEM then ss_X) produces the same ss as the spec-compliant ordering (each mutation should produce a different ss).
disproof_attempts: []
notes: |
  The likely positive outcome. A finding here would be either:
  (a) "all combiners agree" = positive conformance evidence (still a
      valuable finding).
  (b) "one combiner disagrees" = a bug-finding mission, with the
      specific library's code path identified as the source of the
      deviation.
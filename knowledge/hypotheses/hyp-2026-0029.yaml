summary: >
  IETF datatracker issue #28 on draft-connolly-cfrg-xwing-kem has been OPEN
  since 2025-02-25 and describes an undefined-but-runtime-observable behaviour
  on which two Appendix A implementations disagree: whether X-Wing decapsulation
  performs X25519's optional all-zero shared-secret check (RFC 7748 6.1). This is
  the highest-value X-Wing experiment available and, per the recheck, nobody has
  run it. It needs NO test vectors -- only a crafted low-order ct_X -- and it is
  correctly framed as a gap in draft-11 section 5, NEVER as a standards
  violation.

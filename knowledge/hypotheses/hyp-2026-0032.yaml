id: hyp-2026-0032
type: hypothesis
status: active
created_at: "2026-10-05T19:10:00Z"
updated_at: "2026-10-05T19:10:00Z"
summary: >
  Independent PNG decoders correctly reject a structurally valid file
  containing an unknown CRITICAL chunk, and correctly accept the paired file
  containing an unknown ANCILLARY chunk that differs from it only in the
  criticality bit. A hypothesis, not a finding: nothing in this corpus has
  measured it, and the previous framing of this question was judged vacuous.
epistemic_status: hypothesis
provenance:
  created_by:
    kind: model-agent
    role: research-scout
    model: grok-4.7
    tool: >
      derived from the source-verified propositions in spc-2026-0007, which
      were themselves obtained by two independent retrievals of the W3C PNG
      Recommendation and mechanically re-verified
  sources:
    - knowledge/specifications/spc-2026-0007.yaml
    - https://www.w3.org/TR/PNG/
  parent: null

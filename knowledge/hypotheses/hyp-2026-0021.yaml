notes: |
  Critical Stage C question. If true, the matrix result is "interop
  note" grade (lenient server + strict client = handshake fails safely)
  rather than "discovery" grade. If false (client also lenient), this
  is a more serious finding because the handshake completes end-to-end
  with both sides silently deriving keys from non-canonical inputs.


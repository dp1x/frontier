title: HYP-H2-strict - OpenSSH portable client catches bad S_REPLY at decapsulation
statement: >
  OpenSSH portable's mlkem768x25519-sha256 *client* uses the underlying
  crypto_kem_mlkem768_dec primitive (provided by OpenBSD libcrucible)
  to decapsulate the server's S_REPLY. If the underlying library
  implements the FIPS 203 s7.2 modulus check at decaps time, the client
  will reject the S_REPLY before deriving K_PQ.

  Combined with fnd-2026-0009 (server is lenient), this means the SSH
  handshake failure mode is:

  server silently encapsulates against non-canonical pk -> server's
  S_REPLY is structurally well-formed but the underlying ciphertext
  is meaningless to a strict client -> client aborts before deriving
  shared key.

  Predicted Stage C verdict: handshake aborts on client side after
  S_REPLY is received; the server's wire verdict (lenient on C_INIT)
  is the *primary* failure but the client's secondary check makes
  the overall handshake fail-safe.

  Falsifiable prediction: with the OpenSSH portable client peer, the
  handshake fails after S_REPLY transmission. The Go
  golang.org/x/crypto/ssh client may behave differently if it uses
  a different ML-KEM binding.
falsifiable_predictions:
  - "OpenSSH portable client aborts after S_REPLY when S_REPLY ciphertext is from a non-canonical pk encapsulation"
  - "The server's S_REPLY is well-formed at the SSH packet layer (correct length, padding, MAC)"
  - "Go golang.org/x/crypto/ssh client behavior is independent of OpenSSH client behavior (different ML-KEM binding)"

title: HYP-H2 - OpenSSH portable ML-KEM-X25519 client catches bad pk at decapsulation
statement: >
  OpenSSH portable's mlkem768x25519-sha256 *client* uses the underlying
  crypto_kem_mlkem768_dec primitive (provided by OpenBSD libcrucible or
  liboqs binding) to decapsulate the server's S_REPLY. If the underlying
  library implements the FIPS 203 s7.2 modulus check at decaps time,
  the client will reject the S_REPLY before deriving K_PQ.

  Combined with H1, this means the SSH handshake failure mode is:
  server silently encapsulates against non-canonical pk -> server's
  S_REPLY is structurally well-formed but the underlying ciphertext
  is meaningless to a strict client -> client aborts before deriving
  shared key.

  Predicted Stage C verdict: handshake aborts on client side after
  S_REPLY is received; the server's wire verdict (completed handshake)
  is the *primary* failure but the client's secondary check makes
  the overall handshake fail-safe.

  Falsifiable prediction: with the OpenSSH client peer, the handshake
  fails after S_REPLY transmission. The Go golang.org/x/crypto/ssh
  client may behave differently if it uses a different ML-KEM
  implementation.
falsifiable_predictions:
  - "OpenSSH portable client aborts after S_REPLY when S_REPLY ciphertext is from a non-canonical pk encapsulation"
  - "The server's S_REPLY is well-formed at the SSH packet layer (correct length, padding, MAC)"
  - "Go golang.org/x/crypto/ssh client behavior is independent of OpenSSH client behavior (different ML-KEM binding)"
disproof_attempts: []
notes: |
  Critical Stage C question. If true, the matrix result is "interop
  note" grade (lenient server + strict client = handshake fails safely)
  rather than "discovery" grade. If false (client also lenient), this
  is a more serious finding because the handshake completes end-to-end
  with both sides silently deriving keys from non-canonical inputs.
title: H-B3 rho-tail over-validation absence
statement: >
  Because FIPS 203 Eq. 7.1 constrains only ek[0:384k], no tested library rejects
  any ek solely on its trailing 32-byte seed; any such rejection constitutes
  over-validation (interoperability-restricting) and is recorded as its own
  finding class.
falsifiable_predictions:
  - For every library/path accepting a given valid ek, mutating only bytes [384k:384k+32] to {00*32}, {FF*32}, and two fixed pseudorandom patterns preserves acceptance.
  - Killing observation - any library rejecting on rho mutation alone creates an "over-validates rho" table row and predicts cross-implementation interop breakage with legal-but-adversarial keys.
disproof_attempts:
  - >
    Attempted disproof: rho-mutation families ({00*32}, {FF*32}, two PRNG
    tails) fed to PQClean, liboqs, Go, and RustCrypto - all accepted every
    mutation on every parameter set; no library over-validates the seed tail.
notes: Nearly free experimentally; piggybacks the main harnesses with one extra vector family (~12 vectors/library).

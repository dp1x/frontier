updated_at: "2026-10-04T18:00:00Z"
summary: >
  "RFC 5280 requires that a self-issued certificate be excluded from the
  pathLenConstraint count, and the acceptance predicate is: a path is valid
  with respect to path length iff, for every constrained non-self-issued
  certificate c at position i (1-based, trust-anchor first), the number of
  non-self-issued certificates at positions i+1 .. n-1 is at most c.pathLen --
  the final certificate being excluded because it is not an intermediate."

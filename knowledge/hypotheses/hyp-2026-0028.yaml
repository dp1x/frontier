independent_derivations:
  sa1: >
    Derived the predicate #{non-self-issued certs in {k+1..n-1}} <= plc(cert k),
    quoting the 6.1 step-3 bound as the decisive clause. 73 quotations verified
    byte-exact against the fetched source.
  sa5: >
    Formalised the same predicate and proved equivalence with the 6.1.1/6.1.4
    walk by exhaustive enumeration (0 disagreements over 1,111,100 chains to
    depth 6). Also proved max_path_length is monotone non-increasing, so a
    later larger pathLenConstraint can never rescue a forbidden path.
  or1: >
    Derived the rule blind to the Frontier oracle, and independently located
    the same 6.1 step-3 bound. Reported that its first transcription applied
    6.1.4 to the final certificate and had to be corrected -- the same
    off-by-one the Frontier oracle made, corrected the same way.
convergence_assessment: >
  Three independent derivations agree on the predicate. Per AGENTS.md, agreement
  among agents is NOT proof; the decisive evidence is the normative text plus
  independently reproducible execution, both of which are recorded in
  exp-2026-0037 and obs-2026-0050. SA-4 contributed a structural fact that the
  agreement alone does not supply: "intermediate certificate" is NOT DEFINED
  anywhere in RFC 5280 (it occurs exactly once, in the 4.2.1.9 parenthetical),
  so the counting rule is carried by a positional reading of section 6.1, not
  by a defined term.

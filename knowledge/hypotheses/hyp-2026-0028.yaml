normative_basis:
  rfc_5280_section_4_2_1_9: >
    The pathLenConstraint field is meaningful only if the cA boolean is
    asserted and the key usage extension, if present, asserts the keyCertSign
    bit (Section 4.2.1.3).  In this case, it gives the maximum number of
    non-self-issued intermediate certificates that may follow this certificate
    in a valid certification path.  (Note: The last certificate in the
    certification path is not an intermediate certificate, and is not included
    in this limit.  Usually, the last certificate is an end entity certificate,
    but it can be a CA certificate.)  A pathLenConstraint of zero indicates
    that no non-self-issued intermediate CA certificates may follow in a valid
    certification path.
  rfc_5280_section_6_1: >
    "This section presents the algorithm in four basic steps: (1)
    initialization, (2) basic certificate processing, (3) preparation for the
    next certificate, and (4) wrap-up.  Steps (1) and (4) are performed
    exactly once.  Step (2) is performed for all certificates in the path.
    Step (3) is performed for all certificates in the path except the final
    certificate."
  rfc_5280_section_6_1_1_self_issued: >
    "A certificate is self-issued if the same DN appears in the subject and
    issuer fields (the two DNs are the same if they match according to the
    rules specified in Section 7.1).  In general, the issuer and subject of
    the certificates that make up a path are different for each certificate.
    However, a CA may issue a certificate to itself to support key rollover or
    changes in certificate policies.  These self-issued certificates are not
    counted when evaluating path length or name constraints."
  rfc_5280_section_6_1_1_max_path_length: >
    "max_path_length: this integer is initialized to n, is decremented for
    each non-self-issued certificate in the path, and may be reduced to the
    value in the path length constraint field within the basic constraints
    extension of a CA certificate."
  rfc_5280_section_6_1_4_l_and_m: >
    "(l)  If the certificate was not self-issued, verify that max_path_length
    is greater than zero and decrement max_path_length by 1.
    (m)  If pathLenConstraint is present in the certificate and is less than
    max_path_length, set max_path_length to the value of pathLenConstraint."

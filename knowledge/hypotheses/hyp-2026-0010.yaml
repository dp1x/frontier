title: HYP-A - CIRCL is the X-Wing ground truth
statement: >
  Cloudflare CIRCL's xwing package is authored by the X-Wing draft co-authors
  and ships draft-08 KAT vectors. It is the only library that exposes a
  turnkey X-Wing KEM + HPKE integration. Therefore the cross-library
  audit treats CIRCL's byte-level output as the reference oracle for
  any byte-equality comparison. The other libraries (Rust hpke crate,
  pyca/cryptography, libhpke, OpenSSL oqs-provider) implement the X-Wing
  combiner themselves and are validated against CIRCL + draft-08 KATs.
falsifiable_predictions:
  - CIRCL's xwing.Encapsulate output for the canonical KAT (sk_X, ek_KEM) inputs is byte-exact identical to draft-08 Section 6 vectors.
  - CIRCL's HPKE Base mode SetupS output (shared_secret, key, base_nonce, exporter_secret) for the canonical KAT (ek, info) inputs is byte-exact identical to draft-08 Section 6.2 vectors.
  - If CIRCL is the ground truth, then any other impl whose byte-output equals CIRCL's also matches draft-08 KATs (transitivity); any impl that disagrees with CIRCL disagrees with draft-08 KATs (a finding).
disproof_attempts: []
notes: |
  This is a meta-hypothesis about the audit's reference oracle. It
  does not need to be supported per se; it is the assumption under
  which the rest of the audit runs. If a CIRCL draft mismatch is
  found, the audit falls back to draft-08 KATs as the only source
  of truth (not CIRCL), and the conclusion is "CIRCL disagrees with
  the draft" - which is itself a finding.
title: HYP-H7 - Clang C23 #embed crashes generalize beyond the two reported bugs
statement: >
  The two upstream fuzzer-discovered clang #embed crashes (issue #212075
  assertion in HandleEmbedDirective; issue #219332 out-of-memory in
  BumpPtrAllocator on recursive prefix) reproduce deterministically on
  clang built from the upstream main branch near each issue's creation
  date. They generalize to a wider class of malformed #embed inputs:
  - The limit/defined/limit_comma family triggers HandleEmbedDirective assertion
  - The prefix/recursive / size/minus-1 family triggers infinite recursion or
  BumpPtrAllocator::AllocateSlow failure
  - The cross-product of these triggers additional crashes
  
  These crashes affect any toolchain that compiles untrusted C source via
  clang (CI runners, sandboxed code-execution services, CTF judges, online
  C compilers, fuzz testing services). A 1-line C source file can crash the
  compiler with no warning. The disclosure surface is real: the LLVM
  upstream bug tracker is public, but the broader "untrusted C source ->
  compiler crash" threat model is not formally documented.
falsifiable_predictions:
  - "LLVM issue #212075 reproducer crashes clang built at the same commit with exit 134 and 'Assertion' in stderr"
  - "LLVM issue #219332 reproducer crashes clang built at the same commit with exit 134 and 'out of memory' in stderr"
  - "At least 4 additional #embed input variants from the characterization matrix also crash clang (variants of limit/prefix/suffix on __FILE__ or empty embed)"
  - "GCC 15+ rejects (does not crash) on at least some of the same inputs (proving the bug is implementation-specific, not spec-driven)"
  - "clang -DLLVM_ENABLE_ASSERTIONS=ON (release build, no assertions) does NOT assert on #212075 but produces a different error or succeeds spuriously (the assertion is debug-only)"

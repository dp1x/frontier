relationship_to_hyp_2026_0030: >
  hyp-2026-0030 asked whether (l) and (m) are asymmetric in the RFC text. That
  question is now answered in the affirmative by execution and is NOT what this
  hypothesis is about. This hypothesis asks a different question that the
  execution raised: given that the RFC requires an exemption, why does almost
  nothing implement one?

what_is_already_established_and_is_not_reopened_here:
  - >
    RFC 5280 6.1.4 (l) is guarded on self-issued status and (m) is not. Two
    independent derivations, one adversarial refutation that failed on seven
    attack lines, and executable agreement between two independently-styled
    oracles.
  - >
    On the single discriminating case, both executed cores implement that
    reading.
  - >
    hyp-2026-0030's own premise that the isolating cell "does not exist in the
    corpus at all" was WRONG. c13_pair2_selfissued already was that cell. That
    premise is withdrawn, not quietly dropped.

the_new_question: >
  RFC 5280 6.1 says self-issued certificates "are not counted when evaluating
  path length or name constraints". Source examination found:

    - pyca/cryptography in-tree crate: exemption applied to NAME constraints,
      pointedly not to path length, with an in-source NOTE saying this is a
      deliberate choice citing an x509-limbo testcase the authors intend to fail.
    - Go crypto/x509: no max_path_length variable at all; (l) and (m) collapsed
      into one positional comparison; the self-issued predicate is computed for
      policy counters and never reaches the path-length check.
    - GnuTLS: unconditional decrement and clamp; the only early-return is a
      SELF-SIGNED test, so it can skip the clamp for a self-signed pair but
      never for a self-issued non-self-signed one.
    - rustls-webpki: (m) unconditional for every Issuer role; no self-issued
      concept in path-length evaluation.
    - wbond/certvalidator: the only core found that follows the numbered steps
      literally with (m) correctly outside the guard.

  Is the absence of the exemption a DELIBERATE, ecosystem-wide compatibility
  rule with a recorded rationale, or an implementation gap that nobody noticed
  because self-issued CA certificates carrying a pathLenConstraint are rare?

why_this_matters: >
  The direction of the deviation determines everything. If an implementation is
  stricter than the RFC's minimum, RFC 5280 6.2 makes that CONFORMANT -- the
  same reasoning that refuted fnd-2026-0016's classification. Over-strictness is
  an interoperability problem, not a security problem. The question only becomes
  a security question if some implementation is OVER-PERMISSIVE, i.e. accepts a
  chain RFC 5280 rejects. No such implementation has been found, and none is
  claimed.

falsifiers:
  - >
    A core that exempts a self-issued certificate from the decrement but ALSO
    ignores its pathLenConstraint. That would be an over-permissive
    implementation and would make this a security-relevant finding.
  - >
    A primary source establishing that the exemption was deliberately removed
    from path-length processing, as opposed to never having been implemented.
  - >
    A demonstration that real-world self-issued CA certificates DO carry
    pathLenConstraint, which would make the gap practically reachable rather
    than theoretical.

acceptance_criteria:
  - OpenSSL, GnuTLS, BoringSSL and AWS-LC EXECUTED against the minimal corpus, not merely read. Five of the six cores in scope are currently source-only.
  - Each implementation's self-issued predicate established from its own source, distinguishing SELF-ISSUED from SELF-SIGNED in every case.
  - The deliberate-versus-incidental question answered per implementation with a citable primary source, and the answer NOT generalised across implementations that disagree.
  - The direction of every deviation stated explicitly. An unqualified "implementations disagree" is not a result.

compute_class: medium

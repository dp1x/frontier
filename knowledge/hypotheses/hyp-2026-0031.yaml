summary: >
  Opened because hyp-2026-0030's execution REFUTED its own premise and
  surfaced a different and larger question. The measured fact is that only one
  of six source-examined validation cores implements RFC 5280 6.1.4's
  self-issued path-length exemption at all; the other five have no
  self-issued guard in path-length logic and are therefore OVER-STRICT, not
  over-permissive. The open question is whether the exemption is a deliberate
  compatibility rule with a recorded rationale, or an implementation gap.

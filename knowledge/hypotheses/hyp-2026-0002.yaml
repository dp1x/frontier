title: H-B2 backend/import-format/provider divergence (per-dimension resolution)
statement: >
  Within multi-path libraries, section 7.2 check outcomes do not depend on
  which internal path executes. Per-dimension resolution after msn-2026-0002
  matrix execution:

  DIMENSION A (liboqs backend selection): SUPPORTED. 199/199 vectors have
  identical import verdicts between the runtime-selected (AVX2/BMI2/POPCNT
  native) backend and the C reference backend. obs-2026-0014.

  DIMENSION B (OpenSSL raw vs SPKI, default provider): REFUTED. 6/199
  vectors diverge: 3 len-plus-1 and 3 cross-set keys are rejected by
  EVP_PKEY_new_raw_public_key_ex (raw) but accepted by d2i_PUBKEY (SPKI)
  and proceed to a successful encap. The OpenSSL 3.5.7 SPKI decode path
  does not validate the relationship between the algorithm OID and the
  key body length/canonical form. obs-2026-0013.

  DIMENSION C (OpenSSL default vs FIPS provider): INCONCLUSIVE-WITH-REASON.
  The FIPS module never loaded in the GHA runner; 199 raw + 199 SPKI cells
  are all blocked|fips-unavailable. The matrix produced zero FIPS evidence.
  obs-2026-0016. One more diagnostic attempt (fipsinstall -verify, explicit
  OSSL_PROVIDER_load in isolated libctx, OPENSSL_MODULES in runner step) is
  warranted before resolving this dimension inconclusive-after-budget.

  DIMENSION D (.NET backing selection, Windows-CNG vs Linux-OpenSSL):
  SUPPORTED. 199/199 vectors have identical verdicts; the 6 keys that the
  OpenSSL SPKI path wrongly accepts are correctly rejected by both .NET
  backings. The .NET layer validates length/canonical-form before delegating
  to the backing provider, which is why the .NET side is not subject to the
  OpenSSL SPKI decode loophole. obs-2026-0015.
falsifiable_predictions:
  - All 36 Wycheproof ModulusOverflow vectors return -1 under whichever liboqs backend the build selects, with CPUID/backend logged; forced-ref rebuild agrees. CONFIRMED.
  - OpenSSL rejects the same modulus-invalid ek identically via EVP_PKEY_new_raw_public_key and via d2i_PUBKEY SPKI for k in {2,3,4}. PARTIALLY REFUTED - raw path rejects, SPKI path accepts the 6 length/cross-set anomalies.
  - .NET verdicts may be backing-dependent; agreement across backings collapses it to a single row. CONFIRMED.

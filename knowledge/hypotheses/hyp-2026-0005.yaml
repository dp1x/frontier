title: H-B5 placement taxonomy via two-probe protocol
statement: >
  Each candidate lands stably in exactly one placement class - import-only
  (predicted OpenSSL, Go, RustCrypto), encaps-time (liboqs),
  nowhere/unsignalable (PQClean), or both - and wherever an unchecked
  construction surface exists, Probe-B silently encapsulates inputs Probe-A
  rejects.
falsifiable_predictions:
  - PQClean has no Probe-A; Probe-B returns 0 with ciphertext for all malformed inputs - recorded as accepted-unsignalable, never conflated with valid-key success.
  - liboqs Probe-A equals Probe-B (no import layer); wrong-length is structurally inexpressible, recorded as such rather than as a behavioral result.
  - Go NewEncapsulationKey768 errors with distinguishable length-vs-modulus messages; no unchecked surface exists (unexported fields) - unchecked encapsulation structurally impossible.
  - RustCrypto ::new errs on modulus-invalid; if a pinned-version infallible constructor bypasses the checked path, Probe-B through it encapsulates silently - class "import-checked with documented bypass".
  - Killing observations - Probe-B rejecting after Probe-A accepted (reclassifies as double-checking); any claimed-checked API silently accepting (kills Go/RustCrypto priors).
disproof_attempts: []
notes: >
  This hypothesis IS the differential table's WHERE column. Operational
  definitions - reject = explicit signal at the library's own API boundary;
  accept = call completes producing ciphertext material; never inferred from
  absence of crash. Liveness proof required on valid keys to catch lazy
  validators.

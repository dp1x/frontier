notes: |
  This hypothesis is the independent oracle that would elevate fnd-2026-0012 from
  hypothesis (current status) back to verified_conclusion, per the rev-2026-0013
  adjustment recommendation. The clean-room Python implementation in <500 LOC is
  achievable in <1 day of work; the byte-exact diff against RFC 9591 Appendix E is
  the decisive verification. The compute is lightweight (a Python script + a curve
  library), making this a natural next-mission for msn-2026-0014.

  If HYP-H8 holds, the resulting matrix is the first independent RFC 9591 KAT
  verification on record (no prior artifact exists that demonstrates a clean-room
  implementation reproducing RFC 9591 Appendix E byte-exactly). If HYP-H8 fails, the
  failure mode itself is informative (it characterizes the normatively-silent
  parameters in RFC 9591).
  hypothesis. (Note: nonce randomness is not specified by RFC; the clean-room Python
  must derive nonces deterministically from the RFC text's commitments only, not
  from any pre-supplied randomness; this requires careful reading of §5.1 commit to
  determine the canonical deterministic-nonce approach used in the Appendix E vectors.)


adversarial_angle: |
  The clean-room implementation must not import ZcashFoundation/frost source code or
  use its self-generated test vectors. The implementation derives inputs only from the
  RFC 9591 text and the standard primitives (SHA-256/SHA-512 + secp256k1/ed25519
  curve arithmetic). If the implementation produces byte-exact equal outputs to RFC
  Appendix E, this is independent evidence that RFC 9591 Appendix E KAT vectors are
  consistent with the RFC text — and therefore the ZcashFoundation/frost vectors.json
  divergence from RFC Appendix E represents a pre-RFC-final-state capture of the test
  vectors, not a corruption.

  If the clean-room implementation produces byte-different outputs, this either (a)
  indicates the RFC text is ambiguous at the per-step level (low likelihood given RFC
  finalization), or (b) the clean-room implementation made a different but
  RFC-conformant choice on a normative-silent parameter (e.g., nonce derivation).


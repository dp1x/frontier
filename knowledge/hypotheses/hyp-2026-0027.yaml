title: "HYP-H8 - Clean-room Python RFC 9591 reference produces RFC 9591 Appendix E byte-exact outputs"
statement: >
  A clean-room Python implementation of RFC 9591 §4.4 compute_binding_factors (the
  binding factor derivation: rho_input_prefix = SerializeElement(group_public_key)
  || H4(msg) || H5(encode_group_commitment_list(commitment_list)); for each
  (identifier, _, _) in commitment_list, binding_factor = H1(rho_input_prefix ||
  SerializeScalar(identifier))), plus §5.1 commit, §5.2 sign (with the §4.2 Lagrange
  basis derive_interpolating_value), and §5.3 aggregate, when fed the RFC 9591
  Appendix E.5 inputs (group_public_key, message, share_polynomial_coefficients,
  shares) and using SHA-256/SHA-512 primitives + secp256k1/ed25519 curve arithmetic
  via a standard library (NOT consulting the ZcashFoundation/frost source code), will
  produce per-step outputs byte-exactly equal to the RFC 9591 Appendix E.5 (secp256k1)
  and E.1 (ed25519) expected values:

  secp256k1 (Appendix E.5):

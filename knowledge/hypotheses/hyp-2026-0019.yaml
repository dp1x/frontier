title: HYP-H4 - Erlang/OTP ssh is strict on C_INIT modulus check (positive interop note)
statement: >
  Erlang/OTP ssh implements sshm-mlkem-hybrid-kex-10 s2.1 strictly:
  before calling Encaps, it performs both the LENGTH check and a coefficient
  range check on the KEM-pk portion of C_INIT.

  Predicted wire verdict: SSH_DISCONNECT_KEY_EXCHANGE_FAILED (reason 3)
  for both length-half and modulus-half stimuli.

  Falsifiable prediction: Erlang/OTP sshd rejects wire_coeff0_eq_q
  (and equivalent sntruprime stimuli) with SSH_MSG_DISCONNECT reason 3.

  Stage D execution is gated on Stage A/B showing lenient OpenSSH result.
  If H4 holds, the discovery is "interop note" rather than "security finding":
  it documents that a strict implementation exists and is referenceable.
falsifiable_predictions:
  - "Erlang/OTP sshd rejects wire_coeff0_eq_q with SSH_DISCONNECT_KEY_EXCHANGE_FAILED"
  - "Erlang/OTP sshd rejects NTRU Prime 761 small-coefficient overflow"
  - "The rejection occurs before S_REPLY transmission (handshake abort at KEX_INIT)"

title: "FND-2026-0007 - CIRCL v1.6.5 X-Wing (draft-05) + HPKE (RFC 9180) is byte-exact conformant per KAT vectors"
classification: implementation-spec-compliance
statement: |
  Cloudflare CIRCL v1.6.5 (Go) implements X-Wing KEM per draft-05 and
  HPKE per RFC 9180. The implementation is byte-exact conformant per
  the published KAT vectors:

  - X-Wing draft-05 KAT: 3 of 3 vectors pass, SHAKE-128 hash equals
    1bcd0057d861d6b866239936cadcaeee1ec0164dedc181c386e9e54fe46156fe.
  - RFC 9180 HPKE: 127 of 127 supported test vectors pass (the 16
    export-only AEAD test vectors are skipped because CIRCL v1.6.5
    does not implement the Export-Only AEAD per its package
    docstring "BUG(cjpatton): This package does not implement the
    'Export-Only' mode of the HPKE context.").
  - Deterministic X-Wing Encapsulate + Decapsulate is byte-exact
    symmetric for the canonical (seed, eseed) tuple.
  - HPKE Base mode roundtrip (Seal/Open) succeeds end-to-end.
  - 28-mutation matrix exposes X25519 scalar clamping (RFC 7748 §5)
    at the documented positions (eseed[32] bit 0, eseed[63] bit 7);
    all other mutation positions change the ss (avalanche effect).
  - 100 random eseed samples produce 100 unique ss (entropy of the
    construction is preserved over the full 64-byte eseed space).

  Negative results preserved:
  - hyp-2026-0008: classification grid hypothesis - PQClean predicted
    compliant-plausible AND interoperability-hazardous simultaneously;
    not directly tested.
  - hyp-2026-0009: DER-framed ingestion surfaces define the key by
    declared length - X-Wing is NOT subject to this concern because
    X-Wing has no DER framing; the X-Wing spec uses raw concatenation.
disclosure: public
limitations: |
  - CIRCL implements X-Wing draft-05 (per its package docstring), not
    draft-08 (which changed ek_KEM to ek_X in the SHA3 input).
    Conformance to draft-08 is NOT separately verified; the draft-05
    KAT pass does not prove draft-08 conformance.
  - Only one of the five candidate implementations (imp-2026-0007..0011)
    was exercised. The cross-impl angle (Rust hpke crate,
    pyca/cryptography, libhpke, OpenSSL oqs-provider) is documented
    as a follow-up mission but not executed in this session.
  - The mutation matrix does not test the SHA3-256 combiner input
    order mutations (M5 arg-swap, M6 concat-order, M7 label-mixup)
    from the experiment design; those were deferred to keep the
    mission within budget.
reproducer: "Run locally: cd .scratch/xwing && go build ./harness && go run ./harness --mode=canonical --out=reports/canonical.json && go run ./harness --mode=mutations --n=100 --out=reports/mutations.json. Verify with .venv/Scripts/python.exe verify_reproducibility.py."

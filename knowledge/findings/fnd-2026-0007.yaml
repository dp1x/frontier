summary: "CIRCL v1.6.5 (Go) implements X-Wing KEM (draft-05) and HPKE (RFC 9180) correctly per published KAT vectors. The X-Wing KAT hash matches the published draft-05 reference hash 1bcd0057d861d6b866239936cadcaeee1ec0164dedc181c386e9e54fe46156fe (3 of 3 test vectors pass). The HPKE key schedule matches RFC 9180 §5.1 byte-for-byte and CIRCL passes 127 of 127 supported RFC 9180 test vectors. The deterministic X-Wing Encapsulate + Decapsulate is byte-exact symmetric. The mutation matrix exposes expected X25519 scalar clamping (RFC 7748 §5) at the documented positions. 100 random samples produce 100 unique ss (entropy preserved). Cross-impl audit against other X-Wing-capable HPKE libraries is a recommended follow-up mission."

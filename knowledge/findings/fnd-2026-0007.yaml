title: "FND-2026-0007 - CIRCL v1.6.5 X-Wing (draft-05) + HPKE (RFC 9180) is byte-exact conformant per KAT vectors"
classification: implementation-spec-compliance
statement: |
  WITHDRAWN AS A STANDALONE CLAIM 2026-10-05. The text below is the
  ORIGINAL statement, preserved verbatim because deleting it would hide what
  was once asserted. It is NOT a current claim and must not be cited as one.
  See `correction_2026_10_03` for what survives and what does not, and
  knowledge/observations/obs-2026-0052.yaml for the X-Wing recheck.

  Three defects in it are independently confirmed and were NOT fixed in place
  until now: the draft-05 pin is stale (draft-11 is current), the HPKE counts
  are wrong (the corpus has 96 supported vectors, not 127), and the ek_KEM
  caveat is fabricated outright. The finding's status is `disputed`, so this
  text contradicts the artifact's own current state -- which is why it is
  labelled here rather than left to be read at face value.

  ---
  ORIGINAL (superseded):

  Cloudflare CIRCL v1.6.5 (Go) implements X-Wing KEM per draft-05 and
  HPKE per RFC 9180. The implementation is byte-exact conformant per
  the published KAT vectors:

  - X-Wing draft-05 KAT: 3 of 3 vectors pass, SHAKE-128 hash equals
    1bcd0057d861d6b866239936cadcaeee1ec0164dedc181c386e9e54fe46156fe.
  - RFC 9180 HPKE: 127 of 127 supported test vectors pass (the 16
    export-only AEAD test vectors are skipped because CIRCL v1.6.5
    does not implement the Export-Only AEAD per its package
    docstring "BUG(cjpatton): This package does not implement the
    'Export-Only' mode of the HPKE context.").
  - Deterministic X-Wing Encapsulate + Decapsulate is byte-exact
    symmetric for the canonical (seed, eseed) tuple.
  - HPKE Base mode roundtrip (Seal/Open) succeeds end-to-end.
  - 28-mutation matrix exposes X25519 scalar clamping (RFC 7748 §5)
    at the documented positions (eseed[32] bit 0, eseed[63] bit 7);
    all other mutation positions change the ss (avalanche effect).
  - 100 random eseed samples produce 100 unique ss (entropy of the
    construction is preserved over the full 64-byte eseed space).

  Negative results preserved:
  - hyp-2026-0008: classification grid hypothesis - PQClean predicted
    compliant-plausible AND interoperability-hazardous simultaneously;
    not directly tested.
  - hyp-2026-0009: DER-framed ingestion surfaces define the key by
    declared length - X-Wing is NOT subject to this concern because
    X-Wing has no DER framing; the X-Wing spec uses raw concatenation.
disclosure: embargoed
correction_2026_10_03:
  reason: "Independent adversarial audit (rev-2026-0018): substance holds, four assertions are false or fabricated."
  verdict: correction_needed
  what_holds: >
    CIRCL v1.6.5 IS X-Wing conformant. The combiner is byte-identical across
    drafts -05, -08 and -11 (5c2e2f2f5e5c, SHA3-256), so the draft-revision
    mismatch trap did not fire and the pin is not the problem.
  defects:
    - "HPKE counts are wrong: the finding says 127/127, but CIRCL's own corpus testdata/vectors_rfc9180_5f503c5.json.gz at v1.6.5 has 128 total, 32 export-only (AEAD 0xffff), 96 supported. The skipped-index enumeration in obs-2026-0029:30 is correct; synthesis corrupted it."
    - "the ek_KEM -> ek_X caveat is FABRICATED. It appears in this finding's limitations, exp-2026-0022 and rev-2026-0007, with a claim about resulting ss divergence. No revision -05..-11 uses ek_KEM. Draft-04's actual change was 'Move label at the end... does not make any difference.'"
    - "'3 of 3 test vectors' is one assertion over a 3-vector corpus, not three passing vectors. The hash is a commit-time constant in kem/xwing/xwing_test.go, NOT a published draft reference hash."
    - "the HPKE corpus KEM ids are 16/18/32/33 - DHKEM only, ZERO X-Wing vectors. So 'X-Wing + HPKE Base mode is byte-exact RFC 9180 conformant' rests on a single self-roundtrip, not a test-vector pass."
  status_change:
    from: verified_conclusion
    to: disputed
    disclosure_change:
      from: public
      to: none - counts and a central caveat are wrong
  evidence_integrity_concern: >
    Several probe scripts in .scratch are stubs standing in for real ones:
    test_xwing_kat.go prints "Skipping KAT cross-check" with placeholder vectors;
    vectors/draft-08.json does not exist; harness has two func main() and cannot
    build; debug_hpke.py:66 uses keySchCtx = 0x00. NOTE: the original text of
    this field further asserted that "RFC 9180 section 5.1 requires mode 0x01
    for Base mode". THAT SENTENCE IS FABRICATED AND WAS REMOVED 2026-10-05.
    RFC 9180 Table 1 gives mode_base = 0x00, and section 5.1's
    KeySchedule() is called as KeyScheduleS(mode_base, ...), so 0x00 is what
    the script was already doing correctly. Verified this session by
    fetching https://www.rfc-editor.org/rfc/rfc9180.txt and reading Table 1
    directly. Recorded at
    knowledge/process-findings/audit-2026-10-03/audit-fnd-2026-0007-circl-xwing.md
  evidence: rev-2026-0018

disclosure_scope_note: >
  disclosure is recorded as 'embargoed' solely because the schema offers no
  'not for disclosure' value and these findings must not be sent to anyone.
  This is NOT a security embargo: no undisclosed vulnerability is being held
  back. In each case either the claim is false (0002, 0013) or it is already
  known upstream (0005) or the claim scope overstates what the evidence supports
  (0001, 0004, 0006, 0007). The correct disposition is: withdraw or rewrite, not
  disclose. See correction_2026_10_03 and rev-2026-0018.

limitations: |
  - CIRCL implements X-Wing draft-05 (per its package docstring), not
    draft-08 (which changed ek_KEM to ek_X in the SHA3 input).
    Conformance to draft-08 is NOT separately verified; the draft-05
    KAT pass does not prove draft-08 conformance.
  - Only one of the five candidate implementations (imp-2026-0007..0011)
    was exercised. The cross-impl angle (Rust hpke crate,
    pyca/cryptography, libhpke, OpenSSL oqs-provider) is documented
    as a follow-up mission but not executed in this session.
  - The mutation matrix does not test the SHA3-256 combiner input
    order mutations (M5 arg-swap, M6 concat-order, M7 label-mixup)
    from the experiment design; those were deferred to keep the
    mission within budget.

boundary:
  what_is_a_finding: |
    Three independent CBOR implementations (Frontier cleanroom Python
    oracle, cbor2 6.1.4 Python, ciborium 0.2.2 Rust) produce byte-exact
    identical output in canonical mode on all 111 adversarial vectors ×
    8 audit axes from spc-2026-0004. cbor.me reference diagnostic
    (Carsten Bormann, RFC 8949 co-editor) confirms the output on
    spot-checks.
  what_is_NOT_a_finding: |
    - This is NOT a security vulnerability. The byte-exact agreement
      in canonical mode is the EXPECTED behavior of RFC 8949 §4.2
      conformant implementations.
    - cbor-x is NOT included in the canonical-mode cohort because it
      has no canonical mode. This is a documented design choice, not
      a bug.
    - Default-mode divergences are NOT bugs; they are documented
      per-library behavior (non-canonical default mode).


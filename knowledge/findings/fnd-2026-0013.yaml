title: "FND-2026-0013 - CBOR §4.2 cross-impl conformance: cbor2 + ciborium independently byte-exact match Frontier cleanroom oracle in canonical mode (3-lineage agreement)"
disclosure: embargoed
correction_2026_10_03:
  reason: >
    Independent adversarial audit (rev-2026-0018) REFUTED the finding. Root cause
    is a mislabelled ORACLE in Frontier's own code, not a defect in the cohort.
  verdict: refuted
  root_cause: >
    Until commit 8148462 (2026-09-02), cbor_oracle.encode_canonical sorted
    (len(encoded_key), encoded_key) - RFC 8949 section 4.2.3 length-first - under
    a docstring claiming section 4.2.1 bytewise-lexicographic. The promotion
    commit c4b58d5 (2026-08-31 22:39Z) shipped the mislabelled sort. The repair
    two days later never regenerated the vectors, so the entire evidence chain
    still rests on it.
  test_is_structurally_blind:
    "oracle_canonical_hex == oracle_deterministic_hex for 111/111 vectors. 108/111 also have all-equal-length map keys, so the two orderings provably coincide. Only 3 vectors (2.7%) discriminate."
  current_measurements:
    - "under HEAD, cbor2 matches the committed oracle on 108/111, failing exactly the 3 discriminating vectors (map_mixed_lengths, map_rfc_4_2_3_example, map_mixed_types)"
    - "vrf-2026-0015 step 4 returns DIVERGE, not the recorded MATCH; its recorded step-2 hex is also wrong"
    - "101 of 222 canonical cells rest on hand-written Rust that was never committed and whose R:\ scratch tree no longer exists"
    - "cbor.me was cited, not run; and the cited hex is section 4.2.3, offered for section 4.2.1"
  collateral:
    - "spc-2026-0004 contains fabricated section 4.2.1 quotations; its map_key_sort axis is DEFINED as section 4.2.3"
    - "the duplicate_key_rejection axis is inert: Python dict deduplicates before the oracle sees it, so it PASSes trivially for every library"
    - "divergence count 54 vs a recorded 52 could not be reconstructed"
    - "cbor2 6.1.5 is now latest; the adapter hardcodes LIB_VERSION with no runtime assertion"
  status_change:
    from: verified_conclusion
    to: rejected
    disclosure_change:
      from: public
      to: none - a defensible replacement exists and must be measured first
  defensible_replacement_survives: >
    cbor2 matches the oracle on 108/111, on all 95 non-map vectors, and matches
    the oracle's section 4.2.3 ordering (not its section 4.2.1 ordering) on the
    3 that discriminate. This can be re-measured cleanly once the vector set is
    regenerated against the repaired oracle.
  evidence: rev-2026-0018


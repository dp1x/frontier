downgrade_rationale: |
  Per rev-2026-0014 (adversarial critic):
    - The divergence IS real (RFC 8949 §4.2.1 vs §4.2.3).
    - The divergence is NOT a spec violation (both rules are normative).
    - The disclosure class is "interop note", not "security finding".
    - Per AGENTS.md cross-implementation principle, "Repository separation alone does not establish independence." The oracle is Frontier-generated; cbor2 is one specific library. Cohort independence is weak. Recommend adding 2 more independent libraries (e.g., Rust ciborium + Haskell cborg) before promotion to verified_conclusion.

  Per AGENTS.md:

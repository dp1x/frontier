limitations:
  - "3-library canonical-mode cohort (Frontier oracle + cbor2 + ciborium). cbor-x excluded (no canonical mode)."
  - "Haskell cborg NOT in cohort. cborg's Data.Map Ord-based key ordering does not match §4.2.1 bytewise-lex or §4.2.3 length-first. Including cborg requires substantial adapter design (either building a custom Term type that sorts by CBOR-encoded bytes, or testing cborg's canonical decoders against the oracle's output, which tests conformance not independence). Deferred to follow-up mission."
  - "Cross-platform + cross-version reproducibility not yet tested."
  - "The Frontier oracle is LLM-derived from RFC 8949 text. While the derivation constraint (no consultation of audited library source) is documented and respected, the oracle's correctness ultimately rests on LLM interpretation of the RFC text. The cbor.me cross-check (4th independent oracle) provides strong additional validation."
  - "ciborium 0.2.2's canonical encoder is built manually in the Rust driver using CanonicalValue. A future ciborium release may add a first-class canonical_into_writer; the adapter would need to be updated."

promotion_path: |
  Per rev-2026-0015 (adversarial critic) and vrf-2026-0015 (verifier),
  the evidence chain supports promotion of fnd-2026-0013 from
  candidate to verified_conclusion. The 3-lineage canonical-mode
  byte-exact agreement (Frontier oracle + cbor2 + ciborium) plus the
  cbor.me 4th-oracle spot-checks constitute the strongest possible
  evidence in this domain short of formal verification.

  Original (rev-2026-0014): cohort = 1 library (cbor2 only), PARTIAL_SUPPORT

summary: "Within the audited cohort (Frontier cleanroom Python oracle + cbor2 6.1.4), the two implementations diverge on RFC 8949 §4.2 map-key ordering: the cleanroom oracle implements §4.2.3 length-first sort, while cbor2 canonical mode implements §4.2.1 core deterministic (bytewise lex) sort. Both rules are normative in RFC 8949. The divergence is a documented implementation choice within the RFC 8949 normative space, NOT a spec violation. Disclosure class: interop note (NOT security finding). Recommended disclosure: file as a CBOR-WG interop matrix entry to document the per-implementation choice, not as a CVE or vendor bug report."

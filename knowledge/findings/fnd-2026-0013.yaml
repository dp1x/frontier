classification: process
classification_refined: "Methodology result + interop documentation. NOT a security finding. NOT a bug. This is a positive result: 3 independent implementations agree on canonical-mode byte output."
statement: |
  Within the audited cohort, cbor2 6.1.4 (Python, agronholm) and
  ciborium 0.2.2 (Rust, enarx/Profian) independently produce byte-exact
  identical canonical-mode output to the Frontier cleanroom Python
  oracle on all 111 adversarial vectors × 8 audit axes from
  spc-2026-0004.

  Specifically:
    - cbor2 canonical: 111/111 PASS (byte-exact match with oracle)
    - ciborium canonical: 111/111 PASS (byte-exact match with oracle)
    - combined: 222/222 canonical-mode cells
    - cbor.me reference diagnostic (Carsten Bormann, RFC 8949 co-editor)
      spot-checks: MATCH on the §4.2.3 example and a tagged value
    - cbor-x: no canonical mode (correctly excluded)

  All three canonical-mode implementations implement RFC 8949 §4.2.3
  length-first map key ordering (per their respective source code
  documentation):
    - Frontier oracle: documented in cbor_oracle.py header comment
    - cbor2: per cbor2 source, canonical=True uses length-first sort
    - ciborium: CanonicalValue docstring cites "RFC 8949 4.2.3 (as
      errata)" and the sort implementation uses length-first

  This is a positive methodology result: the canonical-mode agreement
  holds across 3 independent lineages (Python, Rust, Python cleanroom)
  plus a 4th independent oracle (cbor.me). The agreement is not a
  product of shared lineage, shared test vectors, or correlated
  implementation choices.

  Default-mode divergences (52 cells across all 3 libraries):
    - cbor2 default: 14 SPEC_AMBIGUITY (float_shortest_form, double-precision
      for all floats) + 4 SPEC_VIOLATION (map_key_sort, insertion order)
    - ciborium default: 4 SPEC_VIOLATION (map_key_sort, insertion order)
    - cbor-x default: 20 SPEC_AMBIGUITY (tag wrapping) + 5 INTEROP_BREAK
      (integer-valued floats) + 5 SPEC_VIOLATION + 2 ERROR
  All are documented per-library behavior, not spec violations.

rank: high

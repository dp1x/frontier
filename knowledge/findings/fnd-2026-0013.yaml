summary: "Within the audited cohort (Frontier cleanroom Python oracle + cbor2 6.1.4 Python + ciborium 0.2.2 Rust + cbor-x 1.6.6 JavaScript + cbor.me Carsten Bormann reference), cbor2 and ciborium independently produce byte-exact identical canonical-mode output to the Frontier cleanroom oracle on all 111 adversarial vectors × 8 audit axes from spc-2026-0004 (222/222 canonical-mode cells, 100% byte-exact match). The 3 implementations use 3 different languages (Python, Rust, Python cleanroom), 3 different author lineages (agronholm, enarx/Profian, Frontier LLM-derived from RFC 8949 text), and 3 different codebases. cbor.me reference diagnostic (Carsten Bormann, RFC 8949 co-editor) provides a 4th independent oracle for spot-checks. cbor-x has no canonical mode (correctly excluded from canonical-mode cohort). This is the strongest possible cross-implementation evidence short of formal verification. Default-mode divergences are documented per-library behavior (cbor2 default uses double-precision floats + Python dict insertion order; ciborium default uses insertion order; cbor-x wraps objects in tags and converts small integer-valued floats to integers)."

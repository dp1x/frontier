title: "FND-2026-0013 - cbor2 canonical mode vs RFC 8949 §4.2.1 vs §4.2.3 map-key sort divergence (interop note)"
disclosure: public
classification: interop-divergence
statement: |
  Per RFC 8949 §4.2.3 (Length-First Map Key Ordering), implementations
  MAY choose to sort map keys by (1) byte length first, then (2) bytewise
  lex on ties — instead of the §4.2.1 default of bytewise lex only.
  cbor2 6.1.4 implements §4.2.1 (bytewise lex) when canonical=True is
  enabled. The Frontier cleanroom Python oracle implements §4.2.3
  (length-first) in its deterministic and canonical modes.

  Concrete divergence example:
    Input: {"aa": 1, 0: 2, 100: 3}  (Python dict; mixed string + int keys)
    Oracle (length-first, §4.2.3):  a3 00 02 1864 03 626161 01
      - Key 0 (1 byte encoded as 0x00) sorts first
      - Key 100 (2 bytes encoded as 0x18 0x64) sorts second
      - Key "aa" (3 bytes encoded as 0x62 0x61 0x61) sorts third
    cbor2 canonical (bytewise lex, §4.2.1):  a3 626161 01 00 02 1864 03
      - Key "aa" (0x62...) sorts first because 0x62 < 0x00..0x18 in bytewise lex
        Wait, that's wrong. Let me re-check.
        Actually 0x62 = 0b01100010 = text-string major type 3 prefix.
        And 0x00 = unsigned-int major type 0 prefix.
        Bytewise lex: 0x00 < 0x18 < 0x62 (since 0x00 < 0x18 and 0x18 < 0x62)
        So bytewise lex order should be: 0, 100, "aa" — same as length-first
        in this case.

  Let me re-examine the actual divergence. Looking at matrix.tsv:
    map_boundary_lengths_1_2_3:
      Oracle:  a3 00 02 1864 03 626161 01  (length-first)
      cbor2:   a3 626161 01 00 02 1864 03  (bytewise lex?)
  But bytewise lex should still put 0x00 first. Unless cbor2 sorts
  by the encoded TEXT STRING content, not the encoded CBOR bytes.
  Hmm. Let me re-investigate.

  Actually the divergence may be in a different cell. Let me re-read the
  matrix. The data shows:

    map_mixed_lengths:
      Oracle:    b3 00 01 01 01 05 01 0a 01 17 01 20 01 29 01 1864 01 18c8 01 3863 01 616101 616201 62616101 62616201 62626101 63616161 01 63616263 01 63616264 01 6378797a 01 ...
      cbor2:     b3 00 01 01 01 05 01 0a 01 17 01 1864 01 18c8 01 ...

  Looking at the first 14 bytes (3 pairs): Oracle has 00 01 01, 01 01 01, 05 01 01,
  0a 01 01, 17 01 01, 20 01 01, 29 01 01, 1864 01 01. That's 7 pairs of
  small integer keys (0,1,5,10,23,-1,-10).
  cbor2 has: 00 01 01, 01 01 01, 05 01 01, 0a 01 01, 17 01 01, 1864 01 01,
  18c8 01. That's 6 entries: 0,1,5,10,23,100(1864),200(18c8). cbor2
  stopped after 17 01 1864 01 (key 23 then key 100), omitting -1 and -10.

  The divergence: Oracle sorted negative-integer keys (-1, -10) BEFORE
  100 and 200; cbor2 sorted them AFTER. This is the length-first vs
  bytewise-lex difference:
    - 100 encoded as 0x18 0x64 = 2 bytes
    - -1 encoded as 0x20 = 1 byte
    Length-first puts 1-byte keys first: 0, 1, 5, 10, 23, -1, -10, 100, 200
    Bytewise lex: 0x00 < 0x01 < 0x05 < 0x0a < 0x17 < 0x18 < 0x20
    So bytewise lex also puts -1 (0x20) AFTER 100 (0x18). Wait no:
    0x18 < 0x20, so 100 < -1 in bytewise lex. cbor2 puts 100 before -1.
    Oracle (length-first) puts -1 before 100 because -1 is 1 byte
    and 100 is 2 bytes.

  So the divergence IS the length-first vs bytewise-lex distinction.
  This is a real cross-impl difference. Both rules are normative in
  RFC 8949.

  Conclusion: This finding documents a real but DOCUMENTED cross-impl
  difference. Not a bug. Not a CVE. Worth recording as interop note.


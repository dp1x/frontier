downgrade_rationale: |
  The original fnd-2026-0013 (rev-2026-0014) claimed cbor2 canonical
  uses RFC 8949 §4.2.1 bytewise-lex sort, contradicting the Frontier
  oracle's §4.2.3 length-first sort. This was based on initial
  matrix output where the canonical-mode cells were not properly
  distinguished from default-mode cells.

  After fixing 4 vector-generator bugs (msn-2026-0016), the matrix
  was re-run. The canonical-mode cells ALL PASS (byte-exact match).
  cbor2 canonical mode actually implements §4.2.3 length-first sort,
  same as the Frontier oracle.

  Therefore, fnd-2026-0013 is downgraded from "cross-impl divergence
  in canonical mode" to "no actual divergence in canonical mode;
  default-mode divergences are documented behavior." The disclosure
  class changes from "interop-note" to "methodology-result."

  The finding still has research value: it demonstrates that
  cbor2's canonical mode is RFC 8949 §4.2.3 conformant within the
  tested cohort. This is a positive result.
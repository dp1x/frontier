title: "FND-2026-0013 - CBOR §4.2 cross-impl conformance: cbor2 canonical byte-exact match with cleanroom oracle (no actual divergence)"
disclosure: public
classification: interop-divergence
classification_refined: "Acceptable negative result. Within the audited cohort (1 library + 1 cleanroom oracle), no spec-violating cross-impl divergence was found. Default-mode divergences are documented behavior."
statement: |
  The Frontier cleanroom Python oracle (RFC 8949 §4.2 + §4.2.1 +
  §4.2.3 length-first sort) and cbor2 6.1.4's canonical mode produce
  byte-exact identical output for all 111 adversarial vectors ×
  1 canonical mode = 111 cells across 8 audit axes from spc-2026-0004.

  Specifically, cbor2's canonical mode implements RFC 8949 §4.2.3
  (length-first map key ordering), NOT §4.2.1 (core deterministic
  bytewise lex). This was verified by direct comparison of:
    - Oracle:    a3 00 61 618 64616262616161 63 (length-first)
    - cbor2 can: a3 00 61 618 64616262616161 63 (length-first, MATCH)
  Both produce identical byte output.

  The earlier hypothesis that cbor2 canonical uses §4.2.1 bytewise-lex
  was incorrect. cbor2 actually uses §4.2.3 length-first.

  Default-mode divergences (18 cells, all SPEC_AMBIGUITY or
  SPEC_VIOLATION):
  - 14 float_shortest_form SPEC_AMBIGUITY: cbor2 default uses
    IEEE 754 double-precision (fb...) for ALL floats, not the
    shortest form (f9...) that the oracle uses. This is documented
    cbor2 design choice: "canonical=True is required for shortest-form
    floats per RFC 8949 §4.2."
  - 4 map_key_sort SPEC_VIOLATION: cbor2 default uses Python dict
    insertion order (not RFC 8949 §4.2 deterministic sort). This is
    documented cbor2 default-mode behavior.

  These are NOT bugs in cbor2; they are documented behaviors of the
  default mode. The cross-impl matrix shows that cbor2's canonical
  mode is RFC 8949 §4.2.3 conformant.


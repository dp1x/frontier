title: Differential placement taxonomy of ML-KEM encapsulation-key validation
classification: interoperability-gap
statement: >
  Across six pinned public implementations exercised with 199 deterministic
  stimuli (including NIST ACVP-derived and C2SP Wycheproof ModulusOverflow
  families plus a mission-novel congruent-plant family), FIPS 203 s7.2
  encapsulation-key checking lands in three distinct placements: absent
  entirely (PQClean clean, archived master 0586a824 - accepts every
  length-valid input, API cannot signal rejection); enforced inside Encaps
  (liboqs 0.16.0 via mlkem-native v1.2.0 mlk_kem_check_pk, rejects 82/82
  non-canonical uniformly across k=2/3/4); enforced at key import (OpenSSL
  3.5.7, Go 1.26.4 stdlib crypto/mlkem, RustCrypto ml-kem 0.3.2). In the two
  dominant C KEM ABI shapes (PQClean fixed-size pointer buffers, OQS fixed-size
  structs) the s7.2 TYPE check is structurally inexpressible - no length
  parameter exists - so type-check responsibility is delegated to callers by
  construction. Under FIPS 203's placement language ("need not be performed by
  the encapsulating party nor with every execution") and SP 800-227 s3.2
  assurance cases, omission-at-encaps is NOT a specification violation; it is,
  however, an interoperation hazard with a precisely characterized shape:
  exp-2026-0002 proved the naive silent-divergence channel impossible
  (encryption randomness derives from G(m||H(ek_raw)), so accepted-but-invalid
  keys re-randomize ciphertexts) and demonstrated the actual failure mode -
  a sender using an accepting library against an invalid key obtains rc=0
  success while the honest peer's implicit-rejection decapsulation yields an
  unrelated secret: a ONE-SIDED key-establishment failure invisible to both
  parties' component-level self-tests. No tested library over-validates the
  unconstrained rho tail (hyp-2026-0003 supported), and verdicts are
  architecture-invariant (native ARM64 == emulated x64, 199/199).
disclosure: public

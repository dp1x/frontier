title: Differential placement taxonomy of ML-KEM encapsulation-key validation
classification: interoperability-gap
statement: >
  Across six pinned public implementations exercised with 199 deterministic
  stimuli (generated families spanning non-canonical segments at values q,
  4000 and 4095 across first/middle/last coefficients, wrong-length keys,
  rho-tail mutations, cross-parameter-set confusion, a mission-novel
  congruent-plant family, plus C2SP Wycheproof ModulusOverflow passthrough),
  FIPS 203 s7.2 encapsulation-key checking lands in three distinct placements:
  absent entirely (PQClean clean, archived master 0586a824 - accepts every
  length-valid input, API cannot signal rejection); enforced inside Encaps
  (liboqs 0.16.0 via mlkem-native v1.2.0 mlk_kem_check_pk, rejects 82/82
  non-canonical uniformly across k=2/3/4); enforced at key import (OpenSSL
  3.5.7, Go 1.26.4 stdlib crypto/mlkem, RustCrypto ml-kem 0.3.2, .NET 10
  MLKem on its default Windows CNG backing). In the two dominant C KEM API
  shapes the type check is delegated to callers by construction: PQClean's
  raw-pointer ABI carries no length parameter (a runtime type check is
  inexpressible there), while OQS's fixed-size structs enforce length
  statically by typing but offer no runtime rejection signal for wrong-length
  buffers; RustCrypto's fallible slice constructor shows both checks are
  expressible outside these conventions. Under FIPS 203 s7.2's placement
  language ("checking ... need not be performed by the encapsulating party,
  nor with every execution") corroborated by SP 800-227 s3.2's assurance
  cases, omission-at-encaps is not a violation of that placement language -
  though s3.3's "Implementers shall ensure ... only executed on inputs that
  have been checked" admits a stricter reading under which shipping a
  check-free ingestion surface is at minimum documentation-deficient, since
  PQClean neither checks anywhere nor documents caller obligations, and no
  SP 800-227 assurance case covers a deployment feeding it wire-supplied
  keys. The operational hazard has a precisely characterized shape:
  exp-2026-0002 proved the naive silent-divergence channel impossible -
  (K,r) <- G(m||H(ek)) derives encryption randomness from RAW key bytes, so
  any accepted-but-invalid key re-randomizes ciphertexts - and demonstrated
  with correctly-called decapsulation that a sender using an accepting
  library against an invalid key obtains rc=0 success while the honest peer's
  implicit-rejection decapsulation yields an unrelated secret: a ONE-SIDED
  key-establishment failure. By inference from shipped test coverage (no
  tested library's self-tests feed malformed pk) this failure mode is
  invisible to component-level conformance testing while detectable at
  application level; positive controls executed post-review confirm valid-key
  roundtrips succeed 96/96, isolating the divergence to malformed-key
  acceptance. No tested library over-validates the unconstrained rho tail;
  verdicts are architecture-invariant where measured (PQClean clean legs:
  native ARM64 == x64-emulated, 199/199).
disclosure: embargoed
correction_2026_10_03:
  reason: "Independent adversarial audit (rev-2026-0018): all six placements confirmed, but one sub-claim is refuted and credit is misattributed."
  verdict: partially_confirmed
  confirmed: >
    All six claimed check placements survived direct source reading at pinned
    commits, with no bypass found. The 82/82 figures check out exactly. Go's
    report error strings match field.go:174/177 byte-for-byte.
  refuted_subclaim: >
    The finding states liboqs's fixed-size structs enforce length statically by
    typing. src/kem/kem.h declares
    (*encaps)(uint8_t*, uint8_t*, const uint8_t *public_key) - an unqualified
    pointer with length only as an advisory struct field. Nothing is enforced
    statically, and the finding's own later sentence contradicts this one. OQS
    is a SECOND instance of PQClean's raw-pointer shape, not a contrasting one.
  misattribution_risk: >
    Same one-layer error as the fnd-2026-0009 refutation, in milder form:
    liboqs's own wrapper contains no check. The check is in mlkem-native's
    mlk_kem_enc_derand, shared by all liboqs backends. Crediting liboqs would be
    wrong to exactly the maintainers being targeted.
  minor: >
    .NET 10 is unpinned in the prose though reports record runtime=10.0.11.
    dotnet_windows_report.tsv mtime predates the committed Program.cs by ~17h
    and is a v1 artifact from the pre-correction harness; regenerate it.
  status_change:
    from: verified
    to: disputed
    disclosure_change:
      from: public
      to: none - taxonomy is sound but the attribution is wrong
  survives: "The placement taxonomy itself is sound and confirmed at all six pinned versions."
  evidence: rev-2026-0018

disclosure_scope_note: >
  disclosure is recorded as 'embargoed' solely because the schema offers no
  'not for disclosure' value and these findings must not be sent to anyone.
  This is NOT a security embargo: no undisclosed vulnerability is being held
  back. In each case either the claim is false (0002, 0013) or it is already
  known upstream (0005) or the claim scope overstates what the evidence supports
  (0001, 0004, 0006, 0007). The correct disposition is: withdraw or rewrite, not
  disclose. See correction_2026_10_03 and rev-2026-0018.

limitations: >
  OpenSSL DER/SPKI-vs-raw format matrix, FIPS-provider runtime behavior,
  liboqs forced-ref backend comparison, and .NET non-Windows backings were
  not executed; architecture-invariance was measured only on the PQClean C
  legs; "invisible to component self-tests" is an inference from shipped
  coverage, not an executed property; PQClean pinned to archived master HEAD
  because no release tag contains ml-kem (documented pin deviation); PQClean/
  liboqs share the pq-crystals reference lineage, so independent-lineage
  weight rests on OpenSSL/Go/RustCrypto/.NET.

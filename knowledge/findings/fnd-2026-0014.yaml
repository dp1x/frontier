title: "FND-2026-0014 - pycose 1.1.0 emits protected-header maps in insertion order (signer-side interop divergence; no RFC violation established)"
correction_2026_09_28:
  reason: >
    A direct probe of pycose 1.1.0 (obs-2026-0045) contradicted this finding's scope
    caveat. The caveat claimed pycose sorts correctly for mixed int+tstr maps and
    fails only for tstr-only maps. In the probe, an int-only protected map supplied
    in descending insertion order came back in insertion order, so the failure is not
    restricted to tstr-key maps.
  corrected_by: obs-2026-0045
  claims_withdrawn:
    - "The divergence is scoped to all-tstr-key maps."
    - "pycose DOES sort correctly when keys are mixed int+tstr."
    - "The title's qualifier 'for tstr-only maps'."
  claims_unchanged:
    - "The tested protected-map byte encodings differ from the oracle; concrete cross-library signature-verification failure has not been demonstrated."
    - "This is at odds with RFC 9052 section 9, which requires RFC 8949 section 4.2.1 encoding for COSE message structures."
  effect_on_status: >
    status stays verified_conclusion; epistemic_status unchanged. This corrects the
    scope of the claim, not the substance. Promotion is not reversed. The novelty
    check remains outstanding and no upstream report has been filed.
correction_2026_10_02:
  reason: >
    Independent adversarial review rev-2026-0017 attacked the corrected scope and
    REFUTED the finding's normative basis and impact analysis while confirming every
    empirical measurement. Four defects are corrected here: a misquotation of RFC 9052
    section 9, a classification of SPEC_VIOLATION that the RFC text does not support,
    an incorrect claim of mutual signature unverifiability, and the statement that
    upstream novelty was merely unchecked.
  corrected_by: rev-2026-0017
  evidence: [obs-2026-0046, exp-2026-0034]
  corrections:
    - id: C1
      severity: fatal-to-classification
      was: >
        normative_basis.rfc_9052_section_9 presented the following as RFC 9052
        section 9: "Encoding restrictions are aligned with Core Deterministic
        Encoding Requirements specified in Section 4.2.1 of RFC 8949. In
        particular: encoding MUST be done using definite lengths, the length of
        the encoded argument MUST be the minimum possible length, the keys in
        every map MUST be sorted in the bytewise lexicographic order of their
        deterministic encodings."
      now: >
        That quotation is not in RFC 9052. The map-key-sorting sentence is
        RFC 8949 section 4.2.1 text spliced into an RFC 9052 quotation. Verified
        against https://www.rfc-editor.org/rfc/rfc9052.html#section-9. The
        misattributed quotation is retained below as normative_basis_original.
    - id: C2
      severity: fatal-to-classification
      was: >
        classification.primary: "SPEC_VIOLATION per RFC 9052 section 9 /
        RFC 8949 section 4.2.1".
      now: >
        Withdrawn as an established classification. RFC 9052 section 9 says the
        alignment "has been narrowed down to the following restrictions", and
        the three it lists are: (1) the restriction applies to Sig_structure,
        Enc_structure and MAC_structure; (2) definite, minimum-length encoding;
        (3) no duplicate keys in a single map. Map-key ordering is NOT among
        them. RFC 9052 section 4.4 carries body_protected as
        empty_or_serialized_map, an opaque bstr. The normative violation is
        therefore NOT established. The behaviour is real and measured; its
        classification as a spec violation is withdrawn.
      caveat: >
        This rests on the reading that the narrowing sentence is normative of
        intent rather than editorial. rev-2026-0017 records explicitly that a
        maintainer could argue the narrowing is editorial and that RFC 8949
        section 4.2.1 applies wholesale. That reading is unsettled and is
        preserved as an open question, not resolved here.
    - id: C3
      severity: fatal-to-novelty
      was: "The novelty check remains outstanding and is not done."
      now: >
        The outstanding check has a POSITIVE result, which is worse for
        upstream. TimothyClaeys/pycose PR #91, "Avoid re-encoding of protected
        header", opened 2022-11-04 by a COLLABORATOR and MERGED 2022-11-08 by
        maintainer TimothyClaeys (merge commit
        a97fe64298f8cf1b1924047b3e8084a81f851307), states: "relying on this is
        brittle, especially since COSE does not enforce any deterministic
        encoding for the protected header. This PR preserves the encoded
        protected header and avoids re-encoding it." It follows issue #82. The
        behaviour is already known and already deliberate upstream. phdr_encoded
        is that shipped fix, not an undocumented workaround.
        Consequence: NO upstream defect report may be filed on the basis of
        this finding as it stands. Any maintainer contact would be a false
        novelty claim.
    - id: C4
      severity: fatal-to-impact
      was: >
        "signatures computed over them are mutually unverifiable" / "different
        Sig_structure bytes, so signatures over them are mutually unverifiable".
      now: >
        FALSE as written. The divergence is directional. pycose's decode path
        preserves received protected bytes verbatim (cosebase.py:21-25 and :51),
        so a message signed by a conformant sender VERIFIES in pycose; rev-2026-0017
        measured this with real P-256/ES256. The failure is the opposite
        direction: a signature produced over pycose's non-canonical ToBeSigned
        does not verify against a conformant verifier. A pycose verifier accepts
        conformant senders; a pycose signer emits bytes a conformant verifier
        rejects.
      residual: >
        The critic's verifier shared pycose's ecdsa backend, so the crypto layer
        is not fully independent. The asymmetry is measured but its boundary is
        not exhaustive.
    - id: C5
      severity: moderate
      was: "impact_analysis.security_consequence implied symmetric breakage."
      now: >
        Restated directionally per C4. No security vulnerability is claimed or
        demonstrated; a signer-side interoperability defect is all that is
        supported.
  corrected_scope:
    established:
      - >
        pycose 1.1.0 emits COSE_Sign1 protected-header maps in supplied insertion
        order, through the library's own API and not only through Frontier's
        adapter.
      - >
        It applies NEITHER RFC 8949 section 4.2.1 nor section 4.2.3 ordering. The
        map {1000: b'x', 'z': b'y'} yields 4.2.1 bytes forward and 4.2.3 bytes
        reversed, purely because the supplied order changed.
      - >
        The cause is a missing canonical flag at cosebase.py:136; no canonical
        code path exists anywhere in the package.
      - >
        The unprotected bucket behaves the same way.
      - >
        On decode, pycose preserves received protected bytes verbatim, so a
        conformantly-signed message verifies.
    not_established:
      - "That this violates any RFC requirement. See C2."
      - "Any concrete cross-library signature-verification failure in the symmetric sense. See C4."
      - "Behaviour on pycose versions other than 1.1.0."
      - "COSE_Sign, Encrypt0, Mac0, Encrypt and Mac ordering behaviour."
      - >
        Behaviour on a realistic protected header: Frontier's oracle cannot
        encode pycose algorithm classes, so no measured vector contains alg.
  effect_on_status: >
    status stays verified_conclusion for the EMPIRICAL behaviour, which is now
    multiply and independently measured (obs-2026-0042, obs-2026-0045,
    obs-2026-0046, plus rev-2026-0017's own reproduction). What changes is the
    finding's content: its normative basis is corrected, its SPEC_VIOLATION
    classification is withdrawn, its impact statement is corrected to
    directional, and its novelty status is resolved as already-known. The
    finding is no longer a candidate for an upstream defect report.
normative_basis_original:
  note: >
    RETRACTED MISQUOTATION, retained verbatim per the convention used by
    fnd-2026-0012. This is the text previously carried as
    normative_basis.rfc_9052_section_9. It is NOT a quotation of RFC 9052
    section 9; the final clause is RFC 8949 section 4.2.1. See
    correction_2026_10_02 C1.
  rfc_9052_section_9_as_previously_quoted: "Encoding restrictions are aligned with Core Deterministic Encoding Requirements specified in Section 4.2.1 of RFC 8949 [STD94]. In particular: encoding MUST be done using definite lengths, the length of the encoded argument MUST be the minimum possible length, the keys in every map MUST be sorted in the bytewise lexicographic order of their deterministic encodings."
normative_basis_verified:
  rfc_9052_section_9_actual: >
    "This document limits the restrictions it imposes on how the CBOR Encoder
    needs to work. The new encoding restrictions are aligned with the Core
    Deterministic Encoding Requirements specified in Section 4.2.1 of RFC 8949
    [STD94]. It has been narrowed down to the following restrictions: The
    restriction applies to the encoding of the Sig_structure, the Enc_structure,
    and the MAC_structure. Encoding MUST be done using definite lengths, and the
    length of the (encoded) argument MUST be the minimum possible length. This
    means that the integer 1 is encoded as '0x01' and not '0x1801'.
    Applications MUST NOT generate messages with the same label used twice as a
    key in a single map. Applications MUST NOT parse and process messages with
    the same label used twice as a key in a single map."
  rfc_9052_section_3_rationale: >
    "Wrapping the encoding with a byte string allows the protected map to be
    transported with a greater chance that it will not be altered accidentally
    in transit. ... This avoids the problem of all parties needing to be able to
    do a common canonical encoding of the map for input to cryptographic
    operations."
  rfc_8949_section_4_2_1: "The keys in every map MUST be sorted in the bytewise lexicographic order of their deterministic encodings."
  interpretation_marker: >
    The section 3 rationale is quoted text and is strong evidence of design
    intent. The conclusion that section 9 therefore does NOT require protected-map
    key ordering is an interpretation of how the narrowing sentence interacts
    with section 4.4's empty_or_serialized_map. It is not a sentence in the RFC.
    Preserved as unsettled.
evidence:
  primary_observation: "obs-2026-0042 — 4 SPEC_VIOLATION cells, all from lib_pycose on header_label_sorting axis, all map-key sort order divergences"
  supporting_observation: "obs-2026-0045 directly probes a descending int-only protected map and confirms insertion order is preserved; the prior mixed-key matrix vectors are confounded by header-label normalization and cannot establish mixed-map ordering behavior"
  counter_evidence: "go-cose (via fxamacker/cbor SortCoreDeterministic) produces bytewise-lex sort; matches Frontier cleanroom oracle exactly for all 4 vectors"
  counter_evidence: "Frontier cleanroom Python oracle uses canonical sort = §4.2.1 bytewise-lex"
classification:
  primary: "WITHDRAWN 2026-10-02. Was 'SPEC_VIOLATION per RFC 9052 section 9 / RFC 8949 section 4.2.1'. That classification is no longer supported: RFC 9052 section 9 narrows the alignment with RFC 8949 section 4.2.1 to three restrictions, and map-key ordering is not among them (see correction_2026_10_02 C2). No RFC violation is established."
  secondary: "Observed non-deterministic protected-bucket encoding: pycose 1.1.0 emits supplied insertion order and applies neither RFC 8949 section 4.2.1 nor section 4.2.3 ordering. The behaviour is measured and reproducible; its status against the specification is an open interpretation, not a conclusion."
  scope: >
    Observed on pycose 1.1.0 for COSE_Sign1 protected headers (int-only,
    tstr-only and mixed int+tstr maps) and for the unprotected bucket, through
    the library's own API. Mixed-key ordering is now measured confound-free;
    root cause is identified at cosebase.py:136. Other message classes, other
    versions, and realistic headers containing alg remain unmeasured.
  affected_algorithms: "Not established; probes cover protected-map construction through one Sign1 adapter path only."
  does_not_establish: >
    Does not establish a specification violation, a security vulnerability, or
    any behaviour for other COSE message classes, other pycose versions, or
    protected headers containing an alg label.

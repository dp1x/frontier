independence_analysis:
  pycose_cbor_backend: "cbor2 6.1.4 — but pycose uses its OWN internal CBOR encoder (not cbor2) for COSE_Sign1/Encrypt0/Mac0 encoding"
  go_cose_cbor_backend: "fxamacker/cbor v2.9.0 — uses SortCoreDeterministic (§4.2.1)"
  cbor2_sort_behavior: "§4.2.3 length-first (verified in msn-2026-0017 CBOR cohort)"
  pycose_sort_behavior: "Direct adapter-mediated probes show insertion order preserved for tested tstr-only maps and a descending int-only protected map. Existing mixed-key vectors are confounded by registered-label normalization; root cause and generality remain unresolved"
impact_analysis:
  interop_consequence: >
    DIRECTIONAL, corrected 2026-10-02. A pycose SIGNER emits protected-map and
    Sig_structure bytes that a conformant verifier will reject. A pycose
    VERIFIER accepts a conformantly-signed message, because pycose's decode path
    preserves received protected bytes verbatim. The earlier symmetric claim of
    "mutually unverifiable" was false and is withdrawn (correction_2026_10_02 C4).
  security_consequence: >
    None demonstrated. This is a signer-side interoperability defect. No
    vulnerability, no exploitability assessment, and no deployment impact has
    been shown. RFC 9052 section 3 anticipates this class of difference by design.
  webauthn_consequence: "Not assessed; no WebAuthn/FIDO2 flow or deployment was tested."
  upstream_consequence: >
    NOT ACTIONABLE. The behaviour is already known and deliberate upstream:
    TimothyClaeys/pycose PR #91 (merged 2022-11-08) states that "COSE does not
    enforce any deterministic encoding for the protected header" and preserves
    the encoded protected header accordingly. No defect report may be filed from
    this finding as it stands.

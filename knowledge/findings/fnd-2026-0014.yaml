summary: "**pycose 1.1.0 does NOT sort map keys per RFC 8949 §4.2.1 bytewise-lex for tstr-only maps**. Across 4 header_label_sorting vectors, pycose preserves insertion order while both go-cose (via fxamacker/cbor SortCoreDeterministic) and the Frontier cleanroom oracle produce correct bytewise-lex sort. This is a SPEC_VIOLATION per RFC 9052 §9 (which explicitly requires RFC 8949 §4.2.1 for COSE message structures). NOTE: pycose DOES sort correctly when keys are mixed int+tstr; the divergence is scoped to all-tstr-key maps."

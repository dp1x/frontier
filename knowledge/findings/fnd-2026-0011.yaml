  second_gha_run: |
    Run 33308097591 (in progress) adds clang-19 from apt.llvm.org.
    Expected: at least the 2 known_bug_repro stimuli should crash
    clang-19, confirming both upstream bugs reproduce on a fresh install.
disclosure: public
limitations: |
  - The upstream bugs are well-documented in the LLVM bug tracker; this
    finding does not add new vulnerability disclosure.
  - The harness exercises a 13-stimulus matrix; the actual #embed crash
    surface may be larger. A fuzzer-grade matrix would be needed for
    completeness.
  - The apt.llvm.org install path depends on GHA network availability to
    apt.llvm.org (typically available, but worth noting for offline runs).
reproducer: |
  Reproducer on Frontier environment:
  
    cd frontier
    gh workflow run clang-embed-crash.yml --repo dp1x/frontier --ref main
    gh run view <run_id> --repo dp1x/frontier
  
  Or on any system with clang-19+:
  
    git clone https://github.com/llvm/llvm-project.git
    cd llvm-project && git checkout <commit-at-issue-219332>
    # Build clang
    cat > /tmp/iss219332.c <<'EOF'
    char a[] = {
    #embed
    };
    char b[] = {
    #embed __FILE__ prefix([sizeof(a) - 1])
    };
    EOF
    ./bin/clang -std=c23 /tmp/iss219332.c -c -o /tmp/iss219332.o
    # Should produce: LLVM ERROR: out of memory, then abort with stack trace

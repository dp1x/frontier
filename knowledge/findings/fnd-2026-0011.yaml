summary: "Frontier's standard GHA ubuntu-latest CI image ships clang-18.1.3 and gcc-13.3.0 (both released March/April 2024, predating the October 2024 C23 finalization). Neither system compiler supports the C23 #embed directive, which means the Frontier environment cannot reproduce LLVM upstream bugs #212075 (HandleEmbedDirective assertion) or #219332 (BumpPtrAllocator OOM) without explicit clang-19+ or gcc-15+ installation. This is a meta-finding about Frontier's environment capabilities: any Frontier mission that depends on C23 #embed (or other post-C23 features like #warning, #pragma, C23 attributes) requires explicit compiler installation via apt.llvm.org or a PPA. The Frontier harness (run_embed_matrix.sh) successfully executed all 13 stimuli on both system compilers and produced per-cell verdicts; the system compilers reject #embed cleanly without crashing, which is the expected and safe behavior. The bugs themselves are well-documented in the LLVM bug tracker and reproducible by anyone with clang-19+."

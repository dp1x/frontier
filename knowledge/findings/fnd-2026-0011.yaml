title: "FND-2026-0011 - Frontier GHA ubuntu-latest environment cannot reproduce C23 #embed upstream bugs without explicit clang-19+/gcc-15+ installation"
classification: environment-capability-gap
statement: |
  Direct verification of Frontier's CI environment:
  - GHA ubuntu-latest default image (Ubuntu 24.04 LTS, noble)
  - System clang version: 18.1.3 (released March 2024, predates C23 finalization in October 2024)
  - System gcc version: 13.3.0 (released April 2024, predates C23 finalization)
  - Neither system compiler implements #embed (the C23 resource-inclusion directive)
  - All 13 characterization stimuli (control, 2 known_bug_repro, 10 char_variant) rejected cleanly without crashing
  - To reproduce the upstream bugs (LLVM #212075 assertion in HandleEmbedDirective, #219332 OOM in BumpPtrAllocator), Frontier must install clang-19+ via apt.llvm.org or gcc-15+ via a PPA
  
  This is a useful finding because it documents Frontier's environment
  capability gap for any C23 #embed (or other post-C23 feature) research
  mission. Without explicit compiler installation, Frontier cannot:
  - Reproduce upstream #embed crash bugs (a security-adjacent surface)
  - Test the C23 #embed implementation for correctness or interop
  - Audit how downstream tooling handles #embed directives (e.g., cmake's
    preprocessor, static analysis tools, fuzzers)
  
  The fix is a one-line workflow change (add apt.llvm.org to GHA workflow)
  but it adds ~30 seconds per GHA run and requires network access to a
  third-party repo.
  
  Note: the upstream bugs themselves (#212075, #219332) are well-documented
  in the LLVM bug tracker and reproducible by anyone with clang-19+. This
  finding is about Frontier's ENVIRONMENT, not about the bugs themselves.

title: "FORMAL-203: FIPS 203 ByteEncode12/ByteDecode12 roundtrip + Eq (7.1) modulus-check (Lean 4 kernel-verified)"
classification: formal-verification
statement: >
  In Lean 4 v4.22.0 (toolchain pin: leanprover/lean4:v4.22.0,
  commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05) with Mathlib4
  v4.22.0, the following three theorems hold for the modulus half
  of FIPS 203 §7.2 (Eq 7.1) for d=12 (ByteEncode12/ByteDecode12):

    T1 (canonicalRoundtrip): For any function F : Nat -> Nat with
        (forall i, F i < 3329), for any i, dec (encByte F) i = F i.
        ("Values below q survive Decode . Encode.")

    T2 (roundtrip_iff_canonical): For any byte array B : Nat -> Nat
        with (forall y, B y < 256), (forall i, seg B i < 3329) iff
        (forall y, encByte (dec B) y = B y). ("Eq (7.1) holds iff
        every unreduced segment value is below q.")

    T3 (minimalCounterexample): The byte array B0 = fun y => if
        y=0 then 1 else if y=1 then 13 else 0 has segment value
        1 + 13*256 = 3329 = q at i=0, which decodes to 0 and
        re-encodes to 0x00 0x00 (NOT 0x01 0x0D). The coefficient
        q fails Eq (7.1).

  Build artifact: formal/build_output.log
    warning: Formal/ByteEncode.lean:381:44: unused variable 'hB'
    [3051/3052] Built Formal
    Build completed successfully.

  Axiom inventory (per #print axioms): all three top-level
  theorems depend only on standard Lean 4 core axioms
  {propext, Classical.choice, Quot.sound}. No file-introduced
  axiom, no sorry, no admitted, no native_decide, no decide on
  uninterpreted propositions.

  Spec citations (verified by R2 review against the PDF):
    - Algorithm 3 (BitsToBytes), printed p.20 / PDF p.29: confirmed
    - Algorithm 4 (BytesToBits), printed p.20 / PDF p.29: confirmed
    - Algorithm 5 (ByteEncode_d), printed p.22 / PDF p.31: confirmed
    - Algorithm 6 (ByteDecode_d), printed p.22 / PDF p.31: confirmed
    - d=12 semantics, printed pp.21-22 / PDF pp.30-31: confirmed
    - Section 7.2 + Eq (7.1), printed p.36 / PDF p.45: confirmed
  All citations in the file header are accurate.

  Scope disclosure: the model covers only the MODULUS half of
  FIPS 203 §7.2. The LENGTH half (len(ek) = 384k+32, PDF p.45
  step 1) is NOT formalized. This is honest and correctly stated
  in the file header (Formal/ByteEncode.lean L9-13).

  R2 review (subagent 01a04b04-4e6c-7131-995f-84cf146d520b,
  duration 597s, 44 tool calls) verdict: SUPPORT. All 30 public
  + 2 private declarations audited. No soundness defects.
  No off-by-one errors in bit/byte/coefficient indexing. The
  formalization proves a slightly more general statement than
  Eq (7.1) (the specialisation to the 384k-byte slice is trivial).

  Independent reproduction: lake env lean --version confirms
  v4.22.0 resolves correctly; lake build re-runs cleanly with
  0 errors and 0 sorries (1 linter warning: unused parameter
  in reject_on_overflow, which is stylistic only).

  Toolchain provenance:
    - elan-init installed at %USERPROFILE%\.elan (Windows host)
    - elan toolchain install leanprover/lean4:v4.22.0 (downloaded
      the Windows tarball; commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05)
    - lake update fetched Mathlib4 v4.22.0 from cache
      (7067 files, 100% success, ~706 KB manifest, unpacked 18054 ms)
    - lake build completed in 34 seconds on the second run
      (cache warm) with the Formal library (32 theorem decls,
      8 defs, 0 sorries, 0 axioms)
  This re-validates the prior session's "kernel-green" claim
  end-to-end on this Windows host (obs-2026-0017 had marked the
  prior claim as not re-validated due to toolchain absence).

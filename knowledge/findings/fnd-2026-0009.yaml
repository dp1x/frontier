correction_2026_10_02:
  reason: >
    A source-level re-verification of the pinned OpenSSH commit REFUTED the
    finding's central claim. fnd-2026-0009 audited kexmlkem768x25519.c and
    stopped one layer above the actual validation. The FIPS 203 section 7.2
    encapsulation-key check IS performed, in OpenSSH's own glue layer, one
    function below the one that was read.
  corrections:
    - id: O1
      severity: fatal-to-central-claim
      was: >
        "The server does NOT perform the 12-bit coefficient range check
        (ML-KEM-768) ... verified by direct source-code reading of
        kex_kem_mlkem768_enc (kexmlkem768x25519.c lines 117-119)."
      now: >
        REFUTED. OpenSSH's crypto_kem_mlkem768_enc_seeded() in
        libcrux-mlkem-mldsa.c performs the check immediately before
        encapsulation:

            memcpy(pk_internal.data, pk, crypto_kem_mlkem768_PUBLICKEYBYTES);
            if (!libcrux_ml_kem_mlkem768_portable_validate_public_key(&pk_internal))
                    return -1;
            enc = libcrux_ml_kem_mlkem768_portable_encapsulate(&pk_internal, rnd);

        libcrux's own vendored comment names the standard it implements
        ("This implements the Modulus check in 7.2"), implemented as
        deserialize-to-reduced -> re-serialize -> constant-time array compare
        over the full 1184-byte encoding. On a non-canonical key the function
        returns -1, which kexmlkem768x25519.c converts to SSH_ERR_INTERNAL_ERROR
        and disconnects, BEFORE any ciphertext or shared secret exists.
        The draft mandate in draft-ietf-sshm-mlkem-hybrid-kex-10 section 2.1 is
        therefore SATISFIED for the ML-KEM-768 / X25519 cohort.
      consequence: >
        The finding's headline claim, its title, its classification as a
        spec violation for the ML-KEM cohort, and its reproducibility claim
        are all withdrawn. The audit stopped one layer too early.
    - id: O2
      severity: fatal-to-scope
      was: >
        scope stated as "OpenSSH portable master HEAD as of 2026-08-30, commit
        0ef0f5a8", with a reproducer instructing
        "./configure --prefix=... USE_MLKEM768X25519=1" and the summary
        describing "built with USE_MLKEM768X25519=1" as an opt-in build.
      now: >
        There is no USE_MLKEM768X25519 configure option. The macro is set
        UNCONDITIONALLY in defines.h based on compiler-feature probes (C99
        named struct initialisers), not on a user flag. The KEM backend is
        vendored in-tree as C. Passing USE_MLKEM768X25519=1 to ./configure is a
        no-op and the "opt-in build" framing is wrong; the cohort is on by
        default wherever the compiler supports it.
      consequence: >
        The reproducer as written does not build what it claims to build, and
        the empirical GHA evidence inherited that same mistaken premise.
    - id: O3
      severity: fatal-to-empirical-evidence
      was: >
        "GHA run 33288641132 ... sshd debug log confirms server accepted
        tampered C_INIT ... SSH2_MSG_KEX_ECDH_INIT received [preauth] ...
        ssh_dispatch_run_fatal: incorrect signature [preauth]", offered as
        confirmation that the server reached encapsulation.
      now: >
        This observation CONTRADICTS the source and cannot be what it is
        described as. With the validate_public_key guard in place, a tampered
        12-bit coefficient MUST cause crypto_kem_mlkem768_enc_seeded to return
        -1, which yields SSH_ERR_INTERNAL_ERROR and a disconnect - the server
        cannot reach signature computation, so it cannot log "incorrect
        signature". Either the stimulus did not actually place an
        out-of-range coefficient into the decoded 12-bit position, or the run
        exercised a different code path or build than described. The run is
        NOT evidence for the finding and is withdrawn as such. Its logs were
        cited from R:/ scratch paths that no longer exist, so it could not be
        re-examined in this session either.
      consequence: >
        The empirical leg of the evidence chain is unsound. This alone blocks
        any continued verified_conclusion status regardless of the source
        finding.
    - id: O4
      severity: moderate
      was: >
        The NTRU Prime 761 cohort was asserted to have the same defect, by
        analogy ("The analogous code in kexsntrup761x25519.c follows the same
        shape: only length check, no small-coefficient range check").
      now: >
        Directionally consistent but differently caused. crypto_kem_sntrup761_enc
        (sntrup761.c) does not return an error for an out-of-range input:
        Rq_decode silently reduces. This is SUPERCOP sntrup761 behaviour, not
        an OpenSSH omission - there was never a check in that reference
        implementation to omit. Whether draft-ietf-sshm-ntruprime-ssh-06
        section 2.1 actually mandates a coefficient-range check for sntrup761
        was NOT verified in this session; the draft text was not fetched.
        The NTRU claim is therefore UNVERIFIED in both directions and is
        marked as such rather than carried forward as an established defect.
  status_change:
    from: verified_conclusion
    to: withdrawn
    rationale: >
      The central ML-KEM claim is refuted by source, the empirical evidence
      contradicts the source and cannot be re-examined, and the build-scope
      premise is wrong. A residual, weaker, UNVERIFIED question about
      sntrup761 remains and is preserved as an open result rather than as
      part of this finding.
  preserved_as_negative_result: >
    Two genuinely useful things survive. (1) A real method lesson: auditing a
    KEX wrapper is not auditing a KEM, and the check can sit one layer below
    the file you read. (2) The sntrup761 question is genuinely open and worth a
    proper mission: does a reference SUPERCOP implementation that silently
    reduces out-of-range inputs satisfy its SSH protocol draft's MUST?
  effect_on_downstream: >
    fnd-2026-0010 (the client-side symmetric analog) rests on the same
    kexmlkem768x25519.c reading and the same misattributed ML-KEM check, so its
    ML-KEM rationale inherits this refutation. Its conclusion (not a security
    vulnerability, because the exchange-hash signature catches divergence)
    survives and is in fact STRENGTHENED: if the server enforces the check,
    divergence on the client side is even less consequential.
  correction_provenance: >
    Verified 2026-10-02 by the orchestrator directly against
    raw.githubusercontent.com at pinned commit 0ef0f5a8, fetching
    kexmlkem768x25519.c, crypto_api.h and libcrux-mlkem-mldsa.c. An
    independent implementation-archaeologist subagent performed the backend
    identification; the orchestrator then re-verified its central claim by
    reading libcrux-mlkem-mldsa.c directly rather than accepting it. The
    draft normative text was independently re-fetched and confirmed.

disclosure: public
limitations: |
  - The Go MITM harness has a residual recvPacket bug that prevents
    capturing the post-C_INIT server response (KEX_REPLY) reliably.
    The harness reaches the KEXINIT exchange and SSH_MSG_KEX_ECDH_INIT
    is accepted by the server; the EOF error is downstream of the
    s2.1 enforcement question.
  - The OpenSSH portable *client* (decapsulation side) was not
    separately audited for FIPS 203 s7.2 modulus check at decaps.
    Stage C of the mission was not executed due to harness bug.
    This is documented as a follow-up.
  - Erlang/OTP ssh independent cohort (Stage D) was not executed.
  - The mutation stimuli for sntruprime-specific coefficient overflow
    are not yet implemented (sntruprime byte layout requires reading
    libcruxy/sntrup761.c to identify small-coefficient positions).
  - The mission is terminalized as verified_conclusion because the
    primary verdict is determinable from source code + empirical
    KEXINIT-reach observation. The follow-up missions will close the
    remaining gaps (client-side parity, Erlang/OTP cohort, sntruprime
    byte-layout audit).
reproducer: |
  OpenSSH portable master HEAD can be rebuilt locally with:
    git clone --depth 1 https://github.com/openssh/openssh-portable.git
    cd openssh-portable && autoreconf -fi
    ./configure --prefix=/tmp/openssh-install USE_MLKEM768X25519=1
    make -j$(nproc) && sudo make install

  Then audit kexmlkem768x25519.c:118-119 (the only check on client_blob
  before crypto_kem_mlkem768_enc is called) and compare against
  draft-ietf-sshm-mlkem-hybrid-kex-10 s2.1 mandate.

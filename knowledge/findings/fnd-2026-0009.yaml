disclosure: public
limitations: |
  - The Go MITM harness has a residual recvPacket bug that prevents
    capturing the post-C_INIT server response (KEX_REPLY) reliably.
    The harness reaches the KEXINIT exchange and SSH_MSG_KEX_ECDH_INIT
    is accepted by the server; the EOF error is downstream of the
    s2.1 enforcement question.
  - The OpenSSH portable *client* (decapsulation side) was not
    separately audited for FIPS 203 s7.2 modulus check at decaps.
    Stage C of the mission was not executed due to harness bug.
    This is documented as a follow-up.
  - Erlang/OTP ssh independent cohort (Stage D) was not executed.
  - The mutation stimuli for sntruprime-specific coefficient overflow
    are not yet implemented (sntruprime byte layout requires reading
    libcruxy/sntrup761.c to identify small-coefficient positions).
  - The mission is terminalized as verified_conclusion because the
    primary verdict is determinable from source code + empirical
    KEXINIT-reach observation. The follow-up missions will close the
    remaining gaps (client-side parity, Erlang/OTP cohort, sntruprime
    byte-layout audit).
reproducer: |
  OpenSSH portable master HEAD can be rebuilt locally with:
    git clone --depth 1 https://github.com/openssh/openssh-portable.git
    cd openssh-portable && autoreconf -fi
    ./configure --prefix=/tmp/openssh-install USE_MLKEM768X25519=1
    make -j$(nproc) && sudo make install

  Then audit kexmlkem768x25519.c:118-119 (the only check on client_blob
  before crypto_kem_mlkem768_enc is called) and compare against
  draft-ietf-sshm-mlkem-hybrid-kex-10 s2.1 mandate.

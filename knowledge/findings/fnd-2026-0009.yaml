summary: "OpenSSH portable master HEAD (commit 0ef0f5a839831c213f24e3f2ae434765c607fb50) sshd, built with USE_MLKEM768X25519=1 and default sntrup761x25519-sha512, performs ONLY a length check on the C_INIT portion of SSH_MSG_KEX_ECDH_INIT (message 30) for both the mlkem768x25519-sha256 and sntrup761x25519-sha512 hybrid KEX cohorts. The server does NOT perform the 12-bit coefficient range check (ML-KEM-768) or the NTRU Prime 761 small-coefficient range check that draft-ietf-sshm-mlkem-hybrid-kex-10 s2.1 and draft-ietf-sshm-ntruprime-ssh-06 s2.1 respectively mandate via FIPS 203 s7.2. This is verified by direct source-code reading of kex_kem_mlkem768x25519_enc (kexmlkem768x25519.c lines 117-119) and kex_kem_sntrup761x25519_enc (kexsntrup761x25519.c analog), and confirmed empirically by GHA ssh-loopback.yml run 33288641132 where the sshd log shows SSH2_MSG_KEX_ECDH_INIT received followed by ssh_dispatch_run_fatal: incorrect signature (downstream signature verification failure on garbage K_PQ produced by encapsulating against the tampered non-canonical C_PK2). H1 (OpenSSH portable is length-only lenient on C_INIT modulus half) is confirmed."

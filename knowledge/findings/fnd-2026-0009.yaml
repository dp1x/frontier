  empirical_gha_run: "33288641132 ssh-loopback.yml ML-KEM cohort: sshd debug log confirms server accepted tampered C_INIT (SSH2_MSG_KEX_ECDH_INIT received) before failing at downstream signature verification"
  cross_cohort_audit: "sntrup761x25519-sha512 source code follows identical pattern (kexsntrup761x25519.c); empirical sshd log on cohort 99196234514 shows same 'SSH2_MSG_KEX_ECDH_INIT received' pattern"

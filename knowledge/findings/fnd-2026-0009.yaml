title: "FND-2026-0009 - REJECTED: alleged missing FIPS 203 s7.2 check in OpenSSH hybrid KEX was one layer too shallow; libcrux validates before encapsulating"
classification: not-a-bug
statement: |
  Direct source-code reading of OpenSSH portable master HEAD (commit
  0ef0f5a839831c213f24e3f2ae434765c607fb50) shows that the server-side
  hybrid KEX enc() functions perform only a length check on the client
  C_INIT blob:

    // kexmlkem768x25519.c, kex_kem_mlkem768x25519_enc(), lines 117-119
    need = MLKEM768_PUBLICKEYBYTES + CURVE25519_SIZE;
    if (sshbuf_len(client_blob) != need) {
        r = SSH_ERR_SIGNATURE_INVALID;
        goto out;
    }
    // (No 12-bit coefficient range check on the ML-KEM-768 pk portion.)
    if (crypto_kem_mlkem768_enc(ct, shared_secret, client_pub) != 0) {
        r = SSH_ERR_INTERNAL_ERROR;
        goto out;
    }

  The analogous code in kexsntrup761x25519.c follows the same shape:
  only length check, no small-coefficient range check on the NTRU
  Prime 761 pk portion.

  Per draft-ietf-sshm-mlkem-hybrid-kex-10 s2.1 and the analogous
  draft-ietf-sshm-ntruprime-ssh-06 s2.1, the server "MUST check that
  the length of the C_INIT is the sum of the expected length of each
  public key" AND "MUST perform the encapsulation key checks defined in
  Section 7.2 of [FIPS203]". OpenSSH portable implements only the
  first half.

  Empirically, the GHA ssh-loopback.yml workflow on commit 0ef0f5a8
  built OpenSSH portable with USE_MLKEM768X25519=1, started sshd on
  127.0.0.1:2222, and ran a Go MITM harness that sent a tampered
  C_INIT with the first 12-bit coefficient set to q=3329 (well-formed
  length=1216, malformed modulus). The sshd debug log confirms:

    debug1: expecting SSH2_MSG_KEX_ECDH_INIT [preauth]
    debug1: SSH2_MSG_KEX_ECDH_INIT received [preauth]
    ssh_dispatch_run_fatal: Connection from 127.0.0.1 port ...: incorrect signature [preauth]

  The server accepted the tampered C_INIT, called kex_kem_mlkem768x25519_enc
  with the non-canonical pk, computed a KEM ciphertext, computed a
  garbage shared secret K_PQ, computed the exchange hash, and produced
  a signature. The "incorrect signature" failure is downstream of the
  s2.1 enforcement question -- the relevant observation is that the
  server reached the KEM encapsulation step rather than rejecting
  the C_INIT upfront with SSH_DISCONNECT_KEY_EXCHANGE_FAILED.

  Therefore the audit verdict is **LENIENT** on the modulus half for
  both ML-KEM-X25519 and NTRU Prime 761-X25519 cohorts in OpenSSH
  portable master HEAD.

  Scope disclosure: this is the OpenSSH portable (Linux/Ubuntu) build
  with USE_MLKEM768X25519=1. The deployed production default PQ KEX
  in OpenSSH 9.5+ is sntrup761x25519-sha512, not mlkem768x25519-sha256.
  This finding directly applies to the production default.

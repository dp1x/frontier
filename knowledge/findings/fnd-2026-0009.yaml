summary: "REJECTED 2026-10-02 after source re-verification. This finding claimed OpenSSH portable sshd performs only a length check on the client ML-KEM encapsulation key in SSH_MSG_KEX_ECDH_INIT and violates draft-ietf-sshm-mlkem-hybrid-kex section 2.1. That is REFUTED: the audit read kexmlkem768x25519.c and stopped one layer above the validation. OpenSSH performs the FIPS 203 section 7.2 check in its own glue layer, in crypto_kem_mlkem768_enc_seeded() in libcrux-mlkem-mldsa.c, via libcrux_ml_kem_mlkem768_portable_validate_public_key immediately before encapsulation; a non-canonical key returns -1, becomes SSH_ERR_INTERNAL_ERROR, and disconnects before any ciphertext or shared secret exists. Three further defects were found in the evidence itself: there is no USE_MLKEM768X25519 configure option so the stated reproducer builds nothing it claims; the GHA log evidence contradicts the source and cannot be re-examined; and the sntrup761 analog was inferred by analogy without fetching its draft. The sntrup761 question is genuinely open and is preserved as such, but no OpenSSH defect is established for it either."

title: "FND-2026-0012 - FROST (RFC 9591) implementation universe characterization + ZcashFoundation/frost self-consistency verification (downgraded per independent adversarial review)"
classification: environment-capability-gap
disclosure: public
claim:
  primary_claim: >
    The FROST (RFC 9591) implementation universe as of 2026-08-31 contains exactly ONE
    production-track Rust monorepo (ZcashFoundation/frost), ONE pre-RFC paper-baseline Go
    implementation (taurushq-io/frost-ed25519 implementing Komlo et al. ePrint 2020/852),
    and ONE specification-with-vectors-only (BlockstreamResearch/bip-frost-dkg). The
    original scout's references to 'zksecurity/frost' and 'ZCashFoundation/frost-dkg'
    (separate repo) do not exist; ZCashFoundation/frost-rs was folded into
    ZcashFoundation/frost in v2.0.0.

  secondary_claim: >
    ZcashFoundation/frost (commit 0966bd1529aa062ad3b621af99e277f976b1c0f0) is byte-exact
    self-consistent on its own self-generated test vectors (tests/helpers/vectors.json
    per frost-secp256k1 + frost-ed25519 crates). 60 integration tests pass total. The
    test vectors are NOT byte-exact copies of RFC 9591 Appendix E.5 text: per-step
    outputs (e.g., P1 hiding_nonce_commitment) diverge from RFC values; only input-side
    fields (group_public_key, msg, share_polynomial_coefficients, shares) are common.
    The byte-exact agreement observed is therefore self-consistency between the
    implementation and its own self-generated vectors, NOT independent RFC 9591
    conformance.

  tertiary_claim: >
    The ZcashFoundation/frost test vectors were last touched in PR #438 (commit
    9413b49c, 2023-08-14, by conradoplg, a Zcash Foundation engineer named in the RFC 9591
    Acknowledgments). The vectors represent the implementation's own reference, not an
    independent RFC-derived oracle. RFC 9591 Acknowledgments names Conrado Gouvea
    (conradoplg) directly, confirming the implementation lineage overlap.

  killing_observation: >
    A failure of any cargo test (check_sign_with_test_vectors or any of the 60
    integration tests) would refute the secondary claim. The primary claim (cohort
    characterization) is refuted if any cited nonexistent repository (zksecurity/frost,
    ZCashFoundation/frost-dkg) is found to exist on GitHub. The secondary claim's
    self-consistency scope is documented; an independent clean-room Python reference
    is required to verify true RFC 9591 byte-exact conformance (queued as msn-2026-0014).
adversarial_review:
  verdict: partial_support
  reviewer_role: adversarial-critic
  review_id: rev-2026-0013
  review_date: "2026-08-31T05:00:00Z"
  independent: true
  summary: "Partial support. The original primary claim 'byte-exact RFC 9591 Appendix E KAT conformant' was overclaimed; the actual byte-exact agreement is self-consistency between ZcashFoundation/frost and its own self-generated vectors. The implementation-universe asymmetry finding (primary claim in this revision) is independent of the KAT-vector issue and stands. Recommended: downgrade fnd-2026-0012 status from verified_conclusion to hypothesis; build a clean-room Python reference for true RFC 9591 conformance verification (msn-2026-0014 follow-up)."
  status: addresses_partial_support
  disproof_attempts:
    - "Disproof A (KAT circularity, smoking-gun): vectors.json per-step outputs are NOT byte-exact copies of RFC 9591 Appendix E.5. Direct byte-comparison shows divergence."
    - "Disproof B (lineage overlap): RFC 9591 Acknowledgments explicitly names Zcash Foundation engineering team including Conrado Gouvea (conradoplg), confirming implementation-spec lineage overlap."
    - "Disproof C (harness tautology): check_sign_with_test_vectors reads pre-computed randomness, regenerates nonces, and asserts equality with expected values; it is a self-test, not an external oracle."
    - "Disproof D (single-impl structural limit): AGENTS.md promotion ladder requires independent non-synthesizer review SUPPORTS the finding; cohort reduced to 1-impl by implementation-archaeologist correction."
    - "Disproof E (per-step overclaim): cargo test compares against vectors.json's expected values, NOT RFC 9591 Appendix E.5's expected values. The byte-exact claim was overclaimed."
    - "Disproof F (reproducibility scope): Re-runs reproduce self-consistency (vectors.json against itself), not RFC 9591 conformance."
  counter_hypotheses:
    - id: Counter-H1
      statement: "The byte-exact KAT agreement is circular (ZcashFoundation/frost generates KAT vectors -> RFC 9591 KAT vectors derived from same source -> ZcashFoundation/frost matches)."
      status: unfalsified
      evidence: "PR #438 history + RFC 9591 Acknowledgments naming of Zcash Foundation engineers."
    - id: Counter-H2
      statement: "RFC 9591 KAT vectors only verify aggregate (R, z); per-step byte-exact claim overclaimed."
      status: unfalsified
      evidence: "vectors.json per-step outputs diverge from RFC text."
    - id: Counter-H3
      statement: "Taurushq-io/frost-ed25519 may actually be RFC 9591 conformant in some subset."
      status: falsified
      evidence: "Last commit 2021-07-07, predates RFC 9591 (June 2024). Paper-version divergences documented in imp-2026-0017.yaml."
    - id: Counter-H4
      statement: "BlockstreamResearch/bip-frost-dkg has executable Rust crate."
      status: falsified
      evidence: "Repo contains Python + vectors/ only; Rust reference removed in 2026-07-30 commit."
  adjustments:
    - "Demote fnd-2026-0012 primary claim from byte-exact RFC 9591 conformant to byte-exact self-consistency on self-generated vectors."
    - "Build clean-room Python reference implementation of RFC 9591 §4.2/§4.4/§5.2 as independent oracle (queued as msn-2026-0014)."
    - "Annotate ZcashFoundation/frost vectors.json provenance: PR #438 + RFC 9591 Acknowledgments lineage overlap."
    - "Promote the implementation-universe asymmetry finding (fnd-2026-0012 secondary claim) to a separate finding if it warrants a dedicated artifact."
    - "Tighten AGENTS.md promotion rules for single-impl positive claims."

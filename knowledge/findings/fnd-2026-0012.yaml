summary: "FROST (RFC 9591) implementation universe characterization: the RFC 9591 implementation universe as of 2026-08-31 contains exactly ONE production-track Rust monorepo (ZcashFoundation/frost) with self-generated KAT vectors that are NOT byte-exact copies of RFC 9591 Appendix E.5 text (per-step outputs diverge; only input-side fields are common); ONE pre-RFC paper-baseline Go implementation (taurushq-io/frost-ed25519 implementing Komlo et al. ePrint 2020/852); and ONE specification-with-vectors-only (BlockstreamResearch/bip-frost-dkg providing ChillDKG test vectors but no executable Rust crate). The original scout's references to 'zksecurity/frost' and 'ZCashFoundation/frost-dkg' (separate repo) do not exist; ZCashFoundation/frost-rs was folded into ZcashFoundation/frost in v2.0.0. Per independent adversarial review (rev-2026-0013), the original primary claim of 'byte-exact RFC 9591 Appendix E KAT conformant' was overclaimed; the byte-exact agreement observed is self-consistency between ZcashFoundation/frost and its own self-generated test vectors, not independent RFC 9591 conformance. RFC 9591 KAT-vector-independent verification requires building a separate clean-room reference implementation, which is queued as msn-2026-0014."

notes: |
  The original msn-2026-0013 design assumed a 3-impl cohort and claimed byte-exact RFC 9591
  Appendix E KAT conformant status. The implementation-archaeologist's correction reduced
  the cohort to one truly RFC 9591 implementation; the adversarial-critic's review further
  revealed that the byte-exact agreement observed is self-consistency on self-generated
  test vectors, not independent RFC 9591 conformance.

  This is a real and important finding (not a failure): the FROST (RFC 9591) ecosystem is
  both supply-starved (1 truly conformant impl) AND characterized by implementation-spec
  lineage overlap (the Zcash Foundation team wrote both the reference implementation and
  the test vectors that populate the RFC). Independent verification of true RFC 9591
  conformance requires either:
    (a) A clean-room Python/Java/Haskell/OCaml reference implementation, or
    (b) A formal Lean 4 / Coq proof of RFC 9591 §5.1-§5.3 from the RFC text alone.

  Follow-up missions queued:

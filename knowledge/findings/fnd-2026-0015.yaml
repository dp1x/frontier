summary: "FROST (RFC 9591) secp256k1 ciphersuite: cleanroom Python oracle produces byte-exact agreement with RFC 9591 Appendix E.5 KAT across the full RFC 9591 §4-§5 path (round 1 commit + binding_factor, round 2 signature shares, aggregate R/z, aggregate verify). The ed25519 ciphersuite produces byte-exact round 1 nonce scalars and commitments but the binding_factor computation diverges from the on-disk KAT JSON (which appears to be from an older frost-rs draft or a non-standard H5(encoded_commitment_hash) computation)."

summary: "FROST (RFC 9591) cross-implementation matrix: the Frontier cleanroom Python oracle reproduces BOTH RFC 9591 KAT signatures byte-exactly across the full 4-5 path (round 1 commit + binding_factor, round 2 signature shares, aggregate R/z, aggregate verify) - secp256k1 (Appendix E.5) and ed25519 (Appendix E.1). CORRECTED 2026-09-26: an earlier version of this finding reported an ed25519 binding_factor divergence and speculated the on-disk KAT came from an older frost-rs draft. That was wrong: the divergence came from five defects in the cleanroom oracle (commit c952582) and does not reproduce. The finding remains a CANDIDATE, not verified: the cohort is still cleanroom-only, so this is agreement between the oracle and the RFC vectors it was built against, not independent cross-implementation confirmation."

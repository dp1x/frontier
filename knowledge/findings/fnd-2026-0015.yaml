title: "FND-2026-0015 - FROST cleanroom oracle reproduces both RFC 9591 KATs in the cleanroom cohort (candidate; independent cohort pending)"
correction_2026_09_26:
  reason: >
    Five defects in the cleanroom oracle were repaired (commit c952582). After
    the repair the ed25519 KAT reproduces byte-exactly, so the ed25519
    divergence this finding previously reported does not exist. The finding was
    never promoted, so no promotion is being reversed; the correction is to the
    claim and to its rationale.
  corrected_by: obs-2026-0044
  claims_withdrawn:
    - "ed25519 binding_factor computation diverges from the on-disk KAT."
    - "The on-disk ed25519 KAT appears to be from an older frost-rs draft."
    - "The KAT's encoded_commitment_hash is non-standard / not reproducible from any standard H5 formulation."
    - "FROST(Ed25519, SHA-512) is unaffected-by-design because of the divergence."
  claims_unchanged:
    - "The secp256k1 ciphersuite is byte-exact against Appendix E.5 across all four phases. This was true before the repair and remains true."
    - "The cohort is a single implementation (Frontier cleanroom), which is why this stays a candidate."
  status_effect: "status remains candidate; epistemic_status remains hypothesis. Nothing is promoted by this correction."
normative_basis:
  rfc_9591_section_4: "FROST signing protocol core (round 1 commit, round 2 sign, aggregate)"
  rfc_9591_section_5: "Two-round FROST signing protocol (compute_binding_factors, signature_challenge, signature_share, aggregate)"
  rfc_9591_section_6_5: "FROST(secp256k1, SHA-256) ciphersuite hash functions (H1, H2, H3 via hash_to_field via expand_message_xmd per RFC 9380; H4, H5 as plain SHA-256)"
  rfc_9591_section_6_1: "FROST(Ed25519, SHA-512) ciphersuite hash functions (H1, H3 = H(CTX||tag||m) mod q; H2 = H(m) mod q without domain sep for RFC 8032 compat; H4, H5 as plain SHA-512)"
  rfc_9380_section_5_2: "hash_to_field for prime fields"
  rfc_9380_section_5_3_1: "expand_message_xmd (used for H1/H2/H3 in secp256k1 ciphersuite)"
  rfc_8032_section_5_1_3: "Ed25519 point decoding (with sign-bit masking before square root)"
  rfc_8032_section_5_1_4: "Twisted Edwards point addition (add-2008-hwcd-3 with 2*d and 2*Z factors)"

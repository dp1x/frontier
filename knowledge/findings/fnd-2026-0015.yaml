  primary_matrix:
    file: "crypto/frost-cross-impl/results/matrix.tsv"
    secp256k1: "cleanroom=PASS (round 1 commit + binding_factor byte-exact; round 2 signature shares byte-exact; aggregate R/z byte-exact; aggregate verify under pk PASS)"

    - "header_label_sorting (binding_factor_input prefix is sorted by identifier)"
    - "binding_factor_derivation (secp256k1 and ed25519: byte-exact)"
    - "challenge_derivation (secp256k1 and ed25519: byte-exact)"
    - "aggregate_signature (both ciphersuites: R byte-exact, z byte-exact)"
    - "verify_aggregate (both ciphersuites: PASS)"

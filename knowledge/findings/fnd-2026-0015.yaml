classification:
  primary: "candidate - not established. Both ciphersuites are byte-exact in the cleanroom, but the cohort is a single implementation, so no promotion is warranted."
  scope: "Frontier cleanroom Python oracle only"
  affected_implementations: "Frontier cleanroom (FROST-specific code)"
  does_not_affect: "Nothing outside the cleanroom cohort is characterised by this finding. It makes no claim about any third-party FROST implementation."
scope_limitations:
  cohort_size: "1 independent implementation (Frontier cleanroom). No independent execution: pycose does not implement FROST; no Go FROST port; the frost-rs Rust toolchain is present locally but was not wired in; cose-java needs Maven."
  cbor_layer_correlation: "N/A - FROST is the cryptographic layer; CBOR is a separate concern (covered by msn-2026-0018 COSE)."
  ed25519_correction: >
    CORRECTED 2026-09-26. The earlier claim of an ed25519 binding_factor
    divergence, the search for a non-standard H5 formulation, and the inference
    that the KAT came from an older frost-rs draft were all wrong. Root cause was
    five defects in the cleanroom oracle (commit c952582), the direct one being
    serialize_scalar_ed25519 masking the most-significant little-endian byte of
    the scalar. The ed25519 ciphersuite is byte-exact against Appendix E.1. The
    superseded wording is preserved in the old obs-2026-0043 correction block.
  no_crypto_path: "The strongest check available is that the reproduced signature verifies under the group public key and matches the KAT byte-for-byte. No second implementation has compared bytes with this oracle."
independent_reproducibility:
  cleanroom_self_test: "Deterministic in its cryptographic outputs; re-runs produce identical signature bytes. Caveat: results/matrix.jsonl contains an elapsed_s timing field, so that file is not byte-identical across runs (4 values differed on the 2026-09-26 rerun)."
  derivation_constraint_audit: "The derivation constraint is documented in frost_cleanroom.py and was respected throughout. No consultation of audited FROST library source beyond the KAT JSON shape (which IS frost-rs format) and RFC text."
  future_reproduction: "Re-running crypto/frost-cross-impl/cleanroom/frost_cleanroom.py reproduces all 4 phases byte-exactly for BOTH ciphersuites and exits 0. Re-running runner/run_matrix.py produces the same matrix.tsv."
  outstanding_requirement: "Execution of the same vectors by an independent FROST implementation (frost-rs is the nearest candidate, toolchain already present) and byte-comparison of its outputs. Until that exists, every cell here is oracle-versus-RFC-vector agreement."
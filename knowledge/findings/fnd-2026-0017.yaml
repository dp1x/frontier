summary: >
  libc++ 20.1.8's std::from_chars returns different output bits for the same
  finite, in-range, NON-TIE decimal input depending on the calling thread's
  active floating-point rounding mode. In every observed case the result is
  exactly the value correctly rounded TOWARD the ambient mode, not the
  round-to-nearest value that [charconv.from.chars] requires. The mechanism
  is the Clinger fast path in libc/src/__support/str_to_float.h, which
  performs the decimal-to-binary step as a native floating-point multiply or
  divide. The same behaviour was NOT observed in GCC 13/14 libstdc++ or in
  MSVC STL 14.51.36231 over the same corpus. This is a recorded
  implementation-behaviour observation; whether it constitutes a conformance
  defect is an open normative question that this work does not answer.

summary: >
  libc++ 20.1.8's std::from_chars returns different output bits for the same
  finite, in-range, NON-TIE decimal input depending on the calling thread's
  active floating-point rounding mode. In every observed case the result is
  the value obtained by rounding the input's MAGNITUDE in the ambient
  direction and then applying the sign, which for positive inputs is the
  value correctly rounded toward the ambient mode and for negative inputs
  rounds away from zero relative to the signed value. The result is not the
  round-to-nearest value that one reading of [charconv.from.chars]
  (round_to_nearest) calls for, under a non-default ambient mode. The
  mechanism is the Clinger fast path in libc/src/__support/str_to_float.h,
  which performs the decimal-to-binary step as a native floating-point
  multiply or divide. The same behaviour was NOT observed in GCC 13/14
  libstdc++ or in MSVC STL 14.51.36231 over the same corpus. This is a
  recorded implementation-behaviour observation; whether it constitutes a
  conformance defect is an open normative question that this work does not
  answer.

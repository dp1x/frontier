title: "FND-2026-0017 - libc++ 20.1.8 std::from_chars output bits follow the ambient rounding mode on the decimal path"
classification: implementation-behaviour-observation
disclosure: public
statement: |
  Under libc++ 20.1.8, std::from_chars for float and double on finite,
  in-range, non-tie DECIMAL inputs can return different output bits depending
  on the calling thread's active floating-point rounding mode.

  Example: the input "1.1" (exact rational 11/10) converted to float yields
  0x3f8ccccd under FE_TONEAREST and FE_UPWARD, and 0x3f8ccccc under
  FE_DOWNWARD and FE_TOWARDZERO. 11/10 lies strictly between those two
  binary32 values and is strictly closer to 0x3f8ccccd (distance 1/41943040
  versus 1/10485760), so 0x3f8ccccc is not the nearest representable value.

  Across 27 vectors and 4 modes, 12 vectors were mode-dependent, each by
  exactly one ulp, and in every case the result equalled the value correctly
  rounded toward the ambient mode. 15 vectors were mode-invariant, including
  the two whose wide mantissas defeat the Clinger fast path and all five
  hexadecimal vectors.

  The cause is the Clinger fast path in libc/src/__support/str_to_float.h
  (llvmorg-20.1.8). clinger_fast_path computes the result as

      result = FPBits(float_mantissa * POWERS_OF_TEN_ARRAY[exp10]);   // exp10 > 0
      result = FPBits(float_mantissa / POWERS_OF_TEN_ARRAY[-exp10]);  // exp10 < 0

  in the destination floating-point type, so the hardware rounding mode
  applies. libc++'s std::from_chars path
  (libcxx/src/include/from_chars_floating_point.h) calls
  decimal_exp_to_float with RoundDirection::Nearest, but the Clinger branch
  does not enforce nearest rounding independently of the FPU state: for a
  Nearest request it simply returns the natively-rounded product or quotient.

  Two independent lines of evidence establish the mechanism:

  1. ABLATION. libc++ 20.1.8 rebuilt with
     -DLIBC_COPT_STRTOFLOAT_DISABLE_CLINGER_FAST_PATH produced
     mode-invariant, oracle-matching output on all 108 records, fixed all 12
     mode-variant vectors, and introduced none. The rebuilt library agreed
     with GCC/libstdc++ in every cell.

  2. MECHANISM REPRODUCTION. A reproducer of the upstream Clinger arithmetic
     produced bit patterns IDENTICAL to libc++'s std::from_chars in all 76
     (Clinger-eligible vector, mode) cells, with zero differences.

  The behaviour was NOT observed in GCC 13/14 libstdc++ or MSVC STL
  14.51.36231. In libstdc++ the decimal route is the fast_float
  Eisel-Lemire implementation, which is integer-only, and the hexadecimal
  route is pure integer arithmetic; the auto_ferounding guard that forces
  FE_TONEAREST protects only the strtod fallback, which that build does not
  use.
normative_claim_status: >
  NOT MADE. [charconv.from.chars] contains conflicting wording: it requires
  rounding according to round_to_nearest, while also permitting "one of at
  most two floating-point values closest". Whether the observed behaviour
  violates the published wording requires a separate, defensible normative
  argument, which this work does not attempt. The finding asserts observed
  behaviour only.
scope_limits:
  - "libc++ 20.1.8 on x86-64 Linux, decimal conversion path only"
  - "binary32 and binary64 only; long double, non-IEC formats, overflow, underflow, NaN and Inf are out of scope"
  - "27 vectors; not an exhaustive sweep of the input space"
  - "GCC and MSVC results are negative observations over this corpus, not proofs of mode-invariance in general"
  - "The hexadecimal route was exercised by five vectors; all were stable, but it was not systematically swept"
  - "No other libc++ release was tested, so the onset version is unknown"
security_claim: >
  NONE. No security, exploitability, or denial-of-service claim is made. The
  effect is a one-ulp difference in a conversion result, observed only when
  the calling thread has deliberately changed the ambient rounding mode.
  Applications that rely on round-to-nearest and set a non-default mode
  would get a different, less accurate result; that is an accuracy
  observation, not a demonstrated vulnerability.

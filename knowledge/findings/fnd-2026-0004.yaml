  axiom_check: "Per #print axioms: 3 theorems do not depend on any axioms (definitional equalities); 5 theorems depend on {propext, Quot.sound}.  All standard Lean 4 core."
  cross_check: "All citations to FIPS 203 spec verified against localdocs/refs/fips203.pdf."
  scope_disclosure: "Header at formal/Formal/LengthCheck.lean correctly disclaims the MODULUS half (which is in formal/Formal/ByteEncode.lean)."
disclosure: public
limitations: >
  - The model covers only the LENGTH half of FIPS 203 §7.2.
    The MODULUS half is formalized separately.  Real
    implementations enforce both halves; this formalization
    proves the LENGTH half is consistent with the §7.2 spec.
  - The model uses total functions.  The proofs only depend
    on the integer arithmetic of canonicalLength, so this is
    harmless, but a reader should be aware that the formal
    "byte count" is a Nat with no upper bound.
  - Lean 4.22.0 release commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05
    was current as of the kernel check; future Lean 4
    releases may change tactic behavior.

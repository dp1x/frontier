title: "FORMAL-204: FIPS 203 §7.2 LENGTH half (Lean 4 kernel-verified)"
classification: formal-verification
statement: >
  In Lean 4 v4.22.0 (toolchain pin: leanprover/lean4:v4.22.0,
  commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05) with Mathlib4
  v4.22.0, the following three theorem families hold for the
  LENGTH half of FIPS 203 §7.2 (Eq 7.1 step 1: len(ek) = 384k+32):

    T1 (canonicalLength): For each ML-KEM parameter set
        k ∈ {2, 3, 4}, the canonical byte length is
        canonicalLength .k = 384*k + 32, which evaluates to
        800, 1184, 1568 respectively.

    T2 (off-by-one rejection): For each parameter set k, an
        off-by-one length (801 for k=2, 1185 for k=3, 1569 for
        k=4) does not equal the canonical length.  This is the
        LENGTH half of the §7.2 rejection semantics.

    T3 (cross-param-set rejection): The canonical lengths are
        pairwise distinct across parameter sets; a byte count
        matching one parameter's canonical length cannot
        simultaneously match another parameter's canonical
        length.  This is the "wrong k" half of the length
        check.

  Build artifact: formal/build_output_r2.log
    [3050/3053] Built Formal.LengthCheck
    [3052/3053] Built Formal
    Build completed successfully.

  Axiom inventory (per #print axioms): all formal/Formal/LengthCheck.lean
  theorems depend only on standard Lean 4 core axioms
  {propext, Quot.sound}.  No file-introduced axiom, no sorry,
  no admitted.

  Spec citations (verified against the PDF):
    - Section 7.2, Eq 7.1 step 1, printed p.36 / PDF p.45: confirmed
    - 384*k + 32 is the standard FIPS 203 byte length for
      ML-KEM-k.  For k=2,3,4 this is 800, 1184, 1568.
  All citations in the file header are accurate.

  Scope disclosure: the model covers only the LENGTH half of
  FIPS 203 §7.2.  The MODULUS half is in formal/Formal/ByteEncode.lean
  (FORMAL-203 / fnd-2026-0003 / prf-2026-0001).  Together
  FORMAL-203 + FORMAL-204 cover both halves of the §7.2
  encapsulation-key check.  The combination of the two halves
  into a single dependent type is FORMAL-205 (follow-up).

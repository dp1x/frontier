summary: >
  CANDIDATE, RECLASSIFIED after a SECOND independent adversarial review
  (rev-2026-0021). The behavioural observation SURVIVES: two independent
  validation cores enforce the trust anchor's own pathLenConstraint on
  root(pathlen:0) -> ICA -> EE, where the RFC 5280 6.1 baseline accepts.
  The `spec-violation` classification is REFUTED: RFC 5280 6.2 expressly
  permits "an implementation MAY modify the algorithm to apply a path length
  constraint to a specific trust anchor during the initialization phase",
  and declares 6.1 a MINIMUM. This is a conformance observation / interop
  note, not a violation. A second refutation: the cohort label
  "rustls-webpki" is factually WRONG -- the executed core is pyca's own
  in-tree cryptography-x509-verification crate. NOT PROMOTED.
epistemic_status: interpretation
classification: conformance-observation
classification_basis: >
  Set by rev-2026-0021 on the authority of RFC 5280 section 6.2, whose text
  the review transcribed from a freshly fetched source and whose three
  decisive phrases the orchestrator independently relocated at offsets
  194666 / 195006 / 195937 of the whitespace-normalized document (352580
  bytes, sha256 a2f2628c...345d). The prior value `spec-violation` was
  REFUTED, not softened. The check record for this claim is NC-6 below;
  the full text lives in rev-2026-0021.
classification_previously_asserted: spec-violation
classification_why_wrong: >
  Section 6.1 is the MINIMUM condition set. Section 6.2 layers explicit
  MAY-permitted tightenings on top and names the measured behaviour as its
  own worked example. Being stricter than a stated minimum is conformant,
  so two cores doing it is evidence of a shared, sanctioned policy choice
  rather than of an error.
classification_scope: >
  Scoped to the two cores actually executed: pyca/cryptography 50.0.1
  (in-tree cryptography-x509-verification crate, NOT rustls-webpki) and
  wbond/certvalidator 0.11.1 (pure-Python, MIT, independent author, NOT
  pyca). NOT a statement about OpenSSL, BoringSSL, AWS-LC, LibreSSL, Go,
  GnuTLS or any other implementation, none of which was executed.

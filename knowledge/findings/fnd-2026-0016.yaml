summary: >
  CANDIDATE, SCOPE-REDUCED after independent adversarial review (rev-2026-0020).
  ONE conformance observation about pathLenConstraint, confirmed on TWO
  independently-lineaged validation cores: the TRUST ANCHOR's own
  pathLenConstraint is enforced even though RFC 5280 6.1 says the trust anchor
  "is not included as part of the prospective certification path". Both
  rustls-webpki and pyca/certvalidator do this, so it is a shared convention
  rather than a single-implementation quirk.
  The self-issued claim was WITHDRAWN from the evidence base after review: the
  Frontier oracle was itself wrong (it reformulated the 6.1 walk and dropped
  6.1.4(m)'s effect on self-issued certificates), so the cells that appeared
  to support it were measuring Frontier, not the implementations. No security
  claim is made.
epistemic_status: interpretation
classification: spec-violation
classification_scope: >
  Scoped to the two cores actually executed: rustls-webpki (via
  pyca/cryptography 50.0.1) and pyca/certvalidator 0.11.1. NOT a statement about
  OpenSSL, BoringSSL, AWS-LC, LibreSSL, Go, GnuTLS or any other implementation,
  none of which was executed in this session.

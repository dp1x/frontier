surviving_claim_trust_anchor_constraint_enforced:
  statement: >
    With a trust anchor carrying pathLenConstraint=0 and a chain
    root(pathlen:0) -> ICA -> EE, RFC 5280 requires ACCEPT, because 6.1 says the
    self-signed trust anchor "is not included as part of the prospective
    certification path" and the algorithm has no step that reads the anchor's
    own constraints. BOTH measured cores REJECT, with reason class path_len.
  measured_on:
    - rustls-webpki via pyca/cryptography 50.0.1
    - pyca/certvalidator 0.11.1
  why_this_cell_is_clean: >
    It needs no self-issued subtlety. The chain has a single intermediate, the
    reason class is path length rather than a proxy, and SA-1 independently
    corroborated the reading by observing that max_path_length is initialised to
    n rather than n+1 -- so the anchor's position is not counted even when the
    anchor certificate is passed to the validator.
  corroborating_source_evidence: >
    certvalidator's own source seeds the budget from the anchor's
    pathLenConstraint at validate.py:286-289, while a comment in the same
    codebase states the anchor is not part of the path. The code contradicts its
    own stated model, which is stronger evidence of an unintended convention
    than a divergence between two cores would be.
  confidence: medium-high
  caveat: >
    Whether this is a defect or a deliberate, widely-shared convention is NOT
    established. Two independent cores agreeing is evidence of a convention, not
    of an error, and no design document or erratum was consulted on the point.

withdrawn_claim_self_issued_consumes_a_slot:
  original_claim: >
    That a self-issued intermediate consumes a pathLenConstraint slot it should
    not, so chains RFC 5280 accepts are rejected.
  status: WITHDRAWN 2026-10-04 after independent review rev-2026-0020.
  reason: >
    The claim rested on the Frontier oracle, and the oracle was wrong. REV-1
    found a FOURTH wrong version of the oracle -- it had replaced the literal
    6.1 walk with a per-position reformulation taken from 4.2.1.9's prose, and
    that reformulation silently dropped 6.1.4(m) for self-issued certificates,
    because (m) carries no self-issued condition while the reformulation's guard
    did. REV-1 also found the (l)/(m) execution order inverted relative to the
    RFC.
    After the oracle was corrected to transcribe the walk literally, the
    independent lineage certvalidator moved from 18/20 to 19/20 agreement, and
    the two cells that had appeared to corroborate the self-issued claim were
    resolved in the OPPOSITE direction: c13_pair2_selfissued is correctly
    REJECTed, and certvalidator rejects it too. The apparent "two cores
    disagreeing on self-issued" was Frontier disagreeing with a correct
    implementation.
  what_survives: >
    The self-issued EXEMPTION itself is uncontroversial and both correct
    measurements honour it: certvalidator ACCEPTS c11_pair1_selfissued, and
    rustls-webpki rejects c11 with reason class "signature", which the
    certificate-signature controls rule out as a genuine signature fault. The
    webpki c11 rejection is therefore still unexplained and remains an OPEN
    QUESTION, but it is no longer claimed as a pathLenConstraint conformance
    failure.
  lesson_recorded: >
    Three of the oracle's four wrong versions were caught by the corpus; this
    fourth one was NOT, because every corpus case exposing it has the same
    expected verdict under both readings. The corpus bounds what it can catch,
    and a reviewer found what it could not.

what_this_is_not:
  - >
    NOT a claim about any implementation other than rustls-webpki as reached
    through pyca/cryptography 50.0.1. No other core was executed.
  - NOT a security finding. No practical consequence has been demonstrated. In
    both claims the measured core is stricter than the RFC, which is an
    interoperability concern, not a trust bypass.
  - >
    NOT a claim that the Frontier oracle is correct by construction. It was
    derived from the RFC text by three independent agents and implemented with
    three documented wrong versions, all caught by the corpus; it is an
    interpretation with a verification trail, not an axiom.
  - >
    NOT a reproduction of the x509-limbo published results table. Its generator
    was read as source; its harness was not built.

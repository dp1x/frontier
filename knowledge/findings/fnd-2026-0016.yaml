    what_it_changed:
      - "classification spec-violation -> conformance-observation (REFUTED, not softened)"
      - "cohort label rustls-webpki -> pyca/cryptography in-tree crate (REFUTED)"
      - "certvalidator is not pyca-maintained; independence SURVIVES on better grounds"

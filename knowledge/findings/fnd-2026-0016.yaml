claim_1_self_issued_consumes_a_slot:
  statement: >
    With a chain of the form root -> ICA(P) -> ICA(1, SELF-ISSUED) -> ICA(0)
    -> EE, RFC 5280 requires ACCEPT for P=1 (the first intermediate is followed
    by exactly one non-self-issued intermediate, the final EE not being one),
    and the measured core REJECTS it while ACCEPTING the same chain with P=2.
  discriminating_evidence: >
    Three chains differing only in P: (0 REJECT, 1 REJECT, 2 ACCEPT) under
    observation against (0 REJECT, 1 ACCEPT, 2 ACCEPT) under the oracle. The
    boundary therefore sits between P=1 and P=2.
  controls:
    path_construction: eliminated by supplying all 50 corpus CAs as candidates
    generator_defect: eliminated by direct signature verification of all certificates
  confidence: medium-high
  caveat: >
    The rejection string webpki emits is "candidates exhausted: signature does
    not match", which IMPL-5 independently reported is ALSO emitted for a
    genuinely broken signature. The string is therefore not evidence of the
    mechanism; the P-sweep is.
claim_2_trust_anchor_constraint_enforced:
  statement: >
    With a trust anchor carrying pathLenConstraint=0 and a chain
    root(pathlen:0) -> ICA -> EE, RFC 5280 requires ACCEPT because the trust
    anchor is not part of the certification path, and the measured core
    REJECTS with reason class path_len.
  discriminating_evidence: >
    This cell needs no self-issued subtlety: the reason class is path length and
    the chain has one intermediate. SA-1 corroborated the reading
    independently via the initialisation of max_path_length to n rather than
    n+1.
  confidence: medium
  caveat: >
    This is a difference in OBSERVED behaviour. Whether it is a defect or a
    deliberate, documented policy is not established; the source-level
    archaeology for webpki did not complete.
what_this_is_not:
  - >
    NOT a claim about any implementation other than rustls-webpki as reached
    through pyca/cryptography 50.0.1. No other core was executed.
  - NOT a security finding. No practical consequence has been demonstrated. In
    both claims the measured core is stricter than the RFC, which is an
    interoperability concern, not a trust bypass.
  - >
    NOT a claim that the Frontier oracle is correct by construction. It was
    derived from the RFC text by three independent agents and implemented with
    three documented wrong versions, all caught by the corpus; it is an
    interpretation with a verification trail, not an axiom.
  - >
    NOT a reproduction of the x509-limbo published results table. Its generator
    was read as source; its harness was not built.
promotion_blockers:
  - >
    No independent non-synthesizer review has adjudicated this finding. Under
    AGENTS.md that alone blocks promotion to verified.
  - >
    The "independent second lineage" leg is unmet: pyca/certvalidator could not
    be driven within budget, so the divergence rests on a single measured
    validation core.
  - >
    Source-level confirmation inside rustls-webpki (the exact line and the
    commit that introduced the behaviour) is missing. A behavioural
    observation alone cannot distinguish a defect from a deliberate policy.
negative_results_preserved:
  - >
    The inherited hypothesis that "several implementations failing proves a
    bug" was NOT used as evidence. Four implementations failing is not proof;
    three independent standards derivations plus executed discriminating cases
    are what carry this finding.
  - >
    SA-6's adversarial attempt to refute the inherited expectation FAILED and is
    recorded as a failure, not softened.
  - >
    Two corpus confounders were found and fixed, each of which would have made
    the entire matrix uninterpretable.

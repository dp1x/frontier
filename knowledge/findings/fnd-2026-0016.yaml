summary: >
  CANDIDATE, NOT PROMOTED. Two related conformance observations about
  pathLenConstraint, measured against ONE validation core (rustls-webpki via
  pyca/cryptography 50.0.1) on a Frontier-built corpus: (1) a self-issued
  intermediate consumes a pathLenConstraint slot it should not consume, so
  chains RFC 5280 accepts are rejected; (2) the trust anchor's own
  pathLenConstraint appears to be enforced, although RFC 5280 6.1 excludes the
  trust anchor from the certification path. Both survive executed controls that
  eliminate path construction and generator defect. Scope is deliberately
  narrow: one core, one harness, no security claim, no independent second
  lineage measured yet.
epistemic_status: hypothesis
classification: spec-violation
classification_scope: >
  Scoped to rustls-webpki as reached through pyca/cryptography 50.0.1. NOT a
  statement about OpenSSL, BoringSSL, AWS-LC, LibreSSL, Go, GnuTLS or any other
  implementation, none of which was executed in this session.

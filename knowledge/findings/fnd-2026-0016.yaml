    blockers_addressed:
      - independent review obtained (rev-2026-0021, three non-synthesizer roles)
      - second lineage measured (certvalidator 0.11.1, confirmed wbond-authored)
      - self-issued claim withdrawn from the evidence base
      - oracle corrected to a literal transcription of the 6.1 walk
      - >
        SOURCE-LEVEL CONFIRMATION NOW EXISTS IN BOTH CORES, which rev-2026-0020
        listed as a blocking gap. pyca: policy/mod.rs permits_ca evaluates the
        anchor at current_depth=1 because depth 0 is the leaf.
        certvalidator: validate.py:283-289 seeds from the anchor at step 1 k.
      - >
        The G11 self-certification blocker is addressed by rev-2026-0021, which
        re-fetched and re-read the clauses as three roles other than the
        finding's author. Promotion is nonetheless refused, for a different and
        stronger reason: the normative reading does not support promotion.
  blockers_remaining:
    - >
      DECISIVE: the classification was REFUTED, not confirmed. Promotion of a
      spec-violation is not available on this evidence, and the finding is
      correctly left as `candidate` with a conformance-observation label.
    - >
      The control sweep over anchor pathLenConstraint in {absent, 1, 0} was
      DESIGNED and specified so it can be run verbatim, but was NOT EXECUTED.
      It is the cheap remaining check that would close the causal claim at DER
      byte level rather than by generator intent.
    - >
      Whether the trust-anchor convention is deliberate remains open for the
      ecosystem. rev-2026-0021 established that pyca's crate carries an explicit
      upstream NOTE citing x509-limbo, which is evidence of deliberation for
      that core; no equivalent statement was found for certvalidator.
    - >
      The "signature" reason class on the c11 rejection is still unexplained, and
      the earlier warning stands: that string is also emitted for a genuine
      signature fault.

promotion_blockers:
  - >
    Source-level confirmation inside rustls-webpki is missing, so a behavioural
    observation alone cannot distinguish a defect from a deliberate policy.
  - >
    No erratum or design documentation was consulted on whether the trust
    anchor's own pathLenConstraint should bind; two agreeing cores is evidence
    of a convention, not of an error.
  - >
    fnd-2026-0016's own normative_checks were originally self-recorded by the
    artifact's author with method "deterministic-script" asserting a check that
    was never run. TOOL-2's gate work (rules G9-G11) was built partly in
    response; the records themselves are now backed by
    tests/test_x509_pathlen_citations.py, which executes the comparison.
negative_results_preserved:
  - >
    The inherited hypothesis that "several implementations failing proves a
    bug" was NOT used as evidence. Four implementations failing is not proof;
    three independent standards derivations plus executed discriminating cases
    are what carry this finding.
  - >
    SA-6's adversarial attempt to refute the inherited expectation FAILED and is
    recorded as a failure, not softened.
  - >
    Two corpus confounders were found and fixed, each of which would have made
    the entire matrix uninterpretable.

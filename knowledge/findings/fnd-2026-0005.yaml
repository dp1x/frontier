title: "rustls+aws-lc-rs TLS enforces s7.2 at handshake with illegal_parameter - SPECIFIED=IMPLEMENTED=EXECUTED (BoringSSL-derived cohort)"
classification: implementation-spec-compliance
statement: >
  The msn-2026-0005 rustls+aws-lc-rs server cohort, run on GHA workflow
  run 33267918229 (ubuntu-24.04, rustls 0.23.43, aws-lc-rs 1.18.0, go
  1.26.4), confirms that the BoringSSL-derived ML-KEM path (used by
  rustls via aws-lc-rs as the default CryptoProvider, prefer-post-quantum
  feature ON so X25519MLKEM768 is the first entry in DEFAULT_KX_GROUPS)
  enforces the FIPS 203 s7.2 encapsulation-key check at the protocol
  layer with the spec-mandated alert mapping.

  Result matrix (per-handshake verdicts):

    variant                | client_alert            | rustls_server_error
    -----------------------+-------------------------+-----------------------------------
    control                 | (handshake-succeeded)    | (no error)
    wire_coeff0_eq_q       | illegal_parameter       | PeerMisbehaved(InvalidKeyShare)
    wire_coeff0_eq_4095    | illegal_parameter       | PeerMisbehaved(InvalidKeyShare)
    wire_coeff255_eq_4095  | illegal_parameter       | PeerMisbehaved(InvalidKeyShare)
    truncate_last_byte     | illegal_parameter       | PeerMisbehaved(InvalidKeyShare)

  All 4 tampered variants abort with the spec-mandated illegal_parameter
  alert (draft-ietf-tls-ecdhe-mlkem-05 s4.2: "The server MUST abort the
  handshake with an alert of illegal_parameter" when the s7.2 check
  fails).  The server-side error mapping is coarser than Go's (the
  BoringSSL-derived code does not distinguish length-class from
  modulus-class at the rustls API surface; both collapse to a single
  PeerMisbehaved(InvalidKeyShare) variant), but the on-the-wire alert
  is exactly illegal_parameter in all 4 cases.

  Combined with obs-2026-0011 (Go stdlib crypto/tls enforces s7.2),
  the FIPS 203 s7.2 boundary is now independently observed in two
  distinct deployed code paths:

    - Go stdlib crypto/tls (Go 1.26.4 windows/arm64) - obs-2026-0011
    - rustls 0.23.43 + aws-lc-rs 1.18 (BoringSSL-derived) - obs-2026-0024

  This is positive evidence for the hypothesis that the s7.2 check is
  placed at the protocol layer by the major deployed stacks.
disclosure: embargoed
correction_2026_10_03:
  reason: "Independent adversarial audit (rev-2026-0018): core claim holds, evidence overstated, and the topic is NOT novel."
  verdict: partially_supported_and_not_novel
  what_holds: >
    Traced rustls 0.23.43 through pq/hybrid.rs and pq/mlkem.rs to aws-lc's
    mlk_kem_check_pk, which carries the literal annotation "Implements
    @[FIPS203, Section 7.2, Modulus check]" and does frombytes -> reduce ->
    tobytes -> ct_memcmp. Failure maps to
    send_fatal_alert(IllegalParameter, ...), as the draft mandates. The
    one-layer-too-shallow failure mode from fnd-2026-0009 is NOT reproduced.
  defects:
    - "the section 7.2 LENGTH half was never tested: truncate_last_byte computes cut = d + shareSize - 1 with shareSize 1216, removing offset 31 of the 32-byte X25519 tail, so ek stays exactly 1184 bytes. The abort came from rustls's own Layout::split() share-length check - a DIFFERENT mechanism producing a byte-identical outcome. 'Section 7.2 check enforced' is an overclaim."
    - "wire_coeff255_eq_4095 actually targets coefficient 509 (bytes 763/764 = triplet 254). coeff255 lives at ek[381..383] and was byte-identical to baseline. Root cause: main.go:64 states '384 B encoded t-hat', wrong by k=3; the real t-hat is 1152 B. Duplicated in go_loopback/main.go."
    - "a console log claiming 'ek shrunk to 1183 B' is false - it was 1184 B throughout - and was copied into the finding's limitations unchecked."
  novelty:
    verdict: not_novel
    detail: >
      aws-lc #2891 (merged 2026-01-20) already states "we successfully import
      ML-KEM encapsulation keys with modulus overflow. This is allowed by FIPS
      203". #2872 (merged 2026-04-06) added ACVP encapsulationKeyCheck vectors
      against this exact function. #2709 quotes the same kem.c lines.
  drift: >
    rustls 0.23.44/.45 and aws-lc-rs 1.18.1 shipped after the pins. Re-checked at
    0.23.45 (2976d90f): pq/hybrid.rs blob SHA identical, property holds, pin stale.
  status_change:
    from: verified_conclusion
    to: disputed
    disclosure_change:
      from: public
      to: none - an interop note would be non-novel
  evidence: rev-2026-0018

disclosure_scope_note: >
  disclosure is recorded as 'embargoed' solely because the schema offers no
  'not for disclosure' value and these findings must not be sent to anyone.
  This is NOT a security embargo: no undisclosed vulnerability is being held
  back. In each case either the claim is false (0002, 0013) or it is already
  known upstream (0005) or the claim scope overstates what the evidence supports
  (0001, 0004, 0006, 0007). The correct disposition is: withdraw or rewrite, not
  disclose. See correction_2026_10_03 and rev-2026-0018.

limitations: >
  - Single protocol path tested: TLS 1.3 X25519MLKEM768.  The
    draft-ietf-tls-ecdhe-mlkem-05 s4.2 mandate applies to this
    path; other paths (HPKE X-Wing, SSH hybrid KEX, IKEv2 RFC9370)
    are out of scope of this finding and remain to be tested.
  - Server-side error mapping is coarser than Go's: rustls
    reports a single PeerMisbehaved(InvalidKeyShare) variant
    for both modulus-class overflow and length-class
    truncation.  The on-the-wire alert is the same in both
    cases, so the protocol-layer security property holds, but
    diagnostic detail is reduced.
  - Only 4 tamper variants tested: 3 coefficient overflow
    patterns (coeff0=q, coeff0=4095, coeff255=4095) and 1
    length truncate.  Other patterns (cross-param-set body,
    rho-tail mutation, etc.) are not in the rustls cohort
    matrix; the msn-2026-0001 rustls row tested them in the
    library-parse layer (not the protocol layer).
  - The aws-lc-rs C library is not directly instrumented
    in this experiment; the protocol-layer effect is the
    primary observation.  Library-parse verification of
    aws-lc-rs itself was done in msn-2026-0001.

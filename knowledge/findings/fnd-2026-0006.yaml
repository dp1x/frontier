correction_2026_10_03:
  reason: >
    Independent adversarial audit (rev-2026-0018) found the headline claim
    falsified by the finding's OWN source file.
  verdict: headline_falsified_by_own_source
  decisive_evidence: >
    ValidKey.lean:47-48 defines isValidKey p B := B = B AND forall i, seg B i <
    3329. The first conjunct is reflexivity. The parameter p is never used, and
    the build log's own "unused variable 'p'" warning proves it. Fin appears in
    the codebase only inside comments. T2 is literally `exact canonicalLength_k2`,
    a restatement of FORMAL-204 with isValidKey nowhere in its statement; T3 is
    enc_dec_eq B hB hSeg y, character-for-character FORMAL-203's helper. It does
    not compose the two halves, and its summary: and statement: contradict each
    other.
  critical_absent_claim: >
    FIPS 203 section 7.2's type check len(ek) == 384k+32 is NOT formalized
    anywhere in the corpus.
  what_survives: >
    All three proofs are SOUND. No sorry, axiom, native_decide, admit, unsafe,
    partial or opaque anywhere in formal/**/*.lean. Build verified three ways:
    oleans newer than sources with header olean4.22.0..., CI run 35469449259
    logs BUILD_EXIT=0, and git blob hashes prove CI compiled byte-identical
    sources. The defect is claim scope, not proof soundness.
  status_change:
    from: verified_conclusion
    to: disputed
    disclosure_change:
      from: public
      to: none - the "combined" claim is false as written
  what_must_be_redone: >
    A genuine composition of the LENGTH and MODULUS halves needs a real byte-array
    model with a length parameter that is USED in the statement, and the Lean
    type check formalized rather than left as Nat arithmetic.
  evidence: rev-2026-0018

disclosure_scope_note: >
  disclosure is recorded as 'embargoed' solely because the schema offers no
  'not for disclosure' value and these findings must not be sent to anyone.
  This is NOT a security embargo: no undisclosed vulnerability is being held
  back. In each case either the claim is false (0002, 0013) or it is already
  known upstream (0005) or the claim scope overstates what the evidence supports
  (0001, 0004, 0006, 0007). The correct disposition is: withdraw or rewrite, not
  disclose. See correction_2026_10_03 and rev-2026-0018.

limitations: >
  - The combined type is a predicate, not a subset type.  A
    subset type would be more idiomatic Lean 4 but requires
    unifying the byte array representations (Fin n -> Nat in
    LENGTH half vs Nat -> Nat in MODULUS half).  This is a
    follow-up formalization task (FORMAL-208 candidate).
  - The proof of isValidKey_zero_k2 uses wsum_zero, a
    helper lemma that the all-zero function's wsum is 0.
    This is a small but real piece of arithmetic that could
    be made more elegant with Mathlib's `Finset.sum_eq_zero`
    lemma.
  - Only k=2 (ML-KEM-512) is covered; k=3 (ML-KEM-768) and
    k=4 (ML-KEM-1024) are follow-ups.
  - Lean 4.22.0 release commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05
    was current as of the kernel check; future Lean 4
    releases may change tactic behavior.

title: "FORMAL-205: FIPS 203 s7.2 combined LENGTH+MODULUS half (Lean 4 kernel-verified)"
classification: formal-verification
statement: >
  In Lean 4 v4.22.0 (toolchain pin: leanprover/lean4:v4.22.0,
  commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05) with Mathlib4
  v4.22.0, formal/Formal/ValidKey.lean kernel-checks the
  combined LENGTH + MODULUS halves of FIPS 203 s7.2 for
  ML-KEM-512:

    T1 (isValidKey_zero_k2): the all-zero 800-byte array is a
        ValidKey .k2 (every 12-bit segment is 0, which is
        trivially < 3329).  This proves the ValidKey type
        is non-empty.

    T2 (isValidKey_length_k2): the canonical byte length for
        ML-KEM-512 is 800 (restates FORMAL-204 canonicalLength_k2).

    T3 (isValidKey_roundtrip_general): for any byte array B
        with the canonical MODULUS property (every 12-bit
        segment < 3329) and the canonical byte bound (B y < 256),
        the FORMAL-203 roundtrip `encByte (dec B) y = B y`
        holds for all y.

  Build artifact: formal/build_output_r3.log
    [3053/3054] Built Formal
    Build completed successfully.

  Axiom inventory (per #print axioms): all top-level theorems
  depend only on standard Lean 4 core axioms
  {propext, Classical.choice, Quot.sound} (identical to
  FORMAL-203's inventory).  No file-introduced axiom, no sorry,
  no admitted.

  Spec citations (verified against the PDF):
    - Section 7.2, Eq 7.1, printed p.36 / PDF p.45: confirmed
    - 384*2 + 32 = 800 (LENGTH half)
    - 12-bit segments < q = 3329 (MODULUS half)
  All citations in the file header are accurate.

  Scope disclosure: FORMAL-205 covers the combined s7.2 check
  for ML-KEM-512 (k=2) only.  Extending to k=3 and k=4 is a
  follow-up.  The combined type is expressed as a predicate
  (isValidKey) rather than a dependent subset type because
  the seg function in ByteEncode.lean operates on unbounded
  byte arrays (Nat -> Nat) while the LENGTH half gives us
  length-bounded arrays (Fin n -> Nat).  The predicate
  approach unifies the two halves at the byte-array level.

  Cross-reference: this file uses both FORMAL-203 (ByteEncode.lean
  for the MODULUS half foundations) and FORMAL-204 (LengthCheck.lean
  for the LENGTH half foundations).  Together FORMAL-203 + 204 + 205
  cover the structural (length) and content (modulus) halves of
  the s7.2 encapsulation-key check, plus a non-emptiness witness
  (the zero array) and a byte-level roundtrip property.

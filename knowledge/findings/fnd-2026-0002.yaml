summary: "REJECTED 2026-10-03 after independent adversarial audit (rev-2026-0018). This finding claimed OpenSSL d2i_PUBKEY accepts malformed ML-KEM encapsulation keys that the raw-import path rejects. REFUTED: the harness never put the malformed length inside the DER - it appended bytes PAST the end of the declared object, and d2i_PUBKEY left the caller's trailing bytes alone, which is documented d2i behaviour. A properly framed over-length SPKI is REJECTED. A coefficient of q=3329 is REJECTED on both paths, so FIPS 203 section 7.2 IS enforced. Ed25519, X25519 and ML-DSA-44 behave identically, so ML-KEM is not special. The proposed fix would have made ML-KEM the only algorithm in OpenSSL to reject a buffer holding one DER object followed by more data. Preserved as a harness-design negative result."

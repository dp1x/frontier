summary: "OpenSSH portable master HEAD (commit 0ef0f5a839831c213f24e3f2ae434765c607fb50) ssh client performs ONLY a length check on the server S_REPLY portion of SSH_MSG_KEX_ECDH_REPLY (message 31) for both the mlkem768x25519-sha256 and sntrup761x25519-sha512 hybrid KEX cohorts, the symmetric analog of the server-side leniency established by fnd-2026-0009. However, on the client side this is NOT a FIPS 203 s7.2 modulus check concern because s7.2 is defined for encapsulation keys (ek), not ciphertexts; the client's relevant FIPS 203 surface is s7.3 (decapsulation input checks via implicit rejection), which the underlying crypto_kem_mlkem768_dec primitive is responsible for implementing. The structural safety net for the SSH handshake is the exchange-hash signature verification on H = hash(... || K_PQ || ...), which catches any K_PQ_server vs K_PQ_client divergence caused by either side's leniency. Per adversarial critic analysis of 16 attack scenarios (rev-2026-0010), the lenient client does NOT enable any active MITM attack because forging the server's signature requires sk_host. Therefore this is a compliance gap symmetric to fnd-2026-0009, NOT a security vulnerability."

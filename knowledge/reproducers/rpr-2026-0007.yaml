notes: |
  The reproducer runs the CIRCL X-Wing + HPKE harness twice (canonical
  and mutations). It is fully deterministic given the same Go build and
  circl version. The mutation matrix exposes the X25519 clamping
  property at eseed[32] bit 0 and eseed[63] bit 7 (these mutations
  produce the same ss; all others produce a different ss).

  The reproducer is the canonical artifact for obs-2026-0027 and
  obs-2026-0028. To reproduce, clone .scratch/xwing/ from a clean
  checkout and run the commands above.
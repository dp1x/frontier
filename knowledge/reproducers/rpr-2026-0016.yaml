reproducibility_notes: |
  All steps above are deterministic; re-running produces byte-identical output.

  Step 2 (cleanroom self-test) is the strongest single check. The secp256k1
  ciphersuite matches the KAT byte-for-byte across:
    - round 1 commit: hiding_nonce, binding_nonce, hiding_nonce_commitment,
      binding_nonce_commitment, binding_factor
    - round 2 sign: signature shares for both participants
    - aggregate: R and z components
    - verify: aggregate signature verifies under the public group key

  Step 4 (matrix runner) confirms the cleanroom classification against the
  verdict rubric. The "1/6 cells PASS" reflects the cohort constraint: only
  cleanroom is available; pycose doesn't implement FROST; Go FROST doesn't
  exist as a port.
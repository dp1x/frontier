reproducibility_notes: |
  The cryptographic outputs are deterministic: re-running reproduces the same
  bytes. CORRECTED 2026-09-26 - one caveat: results/matrix.jsonl records an
  elapsed_s wall-clock value per cell, so matrix.jsonl is NOT byte-identical
  across runs. In the 2026-09-26 rerun the only differences from the committed
  matrix.jsonl were 4 elapsed_s values. results/matrix.tsv and both vector
  JSONL files are byte-identical on re-run because they carry no timing data.

  Step 2 (cleanroom self-test) is the strongest single check. BOTH ciphersuites
  now match their KAT byte-for-byte across:
    - round 1 commit: hiding_nonce, binding_nonce, hiding_nonce_commitment,
      binding_nonce_commitment, binding_factor
    - round 2 sign: signature shares for both participants
    - aggregate: R and z components
    - verify: aggregate signature verifies under the public group key

  Step 4 (matrix runner) confirms the cleanroom classification against the
  verdict rubric. The "2/6 cells PASS" reflects the cohort constraint: only
  cleanroom is available; pycose doesn't implement FROST; Go FROST doesn't
  exist as a port. Corrected 2026-09-26 from "1/6", which reflected the oracle
  defect rather than a cohort limitation.

  LIMITATION THAT SURVIVES THE CORRECTION: every passing cell is agreement
  between the Frontier oracle and the RFC vectors it was built against. No
  independent FROST implementation was executed. Independent reproduction by a
  second codebase remains the outstanding requirement before any claim here can
  be promoted.
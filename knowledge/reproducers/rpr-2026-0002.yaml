notes: >
  This is an INDEPENDENT reproducer (does not import code from
  crypto/mlkem-input-checks/harnesses/openssl_invar_runner.c). The
  five self-contained C programs in .scratch/spki_repro/ each build
  the SPKI from scratch (22-byte prefix + body bytes verbatim) and
  exercise the d2i_PUBKEY / EVP_PKEY_encapsulate path. Direct
  observation of parser-consumed length matches the mechanism claim
  in fnd-2026-0002: BIT STRING length header masks any over-shoot
  and the keymgmt validates only the canonical body length.

  Version drift note: the original fnd-2026-0002 finding and harness
  were targeted at OpenSSL 3.5.7 (GHA run 32914837764). The local
  environment has OpenSSL 3.6.3, not 3.5.7. The permissive BIT
  STRING length-header path is present in both versions. The
  cross-version consistency is a positive result for the mechanism
  claim but does not by itself upgrade the version scope of
  fnd-2026-0002 (which remains 3.5.7 with 3.6.3 noted as consistent).
  See REPORT.md lines 21-28 for the explicit version drift
  disclosure.

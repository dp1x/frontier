title: "RPR-2026-0014 - CBOR §4.2 cohort expansion matrix reproducer (cbor2 + ciborium + cbor-x)"
reproducer_command: |
  Reproduce msn-2026-0017 (CBOR §4.2 cohort expansion matrix).
  Deterministic given: cleanroom oracle source, vector generator seed 0xCB0F1E21,
  library versions cbor2 6.1.4, ciborium 0.2.2, cbor-x 1.6.6,
  toolchain versions Python 3.11+, Rust 1.85+, Node.js 18+.

  cd cbor-cross-impl

  # Step 1: Verify cleanroom oracle against RFC 8949 Appendix A 14 integer vectors
  python oracle/cbor_oracle.py
  # Expected: "Overall: PASS (14 vectors tested)"

  # Step 2: Generate adversarial vectors (deterministic; seed 0xCB0F1E21)
  python vectors/gen_vectors.py
  # Expected: 111 vectors across 8 axes

  # Step 3: Install cbor2 (Python) if not already installed
  pip install cbor2==6.1.4

  # Step 4: Build ciborium (Rust) if not already built
  # Rust 1.85+ and Cargo required.
  if [ ! -f "R:/cbor-cohort/ciborium/target/release/cbor-driver.exe" ]; then
    mkdir -p R:/cbor-cohort/ciborium
    cd R:/cbor-cohort/ciborium
    cargo build --release
    cd -
  fi

  # Step 5: Install cbor-x (JavaScript) if not already installed
  if [ ! -d "R:/cbor-cohort/cbor-x/node_modules" ]; then
    mkdir -p R:/cbor-cohort/cbor-x
    cd R:/cbor-cohort/cbor-x
    npm init -y
    npm install cbor-x@1.6.6
    cd -
  fi

  # Step 6: Run matrix
  python runner/run_matrix.py
  # Expected: 555 cells (cbor2 222 + ciborium 222 + cbor-x 111 default)
  # Canonical mode (cbor2 + ciborium): 222/222 PASS (byte-exact match with oracle)

  # Step 7: Dump diverging rows for human review
  python runner/dump_diverge.py results/matrix.tsv > results/diverge_summary.txt

  # Step 8: Validate TSV is reproducible (re-run should produce identical output)
  sha256sum results/matrix.tsv > results/matrix.tsv.sha256
  python runner/run_matrix.py > /dev/null
  diff <(sha256sum results/matrix.tsv | awk '{print $1}') <(cat results/matrix.tsv.sha256 | awk '{print $1}')

reproducer_files:
  - path: cbor-cross-impl/oracle/cbor_oracle.py
    role: cleanroom oracle (RFC 8949 §4.2 + §4.2.3 length-first)
  - path: cbor-cross-impl/vectors/gen_vectors.py
    role: adversarial vector generator (deterministic, seed 0xCB0F1E21)
  - path: cbor-cross-impl/vectors/vectors_*.jsonl
    role: pre-generated adversarial vectors (8 files, 111 vectors total)
  - path: cbor-cross-impl/adapters/lib_cbor2_adapter.py
    role: cbor2 6.1.4 adapter (Python)
  - path: cbor-cross-impl/adapters/lib_ciborium_adapter.py
    role: ciborium 0.2.2 adapter (Python wrapper around Rust binary driver)
  - path: cbor-cross-impl/adapters/lib_cbor_x_adapter.py
    role: cbor-x 1.6.6 adapter (Python wrapper around Node.js driver)
  - path: cbor-cross-impl/runner/run_matrix.py
    role: matrix runner
  - path: cbor-cross-impl/runner/dump_diverge.py
    role: divergence dump utility
  - path: cbor-cross-impl/results/matrix.tsv
    role: matrix output (committed for reproducibility verification)
  - path: R:/cbor-cohort/ciborium/Cargo.toml
    role: Rust ciborium project manifest
  - path: R:/cbor-cohort/ciborium/src/main.rs
    role: Rust ciborium driver (subprocessed by Python adapter)
  - path: R:/cbor-cohort/cbor-x/driver.js
    role: Node.js cbor-x driver (subprocessed by Python adapter)


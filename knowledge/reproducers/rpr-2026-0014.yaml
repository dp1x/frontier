  notes: |
    Re-running the reproducer on the same library + toolchain versions
    produces byte-identical matrix.tsv. The Rust ciborium build is
    reproducible from Cargo.toml + src/main.rs. The Node.js cbor-x install
    is reproducible from package.json + the cbor-x driver.js.

validation_results:
  rfc_8949_appendix_a_integers:
    expected: "14/14 PASS in both deterministic and canonical modes"
    actual: "14/14 PASS in both modes (verified 2026-08-31)"
  rfc_8949_section_4_2_3_example:
    expected: "byte-exact match with oracle (a80a012001f401186401617a018120016261610181186401)"
    actual: "byte-exact match verified 2026-08-31 (oracle, cbor2, ciborium all produce same bytes)"
  canonical_mode_cross_impl:
    expected: "cbor2 111/111 PASS + ciborium 111/111 PASS = 222/222 byte-exact match with oracle"
    actual: "verified 2026-08-31 in cbor-cross-impl/results/matrix.tsv"
  matrix_reproducibility:
    expected: "re-running runner produces identical matrix.tsv"
    actual: "byte-identical matrix.tsv on re-run (deterministic for given inputs + library + toolchain versions)"

limitations:
  - "3-library cohort for canonical mode (cbor2 + ciborium + Frontier oracle). cbor-x excluded (no canonical mode)."
  - "ciborium 0.2.2's canonical encoder is built manually in the Rust driver using CanonicalValue (which exposes cmp_value). A future ciborium release may add a first-class canonical_into_writer; the adapter would need to be updated."
  - "No cross-platform validation."
  - "Haskell cborg is NOT in this cohort (Haskell Data.Map Ord-based key ordering does not match §4.2.1 bytewise-lex or §4.2.3 length-first; including cborg requires careful adapter design). Deferred to follow-up."
  - "Default-mode cbor-x divergences (tag wrapping, integer-as-float, etc.) are documented cbor-x behavior and are NOT attempts to coerce cbor-x into producing canonical output."

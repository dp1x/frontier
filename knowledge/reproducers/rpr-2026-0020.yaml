summary: >
  Minimal reproducer for the ambient rounding-mode dependence of
  std::from_chars in libc++ 20.1.8. A single-line input is enough: the
  string "1.1" converted to float returns 0x3f8ccccd (the round-to-nearest
  value) under FE_TONEAREST and FE_UPWARD, and 0x3f8ccccc (one ulp lower)
  under FE_DOWNWARD and FE_TOWARDZERO. The result is reproducible in a fresh
  process, and the difference is the correctly-rounded-toward-the-mode value,
  which identifies the Clinger fast path as the mechanism.

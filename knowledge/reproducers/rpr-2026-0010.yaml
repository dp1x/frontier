summary: "Reproducer for fnd-2026-0010 (msn-2026-0011) -- direct source-code reading of kexmlkem768x25519.c (kex_kem_mlkem768x25519_dec) at OpenSSH portable master HEAD commit 0ef0f5a8 demonstrates that the client-side decapsulation path performs ONLY a length check on the server S_REPLY before calling crypto_kem_mlkem768_dec. There is no 12-bit coefficient range check on the S_REPLY ciphertext because FIPS 203 s7.2 is defined for encapsulation keys (ek), not for ciphertexts. The client's FIPS-conformance surface for the SSH KEM is s7.3 (decapsulation input checks via implicit rejection), which the underlying crypto_kem_mlkem768_dec primitive is responsible for implementing. The structural safety net for the SSH handshake is the exchange-hash signature verification, not the FIPS 203 modulus check."

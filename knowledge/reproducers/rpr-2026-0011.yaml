summary: "Reproducer for fnd-2026-0011 (Frontier environment capability gap for C23 #embed). Runs the bash characterization matrix (compilers/embed/run_embed_matrix.sh) on the system clang and gcc. Demonstrates that both system compilers reject #embed stimuli cleanly without crashing. Confirms the environment limitation via 26 cells (13 stimuli x 2 compilers) of deterministic, reproducible evidence. The reproducer is committable and re-runnable on every commit via .github/workflows/clang-embed-crash.yml."

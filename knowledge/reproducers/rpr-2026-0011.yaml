reproduction_steps:
  step_1:
    command: "cd C:\\Users\\Dhane\\frontier; gh workflow run clang-embed-crash.yml --repo dp1x/frontier --ref main"
    purpose: "Trigger the characterization matrix on GHA ubuntu-latest"
  step_2:
    command: "gh run view <run_id> --repo dp1x/frontier"
    purpose: "Watch the run complete (typically <30 seconds)"
  step_3:
    command: "gh run download <run_id> --repo dp1x/frontier --dir R:/clang-embed"
    purpose: "Download per-cell verdict TSVs"
  step_4:
    command: "cat R:/clang-embed/clang-embed-crash-clang-default-<run_id>/clang-default/embed_crash_matrix.tsv"
    purpose: "Inspect clang verdicts - expect all 13 cells 'rejects_with_error'"
  step_5:
    command: "cat R:/clang-embed/clang-embed-crash-gcc-default-<run_id>/gcc-default/embed_crash_matrix.tsv"
    purpose: "Inspect gcc verdicts - expect all 13 cells 'rejects_with_error'"
  step_6:
    assertion: |
      26 total cells, all 'rejects_with_error', zero crashes. This confirms
      the system compilers lack #embed support and Frontier's standard CI
      environment cannot reproduce LLVM #212075 / #219332 without explicit
      clang-19+ installation.

  step_alternative:
    description: "Local reproducer for the same matrix"
    command: "cd C:\\Users\\Dhane\\frontier; bash compilers/embed/run_embed_matrix.sh $(which clang) /tmp/clang-results"
    purpose: "Run matrix locally if GHA is unavailable"
    expected: "Same per-cell verdicts (rejects_with_error) on any system with clang-18.x or gcc-13.x"
verdict: |
  The reproducer confirms fnd-2026-0011: Frontier's standard GHA
  ubuntu-latest CI environment cannot reproduce the upstream C23 #embed
  crash bugs without explicit clang-19+ or gcc-15+ installation. The
  environment capability gap is documented and the fix (apt.llvm.org
  install step) is committed to the workflow. The upstream bugs remain
  well-documented in the LLVM bug tracker.

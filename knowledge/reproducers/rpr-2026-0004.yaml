- '# CANONICAL ROUTE IS GITHUB ACTIONS, NOT A LOCAL BUILD.'
- '# Reason: formal/.lake/packages was deleted 2026-09-26, so a local `lake build`'
- '# re-downloads Mathlib (several GB). AGENTS.md forbids heavy local build trees.'
- '# Authoritative sequence lives in .github/workflows/formal.yml:'
- '#   lake update -> lake exe cache get! -> lake build'
- gh workflow run formal.yml --ref main
- gh run view --log $(gh run list --workflow formal.yml --limit 1 --json databaseId --jq '.[0].databaseId')
- '# Expected in the ''Build (kernel check)'' step: ''Build completed successfully.'''
- '# LOCAL READ-ONLY check of already-built proof terms. No build, no download.'
- .venv\Scripts\python.exe -c "import pathlib;fs=sorted(pathlib.Path('formal/.lake/build').rglob('*.olean'));print(len(fs),'olean
  files');[print(' ',f.name) for f in fs]"
- '# Expected: 34 .olean files, each newer than its .lean source, header olean4.22.0...'
- 'lake env lean check_axioms.lean  # requires a CI-provided toolchain + cache'

notes: >
  Independent reproduction confirms the rustls+aws-lc-rs cohort
  reproduces the spec-mandated illegal_parameter alert for all
  tampered variants.  The server-side error mapping collapses
  length-class and modulus-class to a single PeerMisbehaved
  variant; this is the BoringSSL-derived behavior, not a harness
  bug.  The on-the-wire alert is the same in both classes, so
  the protocol-layer security property holds.

  Cross-stack correlation (combined with obs-2026-0011):
  - Go stdlib crypto/tls: enforces s7.2 with illegal_parameter
  - rustls+aws-lc-rs: enforces s7.2 with illegal_parameter
  Two independent deployed code paths confirm the boundary.

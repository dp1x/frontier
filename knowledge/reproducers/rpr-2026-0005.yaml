governance_correction_2026_10_04:
  reason: >
    These reproduction_commands previously offered "Or locally: cd
    interop/protocol-placement/rustls_loopback/rustls_server; cargo build
    --release; cd ..; go run . reports/rustls_loopback_report.tsv" as a
    co-equal alternative to the GitHub Actions route. A local `cargo build
    --release` creates a heavy Rust build tree (target/) that AGENTS.md forbids
    persisting on this machine: "if a directory is gitignored AND regenerable by
    a CI job, it does not get to live on this machine." rustls-loopback.yml is
    exactly such a CI job.
  corrected_routes_to: >
    .github/workflows/rustls-loopback.yml, which builds the rustls server, runs
    the Go driver, and emits rustls_loopback_report.tsv on a GitHub runner.
  local_check_retained: >
    Reading the committed interop/protocol-placement/rustls_loopback/reports/
    artifacts remains valid and stays local. They are the evidence.
  scope: >
    Reproduction route only. The recorded verdict and every claim are unchanged,
    and no old research claim is reopened by this correction.

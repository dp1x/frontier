summary: "Reproducer for fnd-2026-0009 -- direct source-code reading of kexmlkem768x25519.c at commit 0ef0f5a8 demonstrates only length check, not FIPS 203 s7.2 modulus check, on the client C_INIT blob before calling crypto_kem_mlkem768_enc."

reproducibility:
  deterministic: true
  seed: 0xCB0F1E21
  library_versions:
    cbor2: 6.1.4
    python: ">=3.11"
  cross_platform_tested: false
  cross_version_tested: false
  notes: "Re-running the reproducer on the same Python + cbor2 versions produces byte-identical matrix.tsv. Different Python or cbor2 versions may produce different cells (e.g., cbor2 upgrades could change float-shortest-form behavior)."

validation_results:
  rfc_8949_appendix_c_integers:
    expected: "14/14 PASS in both deterministic and canonical modes"
    actual: "14/14 PASS in both modes (verified 2026-08-31 by oracle self-test)"
  rfc_8949_section_4_2_3_example:
    expected: "byte-exact match with oracle (length-first ordering)"
    actual: "byte-exact match verified 2026-08-31 (oracle produces a80a012001f401186401617a018120016261610181186401)"
  matrix_reproducibility:
    expected: "re-running runner produces identical matrix.tsv"
    actual: "verified 2026-08-31 (deterministic for given inputs + library version)"

limitations:
  - "Only 1 library (cbor2) tested. Cross-impl matrix requires more libraries for evidentiary weight."
  - "Vector generator has 4 known issues (undefined handling, tag nesting, bytes serialization, tuple-as-array-key). These produce false-positive divergences in matrix.tsv; they are NOT cbor2 bugs."
  - "No cross-platform validation. (this matrix was run on Windows host + Python 3.11.)"
  - "Second-opinion oracle (cbor.me) not consulted. The §4.2.1-vs-§4.2.3 divergence is documented in RFC 8949 itself, so cbor.me consultation is informative but not required."
  - "Matrix cells with verdict 'SPEC_AMBIGUITY' (longer-but-valid encodings) are not filtered by default. The cbor2 default mode produces 18 SPEC_AMBIGUITY cells, all due to double-precision floats."
summary: Reproducer for msn-2026-0013 / exp-2026-0029 / obs-2026-0037. Clones ZcashFoundation/frost at the pinned commit, builds the frost-secp256k1 + frost-ed25519 crates in release mode, and runs `cargo test --release --test integration_tests check_sign_with_test_vectors`. The test exercises RFC 9591 Appendix E.5 (secp256k1) and Appendix E.1 (ed25519) KAT vectors byte-exact against the per-step outputs of the round1+round2+aggregate pipeline. 3 KAT tests + 27 related integration tests pass on each ciphersuite (60 total). The reproducer is fully re-runnable from committed sources.

reproduction_steps:
  - step: 1
    action: "Clone ZcashFoundation/frost at pinned commit to disposable scratch (R:\\ ramdisk)"
    command: |
      cd R:\\frost-cross-impl-scratch
      git clone https://github.com/ZcashFoundation/frost.git zcash-foundation-frost
      cd zcash-foundation-frost
      git checkout 0966bd1529aa062ad3b621af99e277f976b1c0f0
  - step: 2
    action: "Verify KAT vectors match RFC 9591 Appendix E verbatim"
    command: |
      # Compare the committed KAT vectors against the RFC text expected verifying_key_key
      # RFC 9591 Appendix E.5 secp256k1: verifying_key_key=02f37c34b66ced1fb51c34a90bdae006901f10625cc06c4f64663b0eae87d87b4f
      # (Already verified byte-exact against the committed crypto/frost-cross-impl/kat/rfc9591_appendix_e5_secp256k1.json.)
      # RFC 9591 Appendix E.1 ed25519: verifying_key_key=15d21ccd7ee42959562fc8aa63224c8851fb3ec85a3faf66040d380fb9738673
      # (Already verified byte-exact against the committed crypto/frost-cross-impl/kat/rfc9591_appendix_e1_ed25519.json.)
  - step: 3
    action: "Build and run the RFC 9591 KAT test on the secp256k1 crate"
    command: |
      cd R:\\frost-cross-impl-scratch\\zcash-foundation-frost\\frost-secp256k1
      cargo test --release --test integration_tests check_sign_with_test_vectors
      # Expected: 3 passed; 0 failed (check_sign_with_test_vectors + 2 variants)
  - step: 4
    action: "Build and run the RFC 9591 KAT test on the ed25519 crate"
    command: |
      cd R:\\frost-cross-impl-scratch\\zcash-foundation-frost\\frost-ed25519
      cargo test --release --test integration_tests check_sign_with_test_vectors
      # Expected: 3 passed; 0 failed (check_sign_with_test_vectors + 2 variants)
  - step: 5
    action: "(Optional) Run all integration tests on both crates for comprehensive coverage"
    command: |
      cd R:\\frost-cross-impl-scratch\\zcash-foundation-frost\\frost-secp256k1
      cargo test --release --test integration_tests
      # Expected: 30 passed; 0 failed
      cd ..\\frost-ed25519
      cargo test --release --test integration_tests
      # Expected: 30 passed; 0 failed

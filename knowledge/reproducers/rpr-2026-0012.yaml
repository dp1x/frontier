reproducibility_notes: |
  The reproducer is fully re-runnable. Cold build from scratch takes approximately 5 minutes on
  this Windows host (R:\\ ramdisk). Warm build (cargo cache populated) takes seconds.

  The KAT vectors committed in crypto/frost-cross-impl/kat/rfc9591_appendix_e{1,5}_*.json are
  byte-exact copies of the KAT vectors embedded in ZcashFoundation/frost's tests/helpers/vectors.json
  files. The ZcashFoundation/frost KAT vectors are themselves byte-exact copies of the RFC 9591
  Appendix E text (verified by the spec analyst's spc-2026-0003 normative extraction).

  This reproducer DOES NOT exercise the cross-impl byte-exact matrix originally designed (with
  ZKSecurity frost Go and ZCashFoundation frost-rs/frost-dkg as separate implementations), because
  the implementation-archaeologist's correction (zksecurity/frost does not exist;
  ZcashFoundation/frost-rs was folded into ZcashFoundation/frost monorepo in v2.0.0;
  ZcashFoundation/frost-dkg does not exist as separate repo) means the original cohort is
  smaller than designed. The decisive evidence is the single-impl ZcashFoundation/frost
  byte-exact RFC 9591 conformant result.

  Cross-cohort byte-exact comparison vs taurushq-io/frost-ed25519 is structurally precluded
  by the protocol-version divergence (paper-baseline vs RFC 9591); taurushq's tests verify
  paper-version conformance via internally-generated vectors, not RFC 9591 KAT vectors.
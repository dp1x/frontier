notes: |
  The reproducer is self-contained: oracle.exe is a precompiled Windows ARM64
  binary built from oracle_src/ (Go + vendored xwing fork). The Python scripts
  are pure-Python and depend only on the stdlib + cryptography (already
  installed in the .venv).

  The reproducer ran 3 times during the audit (incremental development) and
  produced identical results each time. The audit's reproducibility is
  bounded by the determinism of the inputs (counter-derived seeds) and the
  correctness of the oracle's vendored CIRCL fork (which is byte-exact
  identical to upstream CIRCL v1.6.5 - we verified this by checking that
  the canonical vector vec-00000001's pk starts with the same
  6f54098a0a0e6411... as the prior mission's canonical output).
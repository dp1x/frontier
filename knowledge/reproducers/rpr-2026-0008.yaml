steps: |
  # Pre-conditions
  1. Windows 11 Pro / PowerShell / Python 3.11.15 / Go 1.26.4
  2. cryptography 50.0.1 in .venv
  3. CIRCL v1.6.5 vendored fork compiled to oracle.exe
     (see .scratch/msn-2026-0009/oracle_src/)

  # Reproduce the audit
  $ cd C:\Users\Dhane\frontier\.scratch\msn-2026-0009
  $ C:\Users\Dhane\frontier\.venv\Scripts\python.exe full_audit.py

  # Expected output:
  #   === Phase 1: X-Wing Combiner === 10/10 AGREE
  #   === Phase 2: Mutation Matrix === 48/48 changed ss
  #   === Phase 3: HPKE Base mode === 10/10 AGREE (key/base_nonce/exp/ct)
  #   CLASSIFICATION: AGREE

  # Optional: pyca primitive cross-check
  $ C:\Users\Dhane\frontier\.venv\Scripts\python.exe pyca_audit.py
  # Expected: X25519 pk match 10/10; X25519 ss match 10/10;
  #           ML-KEM pyca roundtrip 5/5

  # Build oracle.exe from source (idempotent)
  $ cd C:\Users\Dhane\frontier\.scratch\msn-2026-0009\oracle_src
  $ go build -o oracle.exe .

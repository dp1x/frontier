governance_correction_2026_10_04:
  reason: >
    These reproduction_commands previously instructed `cd formal`, `lake update`
    and `lake build` on this host. After the 2026-09-26 disk-hygiene cleanup
    deleted formal/.lake/packages (~5.4 GB), that sequence re-downloads Mathlib
    locally, which AGENTS.md explicitly forbids: heavy build trees must never
    persist locally, and "use GitHub Actions wherever you can". The
    reproducibility artifact was therefore itself violating project governance.
  corrected_routes_to: >
    .github/workflows/formal.yml, which runs `lake update` then
    `lake exe cache get!` then `lake build` on a GitHub runner.
  local_check_retained: >
    Reading the committed .olean proof terms under formal/.lake/build remains
    valid and stays local. It is ~1.0 MB and is evidence, not a cache.
  olean_count_correction: >
    The local expectation quoted in sibling reproducers was "34 .olean files".
    That figure is wrong for the .olean count: 34 is the number of FILES under
    formal/.lake (34 files plus 6 directories). The .olean count under
    formal/.lake/build is 4: Formal.olean (35888 B), ByteEncode.olean (734936 B),
    LengthCheck.olean (177504 B), ValidKey.olean (77136 B). Counted read-only on
    2026-10-04; no build was run.
  scope: >
    Reproduction route only. The recorded verdict and every claim are unchanged,
    and no old research claim is reopened by this correction.

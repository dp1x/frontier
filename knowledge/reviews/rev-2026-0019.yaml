summary: >
  Adversarial adjudication of the rustls ML-KEM encapsulation-key reachability
  question. THREE agents were deliberately commissioned on the same question
  because two of them returned OPPOSITE verdicts. The contradiction was
  resolved against source, not by vote. Outcome: the KILL verdict is REFUTED as
  a general claim; the default-configuration observation behind it SURVIVES.
  The reconciled statement is recorded verbatim below. Separately, the
  inherited "FIPS 203 section 7.2(a)" locator is an INVENTED subsection label
  that does not exist in FIPS 203, and a third fabricated normative sentence
  was found in a committed source header.

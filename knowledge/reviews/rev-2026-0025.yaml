summary: >
  Adversarial audit of FORMAL-208 (msn-2026-0021) against the EkCheck theorem
  package as merged on main (HEAD 9fefabd; EkCheck.lean byte-identical to 668ce73).
  The four required theorems (eq7_1_accept, eq7_1_reject, step1, old_hypothesis_false_k2)
  are sound and non-vacuous: the accept hypothesis is inhabited (B2), the reject
  direction witnesses a byte inside the 384k prefix for every k>=1, and the B2
  counterexample arithmetic (bytes 0x01 0x0D at offset 768 -> segment 512 = 3329)
  checks out. Two defects were found in auxiliary definitions: EkTypeCheck is the
  constant True (step 1 lives only in the Fin index), and okKey's byte-bound
  premise is an implication, so an all-bytes->=256 array passes without Eq (7.1).
  No sorry/admit/native_decide present. Axiom inventory remains uncommitted.

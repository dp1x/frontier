title: REV-2026-0008 - Adversarial review of cross-impl X-Wing + HPKE audit
verdict: supports
attack_vectors:
  - attack: "Vendored CIRCL fork might differ from upstream."
    severity: high
    defense: |
      The vendored xwing.go at .scratch/msn-2026-0009/oracle_src/xwing/xwing.go
      is a direct byte-for-byte copy of CIRCL v1.6.5 kem/xwing/xwing.go with
      ONE ADDITIONAL exported function (Components) and a swap of `circl/internal/sha3`
      (a forbidden package) for the stdlib `golang.org/x/crypto/sha3`. The combiner()
      function body, the EncapsulateTo() body, the DecapsulateTo() body, and the
      deriveKeyPair() body are line-for-line identical to upstream.
    counter_verification: |
      The audit's vec-00000001 input (SHA3-256 of "xwing-cross-vec-00000001")
      produces a CIRCL KeyGenDerand output pk starting with bytes
      "6f54098a0a0e6411..." which is byte-exact identical to the canonical
      test vector produced by the prior mission (msn-2026-0008) using
      unmodified upstream CIRCL v1.6.5 via the standard `go get` import.
      This confirms the vendored fork produces byte-exact identical output
      to upstream at least on the keygen operation.
      See .scratch/xwing/reports/canonical.json vs .scratch/msn-2026-0009/full_audit.json
    conclusion: "Attack vector dismissed. Vendored fork is byte-exact identical to upstream on the canonical test vector."

  - attack: "Python HPKE HKDF-Expand-Label structure might differ from RFC 9180."
    severity: medium
    defense: |
      The Python hpke_ref.py implements:
        def hkdf_expand_label(prk, label, info, length):
            full = bytes([length >> 8, length & 0xFF])
            lab = b"HPKE-v1" + label
            full += bytes([len(lab)]) + lab
            full += bytes([len(info) >> 8, len(info) & 0xFF]) + info
            return hkdf_expand(prk, full, length)
      This matches RFC 9180 §5.1's HKDF-Expand-Label structure:
        struct { uint16 length; opaque label<7..255>; opaque info<0..2^16-1>; }
        HKDF-Expand-Label = HKDF-Expand(prk, struct, length)
      Both the length-of-length prefix (2 bytes big-endian for L, 1 byte
      for label length, 2 bytes for info length) match RFC 8446-style TLS
      encoding which RFC 9180 inherits.
    counter_verification: |
      The Python hpke_ref.py and Go oracle.exe both produce byte-exact identical
      16-byte keys, 12-byte nonces, 32-byte exporter_secrets, and pt+tag
      ciphertexts on 10/10 random vectors. If the HKDF-Expand-Label structure
      differed (e.g., missing the "HPKE-v1" prefix, or using a different label
      length prefix width), the keys would differ on the first byte of
      HKDF-Expand output. They don't.
    conclusion: "Attack vector dismissed. HKDF-Expand-Label structures are byte-exact."

  - attack: "Mutation matrix doesn't test X25519 clamping bits."
    severity: low
    defense: |
      True. This audit's mutation matrix mutates the COMBINER inputs
      (ss_M, ss_X, ct_X, pk_X), not the X25519 secret scalar (sk_X). The
      clamping invariant is at the secret-scalar level; once clamping has
      been applied, all downstream values (ss_X, ct_X, pk_X) are post-clamp
      and any bit flip is a fully effective mutation.
    counter_verification: |
      The prior mission (msn-2026-0008) already verified X25519 clamping
      behavior at the secret-scalar level via a different mutation matrix
      (M0_0, M31_5, M31_6, M31_7, M32_0 → same ss; all other positions →
      different ss). The clamping audit is out of scope for this audit
      because this audit's scope is the X-Wing Combiner + HPKE wrapping,
      not the underlying X25519 primitive.
    conclusion: "Attack vector dismissed (with scope clarification). Clamping is verified by msn-2026-0008, not in scope here."

  - attack: "10 vectors is a small sample; could there be a rare bug?"
    severity: medium
    defense: |
      10 vectors is small for statistical purposes, but the audit's
      discriminators are byte-exactness, not statistical. The audit
      tests four independent cross-impl equality predicates (combiner,
      key, nonce, exp_secret, ciphertext) on 10 vectors × 4 predicates =
      40 independent byte-exact comparisons, each of which would catch
      any deterministic impl bug. The mutation matrix adds 48 cells
      of input-sensitivity testing.
    counter_verification: |
      Increasing to 100 vectors would be straightforward (the harness
      is parameterized) but would only marginally increase the audit's
      coverage. The 10-vector pass rate is already 100% across all
      checks, leaving no observed failure surface.
    conclusion: "Attack vector partially accepted (sample size is small but discriminators are deterministic). Out-of-budget for further expansion in this mission."

outcome: |
  Verdict: SUPPORTS.
  All four attack vectors are either dismissed (with cross-checks) or
  acknowledged (with scope/dimension clarification). The audit's core
  claims - that the Python X-Wing Combiner + Python HPKE Base mode
  reference implementations match CIRCL v1.6.5 byte-exactly - are
  independently verified by the reproducer rpr-2026-0008 and the
  verification vrf-2026-0009. No bugs, divergences, or conformance
  failures observed in the audited cells.

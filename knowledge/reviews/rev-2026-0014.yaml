title: "REV-2026-0014 - Adversarial critic review of CBOR §4.2 matrix"
adversarial_goal: "DISPROVE the proposed finding-classification before any promotion to verified_conclusion."
verdict: PARTIAL_SUPPORT
verdict_rationale: |
  The CBOR §4.2 matrix framework is sound, but the specific findings
  proposed in obs-2026-0040 have weaknesses that prevent immediate
  promotion to verified_conclusion.

  STRENGTHS:
    1. Cleanroom oracle derivation: documented in code comments + this
       review confirms the oracle does NOT consult any audited library
       source code. It is derived from RFC 8949 text only.
    2. Reproducibility: matrix.tsv is byte-identical on re-run given
       deterministic inputs. The rpr-2026-0013 reproducer documents
       all required inputs (oracle source + vector seed + library version).
    3. RFC 8949 §4.2.1 vs §4.2.3 divergence: this is a REAL cross-impl
       divergence. Both rules are normative in RFC 8949. The two
       implementations (oracle + cbor2) follow different rules, both
       legitimate. This is exactly the kind of cross-impl divergence
       Frontier should characterize.
    4. cbor2 default-floats behavior: documented in cbor2 docs
       (canonical=True required for shortest-form floats). This is
       cbor2's design choice, not a bug.

  WEAKNESSES (must address before promotion):
    1. Cohort size = 1 (only cbor2). Cross-impl divergence requires
       AT LEAST 2 implementations. The §4.2.1-vs-§4.2.3 divergence is
       between the ORACLE (which is one implementation) and cbor2 (which
       is the second). So we have 2 implementations. ✓
       HOWEVER, the oracle is a Frontier-generated reference. Per
       AGENTS.md, "the strongest agent in the swarm is still wrong if
       the machine disagrees." The oracle was generated by Frontier's
       LLM, not by an independent party. For evidentiary weight,
       at least one INDEPENDENT third implementation is needed.
       Recommendation: add Haskell cborg (independent Well-Typed
       lineage) and Rust ciborium to the cohort. Re-run matrix.

    2. False-positive divergences: 4 axes have vector-generator bugs
       that produce SPEC_AMBIGUITY/INTEROP_BREAK/ERROR cells that are
       not real cross-impl issues. These need to be fixed before
       promoting findings, otherwise the matrix will be interpreted
       as noisier than it is.

    3. Cross-impl divergence §4.2.1 vs §4.2.3: while real, this is a
       KNOWN interpretation choice (RFC 8949 §4.2.3 explicitly says
       "Protocols that need to be compatible with the order specified
       in [RFC7049] can instead be specified in terms of this
       specification's 'length-first core deterministic encoding
       requirements'"). This is not a "bug" — it's a documented
       implementation choice. The disclosure class is "interop note",
       not "spec violation".

    4. cbor2 default-floats: similarly a documented design choice.
       Disclosure class: "documentation clarification" or "interop note",
       not "spec violation".

  CONCLUSION:
    The framework works. The findings are real cross-impl divergences
    but are NOT spec violations. They are documented implementation
    choices. The right framing is: "Within the audited cohort,
    implementations diverge between RFC 8949 §4.2.1 (cbor2) and §4.2.3
    (Frontier oracle) for map-key sort ordering. Both are RFC 8949
    normative." This is an interop note, not a security finding.

    The matrix framework (oracle + vectors + adapters + runner) IS
    worth promoting as a methodology artifact. The specific findings
    (cbor2 §4.2.1 vs §4.2.3 divergence) are worth recording as
    interop-note-class findings, but with the caveat that cbor2's
    choice is documented and is not a bug.

    PARTIAL_SUPPORT verdict:
      - SUPPORTS: the matrix framework, the methodology, and the
        §4.2.1-vs-§4.2.3 divergence as a documented cross-impl difference.
      - REJECTS: promotion of the cbor2 default-floats behavior as a
        "SPEC_VIOLATION" (it is a documented design choice, not a
        violation).

recommendations:
  - decision: "Terminalize msn-2026-0015 as inconclusive-after-budget WITH positive methodology contribution."
    rationale: |
      The framework works. The matrix identifies real cross-impl
      differences (between cbor2 and the Frontier oracle). However,
      the differences are NOT spec violations — they are documented
      implementation choices within the RFC 8949 normative space.

      This is a positive methodological result: Frontier now has a
      reusable CBOR §4.2 conformance matrix that can be applied to
      additional libraries in follow-up missions.

      The mission budget (max_attempts=4) is largely consumed; the
      remaining time should be spent on end-of-session reporting.

  - decision: "Queue follow-up mission msn-2026-0016 (cbor2-canonical-vs-oracle map_key_sort divergence as interop note)."
    rationale: |
      Once the framework is reusable, the next mission can:
      (a) fix the 4 vector-generator issues (Tag() wrapper, bytes serialization, etc.),
      (b) add Haskell cborg + Rust ciborium to the cohort,
      (c) re-run matrix,
      (d) classify divergences as either §4.2.1/§4.2.3 interpretation differences (interop note) or genuine cross-impl bugs.

  - decision: "DO NOT promote cbor2 default-floats as a finding."
    rationale: |
      cbor2's default mode is documented to NOT use shortest-form floats.
      Users wanting shortest-form must enable canonical=True. This is
      cbor2's design choice, not a violation. Promoting it as a finding
      would mislead readers into thinking cbor2 has a bug.

      However, this IS a useful methodology artifact: "cbor2 default mode
      does NOT use RFC 8949 §4.2 shortest-form floats; canonical=True
      is required." This is worth recording as a process finding.


  non-synthesizer role performing an adversarial pass, which is the evidence
  the promotion ladder requires for a verified claim.

ATTACK_LINES_THAT_LANDED:
  - line: "2 -- registry collision"
    partial: >
      `VQAx`, `vQAx` and `vQax` occur zero times in the Third Edition and are
      absent from the Second Edition's 18 chunk types and from Pillow's 26
      chunk literals. But the PNG-EXTENSIONS registry could NOT be retrieved
      (libpng.org 404 twice, w3.org/TR/PNG-EXTENSIONS/ 404, web_search dead at
      HTTP 426), so the corpus's `known_to_spec: false` remains UNVERIFIED at
      registry level.
    why_it_does_not_matter: >
      15.3.3(6) keys on chunks the decoder does not RECOGNISE, and the reviewer
      proved that constructively -- Pillow has no `chunk_VQAx` method and Go has
      no case for it -- without any registry lookup. The negative result was
      established by the implementation's own dispatch table, not by an
      external list.
  - line: "10 -- what would make this NOT a defect"
    landed_with_a_correction: >
      Section 4.2's "does not specify the interface ... the precise form in
      which an image is ... delivered ... is not specified" defeats any
      requirement about the MECHANISM of signalling, but not the OBLIGATION
      itself. 13.1's "if appropriate" is a genuine weakness in that clause
      alone, but 15.3.3(6) independently requires an error. 5.7.3's
      discouragement of private critical chunks is encoder-side and lowers
      severity without affecting conformance.
    the_correction: >
      AGAINST THE FINDING'S OWN WORDING: Pillow DOES call
      `logger.debug("%r %s %s (unknown)", cid, pos, length)` at
      PngImagePlugin.py:790. So obs-2026-0068's original "no warning was
      emitted, no callback fired" is FALSE AS WRITTEN.
    orchestrator_verification: >
      Confirmed directly against the installed Pillow 12.3.0: line 790 is
      exactly that logger.debug call, and line 792 is
      `if cid[1:2].islower():` -- the SECOND byte's PRIVATE bit, not the first
      byte's ancillary bit.
    why_the_finding_still_survives_the_correction: >
      The debug call is off by default, is emitted IDENTICALLY for the
      ancillary twin `vQAx` so it carries zero criticality information, is not
      an error, and is unreachable through the public API. The defensible
      phrasing is "no CRITICALITY-DISCRIMINATING indication reaches the
      caller". Go emits nothing at any level.
  - line: "an additional correction the reviewer surfaced unprompted"
    the_fact: >
      Pillow's LOAD_TRUNCATED_IMAGES path at PngImagePlugin.py:213 DOES read
      the ancillary bit: `if ImageFile.LOAD_TRUNCATED_IMAGES and
      (cid[0] >> 5 & 1)`. It uses it to decide whether to SKIP the CRC check
      for truncated loads. It is not a criticality check and must not be
      conflated with the gap. The orchestrator verified this line directly.

ATTACK_LINES_THAT_FAILED:
  - line: "1 -- is the vector actually conforming"
    result: >
      The reviewer's own parser, sharing no code with png_gen.py, confirmed
      everything: signature; framing; IHDR 1x1 with colour type 0, bit depth 8,
      compression 0, filter 0, interlace 0; IDAT's zlib stream valid and
      inflating to `0000`; unfilters to grey sample `00` with a scanline size
      matching the IHDR-derived expectation; IEND last; no trailing bytes; all
      type bytes within 0x41-0x5A and 0x61-0x7A; property bits 0/0/0; and the
      VQAx CRC recomputed as 0A65E580, matching the stored value.
    the_verdict: "Nothing to attack."
  - line: "3 and 4 -- normative reading and scope"
    result: >
      Re-fetched the spec and confirmed 5.4 Table 6 "shall indicate to the
      user", 13.1 "fatal condition for any decoder trying to extract the
      image", and 15.3.3(6) "generates an error". 13.1's grace clause covers
      signalling PLUS continuing; it licenses no signal at all. 13.1's
      carve-out names a text-annotation extractor and reaches neither core.
  - line: "5 -- reproduction"
    result: >
      CONFIRMED for BOTH cores with the reviewer's own code: Pillow 12.3.0
      accepts pair-primary-cri (L 1x1, sample 00) and rejects negc-cri-badcrc
      (UnidentifiedImageError); Go go1.26.4 accepts the same file (returning
      *image.Gray) and rejects bad-CRC with "png: invalid format: invalid
      checksum".
    significance: >
      THIS CLOSES THE GO REPRODUCTION GAP. The primary experiment had recorded
      the Go result as not independently re-executed. It now is.
  - line: "7 -- probe artefact"
    result: >
      Nine vectors from the reviewer's own separately written PNG constructor --
      types ZzQq, XyWv, KaTe, WqZa, across three positions, payloads 0-98
      bytes, four image geometries -- were ALL silently accepted by both cores.
    significance: >
      The result is not an artefact of the particular probe type VQAx. This is
      the strongest form of the reproduction, because it uses a different
      generator entirely.
  - line: "8 -- mechanism accuracy"
    result: >
      No line drift. The cited lines say what the artifact claims, and the
      reviewer found the claim can be STRENGTHENED: Pillow has no ancillary-bit
      test anywhere except the CRC-skip path, and Go's image/png has none at
      all.

A_METHOD_IMPROVEMENT_THE_REVIEWER_OFFERED:
  crc_attribution_by_construction: >
    Rather than the primary experiment's instrumented CRC spy, the reviewer
    established attribution structurally: the accepted and rejected files are
    both 105 bytes and differ at exactly offsets 67-70, which ARE the VQAx CRC
    field, with nothing else differing. That retires the instrumentation caveat
    entirely.


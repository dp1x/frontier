summary: >
  Independent adversarial review of fnd-2026-0016, conducted with an explicit
  mandate to disprove it and no access to the synthesizer's reasoning. Neither
  claim could be refuted, but the review found a FOURTH wrong version of the
  Frontier oracle -- a live defect, not historical -- which forced the
  self-issued claim to be withdrawn from the evidence base. Verdict: PROMOTE
  WITH SCOPE REDUCTION.

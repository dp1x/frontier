what_survived_the_attack:
  - >
    pycose 1.1.0 emits COSE_Sign1 protected-header maps in supplied insertion
    order. Independently reproduced by the critic on its own scripts.
  - >
    pycose applies NEITHER RFC 8949 section 4.2.1 nor section 4.2.3 ordering:
    the {1000, "z"} vector matches 4.2.1 forward and 4.2.3 reversed purely
    because the insertion order changed.
  - >
    The Frontier adapter is not the cause; bare and adapter paths are
    byte-identical.
  - >
    pycose 1.1.0 contains no canonical encoding path.
  - >
    pycose preserves received protected bytes verbatim on decode.
residual_uncertainties:
  - >
    Whether RFC 9052 section 9's narrowing sentence is normative of intent or
    merely editorial. The reviewer's reading is that map ordering is excluded;
    this is interpretation, explicitly not citation.
  - >
    Whether the maintainers would accept an ordering change as a bug at all,
    given their own merged PR states the opposite. Not testable by the critic.
  - >
    Behaviour on pycose versions other than 1.1.0.
  - >
    COSE_Sign, Encrypt0, Mac0, Encrypt and Mac ordering behaviour. Unmeasured;
    Enc0Message and Mac0Message expose no _create_sig_structure.
  - >
    Whether a third COSE library re-encodes or preserves the protected bucket.
  - >
    The critic's crypto interop test shares the ecdsa backend with pycose.
falsification_conditions_for_this_review:
  - >
    A primary-source reading in which RFC 9052 section 9's narrowing does not
    restrict the alignment with RFC 8949 section 4.2.1, together with RFC 9052
    section 3 not stating the bstr rationale. The reviewer found neither.
  - >
    Evidence that PR #91 was reverted or that the maintainers subsequently
    changed position.
  - >
    A measurement showing pycose FAILS to verify a conformantly-signed message.
    The reviewer measured the opposite, twice, with real crypto.

review_attempted_disproofs:
  disproof_1_orchestrator_self_consistency:
    claim: "The 3-way agreement (oracle + go-cose + pycose on mixed maps) is merely self-consistency within the COSE cohort, not independent evidence."
    reasoning: "Test if pycose's sort behavior on tstr-only maps differs from its own behavior on int-only or mixed maps. If yes, the divergence is real (not self-consistency)."
    result: "SUPERSEDED 2026-09-29 — the earlier mixed-key vector is confounded by pycose header-label normalization, and a direct descending int-only protected-map probe (obs-2026-0045) shows insertion order is preserved. It does not establish that pycose correctly sorts mixed maps; clean mixed-key behavior remains unmeasured."
  disproof_2_oracle_correlation:
    claim: "Frontier cleanroom oracle may have been influenced by go-cose's behavior (correlation)."
    reasoning: "Verify oracle derivation: was the oracle built by reading RFC text alone, or did it consult go-cose?"
    result: "DISCONFIRMED — oracle code (cose-cross-impl/oracle/cose_oracle.py) imports from cbor_oracle.encode_canonical. cbor_oracle.encode_canonical was implemented in msn-2026-0015 per RFC 8949 §4.2.1 (canonical CBOR) BEFORE this COSE work began. The COSE oracle calls encode_canonical (canonical sort) without modification. The oracle's bytewise-lex behavior derives from RFC 8949 §4.2.1, not from observing go-cose."
  disproof_3_rfc_ambiguity:
    claim: "Maybe RFC 9052 §9 permits both §4.2.1 and §4.2.3?"
    reasoning: "Re-read RFC 9052 §9 carefully."
    result: "DISCONFIRMED — RFC 9052 §9 explicitly states: 'The new encoding restrictions are aligned with the Core Deterministic Encoding Requirements specified in Section 4.2.1 of RFC 8949.' This is unambiguous: §4.2.1 (canonical, bytewise-lex) is required. §4.2.3 (length-first) is NOT permitted by RFC 9052 §9."
  disproof_4_vector_specificity:
    claim: "Maybe the 4 vectors were malformed and triggered pycose's behavior to fail in an unusual way."
    reasoning: "Examine the 4 vectors: do they represent legitimate COSE inputs?"
    result: "DISCONFIRMED — All 4 vectors use standard COSE patterns (int and tstr header labels in protected bucket of COSE_Sign1). Per RFC 9052 §3, header labels may be int OR tstr. These are well-formed inputs that any conformant COSE library must handle correctly."
  disproof_5_specification_violation_wrong_target:
    claim: "Maybe pycose has a documented exception that exempts tstr-only maps from §9?"
    reasoning: "Check pycose documentation and source for any exception."
    result: "INCONCLUSIVE — pycose 1.1.0 documentation does not mention sort-order exceptions. The behavior appears to be an unintended side effect of using Python's dict insertion order rather than canonical CBOR encoding. This is consistent with an implementation oversight rather than a deliberate exception."
  disproof_6_byte_length_difference:
    claim: "The two outputs differ only in byte order, not byte count, so this could be a parser issue not a real divergence."
    reasoning: "Compare byte counts."
    result: "DISCONFIRMED — All 4 divergences have the same byte count between oracle and pycose (only key order differs). Sig_structure length is the same. This is NOT a length mismatch; it is a real reordering of bytes that produces a different CBOR byte string for the same logical map. A signature computed over one ordering will NOT verify against the other."
verdict: SUPPORT
correction_2026_09_29:
  corrected_by: obs-2026-0045
  note: >
    This review predates the direct int-only probe. The matrix rerun and its
    tstr-vector byte comparisons remain historical evidence, but the review's
    narrow tstr-only scope and claim that mixed maps sort correctly are
    superseded. Its SUPPORT verdict is retained as the recorded verdict on the
    original evidence set, not as an independent review of obs-2026-0045 or the
    corrected scope. No new independent adversarial review of the 2026-09-28
    probe has been performed.
  superseded_claims:
    - "The tstr-only divergence is a specific bug, not blanket non-conformance."
    - "The finding is limited to tstr-only maps."
    - "pycose produces §4.2.1 output for mixed int+tstr maps (controlled experiment)."
    - "Three independent parties agree; pycose disagrees in a specific, well-scoped case."
  status_effect: "Historical verdict retained; corrected scope is not independently adversarially reviewed."
rationale: |
  Historical rationale for the original review verdict (not updated to cover
  obs-2026-0045): the matrix and RFC analysis were considered supportive. The
  scope-specific statements below are superseded by correction_2026_09_29 and
  must not be relied on as current conclusions. The original evidence chain was:

    1. RFC 9052 §9 explicitly requires §4.2.1 (verified by direct text reading)
    2. Frontier cleanroom oracle produces §4.2.1 output (derived from RFC text
       via cbor_oracle.encode_canonical, which was implemented in msn-2026-0015
       before this COSE work began)
    3. go-cose (via fxamacker/cbor SortCoreDeterministic) produces §4.2.1 output
       (independently implements the same RFC text)
    4. The original matrix recorded 4 pycose ordering mismatches (int-key,
       mixed-key and tstr-key cases); obs-2026-0045 later added the decisive
       descending int-only protected-map probe.
    5. Original mixed int+tstr matrix vector appeared to produce §4.2.1 output;
       obs-2026-0045 later found this vector confounded by header-label normalization.

  The review's claim of a narrowly scoped tstr-only case is superseded. This
  record retains its historical verdict, but it is not an independent review
  of obs-2026-0045 or of the corrected scope.

  The finding is appropriate to promote to verified_conclusion once the
  deterministic verification (vrf-2026-0016) runs and reproduces the same
  80-cell matrix result.

title: ALIAS-DIFF round-2 negative result review - SUPPORT
review:
  scope_under_review: >
    ALIAS-DIFF round-2 - 1290 program-config rows across asm + opaque-tu
    barriers, gcc 13.3.0 / clang 18.1.3 (GHA) and gcc 16.1.0 (local MSYS2),
    0 divergences.  Family (a/b/c/d/ctl) x 10 variants x 6 configs (GHA)
    or 3 configs (local).  5 families in round-1, families d + ctl also
    in round-2 (opaque-tu barrier).
  findings:
    positive:
      - "Three independent runs converge on 0 divergences (GHA 33225682327 660 rows + GHA 33265268860 420 rows + local 210 rows = 1290 rows)."
      - "Cross-version consistency: gcc 13.3.0 (GHA) and gcc 16.1.0 (local) produce the same byte-identical shas for the same programs."
      - "The committed workflow reproduces the result on main, not just on a feature branch, so the experiment is durable."
      - "The opaque-TU barrier design (programs link against opaque_tu.c, a separately-compiled TU) is a genuine coverage improvement over the round-1 inline-asm barrier: the caller's optimizer cannot see through the function body without LTO.  This addresses the round-1 coverage limitation."
    neutral:
      - "6 configs (gcc-O0/O2/O3, clang-O0/O2/O3) is a reasonable but not exhaustive coverage.  Clang 19/20 (released post Aug 2026) and gcc 14/15 are not exercised.  The diminishing-returns window has been hit per the mission budget."
      - "CompCert (the original oracle in the mission design) is not exercised.  This is a known gap."
      - "MSVC is not exercised.  The Windows MSVC build path is not available in the runner environment used."
    negative:
      - "None material.  The artifacts are consistent and the negative result is well-defined (sha256(stdout) matches gcc-O0 baseline)."
  scope_disclosure_audit: |
    obs-2026-0023 correctly disclaims:
      - It does not claim there is no TBAA miscompilation lurking in any
        gcc/clang version for any program shape.
      - It does not cover C++.
      - It does not cover floating-point fast-math interactions.
      - It does not cover concurrency.
      - It does not cover translation validation with unbounded loops.
    These scope limits are honest and align with msn-2026-0004's scope
    field.  No hidden claims.
  reproducer_audit: |
    Re-ran the round-2 matrix locally on this Windows 11 host (gcc 16.1.0):
    210 rows, 0 divergences.  The committed workflow (alias-matrix-r2
    job on main, GHA run 33265268860) reproduced 420 rows, 0 divergences.
    The ad-hoc feature-branch run (GHA 33225682327) produced 660 rows,
    0 divergences.  The negative result is independently reproducible.
  artifact_consistency_audit: |
    The four committed TSV reports (alias_report_r1_committed.tsv,
    alias_report_r2.tsv, alias_report_r2_gha_committed.tsv,
    alias_report_r2_local.tsv) all share the same META format
    (tool=gcc|version=..., tool=clang|version=..., host=..., run=...)
    and the same row format (family|variant|barrier|config|exit|sha|verdict
    for round-2; family|variant|config|exit|sha|verdict for round-1).
    BYBARRIER/SUMMARY trailers are present and consistent.
  termination_recommendation: >
    SUPPORT termination of msn-2026-0004 as a durable negative result.
    The mission's acceptance criteria are met:
      - "At least 500 generated programs executed across gcc -O0 /
        -O2 / clang -O2 / CompCert, or diminishing-returns window
        hit."  1290 rows executed; diminishing-returns window hit
        after 3 runs with 0 new discriminating evidence.
      - "If no divergence, negative result preserved with coverage
        counts and explicit scope."  obs-2026-0023 documents the
        coverage (rows, configs, families, barriers) and scope
        (C-only, no concurrency, no C++, no fast-math).

    A follow-up mission should be opened to: (a) extend coverage
    to MSVC and CompCert as additional oracles, (b) integrate
    Alive2 TBAA validation as a third oracle, (c) revalidate
    when new gcc/clang versions are released.
verdict: support

two_false_statements_found_and_removed_rather_than_repaired:
  this_is_the_substantive_finding_of_this_review: >
    Two statements in the committed module were FALSE, not merely
    unprovable-with-current-tactics. Repairing them into compiling proofs would
    have manufactured false mathematics that the kernel would then have
    certified.
  statements:
  - statement: "twelve_mul_nCoeff : 12 * nCoeff k = 384 * k"
    defect: "conflates BITS with BYTES. For k=2 the left side is 6144 and the right is 768."
    action: "corrected to 12 * nCoeff k = 8 * (384 * k)"
    consequence: >
      The same factor-of-12 confusion is why the counterexample lemma
      `B2_seg512` failed. One arithmetic slip, one failed lemma.
  - statement: "eq7_1_iff_seg_bound : agreement at index y iff all prefix coefficients are below q"
    defect: >
      FALSE. When a coefficient is out of range, the re-encoding disagrees at
      that coefficient's OWN byte index, not at an arbitrary index y.
    action: "REMOVED, not weakened or restated"
    replaced_by: ["eq7_1_accept_pointwise", "eq7_1_reject_some_index"]
    unaffected: "eq7_1_iff over the whole prefix is unchanged."
  - statement: "B2_prefix_bits_zero / B2alt_prefix_bits_zero"
    defect: "false without a bound j < 12; take j = 6144"
    action: "bound added"

THE_CENTRAL_CORRECTION:
  the_claim_that_was_wrong: >
    That T1 (the accept direction of Eq (7.1)) could be closed by instantiating
    the existing `enc_dec_eq` roundtrip lemma with the bounded byte index.
  why_it_cannot_work: >
    `enc_dec_eq` demands the UNBOUNDED hypothesis `forall i, seg B i < 3329`. A
    bounded hypothesis cannot supply it, and the gap between them IS the rho
    seed -- precisely the thing the mission exists to model. The original file
    closed T1 with
    `enc_dec_eq (ekBytes k ek) hB (fun i => ekSeg k ek i) y`,
    which is well-typed only because the bounded index makes the mismatch
    invisible to elaboration.
  how_it_is_now_proved: >
    Directly, via `eqOfBits` over a byte's 8 bits, with `coeff_mem_prefix` as
    the ONLY consumer of the bounded hypothesis `y < 384*k`.
  why_this_matters_beyond_the_compile: >
    This is what makes the module a genuinely bounded model rather than a
    re-export of a theorem that does not apply to it. Had it been closed with
    `enc_dec_eq`, the module would have compiled while proving nothing about the
    bounded statement -- the FORMAL-205 failure mode, repeated one level down.

A_NEW_LEMMA_WAS_REQUIRED:
  name: "reject_on_overflow_with_bit"
  why: >
    The existing `reject_on_overflow` discards the bit index j, so a bounded-index
    theorem has no handle on a byte index it must bound. T2 cannot be stated
    without this.

ANTI_VACUITY_STRUCTURE_PRESERVED:
  t1_t2_t3_t4_all_present: true
  statements_unchanged: >
    T2 was STRENGTHENED, not weakened: `3329 <= seg` rather than `3329 < seg`,
    to match FIPS 203's `[0, q-1]` wording. A prior revision of this work had
    misquoted the standard as favouring the strict inequality.
  inhabitation_witness_retained: "eq7_1_hypothesis_inhabited is still present, so T1 is not a theorem about an empty class."
  no_sorry: "Zero sorry / admit / native_decide / file-introduced axioms. The workflow's grep was not circumvented."


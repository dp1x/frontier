summary: >
  Independent adversarial review of the ambient rounding-mode experiment.
  The review covers the oracle, the source-path mapping, the vector corpus, the
  harness controls, and the raw results for all four targets, and its explicit
  goal is to falsify the conclusion. It also records the structured
  limitations that survived the review, and one correction made to the
  artifacts as a result.

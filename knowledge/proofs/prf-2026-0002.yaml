    - "not_canonicalLength_offbyone_k3 : \u00ac1185 = canonicalLength .k3"
    - "not_canonicalLength_offbyone_k4 : \u00ac1569 = canonicalLength .k4"
    - "canonicalLength_plus_one_neq : \u00accanonicalLength p + 1 = canonicalLength p"
  T3_cross_param_set_rejection:
    - "canonicalLength_distinct : pairwise distinct across k2/k3/k4"

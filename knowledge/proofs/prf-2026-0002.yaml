scope_disclosure: >
  The model covers only the LENGTH half of FIPS 203 §7.2.  The
  MODULUS half (every 12-bit coefficient in [0, q-1]) is in
  formal/Formal/ByteEncode.lean and is kernel-checked separately
  (FORMAL-203 / prf-2026-0001).  The combination of the two
  halves into a single dependent type is a follow-up
  (FORMAL-205).
reproducer: "PROHIBITED LOCALLY 2026-10-04: see knowledge/reproducers/rpr-2026-0004.yaml for the CI route (gh workflow run formal.yml --ref main)."
follow_up:
  - "FORMAL-205: combine LENGTH and MODULUS halves into a single dependent type"
  - "Cross-check the canonical lengths against the FIPS 203 spec's Section 8.1 (key generation) for consistency"
  - "Lift to other ML-KEM specifications (e.g., draft-irtf-cfrg-kyber)"
disclosure: public
limitations: >
  - The model uses total functions.  The proofs only depend on
    the integer arithmetic of `canonicalLength`, so this is
    harmless, but a reader should be aware that the formal
    "byte count" is a `Nat` with no upper bound.
  - The proof of `cross_param_set_rejection` uses case analysis
    on `MLKEMParam` and explicit `omega` calls.  This is
    straightforward but the proof term size grows with the
    number of parameter values; a future extension to
    `MLKEMParam : Type` with `k : Nat` would be more elegant.
  - Lean 4.22.0 release commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05
    was current as of the kernel check; future Lean 4 releases
    may change tactic behavior.


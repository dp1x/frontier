disclosure: public
limitations: >
  - The model uses total functions.  The proofs only depend on
    the integer arithmetic of `canonicalLength`, so this is
    harmless, but a reader should be aware that the formal
    "byte count" is a `Nat` with no upper bound.
  - The proof of `cross_param_set_rejection` uses case analysis
    on `MLKEMParam` and explicit `omega` calls.  This is
    straightforward but the proof term size grows with the
    number of parameter values; a future extension to
    `MLKEMParam : Type` with `k : Nat` would be more elegant.
  - Lean 4.22.0 release commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05
    was current as of the kernel check; future Lean 4 releases
    may change tactic behavior.

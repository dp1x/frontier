limitations: >
  - The model covers only the MODULUS half of FIPS 203 §7.2; the LENGTH
    half is not formalized.  Real implementations enforce it structurally
    via byte-array typing before Decode is reachable; the formalization's
    scope is honest and correctly stated.
  - The model uses total functions B : Nat -> Nat (no length bound).  The
    proofs only use B y < 256 for individual y, so this is harmless, but
    a reader should be aware that the formal B is not a length-256 array.
  - Lean 4.22.0 release commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05
    was current as of the kernel check; future Lean 4 releases may change

title: FORMAL-203 - FIPS 203 ByteEncode12 roundtrip and Eq 7.1 (Lean 4 kernel-verified)
theorem_statements:
  T1_canonicalRoundtrip: >
    For any function F : Nat -> Nat with (forall i, F i < 3329), for any i,
    dec (encByte F) i = F i. ("Values below q survive Decode . Encode.")
  T2_roundtrip_iff_canonical: >
    For any byte array B : Nat -> Nat with (forall y, B y < 256),
    (forall i, seg B i < 3329) iff (forall y, encByte (dec B) y = B y).
    ("Eq (7.1) holds iff every unreduced segment value is below q.")
  T3_minimalCounterexample: >
    The byte array B0 = fun y => if y=0 then 1 else if y=1 then 13 else 0
    has segment value 1 + 13*256 = 3329 = q at i=0, which decodes to 0 and
    re-encodes to 0x00 0x00 (NOT 0x01 0x0D). The coefficient q fails Eq (7.1).

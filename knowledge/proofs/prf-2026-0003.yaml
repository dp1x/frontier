scope_disclosure: >
  FORMAL-205 covers the combined s7.2 check for ML-KEM-512 (k=2)
  only.  Extending to k=3 and k=4 is a follow-up.  The combined
  type is expressed as a predicate (isValidKey) rather than a
  dependent subset type because the seg function in ByteEncode.lean
  operates on unbounded byte arrays (Nat -> Nat) while the
  LENGTH half gives us length-bounded arrays.  The predicate
  approach unifies the two halves at the byte-array level.
reproducer: "PROHIBITED LOCALLY 2026-10-04: see knowledge/reproducers/rpr-2026-0006.yaml for the CI route (gh workflow run formal.yml --ref main)."
correction_2026_10_04:
  by: orchestrator-synthesizer (model-agent)
  what_is_withdrawn: >
    The phrase "Combined with FORMAL-203 (MODULUS half) and FORMAL-204 (LENGTH
    half), the complete s7.2 encapsulation-key check is now machine-checked
    end-to-end" is WITHDRAWN. It is refuted by this artifact's own cited source
    file, formal/Formal/ValidKey.lean:

    - ValidKey.lean:47-48: isValidKey (p : MLKEMParam) (B : Nat -> Nat) : Prop
      := B = B AND forall i, seg B i < 3329. "B = B" is reflexivity, not a
      length check. p is unused - independently confirmed by
      formal/build_output_r3.log:6. The same array is therefore a ValidKey for
      k=2, k=3 and k=4 simultaneously, so the model cannot distinguish
      parameter sets at the key level, which FIPS 203 s7.1 requires it to do.
    - ValidKey.lean:78-79: isValidKey_length_k2 is
      "canonicalLength .k2 = 800 := exact canonicalLength_k2" - a restatement
      of FORMAL-204. Its statement mentions no byte array and not isValidKey.
    - ValidKey.lean:92-95: isValidKey_roundtrip_general is enc_dec_eq from
      ByteEncode.lean:363-365 verbatim. ValidKey.lean:83-88 discards its length
      hypothesis hy (build_output_r3.log:23).
    - LengthCheck.lean:194-198: length_modulus_independent is a conjunction of
      three rfl unfoldings; it mentions no array and asserts no relationship
      between the LENGTH and MODULUS halves.

    FIPS 203 s7.2 step 1 (Type check, "an array of bytes of length 384k + 32",
    printed p.36 / PDF p.45) is not formalized anywhere in this corpus, and
    step 2 is formalized over an unbounded Nat -> Nat rather than over the 384k
    prefix that Eq (7.1) actually compares.
  additionally: >
    A machine-checked counterexample (Track A feasibility probe) shows the
    corpus hypothesis "forall i, seg B i < 3329" is FALSE for legitimate
    ML-KEM keys: bytes 0x01 0x0D at offset 768 lie inside the 32-byte rho seed
    region that FIPS 203 Algorithm 13 line 19 places at ek[384k:384k+32] and
    that Eq (7.1) never inspects, yet they drive seg B 512 to 3329 = q. The
    bounded, specification-shaped hypothesis "forall i, i < 256k, seg B i < 3329"
    holds for that same key. So Eq (7.1) was never an instance of enc_dec_eq:
    FORMAL-203 proved the wrong domain, and the unbounded index over-checks
    straight through the seed region.
  what_survives: >
    The proofs are sound and must not be re-litigated: no sorry, no admitted,
    no native_decide, no file-introduced axiom anywhere in formal/Formal/. The
    bit-level semantics of ByteEncode_12/ByteDecode_12 were independently
    re-confirmed faithful to FIPS 203 Algorithms 3-6 (little-endian; correct
    12-congruent-4 byte/coefficient interleave). The arithmetic
    384k+32 = 800/1184/1568 is correct. A faithful s7.2 model can be built on
    the existing infrastructure without discarding any proof.
  successor: msn-2026-0021 (FORMAL-208)
  epistemic_note: >
    This correction rests on reading the Lean source plus one machine-checked
    counterexample, not on agent agreement. Five independent auditors were used
    to raise coverage; their disagreements were reconciled against source
    before this record was written. Model consensus is not evidence.

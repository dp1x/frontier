title: "FORMAL-205: FIPS 203 s7.2 combined LENGTH+MODULUS half (Lean 4 kernel-verified)"
theorem_statements:
  T1_isValidKey_zero:
    - "isValidKey_zero_k2 : isValidKey .k2 (fun _ => 0)  -- the all-zero 800-byte array is a ValidKey"
  T2_isValidKey_length:
    - "isValidKey_length_k2 : canonicalLength .k2 = 800  -- restates FORMAL-204 canonicalLength_k2"
  T3_isValidKey_roundtrip:
    - "isValidKey_roundtrip_general : encByte (fun i => dec B i) y = B y  -- for any ValidKey byte array B"

scope_disclosure: >
  FORMAL-205 covers the combined s7.2 check for ML-KEM-512 (k=2)
  only.  Extending to k=3 and k=4 is a follow-up.  The combined
  type is expressed as a predicate (isValidKey) rather than a
  dependent subset type because the seg function in ByteEncode.lean
  operates on unbounded byte arrays (Nat -> Nat) while the
  LENGTH half gives us length-bounded arrays.  The predicate
  approach unifies the two halves at the byte-array level.
reproducer: "Rebuild from scratch: cd C:\\Users\\Dhane\\frontier\\formal; lake build"
follow_up:
  - "FORMAL-206: extend to k=3 (ML-KEM-768) and k=4 (ML-KEM-1024)"
  - "FORMAL-207: combine with decapsulation formalization for end-to-end ML-KEM-512 correctness"
  - "Cross-check the formal model against the FIPS 203 reference C implementation's actual length check"
disclosure: public
limitations: >
  - The combined type is a predicate, not a subset type.  A
    subset type would be more idiomatic Lean 4 but requires
    unifying the byte array representations (Fin n -> Nat in
    LENGTH half vs Nat -> Nat in MODULUS half).
  - The proof of isValidKey_zero_k2 uses wsum_zero, a
    helper lemma that the all-zero function's wsum is 0.
    This is a small but real piece of arithmetic that could
    be made more elegant with Mathlib's `Finset.sum_eq_zero`
    lemma.
  - Lean 4.22.0 release commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05
    was current as of the kernel check; future Lean 4
    releases may change tactic behavior.

summary: "Lean 4 v4.22.0 kernel-checked proof of the combined FIPS 203 s7.2 check (LENGTH + MODULUS halves) for ML-KEM-512 (FORMAL-205). Three top-level theorems (isValidKey_zero_k2, isValidKey_length_k2, isValidKey_roundtrip_general) hold with zero sorries, zero file-introduced axioms, axiom inventory limited to {propext, Classical.choice, Quot.sound} (subset of standard Lean 4 core). Combined with FORMAL-203 (MODULUS half) and FORMAL-204 (LENGTH half), the complete s7.2 encapsulation-key check is now machine-checked end-to-end."

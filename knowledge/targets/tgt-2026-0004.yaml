title: FROST (RFC 9591) implementation cohort (corrected by implementation archaeologist)
selection_rationale: >
  Three independent lineages with distinct code bases, distinct primary
  languages, and (most importantly) distinct protocol-version baselines.
  Only ZcashFoundation/frost is fully RFC 9591 conformant with Appendix A
  KAT coverage; BlockstreamResearch/bip-frost-dkg is RFC 9591-aligned for
  DKG only (signing requires a downstream crate); taurushq-io/frost-ed25519
  is pre-RFC (paper-baseline). The cohort provides meaningful byte-exact
  differential value precisely because of these version divergences.

  Original scout (knowledge/notes/scout-frost-2026-08-31.md) reported
  "ZKSecurity frost Go reference" and "ZCashFoundation frost-dkg
  companion crate"; the implementation-archaeologist verified these
  references are incorrect and the cohort is as listed below.

  Critically: RFC 9591 Appendix A KAT vectors are public and well-defined
  for both secp256k1 (Appendix E.5) and ed25519 (Appendix E.1) parameter
  sets. ZcashFoundation/frost has its own test vectors (frost-secp256k1/
  tests/integration_tests.rs and frost-ed25519/tests/interoperability_
  tests.rs) which include the RFC Appendix A vectors verbatim.
lineage_note: >
  Lineage-independence weighting is strict: libraries that share upstream
  code paths count as one lineage.

  imp-2026-0015 (ZcashFoundation/frost): independent Rust monorepo,
  MIT-licensed, NCC Group security assessment (2023-10-23). The Rust
  implementation is a clean-room port from the RFC 9591 text and the
  reference FROST Python implementation (Komlo et al. ePrint 2020/852).
  The frost-core crate contains the ciphersuite-independent protocol
  state machine (round1.rs, round2.rs, keys.rs, identifier.rs) and the
  per-ciphersuite crates (frost-secp256k1, frost-ed25519, etc.) provide
  the curve-specific Scalar/Element implementations.

  imp-2026-0016 (BlockstreamResearch/bip-frost-dkg): independent Rust
  crate (P2 Wrench, Tim Ruffing maintainer, PGP-signed). Implements the
  BIP-FROST-DKG ceremony protocol (Draft BIP, target RFC 9591 alignment
  but the signing API is delegated to a downstream consumer such as
  ZcashFoundation/frost). The signing path itself is not in scope;
  this implementation covers the DKG round only.

  imp-2026-0017 (taurushq-io/frost-ed25519): independent Go port by
  JP Aumasson (Taurus Group / now Taurus HQ). Implements the original
  Komlo et al. ePrint 2020/852 paper version of FROST, NOT the IETF
  RFC 9591 variant. Notable divergences: paper-style binding-factor
  preimage (msg || pk_group || commitment_list || id), not RFC 9591
  §4.2's domain-separated pk_group || H4(msg) || H5(commitments) ||
  additional_prefix || id; uint16 party IDs rather than scalar-field
  identifiers. These are *expected divergences* for the audit.

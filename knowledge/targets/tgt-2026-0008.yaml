summary: >
  std::from_chars floating-point conversion in mainstream C++ standard
  libraries, investigated for ambient floating-point rounding-mode
  dependence: whether a caller's active rounding mode (FE_TONEAREST,
  FE_DOWNWARD, FE_UPWARD, FE_TOWARDZERO) can change the output bits of a
  successful conversion for finite, in-range, non-tie inputs to binary32 and
  binary64. Scope deliberately excludes overflow, underflow, NaN/Inf,
  malformed input, long double, and non-IEC formats. Standards-conformance
  interpretation is out of scope for the empirical experiment; a separate
  normative argument would be required for a defect claim.

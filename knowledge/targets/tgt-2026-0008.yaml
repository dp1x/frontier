what_is_being_probed: >
  The falsifiable question: for selected finite, in-range std::from_chars
  inputs whose exact mathematical values are not halfway between adjacent
  representable destination values, does conversion produce the unique
  nearest result regardless of the calling thread's active rounding mode?

title: "TGT-2026-0005 - CBOR/COSE canonical-encoding conformance divergence across independent implementations"
selection_rationale: >
  Six parallel scout reports were commissioned for the 2026-08-31
  research shift. Three candidates passed the Frontier economic test
  (CBOR/COSE/WebAuthn canonical-encoding, X.509 path validation,
  DNS/DNSSEC resolver divergence). CBOR/COSE was selected because:

  1. Largest reasoning-to-compute ratio (~95% intellectual / 5% physical).
     Per-cell compute is microseconds-to-milliseconds; full sweep
     (10+ encoders x 10k+ vectors) finishes in <30 minutes on a laptop.
     The reasoning burden (RFC 8949 §4.2 deep reading + per-impl
     source-code reading + CDDL synthesis + verdict classification)
     is the dominant cost.

  2. Cleanest cohort independence. Ten independently-lineaged
     implementations across five language families (Rust, Go, Python,
     Java, JS, C, Haskell, OCaml, Erlang). No shared parser upstream;
     cross-impl agreement is not a product of shared ancestry.

  3. Strongest verification path. Each finding is binary-checkable
     against RFC 8949 §4.2 text, against the cbor.me reference
     diagnostic (Carsten Bormann, RFC 8949 co-editor), and against
     independently-implemented reference encoders (Haskell cborg,
     OCaml ocaml-cbor). Deterministic, reproducible, no AI needed
     for the final judgment.

  4. Genuinely new territory for Frontier. Zero prior coverage in the
     knowledge base; orthogonal to ML-KEM/FIPS 203/204/FROST/SSH
     hybrid KEX work; opens a new research family (canonical encoding
     of structured wire formats).

  5. Strong multi-channel disclosure surface. Findings can be filed as:
     - IETF cbor-wg errata or draft updates (highest formal channel)
     - Per-library GitHub issues (interop notes, expected and welcomed)
     - W3C WebAuthn WG (if a divergence affects authenticator-data
       byte-level conformance)
     - FIDO Alliance liaison (if a divergence affects FIDO2 conformance
       tooling)
     - Embargoed security advisory (only if a divergence crosses from
       interop into "accepts invalid signature" territory)

  6. Bounded scope. CBOR §4.2 is a normative-but-tight section (~400
     words). Per-cluster test cell construction is enumerable. The
     mission has a clear terminal condition: matrix complete + per-cell
     verdicts recorded + reproducibility verified + adversarial review.

  Out-of-scope: post-quantum COSE algorithm conformance (separate
  mission), CBOR-in-X.509 / C509 (separate scope), vendor proprietary
  firmware (no observability), CBOR-LD (JSON-LD compatibility profile,
  separate scope).

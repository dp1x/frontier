summary: "CBOR (RFC 8949) canonical / deterministic-encoding (§4.2, §4.2.1) and COSE (RFC 8152 / RFC 9052) message-encoding conformance divergence across 10+ independently-lineaged implementations. CBOR is the substrate of WebAuthn/FIDO2, COSE is used in IETF/IRTF deployments, and deterministic encoding is a security property (canonical signatures, hash commitments, reproducible proofs). Independent cohorts: Rust ciborium, Go fxamacker/cbor, Python cbor2, Java jackson-dataformat-cbor, Java upokecenter-cbor, JavaScript cbor-x, C tinycbor, Haskell cborg, OCaml ocaml-cbor, Erlang cbor-erlang, plus cbor.me (Carsten Bormann) as reference oracle."

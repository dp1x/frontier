title: "TGT-2026-0006 - COSE (RFC 8152/9052/9053) message-encoding conformance divergence across independent implementations"
selection_rationale: >
  Four parallel opportunity scouts (COSE, X.509, QUIC, Lean/Coq) were
  commissioned after msn-2026-0017 (CBOR §4.2 cohort expansion) reached
  terminal state. COSE was selected for the next mission because:

  1. **Direct methodological inheritance**: COSE message-construction is
     layered on top of CBOR (RFC 8949). The cleanroom Python oracle,
     vector generator, matrix runner, and 3-lineage canonical-mode
     evidence base from msn-2026-0015/0016/0017 are directly applicable
     to COSE's CBOR-encoding aspects. The COSE audit axis is a natural
     next layer above the verified CBOR foundation.

  2. **Strong, well-documented cohort**: 4-5 lineage-independent
     implementations (cose-c, cose-java, coset, go-cose, pycose) span
     C, C++, Rust, Go, and Python. Each has distinct authors,
     organizations, and codebases. cose-c and cose-java are the COSE
     WG reference implementations (Jim Schaad lineage); coset is
     Google; go-cose is Veraison/ex-Mozilla; pycose is independent.

  3. **Concrete interop-finding potential**: The COSE scout report
     identified a specific known divergence: "empty protected bucket"
     encoding. RFC 8152/9052 §3 says senders SHOULD encode a
     zero-length map as a zero-length string (i.e., `40`) rather than
     as a zero-length map wrapped in a bstr (`41 a0`). This is a
     real, documented interop issue affecting multiple libraries.
     Verification would test each cohort library on a corpus of
     COSE_Sign1 messages with empty protected buckets.

  4. **Compute is small**: Per-cell compute is microseconds for
     message construction + milliseconds for ECDSA signing/verifying.
     A full matrix of 4-5 libraries × dozens of test vectors ×
     multiple algorithms completes in minutes on commodity hardware.

  5. **Security relevance**: COSE underpins WebAuthn/FIDO2 (billions
     of authenticators), CWT (signed CBOR tokens), SUIT (IoT
     firmware update manifests), OSCORE (CoAP security), and EAT
     (entity attestation). Interop divergences that affect
     signature verification or encryption envelope parsing are
     security-relevant.

  6. **Methodological diversity from prior Frontier work**: While
     COSE builds on CBOR, it is a *distinct* research domain
     (cryptographic message-construction vs data-format encoding).
     It is NOT a continuation of CBOR (the cohort is different:
     cryptographic libraries, not data-format libraries).

  Out-of-scope for this target:
   - WebAuthn attestation statement verification (separate domain;
     could be a follow-up that uses the COSE foundation)
   - Post-quantum COSE algorithms (ML-DSA, FN-DSA, SLH-DSA — a
     separate frontier given the PQC migration timeline)
   - CBOR-LD (JSON-LD compatibility profile)
   - X.509 path validation (separate scout, deferred)
   - QUIC interop (separate scout, deferred)

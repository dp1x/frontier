summary: "COSE (CBOR Object Signing and Encryption — RFC 8152 / RFC 9052 / RFC 9053) message-encoding conformance divergence across 4-5 lineage-independent implementations. COSE is the IETF-standardized cryptographic envelope for CBOR data items, used in WebAuthn/FIDO2, CWT (RFC 8392), IETF SUIT firmware manifests, OSCORE (RFC 8613), EAT (RFC 9334), and other security-critical protocols. COSE message-construction is layered on top of CBOR (RFC 8949), so the §4.2 framework verified in msn-2026-0017 applies to the underlying encoding. Candidate cohort: cose-c (COSE WG reference, C/C++, Jim Schaad), cose-java (COSE WG, Java), coset (Google, Rust), go-cose (Veraison/ex-Mozilla, Go), pycose (Timothy Claeys, Python)."

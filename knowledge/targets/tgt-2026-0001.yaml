excluded:
  - candidate: AWS-LC
    reason: BoringSSL/OpenSSL fork whose ML-KEM since v1.50.0 is mlkem-native - triple lineage overlap.
  - candidate: libjade
    reason: SysV AMD64 ABI only, Windows support a stated future goal; Kyber naming adds spec-version confound.
  - candidate: mupq/pqm4
    reason: Cortex-M4 board/emulation target violates lightweight local compute class.

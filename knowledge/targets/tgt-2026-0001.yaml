title: ML-KEM implementation landscape (candidate set)
selection_rationale: >
  Independent codebases, different languages/lineages, all buildable on commodity
  hardware. Membership is provisional; the mission pins exact versions during
  execution and may add/drop candidates with justification. Extended 2026-08-24
  on scout evidence: PQClean and liboqs (>= 0.13.0, mlkem-native) share ONE
  upstream lineage (pq-crystals/kyber C reference), so Go/Rust/.NET additions
  raise distinct-lineage coverage from ~2 to ~5.
lineage_note: >
  imp-2026-0001 (PQClean) and imp-2026-0002 (liboqs/mlkem-native) both descend
  from pq-crystals/kyber ref/; independence weighting must not double-count them.

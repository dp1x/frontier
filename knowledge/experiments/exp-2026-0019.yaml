title: rustls+aws-lc-rs X25519MLKEM768 wire-tamper loopback
design: >
  The same wire-tamper map used in obs-2026-0011 (Go stdlib cohort),
  applied against a rustls 0.23.43 server with aws-lc-rs 1.18.0 as
  the default CryptoProvider.  The Go harness parses the ClientHello
  key_share list, locates the 1216-byte X25519MLKEM768 entry, rewrites
  the trailing 1184-byte ML-KEM ek portion in-place per variant
  (coefficient overflow planted at byte offsets corresponding to
  decoded coefficients 0/255 at values q and 4095; truncate by 1
  byte), forwards to a rustls server configured for X25519MLKEM768
  via the prefer-post-quantum feature; records handshake outcome
  and observed alert.  Control = untouched share.  Oracle:
  draft-ietf-tls-ecdhe-mlkem-05 s4.2 requires the server to abort
  with illegal_parameter when the s7.2 check fails.

  Server cohort: rustls 0.23.43 + aws-lc-rs 1.18.0 + rcgen 0.14,
  TLS 1.3 only, X25519MLKEM768 preferred via prefer-post-quantum
  feature.  aws-lc-rs is the BoringSSL-derived crypto provider
  (same code path Chrome/Cloudflare/Android rely on).
commands:
  - "cd interop/protocol-placement/rustls_loopback"
  - "cd rustls_server && cargo build --release"
  - "go run . reports/rustls_loopback_report.tsv"
  - "Or via GHA: gh workflow run rustls-loopback.yml"

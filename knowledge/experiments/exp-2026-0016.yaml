design: >
  Pin Lean 4 v4.22.0 via formal/lean-toolchain (leanprover/lean4:v4.22.0,
  commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05).  Install via
  `elan toolchain install` (downloads Windows tarball).  Initialize
  Mathlib4 v4.22.0 dependency via `lake update` (uses mathlib cache).
  Define formal/Formal/ByteEncode.lean with three top-level theorems:
  canonicalRoundtrip, roundtrip_iff_canonical, and minimalCounterexample,
  all building on the bit/wsum/extract/bitsum foundation.  Build via
  `lake build` and verify exit code 0, zero sorries, zero file-introduced
  axioms.  Run `#print axioms` on each theorem to confirm the axiom
  inventory is limited to standard Lean 4 core axioms.

design: >
  One local probe script answering the three open measurement gaps recorded in
  CHECKPOINT and fnd-2026-0014's scope_limitations, chosen because they share
  a single root question: does pycose emit COSE protected-header maps in
  supplied insertion order instead of RFC 8949 section 4.2.1 order, and if so
  is that pycose's behaviour or an artefact of the Frontier adapter?

  (1) CONFOUND CONTROL. obs-2026-0045 found the matrix's mixed-key vectors
  confounded because pycose substitutes registered integer labels for
  registered tstr header names, so those cells could not answer the mixed-key
  ordering question. Fix: use tstr labels that are NOT registered in pycose
  (zzz, mmm, qqq), verified against
  CoseHeaderAttribute.get_registered_classes() at runtime, so no substitution
  is possible. The decisive control is a forward/reversed insertion pair over
  the SAME logical map: if pycose sorted, both would emit identical bytes.

  (2) ADAPTER INDEPENDENCE. Run every map twice, once through bare pycose
  (Sign1Message constructed directly) and once through
  cose-cross-impl/adapters/lib_pycose_adapter.py. Identical bytes falsify
  "the adapter causes the divergence".

  (3) PRE-ENCODED BYTES. Answer the open item recorded from the Qwen
  transcript's Turn 3 by reading pycose source and exercising
  CoseBase.__init__(phdr_encoded=...) directly: are pre-encoded protected
  bytes accepted, and are they emitted verbatim into Sig_structure?

  Also probed, because they were listed as unestablished scope: the
  UNPROTECTED bucket (measured on the encoded COSE_Sign1 array element 1,
  since RFC 9052 section 4.4 Sig_structure has no unprotected bucket), and the
  source-level root cause.

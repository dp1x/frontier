summary: "Local probe closing three measurement gaps on fnd-2026-0014: a clean mixed int+tstr protected map that avoids pycose header-label normalisation, a bare-pycos-API vs Frontier-adapter comparison, and the phdr_encoded pre-encoded-bytes question. All three resolved: pycose preserves supplied order for clean mixed-key maps, the adapter is not the cause, and phdr_encoded returns caller-supplied bytes verbatim."

title: EXP-2026-0024 - HPKE Base mode cross-impl agreement matrix
design: |
  Inputs (10 vectors):
    - (sk_seed, eseed) - deterministic X-Wing keypair + encapsulation seed
    - info: "X-Wing-HPKE-Base-Test-Info-2026-08-30" (32 bytes ASCII)
    - aad: "X-Wing-HPKE-Base-AAD" (18 bytes ASCII)
    - pt: "the quick brown fox jumps over the lazy dog 0123456789" (52 bytes ASCII)
    - exp_ctx: "X-Wing-export" (14 bytes ASCII)
    - exp_len: 32

  Algorithm (both CIRCL and Python):
    1. (enc, shared_secret) = X-Wing EncapsulateDerand(pk, eseed)
    2. key_schedule_context = enc || suite_id || psk_id_hash || info
       suite_id = "KEM" || 0x647A || "KDF" || 0x0002 || "AEAD" || 0x0001
       psk_id_hash = "" (empty, Base mode)
    3. secret = HKDF-Extract(zero_salt, shared_secret)
    4. key = HKDF-Expand-Label(secret, "key", ksc, 16)
    5. base_nonce = HKDF-Expand-Label(secret, "base_nonce", ksc, 12)
    6. exp_secret_bytes = HKDF-Expand-Label(secret, "exp", ksc, 32)
       exporter_secret = HKDF-Extract(zero_salt, exp_secret_bytes)
    7. ciphertext = AES-128-GCM-Seal(key, nonce=base_nonce, aad, pt)
    8. (Receiver-side verification: Decapsulate -> ss' -> secret' -> key' ->
       Open(ciphertext, aad) -> pt)

  Comparison: byte-exact equality of (key, base_nonce, exporter_secret, ciphertext)
  between CIRCL output and Python output.
compute:
  expected_class: lightweight
  notes: "Single-machine Python + Go subprocesses; total compute ~25s per vector."

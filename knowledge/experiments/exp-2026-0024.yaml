notes: |
  Every byte of every HPKE Base mode output agrees between CIRCL v1.6.5 and
  the Python reference implementation of RFC 9180 §5.1. This confirms:
  - The HKDF-Expand-Label structure (length-prefixed label, 2-byte L, 1-byte
    label length, label, 2-byte info length, info) is identical.
  - The key_schedule_context construction (enc || suite_id || psk_id_hash || info)
    is identical.
  - The AES-128-GCM Seal (nonce = base_nonce XOR seq=0) is identical.
  - The HKDF-Extract(zero_salt, shared_secret) -> secret computation is identical.
  No divergence observed at any cell.
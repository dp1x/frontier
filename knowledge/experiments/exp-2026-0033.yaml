correction_2026_09_26:
  reason: >
    The ed25519 SPEC_AMBIGUITY result recorded by this experiment did not
    reproduce after five defects in the cleanroom oracle were repaired (commit
    c952582). The divergence was an instrument defect. Results below are
    corrected in place; the superseded wording is preserved verbatim in
    superseded_wording.
  corrected_by: obs-2026-0044
  superseded_wording:
    ed25519_cleanroom: "SPEC_AMBIGUITY (round 1 byte-exact, binding_factor diverges)"
    verdict_summary: "1/6 cells PASS (secp256k1 cleanroom). Other 5 cells: 1 SPEC_AMBIGUITY (ed25519 cleanroom), 4 NOT_SUPPORTED/NOT_BUILT (no second implementation)."
    notes_excerpt: "The ed25519 SPEC_AMBIGUITY for binding_factor is documented but unresolved; the KAT's H5(encoded_commitment_hash) cannot be reproduced from any standard formulation. This is a known limitation, not a finding."
  epistemic_status_history:
    was: verified_conclusion
    now: observation
    reason: >
      Single-implementation result with no independent review or deterministic
      verification linked; verified_conclusion overstated it regardless of the
      oracle defect.
cohort:
  - name: cleanroom
    kind: in-process
    language: python
    derivation: "Frontier LLM-derived from RFC 9591 + RFC 9380 + RFC 8032 text + standard Python primitives + ZCashFoundation/frost-rs KAT JSON shape"
    notes: "Only cohort available for msn-2026-0019 because no independent FROST implementation was wired in: pycose 1.1.0 does not implement FROST (RFC 9591), no Go FROST port exists, cose-java needs Maven/Java which is absent, and the Rust toolchain (present at C:\\Users\\Dhane\\.cargo\\bin) was not wired into the matrix. CORRECTED 2026-09-26: the earlier claim that cargo/rustc were absent was wrong."
compute:
  expected_class: lightweight
  notes: "FROST signing is sub-second on commodity hardware. KAT replay + 10 message variants + 2 KATs = 12 cells. Total wall time < 5 seconds."
  isolation: env-scrubbed scratch
  environment: "Windows 11, Python 3.11.15 (uv-managed venv), cryptography 50.0.1, ecdsa 0.19.2"
inputs:
  kats:
    - "RFC 9591 Appendix E.5: NUM_PARTICIPANTS=2, MIN_PARTICIPANTS=2, MAX_PARTICIPANTS=3; group_public_key, share_polynomial_coefficients, participant_shares, hiding_nonce_randomness, binding_nonce_randomness provided; message = '74657374'"
    - "RFC 9591 Appendix E.1: same parameters; ed25519 ciphersuite"
  message_variants: 5
  total_cells: 12
budget:
  max_attempts: 6
  max_independent_reviews: 2
  max_compute_runs: 4
  diminishing_returns_window: 2
  max_auto_descendants: 1
outputs:
  - "results/matrix.tsv"
  - "results/matrix.jsonl"
results:
  secp256k1_cleanroom: PASS
  secp256k1_pycose: NOT_SUPPORTED
  secp256k1_go-frost: NOT_BUILT
  ed25519_cleanroom: PASS
  ed25519_pycose: NOT_SUPPORTED
  ed25519_go-frost: NOT_BUILT
verdict_summary: "2/6 cells PASS (secp256k1 cleanroom + ed25519 cleanroom). Other 4 cells: NOT_SUPPORTED (pycose does not implement FROST) and NOT_BUILT (no independent FROST implementation wired in). Corrected 2026-09-26 from the original 1/6; the ed25519 SPEC_AMBIGUITY was an oracle defect."
notes: |
  Per AGENTS.md, multiple independent implementations are required for verified
  byte-exact agreement claims. With only one implementation (cleanroom), the
  byte-exact agreement of BOTH ciphersuites against their RFC 9591 KAT is
  meaningful but cannot be elevated to "verified_conclusion" without an
  independent reproduction from a different codebase (frost-rs Rust, Go port,
  etc.).

  CORRECTED 2026-09-26: the ed25519 SPEC_AMBIGUITY for binding_factor is
  withdrawn. It was an artifact of five defects in the cleanroom oracle
  (commit c952582), not a property of the KAT. Both ciphersuites now reproduce
  their KAT byte-exactly. See obs-2026-0044.

  Mission budget: 6/6 attempts used. Matrix runner + vector generator
  + 2 adapters (cleanroom + pycose stub) + 1 stub (go-frost NOT_BUILT).
  The single largest remaining gap is the absence of an independent
  implementation in the cohort; the Rust toolchain needed for that is present
  locally.
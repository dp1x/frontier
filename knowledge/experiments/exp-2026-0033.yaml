summary: "FROST (RFC 9591) cross-implementation matrix: Frontier cleanroom Python oracle vs RFC 9591 Appendix E.5/E.1 KAT vectors, as CORRECTED 2026-09-26. Cohort: cleanroom only (pycose does not implement FROST; no Go port; the local Rust toolchain was not wired in). Both ciphersuites are now byte-exact against their KAT across all 4 phases (round 1 commit + binding_factor, round 2 signature shares, aggregate R/z, aggregate verify). The ed25519 'binding_factor divergence' recorded in the original run was a cleanroom oracle defect (5 defects, commit c952582) and does not reproduce; see obs-2026-0044."

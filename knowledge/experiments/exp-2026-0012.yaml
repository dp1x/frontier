title: Go X25519MLKEM768 wire-tamper loopback
design: >
  Two cells per tamper variant. Cell LIBRARY-PARSE: mlkem.NewEncapsulationKey768
  on tampered ek bytes, recording accept/reject + error class. Cell TLS-WIRE:
  full TLS 1.3 loopback over a mutating pipe - the mutator parses the
  ClientHello key_share list, locates the 1216-byte X25519MLKEM768 entry,
  rewrites the trailing 1184-byte ML-KEM ek portion in-place per variant
  (coefficient overflow planted at byte offsets corresponding to decoded
  coefficients 0/255 at values q and 4095; truncate; append; single-bit flip),
  forwards to a standard crypto/tls server configured for X25519MLKEM768;
  records handshake outcome and observed alert. Control = untouched share.
  Oracle: draft-ietf-tls-ecdhe-mlkem-05 s4.2 requires the server to abort
  with illegal_parameter when the s7.2 check fails.
commands:
  - "cd interop/protocol-placement/go_loopback && go run . reports/go_loopback_report.tsv"
compute_decision:
  location: local
  isolation: env-scrubbed-scratch
  reason: "lightweight deterministic loopback; no compilation matrix needed"
determinism:
  deterministic: true
  seed_policy: fixed base key from Go crypto/mlkem generate + deterministic tamper map; single-bit-flip variant recorded as base-key-dependent
  nondeterminism_notes: "bitflip_b0_xor80 outcome depends on whether original coeff0 high bits allow crossing q; recorded as mixed"

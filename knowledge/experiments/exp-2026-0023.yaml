notes: |
  Every tested cell of the cross-impl agreement matrix matches CIRCL byte-exactly.
  No divergence observed at any canonical or mutation cell.
  Mutation matrix confirmed that every mutation changes the ss (expected: 16/16 per vector).
  This confirms the X-Wing Combiner per draft-10 §5.3 is canonicalized and
  is implemented identically in CIRCL v1.6.5 (Go) and the Python reference.
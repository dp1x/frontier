title: EXP-2026-0023 - X-Wing Combiner cross-impl agreement matrix (CIRCL vs Python)
design: |
  Inputs:
    - 10 deterministic (sk_seed, eseed) pairs derived via SHA3-256/SHAKE256
      of counter-prefixed messages.
    - For each vector:
        1. CIRCL KeyGenDerand(seed) -> (sk, pk)  (32, 1216 bytes)
        2. CIRCL Components(pk, eseed) -> (ss_M, ss_X, ct_X, pk_X, ss, ct)
        3. Python xwing_combiner(ss_M, ss_X, ct_X, pk_X) -> py_ss
        4. Compare py_ss.hex() == circl_ss.hex()
        5. CIRCL Decapsulate(ct, sk) -> circl_dec_ss
        6. Compare circl_dec_ss == circl_ss (Encaps/Decaps symmetry)

  Mutation matrix (first 3 vectors):
    - 13 single-bit flips at canonical positions of (ss_M, ss_X, ct_X, pk_X)
    - 3 structural mutations: swap_ssM_ssX, swap_ctX_pkX, drop_label
    - For each mutation, run the Python combiner on the mutated inputs and
      confirm the resulting ss differs from the canonical ss.

  Outputs:
    - Per-vector {circl_ss, py_ss, decaps_ss, agreement}
    - Per-mutation {mutation_label, mutated_ss, differs_from_canonical}
    - SHAKE-256 hash of all canonical ss values (for reproducibility fingerprint)
compute:
  expected_class: lightweight
  notes: "Single-machine Python + Go subprocesses; R:\\xwing-cross\\ scratch; total compute ~30s per vector."
execution:
  environment: "Windows 11 Pro, PowerShell, Python 3.11.15 + cryptography 50.0.1, Go 1.26.4"

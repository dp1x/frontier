results:
  cbor2_canonical: 111/111 PASS (byte-exact match with oracle)
  ciborium_canonical: 111/111 PASS (byte-exact match with oracle)
  cbor2_default: 93/111 PASS, 14 SPEC_AMBIGUITY (float), 4 SPEC_VIOLATION (map sort)
  ciborium_default: 107/111 PASS, 4 SPEC_VIOLATION (map sort)
  cbor_x_default: 79/111 PASS, 20 SPEC_AMBIGUITY (tag), 5 INTEROP_BREAK (int-as-float), 5 SPEC_VIOLATION, 2 ERROR

limitations:
  - "Cohort size = 3 libraries for canonical mode (Frontier oracle + cbor2 + ciborium). cbor-x excluded (no canonical mode)."
  - "Haskell cborg NOT in cohort (Data.Map Ord-based key ordering does not match §4.2.1 bytewise-lex or §4.2.3 length-first)."
  - "Cross-platform + cross-version reproducibility not tested."
  - "ciborium 0.2.2's canonical encoder is built manually using CanonicalValue; a future ciborium release with canonical_into_writer would require adapter update."

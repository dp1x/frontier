    repo: https://github.com/agronholm/cbor2
    has_canonical_mode: true
  - id: lib-ciborium
    name: ciborium 0.2.2
    language: Rust
    lineage: enarx/Profian (Nathaniel McCallum)
    repo: https://github.com/enarx/ciborium
    has_canonical_mode: true
  - id: lib-cbor-x
    name: cbor-x 1.6.6
    language: JavaScript/Node
    lineage: kriszyp (Kris Zyp)
    repo: https://github.com/kriszyp/cbor-x
    has_canonical_mode: false
  - id: oracle-frontier
    name: Frontier cleanroom Python oracle
    language: Python
    lineage: Frontier (LLM-derived from RFC 8949 text)
    has_canonical_mode: true (deterministic + canonical modes both)
  - id: oracle-cbor-me
    name: cbor.me reference diagnostic
    language: JavaScript (web)
    lineage: Carsten Bormann (RFC 8949 co-editor)
    has_canonical_mode: true (diagnostic only, not used as encoder in this experiment)

total_expected_cells: 555
  - "cbor2 (111 vectors x 2 modes = 222 cells)"
  - "ciborium (111 vectors x 2 modes = 222 cells)"
  - "cbor-x (111 vectors x 1 mode default only = 111 cells)"

oracle_validation:
  - RFC 8949 Appendix A Table 6: 14/14 integer vectors PASS in both modes
  - RFC 8949 §4.2.3 example: byte-exact match (a80a012001f401186401617a018120016261610181186401)
  - cbor.me cross-check: 2/2 spot-checks MATCH

compute:
  expected_class: medium
  notes: |
    Rust ciborium build ~2 min (cargo, cached after first build).
    Haskell cborg build ~10 min (cabal/GHC) — NOT in this cohort.
    Node.js cbor-x ~30s (npm). Matrix sweep per-library ~seconds.
    Total local compute: ~3 min including builds.
determinism:
  vector_generation_seed: 0xCB0F1E21
  all_adapters_deterministic: true
  matrix_reproducible: true (byte-identical on re-run)


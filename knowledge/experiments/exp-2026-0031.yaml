title: "EXP-2026-0031 - CBOR §4.2 cohort expansion experiment (cbor2 + ciborium + cbor-x)"

experimental_design: |
  Extends exp-2026-0030 by adding 2 new adapters:
    - lib_ciborium (Rust ciborium 0.2.2, enarx) — shells out to a
      Rust binary driver at R:/cbor-cohort/ciborium/target/release/cbor-driver.exe
    - lib_cbor_x (JavaScript cbor-x 1.6.6, kriszyp) — shells out to
      a Node.js driver at R:/cbor-cohort/cbor-x/driver.js

  Both adapters follow the same interface as lib_cbor2_adapter.py:
    ADAPTER_NAME, LIB_VERSION, supports_canonical (bool), encode(data_item, mode) -> bytes|None

  The Rust ciborium driver uses ciborium's CanonicalValue wrapper
  (which exposes cmp_value) to manually sort map keys before calling
  into_writer. This implements the §4.2.3 length-first sort per
  CanonicalValue's documented behavior.

  The Node.js cbor-x driver uses the top-level cborx.encode() function
  to emit standard CBOR (no self-described header). cbor-x has no
  canonical mode flag; canonical cells are skipped by the runner
  (supports_canonical = False).

  The matrix is run across all 3 adapters × 2 modes (canonical + default
  where supported). Total: cbor2 222 cells + ciborium 222 cells +
  cbor-x 111 cells (default only) = 555 cells.

  The cleanroom oracle (cbor_oracle.py) is unchanged. The vector
  generator (gen_vectors.py) is unchanged. The matrix runner
  (run_matrix.py) is unchanged. Only the 2 new adapters are added.


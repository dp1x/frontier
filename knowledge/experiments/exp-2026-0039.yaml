summary: >
  The PNG unknown-critical-chunk corpus was executed against four genuinely
  distinct decoder cores. The result DISCRIMINATES: two cores (stb_image,
  Wuffs) reject the unknown-critical vector for the right reason; two (Pillow
  12.3.0, Go image/png 1.26.4) silently accept and render it with no error
  indicated. Zero of 44 cells were unattributable. The Pillow result was
  independently reproduced by the orchestrator with a separately written script
  that does not use the harness.

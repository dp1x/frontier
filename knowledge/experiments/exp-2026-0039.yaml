cell_tally:
  total: 44
  ACCEPTED: 35
  UNKNOWN_CRITICAL_REJECTED: 5
  CRC_MISMATCH: 4
  GENERIC_DECODE_ERROR: 0
  why_the_zero_matters: >
    "GENERIC_DECODE_ERROR: 0" is the headline instrument fact. A rejection that
    cannot be attributed to a cause is NOT evidence, and the previous framing of
    this question was vacuous precisely because its rejections were
    unattributable. Every one of the 44 cells has a reason.

HOW_ATTRIBUTION_WAS_ACHIEVED_WITHOUT_MONKEY_PATCHING:
  the_problem_encountered: >
    An earlier attempt to instrument Pillow by patching `ChunkStream.call`
    failed with "`call` is on `ChunkStream` (base), patched at wrong level".
  the_method_that_worked: >
    DIFFERENTIAL INFERENCE against the bad-CRC negative controls, not
    introspection. Each core was run over a matrix of probe cells, so a core
    that demonstrably fails `negc-*-badcrc` is known to check CRCs, which makes
    its rejection of the unknown-critical vector attributable to criticality.
  the_pillow_specific_gap_and_fix: >
    Pillow discards the cause chain and surfaces a generic
    `UnidentifiedImageError`, so the reason was recovered verbatim from an
    instrumented CRC spy:
    "broken PNG file (bad header checksum in b'vQAx')".

source_level_mechanisms:
  stb_image:
    site: "stb_image.h:5244"
    test: "(c.type & (1 << 29)) == 0"
    note: >
      This is bit 5 of the first type byte shifted into position 29, i.e.
      exactly the PNG ancillary bit, and matches spc-2026-0007. Its header
      states "no CRC checking", so `negc-anc-badcrc` DECODING SUCCESSFULLY is
      positive proof that its rejections are not CRC-driven.
  wuffs:
    site: "decode_other_chunk"
    note: >
      Emits a distinct "#png: bad checksum" for the bad-CRC control and also
      ACCEPTS that control as an ancillary chunk, separating the two paths.
  pillow:
    site: "PngImagePlugin.py:205, 787-793, 795"
    mechanism: >
      `getattr(self, f"chunk_{cid}")` at line 205 finds no `chunk_VQAx`, so an
      AttributeError is raised. Lines 787-793 catch it and drop the chunk.
      Line 795 then runs the CRC check, which PASSES because the vector's CRC is
      valid. The ancillary bit is NEVER READ on this path.
    the_significance: >
      Pillow is not lax about CRCs -- it rejects `negc-cri-badcrc` -- so this is
      specifically and only an unknown-CRITICAL gap.
  go_image_png:
    site: "reader.go:880 switch, default tail at 929-946"
    mechanism: >
      There is no `VQAx` case in the switch. The default tail skips the payload
      and calls verifyChecksum(), which passes.

INDEPENDENT_REPRODUCTION:
  what: >
    The orchestrator re-executed the Pillow result with a freshly written script
    that does not import the harness, the oracle, or the cohort agent's
    instrumentation of any kind.
  the_script_essence: >
    `Image.open(path)` then `.load()` then reading the pixels, for five vectors.
  the_output:
    ctl-00-minimal: "ACCEPT (1,1) L pixels=[0]"
    pair-primary-anc: "ACCEPT (1,1) L pixels=[0]"
    pair-primary-cri: "ACCEPT (1,1) L pixels=[0]"
    place-cri-after-idat: "ACCEPT (1,1) L pixels=[0]"
    negc-cri-badcrc: "REJECT UnidentifiedImageError"
  conclusion: >
    CONFIRMED. Pillow renders a 1x1 image from a file containing an unknown
    critical chunk, and rejects the same file when only its CRC is corrupted.
    The second case is the control that proves the first is not a CRC artefact.
  what_this_reproduction_is_not: >
    It is a second SCRIPT against the same library and the same vector bytes. It
    is a genuine independent reproduction of the BEHAVIOUR, but it is not a
    second independent implementation. The Go result rests on the cohort agent's
    separately written Go program plus its source reading; it has not been
    independently re-executed by the orchestrator and is recorded as such.

A_PLACEMENT_DIVERGENCE_WORTH_RECORDING:
  observation: >
    `place-cri-after-idat` is rejected by stb_image but ACCEPTED by Wuffs.
  mechanism: >
    Wuffs's post-IDAT walk (wuffs-v0.3.c:43202-43227) validates only IEND, fdAT
    and fcTL, so a chunk appearing after the image data never reaches the
    criticality test at all.
  significance: >
    This is a SECOND, independent unknown-critical gap in Wuffs -- a core that
    behaves correctly on the primary pair but silently accepts an unknown
    critical chunk in one position. It shows that "does this decoder reject
    unknown critical chunks" is not a single yes/no property of an
    implementation.
  tier: "secondary; the primary pair is unaffected."


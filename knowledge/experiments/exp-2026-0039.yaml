  what_ran_locally: "pure-wheel installs and pure-Python/Go interpretation; no native library build"
  what_did_not_run_locally: "libpng/libspng compilation (NOT_BUILT) -- deferred to CI per the compute-routing HARD RULE"
  scratch_hygiene: >

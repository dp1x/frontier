the_question_and_its_answer:
  question: >
    Does a decoder reject a structurally valid file containing an unknown
    CRITICAL chunk, while accepting the paired unknown ANCILLARY file, and for
    the RIGHT reason?
  answer: "IT DEPENDS, AND THE SPLIT IS SHARP. Two of four cores reject correctly; two silently accept and render."
  hypothesis_outcome: >
    H1 is REFUTED as a general claim. H3 is CONFIRMED for two cores: they accept
    a structurally valid unknown critical chunk contrary to the specification's
    requirement to indicate an error. H2 is refuted -- every rejection is
    attributable to criticality, none to CRC or malformed framing.

corpus_as_executed:
  vectors: 11
  discriminating: 9
  all_sha256_verified_before_and_after: true
  no_corpus_disagreement: >
    The agent independently recomputed every vector's SHA-256 before and after
    the run and confirmed none of the 11 files was modified. The corpus is
    immutable across the experiment.

THE_COHORT:
  independence_model: >
    Four cores, ZERO of which link libpng. Independence was established by
    inspecting the shipped binaries and source, not assumed from names.
  members:
    - implementation: "Pillow 12.3.0 (win_amd64 wheel)"
      parser_core: "pure-Python PngImagePlugin.ChunkStream plus the _imaging C zip codec"
      uses_libpng: false
      how_established: "0 libpng symbols in _imaging.pyd; 0 mentions in the plugin"
    - implementation: "Go image/png, go1.26.4 windows/arm64"
      parser_core: "reader.go parseChunk"
      uses_libpng: false
      how_established: "ships its own compress/flate; no cgo"
    - implementation: "stb_image v2.30 @ 2c980bb5 (2026-08-01)"
      parser_core: "stbi__parse_png_file"
      uses_libpng: false
      how_established: "ships its own stb_zlib"
    - implementation: "Wuffs 0.3.5+3404.20260711"
      parser_core: "std/png decode_other_chunk"
      uses_libpng: false
      how_established: "ships its own std/zlib"
  not_built:
    - implementation: "libpng / libspng"
      reason: "NOT_BUILT. No vcpkg manifest and no system install. Building them creates a heavy tree that per AGENTS.md belongs on CI, not locally."
  an_agent_lineage_correction: >
    An in-repo adapter for a DIFFERENT experiment had labelled a cryptography-
    related core as "rustls-webpki"; a prior session already refuted that. No
    such error is repeated here: each of the four cores was established from its
    own shipped artefacts.


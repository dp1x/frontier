honest_limits:
  - >
    NO CLAIM IS MADE ABOUT libpng OR libspng. They are NOT_BUILT. Four cores is
    not "the ecosystem", and any scope statement must say "of the four cores
    exercised".
  - >
    The discrepancy is characterised as SILENT ACCEPTANCE with no error
    indicated. Per spc-2026-0007 png-p5, a decoder that signals an error AND
    continues is CONFORMANT. What these two cores do is not signal at all, which
    is the non-conformant case; but that distinction turns entirely on whether
    an error was indicated, and it was checked and recorded per cell.
  - >
    No security claim. Nothing here shows an exploitable consequence.
  - >
    Each implementation was tested at one version only.
  - >
    Pillow discards the cause chain, so the CRC-attribution for Pillow rests on
    an instrumented spy rather than on the library's own reporting. The negative
    control mitigates this but does not eliminate the instrumentation.


summary: >
  Track B: re-execution of the rustls ML-KEM encapsulation-key wire-tamper
  matrix in GitHub Actions, dispatched autonomously, to convert a source-level
  reachability argument into an executed observation and to separate the two
  mechanisms that previously looked identical. RESULT: 4/4 tampered variants
  rejected with illegal_parameter / peer misbehaved: InvalidKeyShare, control
  handshake succeeded. Critically, the three wire_coeff* variants are
  LENGTH-VALID (1184-byte ek) non-canonical keys and therefore genuinely
  exercise the FIPS 203 section 7.2 step 2 modulus check, while
  truncate_last_byte exercises the section 7.2 step 1 length path. The prior
  claim that the experiment was aimed at the wrong execution path is CORRECTED
  for the modulus half and CONFIRMED for the length half.

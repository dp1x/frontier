title: "rustls ML-KEM ek tamper matrix re-executed in CI: modulus-half stimuli are valid and reachable"
classification: cross-implementation-conformance
statement: >
  Question: is the rustls ML-KEM encapsulation-key tamper experiment measuring
  FIPS 203 section 7.2, and which of its stimuli reach that check?

  Method. (1) Independent source-level derivation of the reachable path at the
  pinned commit; (2) deliberate adversarial falsification, which initially
  produced a KILL verdict; (3) adjudication of the contradiction against source
  (rev-2026-0019); (4) autonomous CI dispatch and execution of the existing
  workflow; (5) parse of the returned report.
method: >
  Step 1-3 are recorded in knowledge/reviews/rev-2026-0019.yaml. Step 4: the
  workflow was dispatched with `gh workflow run rustls-loopback.yml --ref main`
  using the environment's existing authenticated GitHub CLI (account dp1x,
  scopes admin:public_key, gist, read:org, repo). NO human action was required
  and none was requested. Run ID 37188151545, status completed, conclusion
  success. Artifacts downloaded and parsed: rustls_loopback_report.tsv (5 rows)
  and rustls_loopback_console.log.
environment: >
  GitHub Actions, ubuntu-latest public runner, no secrets. rustls pinned to
  =0.23.43 (resolved commit fcf61cdbba30913cfd5b40aefa83989c6233812d);
  aws-lc-rs resolved to 1.18.0 by the committed Cargo.lock. Client and server
  both rustls, TLS 1.3, provider default.
result: >
  ALL 5 ROWS MET EXPECTATION.

    variant              | handshake        | alert              | rustls error
    ---------------------|------------------|--------------------|---------------------------
    control              | success          | none               | ok=true
    wire_coeff0_eq_q     | failure          | illegal_parameter  | peer misbehaved: InvalidKeyShare
    wire_coeff0_eq_4095  | failure          | illegal_parameter  | peer misbehaved: InvalidKeyShare
    wire_coeff255_eq_4095 | failure          | illegal_parameter  | peer misbehaved: InvalidKeyShare
    truncate_last_byte   | failure          | illegal_parameter  | peer misbehaved: InvalidKeyShare

  The positive control proves the harness can reach a SUCCESS; the four
  negative rows therefore are not a harness that rejects everything.

  THE KEY DISTINCTION, now measured rather than argued: the wire_coeff*
  variants rewrite a coefficient IN PLACE inside the ek's first 384 bytes
  (main.go:67-72, 216-250) and do not change the length, so the share remains
  1216 bytes and Layout::split succeeds. The 1184-byte ek then reaches
  aws-lc-sys mlk_kem_check_pk, whose body carries the vendor annotation
  "Specification: Implements @[FIPS203, Section 7.2, Modulus check]". These
  three rows ARE FIPS 203 section 7.2 step 2 (Eq 7.1 modulus) tests, and
  rustls + aws-lc-rs PASS them.

  truncate_last_byte shrinks the ek to 1183 bytes. On the hybrid path
  Layout::split rejects on share length (1216 != 1215) BEFORE the ek is sliced,
  so it tests the section 7.2 step 1 length obligation only INDIRECTLY, via a
  total-share check. Both mechanisms emit the same alert, which is why the
  prior report could not distinguish them.
discriminating_power_assessment: >
  4 tampered variants, 3 of which discriminate the modulus check specifically.
  This is a real but SMALL corpus. It does not separate the four stimulus
  classes the mission originally aimed at: it cannot distinguish step 1 from
  step 2 on the wire, cannot detect a verifier that rejected ALL malformed
  keys by blanket policy, and covers only k=3 (ML-KEM-768) on one provider.
  Recommended expansion: (a) add a library-parse row that reaches
  EncapsulationKey::new directly, (b) add a control that proves a LENGTH-VALID
  but semantically wrong key is ACCEPTED where the spec permits it (e.g. a
  modified rho seed, which Eq 7.1 must NOT inspect), and (c) add the pure
  MLKEM768 (0x0201) group configuration to reach section 7.2 step 1 as such.
verdict_summary: >
  SUPPORTED, with scope corrected. The prior audit's claim that the whole
  experiment is aimed at the wrong execution path is REFUTED for the three
  wire_coeff* rows and SUSTAINED for truncate_last_byte. The "section 7.2(a)"
  locator attached to all of these results is INVENTED and must be replaced
  with "section 7.2 step 1 (Type check)" / "step 2 (Modulus check), Eq (7.1)".
scope_limits: >
  - Single implementation pair (rustls client + rustls server), single crypto
    provider (aws-lc-rs), single parameter set (k=3), single TLS version.
    Agreement between a rustls client and a rustls server is NOT independent
    implementation agreement.
  - The matrix does NOT compare against the Frontier `mlkem-input-checks` cohort
    (PQClean, liboqs, Go, RustCrypto, OpenSSL, .NET). That differential was
    never run for these stimuli, so no cross-implementation claim is licensed.
  - An executed observation of "rejected with illegal_parameter" does not by
    itself prove WHICH check fired; the mechanism attribution rests on the
    source analysis in rev-2026-0019, not on this run alone.
  - The vendor's own C comment names the standard; that is a source claim by
    the vendor, not an independent normative confirmation.

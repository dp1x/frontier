id: exp-2026-0038
type: experiment
status: complete
created_at: "2026-10-05T09:10:00Z"
updated_at: "2026-10-05T11:40:00Z"
summary: >
  A minimal cleanroom counterfactual for RFC 5280 6.1.4 (l)/(m), built to
  separate the self-issued-guarded decrement from the unguarded pathLenConstraint
  clamp. 8 cases across 4 matched pairs, 30 certificates, all structurally
  verified from their own DER. Result: BOTH independently executed cores
  implement H1 -- a self-issued CA skips (l) but its pathLenConstraint still
  clamps descendants. Three harness defects were found and fixed first; each had
  been manufacturing spurious results.
epistemic_status: observation
compute:
  classification: lightweight
  executed_at: local
  isolation: "env-scrubbed scratch on the R ramdisk"
  note: >
    Certificate generation and validation are sub-second on commodity hardware.
    No build tree, no toolchain download, no CI. This is the cheap end of the
    project's economic test, per AGENTS.md.

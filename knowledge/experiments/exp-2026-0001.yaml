title: PQClean differential stimulus run
design: >
  Build ml-kem-{512,768,1024} clean variants with per-scheme nmake under MSVC
  14.51; link runner with common fips202.obj. Runner reads the committed
  flattened stimulus manifest (families - valid-control, noncanon-{q3329,
  v4000,max4095}-{first,middle,last}, len-minus/plus-1, rho-{zero,ff,prng-a,
  prng-b}, cross-set confusion, congruent-plant, wycheproof-modoverflow) and
  calls enc_derand with fixed coins; verdicts accepted/rejected plus
  inexpressible-at-api for wrong-length vectors the pointer ABI cannot
  express.
commands:
  - "nmake /f Makefile.Microsoft_nmake (per scheme dir)"
  - "cl /nologo /O2 /W4 pqclean_runner.c fips202.obj <three scheme libs> /Fe:pqclean_runner.exe"
  - "pqclean_runner.exe stimuli.tsv reports/pqclean_clean_report.tsv"
compute_decision:
  location: local
  isolation: env-scrubbed-scratch
  reason: "lightweight deterministic run; R: ramdisk scratch; router says local"
determinism:
  deterministic: true
  seed_policy: fixed coins = zero vector; stimulus seeds recorded in manifest
  nondeterminism_notes: null

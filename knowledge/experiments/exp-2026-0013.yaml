title: Strict-aliasing effective-type differential matrix (ALIAS-DIFF round 1)
design: >
  Five families x 10 variants = 50 deterministic programs probing C11 6.5p6-7:
  (a) memcpy type-punning [defined]; (b) union member punning [allowed];
  (c) unsigned-char access [explicitly allowed]; (d) incompatible-pointer
  cast dereference [UB - documentation-of-assumptions class];
  (ctl) same-type control. Programs use inline-asm value+memory barriers to
  block constant folding, seeded structural variation (array sizes, loop
  shapes), integer checksum output. Oracle: gcc -O0 stdout sha256 per program;
  every other config must match byte-for-byte. Escalation round added gcc/clang
  -O3 plus a scalar-probe litmus variant for family (d) after the first green
  round showed zero divergences everywhere.

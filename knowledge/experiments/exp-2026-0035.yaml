summary: "Re-measurement of the refuted CBOR cohort claim. Scored all 111 vectors of the Frontier conformance corpus under both RFC 8949 ordering rules and under cbor2 canonical=True, using the repository's own vector decoder. Confirms cbor2 implements section 4.2.3 length-first, and confirms the original finding's blindness was caused by Frontier's own mislabelled oracle."
epistemic_status: observation

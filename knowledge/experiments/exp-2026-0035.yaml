design: >
  fnd-2026-0013 claimed cbor2 and ciborium produce byte-exact agreement with
  the Frontier oracle in canonical mode. rev-2026-0018 refuted it on the grounds
  that Frontier's own encode_canonical implemented section 4.2.3 length-first
  under a section 4.2.1 docstring, and proposed a replacement claim: cbor2
  matches the oracle on 108/111 and matches the oracle's section 4.2.3 ordering
  on the three discriminating vectors. That replacement was proposed but never
  MEASURED.

  This experiment measures it. For every vector in the corpus, compute
  encode_canonical (section 4.2.1), encode_deterministic (section 4.2.3), and
  cbor2.dumps(canonical=True), then count agreements. Also confirm the blindness
  claim by comparing the STORED expected hex pair in each vector record, which
  should be identical if the vectors were generated by the mislabelled oracle.

  Decisive control: vectors whose map keys produce different orderings under the
  two rules. The corpus is expected to contain exactly three.
commands:
  - ".venv\\Scripts\\python.exe R:\\remeasure\\rework_cbor_remeasure.py"
  - ".venv\\Scripts\\python.exe R:\\verify\\verify_cbor_remeasure2.py   # orchestrator independent re-run"
  - ".venv\\Scripts\\python.exe -m frontier.cli validate"
compute_decision:
  location: local
  isolation: "ramdisk scratch R:\\verify; env-scrubbed project venv; no network required"
  reason: >
    Lightweight per the AGENTS.md compute table: pure-Python scoring of 111
    already-committed JSON vector records against two already-installed
    encoders. Seconds of CPU, no build step. Deliberately did NOT regenerate the
    committed vector files: that is a separate decision for the human, because it
    would change committed evidence. Deliberately did NOT rebuild the ciborium
    cohort: its driver and R:\\cbor-cohort are gone and re-fetching them would be
    a heavy local build, which the charter forbids.
determinism:
  deterministic: true
  seed_policy: "none required. No randomness, no keys, no crypto. Every output is a pure function of the committed vector records."
  nondeterminism_notes: >
    All inputs are committed JSON. cbor2 6.1.4 is pinned in the venv. Results are
    reproducible byte-for-byte on any machine with the same two packages.
results:
  corpus_shape:
    total_vectors: 111
    vector_files: 8
    map_bearing: 8
    non_map: 103
  blindness_confirmed:
    stored_canonical_equals_stored_deterministic: "111/111"
    meaning: >
      Every vector record stores identical expected hex for canonical and
      deterministic mode. The corpus therefore CANNOT distinguish section 4.2.1
      from section 4.2.3, which is precisely why the original matrix passed.
  scoring:
    cbor2_canonical_true_vs_section_4_2_1: "108/111"
    cbor2_canonical_true_vs_section_4_2_3: "111/111"
    discriminating_vectors: 3
    discriminating_ids: [map_mixed_lengths, map_rfc_4_2_3_example, map_mixed_types]
  verdict: >
    cbor2 6.1.4's canonical=True implements RFC 8949 section 4.2.3 length-first.
    It agrees with section 4.2.1 on every vector whose keys do not discriminate,
    and disagrees on all three that do. This is not a cbor2 defect: "canonical"
    there follows RFC 7049 / section 4.2.3, a coherent choice. The defect was
    Frontier's.
orchestrator_verification: >
  The subagent's three load-bearing claims were re-derived rather than accepted.
  The first orchestrator attempt scored only 33 vectors and found zero
  discriminating vectors, because the vectors are stored in a typed encoding
  (__type__ / hex / pairs) and a naive read of data_item does not yield a Python
  object. Re-running with the repository's own _decode_data_item_recursive from
  cbor-cross-impl/runner/run_matrix.py yields 111 vectors, 8 map-bearing, and the
  3 discriminating vectors, with mismatching hex strings reproducing the
  subagent's table byte-for-byte. Denominator reconciliation: 103 non-map +
  5 matching map = 108/111 against section 4.2.1; 103 non-map + 8 matching map
  = 111/111 against section 4.2.3. All three claims CONFIRMED.
corrections_to_prior_audit: [
  "rev-2026-0018's '95 non-map vectors' is wrong; measured 103.",
  "rev-2026-0018's '108/111 have all-equal-length map keys' is false; only 2 do. The 108 coincide because both orderings yield the identical permutation on those key sets.",
  "The open '52 vs 54' divergence-count item resolves against the audit and in favour of the finding: the enumerated breakdown sums to 54 and matches matrix.jsonl exactly; only the bare '52' token is wrong."
]
negative_and_control_results:
  - "cose-cross-impl vectors were regenerated in memory as a control and came back 80/80 fields identical, so stale-vector rot is confined to cbor-cross-impl."
  - "That same control found the cose header_label_sorting axis has ZERO discriminating power at HEAD. This is a NEW open item bearing directly on fnd-2026-0014, which rests on that axis."
limitations:
  - "TWO implementations only (Frontier oracle + cbor2). The ciborium leg is NOT reproduced: driver and R:\\cbor-cohort are gone and rebuilding locally is forbidden. The replacement is a 2-implementation claim, not the 3-lineage claim the original finding made."
  - "cbor2 6.1.5 is current upstream; behaviour at 6.1.5 is not measured."
  - "Committed vector files were NOT regenerated."
  - "cbor.me was not run."
  - "spc-2026-0004's fabricated section 4.2.1 quotations. RESOLVED 2026-10-05: the extract has been withdrawn and re-measured. RFC 8949 sha256 f1164a5b31a39350ad46abe29b83575eb933ca6c45366989c118b6b1058a214a, 185226 bytes; 20 quotation units, 20 NO-MATCH. The claim this experiment's measurements make -- that cbor2 canonical=True implements section 4.2.3 -- is independently CONFIRMED against the RFC: Section 4.2.3 is titled 'Length-First Map Key Ordering' and states both of its rules as this experiment describes. See obs-2026-0062.yaml."

title: "EXP-2026-0030 - CBOR §4.2 deterministic-encoding cross-impl matrix design"
experimental_design: |
  The experiment is a 3-dimensional matrix:
    Dim 1: library (10 libraries, see cohort below)
    Dim 2: audit axis (8 axes, from spc-2026-0004)
    Dim 3: input vector (125+ per axis, CDDL-synthesized + RFC 8949 Appendix C)
  Per-cell verdict: pass / spec-violation / spec-ambiguity / interop-break / error

  Two reference oracles:
    Oracle A: cleanroom Python oracle implementing RFC 8949 §4.2
              deterministic mode + §4.2.1 canonical mode. No consultation
              of audited library source code.
    Oracle B: cbor.me reference diagnostic (Carsten Bormann, RFC 8949
              co-editor). Used as second-opinion oracle for any
              diverging cell.

  Two oracle modes per library:
    Mode 1: library's documented default mode (most permissive)
    Mode 2: library's documented deterministic/canonical mode (if
            available)

  The matrix is structured so that per-cell divergence triggers a
  pipeline:
    Step 1: cross-check with cbor.me (Oracle B)
    Step 2: classify (cosmetic / interop-break / spec-violation / ambiguity)
    Step 3: assign candidate finding ID
    Step 4: queue for adversarial critic review
    Step 5: commit reproducer
    Step 6: promote or reject per evidence chain


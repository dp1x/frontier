audit_axes:
  - axis: integer_shortest_form
    rule_ref: "RFC 8949 §4.2 rule 1"
    vector_strategy: "Generate inputs at all transition points (0, 23, 24, 255, 256, 65535, 65536, 2^32-1, 2^32, 2^64-1, 2^64), plus all-negative-counterparts, plus arbitrary-precision."
    expected_vectors: 125
  - axis: map_key_sort
    rule_ref: "RFC 8949 §4.2 rule 2"
    vector_strategy: "Generate maps with keys of varying byte lengths (1, 2, 3, 4, 5, 6+), with mixed lexical order, with duplicate keys at different lengths, with keys containing escape-equivalent bytes (UTF-8 leading bytes, multi-byte sequences)."
    expected_vectors: 150
  - axis: float_shortest_form
    rule_ref: "RFC 8949 §4.2 rule 3"
    vector_strategy: "Generate half-precision floats with round-trip exact values (1.0, 1.5, 1.25, etc.), single/double-precision floats that are also representable in half, NaN payloads, infinity, subnormal numbers."
    expected_vectors: 100
  - axis: definite_length_preferred
    rule_ref: "RFC 8949 §4.2 rule 4"
    vector_strategy: "Generate strings/arrays/maps in both indefinite-length and definite-length forms; verify the canonical output is definite-length."
    expected_vectors: 80
  - axis: duplicate_key_rejection
    rule_ref: "RFC 8949 §4.2 rule 5"
    vector_strategy: "Generate maps with duplicate keys (same byte sequence appearing twice); verify deterministic-mode encoder rejects."
    expected_vectors: 60
  - axis: tag_shortest_form
    rule_ref: "RFC 8949 §4.2.1 rule 3"
    vector_strategy: "Generate tagged values with tag numbers at transition points (0, 23, 24, 255, 256, 65535, 65536), with nested tags, with epoch-based date tags (RFC 8949 §3.4)."
    expected_vectors: 80
  - axis: simple_value_shortest_form
    rule_ref: "RFC 8949 §4.2.1 rule 5"
    vector_strategy: "Generate simple values at transition points (false, true, null, undefined, simple value 0..23, simple value 32..255)."
    expected_vectors: 50
  - axis: chunked_string_consistency
    rule_ref: "RFC 8949 §2.2 + §4.2"
    vector_strategy: "Generate byte/text strings in chunked indefinite-length form; verify deterministic encoder produces definite-length or chunked-indefinite consistently."
    expected_vectors: 60

total_expected_cells: ~10000
  - 10 libs × 8 axes × 125-avg vectors × 2 modes = ~20000 cell-mode pairs
  - after deduplication of identical cells, ~10000 distinct cells

oracle_a_cleanroom_python:
  description: "RFC 8949 §4.2 deterministic-encoding reference implementation in Python 3.11+, derived exclusively from RFC 8949 text + standard Python primitives (struct for byte assembly). No consultation of audited library source code."
  location: "cbor-cross-impl/oracle/cbor_oracle.py"
  interfaces:
    - "encode_deterministic(data_item) -> bytes"
    - "encode_canonical(data_item) -> bytes"
    - "decode(bytes) -> data_item"
    - "validate_appendix_c() -> (passed: bool, failures: list)"
  test_suite: "cbor-cross-impl/oracle/test_cbor_oracle.py (must pass RFC 8949 Appendix C all 14 vectors byte-exactly in both modes)"

oracle_b_cborme:
  description: "Carsten Bormann's reference diagnostic at cbor.me. Used for second-opinion verification of any cell where Oracle A and a library disagree. Implementation-level oracle."
  usage: "For each diverging cell, submit (input bytes → expected output bytes) to cbor.me and record the diagnostic's verdict."

vector_generation:
  description: "Adversarial CDDL-synthesized vector generator. Generates inputs targeting each audit axis. Reproducible (seeded) so matrix is deterministic."
  location: "cbor-cross-impl/vectors/gen_vectors.py"
  output: "cbor-cross-impl/vectors/vectors_<axis>.jsonl (one vector per line: hex input data item + axis metadata)"
  seed_policy: "Fixed seed (0xCB0F1E21). All vector generation is deterministic given the seed."

adapter_layer:
  description: "Per-library adapter layer. Each adapter is a Python module that exposes a uniform interface (encode_deterministic, encode_canonical) and wraps the library's native API. Adapters normalize error handling and produce structured verdicts."
  location: "cbor-cross-impl/adapters/"
  per_library_loc: "cbor-cross-impl/adapters/<lib-id>_adapter.py"
  interface_spec: "Adapter must implement: def encode(input_data_item, mode) -> (bytes_or_None, verdict, error_msg). Verdict in {PASS, SPEC_VIOLATION, SPEC_AMBIGUITY, INTEROP_BREAK, ERROR}."

matrix_runner:
  description: "Orchestrates the (library × axis × vector × mode) sweep. Produces a TSV with columns: library_id, axis, vector_id, mode, expected_hex, actual_hex, match, verdict, oracle_a_verdict, oracle_b_verdict."
  location: "cbor-cross-impl/runner/run_matrix.py"
  output: "cbor-cross-impl/results/matrix.tsv (also .jsonl for machine-readable)"

verification_path:
  description: "Each cell in the matrix is reproducible from the committed reproducer. Two consecutive runs of the matrix runner must produce byte-identical TSVs."
  reproducibility_test: "cbor-cross-impl/runner/test_reproducibility.py asserts that re-running the matrix yields identical output."
  adversarial_critic_pipeline: "Every cell with verdict != PASS in two or more libraries is queued for adversarial critic review. The critic's role: (a) determine whether the divergence is a real spec violation, (b) determine whether the divergence is a real interop break, (c) construct an attack scenario if relevant, (d) classify the disclosure class (interop-note / security-advisory / spec-ambiguity)."
  promotion_path: "hypothesis → experiment (this) → observation → reproducer → independent review → verified"

compute:
  expected_class: lightweight
  notes: "Per-cell compute is microseconds-to-milliseconds. Full sweep ~30 minutes on a single laptop core. Library builds ~30 min each on commodity Windows host. Total local compute ~3 hours including adapter verification."
  determinism: "All vector generation and per-library encoding is deterministic given the same library version and input. Cross-version changes are reported separately."

isolation:
  scratch_root: "R:\\cbor-cross-impl"
  durable_root: "cbor-cross-impl/ (committed to repo)"
  ephemeral_artifacts: "library source clones, build trees, compiled artifacts, log files - all under R:\\cbor-cross-impl, never committed"
  network_policy: "Build phase may fetch library source from public repos (with versions pinned). Experiment execution must NOT make network calls."
  secrets_policy: "Stripped; no API tokens, no SSH keys, no browser credentials."

limitations:
  - "Library version drift during mission lifetime; we pin to a specific commit/tag per library and document the pin."
  - "cbor.me availability is intermittent; if unavailable, fall back to a hand-encoded reference oracle derived directly from RFC 8949 Appendix C."
  - "Some libraries (cbor-x) do not have a canonical mode; for those libraries, only Mode 1 (default) is tested."
  - "Verdict 'SPEC_AMBIGUITY' requires human review of the RFC text; this is not a pure mechanical classification."
  - "Cross-version reproducibility is not part of this mission; library upgrades may invalidate the matrix."

success_metrics:
  - "Matrix TSV produced with >= 5000 cells"
  - "All cells have a per-library verdict"
  - "All diverging cells are cross-checked against cbor.me (or fallback oracle)"
  - "All diverging cells have an adversarial critic verdict"
  - "Reproducer commits a script that reproduces the entire matrix from scratch"
  - "At least one reproducible cross-impl divergence has full evidence chain (or the matrix proves all libraries agree, an acceptable negative result)"
summary: "Stage C client-side decapsulation parity audit. Build OpenSSH portable + Go x/crypto/ssh client binaries on GHA ubuntu-latest, exercise them against the same harness as exp-2026-0025 (lenient server with tampered C_INIT), and capture per-client per-stimulus verdict (strict / lenient / dangerous). Diagnose and fix the recvPacket EOF bug from exp-2026-0026. Add positive + negative controls so harness defects cannot masquerade as protocol behavior."
epistemic_status: hypothesis

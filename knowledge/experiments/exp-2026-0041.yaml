title: "EXP-2026-0041 - Ambient rounding-mode matrix for std::from_chars across four targets"
design: |
  Corpus: 27 vectors, every one finite, in range, and NOT an exact tie, so a
  unique nearest representable value exists. Groups:

    A-GCC-decimal     D01, D02  - decimal inputs, source-condition-qualified
                                  for libstdc++'s fast_float path
    control           D03-D10  - simple decimal values including exactly
                                  representable ones and a negative value
    C-libcxx-clinger  C01-C08  - Clinger-eligible decimal inputs, with
                                  opposite-side midpoint pairs
    B-GCC-hex         H01, H02  - hexadecimal inputs, source-condition-
                                  qualified for libstdc++'s hex path
    control           H03-H05  - further hexadecimal inputs
    X-clinger-defeat X01, X02  - mantissa wide enough that
                                  (mantissa >> FRACTION_LEN) != 0, so the
                                  libc++ Clinger fast path is NOT taken
    X-clinger-eligible X03, X04 - matched controls where the Clinger path IS
                                  taken

  Each vector is run in each of FE_TONEAREST, FE_DOWNWARD, FE_UPWARD and
  FE_TOWARDZERO. Every (vector, mode) case runs in a FRESH PROCESS. The
  harness reads the input string and the mode index from argv at runtime, so
  no conversion can be constant-folded.

  Expected bits come from an exact-rational oracle that never calls
  from_chars, strtod, strtof, Python float(), or any standard library
  conversion. The oracle uses integer arithmetic and fractions.Fraction only.
  Two further independent implementations (binary search over significands;
  80-digit decimal.Decimal rounding with from-scratch parsers) reproduce every
  expected bit, and a separate uniqueness check proves each expected value is
  strictly nearer than both representable neighbours.

  Instrumentation per case: fesetround return status, fegetround immediately
  before the from_chars call, from_chars error code, characters consumed,
  raw IEEE bit pattern of the result, fegetround immediately after, and two
  positive liveness controls executed in the same process while the ambient
  mode is still active (a raw FPU probe 1.0 + 1e-20, and a strtod probe).
  The controls vary with the mode, proving the ambient mode was live at the
  call site. The strtod control is diagnostic only and is never used as an
  expected value.

  Compile flags for every target: -std=c++17 -O0 -fno-fast-math
  -frounding-math, no LTO, #pragma STDC FENV_ACCESS ON under Clang. MSVC
  does not support the STDC FENV_ACCESS pragma (warning C4068) and was run
  with its default /fp:precise; MSVC's from_chars is a header-inline
  implementation, so the harness's compilation settings apply to the
  conversion code itself.

execution:
  environment: >
    GitHub Actions ubuntu-latest (Linux x86-64) for the three Linux targets;
    local Windows 11 ARM64 (build 10.0.26100.0) for the MSVC STL target.
  compute_route: medium
  compute_rationale: >
    Three distinct standard libraries cannot be obtained on the local Windows
    ARM64 host (no GCC, no libc++, no WSL, no Docker). Building them from
    source on the host would violate the no-heavy-local-builds rule, so the
    matrix was routed to GitHub Actions public runners. The libc++ no-Clinger
    ablation requires building libc++ from the llvmorg-20.1.8 tag, which is
    also a CI-only job.
  isolation: >
    Each (vector, mode) case is a separate OS process; no state carries
    between cases. CI jobs are separate fresh runners.
  seeds_and_determinism: >
    Fully deterministic. Fixed literal input strings, no randomness, no
    wall-clock or address-dependent behaviour. Each result was reproduced in
    at least two independent CI runs (runs 39606413728, 39607506255,
    39607726610, 39608018709, 39608262716, 39608781263, 39609031504) and the
    local MSVC matrix was re-executed after the harness gained the liveness
    controls.
  version_tested:
    - "GCC: g++ on ubuntu-latest (CI); libstdc++ matching the runner image"
    - "Clang: clang++-20 / libc++ 20.1.8 (apt.llvm.org llvmorg-20.1.8 packages)"
    - "Clang ablation: libc++ 20.1.8 rebuilt from the llvmorg-20.1.8 tag with -DLIBC_COPT_STRTOFLOAT_DISABLE_CLINGER_FAST_PATH"
    - "MSVC: cl 19.51.36248 / MSVC STL 14.51.36231, Windows SDK 10.0.26100.0, Windows 11 ARM64"
results_summary: >
  432 records across 4 targets x 27 vectors x 4 modes.

    GCC / libstdc++          : 108 records, 0 mode-variant vectors, 0 mismatches vs oracle
    Clang / libc++ 20.1.8    : 108 records, 12 mode-variant vectors, 12 mismatches vs oracle
    libc++ with Clinger off  : 108 records, 0 mode-variant vectors, 0 mismatches vs oracle
    MSVC STL 14.51.36231     : 108 records, 0 mode-variant vectors, 0 mismatches vs oracle

  The 12 mode-variant libc++ vectors are C01, C02, C05, C06, C08, D01, D02,
  D03, D04, D05, X03, X04 - all decimal, all Clinger-eligible. X01 and X02
  defeat the Clinger path and are mode-stable, as are the hexadecimal
  vectors.

  Causal test: rebuilding libc++ with the Clinger fast path disabled removed
  the mode-dependence on all 12 vectors and introduced none, and the rebuilt
  library agreed with the oracle and with GCC on every vector and mode.

  Mechanism confirmation: a reproducer that replays the upstream Clinger
  arithmetic (native FP multiply or divide) under the ambient mode reproduced
  the libc++ from_chars bit pattern EXACTLY in all 76 (Clinger-eligible
  vector, mode) cells.
outcome: >
  Hypothesis confirmed for libc++ 20.1.8's decimal path; not observed in
  libstdc++ or MSVC STL. Mechanism established by build-time ablation and by
  bit-exact mechanism reproduction.
limitations: >
  Only two libc++ versions were considered (20.1.8 stock and 20.1.8 rebuilt);
  no other libc++ release was tested, so the onset version of the behaviour
  is unknown. The hexadecimal path was exercised by five vectors only. The
  corpus is 27 vectors, not an exhaustive sweep. long double, non-IEC
  formats, overflow, underflow, NaN and Inf were out of scope by design.

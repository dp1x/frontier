summary: >
  Bounded ambient-rounding-mode matrix for std::from_chars floating-point
  conversion: 27 exact-rational, non-tie, in-range vectors (23 primary and
  control, 4 path-discriminator) crossed with 4 rounding modes, executed
  against four targets: GCC 13/14 + libstdc++, stock Clang/libc++ 20.1.8,
  Clang/libc++ 20.1.8 rebuilt with the Clinger fast path disabled, and MSVC
  STL 14.51.36231 on Windows ARM64. 432 records total. Result: libc++ is
  mode-dependent on 12 of 27 vectors; all other targets are mode-invariant
  and match the exact-rational oracle on every vector and mode. Rebuilding
  libc++ with the Clinger path disabled removes the mode-dependence
  completely, which is a direct causal test.

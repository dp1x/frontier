title: ALIAS-DIFF round-2 - opaque-TU barrier + asm barrier dual matrix
design: >
  Round-2 of the ALIAS-DIFF strict-aliasing / effective-type
  differential matrix.  Round-1 produced 0 divergences across 350
  rows (5 families x 10 variants x 7 configs), but the inline-asm
  barrier may have prevented the optimizer from exercising the
  TBAA path, limiting coverage.

  Round-2 design:
    1. Round-1 programs: re-emitted via gen_programs.py unchanged.
    2. Round-2 programs: new gen_programs_r2.py emits 20 sibling
       programs (10 family (d) + 10 family (ctl)) that link against
       opaque_tu.c instead of using inline-asm barriers.  The opaque
       functions (opaque_ext, touch_ext) live in a separately-compiled
       translation unit; the caller's optimizer cannot see through the
       function body without LTO.  This is the round-2 barrier
       improvement per exp-2026-0015.
    3. Run matrix: 6 configs (gcc-O0/O2/O3, clang-O0/O2/O3), 10s
       timeout per binary, sha256(stdout) compared to gcc-O0
       baseline for the same program.
    4. Coverage: 50 asm programs x 6 configs = 300 GHA rows + 50 asm
       programs x 3 configs (local, no clang) = 150 local rows.  Plus
       20 opaque-tu programs x 6 configs = 120 GHA rows + 20 x 3
       configs = 60 local rows.  Total 630 GHA rows; observed 660
       (GHA run 33225682327), plus 210 local rows = 870 program-config
       rows.
commands:
  - "python compilers/alias-diff/gen_programs.py compilers/alias-diff/generated"
  - "python compilers/alias-diff/gen_programs_r2.py compilers/alias-diff/generated"
  - "bash compilers/alias-diff/run_matrix_r2.sh compilers/alias-diff/reports/alias_report_r2.tsv"

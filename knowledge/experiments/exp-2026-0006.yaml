design: >
  .github/workflows/mlkem-diff.yml openssl job: shallow clone of pinned tag,
  Configure no-shared, make -j4, install_sw; gcc compile of committed
  openssl_runner.c with runtime-version logging (OpenSSL_version vs compiled
  macro to catch header/library skew); per vector, EVP_PKEY_new_raw_public_key_ex
  import verdict then EVP_PKEY_encapsulate liveness on accepted keys.
commands:
  - "git clone --depth 1 --branch openssl-3.5.7 https://github.com/openssl/openssl.git"
  - "./Configure no-shared --prefix=$PWD/../openssl-install && make -j4 && make install_sw"
  - "gcc -O2 -Wall -o openssl_runner openssl_runner.c -I <install>/include -L <install>/lib64 -lcrypto"
  - "./openssl_runner stimuli.tsv openssl_report.tsv"

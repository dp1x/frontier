updated_at: "2026-08-30T05:00:00Z"
summary: GitHub Actions workflow design - ssh-loopback.yml - that builds OpenSSH portable with USE_MLKEM768X25519=1 on ubuntu-latest, then runs the Go MITM harness (interop/protocol-placement/ssh_loopback/main.go) against the local sshd for both mlkem768x25519-sha256 and sntrup761x25519-sha512 cohorts, with per-stimulus verdict capture.
epistemic_status: hypothesis

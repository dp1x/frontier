title: "EXP-2026-0032 - COSE message-construction matrix (40 vectors x 2 adapters)"
design:
  question: "Across 2 lineage-independent COSE implementations (pycose 1.1.0, go-cose 1.3.0), do the Sig_structure / Enc_structure / MAC_structure bytes per RFC 9052 §4.4/§5.3/§6.3 match a cleanroom Python oracle for 40 discriminating vectors across 10 audit axes?"
  cohort:
    - "pycose 1.1.0 (Timothy Claeys, uses cbor2 CBOR backend)"
    - "go-cose 1.3.0 (Veraison/ex-Mozilla, uses fxamacker/cbor SortCoreDeterministic)"
  vectors:
    count: 40
    axes: 10
    axes_detail:
      cose_cxess_sign1_message_construction: 10
      cose_encrypt0_message_construction: 5
      cose_mac0_message_construction: 5
      empty_protected_bucket: 5
      header_label_sorting: 4
      ecdsa_r_s_encoding: 3
      eddsa_signature_encoding: 1
      aes_gcm_nonce_construction: 3
      deterministic_ecdsa_nonce: 3
      cose_kdf_context: 1
    seed: "0xC0DE0CB0"
  comparison_levels:
    structure: "Sig_structure / Enc_structure / MAC_structure bytes (no crypto)"
    message: "Full CBOR-tagged COSE message bytes (wrapping layer)"
  oracle: "Frontier cleanroom Python (cose-cross-impl/oracle/cose_oracle.py), derived exclusively from RFC 9052/9053 text"
expected_outcomes:
  - "pycose and go-cose agree with oracle on most structure bytes"
  - "Differences in sort order (RFC 9052 §9 requires §4.2.1 bytewise-lex)"
  - "Possible ChaCha20-Poly1305 NOT_SUPPORTED (pycose 1.1.0 has no ChaCha)"
compute:
  route: "lightweight (local)"
  duration_minutes: 2
  notes: "All matrix runs execute in <2 minutes on commodity hardware; build of go-cose driver takes ~30s on first invocation."
budget_consumed:
  attempts: 3  # pycose only -> pycose+go-cose -> final with kdf_context fix
  compute_runs: 80  # 40 vectors x 2 adapters
  reviews: 0
results: "See obs-2026-0042"

title: "EXP-2026-0022 - Stage-3: CIRCL X-Wing draft-05 KAT vector verification"
design: |
  Run CIRCL's TestVectors function which:
  1. Computes 3 KAT vectors via DeriveKeyPairPacked + Encapsulate + Decapsulate
  2. Hashes the (seed, sk, pk, eseed, ct, ss) tuples with SHAKE-128
  3. Asserts the hash equals "1bcd0057d861d6b866239936cadcaeee1ec0164dedc181c386e9e54fe46156fe"
commands:
  - "go test -v -run TestVectors github.com/cloudflare/circl/kem/xwing"
compute_decision:
  location: local
  isolation: "env-scrubbed scratch workspace via frontier.execute.run_command"
  reason: "CIRCL's TestVectors is a single Go test, deterministic, seconds-scale"
determinism:
  deterministic: true
  seed_policy: "SHAKE-128-derived seed in the test itself"
  nondeterminism_notes: "TestVectors is fully deterministic"
results:
  test_vectors_pass: 3
  test_vectors_total: 3
  hash_check: "1bcd0057d861d6b866239936cadcaeee1ec0164dedc181c386e9e54fe46156fe (matches published reference)"
verdict: pass
notes: |
  This verification confirms that CIRCL v1.6.5 implements X-Wing
  draft-05 correctly per the published KAT corpus. The hash check
  is byte-exact, making this a strong positive finding.

  Limitation: draft-08 KAT vectors are not separately verified.
  draft-08 changed the combiner from (ssm, ssx, ctx, ek_KEM) to
  (ssm, ssx, ctx, ek_X) — this single-byte-string swap at the end
  of the SHA3 input would produce a different ss even with the same
  (seed, eseed) inputs. Without draft-08 KAT vectors cached locally,
  we cannot assert draft-08 conformance. The draft-05 conformance
  is verified.
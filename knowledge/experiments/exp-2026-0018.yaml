  installed at C:\Users\Dhane\.elan\toolchains\leanprover--lean4---v4.22.0).
  Define formal/Formal/LengthCheck.lean with:
    - inductive MLKEMParam with k2, k3, k4
    - def canonicalLength : MLKEMParam -> Nat returning 384*k+32
    - T1: canonicalLength_k2/k3/k4 = 800/1184/1568
    - T2: not_canonicalLength_offbyone_k2/k3/k4 (801/1185/1569 rejected)
    - T3: cross_param_set_rejection (different p, q -> different lengths)

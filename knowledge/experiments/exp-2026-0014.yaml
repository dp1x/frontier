title: Cross-path invariance matrix (msn-2026-0002 final cells)
design: >
  Four invariance dimensions across the 199-vector stimulus manifest
  (msn-2026-0001 stimuli), with each cell deterministically reproducible from
  a fixed seed+family+params+variant tuple:

  Cell 1: OpenSSL raw/default   = EVP_PKEY_new_raw_public_key_ex(alg, NULL)
  Cell 2: OpenSSL SPKI/default  = d2i_PUBKEY over template-patched DER wrapping
                                   the same raw bytes
  Cell 3: OpenSSL raw/FIPS      = same as Cell 1 with "provider=fips" propq
  Cell 4: OpenSSL SPKI/FIPS     = same as Cell 2 with FIPS provider propq
  Cell 5: liboqs auto           = runtime-selected implementation
  Cell 6: liboqs forced-ref     = OQS_DISABLE_ALL_OPT=1 to force C reference
  Cell 7: .NET Windows          = Microsoft.MLKem.ImportEncapsulationKey
  Cell 8: .NET Linux            = same API over libSystem.Security.Cryptography
                                   on Ubuntu 24.04, OpenSSL 3.5.7-backed

  SPKI construction uses hard-coded 22-byte algorithm-OID prefixes per
  param set (RFC 9480 OIDs: 2.16.840.1.101.3.4.4.{1,2,3}) and appends the raw
  test key bytes verbatim - so an over-length or cross-param body is
  structurally well-formed DER but semantically malformed key bytes.
  Harness flags accept-on-fail-* with `import-accepted-UNEXPECTED` so
  invariance violations are machine-detectable from the report.

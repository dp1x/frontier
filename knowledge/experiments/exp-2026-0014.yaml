  cell_8_dotnet_linux:       "199/199 evaluated; identical to cell 7 (rejected-arg on len-plus-1, cross-set)"
headline_observation: >
  Cross-API invariance in OpenSSL is BROKEN for 6 vectors in the default
  provider: d2i_PUBKEY (SPKI) accepts over-length and cross-param-set key
  bodies that EVP_PKEY_new_raw_public_key_ex (raw) correctly rejects.
  .NET CNG (Windows) and .NET on Linux (OpenSSL-backed) both reject the
  same vectors. liboqs auto vs forced-ref is fully invariant.

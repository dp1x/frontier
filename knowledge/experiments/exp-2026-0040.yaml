summary: >
  Cross-implementation strict UTF-8 validation experiment. Three independently
  developed implementations (Rust core::str::from_utf8, Go unicode/utf8.Valid,
  simdutf validate_utf8) were run on 606 deterministic vectors derived from
  Unicode 17.0.0 Table 3-7. Zero mismatches vs cleanroom oracle; zero mismatches
  among implementations. 2000 random vectors also agreed.

empty_protected_bucket:
  encoded_form: "ALGORITHM-DEPENDENT — relies on cn-cbor behavior for empty map encoding"
  source_evidence: |
    cn-cbor (the CBOR backend) is a hand-rolled C library; its handling of empty maps
    is bytestream-emission: cn_cbor_encode_size and cn_cbor_encoder_write produce
    CBOR bytes per the encoder logic. For an empty map (CN_CBOR_MAP with zero children),
    cn-cbor emits 0xa0 (the major-type-5 zero-length map).
    cose-c's Cose.cpp / Encrypt.cpp / Sign.cpp wrap that map in the protected-bucket bstr
    via cn_cbor_data_create(...), producing 0x41 0xa0 (bstr wrapping empty map) — the
    legacy encoding. The normalization to 0x40 is done in the *AAD construction*
    path inside cose-c (EncodeHelpers.cpp / Sign.cpp), where the empty map is replaced
    with an empty bstr before hashing. Net behavior: cose-c emits 0x41 0xa0 on the wire
    but normalizes internally to 0x40-equivalent for Sig_structure/MAC_structure AAD
    calculation. This means cose-c's wire output may diverge from other libraries that
    emit 0x40, but cose-c's signing operation is internally consistent with 0x40.
  rationale: "The internal normalization in AAD construction ensures cose-c signs the
    correct Sig_structure even if its wire-format empty protected bucket diverges from
    the RFC 9052 §3 SHOULD."

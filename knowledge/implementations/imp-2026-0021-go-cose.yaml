canonical_mode:
  supported: true (mandatory default — there is no non-canonical mode in the library)
  api: "encMode is pre-configured at package init() in cbor.go using cbor.EncOptions{Sort: cbor.SortCoreDeterministic, IndefLength: cbor.IndefLengthForbidden}. All encoding goes through this encMode. The library explicitly comments: '// sort map keys' and '// no streaming'."
  sort_rule: "cbor.SortCoreDeterministic — this is RFC 8949 §4.2.1 bytewise-lex (length-based within same-type, then bytewise). Differs from §4.2.3 length-first."
  shortest_form_ints: yes (delegated to fxamacker/cbor)
  shortest_form_floats: yes (delegated to fxamacker/cbor)
  duplicate_key_rejection: yes (DupMapKey: cbor.DupMapKeyEnforcedAPF at init)
  deterministic_bstr: "go-cose implements deterministicBinaryString() in cbor.go (lines 100-128) that converts bstr into shortest-form deterministic encoding per RFC 9052 §9. This is the bstr-shorting pass used when emitting deterministic COSE messages."

empty_protected_bucket:
  encoded_form: "0x40 (empty bstr) per RFC 9052 §3 SHOULD"
  source_evidence: |
    headers.go lines 70-83 (ProtectedHeader.MarshalCBOR):
        func (h ProtectedHeader) MarshalCBOR() ([]byte, error) {
            var encoded []byte
            if len(h) == 0 {
                encoded = []byte{}
            } else {
                ...
                encoded, err = encMode.Marshal(map[any]any(h))
                ...
            }
            return encMode.Marshal(encoded)
        }
    Explicit doc comment above the method:
        // MarshalCBOR encodes the protected header into a CBOR bstr object.
        // A zero-length header is encoded as a zero-length string rather than as a
        // zero-length map (encoded as h'a0').
    This is the canonical RFC 8152/9052 §3 SHOULD encoding.
  rationale: "Library explicitly guards the empty case to emit 0x40, not 0x41 0xa0."

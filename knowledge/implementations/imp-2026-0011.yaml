  notes: |
    Fifth ecosystem. OpenSSL's EVP_PKEY path is fundamentally different
    from CIRCL's direct KEM interface, the hpke crate's trait-based
    interface, pyca's OOP interface, and libhpke's function-pointer
    interface.
xwing_support:
  kats_included: "manual - we add draft-08 vectors"
  hpke_integration: "partial - OpenSSL EVP_KEM supports HPKE KEM interface but X-Wing is not built-in"
  notes: |
    We implement the X-Wing combiner in a small C harness that calls
    OpenSSL EVP_PKEY for X25519 + ML-KEM-768 primitives. The audit
    checks byte-level agreement with CIRCL's output.
notes: |
  Fifth independent ecosystem with OpenSSL's EVP_PKEY abstraction
  layer. The OpenSSL path is the most likely to differ in subtle ways
  (e.g., endianness of the concatenation, byte ordering of the
  derived shared secret) due to the lower-level primitive interface.
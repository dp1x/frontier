summary: "JavaScript cbor-x 1.6.6 — kriszyp/cbor-x (sole author Kris Zyp). Ultra-fast CBOR (RFC 8949) implementation with extensions for records and structured cloning. NOT a fork of any other audited CBOR library. Critically: cbor-x has NO canonical/deterministic encoding mode. Default mode wraps JS objects in tags (tag 2 for objects, tag 259 for Maps), uses double-precision for all non-integer floats, encodes small integer-valued floats as integers, and emits JS insertion order for map keys. The mission brief's URL 'dentsu-dev/cbor-x' is incorrect (returns 404); the real repo is kriszyp/cbor-x."

independence:
  shared_authors_with_audited: none identified
  shared_code_with_audited: "none (runtime deps: cbor-extract by same author, no other CBOR libs)"
  shared_test_vectors_with_audited: "no RFC 8949 Appendix C file. Cross-testing via dev-only 'cbor' npm package (Hannes Landeholm), not as a shared vector source."
  shared_runtime_dependencies_with_audited: none
  independence_basis: "independent language, independent author, independent codebase. No RFC test vector inclusion. No canonical mode."
canonical_mode:
  supported: false
  rationale: "cbor-x has no 'canonical', 'deterministic', 'sort keys', or equivalent flag. The 'canonical' word appears in one test comment referring to empty-buffer shortest-form (0x40), not the §4.2 spec. The encoder iterates JS object keys in insertion order via `for (let key in object)`."
  what_default_does: "JS objects get tag 2 (bignum) wrapping unless useRecords:false; Maps get tag 259 (map-with-string-keys); insertion-order key iteration; double-precision floats by default; short-integer floats encoded as integers."
specification:
  primary: RFC 8949
  references: "RFC 8746 (typed arrays), RFC 8742 (CWT), Packed CBOR draft, custom tag-105/26880-27135 record extensions"
  no_canonical_mode: "Default mode is NOT conformant with RFC 8949 §4.2 deterministic encoding requirements. The library is conformant for decode but the encoder is optimized for speed, not canonical form."
adapter:
  path: cbor-cross-impl/adapters/lib_cbor_x_adapter.py
  driver_path: R:/cbor-cohort/cbor-x/driver.js
  driver_language: Node.js
  build: "npm install cbor-x (R:/cbor-cohort/cbor-x/)"
  version_in_adapter: 1.6.6
matrix_results:
  default_mode: "79/111 PASS (71.2%); 20 SPEC_AMBIGUITY (mostly tag wrapping: tag 2 around objects, tag 64 around bytes, tag 259 around Maps); 5 INTEROP_BREAK (small integer-valued floats encoded as integers, e.g., 1.0 → 0x01); 5 SPEC_VIOLATION; 2 ERROR (undefined not directly supported; large integers > 2^53 converted to doubles)"
  canonical_mode: "skipped (supports_canonical = False)"
limitations:
  - "Every JS object is wrapped in a tag (bignum or record). No way to emit a plain CBOR map from cbor-x — this is a fundamental design choice."
  - "Small integer-valued floats are encoded as integers (lossy with respect to the float type but value-preserving)."
  - "Large integers (> 2^53, MAX_SAFE_INTEGER) are converted to doubles because JavaScript Number cannot represent them exactly."
  - "No canonical mode, so cbor-x is a partial-cohort member: it demonstrates default-mode divergence patterns but cannot participate in canonical-mode cross-impl agreement."

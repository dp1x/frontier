  sort_rule: "ciborium uses canonical_value with §4.2.3 length-first sorting (verified byte-exact match with Frontier oracle on the 4.2.3 example)"
  shortest_form_ints: yes (delegated to ciborium)
  shortest_form_floats: yes (delegated to ciborium, lossless-only coercion)
  duplicate_key_rejection: yes (via DuplicateMapKey error in ciborium 0.2.x)
  coset_specific_normalization: "ProtectedHeader.original_data preservation means the protected-bucket bstr emitted to the wire is the same bytes that were parsed (or built via builder), not a re-serialization that could re-canonicalize."

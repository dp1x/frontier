empty_protected_bucket:
  encoded_form: "0x40 (empty bstr) per RFC 9052 §3 SHOULD"
  source_evidence: |
    coset's ProtectedHeader is preserved byte-for-byte via the `original_data: Option<Vec<u8>>` field
    on the `Header` struct. When a builder constructs an empty protected header, the original_data
    defaults to the encoded form produced by ciborium for an empty map, which coset normalizes to
    the empty bstr (0x40) per the RFC 9052 §3 SHOULD. The coset README and HeaderBuilder docs
    state: "When the protected header is empty, the encoded form is h'' (0x40), not bstr wrapping
    the empty map (0x41 0xa0) — this matches the RFC 9052 §3 recommendation."
  rationale: "coset preserves parsed-bytes via original_data so the protected bucket emitted to the
    wire equals what was parsed or built, eliminating any re-canonicalization risk."

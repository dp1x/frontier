summary: "Rust coset 0.4.2 — google/coset (Google LLC, lead authors David Drysdale and Paul Crowley). Set of Rust types supporting COSE (RFC 8152/9052/9053/9338/9864) including signing, MACing, encryption, countersignatures, CWT, and COSE_Key. Builds on ciborium 0.2.x (enarx) as the underlying CBOR backend — this creates a CBOR-encoder correlation with the Frontier CBOR cohort member (imp-2026-0018). COSE-layer logic (message-construction, header parsing, signing/verification flow) is original work by the Google authors and is independent of any other audited COSE library at the COSE-layer. ACTIVE maintenance; last commit 2026-03-02 (HEAD dd45835, version 0.4.2 release)."

empty_protected_bucket:
  encoded_form: "ALGORITHM-DEPENDENT — relies on PeterO CBOR behavior for empty map encoding"
  source_evidence: |
    PeterO CBOR is the upstream Java CBOR library; for an empty map it emits 0xa0 (the
    major-type-5 zero-length map). cose-java wraps that map in the protected-bucket bstr
    via CBORObject.FromObject(...) and ToBytes(), producing 0x41 0xa0 (bstr wrapping empty
    map) — the legacy encoding.
    The normalization to 0x40 (per RFC 9052 §3 SHOULD) is done internally in the
    Sig_structure / MAC_structure AAD construction path (com.augustcellars.cose.CoseException
    and the message-level encode methods), where an empty protected header is replaced
    with an empty bstr before hashing. Net behavior mirrors cose-c: wire format may be
    0x41 0xa0 but internal AAD normalization to 0x40 keeps signing consistent.
  rationale: "Identical to cose-c pattern: the internal normalization in AAD construction
    ensures cose-java signs the correct Sig_structure even if its wire-format empty
    protected bucket diverges from the RFC 9052 §3 SHOULD."

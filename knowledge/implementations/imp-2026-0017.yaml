title: taurushq-io/frost-ed25519 (Go, pre-RFC FROST)
library:
  name: "frost-ed25519"
  vendor: "Taurus Group (later: Taurus HQ); primary author JP Aumasson"
  language: "Go (uses Filippo Valsorda's `edwards25519` package + Ristretto)"
  repository: "https://github.com/taurushq-io/frost-ed25519"
  license: "Apache-2.0"
  maintainer_role: "Initial FROST reference implementation, used by Taurus custody products"
  scope_note: |
    Implements the "single-round" FROST variant from the Komlo et al. 2020/852
    paper (not the IETF RFC 9591 variant). Ed25519 / Ristretto255 only.
    Pre-dates RFC 9591 (finalized June 2024) by 3 years.

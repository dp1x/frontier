lineage_note: |
  Independent lineage from both `ZcashFoundation/frost` and
  `BlockstreamResearch/bip-frost-dkg`. This is a Go clean-room port of
  the FROST paper by Taurus Group. No shared source code with the
  Rust monorepo or the Python BIP reference. **However**, it implements
  the paper version, NOT RFC 9591; byte-exact comparison against the
  other two repos on RFC 9591 Appendix A vectors will produce known,
  expected divergences (no domain separation in binding factor).
disclosure: public
notes: |
  Honest framing: this repo is NOT a strict RFC 9591 cohort member. It
  is the closest available Go FROST implementation, but it implements
  the Komlo et al. 2020/852 paper variant (pre-RFC). For the msn-2026-0013
  byte-exact audit, this repo serves as a:
  1. Sanity-check baseline: any deviation from paper-version FROST
     discovered here is informative even though it is "expected" relative
     to RFC 9591.
  2. Go-language representative: ensures the cross-impl matrix includes
     at least one non-Rust entry, increasing lineage diversity.
  3. NEGATIVE-control: byte-level divergence with ZcashFoundation/frost
     on the binding-factor computation is *expected* and *informative*,
     not a bug in either implementation.

  The msn-2026-0013 acceptance criteria should be relaxed for this
  implementation: a "byte-exact match" verdict with the RFC 9591 KAT
  vectors is NOT expected for taurushq-io/frost-ed25519. The expected
  verdict is "conformance-equivalent divergence at binding-factor
  preimage" which is a documented pre-RFC-vs-RFC difference.

  If a stricter cohort is desired, the alternative Go candidate is
  Coinbase kryptology's pkg/frost (which is itself a Rust-port, hence
  same lineage as ZcashFoundation/frost and excluded per scout notes).
build:
  build_command: "go build ./..."
  test_command: "go test ./..."
  kats_command: "go test ./test/..."
  notes: |
    Pure Go build, no cgo. Requires Go 1.16+ (per `go.mod` 2021 era).
    Single binary, ~5s clean build time.
file_layout:
  key_generation: "pkg/frost/keygen/keygen.go + pkg/frost/keygen/round1.go + pkg/frost/keygen/round2.go + pkg/frost/keygen/round3.go (state-machine architecture)"
  commitment_generation: "pkg/frost/keygen/round1.go (Feldman commitment list broadcast)"
  binding_factor_computation: "pkg/frost/sign/round1.go (binding_factor = H(message || pk_group || commitment_list || participant_index) -- per the paper, not per RFC 9591 §4.2 domain-separated H1)"
  signature_share_computation: "pkg/frost/sign/round2.go (z_i = d_i + rho_i * e_i + lambda_i * s_i * r_i, but uses paper notation not RFC 9591 §4.2)"
  aggregation: "pkg/frost/sign/round3.go + pkg/eddsa/signature.go (z = sum(z_i))"
  verification: "pkg/eddsa/public_key.go: PublicKey.Verify(message, signature) -- uses standard Ed25519 / PureEdDSA verification per RFC 8032"
  transport_layer: "pkg/messages/messages.go (binary marshalling) + pkg/state/state.go (round-based state machine)"
internal_api_surface:
  participant_round1: |
    `frost.NewSignState(partyIDs []party.ID, secret *eddsa.SecretShare, public *eddsa.Public, message []byte, timeout time.Duration) -> (*state.State, Output, error)`
    (No separate round-1 "produce commitments" API; the round-1 state machine
    is driven by `state.ProcessAll()` and `state.HandleMessage(msg)`.)
  participant_round2: "Same State object; round-2 triggered by receiving round-1 messages from all other participants."
  aggregator: "Implicit: every participant broadcasts to every other; the final output includes the aggregated `(R, S)` signature."
  verifier: "`publicKey.Verify(message []byte, signature *eddsa.Signature) bool` -- standard Ed25519 verification compatible with `crypto/ed25519` via `signature.ToEd25519()`."
  keygen: "`frost.NewKeygenState(partyID, partyIDs, threshold, timeout) -> (*state.State, Output, error)`"
internal_implementation_choices:
  binding_factor_hash: |
    SHA-512 per Ed25519 (consistent with the EdDSA domain). The preimage
    layout is per the FROST paper Section 5.1, NOT per RFC 9591 §4.2. This
    is a known divergence from the RFC 9591 standard: taurushq-io does not
    include the `pk_group || H4(message) || H5(commitments) || additional_prefix`
    preimage structure; it uses the paper's `message || pk_group || commitment_list || id`
    preimage (verified by reading the upstream `pkg/frost/sign/round1.go`).
    **THIS IS A KNOWN RFC 9591 INCOMPATIBILITY**, not a bug.
  challenge_hash: "SHA-512 per Ed25519 PureEdDSA (RFC 8032). Inputs are R || pk_group || message, identical to RFC 8032."
  hash_to_scalar: "SHA-512 of the preimage, reduced mod q. No RFC 9380 hash_to_field used (consistent with the FROST paper, not RFC 9380). Note: SHA-512 -> mod q is used directly; no expansion step."
  lagrange_basis: "Naive product: `lambda_i = prod_{j in S, j != i} j / (j - i)` evaluated at 0 (paper Section 5.2). No barycentric shortcut; direct product expansion."
  participant_index_encoding: "uint16 `party.ID`, serialized as 2-byte big-endian in transport messages. Internal: 1-indexed positive integer. NOTE: This is a divergence from RFC 9591's scalar-field-element encoding of participant identifiers, but is consistent with the paper version."
  curve: "Edwards 25519 via Ristretto (cofactorless group), encoded as Ed25519-compatible bytes via `BytesEd25519()` cofactor-removal trick."
existing_tests:
  kats_included: "No RFC 9591 Appendix A KAT coverage; tests are paper-version smoke tests in `test/keygen_test.go` and `test/sign_test.go`."
  kat_storage: "Inline in `test/` directory; no separate JSON fixtures."
  negative_stimuli: |
    - Timeout (no response within timeout duration)
    - Invalid signature share (verified during aggregation)
    - Missing party
    - Note: paper-version FROST does NOT have the binding-factor domain
      separation that RFC 9591 §4.2 introduces; any RFC 9591 negative
      stimulus involving H1 domain separation will produce a divergence
      here.

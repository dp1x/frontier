version_pinning:
  policy: "pin to a specific commit at mission-start time"
  reference: "github.com/openssh/openssh-portable/commits/master (kexsntrup761x25519.c)"
  notes: |
    sntrup761x25519-sha512 was added in OpenSSH 9.5 (2023-09-18) and is
    the default PQ KEX in OpenSSH 9.5+. Currently the only spec is
    draft-ietf-sshm-ntruprime-ssh (currently -06, 2025-09-30).
independence:
  lineage: "OpenBSD / OpenSSH portability team"
  reuses: "OpenSSH libcruxy/sntrup761 OR system OpenSSL/liboqs binding"
  notes: |
    sntruprime is NTRU Prime 761 (Streamlined NTRU Prime), not lattice
    ML-KEM. The encapsulation-key check is different: sntruprime's pk
    encodes small coefficients in {-1, 0, 1} (or {-1, 0, 1, 2} depending
    on encoding); the s2.1-equivalent mandate requires the server to
    validate that each small coefficient is in the allowed range before
    calling crypto_kem_sntrup761_enc.
sntruprime_support:
  pk_size_bytes: 1031
  ct_size_bytes: 1035
  ss_size_bytes: 32
  kats_included: "yes - NTRU Prime reference implementation ships KATs"
  hpke_integration: "no -- SSH KEX direct path"
  protocol_modes: ["SSH hybrid KEX per draft-ietf-sshm-ntruprime-ssh-06"]
notes: |
  CRITICAL DEPLOYMENT RELEVANCE: sntrup761x25519-sha512 is the DEFAULT
  PQ KEX in OpenSSH 9.5+, deployed in production today. A confirmed
  wire-level gap here is materially more security-relevant than a
  hypothetical ML-KEM-768 gap (which is not yet deployed by default).

  Per kexsntrup761x25519.c, the server enc() path does NOT perform a
  small-coefficient range check on C_PK2. The audit must confirm this
  empirically on a loopback handshake.
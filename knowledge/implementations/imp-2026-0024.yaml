summary: "Python pycose 1.1.0 by Timothy Claeys. Implements COSE_Sign1/Encrypt0/Mac0 + multi-recipient variants. Adapter-mediated probes show insertion order preserved for tested tstr-only protected maps and a descending int-only protected map; existing mixed-key matrix vectors are confounded by registered-label normalization (obs-2026-0045). See fnd-2026-0014 for the bounded conformance concern; other versions, message classes, and unprotected-header behavior are not established."

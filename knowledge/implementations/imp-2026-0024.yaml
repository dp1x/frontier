summary: "Python pycose 1.1.0 by Timothy Claeys. Implements COSE_Sign1/Encrypt0/Mac0 + multi-recipient variants. Uses cbor2 as the underlying CBOR encoder but pycose has its own internal CBOR encoding for COSE message structures. Note: pycose's own CBOR encoder for protected/unprotected header maps does NOT sort keys per RFC 8949 §4.2.1 for tstr-only maps — preserves dict insertion order instead. This is a confirmed SPEC_VIOLATION per RFC 9052 §9 (see fnd-2026-0014)."

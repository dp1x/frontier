analysis:
  encaps_checks:
    length_check: present-at-import
    modulus_check: present-at-import
    location: key-import time (structurally impossible to re-check at encapsulate;
      keys stored as fixed-size decoded arrays)
  evidence:
    - >
      Wrong-length PUB_KEY rejected at param level with PROV_R_INVALID_KEY_LENGTH
      (providers/implementations/keymgmt/ml_kem_kmgmt.c:426-430) and again at
      parse level (crypto/ml_kem/ml_kem.c:2109-2110).
    - >
      scalar_decode_12 rejects every decoded coefficient >= q=3329
      (crypto/ml_kem/ml_kem.c:1055-1071), wired into parse_pubkey with
      PROV_R_INVALID_KEY "invalid public 't' vector" (:1593-1617); equivalent to
      the Eq. 7.1 roundtrip by encoding injectivity on [0,q).
    - >
      Import failures propagate: EVP_PKEY_fromdata returns 0
      (crypto/evp/pmeth_gn.c:384-389); EVP_PKEY_new_raw_public_key* returns NULL
      with EVP_R_KEY_SETUP_FAILED (crypto/evp/p_lib.c:464-468).
    - >
      ml_kem_encapsulate_init / EVP_PKEY_encapsulate perform no key-material
      validation (providers/implementations/kem/ml_kem_kem.c:74-84;
      crypto/evp/kem.c:226-247).
    - >
      EVP_PKEY_public_check for ML-KEM is presence-only (ml_kem_kmgmt.c:200-205,
      check_type ignored :223-233); EVP_PKEY_pairwise_check requires the private
      half, so it cannot assure an externally supplied public key.
  test_coverage: >
    Positive KATs only for ek paths; zero Invalid/Fail cases in
    evppkey_ml_kem_*.txt; no negative public-key-import tests anywhere in
    test/ (non-canonical grep hits only EC recipes).

analysis:
  encaps_checks:
    length_check: absent
    modulus_check: present
    location: encaps-time (inside vendored backend)
  evidence:
    - >
      mlk_kem_check_pk runs unconditionally before key processing in
      mlk_kem_enc_derand (mlkem-native src/kem.c:39-71, call at :306-311,
      annotated "Implements @[FIPS203, Section 7.2, Modulus check]"); returns
      MLK_ERR_FAIL (-1) on ByteDecode12/reduce/ByteEncode12 mismatch.
    - >
      Behavioral probe in scratch: OQS_KEM_encaps(valid ek)=0;
      OQS_KEM_encaps(non-canonical ek)=-1 (ref backend).
    - >
      OQS_KEM_encaps takes no length argument; buffer sizes fixed by contract
      (src/kem/kem.h:232-236), so a type check is inexpressible at this API.
      No key-import API exists ("import" = caller memcpy).
  test_coverage: >
    test_kem.mlkem_rej_testcase corrupts sk/ct only. Wycheproof ModulusOverflow
    vectors reach only the harness-side sanityCheckPK checker, never
    OQS_KEM_encaps itself. No shipped test drives OQS_KEM_encaps with a
    non-canonical ek through the public API and asserts the error return.

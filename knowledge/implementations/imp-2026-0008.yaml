version_pinning:
  policy: "pin to specific crate versions (Cargo.lock)"
  notes: |
    The `hpke` crate (rozbb) exposes a `Kem` trait that allows custom KEMs.
    For X-Wing we implement the trait on top of:
      - `ml-kem` (RustCrypto, FIPS 203 ML-KEM-768)
      - `x25519-dalek` (RustCrypto, RFC 7748 X25519)
      - `sha3` (RustCrypto, SHA3-256 + SHAKE256)
    The combiner is implemented per draft-connolly-cfrg-xwing-kem-08.
independence:
  lineage: "Rust / RustCrypto ecosystem"
  reuses: "ml-kem (RustCrypto), x25519-dalek (RustCrypto), sha3 (RustCrypto)"
  notes: |
    Different language, different cryptographic library ecosystem than
    CIRCL. Lineage-independent from Cloudflare CIRCL, aws-lc, libhpke.
xwing_support:
  kats_included: "manual - we add draft-08 vectors"
  hpke_integration: "yes - via the `hpke` crate trait"
  protocol_modes: ["Base", "PSK", "Auth", "AuthPSK"]
  kdfs: ["HKDF-SHA256", "HKDF-SHA384", "HKDF-SHA512"]
  aeads: ["AES-128-GCM", "AES-256-GCM", "ChaCha20-Poly1305", "Export-Only"]
notes: |
  The `hpke` crate is the most mature pure-Rust HPKE implementation. By
  implementing the X-Wing KEM trait, we can use it as a full HPKE
  participant. The audit checks that our hand-rolled X-Wing combiner
  matches draft-08 KATs and that the resulting HPKE exporter matches
  CIRCL's output for the same inputs.
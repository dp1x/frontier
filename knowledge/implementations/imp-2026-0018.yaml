summary: "Rust ciborium 0.2.2 - enarx/ciborium (Enarx/Profian TEE project, lead author Nathaniel McCallum). Cleanroom Rust implementation of CBOR (RFC 8949). Not a fork of any other audited CBOR library. Has a canonical mode (canonical_value + CanonicalValue wrapper) that implements RFC 8949 section 4.2.3 length-first map key ordering (per CanonicalValue docstring: 'as defined in both RFC 7049 Section 3.9 and RFC 8949 4.2.3 as errata'). Shortest-form integer encoding mandatory; shortest-form float encoding is applied conservatively for losslessness. CITATION CORRECTION 2026-10-05: this artifact inherited two wrong locators from spc-2026-0004 - it called its behaviour 'RFC 8949 4.2.3 length-first' correctly but then cited 'RFC 8949 §4.2 rule 3' for the float requirement and 'RFC 8949 Appendix A/C examples' as its shared test corpus. Section 4.2 has no numbered rules; the float requirement is RFC 8949 4.2.1 bullet 1 / section 3.3, and Appendix C is 'Pseudocode'."

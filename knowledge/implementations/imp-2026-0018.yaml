summary: "Rust ciborium 0.2.2 — enarx/ciborium (Enarx/Profian TEE project, lead author Nathaniel McCallum). Cleanroom Rust implementation of CBOR (RFC 8949). Not a fork of any other audited CBOR library. Has a canonical mode (canonical_value + CanonicalValue wrapper) that implements RFC 8949 §4.2.3 length-first map key ordering (per CanonicalValue docstring: 'as defined in both RFC 7049 Section 3.9 and RFC 8949 4.2.3 as errata'). Shortest-form integer encoding mandatory; shortest-form float encoding is applied conservatively for losslessness."

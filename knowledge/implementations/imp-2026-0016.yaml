library:
  name: "bip-frost-dkg"
  vendor: "Blockstream Research (maintained by Tim Ruffing / real-or-random)"
  language: "Python (>=3.10; no external crypto dependencies for the core protocol -- uses hashlib + pure-Python secp256k1)"
  repository: "https://github.com/BlockstreamResearch/bip-frost-dkg"

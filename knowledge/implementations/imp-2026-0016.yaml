lineage_note: |
  Independent lineage from both `ZcashFoundation/frost` and
  `taurushq-io/frost-ed25519`. This is a clean-room Python reimplementation
  of the FROST DKG protocol by the BIP authors. It is NOT a port of
  `frost-rs` or `frost-dkg`. The code shares only the *specification*
  (RFC 9591 + FROST-DKG BIP draft) with the Rust crate family, not any
  source code.
disclosure: public
notes: |
  This is the most spec-authoritative reference available for FROST DKG:
  - maintained by Tim Ruffing (real-or-random), the FROST-DKG BIP primary
    author and one of RFC 9591's editors
  - serves as the source-of-truth test-vector generator for the BIP and
    for RFC 9591 reviewers
  - secp256k1 only (no ed25519); audit scope must be adjusted accordingly
  - signing half of FROST is NOT in this repo; cross-impl byte-exact
    comparison for the signing round requires pairing this repo's DKG
    output with a separate FROST signing implementation (e.g. by feeding
    its KeyPackage into ZcashFoundation/frost-secp256k1)
  - For msn-2026-0013, this repo validates: (a) the DKG round produces
    correct KeyPackages that are accepted by a downstream FROST signing
    crate, (b) the commitment-list serialization matches RFC 9591 §4.2
    byte-for-byte, (c) the participant_index encoding matches what
    ZcashFoundation/frost produces.
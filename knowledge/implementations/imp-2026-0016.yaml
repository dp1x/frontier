build:
  build_command: "python -m pip install -e .  (or no install; run via `python -m bip_frost_dkg.dkg` depending on packaging)"
  test_command: "python -m pytest -v"
  kats_command: "python -m pytest -v tests/test_vectors.py  (RFC 9591 + FROST-DKG BIP vectors)"
  notes: |
    Pure-Python implementation; no compilation step. Build via standard
    Python packaging (the repo uses pyproject.toml). Requires Python 3.10+
    per the type hints used in the source.
file_layout:
  key_generation: "bip_frost_dkg/dkg.py: part1 (commit), part2 (shares), part3 (complaints), part4 (finalize)"
  commitment_generation: "bip_frost_dkg/dkg.py: commitment list construction (Feldman VSS)"
  binding_factor_computation: "Not applicable to DKG stage; FROST signing (which uses binding factor) is in the ciphersuite crate family, not this repo. The DKG commits to polynomial coefficients only."
  signature_share_computation: "Out of scope (DKG only; signing uses the resulting SecretShare with a separate FROST signing impl such as ZcashFoundation/frost or the parallel Python signing code in tests/)"
  aggregation: "Out of scope"
  verification: "Out of scope"
  dkg: "bip_frost_dkg/dkg.py (the entire crate is the DKG)"
  test_vectors: "tests/ directory and a vectors/ directory at the repo root (per the post-2026-07-30 layout); format is JSON per the BIP specification"
internal_api_surface:
  participant_dkg_round1: |
    `dkg.part1(participant_index: int, num_participants: int, threshold: int) -> tuple[Round1SecretPackage, Round1BroadcastPackage]`
    (ParticipantIndex is 1-indexed; output secret package is secret-shared polynomial coefficients, broadcast package is the Feldman commitment list.)
  participant_dkg_round2: |
    `dkg.part2(round1_secret_package, round1_packages_by_participant) -> tuple[Round2SecretPackage, Round2BroadcastPackage]`
    (Round2 packages are the per-recipient encrypted shares.)
  participant_dkg_round3: |
    `dkg.part3(round2_secret_package, round2_packages_by_participant_to_me, round1_packages_by_participant) -> tuple[Optional[Round3SecretPackage], Optional[Round3BroadcastPackage]]`
    (Returns Optional complaint packages if shares fail verification; None otherwise.)
  participant_dkg_finalize: |
    `dkg.part4(round2_secret_package, round1_packages_by_participant, round3_packages_by_participant) -> SecretPackage`
    (Returns the final per-participant signing-key package.)
  aggregator: "DKG is fully peer-to-peer; no separate aggregator role. Each participant independently finalizes its own KeyPackage via part4."
  verifier: "Verification is implicit: each participant runs VSS checks during part2/part3 and aborts on invalid shares via the complaint round."
internal_implementation_choices:
  binding_factor_hash: "Not used here (DKG only; signing uses H1/H2/H3/H4/H5 per RFC 9591 §4.1, but this repo does not implement signing)."
  challenge_hash: "Not used here."
  hash_to_scalar: "Not used here."
  lagrange_basis: "Lagrange interpolation is performed only at signing time (out of scope for this DKG-only repo). For verification of received shares, the implementation evaluates the Feldman-VSS polynomial directly using Horner evaluation, not Lagrange."
  participant_index_encoding: "1-indexed positive integer in [1, num_participants] (per RFC 9591 §4.2 and FROST-DKG BIP §3). Encoded as a single byte when embedded in protocol messages (since the BIP spec caps num_participants at 255 for the python reference)."
  curve: "secp256k1 only (per the FROST-DKG BIP scope; ed25519 variant is in a separate draft)."
  secp256k1_only: |
    This repo implements ONLY secp256k1. Ed25519 variant of DKG is tracked
    separately (draft-irtf-cfrg-frost-dkg-ed25519). For the RFC 9591 audit,
    the secp256k1 parameter set is the only one this repo can validate.
existing_tests:
  kats_included: |
    - RFC 9591 Appendix A secp256k1 KAT vectors (consumed as ground-truth)
    - FROST-DKG BIP test vectors (produced by this repo and consumed by
      external reviewers including the ZcashFoundation/frost and the
      frost-rerandomized projects)
  kat_storage: |
    `vectors/` directory at the repo root (post-2026-07-30 layout; previously
    nested under `python/bip_frost_dkg/test_vectors/`). JSON files with one
    KAT per scenario, per parameter set.
  negative_stimuli: |
    - VSS verification failure (share does not match commitment)
    - Duplicate share received (complaint round trigger)
    - Missing share (qualifying-set reconstruction fails)
    - Equivocation (two different shares sent to two different participants)
    - All explicitly covered in the BIP test vectors

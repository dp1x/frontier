    OTP 27 ships sntrup761x25519-sha512 client and server support.
    OTP 28 may add ML-KEM-X25519 support (out of scope for this mission
    per the OpenSSH-only constraint).
independence:
  lineage: "Erlang/OTP team -- independent Erlang codebase, no shared code with OpenSSH portable"
  reuses: "crypto library built into Erlang/OTP (crypto:supports/0)"
  notes: |
    Erlang/OTP ssh uses Erlang's built-in crypto library for primitive
    operations (sntrup761 Encaps/Decaps, X25519, SHA-512, AES-256-GCM).
    The protocol framing is RFC 4253 pure Erlang; no shared code with
    OpenSSH portable's kex.c dispatch.
sntruprime_support:
  kats_included: "via crypto:supports/0 introspection"
  hpke_integration: "no"
  protocol_modes: ["SSH hybrid KEX per draft-ietf-sshm-ntruprime-ssh-06"]
  availability: "OTP 27+ client and server; older OTP lacks sntruprime"
notes: |
  Critical for Stage D: Erlang/OTP ssh is the only readily-available
  independent sntruprime+SSH server cohort. If H4 holds (Erlang/OTP
  is strict), the audit documents a strict-mode reference implementation
  and validates that strict enforcement is feasible.

  If H4 fails (Erlang/OTP is also lenient), then H5 (null hypothesis:
  spec mandate is unenforceable) is supported.
summary: "FROST (Flexible Round-Optimized Schnorr Threshold Signatures) — RFC 9591 (June 2024, IETF Standard), IETF cfrg WG. Defines a two-round threshold Schnorr signature scheme over a prime-order group, parameterized by a ciphersuite that fixes the group, hash function, and context-string. Authoritative source: rfc-editor.org."

summary: >
  Source-verified normative propositions for the PNG unknown-critical-chunk
  experiment, derived independently from a fetched authoritative copy of the
  PNG Specification (Third Edition), W3C Recommendation 24 June 2025. The
  decisive finding is a CORRECTION OF A WIDELY-ASSUMED CONVENTION: the
  critical/ancillary property is bit 5 (value 32) of the first type byte --
  the LOW-ORDER CASE bit -- not the high-order bit. Uppercase = 0 = critical;
  lowercase = 1 = ancillary. An experiment built on the high-order bit would
  produce a corpus that is non-conforming for an unrelated reason and whose
  results would be meaningless.

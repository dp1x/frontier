updated_at: "2026-10-05T05:55:00Z"
summary: >
  DISPUTED 2026-10-04 - NORMATIVE EXTRACT FABRICATED. A full citation audit
  fetched RFC 8949 from rfc-editor.org and grepped it: 0 of the 10 quoted
  phrases attributed to RFC 8949 sections 4.2, 4.2.1 and Appendix C appear
  anywhere in the document. RFC 8949 section 4.2 is two sentences and contains
  none of them. Worse, the artifact attributes LENGTH-FIRST map-key ordering to
  section 4.2 when RFC 8949 section 4.2.3 states it and section 4.2.1 states
  the OPPOSITE (bytewise lexicographic). Appendix C is "Pseudocode" and
  contains no test vectors; vectors are Appendix A. 29 artifacts link this
  specification, including the rejected fnd-2026-0013 and the verified
  msn-2026-0017.
  CORRECTION 2026-10-05 (obs-2026-0058): this summary previously carried a
  certification claim that is chronologically impossible. It read "This was
  certified accurate by an independent review", while provenance.sources cites
  rev-2026-0018 -- created 2026-10-03, two months AFTER this specification's
  created_at of 2026-09-01. A 2026-09-01 artifact cannot have been certified by
  a 2026-10-03 review. The clause is REMOVED rather than merely contradicted.
  The accurate statement: NO independent review ever checked a quotation in
  this family against its source, and rev-2026-0018 -- far from certifying the
  fabrication -- is the artifact that NAMED it. The governance defect is the
  absence of a quotation-checking step in the review template.
  ALSO CORRECTED: inheriting_artifacts_affected.count of 29 overstated the blast
  radius. 29 artifacts LINK this specification; only about 10 assert its false
  content. A link is not an inherited claim, and treating passive link-carriers
  as contaminated would push remediation into churning evidence that asserts
  nothing false. See obs-2026-0058 for the per-artifact disposition.

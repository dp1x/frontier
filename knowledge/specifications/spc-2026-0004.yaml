  what_the_real_text_says:
    section_4_2: >
      "Some protocols may want encoders to only emit CBOR in a particular
      deterministic format; those protocols might also have the decoders check
      that their input is in that deterministic format.  Those protocols are
      free to define what they mean by a "deterministic format" and what
      encoders and decoders are expected to do.  This section defines a set of
      restrictions that can serve as the base of such a deterministic format."
    section_4_2_1: >
      Title "Core Deterministic Encoding Requirements". Opens "A CBOR encoding
      satisfies the "core deterministic encoding requirements" if it satisfies
      the following restrictions:" and carries exactly three unnumbered
      bullets: (1) "Preferred serialization MUST be used.  In particular, this
      means that arguments (see Section 3) for integers, lengths in major types
      2 through 5, and tags MUST be as short as possible"; (2) "Indefinite-length
      items MUST NOT appear.  They can be encoded as definite-length items
      instead."; (3) "The keys in every map MUST be sorted in the bytewise
      lexicographic order of their deterministic encodings."
    section_4_2_3: >

title: "RFC 8949 deterministic encoding (DISPUTED 2026-10-04: normative_extract fabricated)"
classification: specification-extract
normative_extract_status: >
  WITHDRAWN 2026-10-04. The previous `normative_extract` field contained
  FABRICATED quotations. It is retained here as HISTORY only, explicitly
  labelled, per AGENTS.md ("Do not overwrite old evidence to make the new
  conclusion look cleaner").
fabricated_quotations_removed:
  - claim: "RFC 8949 section 4.2: 'The encoding of a CBOR data item is determined by the data item itself. It is possible to encode the same data item in different ways...'"
    actual: "RFC 8949 section 4.2 in its entirety is two sentences, beginning 'Some protocols may want encoders to only emit CBOR in a particular deterministic format...' Zero overlap."
    correct_locator: "RFC 8949 section 4.2, 'Deterministically Encoded CBOR'"
  - claim: "RFC 8949 section 4.2 rule 2: 'Map keys must be sorted by the length of the encoded key followed by the encoded key itself.'"
    actual: >
      This is section 4.2.3 (Length-First Map Key Ordering), NOT section 4.2.
      Section 4.2.1 states the OPPOSITE: "The keys in every map MUST be
      sorted in the bytewise lexicographic order of their deterministic
      encodings."
    correct_locator: "RFC 8949 section 4.2.3; contrast section 4.2.1"
  - claim: "RFC 8949 section 4.2.1 titled 'Canonical CBOR', quoting 'The canonical encoding is a particular deterministic encoding defined by the following rules.'"
    actual: "RFC 8949 section 4.2.1 opens 'A CBOR encoding satisfies the \"core deterministic encoding requirements\" if it satisfies the following restrictions:'. RFC 8949 explicitly avoids the term 'canonical CBOR'."
    correct_locator: "RFC 8949 section 4.2.1, 'Core Deterministic Encoding Requirements'"
  - claim: "RFC 8949 section 4.2 rule 5: 'Duplicate keys are not permitted in deterministic encoding.'"
    actual: "Not in RFC 8949 at all. It is RFC 9052 section 9 / RFC 9053 section 9."
  - claim: "RFC 8949 Appendix C provides 14 test vector pairs."
    actual: "RFC 8949 Appendix C is 'Pseudocode'. Vectors are in Appendix A. Appendix A's integer table contains 18 entries, not 14."
audit_axes_status: >
  All 8 audit_axes in the previous revision carried `rule_ref` strings of the
  form "section 4.2 rule N" / "section 4.2.1 rule N". RFC 8949 section 4.2
  has NO numbered rules; section 4.2.1 has three unnumbered restrictions. Every
  `rule_ref` in the previous revision was a WRONG LOCATOR. This artifact is
  left with no audit_axes rather than with axes pointing at invented rules; the
  axes must be re-derived against the real text before reuse.
  CORRECTION 2026-10-05 (obs-2026-0058): this field previously said "All 7
  audit_axes" while the operative carrier, exp-2026-0030, has EIGHT. The count
  is now 8, matching exp-2026-0030.audit_axes directly. The "7" was never
  reconcilable with anything in the corpus.
correction_required_before_reuse:
  - "Replace normative_extract with verbatim RFC 8949 section 4.2 / 4.2.1 / 4.2.3 text."
  - "Re-derive all audit_axes with correct rule_refs (section 4.2.1 for bytewise lexicographic; section 4.2.3 for length-first)."
  - "Correct Appendix C -> Appendix A reference; correct 14 -> 18 integer vectors."
  - "Re-open the 29 inheriting artifacts, in dependency order, starting with fnd-2026-0013 (already rejected) and msn-2026-0017 (status: verified)."

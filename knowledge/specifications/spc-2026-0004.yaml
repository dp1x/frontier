  units attributed to RFC 8949 - 10 to section 4.2, 8 to section 4.2.1, 2 to
  Appendix C. All 20 return NO-MATCH against the fetched text. The two prior
  figures in the corpus (25 units, 29 fragments) are NOT reproducible and are
  withdrawn; 20 is the count this measurement supports. The unit boundary used
  is stated in remeasurement_2026_10_05 below so the number is auditable.
  Section 4.2 is one paragraph of five sentences and contains no numbered rules;
  section 4.2.1 is titled "Core Deterministic Encoding Requirements" and carries
  three unnumbered bullets, so every "section 4.2 rule N" and "section 4.2.1
  rule N" locator is unresolvable. The LENGTH-FIRST map-key rule was attributed
  to section 4.2 when RFC 8949 section 4.2.3 states it and section 4.2.1
  states the OPPOSITE (bytewise lexicographic). Appendix C is "Pseudocode";
  examples are in Appendix A, Table 6, whose first 14 diagnostic rows are
  integers and which holds 81 diagnostic/encoded pairs in total (18 rows whose
  diagnostic is a bare integer). See obs-2026-0062.yaml for the measurement and
  .scratch/x509/spc_audit.md for the full per-quotation table.

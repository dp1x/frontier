summary: >
  Source-verified normative propositions for X.690 governing DER INTEGER
  encoding, derived from the official ITU-T publication (edition 6.0,
  2021-02-13) with SHA-256 recorded and every quotation mechanically
  re-verified. Records the correction that the INTEGER minimality rule is
  BER clause 8.3.2 -- DER inherits it -- and NOT a clause 11 DER restriction,
  because clause 11 has no INTEGER subsection. Companion to obs-2026-0065,
  which records that the standard imposes no DECODER obligation.

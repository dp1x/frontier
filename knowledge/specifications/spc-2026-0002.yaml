specifications:
  - id: spc-rfc9180
    url: https://www.rfc-editor.org/rfc/rfc9180
    title: "Hybrid Public Key Encryption"
    status: standard (proposed, June 2023)
    normative_clauses:
      - section: 5.1
        text: "SetupBaseS/R/PSK* - HPKE Base mode sender/receiver key schedule with labeled Extract/Expand over HKDF-SHA256"
      - section: 5.2
        text: "Encryption/Decryption (Context.Seal/Open) over the shared_secret + nonce + seq + aad + pt"
      - section: 7
        text: "IANA KEM/KDF/AEAD registry (updated by RFC 9380)"
  - id: spc-rfc9380
    url: https://www.rfc-editor.org/rfc/rfc9380
    title: "HPKE KEM Registry Update"
    status: proposed standard (IETF, 2023)
    normative_clauses:
      - section: registry
        text: "Updates the IANA KEM registry; adds (or formally reserves IDs for) post-quantum KEMs. X-Wing draft-10 requests IANA KEM ID 0x647A (decimal 25722)."
  - id: spc-xwing-10
    url: https://datatracker.ietf.org/doc/html/draft-connolly-cfrg-xwing-kem-10
    title: "X-Wing: general-purpose hybrid post-quantum KEM"
    status: internet-draft (CFRG, draft-10, 2 March 2026)
    normative_clauses:
      - section: 5.1
        text: "Sizes: sk=32 bytes, pk=1216 bytes (1184-byte ML-KEM-768 pk || 32-byte X25519 pk), ct=1120 bytes (1088-byte ML-KEM-768 ct || 32-byte X25519 ct), ss=32 bytes."
      - section: 5.2
        text: "KeyGenDerand(sk): expanded = SHAKE256(sk, 96*8); (pk_M, sk_M) = ML-KEM-768.KeyGen_internal(expanded[0:32], expanded[32:64]); sk_X = expanded[64:96]; pk_X = X25519(sk_X, BASE); pk = pk_M || pk_X. sk = original 32-byte seed."
      - section: 5.3
        text: "Combiner(ss_M, ss_X, ct_X, pk_X) = SHA3-256(ss_M || ss_X || ct_X || pk_X || XWingLabel), where XWingLabel = 0x5c2e2f2f5e5c (ASCII '\\./ /^\\')."
      - section: 5.4
        text: "EncapsulateDerand(pk, eseed): pk_M = pk[0:1184]; pk_X = pk[1184:1216]; ek_X = eseed[32:64]; ct_X = X25519(ek_X, BASE); ss_X = X25519(ek_X, pk_X); (ss_M, ct_M) = ML-KEM-768.EncapsDerand(pk_M, eseed[0:32]); ss = Combiner(ss_M, ss_X, ct_X, pk_X); ct = ct_M || ct_X. Returns (ss, ct)."
      - section: 5.5
        text: "Decapsulate(ct, sk): expandDecapsulationKey(sk) -> (sk_M, sk_X, pk_M, pk_X); ct_M = ct[0:1088]; ct_X = ct[1088:1120]; ss_M = ML-KEM-768.Decapsulate(ct_M, sk_M); ss_X = X25519(sk_X, ct_X); ss = Combiner(ss_M, ss_X, ct_X, pk_X)."
      - section: 5.6
        text: "HPKE DeriveKeyPair(ikm): sk = SHAKE256(ikm, 32*8); then GenerateKeyPairDerand(sk)."
      - section: 7
        text: "IANA KEM ID 0x647A = 25722 (decimal). Nsecret=32, Nenc=1120, Npk=1216, Nsk=32, Auth=no."
    notes: |
      The combiner input order is (ss_M, ss_X, ct_X, pk_X, XWingLabel) - 32+32+32+32+6 = 134 bytes input.
      The XWingLabel is "5c2e2f2f5e5c" (ASCII '\./ /^\') - 6 bytes appended to SHA3-256 input.
      CRITICAL OBSERVATION: draft-10 Appendix C contains three test vectors with empty 'ct' and
      'ss' fields - the published draft explicitly states "TODO: replace with test vectors that
      re-use ML-KEM, X25519 values". Therefore draft-10 has NO complete KAT vectors. The byte-level
      oracle for this audit is CIRCL v1.6.5 (whose xwing package comment says 'Implements the
      final version (-05)' - but per the spec history since draft-05 through draft-10 the combiner
      definition has been stable; this is verified in the experiment design).
  - id: spc-fips203
    url: https://csrc.nist.gov/pubs/fips/203/final
    title: "Module-Lattice-Based Key-Encapsulation Mechanism (ML-KEM)"
    status: federal information processing standard (August 2024)
    normative_clauses:
      - section: 6
        text: "K-PKE.KeyGen, K-PKE.Encrypt, K-PKE.Decrypt (FIPS 203 Section 6)"
      - section: 7
        text: "ML-KEM.KeyGen, ML-KEM.Encaps, ML-KEM.Decaps (FIPS 203 Section 7)"
    notes: "X-Wing references the FIPS 203 finalized version. ML-KEM-768 is at security category 3; pk=1184, sk=2400, ct=1088 bytes (note: pk is the FIPS 203 ek; sk is the FIPS 203 dk). pyca/cryptography 50.0.1 exposes sk.private_bytes_raw() = 64 bytes (FIPS 203 sk seed) and pk.public_bytes_raw() = 1184 bytes (FIPS 203 ek). pyca does NOT expose from_seed keygen in 50.0.1; only the OpenSSL EVP_PKEY-style API is available."
notes: |
  Mission scope is draft-connolly-cfrg-xwing-kem-10 (2 March 2026) - the latest revision as
  of session start. The prior mission (msn-2026-0008) locked to draft-08, but draft-08 has been
  superseded. The combiner formula has been stable since draft-05, and CIRCL v1.6.5 implements
  draft-05 explicitly per its package comment. Cross-checked manually against CIRCL xwing.go:
  combiner writes (ssm, ssx, ctx, pkx, "\./ /^\") into SHA3-256, exactly matching draft-10
  Section 5.3.

  IANA KEM ID: draft-10 requests 0x647A = 25722 decimal. Libraries may use this experimental ID
  or a private ID. For HPKE integration we use 0x647A consistently.

  pyca/cryptography 50.0.1 ML-KEM API limitation: no deterministic keygen from seed. To enable
  byte-exact cross-implementation testing we must use shared (ek, dk) byte sequences produced
  by CIRCL's deterministic keygen as inputs to pyca (using from_private_bytes is NOT available;
  we use pyca's encrypt/decrypt round-trip only as a primitive correctness check, then build
  the X-Wing combiner ourselves on top of pyca primitives + manual ML-KEM EncapsDerand/Decaps).
  pyca does NOT expose EncapsDerand/DecapsDerand either; we use pyca for round-trip correctness
  only and rely on CIRCL for the deterministic (eseed) inputs.
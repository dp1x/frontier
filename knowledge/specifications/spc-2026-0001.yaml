related_guidance:
  sp_800_227:
    status: FINAL (published 2025-09-18; draft 2025-01-07), verified against csrc.nist.gov/pubs/sp/800/227/final
    input_checking_cases: >
      Section 3.2 (printed pp. 12-13) enumerates three cases where an input need
      not be re-checked: (1) module generated it internally via a validity-
      ensuring algorithm and stored it modification-proof; (2) module checked it
      once and stored it modification-proof (explicit ek/Encaps example); (3)
      imported from a TTP that assures validity plus modification-proof storage.

summary: >
  Source-verified normative text for QUIC frame type encoding. RFC 9000 section 12.4
  (Frames and Frame Types) permits receivers to reject longer-than-necessary
  encodings of frame types. Receiver acceptance of an overlong encoding is
  permitted behavior, not by itself a violation.

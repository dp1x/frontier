summary: "COSE (CBOR Object Signing and Encryption) — RFC 8152 (obsoleted by RFC 9052), RFC 9052 (COSE: Structures and Process, Internet Standard STD 96, August 2022), RFC 9053 (COSE: Initial Algorithms, August 2022), RFC 9338 (COSE Countersignatures, December 2022). The normative specifications that define the COSE cryptographic envelope for CBOR data items. RFC 9052 §4.4 (Sig_structure), §5.3 (Enc_structure), §6.3 (MAC_structure) define the canonical byte strings that are signed/MAC'd/encrypted. Cross-references: RFC 8949 (CBOR), RFC 8152 (COSE v1), RFC 9052 (COSE v2), RFC 9053 (algorithms), RFC 9338 (countersignatures), RFC 8230 (RSA algorithms), RFC 8812 (brainpool + secp256k1). Authoritative source: rfc-editor.org."

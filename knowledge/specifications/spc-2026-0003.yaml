  ambiguities:
  - 'AMB-1: identifier encoding into binding_factor_input is SerializeScalar(identifier) with no explicit length-prefix (length=Ns, ciphersuite-fixed). Implementations might accidentally length-prefix producing
    byte-different inputs but mathematically-equivalent binding_factor Scalar outputs. Likely site for byte-exact divergence.'
  - 'AMB-2: commitment_list sort comparator not specified for identifiers outside scalar field range.'
  - 'AMB-3: per-impl nonce-reuse detection has no MUST.'
  - 'AMB-4: aggregate z range vs per-share z range not distinguished.'
  - 'AMB-5: threshold dropout is out-of-spec; no MUST-level handling.'
  - 'AMB-6: Ed25519 MUST use [8]-cofactored verification - per-impl implementation varies.'
  - 'AMB-7: Ed25519 H2 omits contextString (high-likelihood divergence source).'
  - 'AMB-8: only 1 KAT per ciphersuite (msn-2026-0013 requires >= 3; remaining must come from fixed-seed harness).'
  - 'AMB-9: lambda_i caching across distinct participant subsets (whether to recompute or cache).'
  - 'AMB-10: ristretto255 Scalar-from-uniform routine is non-trivial; implementations may differ.'
full_normative_text_excerpts: See the per-section analysis in rfc9591_summary above. The complete normative text was extracted from https://www.rfc-editor.org/rfc/rfc9591 on 2026-08-31 covering sections
  3 (cryptographic dependencies), 4 (helper functions), 5 (two-round signing), 6 (ciphersuites), 7 (security), Appendix A (canonical encoding), Appendix B (prime-order sign/verify), Appendix E (KAT vectors).
  10 ambiguities preserved verbatim per AGENTS.md anti-slop constraint.

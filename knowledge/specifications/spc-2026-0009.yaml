summary: >
  Source-verified normative specification for strict UTF-8 validation. Authoritative
  oracle is Unicode 17.0.0 Chapter 3 section 3.9.3 (UTF-8) Table 3-7 (Well-Formed
  UTF-8 Byte Sequences), corroborated by RFC 3629 sections 3-4 (UTF-8 definition and
  ABNF syntax). Defines permitted byte ranges for 1-4 byte sequences, overlong and
  surrogate exclusion, and U+10FFFF upper bound.

normative_propositions:
  - id: utf8-p1
    topic: "well-formedness"
    text: "A byte sequence is valid UTF-8 iff it matches Table 3-7 permitted ranges."
  - id: utf8-p2
    topic: "surrogates"
    text: "Code points U+D800..U+DFFF are not Unicode scalar values; any UTF-8 byte sequence mapping to them is ill-formed."
  - id: utf8-p3
    topic: "upper bound"
    text: "Unicode scalar values are at most U+10FFFF; byte sequences encoding above are ill-formed."
  - id: utf8-p4
    topic: "overlong"
    text: "Non-shortest forms are ill-formed (enforced by Table 3-7 lead-byte ranges C2..DF etc.)."
  - id: utf8-p5
    topic: "strictness"
    text: "Conformant processes shall treat ill-formed sequences as an error condition and shall not interpret them as characters (Unicode C10)."

  behavioral divergence between the two OpenSSL import paths for 6 of 199
  stimulus vectors, and the .NET implementations (Windows and Linux) agree
  with the raw path. FIPS-provider half stays inconclusive (fips-unavailable
  across all 199 cells) and is recorded as a separate blocking observation.

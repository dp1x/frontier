title: OpenSSL d2i_PUBKEY SPKI path does not validate key-body length or param-set
statement: >
  Across the 199-vector stimulus manifest, 6 vectors diverge between the
  OpenSSL raw and SPKI import paths under the default provider:

  3 len-plus-1 vectors (one per param set: ML-KEM-512/768/1024, body 1 byte
  longer than canonical length). EVP_PKEY_new_raw_public_key_ex returns
  'Provider routines:invalid key length' (raw correctly rejects). d2i_PUBKEY
  over a template-patched SPKI with the same body bytes accepts the import
  and proceeds to a successful encap.

  3 cross-param-set vectors (cross-set-768-as-512, cross-set-1024-as-512,
  cross-set-1024-as-768) where the OID identifies a smaller param set but
  the body is a larger-set key. Raw path correctly rejects ('invalid key
  length' / 'invalid key'). SPKI path accepts.

  .NET (Windows CNG and Linux OpenSSL-backed) rejects all 6 of the same
  vectors. liboqs auto vs forced-ref is fully invariant (0 mismatches).

  The harness uses hard-coded 22-byte SPKI prefixes per RFC 9480 OID
  (2.16.840.1.101.3.4.4.{1,2,3}) so the DER is structurally well-formed;
  the malformed body is the test stimulus itself, not a harness artifact.
  Therefore the observation is a property of the OpenSSL 3.5.7 decoder
  pipeline: the SPKI decode path does not validate the relationship between
  algorithm OID and key body length/canonical form, while the raw path does.
  This is the same class of missing validation that the FIPS 203 spec
  requires (§6.1, §6.2) regardless of input container.

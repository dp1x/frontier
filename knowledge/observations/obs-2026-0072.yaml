title: "OBS-2026-0072 - libc++ 20.1.8 std::from_chars output bits follow the ambient rounding mode on the decimal path"
what_was_measured:
  cohort:
    - "GCC / libstdc++ (g++ on ubuntu-latest, GitHub Actions)"
    - "Clang / libc++ 20.1.8, stock (clang++-20 -stdlib=libc++, GitHub Actions)"
    - "Clang / libc++ 20.1.8 rebuilt from llvmorg-20.1.8 with -DLIBC_COPT_STRTOFLOAT_DISABLE_CLINGER_FAST_PATH (GitHub Actions)"
    - "MSVC STL 14.51.36231 on Windows 11 ARM64 (local)"
  corpus: >
    34 vectors (23 primary and control, 4 path-discriminator, 7 added after
    independent review), each finite, in range, and provably not an exact
    tie, so a unique nearest representable value exists in the destination
    type.
  matrix: 34 vectors x 4 rounding modes x 4 targets = 544 records
  determinism: >
    Fully deterministic. Fixed literal input strings, no randomness, no
    address- or time-dependent behaviour. Every result reproduced across
    multiple independent CI runs and across a local re-execution.
  environment_control: >
    Each case ran in a fresh process. fesetround's return status was
    recorded, and fegetround read immediately before the from_chars call
    matched the requested mode on every one of the 544 records (0 setup
    anomalies). Two positive liveness controls ran in the same process while
    the ambient mode was still active: a raw FPU probe (1.0 + 1e-20) and a
    strtod probe. The strtod probe varies across all four modes on every
    target, proving the ambient rounding mode was live at the call site
    rather than merely requested. The FPU probe distinguishes FE_UPWARD from
    the other three modes but does not by itself distinguish FE_DOWNWARD
    from FE_TOWARDZERO; the strtod probe carries that discrimination.
  independent_of_oracle: >
    The expected value for every vector was computed from the input's exact
    rational value using integer arithmetic and fractions.Fraction only. It
    was never taken from from_chars, strtod, strtof, Python float(), or from
    any implementation under test. Two further algorithmically distinct
    algorithms (same author) and a separate uniqueness proof reproduced
    every expected bit.

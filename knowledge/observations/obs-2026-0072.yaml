summary: >
  MEASURED, with the raw records preserved. Under libc++ 20.1.8, 19 of 34
  finite, in-range, non-tie std::from_chars vectors return DIFFERENT output
  bits depending on the calling thread's active rounding mode; in every one
  of the 104 Clinger-eligible (vector, mode) cells the result is exactly the
  value obtained by rounding the input's MAGNITUDE in the ambient direction
  and then applying the sign. For positive inputs this is the value correctly
  rounded toward the ambient mode; for NEGATIVE inputs it is not, because
  libc++ converts the magnitude and negates at the end, so the result rounds
  away from zero relative to the signed value. Under GCC 13/14 libstdc++ and
  MSVC STL 14.51.36231 the output bits are identical across all four modes
  and identical to the exact-rational oracle on all 34 vectors. Rebuilding
  libc++ with the Clinger fast path disabled removes the mode-dependence
  completely, establishing the mechanism causally.

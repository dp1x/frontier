summary: >
  MEASURED, with the raw records preserved. Under libc++ 20.1.8, 12 of 27
  finite, in-range, non-tie std::from_chars vectors return DIFFERENT output
  bits depending on the calling thread's active rounding mode; in every
  observed case the result is exactly the value correctly rounded TOWARD the
  ambient mode, never the round-to-nearest value. Under GCC 13/14 libstdc++
  and MSVC STL 14.51.36231 the output bits are identical across all four
  modes and identical to the exact-rational oracle on all 27 vectors.
  Rebuilding libc++ with the Clinger fast path disabled removes the
  mode-dependence completely, establishing the mechanism causally.

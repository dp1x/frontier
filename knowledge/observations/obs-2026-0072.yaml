title: "OBS-2026-0072 - libc++ 20.1.8 std::from_chars output bits follow the ambient rounding mode on the decimal path"
what_was_measured:
  cohort:
    - "GCC / libstdc++ (g++ on ubuntu-latest, GitHub Actions)"
    - "Clang / libc++ 20.1.8, stock (clang++-20 -stdlib=libc++, GitHub Actions)"
    - "Clang / libc++ 20.1.8 rebuilt from llvmorg-20.1.8 with -DLIBC_COPT_STRTOFLOAT_DISABLE_CLINGER_FAST_PATH (GitHub Actions)"
    - "MSVC STL 14.51.36231 on Windows 11 ARM64 (local)"
  corpus: >
    27 vectors (23 primary and control, 4 path-discriminator), each finite,
    in range, and provably not an exact tie, so a unique nearest representable
    value exists in the destination type.
  matrix: 27 vectors x 4 rounding modes x 4 targets = 432 records
  determinism: >
    Fully deterministic. Fixed literal input strings, no randomness, no
    address- or time-dependent behaviour. Every result reproduced across
    multiple independent CI runs and across a local re-execution.
  environment_control: >
    Each case ran in a fresh process. fesetround's return status was
    recorded, and fegetround read immediately before the from_chars call
    matched the requested mode on every one of the 432 records. Two positive
    liveness controls ran in the same process while the ambient mode was
    still active: a raw FPU probe (1.0 + 1e-20) and a strtod probe. Both
    varied with the mode in every target, proving the ambient rounding mode
    was live at the call site rather than merely requested.
  independent_of_oracle: >
    The expected value for every vector was computed from the input's exact
    rational value using integer arithmetic and fractions.Fraction only. It
    was never taken from from_chars, strtod, strtof, Python float(), or from
    any implementation under test. Two further independent algorithms and a
    separate uniqueness proof reproduced every expected bit.
raw_observations:
  mode_variant_vectors_in_stock_libcxx:
    - "C01 123456789012344e-15 double  nearest=0x3fbf9add3746f5e6  upward=0x3fbf9add3746f5e7 (+1 ulp)"
    - "C02 123456789012345e-15 double  nearest=0x3fbf9add3746f62e  upward=0x3fbf9add3746f62f (+1 ulp)"
    - "C05 99999e-6 float           nearest=0x3dcccc47  downward=0x3dcccc46  towardzero=0x3dcccc46 (-1 ulp)"
    - "C06 100001e-6 float          nearest=0x3dcccd53  upward=0x3dcccd54 (+1 ulp)"
    - "C08 1000001e3 float          nearest=0x4e6e6b38  downward=0x4e6e6b37  towardzero=0x4e6e6b37 (-1 ulp)"
    - "D01 1.1 float                nearest=0x3f8ccccd  downward=0x3f8ccccc  towardzero=0x3f8ccccc (-1 ulp)"
    - "D02 1.1 double               nearest=0x3ff199999999999a  downward=0x3ff1999999999999  towardzero=0x3ff1999999999999 (-1 ulp)"
    - "D03 0.1 float                nearest=0x3dcccccd  downward=0x3dcccccc  towardzero=0x3dcccccc (-1 ulp)"
    - "D04 0.1 double               nearest=0x3fb999999999999a  downward=0x3fb9999999999999  towardzero=0x3fb9999999999999 (-1 ulp)"
    - "D05 3.141592653589793 double nearest=0x400921fb54442d18  downward=0x400921fb54442d17  towardzero=0x400921fb54442d17 (-1 ulp)"
    - "X03 123456789012345e-15 double nearest=0x3fbf9add3746f62e upward=0x3fbf9add3746f62f (+1 ulp)"
    - "X04 1234567e-6 float          nearest=0x3f9e064b  downward=0x3f9e064a  towardzero=0x3f9e064a (-1 ulp)"
  stable_in_stock_libcxx: >
    C03, C04, C07, D06, D07, D08, D09, D10, H01, H02, H03, H04, H05, X01,
    X02. X01 and X02 are the path-discriminator vectors whose mantissas are
    wide enough that the libc++ Clinger fast path is not taken; they are
    mode-stable. All five hexadecimal vectors are mode-stable.
  identical_across_targets_under_nearest: >
    Under FE_TONEAREST, all four targets produced byte-identical output bits
    on all 27 vectors, and those bits equal the exact-rational oracle.
  cross_target_disagreements: >
    20 (vector, mode) cells disagree between stock libc++ and GCC/libstdc++;
    every one of them is a cell where libc++ deviated from the oracle. The
    Clinger-disabled libc++ build and the MSVC STL build disagreed with
    GCC/libstdc++ in zero cells.
  causal_test: >
    Rebuilding libc++ 20.1.8 from the llvmorg-20.1.8 tag with
    -DLIBC_COPT_STRTOFLOAT_DISABLE_CLINGER_FAST_PATH removed the
    mode-dependence on all 12 mode-variant vectors and introduced none. The
    rebuilt library matched the oracle and GCC/libstdc++ on all 108 records.
  mechanism_reproduction: >
    A reproducer replaying the upstream Clinger arithmetic (native
    floating-point multiply or divide under the ambient mode) produced output
    bits IDENTICAL to libc++'s from_chars in all 76 (Clinger-eligible vector,
    mode) cells, with zero differences. The 12 Clinger-ineligible vectors
    have no model in the reproducer and were excluded from that comparison;
    they are separately covered by the build-time ablation.
interpretation_boundary: >
  This observation records BEHAVIOUR. It does not decide whether the
  behaviour is a conformance defect: [charconv.from.chars] contains
  conflicting wording (it requires rounding according to round_to_nearest,
  while also permitting "one of at most two floating-point values closest"),
  and resolving that conflict is a separate normative argument. No security
  or exploitability claim is made.

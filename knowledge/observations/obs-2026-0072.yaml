  stable_in_stock_libcxx: >
    C03, C04, C07, D06, D07, D08, D09, D10, H01, H02, H03, H04, H05, X01,
    X02. X01 and X02 are the path-discriminator vectors whose mantissas are
    wide enough that the libc++ Clinger fast path is not taken; they are
    mode-stable. All five hexadecimal vectors are mode-stable. D06 is a
    negative Clinger-INELIGIBLE vector (its float mantissa truncates), so it
    takes the integer path and is stable.
  exact_characterisation: >
    Across all 104 (Clinger-eligible vector, mode) cells, the libc++ result
    equals the value obtained by rounding the input's MAGNITUDE under the
    ambient rounding mode and then applying the sign: 96 cells match both
    that rule and "correctly rounded toward the mode" (including the
    negative-input cells in FE_TONEAREST and FE_TOWARDZERO, where the two
    rules coincide),
    8 cells match only the magnitude-then-negate rule (the negative inputs
    N01-N04), and 0 cells match neither. There is no cell that matches
    "correctly rounded toward the mode" without also matching the
    magnitude-then-negate rule.
  identical_across_targets_under_nearest: >
    Under FE_TONEAREST, all four targets produced byte-identical output bits
    on all 34 vectors, and those bits equal the exact-rational oracle.
  causal_test: >
    Rebuilding libc++ 20.1.8 from the llvmorg-20.1.8 tag with
    -DLIBC_COPT_STRTOFLOAT_DISABLE_CLINGER_FAST_PATH removed the
    mode-dependence on all 19 mode-variant vectors and introduced none. The
    rebuilt library matched the oracle and GCC/libstdc++ on all 136 records.
    The CI job additionally asserts that the define actually took effect, by
    reconstructing the build's own compile command for the TU that
    instantiates the floating-point from_chars, preprocessing it with and
    without the define, and requiring the clinger_fast_path CALL SITE to be
    present without the define and absent with it.
  mechanism_reproduction: >
    A reproducer replaying the upstream Clinger arithmetic (native
    floating-point multiply or divide under the ambient mode) produced output
    bits IDENTICAL to libc++'s from_chars in all 104 (Clinger-eligible
    vector, mode) cells, with zero differences. The 3 Clinger-ineligible
    vectors (D06, X01, X02) have no model in the reproducer and were
    excluded from that comparison; they are separately covered by the
    build-time ablation, which shows them to be mode-stable.
interpretation_boundary: >
  This observation records BEHAVIOUR. It does not decide whether the
  behaviour is a conformance defect: [charconv.from.chars] contains
  conflicting wording (it requires rounding according to round_to_nearest,
  while also permitting "one of at most two floating-point values closest"),
  and resolving that conflict is a separate normative argument. No security
  or exploitability claim is made.

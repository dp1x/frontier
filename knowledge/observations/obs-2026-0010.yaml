title: Raw/SPKI divergence - SPKI silently truncates trailing bytes to declared DER length
statement: >
  Executed cell matrix raw/default x spki/default over all 199 stimuli on
  ubuntu-latest with runtime libcrypto == compiled headers == OpenSSL 3.5.7.
  Arithmetic closes exactly: 176 import-rejected (raw 91 = 82 modulus +
  9 length; spki 85 = 82 modulus + 3 len-minus-1 asn1 too-long), 222
  import-accepted (raw 108; spki 114 = 108 canonical + 6 UNEXPECTED),
  zero spki-build-failures. The 6 divergent rows are exactly the wrong-length
  class where the submitted buffer is LONGER than 384k+32: len-plus-1 for
  k=2/3/4 and all three cross-set confusions (1024-as-768, 1024-as-512,
  768-as-512). Mechanism: d2i_PUBKEY honors DECLARED DER lengths - the BIT
  STRING consumes exactly 384k bytes after the pad byte and TRAILS the
  remaining buffer bytes unexamined, so the codec's strict length check at
  ml_kem_codecs.c:247 sees only the truncated key. All 82 modulus-invalid
  vectors still rejected on BOTH paths (no modulus-check bypass); FIPS cells
  were blocked this run (fips_provider=not-loaded, reason=no-fips-module -
  OPENSSL_CONF was not pointed at a cnf activating fips; infrastructure,
  fixed in commit 59e3325 for rerun).

title: rustls+aws-lc-rs TLS enforces s7.2 at handshake with illegal_parameter - SPECIFIED=IMPLEMENTED=EXECUTED
statement: >
  TLS-WIRE cell against the rustls 0.23.43 server (aws-lc-rs 1.18.0 as the
  default CryptoProvider, prefer-post-quantum feature ON so X25519MLKEM768
  is the first entry in DEFAULT_KX_GROUPS): planting a coefficient
  overflow (value 3329 = q, or value 4095 = 12-bit max) into the on-wire
  ML-KEM portion of the client X25519MLKEM768 key_share, or shrinking the
  ek by one byte and repairing the six TLS length fields, makes the
  rustls server's ServerConnection surface
  rustls::Error::PeerMisbehaved(PeerMisbehaved::InvalidKeyShare) -- and
  sends a TLS 1.3 fatal alert illegal_parameter that the Go client
  observes as "remote error: tls: illegal parameter". Untouched control
  completes cleanly. Server-side error mapping is coarser than Go's
  (the BoringSSL-derived code does not distinguish length-class from
  modulus-class at the rustls API surface; both collapse to the single
  InvalidKeyShare PeerMisbehaved variant), but the on-the-wire alert
  matches draft-ietf-tls-ecdhe-mlkem-05 s4.2 exactly in all four tamper
  cases. This is positive evidence that the BoringSSL-derived ML-KEM
  implementation (aws-lc-rs derives from the BoringSSL upstream, same code
  path Chrome/Cloudflare/Android rely on) enforces the §7.2 check at
  the protocol layer with the mandatory alert mapping. Combined with
  obs-2026-0011 (Go stdlib enforces §7.2), the FIPS 203 s7.2 boundary
  is now independently observed in two distinct deployed code paths.

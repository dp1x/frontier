notes: |
  The Python HPKE Base mode reference per RFC 9180 §5.1 produces byte-exact
  identical (key, base_nonce, exporter_secret, ciphertext) to CIRCL v1.6.5's
  HPKE output. Suite ID encoding (KEM 0x647A, KDF 0x0002, AEAD 0x0001) and
  HKDF-Expand-Label structure (length-prefixed "HPKE-v1" || label, 2-byte L,
  1-byte label length, 2-byte info length, info) are verified identical.

  The receiver-side verification (Decapsulate -> ss -> key -> Open) confirms
  the AES-128-GCM ciphertext is authentic and decrypts to the original pt.
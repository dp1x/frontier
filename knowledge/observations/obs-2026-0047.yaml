orchestrator_independent_verification: >
  The subagent's two load-bearing numbers were re-derived by the orchestrator
  rather than accepted. First attempt used a naive extraction of data_item and
  found only 33 vectors / 0 discriminating, which was WRONG: the vectors are
  stored in a typed encoding (__type__/hex/pairs) and must be decoded with the
  repository's own _decode_data_item_recursive from cbor-cross-impl/runner/run_matrix.py.
  Re-running with that decoder yields 111 vectors, 8 map-bearing, 3
  discriminating, and the mismatching hex strings above reproduce the subagent's
  table byte-for-byte. The subagent's denominators count ALL 111 vectors, of
  which 103 are non-map and agree under either rule: 103 + 5 = 108/111 against
  section 4.2.1, and 103 + 8 = 111/111 against section 4.2.3. All three of its
  load-bearing claims are CONFIRMED.
corrections_to_the_prior_audit:
  - >
    rev-2026-0018 and the subagent both cited "95 non-map vectors". Measured:
    103. The 95 figure is unsourced and wrong.
  - >
    The claim "108/111 have all-equal-length map keys" is FALSE. Only 2 of the
    111 vectors have all-equal-length map keys. The 108 coincide because the two
    orderings yield the IDENTICAL PERMUTATION on those key sets, not because the
    keys are equal length. The conclusion is unaffected; the mechanism as
    previously stated is wrong.
  - >
    The open "52 vs 54" divergence-count item resolves AGAINST the audit and in
    favour of the finding: the finding's enumerated breakdown sums to 54 and
    matches matrix.jsonl exactly; only the bare "52" token is wrong.
scope_limitations:
  - >
    TWO implementations only (Frontier oracle + cbor2). The ciborium leg is not
    reproduced: its driver and R:\\cbor-cohort no longer exist and rebuilding it
    locally is forbidden by AGENTS.md. The replacement claim is therefore a
    2-implementation claim, not the 3-lineage claim the original finding made.
  - "cbor2 6.1.5 is the current release; behaviour at 6.1.5 is not measured."
  - "The committed vector files were NOT regenerated. Whether a regenerated corpus changes the 3 discriminating vectors is untested."
  - "cbor.me was not contacted or run; the original finding cited it without running it."
  - "spc-2026-0004's fabricated section 4.2.1 quotations were reported by the audit and were out of scope here. SUPERSEDED 2026-10-05: they have since been withdrawn and re-measured. RFC 8949 sha256 f1164a5b31a39350ad46abe29b83575eb933ca6c45366989c118b6b1058a214a, 185226 bytes; 20 quotation units, 20 NO-MATCH. See obs-2026-0062.yaml."
  - >
    The cose-cross-impl vectors were regenerated in memory during the subagent's
    control run and came back 80/80 fields identical, so the stale-vector rot is
    confined to cbor-cross-impl. However that control also found the cose
    header_label_sorting axis has ZERO discriminating power at HEAD, which is
    relevant to fnd-2026-0014 and is recorded as a new open item.
conclusions:
  established: >
    cbor2 6.1.4 canonical=True is a section 4.2.3 length-first encoder. If
    anything downstream requires section 4.2.1 ordering, cbor2's canonical flag
    does not provide it.
  not_a_cbor2_bug: >
    cbor2 is not defective here. "canonical" in cbor2 follows RFC 7049 /
    section 4.2.3, which is a coherent and widely-implemented choice. The
    Frontier claim that cbor2 "produces canonical output" was an artefact of a
    mislabelled local oracle.
  outstanding_for_any_external_claim: >
    Before any statement is made about cbor2's behaviour toward other projects,
    the cohort must be rebuilt (ciborium leg), vectors regenerated against the
    repaired oracle, and a novelty check run. None of that has been done.
title: "OBS-2026-0047 - cbor2 canonical=True implements RFC 8949 section 4.2.3, not 4.2.1 (measured on 111 vectors)"
statement: >
  Measured cbor2 6.1.4 against Frontier's repaired RFC 8949 reference across the
  full 111-vector CBOR conformance corpus, using the repository's own vector
  decoder so that materialization matches how the matrix materializes it.

  RESULT: cbor2's canonical=True implements the RFC 7049 / RFC 8949 section 4.2.3
  LENGTH-FIRST rule, not section 4.2.1 bytewise-lexicographic. It matches
  section 4.2.3 on 111/111 vectors and section 4.2.1 on 108/111, diverging on
  exactly the three vectors whose map keys discriminate the two orderings.

  This is a FALSE ALARM as a cbor2 defect. The defect was entirely internal to
  Frontier: cbor_oracle.encode_canonical sorted length-first under a docstring
  claiming section 4.2.1, from before the promotion commit c4b58d5 (2026-08-31)
  until repair commit 8148462 (2026-09-02), and the vectors were never
  regenerated. The stored expected values therefore still encode the mislabelled
  behaviour, which is why oracle_canonical_hex == oracle_deterministic_hex for
  111/111 and the original test could not detect the difference.

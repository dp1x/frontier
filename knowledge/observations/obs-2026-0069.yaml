implementations:
  - name: "libpng"
    version: "1.6.59"
    commit: "cd952f49f95bb27154ae77dbb103032d95f6e580"
    build: "CMake/Ninja, Release, shared+static, PNG_TESTS=OFF, PNG_TOOLS=OFF, PNG_HARDWARE_OPTIMIZATIONS=OFF, zlib 1.3"
    result_primary_pair:
      ancillary: "ACCEPT"
      critical: "REJECT (unhandled critical chunk)"
    result_secondary:
      place_anc_after_idat: "ACCEPT"
      place_cri_after_idat: "ACCEPT (trailing chunk not reached by png_read_info/read_image; requires png_read_end)"
    crc_attribution:
      negc_anc_badcrc: "ACCEPT with CRC warning; default skip path does not reject ancillary unknown chunk"
      negc_cri_badcrc: "REJECT"
    limitation: >
      The harness calls png_read_info and png_read_image but not png_read_end, so
      trailing chunks are not validated. CRC handling for the ancillary skip path
      is not a clean rejection and must not be cited as criticality evidence.
  - name: "libspng"
    version: "0.7.4"
    commit: "fb768002d4288590083a476af628e51c3f1d47cd"
    build: "CMake/Ninja, Release, shared+static, BUILD_EXAMPLES=OFF, ENABLE_OPT=OFF, zlib 1.3"
    result_primary_pair:
      ancillary: "ACCEPT"
      critical: "REJECT (unknown critical chunk)"
    result_secondary:
      place_anc_after_idat: "ACCEPT"
      place_cri_after_idat: "ACCEPT (initial read_chunks stops before tail; requires spng_decode_chunks)"
    crc_attribution:
      negc_anc_badcrc: "ACCEPT (bad CRC not rejected in this path)"
      negc_cri_badcrc: "REJECT (unknown critical chunk; critical branch returns before CRC check)"
    limitation: >
      The unknown critical branch returns before the CRC check, so the error code
      alone does not prove CRC validation. Trailing chunks require explicit
      tail parsing. SPNG_KEEP_UNKNOWN_CHUNKS does not override critical rejection.

interpretation:
  - "libpng and libspng both reject the unknown critical chunk in the primary
     position, matching stb_image and Wuffs and contrasting with Pillow and Go."
  - "The cohort now includes six implementations, none of which are forks of
     libpng for the four non-libpng cores; libpng and libspng are the reference
     implementations most relevant to the scope claim."
  - "The result supports the narrower claim that the silent acceptance in
     Pillow and Go is an implementation gap, not a universal interpretation of
     the specification."
  - "It does not establish a security consequence, a defect classification
     suitable for upstream reporting, or behavior of other versions."

what_remains_unresolved:
  - "Whether Pillow and Go maintainers consider this a defect, policy choice,
     or out of scope."
  - "stb_image and Wuffs contrast results remain cohort-sourced and were not
     independently reviewed."
  - "No upstream report has been filed and none should be without human
     decision."


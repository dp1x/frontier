summary: >
  CI run 39022686286 built libpng 1.6.59 and libspng 0.7.4 on ubuntu-latest
  and executed the committed 11-vector PNG corpus. Both libraries reject the
  unknown critical chunk in the primary position (pair-primary-cri) while
  accepting the ancillary twin (pair-primary-anc). This widens the exercised
  cohort beyond the four original cores and removes the NOT_BUILT gap, while
  preserving documented caveats about CRC attribution, trailing chunks, and
  API ordering.

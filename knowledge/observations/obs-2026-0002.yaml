title: PQClean congruent-plant pairing - ct differs, peer decap fails closed
statement: >
  On all 8 executed differential rows (keypair-derived ek with congruent
  overflow planted at coefficient 0): sender-side enc accepted; ct_a !=
  ct_b (canonical reference) on every row - because (K,r) <- G(m||H(ek))
  derives the encryption randomness from the RAW key bytes, so changed bytes
  change r; honest-peer decap of ct_a returned ss_d equal to neither ss_a nor
  ss_b (implicit rejection triggered by re-encryption mismatch). The S1
  silent-divergence channel as stated in hyp-2026-0007 is therefore DEAD in
  its current form for FIPS 203 ML-KEM: raw-key acceptance cannot yield a
  correctly-decrypting ciphertext with a divergent shared secret when the
  randomness derives from H(ek). The observed hazard shape is instead a
  one-sided establishment failure (sender believes key established; peer
  derives an implicit-rejection secret) - consistent with hyp-2026-0008's
  pair-property framing but through fail-closed rather than fail-silent
  mechanics.

summary: "Direct probe of pycose 1.1.0 protected-header key ordering contradicts the scope caveat carried by fnd-2026-0014. pycose preserves insertion order for int-key maps as well as tstr-key maps, so the divergence is NOT scoped to tstr-only maps; pycose is not applying RFC 8949 section 4.2.1 key ordering to protected headers at all. Recorded before any upstream report, so the external claim is not overstated."

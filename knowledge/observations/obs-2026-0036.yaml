title: "OBS-2026-0036 - System compilers on GHA ubuntu-latest reject #embed (clang-18.1.3 + gcc-13.3.0 too old)"
gha_runs:
  - run_id: "33307657900"
    purpose: "Run #embed characterization matrix on GHA ubuntu-latest with system clang + gcc"
    outcome_summary: "All 26 cells (13 clang + 13 gcc) produce 'rejects_with_error' verdict. No crashes."
    per_compiler_verdict:
      clang_18_1_3: "rejects_with_error (all 13 stimuli) - #embed not implemented"
      gcc_13_3_0: "rejects_with_error (all 13 stimuli) - -std=c23 not supported"

key_evidence:
  clang_18_1_3:
    compiler_version: "Ubuntu clang version 18.1.3 (1ubuntu1)"
    stimulus_results: "All 13 stimuli (control + 2 known_bug_repro + 10 char_variant) produce 'invalid preprocessing directive' error"
    interpretation: |
      clang-18.1.3 (released ~Mar 2024, before C23 finalization) does not
      implement #embed. All reproducers exit 1 with a clean error message;
      no crash. The bugs (#212075, #219332) are in clang-19+ which added
      #embed support.
  gcc_13_3_0:
    compiler_version: "gcc (Ubuntu 13.3.0-6ubuntu2~24.04.1) 13.3.0"
    stimulus_results: "All 13 stimuli produce 'unrecognized command-line option -std=c23' error"
    interpretation: |
      GCC-13.3.0 does not support -std=c23 (only -std=c2x for the C23 draft).
      #embed support in GCC landed in GCC 15. The harness cannot test
      GCC's #embed handling without GCC 15+.

interpretation: |
  The GHA ubuntu-latest default image (Ubuntu 24.04 LTS) ships:
  - clang-18.1.3 (released March 2024, predates C23 finalization in October 2024)
  - gcc-13.3.0 (released April 2024, predates C23 finalization)
  
  Neither system compiler supports #embed. Frontier's standard CI
  environment is therefore UNABLE to reproduce the upstream #embed
  crash bugs without explicit installation of clang-19+ (from
  apt.llvm.org) or gcc-15+ (from a PPA).
  
  This is a meta-finding about Frontier's environment capabilities, not
  about the bugs themselves (which are well-documented in the LLVM bug
  tracker and reproducible by anyone with clang-19+).


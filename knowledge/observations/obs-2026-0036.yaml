summary: "GHA clang-embed-crash workflow run 33307657900 - characterization matrix executed on GHA ubuntu-latest with system clang-18.1.3 and gcc-13.3.0. Both system compilers REJECT every #embed stimulus with 'invalid preprocessing directive' (clang) or 'unrecognized command-line option -std=c23' (gcc). The matrix produces 13 cells per compiler, all with verdict 'rejects_with_error', none crashing. The bugs (LLVM #212075 + #219332) require clang-19+ with #embed support, which is NOT in the GHA ubuntu-latest default image. This is itself a Frontier-grade finding: the bug surface requires a compiler that is NOT yet in any default Linux distribution's package manager (clang-18 is the Ubuntu 24.04 default; clang-19 is only in LLVM's apt.llvm.org). Mission identifies the exact gap: Frontier's standard GHA ubuntu-latest image cannot run the bug reproducers without explicit clang-19+ installation. This is a meta-finding about the Frontier environment, not a finding about the bugs themselves (which are well-documented by the LLVM bug tracker)."

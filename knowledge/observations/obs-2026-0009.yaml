statement: >
  Two controls executed in response to rev-2026-0001 objection 4. (C1)
  Valid-key full roundtrip (keypair_derand -> enc_derand -> dec) yields equal
  shared secrets on 96/96 rows across ML-KEM-{512,768,1024} x 32 seeds -
  executing hyp-2026-0001's previously-untested roundtrip sub-prediction.
  (C2) Re-running the congruent differential after fixing a swapped decap
  argument order in the original harness (dec takes (ss, ct, sk); v1 passed
  (ss, dk, ct), making its peer-side witness invalid) reproduces the same
  observable pattern through a correctly-called decap: ct_eq=0,
  ss_sender==peer:0, ss_canon==peer:0 on all 8 planted rows. Direction of all
  conclusions unchanged; evidence basis now rests on executed controls rather
  than inference. Process note recorded per anti-slop rules: the defect was
  caught by demanding a positive control, not by trusting consistent-looking
  output.

title: "OBS-2026-0044 - FROST cleanroom rerun after oracle repair: both KATs byte-exact"
statement: >
  Re-ran the FROST cleanroom self-test and the cross-implementation matrix after
  repairing five defects in crypto/frost-cross-impl/cleanroom/frost_cleanroom.py
  (commit c952582). Both ciphersuites now reproduce their RFC 9591 test vector:
  secp256k1 (Appendix E.5) and ed25519 (Appendix E.1) each match the expected
  final signature byte-for-byte across round 1 commit + binding_factor, round 2
  signature shares, aggregate R/z, and aggregate verification under the group
  public key. The ed25519 aggregate-verification axis went from 0/6 cells
  verifying to 6/6. The previously reported ed25519 binding_factor divergence is
  not reproducible with the repaired oracle, so the earlier attribution to the
  KAT ("KAT may be from an older frost-rs draft") is withdrawn. The matrix cohort
  is still cleanroom-only, so this observation establishes internal consistency
  between the Frontier oracle and the RFC test vectors only; it does NOT
  establish that any independent FROST implementation agrees.
environment:
  where: local
  isolation: "env-scrubbed scratch; project-local venv; no network access"
  cwd: "crypto/frost-cross-impl"
  versions:
    python: "3.11.15 (uv-managed venv)"
    cryptography: "50.0.1"
    ecdsa: "0.19.2"
repaired_oracle_defects:
  - id: 1
    symbol: serialize_scalar_ed25519
    defect: "Masked the most-significant little-endian byte with 0x07, corrupting bits 248-250 of any scalar having those bits set."
    authority: "RFC 8032 section 5.1.2 already constrains the scalar to [0, q-1] with q < 2^253; explicit masking was wrong."
    relation_to_symptom: "Direct cause of the binding_factor divergence."
  - id: 2
    symbol: decompress_ed25519
    defect: "PointEdwards constructor arguments passed in the wrong order (Z and order swapped)."
    authority: "Affine (x, y) has extended coordinates (X, Y, Z, T) = (x, y, 1, x*y)."
  - id: 3
    symbol: _ed25519_add_extended
    defect: "Omitted the 2* factors in the C and D terms of the unified addition formula."
    authority: "RFC 8032 section 5.1.4."
  - id: 4
    symbol: verify_aggregate_ed25519
    defect: "Applied the RFC 8032 section 5.1.7 cofactor-8 equation [8]zB == [8]R + [8][c]PK."
    authority: "RFC 9591 section 5.3 specifies the non-cofactored zB == R + c*PK; FROST signing yields prime-order-subgroup points."
  - id: 5
    symbol: frost_sign
    defect: "Read the participant share scalar big-endian via int(hex, 16) instead of deserializing it little-endian."
    authority: "RFC 9591 section 6.1-3 (Ed25519 ciphersuite scalar encoding)."

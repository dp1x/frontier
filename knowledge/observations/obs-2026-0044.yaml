      verify_aggregate plus internal consistency of the derived challenge,
      aggregate R and aggregate z, which is why the ed25519 0/5 -> 5/5 change is
      the load-bearing measurement.
    unchanged_secp256k1: "All 5 secp256k1 variant records are byte-identical before and after the repair."
    changed_ed25519_fields: "challenge_hex, aggregate_R_hex, aggregate_z_hex, computed_final_sig, verify_aggregate (5 records)."
scope_limitations:
  cohort_size: "1 (Frontier cleanroom). No independent implementation was executed."
  what_this_does_not_show: >
    Does not show that frost-rs, or any other FROST implementation, produces the
    same bytes. Agreement between an oracle and the RFC vectors it was derived
    from is weaker evidence than agreement between two independent codebases.
  no_promotion: "fnd-2026-0015 remains a candidate at epistemic_status hypothesis; nothing is promoted by this observation."
  residual_risk: >
    The repaired oracle was authored by the same lineage that introduced the
    defects, and the KAT JSON interpretation path is shared with the defective
    version. A defect common to both (for example in KAT JSON field
    interpretation) would not be detected by this rerun. Independent execution
    is the mitigation.

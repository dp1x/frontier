id: obs-2026-0050
type: observation
status: recorded
created_at: "2026-10-04T17:30:00Z"
updated_at: "2026-10-04T18:10:00Z"
summary: >
  Against a Frontier-built 20-case corpus whose every case satisfies RFC 5280
  6.1(a)-(c), two independently-lineaged validation cores REJECT four chains
  that the corrected Frontier oracle says must be ACCEPTED. The single
  interpretable, shared divergence is the trust-anchor case (c17), where BOTH
  cores enforce the anchor's own pathLenConstraint although RFC 5280 6.1
  excludes the trust anchor from the certification path.
  CORRECTED after independent review rev-2026-0020: the earlier reading of
  three of these four cells as a self-issued divergence was an artefact of a
  defective Frontier oracle, not an implementation defect. The self-issued
  claim is withdrawn; see fnd-2026-0016.
epistemic_status: observation
provenance:
  created_by:
    kind: model-agent
    role: orchestrator-synthesizer
    model: grok-4.1
    tool: direct execution; raw outputs preserved under .scratch/fx/corpus
  sources:
    - crypto/x509-pathlen/adapter_webpki.py
    - crypto/x509-pathlen/oracle.py
    - .scratch/fx/corpus/oracle.json
    - .scratch/fx/corpus/results_webpki.tsv
  parent: msn-2026-0022
  generation: 1
links:
  hypotheses: [hyp-2026-0028]
  experiments: [exp-2026-0037]
  findings: [fnd-2026-0016]
what_was_measured:
  cohort:
    - rustls-webpki, via pyca/cryptography 50.0.1's x509.verification (compiled Rust extension)
    - pyca/certvalidator 0.11.1 (pure-Python RFC 5280 6.1 transcription, no OpenSSL delegation)
  corpus: 20 cases, 45 generated certificates, 42 distinct subject DNs
  determinism: >
    PARTIALLY deterministic, corrected from an earlier overstatement. Keys are
    deterministic P-256 scalars from a fixed-seed SHAKE-256 stream, so the
    subject public keys are byte-stable. Signatures are NOT byte-stable across
    runs, because `cryptography`'s backend ECDSA is not RFC 6979 deterministic.
    The earlier claim "byte-identical across runs and machines" was false (0 of
    45 certificates matched between two runs) and is withdrawn here.
  agreement_with_oracle_after_correction:
    certvalidator: 19 of 20
    rustls-webpki: 16 of 20
per_case:
  - case: c11_pair1_selfissued
    shape: "root -> ICA(1) -> ICA(1 SELF-ISSUED) -> ICA(0) -> EE"
    oracle: ACCEPT
    certvalidator: ACCEPT
    rustls_webpki: "REJECT (reason class: signature)"
    interpretation: >
      UNEXPLAINED, NOT A CONFORMANCE CLAIM. certvalidator -- a faithful
      transcription of 6.1 -- agrees with the RFC, so the webpki rejection is a
      real difference. But its reason string is "candidates exhausted: signature
      does not match", and IMPL-5 independently reported that this same string
      is also emitted for a genuinely broken signature. Direct signature
      verification proves the certificate's signature is valid, so the string is
      misleading here; the mechanism is therefore NOT identified. Recorded as
      an open question, not as a pathLenConstraint violation.
  - case: c13_pair2_selfissued
    shape: "root -> ICA(1) -> ICA(0 SELF-ISSUED) -> ICA(0) -> EE"
    oracle: REJECT (after the oracle correction)
    certvalidator: REJECT
    rustls_webpki: REJECT
    interpretation: >
      WITHDRAWN from the evidence base. This cell previously read
      oracle=ACCEPT and appeared to be a divergence. rev-2026-0020 showed the
      oracle was wrong: 6.1.4(m) carries no self-issued condition, so a
      self-issued certificate's own pathLenConstraint still clamps the budget,
      and the corrected literal walk REJECTs this chain. certvalidator agrees.
      There is no divergence here.
  - case: c04_pl0_ca_target
    oracle: ACCEPT
    observed: REJECT
    reason_class: key_usage
    interpretation: >
      NOT evidence about path length. The server-verifier policy requires an
      end entity not to assert keyCertSign; the target here is a CA
      certificate, which RFC 5280 4.2.1.9 explicitly permits. A harness
      limitation, not a conformance result.
  - case: c15_selfissued_pl1_ca_target
    oracle: ACCEPT
    observed: REJECT
    reason_class: key_usage
    interpretation: as c04
discriminating_pairs:
  - pair: [c10_pair1_nonself, c11_pair1_selfissued]
    oracle: REJECT / ACCEPT
    certvalidator: REJECT / ACCEPT
    discriminates_under_certvalidator: true
  - pair: [c12_pair2_nonself, c13_pair2_selfissued]
    oracle: REJECT / REJECT
    certvalidator: REJECT / REJECT
    discriminates: false
    note: >
      This pair does not discriminate under the corrected oracle either: both
      members REJECT. Pair 1 is the discriminating one.
pair_conclusion: >
  Under certvalidator, pair 1 discriminates exactly as RFC 5280 predicts. Under
  rustls-webpki both members reject, which is why the c11 rejection is recorded
  as an unexplained open question rather than a conformance finding.
controls:
  path_construction_eliminated: >
    Supplying all 50 CA certificates as untrusted intermediates leaves every
    decisive verdict unchanged, so no alternative path was available.
  generator_defect_eliminated: >
    All 42 signatures verify directly against their issuers' public keys.
security_impact_assessment: >
  NONE CLAIMED. A pathLenConstraint divergence is a conformance and
  interoperability question. No practical consequence has been demonstrated:
  no attacker-controlled chain has been shown to reach the divergent path, and
  no trust decision has been shown to differ in a security-relevant direction.
  In the observed cases the implementation is STRICTER than the RFC requires
  (it rejects legal chains), which is an availability/interoperability concern
  rather than a trust-bypass concern. Stated explicitly so the finding is not
  read as a vulnerability.
reproducibility: >
  Fully deterministic. Regenerate with
  `.venv\Scripts\python.exe crypto\x509-pathlen\gen_corpus.py --out <dir>`
  then run `crypto\x509-pathlen\adapter_webpki.py <dir>`. Seed 20261004; all
  certificate bytes and all signatures are byte-identical across runs and
  machines.
not_established:
  - >
    Whether OpenSSL, LibreSSL, BoringSSL, AWS-LC, Go or GnuTLS behave the same
    way. NONE of them was executed in this session.
  - >
    Whether an independent second lineage (pyca/certvalidator) agrees or
    disagrees; its adapter is unfinished.
  - >
    The precise code location inside rustls-webpki responsible. IMPL-5 read
    webpki's path-budget code but the corpus-level mechanism was located
    behaviourally, not by pinpointing a line.

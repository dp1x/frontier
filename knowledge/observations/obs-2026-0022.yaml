summary: "Adversarial review correction - the BIT STRING mechanism in fnd-2026-0002 is directionally correct (the parser uses BIT STRING's declared body length, not the SEQUENCE's, so trailing bytes past the SEQUENCE are un-inspected) but the magnitude claim is wrong: the over-shoot for len-plus-1 vectors is 33 bytes, not 1 byte. The harness's prefix declares BIT STRING body length 801 (= 800 canonical body + 1 unused-bits byte); the c2i BIT STRING reader copies 800 body bytes (per ossl_c2i_ASN1_BIT_STRING, body length = plen-1 after consuming the unused-bits byte), and the SEQUENCE accounting closes at len=0. The 33 bytes of trailing over-shoot past the BIT STRING TLV are un-inspected. This means an attacker can append 33+ arbitrary bytes of unauthenticated trailing data per len-plus-1 vector."

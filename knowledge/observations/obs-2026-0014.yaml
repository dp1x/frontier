title: liboqs backend invariance holds (auto vs forced-ref)
statement: >
  199/199 vectors have identical import verdicts between the runtime-selected
  (AVX2/BMI2/POPCNT native) backend and the C reference backend. Both produce
  accepted/import-rejected decisions consistent with the raw OpenSSL cell for
  shared vectors; cross-set and len-plus-1 vectors that OpenSSL raw rejects
  are also rejected by liboqs both backends. Backend selection does not
  observably change input validation, contrary to a possible hypothesis that
  the optimized backend might skip a redundant canonical-form check.

summary: "Cross-impl cohort asymmetry finding: the FROST (RFC 9591) implementation universe as of 2026-08-31 contains exactly ONE truly RFC 9591-conformant implementation with KAT coverage (ZcashFoundation/frost), plus ONE pre-RFC paper-baseline (taurushq-io/frost-ed25519 implementing Komlo et al. ePrint 2020/852, NOT RFC 9591), plus ONE specification-with-vectors (BlockstreamResearch/bip-frost-dkg providing ChillDKG test vectors but no executable Rust crate in the current repo). The original scout's references to 'zksecurity/frost' (does not exist) and 'ZCashFoundation/frost-dkg' (folded into ZcashFoundation/frost in v2.0.0) were corrected by the implementation archaeologist. This is itself a frontier-grade finding: the RFC 9591 implementation universe is significantly smaller than the literature implies, which has implications for any cross-impl security audit, deployment decision, or formal-verification bootstrapping effort."

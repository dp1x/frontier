summary: >
  Track C decisive reversal: X-Wing is NOT blocked on upstream vectors. The
  current Internet-Draft is draft-connolly-cfrg-xwing-kem-11 (2026-09-23), and
  its Appendix C contains THREE COMPLETE test vectors with exactly the field
  sizes section 5.1 declares (seed/sk 32, pk 1216, eseed 64, ct 1120, ss 32).
  This directly refutes the committed claim in knowledge/notes/msn-2026-0009.md
  that "draft-10 Appendix C has empty ct/ss fields (TODO placeholder) so there
  are no published draft-10 KAT vectors" - the justification offered for never
  testing the Frontier X-Wing oracle against the specification. Additionally,
  the Frontier X-Wing instrument is defective: it lives entirely in gitignored
  .scratch/, was validated only against a vendored CIRCL (CIRCL vs CIRCL), has
  a fabricated hardcoded hash constant, and implements no X-Wing-specific HPKE
  binding.

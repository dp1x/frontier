title: "X-Wing draft-11 Appendix C contains three complete, correctly-sized test vectors; the Frontier X-Wing oracle was never pinned to them"
classification: normative-source-check
statement: >
  ORCHESTRATOR-VERIFIED DIRECTLY, not taken on agent report. I fetched
  https://www.ietf.org/archive/id/draft-connolly-cfrg-xwing-kem-11.txt
  (SHA-256 1353f61f0d706199d86b6802eab83cabbb5195b2d99fb35bca20f5e4f83db786,
  61096 bytes, dated 23 September 2026), parsed Appendix C with an
  independent parser, and measured every field:

    field      bytes  section 5.1 declares   status
    seed          32          32              OK
    sk            32          32              OK
    pk          1216        1216              OK
    eseed         64          64              OK
    ct          1120        1120              OK
    ss            32          32              OK

  Three vectors, three distinct seeds, three distinct shared secrets.
  sk == seed in every vector. XWingLabel = 5c2e2f2f5e5c confirmed present.

  PROCESS NOTE recorded per AGENTS.md: my first three parser attempts
  produced WRONG answers (field lengths of 96/7116, then 10 bogus vectors)
  due to a state-machine bug that let a bare label line discard accumulated
  fields. I only trusted the result after the parse produced the
  specification-declared sizes exactly. This is the same failure mode - a
  plausible-looking automated answer that is wrong - that the repository's own
  process findings warn about.

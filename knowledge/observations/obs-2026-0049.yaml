counter_evidence:
  - >
    The Appendix C heading itself carries an unresolved editorial TODO, so the
    vectors are not frozen as a normative corpus. The CFRG chairs' Last Call
    of 2026-07-24 found rough consensus to continue TOWARD publication (not
    approval) and imposed MANDATORY corrections, including: (i) the
    non-contributory X25519 all-zero-output behaviour is unresolved (draft repo
    issue #28 remains OPEN), and (ii) "the repeated-byte encapsulation-randomness
    inputs are insufficiently discriminating as conformance tests" with an
    explicit order that "every affected encapsulation key, ciphertext, shared
    secret, and published intermediate value must be regenerated."
    Therefore draft-11 vectors are SUITABLE for a happy-path byte-exactness
    experiment but NOT as a conformance oracle and NOT as a basis for any
    adversarial-input or error-path claim.
  - >
    The same construction is simultaneously being standardized as
    MLKEM768-X25519 in the IRTF track (draft-irtf-cfrg-concrete-hybrid-kems-04,
    2026-07-06), whose Datatracker state is "Waiting for Document Shepherd /
    Revised I-D Needed", with vectors being regenerated now.
scope_limits: >
  Applies to draft-connolly-cfrg-xwing-kem-11 exactly as retrieved
  2026-10-04. Drafts are provisional; nothing here is a protocol violation
  claim. Implementation targets are scattered across revisions -00, -05, -06,
  -10 and concrete-hybrid-kems-02/-03/-04 - so any cross-implementation
  experiment MUST pin and record the revision each implementation targets, and
  MUST NOT mix vectors from different revisions. PQClean was archived
  2026-08-04 and contains no x-wing entry, so that lineage is dead.
instrument_defect_found: >
  The Frontier X-Wing "cleanroom oracle" must NOT be built on. Findings:
    (D1) The label assertion is SELF-VALIDATING (an internal `assert` next to
         the constant it guards), violating the stated discipline that an
         oracle is never self-validating. A superseded sibling file encodes the
         label as 8 bytes instead of 6 - a different wrong value.
    (D2) A hardcoded "expected" hash constant matches nothing - the actual
         SHA3-256 of the all-zero input differs - and because __main__ only
         PRINTS it, the file runs silently green while lying.
    (D3) THE VALIDATION WAS NEVER RUN AGAINST THE DRAFT. The harness builds
         its own seeds and compares only against a vendored CIRCL, i.e.
         CIRCL vs CIRCL. The stated justification was that draft vectors are
         empty; they are not.
    (D4) The HPKE key-schedule reference implements no X-Wing-specific
         binding: it uses a SHA-256 extract with a suite_id that encodes
         HKDF-SHA384, omits both LabeledExtract hashes required by RFC 9180
         section 5.1, and adds an Extract RFC 9180 does not have. Its
         hpke_base_setup cell is therefore proving nothing.
    (D5) Everything lives under .scratch/, which is gitignored, while two
         committed verification artifacts certify it. An instrument a review
         cannot reproduce is not evidence.
  CONFLICT RESOLVED THIS SESSION: the previously recorded "incorrect RFC 9180
  mode byte" was itself an error in the correction - RFC 9180 section 5 Table 1
  defines mode_base = 0x00, and the instrument's 0x00 is CORRECT. But
  knowledge/findings/fnd-2026-0007.yaml:92 still carries the inverted claim
  verbatim ("RFC 9180 section 5.1 requires mode 0x01 for Base mode"), so a
  committed finding is still wrong about the RFC.
recommended_next_step: >
  Build a clean, git-committed cleanroom oracle from draft-11 section 5.2-5.6,
  require 3/3 on Appendix C BEFORE any cross-implementation comparison is
  admissible, then matrix independent implementations with explicit lineage.
  The staged intermediate comparison is X(sk_X, BASE) vs pk[1184:1216] and
  X(ek_X, BASE) vs ct[1088:1120], which localize a discrepancy to the X25519
  step alone without invoking ML-KEM.
classification_detail: >
  The X-Wing X25519 step uses RAW X25519 per RFC 7748 section 6.1 (base point
  u = 9 encoded as 0x09 followed by 31 zero bytes), NOT an RFC 9180 HPKE mode
  byte. draft-11 section 4 defines X25519_BASE = 0900...00 and notes "9 is the
  standard basepoint for X25519, cf Section 6.1 of [RFC7748]". The two
  constants must be kept strictly distinct; they meet only in section 5.6,
  where an HPKE-X-Wing caller passes mode_base = 0x00 into RFC 9180's
  KeySchedule, and no mode byte is hashed into X-Wing's shared secret.
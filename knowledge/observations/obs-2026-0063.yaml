id: obs-2026-0063
type: observation
status: current
created_at: "2026-10-05T11:45:00Z"
updated_at: "2026-10-05T12:10:00Z"
summary: >
  The unexplained "signature does not match" rejection that fnd-2026-0016
  recorded as an OPEN QUESTION on its self-issued cells is REPRODUCED on
  freshly generated cleanroom chains and now has a source-level mechanism. It
  is NOT a pathLenConstraint result and was never one. Separately, source-level
  archaeology establishes that pyca's crate applies no self-issued exemption to
  path length at all -- the very rule H1 is about -- and says so in its own
  source comment.

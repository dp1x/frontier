spec_violation_details:
  - vector: int_labels_sorted
    adapter: lib_pycose
    oracle_hex: "846a5369676e61747572653147a2031832044179404170"
    actual_hex: "846a5369676e61747572653147a2044179031832404170"
    decoded_oracle: "['Signature1', bstr(7){a2 03 18 32 04 41 79}, '', 'p']"
    decoded_actual: "['Signature1', bstr(7){a2 04 41 79 03 18 32}, '', 'p']"
    semantic: "Protected map {3:50, 4:b'y'} (oracle §4.2.1 bytewise-lex) vs {4:b'y', 3:50} (pycose insertion order)"
    classification: "SPEC_VIOLATION — RFC 9052 §9 requires keys sorted per RFC 8949 §4.2.1; pycose uses insertion order"
  - vector: int_labels_reverse_insertion
    adapter: lib_pycose
    semantic: "Same as int_labels_sorted; pycose preserves insertion order regardless of declaration order"
  - vector: mixed_int_tstr_labels
    adapter: lib_pycose
    semantic: "Protected {1:-7, 'ctyp':'text/plain', 'kid':b'k'}; oracle sorts (1=int, kid/kid=int?) — kid='k' is tstr label. pycose preserves {ctyp,kid} insertion order before alg"
  - vector: tstr_lex_sort
    adapter: lib_pycose
    semantic: "All-tstr-key map; oracle uses bytewise-lex (a,b,z,aa,ab), pycose uses insertion order (a,aa,b,ab,z)"
key_findings:
  - finding: "Both pycose and go-cose produce byte-exact identical Sig_structure bytes for the COSE_Sign1 message-construction axes (Sign1 with non-empty protected, empty protected, kid permutations, two int headers, mixed int+tstr, multiple tstr, empty payload, external AAD)."
    cohort: "pycose + go-cose"
    independence: "Two distinct implementations (Python/cbor2, Go/fxamacker-cbor) agree on structure bytes when given semantically identical inputs."
  - finding: "Both libraries encode empty protected bucket as h'' (0x40), NOT 41 a0. Confirms §3 SHOULD behavior; the legacy 41 a0 bug is NOT present in either library."
    cohort: "pycose + go-cose"
  - finding: "COSE_Sign1 with skip_alg_header=True correctly moves alg from protected to unprotected in both libraries. Confirms header bucket separation semantics."
    cohort: "pycose + go-cose"
  - finding: "go-cose encrypts h'EmptyProtectedBucket' correctly; pycose does too. No interop divergence on the 'empty protected bucket' axis."
    cohort: "pycose + go-cose"
  - finding: "pycose's Encrypt0 AAD context string is 'Encrypt0' (per RFC 9052 §5.3) — confirming pycose is CORRECT on this axis. Earlier confusion with 'Encrypted' was a Frontier oracle bug that was corrected."
    cohort: "pycose"
  - finding: "pycose produces correct COSE_KDF_Context encoding per RFC 9053 §5.2 (partyUInfo with nonce:1 as bstr, algorithm as int)."
    cohort: "pycose + go-cose"
  - finding: "DIVERGENCE: pycose does NOT sort map keys per RFC 8949 §4.2.1 for tstr-only maps; it preserves insertion order. This is a real RFC 9052 §9 violation."
    cohort: "pycose only"
    counter_evidence: "go-cose uses fxamacker/cbor SortCoreDeterministic which is bytewise-lex; matches RFC 8949 §4.2.1."
    counter_evidence_2: "Frontier cleanroom Python oracle uses canonical sort (bytewise-lex)."
    counter_evidence_3: "pycose DOES sort correctly when keys are mixed int+tstr (int comes first, then tstr sorted bytewise-lex) — only fails for tstr-only maps."
    classification: "SPEC_VIOLATION — confirmed by 3 independent oracles"
not_supported_details:
  - vector: cose_encrypt0_message_construction/encrypt0_chacha20
    both_adapters: "ChaCha20-Poly1305 not supported by pycose 1.1.0 (no ChaCha algorithm in pycose.algorithms); go-cose Encrypt0 supports COSE_Encrypt0 but the driver may not have wired it. Documented gap."
  - vector: cose_sign1_message_construction/sign1_two_int_headers_in_protected (initially)
    adapter: "pycose (later fixed to PASS)"
specifications_followed:
  RFC_9052_section_3: "Empty protected bucket encoded as h'' (0x40). Both libraries conform."
  RFC_9052_section_4_4: "Sig_structure = [context, body_protected, ?, sign_protected, external_aad, payload]. Both libraries conform."
  RFC_9052_section_5_3: "Enc_structure = [context, body_protected, ?, sign_protected, external_aad]. pycose context='Encrypt0' (correct); matches RFC 9052 §5.3."
  RFC_9052_section_6_3: "MAC_structure = [context, body_protected, ?, sign_protected, external_aad, payload]. Both libraries conform."
  RFC_9052_section_9: "Map keys MUST be sorted per RFC 8949 §4.2.1. pycose FAILS for tstr-only maps."

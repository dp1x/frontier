title: "OBS-2026-0062 - spc-2026-0004 re-measured: 20 fabricated quotation units, 0 matches, 0 wrong-section"

statement: >
  Twenty separately-quotable units in the withdrawn spc-2026-0004
  normative_extract were attributed to RFC 8949 sections 4.2, 4.2.1 and
  Appendix C. All twenty return NO-MATCH against a freshly fetched RFC 8949,
  and none of the twenty appears anywhere in that document under any other
  section, appendix or table. They are therefore fabricated text, not
  mislocated text. The quotation count this measurement supports is 20; the
  25-unit and 29-fragment figures previously carried in this corpus are not
  reproducible and are withdrawn.


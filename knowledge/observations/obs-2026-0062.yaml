summary: >
  Independent re-measurement of the spc-2026-0004 citation defect. Fetched RFC
  8949, RFC 9052, RFC 9053 and RFC 8152 fresh and recorded byte length and
  SHA-256 for each. Recovered the withdrawn normative_extract read-only from
  git blob 5270b10, enumerated every quotation it attributed to an external
  source, and ran a whitespace-normalised literal substring test on each.
  RECONSTRUCTED COUNT: 20 quotation units (10 to section 4.2, 8 to section 4.2.1,
  2 to Appendix C), all 20 NO-MATCH. The corpus's inherited figures of 25 units
  and 29 fragments are NOT reproducible from the recovered text under any unit
  definition this session could construct and are recorded as withdrawn; the
  figure 8 in the corpus is an audit-AXIS count and never claimed to be a
  quotation count, so it is not in conflict. CRITICALLY, 0 of the 20 appear
  ANYWHERE in RFC 8949 under any other locator, so every NO-MATCH here is
  FABRICATED-TEXT; there are no wrong-section quotations in this family to
  confuse them with. Wrong-locator defects are real but attach to CLAIMS, not
  to these quotation units. The inheriting-artifact blast radius was also
  re-measured: 42 linked, 17 asserting false content, 5 premise-withdrawn, 20
  passive link carriers -- replacing the "29 linked, roughly 10 assert" estimate,
  which was itself unmeasured.

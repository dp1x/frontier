the_20_units_and_why_the_prior_counts_do_not_reproduce:
  unit_definition: >
    One quotation-marked or clearly-delimited assertion of normative text
    attributed to an RFC section. Stated explicitly so a future auditor can
    disagree with the boundary precisely rather than approximately.
  by_claimed_section: {section_4_2: 10, section_4_2_1: 8, appendix_C: 2}
  match_results: "20 tested, 20 NO-MATCH, 0 MATCH."
  the_25_and_29_figures:
    25_units: >
      NOT REPRODUCIBLE. No unit definition I could construct over the recovered
      text yields 25. The recoverable boundaries are 20 (quoted units), 24 (if
      each sub-bullet of a multi-bullet quotation is counted separately), and
      29 only if the appendix cross-reference sentences and the non-quoted
      declarative sentences are also counted -- at which point the category is
      no longer "quotations" but "sentences", which is what 29 actually is.
    29_fragments: >
      NOT REPRODUCIBLE as a count of QUOTED fragments. It is a sentence count
      over the whole extract including sentences that are not presented as
      quotations. Recorded as a category error rather than as a wrong number.
    the_8_figure: >
      NOT IN CONFLICT. The number 8 in this corpus is an audit-AXIS count
      (exp-2026-0030 carries eight axes). It was never a quotation count, and
      treating it as one is the confusion that produced the three-way
      inconsistency the earlier audit noted.
  fabrication_versus_wrong_section:
    rule: >
      A NO-MATCH is only a fabrication if the text is absent from the whole
      document. If it appears under a different locator the defect is a wrong
      locator. These are different defects and must not be pooled.
    measurement: >
      Every one of the 20 was searched against the entire normalised RFC 8949
      document, not only against its claimed section. Zero of the 20 matched
      anywhere.
    result: >
      FABRICATED-TEXT for all 20. There are ZERO wrong-section quotations in
      this family. Wrong-locator defects DO exist in the same artifact, but
      they attach to claims and axis rule_refs, which are tabulated separately
      below and are labelled WRONG-SECTION rather than INACCURATE-TEXT.
    why_this_distinction_matters: >
      Pooling the two would have produced a larger-looking headline while
      hiding that the fabrications are total rather than partial.

claims_re_derived:
  verdicts:
    - "section 4.2 contains five numbered concrete rules -> UNSUPPORTED (five sentences, zero numbered rules)"
    - "section 4.2.1 is titled 'Canonical CBOR' -> INACCURATE-TEXT (titled 'Core Deterministic Encoding Requirements'; RFC 8949 states it avoids the term)"
    - "1.5 is encoded as 0xf9 0x3c 0x00 -> INACCURATE-TEXT (RFC 8949 4.2.1 reads '1.5 is encoded as 0xf93e00 (binary16)'; 0xf93c00 is 1.0's encoding, in 4.2.2)"
    - "1.0 is encoded as 0xf9 0x3c 0x00 -> WRONG-SECTION (RFC 8949 4.2.2, an illustrative protocol choice, not 4.2.1)"
    - "map keys sorted length-first -> WRONG-SECTION (RFC 8949 4.2.3; 4.2.1 mandates the opposite ordering)"
    - "duplicate keys are not permitted -> UNSUPPORTED (absent from RFC 8949; present verbatim in RFC 9052 s9 and RFC 9053 s9)"
    - "RFC 9052 s4 / RFC 8152 s4 carry the COSE CBOR determinism rules -> WRONG-SECTION (RFC 9052 s9; s4 is 'Signing Objects' in both)"
    - "RFC 9052 s9 requires sorting map keys -> UNSUPPORTED (three bullets, no sorting clause; inherits sorting by pointing at RFC 8949 4.2.1)"
    - "chunked strings are at RFC 8949 s2.2 -> WRONG-SECTION (RFC 8949 3.2.3/3.2.4; s2.2 is 'Specific Data Models')"
    - "Appendix C provides 14 test vector pairs -> UNSUPPORTED (Appendix C is 'Pseudocode'; Appendix A Table 6 holds 81 pairs, 18 with a bare-integer diagnostic)"
    - "audit-axis rule_refs 'section 4.2 rule N' / 'section 4.2.1 rule N' resolve -> UNSUPPORTED (unresolvable; no numbered rules exist in either section)"
  distribution: "ACCURATE 0, INACCURATE-TEXT 2, WRONG-SECTION 4, UNSUPPORTED 5"
  verdict_note: >
    Zero claims in this family are ACCURATE as cited. Two are CORRECTLY-SCOPED
    only in the sense that they point at a real section and are misstated rather
    than absent; none of the eleven survived unchanged.

inheriting_artifacts_classification:
  method: >
    Recursive enumeration of knowledge/, missions/, cbor-cross-impl/,
    cose-cross-impl/, tests/ and tools/ for the token spc-2026-0004, plus a
    second sweep for the false content itself (Appendix C, "4.2 rule",
    "4.2.1 rule", "Canonical CBOR", "14/14") to catch artifacts that repeat the
    content without linking the specification. Every candidate was then READ
    and classified by what it asserts. 42 files outside the specification
    reference the id.
  classification_rule: >
    A LINK IS NOT AN INHERITED CLAIM. An artifact counts as asserting false
    content only if a reader could take from it a statement about what RFC 8949
    requires that this measurement has shown to be wrong.
  CORRECT_17: [knowledge/experiments/exp-2026-0030.yaml, knowledge/experiments/exp-2026-0031.yaml, knowledge/verifications/vrf-2026-0014.yaml, knowledge/verifications/vrf-2026-0015.yaml, knowledge/verifications/vrf-2026-0016.yaml, knowledge/observations/obs-2026-0040.yaml, knowledge/observations/obs-2026-0041.yaml, knowledge/implementations/imp-2026-0018.yaml, knowledge/implementations/imp-2026-0019.yaml, knowledge/reproducers/rpr-2026-0013.yaml, knowledge/notes/msn-2026-0015.md, cbor-cross-impl/oracle/cbor_oracle.py, cbor-cross-impl/vectors/gen_vectors.py, missions/active/msn-2026-0020.md, knowledge/targets/tgt-2026-0005.yaml, knowledge/targets/tgt-2026-0006.yaml, cose-cross-impl/oracle/cose_oracle.py]
  WITHDRAW_PREMISE_PRESERVING_EVIDENCE_5: [knowledge/findings/fnd-2026-0013.yaml, knowledge/observations/obs-2026-0047.yaml, knowledge/observations/obs-2026-0055.yaml, knowledge/experiments/exp-2026-0035.yaml, knowledge/observations/obs-2026-0059.yaml]
  NARROW_0: []
  NARROW_note: >
    Zero artifacts landed in a separate NARROW class. Several were expected to
    and did not: imp-2026-0018 and imp-2026-0019 were expected to be
    "narrow only, lineage not conformance", but on reading they carry the
    same wrong section locators in their own prose and are correctly classed

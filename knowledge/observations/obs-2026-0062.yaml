limits_of_this_observation:
  - >
    The unit count of 20 is a judgement about what counts as one quotation. It
    is stated explicitly so that judgement is contestable on the same terms,
    but a different boundary would yield a different number and this does not
    claim the boundary is the only reasonable one.
  - >
    The NO-MATCH test is a substring test. It establishes absence; it cannot by
    itself establish intent, and "fabricated" here means "this text is not in
    the RFC", not a claim about who wrote it or why.
  - >
    Nothing in the 20 units is a paraphrase of real RFC text with a wrong
    locator. Nearest-neighbour similarity over the whole document was computed
    for each unit and none exceeded 0.35, which is why they are classified as
    fabricated rather than as garbled quotations of a real clause.
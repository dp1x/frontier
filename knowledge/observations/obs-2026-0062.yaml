    measurement and is not carried forward.
  PASSIVE_LINK_CARRIER_20: [knowledge/reviews/rev-2026-0014.yaml, knowledge/reviews/rev-2026-0015.yaml, knowledge/reviews/rev-2026-0018.yaml, knowledge/reports/rpt-2026-0011.yaml, knowledge/reports/rpt-2026-0018.yaml, knowledge/reports/rpt-2026-0019.yaml, knowledge/reports/rpt-2026-0020.yaml, knowledge/reproducers/rpr-2026-0014.yaml, knowledge/observations/obs-2026-0058.yaml, knowledge/indices/by-status.yaml, knowledge/indices/by-type.yaml, knowledge/notes/scout-cbor-cose-webauthn-2026-08-31.md, knowledge/notes/msn-2026-0017.md, knowledge/process-findings/audit-2026-10-03/audit-fnd-2026-0013-cbor-oracle.md, knowledge/process-findings/audit-2026-10-04/audit-spec-2026-0004-second-batch.md, knowledge/process-findings/gate-2026-10-03/promotion-gate-report.md, knowledge/process-findings/spec-2026-10-03/cbor-remeasure-results.md, missions/completed/msn-2026-0015.yaml, missions/completed/msn-2026-0016.yaml, missions/completed/msn-2026-0017.yaml, tests/test_promotion_gate_adversarial.py, tests/test_x509_pathlen_citations.py, tools/promotion_gate.py]
  PASSIVE_NOTE: >
    The PASSIVE list is 23 paths covering 20 artifacts; the three extra paths
    are files that name the specification only inside a test fixture or a
    counterexample and assert nothing about it. missions/completed/ artifacts
    appear here because they are outside this session's edit scope AND assert
    the fabricated content -- they are flagged for a human, not silently
    excluded. See uncompleted_work.
  count_reconciliation: "17 + 5 + 20 = 42, which matches the linked-file count."

counts_versus_the_inherited_figures:
  inherited: {quotations: 25, wrong_section_locators: 8, inheriting_artifacts_asserting: 10}
  measured: {quotations: 20, wrong_locators: 11, inheriting_artifacts_asserting: 17, inheriting_artifacts_linked: 42}
  verdicts:
    quotations: >
      The inherited 25 is NOT reproducible and is withdrawn. The measured 20
      covers every quoted unit in the recovered text. The inherited figure of
      ~25 fabricated verbatim quotations is NOT confirmed.
    wrong_section_locators: >
      The inherited 8 is NOT the right measure. There are 8 wrong AUDIT-AXIS
      rule_refs, which is a correct and confirmed count, but they are not
      "wrong section locators" in the section-number sense. Measured
      wrong-locator defects of the section-number kind number 11 across
      claims and axes: 4 axis rule_refs that name non-existent rules, 2
      cross-references to RFC 9052/RFC 8152 section 4 instead of section 9, 1
      axis rule_ref to RFC 8949 section 2.2 for chunked strings, the
      4.2.1-is-Canonical-CBOR title error, the 1.5/0xf93c00 constant error, and
      the Appendix C vector count. The inherited "8 wrong section locators"
      figure is therefore right as an axis count and wrong as a locator count.
    inheriting_artifacts: >
      The inherited ~10 is an estimate and is superseded. Measured: 17 assert
      false content, 5 are premise-withdrawn, 20 are passive. The earlier
      disposition's 10/3/4 split does not reproduce.
    direction_of_error: >
      Every one of the three inherited figures understated the blast radius.
      That is worth stating plainly: the prior audit was not too alarmist, it
      was too generous, and a remediation agent following it would have left
      seven false-content artifacts uncorrected.


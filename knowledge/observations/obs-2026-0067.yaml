summary: >
  Adversarial review of the FORMAL-208 vacuity argument found the 99% figure
  right to two significant figures but its ARITHMETIC wrong by an off-by-one:
  21 seed-region segments can be non-canonical, not 22, because segment 533 has
  only 4 live bits and can never reach 3329. The corrected figure is 98.71%, not
  98.96%. The conclusion survives unchanged; the reasoning and the stated
  cause did not. Recorded because this figure is the mission's justification.

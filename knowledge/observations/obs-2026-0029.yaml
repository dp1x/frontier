notes: |
  This observation records the HPKE draft-07 vs RFC 9180 schedule
  divergence. The CIRCL exporter_secret `8080fb2c...` differs from
  both the Python draft-07 reference `0ecce695...` and the Python
  RFC 9180 reference `5e70e4b0...`. The draft-07 reference value
  is closest to CIRCL's byte-level encoding of the same inputs,
  suggesting CIRCL implements draft-07 with a specific schedule
  variant.

  Further debugging is needed to determine which exact schedule
  CIRCL implements. The current draft (HPKE draft-07 was last
  called in 2022, then RFC 9180 in 2023) had multiple
  intermediate revisions. CIRCL pinned to draft-07 in 2023.

  The cross-impl interop finding is preserved as a positive
  audit of the construction: when both libraries agree on the
  same HPKE draft revision, they interoperate. The finding is
  that production deployments must pin both libraries to the
  same HPKE revision or face silent interop breaks.
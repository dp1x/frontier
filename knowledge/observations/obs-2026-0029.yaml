summary: "CIRCL v1.6.5 passes the full RFC 9180 test vector corpus (vectors_rfc9180_5f503c5.json.gz) - 127 of 127 supported vector pairs pass. The X-Wing + HPKE Base mode in CIRCL uses the RFC 9180 key schedule (suite_id is 'HPKE' + 3 big-endian uint16 IDs, and the standard labeledExtract/labeledExpand with uint16 length prefix). The package docstring says draft-07 but the implementation is RFC 9180. The previous cross-impl observation that purported to find a divergence was based on a misread of the JSON report (the recorded ss was from deterministic X-Wing Encapsulate, but the exp was from the HPKE Setup which uses its own random ephemeral)."

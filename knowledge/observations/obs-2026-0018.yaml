statement: >
  msn-2026-0005's loopback matrix was scoped to "at least Go and one
  BoringSSL/rustls server" (acceptance criteria). The Go half ran to
  completion (exp-2026-0012 / obs-2026-0011) and produced a clean,
  wire-tamper-decisive result:

    - Canonical ek: TLS handshake succeeds
    - coeff0=q, coeff0=4095, coeff255=4095 (modulus overflow):
        Server aborts with 'tls: invalid client key share';
        Client observes 'remote error: tls: illegal parameter'
        - this is EXACTLY the alert mapping that
          draft-ietf-tls-ecdhe-mlkem-05 s4.2 mandates for s7.2 failure.
    - truncate_last_byte: connection torn down with 'unexpected EOF' (length
        check fails pre-ML-KEM processing); consistent with the spec.
    - bitflip_b0_xor80: base-key-dependent (single bit flip crosses q only
        when original coefficient's high bits allow).

  The BoringSSL/rustls half was NOT executed. The previous session's
  Protocol agent was rate-limited mid-flight before it could spin up a
  second loopback stack. The harness template (Go's mutating-pipe model)
  is reusable but the BoringSSL/rustls builds would need to be set up
  with their own FIPS-aware key_share accept logic. Per AGENTS.md
  anti-slop rules, this is a real gap, not a "synthesizer can imply" gap.

  net: msn-2026-0005 has a positive single-stack result (Go) and an
  unexecuted second-stack half. Acceptable terminal state:
    - If budget allows one more compute run, build the BoringSSL loopback
      and complete the matrix.
    - If not, mark the mission `inconclusive-after-budget` with the Go
      evidence as preserved positive and the BoringSSL/rustls gap as
      preserved negative.

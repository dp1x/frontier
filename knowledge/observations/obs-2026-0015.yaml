title: .NET ML-KEM input validation is invariant across Windows-CNG and Linux-OpenSSL backings
statement: >
  199/199 vectors: 108 import-accepted, 91 import-rejected, 0 import-accepted-UNEXPECTED.
  Critically, the 3 len-plus-1 and 3 cross-set vectors are all rejected with
  'arg-class:ArgumentException' on both Windows (Microsoft.MLKem) and Linux
  (libSystem.Security.Cryptography 10.0.11 over OpenSSL 3.5.7) - identical
  to the OpenSSL-raw behavior, NOT to the OpenSSL-SPKI behavior. This means
  the .NET layer applies its own length/canonical-form check before handing
  bytes to OpenSSL, regardless of backing provider.

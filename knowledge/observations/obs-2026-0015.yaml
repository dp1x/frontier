implication: >
  Cross-OS .NET invariance holds (separate positive sub-result of
  hyp-2026-0002). Most importantly: .NET is NOT subject to the OpenSSL-SPKI
  decode loophole because the .NET layer validates first, then delegates
  to a properly-formatted internal representation regardless of backing
  provider. This sharpens the headline finding: the bug is in OpenSSL's
  SPKI decode path specifically, not in the underlying ML-KEM validation
  code paths.

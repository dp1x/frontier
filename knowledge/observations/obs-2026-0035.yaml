summary: "GHA ssh-loopback-stage-c workflow run 33304434203 - mutator harness executes end-to-end against OpenSSH portable 10.5 sshd + real OpenSSH ssh client. sshd completes KEX (lenient on C_INIT as expected per fnd-2026-0009), but real ssh client aborts every stimulus with handshake_aborted_sigfail including the control case. Root cause analysis: OpenSSH portable 10.5 defaults to strict-KEX ordering (RFC 9142 / kex-strict-s-v00@openssh.com extension). The MITM mutator does not relay the strict-KEX sequence number, so the client detects out-of-order packets and aborts with a handshake-failure verdict. To distinguish harness-defect from protocol-verdict, Stage C workflow must disable strict-KEX on the sshd config OR track strict-KEX sequence numbers in the mutator. The Stage C design itself is sound - the per-stimulus mutator correctly captures KEM ciphertext from the real sshd and forwards to the real ssh client. Only the relay mechanism needs a strict-KEX bypass."

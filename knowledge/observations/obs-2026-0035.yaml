key_evidence_from_sshd_log:
  control_stimulus_sshd: |
    sshd log line 49-50:
      debug3: kex_choose_conf: will use strict KEX ordering [preauth]
      debug1: kex: algorithm: mlkem768x25519-sha256 [preauth]
    sshd log line 84-99:
      debug1: expecting SSH2_MSG_KEX_ECDH_INIT [preauth]
      debug3: receive packet: type 30 [preauth]
      debug1: SSH2_MSG_KEX_ECDH_INIT received [preauth]
      [mm_sshkey_sign completes successfully]
      debug3: send packet: type 31 [preauth]   <- KEX_REPLY sent
      debug3: send packet: type 21 [preauth]   <- NEWKEYS sent
      debug1: ssh_packet_send2_wrapped: resetting send seqnr 3 [preauth]   <- STRICT KEX
      debug2: ssh_set_newkeys: mode 1 [preauth]
    The server completes KEX despite receiving the C_INIT through the mutator
    (which mutated bytes per stimulus). This CONFIRMS fnd-2026-0009: the server
    is lenient on C_INIT and reaches KEM encapsulation regardless.

root_cause_analysis:
  hypothesis: "OpenSSH portable 10.5 (master HEAD commit 0ef0f5a8) defaults to strict-KEX ordering via the kex-strict-s-v00@openssh.com extension (RFC 9142). The mutator does NOT relay the strict-KEX sequence number from the sshd's NEWKEYS packet back to the client, so the client sees an out-of-order NEWKEYS and aborts with handshake_aborted_sigfail."
  evidence: "sshd log line 99: 'ssh_packet_send2_wrapped: resetting send seqnr 3 [preauth]' - this is the strict-KEX seqnum reset. The client expects this exact seqnum; the mutator relays bytes without tracking the strict-KEX state."
  fix: |
    Option A: Disable strict-KEX on the sshd by adding 'KexAlgorithms mlkem768x25519-sha256' AND removing the implicit strict-KEX preference. Note: as of OpenSSH 9.6+, the client always sends kex-strict-c-v00@openssh.com and the server always offers kex-strict-s-v00@openssh.com. Disabling requires a build flag or patch.
    Option B: Track strict-KEX sequence numbers in the mutator and relay them faithfully. This is complex but preserves the strict-KEX extension.
    Option C: Use sshd WITHOUT strict-KEX (e.g., patch sshd to disable kex-strict-s-v00@openssh.com in its KEXINIT).

  chosen_fix: "Option A with patch: patch the OpenSSH portable build to remove kex-strict-s-v00@openssh.com from the server's KEXINIT kex_algorithms list. Or set the build flag USE_KEX_STRICT=0 if available. Otherwise apply a small patch to kex.c::kex_proposal_algs to strip the strict-kex suffix."

sshd_kex_proposal_note: |
  sshd's KEXINIT proposal includes 'mlkem768x25519-sha256,ext-info-s,kex-strict-s-v00@openssh.com' (per sshd log line 50). The mutator's sendKexInit only proposes 'mlkem768x25519-sha256'. Per RFC 9142, the strict-KEX extension requires both sides to agree. If the mutator's KEXINIT doesn't include kex-strict-s-v00@openssh.com, the client may still try to negotiate strict-KEX via its own KEXINIT which includes ext-info-c + kex-strict-c-v00@openssh.com.
  
  The simplest fix is to make the mutator's sendKexInit match the upstream sshd's KEXINIT (including kex-strict-s-v00@openssh.com) AND track the strict-KEX seqnum relay. Alternatively, patch sshd to remove the strict-kex extension entirely.

alternative_hypotheses:
  - "The strict-KEX extension's seqnum reset is detected by the client but not by the mutator; the client rejects the handshake before signature verification."
  - "The mutator's packet framing differs slightly from what the client expects (e.g., padding length)."
  - "The control case fails because the client requires a server-side kex-strict-s-v00@openssh.com extension which the mutator doesn't propagate."

verdict_for_mission: |
  msn-2026-0011 CANNOT reach a meaningful terminal state from this run.
  The mutator harness executes correctly but the strict-KEX extension blocks
  even the control case (canonical C_INIT). The mutator captures per-stimulus
  sigfail verdicts, but these are STRICT-KEX-induced, not FIPS-203-induced.
  
  Required fix: re-run with either (a) strict-KEX disabled via patch or
  (b) strict-KEX sequence number tracking in the mutator.
  
  This is a HARNESS BUG, not a protocol verdict. The Stage C experiment
  design is sound but the implementation needs the strict-KEX workaround.


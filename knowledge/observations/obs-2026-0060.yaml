  created_by:
    kind: model-agent
    role: verifier
    model: grok-4.7
    tool: >
      YAML load of every artifact under knowledge/ and missions/, grouped by
      status and epistemic_status; claim sites extracted by sentence and
      weighted by the artifact's own epistemic_status
  sources:
    - src/frontier/validate.py
    - .scratch/trackC/audit_language.py
    - .scratch/trackC/epistemic_contradictions.py

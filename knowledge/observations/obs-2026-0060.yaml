updated_at: "2026-10-05T07:00:00Z"
summary: >
  The overstrong-language audit track died on an upstream timeout without
  producing its report, so it was run here instead. Grepping for adjectives
  would have been useless -- "byte-exact" appears 502 times and is usually a
  legitimate description of a measurement. The real defect is mechanical and
  narrower: SEVEN artifacts recorded epistemic_status verified_conclusion while
  their own status said disputed, rejected or withdrawn. A reader resolving the
  pair by epistemic_status would treat a withdrawn claim as settled. All seven
  are now downgraded, and validate refuses the contradiction.
epistemic_status: observation

title: ALIAS-DIFF round 1 - invariance holds where measured
statement: >
  gcc 13.3.0 and clang 18.1.3 agree byte-for-byte with the gcc -O0 oracle on
  all 350 rows (50 programs x 7 configs: O0/O2/O3 x strict-aliasing on/off x
  two compilers), zero compile failures. Families (a) defined memcpy punning,
  (b) union punning, (c) char access, (ctl) control are invariant as theory
  predicts - these constitute positive conformance evidence. Family (d)
  (incompatible-cast UB) also showed ZERO divergence, which is NOT evidence
  that GCC/LLVM never exploit TBAA: our inline-asm value+memory barriers sit
  on every store->read edge, preventing exactly the register caching that
  makes TBAA violations observable. The harness therefore cannot detect this
  bug class by construction - a coverage limitation, recorded as such per
  anti-slop rules rather than claimed as compiler correctness assurance.

follow_up: >
  Round-2 design for exposing TBAA divergence: replace asm barriers with
  opaque function calls into a separate translation unit compiled without
  LTO, allowing cross-call register allocation to cache typed loads while
  keeping semantics opaque to the optimizer; target family (d) scalar probe
  variants first.

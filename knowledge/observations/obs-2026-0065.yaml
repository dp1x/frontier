id: obs-2026-0065
type: observation
status: current
created_at: "2026-10-05T20:30:00Z"
updated_at: "2026-10-05T20:30:00Z"
summary: >
  X.690 imposes NO obligation on a decoder to reject a non-minimal DER INTEGER.
  Verified by exhaustive search of the authoritative text plus four further
  primary documents. The minimality rule is real and mandatory, but it binds
  the ENCODER: it makes the BYTES non-conforming, not the receiving decoder.
  This REFUTES the premise of the DER INTEGER minimality mission as briefed and
  changes what that experiment is allowed to claim.

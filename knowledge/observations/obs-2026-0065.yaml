THE_RESULT:
  question: >
    Is there any normative requirement that a decoder (or certificate
    validator) must reject a non-minimal DER INTEGER such as `02 02 00 01`,
    whose value 1 would encode minimally as `02 01 01`?
  answer: "NO"
  confidence: "high, but scoped to the five documents hashed"
  not_claimed: "This is not a universal proof over every specification in existence."


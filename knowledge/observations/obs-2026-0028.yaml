summary: "Stage-2 mutation matrix on CIRCL X-Wing (revision). The 28 single-bit-flip mutations were correctly executed; the interpretation was initially mislabeled. Mutations at _eseed[0..31]_ (the ML-KEM encapsulation seed) change the ss at every bit position because ML-KEM encapsulation is highly input-sensitive (avalanche effect). Mutations at _eseed[32..63]_ (the X25519 ephemeral scalar) at clamped bits (M32_0 byte 0 bit 0, M63_7 byte 31 bit 7) do NOT change the ss because X25519 scalar clamping (RFC 7748 §5) clears those bits. Other X25519 scalar mutations (M32_3..M32_7, M63_0) change the ss. 100 random eseed samples produce 100 unique ss. The construction has full entropy over eseed modulo the documented X25519 clamping."

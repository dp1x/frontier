title: "OBS-2026-0028 (revised) - CIRCL X-Wing mutation matrix: ML-KEM avalanche + X25519 clamping at expected positions"
mutation_matrix_results:
  total_mutations: 28
  ss_changed: 26
  ss_unchanged: 2
  unchanged_mutations:
    - name: "M32_0_x25519_clamped"
      position: "eseed[32], bit 0"
      reason: "X25519 ephemeral scalar byte 0 bit 0 - cleared by X25519 scalar clamping (RFC 7748 §5: k[0] &= 248)"
    - name: "M63_7"
      position: "eseed[63], bit 7"
      reason: "X25519 ephemeral scalar byte 31 bit 7 - cleared by X25519 scalar clamping (RFC 7748 §5: k[31] = (k[31] & 127) | 64)"
  changed_mutations_ml_kem_seed:
    note: "Mutations at eseed[0..31] (ML-KEM encapsulation seed, 32-byte message 'm' in FIPS 203 §6.1) all change the ss. This is expected avalanche behavior - ML-KEM encapsulation is highly input-sensitive at every bit position."
    count: 14
    examples:
      - "M0_0 (ML-KEM seed byte 0 bit 0) - ss changes from bc50e65a... to 0db7fed8..."
      - "M5_3 (ML-KEM seed byte 5 bit 3) - ss changes"
      - "M31_5 (ML-KEM seed byte 31 bit 5) - ss changes (NOT X25519 clamping)"
  changed_mutations_x25519_ephemeral_non_clamped:
    note: "Mutations at eseed[32..63] (X25519 ephemeral scalar) at non-clamped bits change the ss."
    count: 10
    examples:
      - "M32_3 (X25519 scalar byte 0 bit 3) - ss changes from bc50e65a... to 1a90f9ae..."
      - "M32_4, M32_5, M32_6, M32_7 - ss changes"
      - "M63_0 (X25519 scalar byte 31 bit 0) - ss changes"
  sample_matrix:
    samples: 100
    unique_ss: 100
    entropy_preserved: true
interpretation: |
  The two mutations that did NOT change the ss both fall in X25519 scalar
  clamping bits. The X-Wing spec feeds eseed[32:64] to X25519 as an
  ephemeral key generator input; CIRCL's x25519.KeyGen() applies the
  RFC 7748 §5 clamping which masks out exactly those two bit positions.

  All other mutations change the ss (avalanche effect on ML-KEM seed,
  input sensitivity on non-clamped X25519 bits).

  This observation is positive Stage-2 evidence: the construction is
  input-sensitive at all positions not affected by X25519 clamping.
  100/100 random samples produce unique ss, confirming entropy of the
  X-Wing construction.

  Initial labeling of M0_0, M5_x, M31_x as "X25519 clamped" was incorrect;
  eseed[0..31] is the ML-KEM encapsulation seed, NOT the X25519 scalar.
  Only eseed[32..63] is the X25519 scalar. The corrected labeling is
  recorded above.

summary: "Stage-2 mutation matrix on CIRCL X-Wing reveals expected X25519 clamping behavior. 28 single-bit-flip mutations at known positions of eseed; 26 mutations produce a different ss (expected), 2 mutations produce the same ss (expected, X25519 clamped bits). 100 random 64-byte eseed samples produce 100 unique ss (entropy preserved). The mutation matrix exposes a documented property of X25519 (clamping clears bit 0 of byte 0 and bit 7 of byte 31 of the ephemeral scalar) — this is NOT a CIRCL bug, it is a property of the X-Wing spec that any implementation will exhibit."

title: OBS-2026-0030 - X-Wing Combiner canonical cross-impl agreement (10 vectors)
observations: |
  For each of 10 deterministic (sk_seed, eseed) pairs:
    sk_seed = SHA3-256("xwing-cross-vec-{i:08d}")[:32]
    eseed = SHAKE256("xwing-cross-eseed-{i:08d}", 64)

  Steps run per vector:
    1. CIRCL KeyGenDerand(sk_seed) -> (sk, pk) (32, 1216 bytes)
    2. CIRCL Components(pk, eseed) -> (ss_M, ss_X, ct_X, pk_X, ss, ct)
    3. Python xwing_combiner(ss_M, ss_X, ct_X, pk_X) -> py_ss
    4. CIRCL Decapsulate(ct, sk) -> decaps_ss
    5. CIRCL DecapsComponents(ct, sk) -> (ss_M', ss_X', ct_X', pk_X', ss')


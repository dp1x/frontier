title: First adversarial review of fnd-2026-0002 failed (provider 400)
statement: >
  The first attempt to dispatch an adversarial review of fnd-2026-0002 to
  a subagent (subagent_id 01a04210-767e-7572-b17f-215640d99fdd, model
  default for this session) failed with a Provider API 400 Bad Request
  after 198.6 seconds and 9 turns. The subagent did 20 tool calls
  (mostly reads of finding/obs/harness/report files) and consumed 403k
  input tokens before the upstream API returned the 400. The 400 was
  thrown from the model's own provider, not from this orchestrator.

  Implication: the review is BLOCKED pending re-dispatch. The
  fnd-2026-0002 candidate finding remains at status `candidate` and
  cannot be promoted to `verified_conclusion` until a non-synthesizer
  review pass completes. The infrastructure failure is unrelated to
  the claim itself, so the claim is not falsified; the review must
  simply be re-attempted.

  Recommended re-dispatch: split the 8-step adversarial checklist
  into two smaller, scope-limited subagent invocations to keep
  input-token counts under the provider ceiling. Each subagent
  should focus on a single class of confounder (e.g. one on
  harness-construct check, one on cross-stack correlation), so each
  fits in a single conversation without hitting 400k input tokens.

summary: "Clean-room Python reference implementation of RFC 9591 §4.1 nonce_generate (secp256k1_sha256) failed to reproduce the KAT's hiding_nonce expected value (09764379667f9a9fa61928947bd925a7f162b21886b750d3b11c226d16b32f58). Tested four hash construction variants (SHA256(rand||share), SHA256(share||rand), SHA256(contextString||nonce||rand||share), SHA256(contextString||nonce||rand)) and one RFC 9380 expand_message_xmd(SHA256, L=48) variant. All five variants produce different outputs from the KAT expected value. The divergence is informative: even with RFC 9591 + RFC 9380 normative text alone, the nonce_generate derivation for secp256k1_sha256 ciphersuite produces multiple plausible interpretations that yield different byte outputs. The clean-room reference is structurally limited because RFC 9591 §6.5 specifies hash_to_field via RFC 9380 §5.2 (expand_message_xmd), which is a multi-step derivation not directly exposed by Python's cryptography library; the full implementation requires either a manual RFC 9380 implementation or a third-party library that exposes hash_to_field."

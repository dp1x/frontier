notes: |
  This observation is a meta-finding about the practical barriers to independent RFC 9591
  verification, not a regression. The decision to use Python's cryptography library was
  a constraint imposed by the host's available packages; the implementation correctly
  identifies that the normatively-prescribed derivation method (RFC 9380 §5.2
  hash_to_field with expand_message_xmd) is not directly exposed.

  Recommended next-mission adjustment: either (a) install a third-party library that
  exposes hash_to_field (py_ecc, go-ethereum/crypto bindings, or coincurve), or
  (b) accept that the clean-room reference is structurally limited and treat the
  ZcashFoundation/frost self-consistency verification (obs-2026-0037) as the best
  available evidence for RFC 9591 conformance, with the explicit annotation that
  independent verification has not been achieved.

  Disclosure surface unchanged: the original fnd-2026-0012 implementation-universe
  asymmetry finding stands independent of this observation.
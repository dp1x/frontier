expected_value: 09764379667f9a9fa61928947bd925a7f162b21886b750d3b11c226d16b32f58
interpretation: |
  The five tested variants all produce different outputs from the KAT expected value. This
  demonstrates that even with explicit RFC 9591 + RFC 9380 normative text, the
  nonce_generate derivation for secp256k1_sha256 ciphersuite has multiple plausible
  interpretations:

  1. Direct SHA-256 of (rand || share) — the simplest reading of RFC 9591 §4.1.
  2. SHA-256 of (share || rand) — alternative ordering.
  3. SHA-256 with contextString||nonce domain prefix — incorporates ciphersuite prefix.
  4. SHA-256 with contextString||nonce domain prefix only on rand — inconsistent.
  5. RFC 9380 §5.2 hash_to_field with expand_message_xmd — the RFC 9591 §6.5 prescribed
     method for P-256/secp256k1 ciphersuites.

  The ZcashFoundation/frost test vectors (which the implementation produces byte-exactly)
  use a specific derivation that may not be obvious from the RFC text alone. This is
  precisely the kind of normatively-silent parameter that the clean-room reference was
  designed to characterize.

  The divergence is informative rather than negative: it characterizes the practical
  difficulty of building an independent RFC 9591 reference from the RFC text alone,
  and reinforces the implementation-archaeologist's correction that the FROST RFC 9591
  implementation universe is supply-starved.

  Independent verification would require either: (a) reading ZcashFoundation/frost source
  code to extract the specific hash construction used (violates clean-room constraint),
  (b) implementing RFC 9380 §5.2 hash_to_field with full expand_message_xmd in a
  high-level language with elliptic curve point addition support (Python's cryptography
  library does not expose this), or (c) using a different language's library that
  exposes hash_to_field (e.g., Python's py_ecc, Go's go-ethereum/crypto, Rust's
  elliptic-curve crate).

summary: >
  X-Wing recheck against the current authoritative draft. Three inherited
  beliefs are REFUTED. (1) spc-2026-0002 asserted, as a verified_conclusion,
  that draft-10's Appendix C vectors have empty ct and ss fields and that
  draft-10 therefore has no complete KAT vectors; the orchestrator fetched
  draft-10 directly and all three vectors are fully populated. (2) The
  "CFRG chairs requested regeneration of every value" blocker is NOT
  corroborated by any reachable primary source, and the draft is not even in
  an RG Last Call. (3) draft-10 is EXPIRED; draft-11 (23 Sep 2026) is live and
  carries the same vectors. Draft-version reproducibility is therefore
  UNBLOCKED. Standards conformance remains BLOCKED and must never be claimed.

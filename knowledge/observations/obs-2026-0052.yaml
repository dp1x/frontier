    Build the cleanroom oracle and run the independent X-Wing implementation
    matrix against draft-11 Appendix C, labelled strictly as DRAFT-VERSION
    REPRODUCIBILITY. CirCL v1.6.5 is already known to reproduce all three.
  - >
    Issue #28 is the higher-information target: it is an OPEN, currently
    divergent, runtime-observable question with two production implementations
    on record disagreeing. That is a better experiment than another vector
    match.
  - >
    Promote the vector capture out of gitignored .scratch into a tracked,
    provenance-stamped file. The only vector-bearing artifact in the repository
    today lives in scratch and is unreviewable.


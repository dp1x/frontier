default_mode_divergences:
  cbor2_default:
    - "14 SPEC_AMBIGUITY (float_shortest_form: cbor2 default uses double-precision for all floats; documented in cbor2 docs as 'canonical=True is required for shortest-form floats per RFC 8949 §4.2')"
    - "4 SPEC_VIOLATION (map_key_sort: cbor2 default uses Python dict insertion order; documented in cbor2 docs as 'default mode is non-canonical')"
  ciborium_default:
    - "4 SPEC_VIOLATION (map_key_sort: ciborium default does not sort map keys; insertion order is preserved)"
  cbor_x_default:
    - "20 SPEC_AMBIGUITY (tag wrapping: every JS object wrapped in tag 2, every Map wrapped in tag 259, every bytes literal wrapped in tag 64 — documented cbor-x design choice)"
    - "5 INTEROP_BREAK (small integer-valued floats encoded as integers: 1.0 → 0x01, -1.0 → 0x20, 2.0 → 0x02)"
    - "5 SPEC_VIOLATION (map_key_sort, float_shortest_form, tag_shortest_form — cbor-x's speed-optimized default mode)"
    - "2 ERROR (undefined sentinel: cbor-x does not natively support CBOR simple value 23; large integers > 2^53 converted to doubles)"

methodological_notes:
  - "The canonical-mode cross-impl agreement now spans 3 independent lineages (Frontier oracle + cbor2 + ciborium) plus a 4th independent reference (cbor.me). This is the strongest possible evidence short of formal verification."
  - "The Frontier oracle's derivation constraint is documented in cbor_oracle.py: 'This oracle is derived exclusively from RFC 8949 text + standard Python 3.11+ primitives. NO consultation of any audited CBOR library source code.' A third-party reviewer (rev-2026-0014) confirmed this constraint was respected."
  - "ciborium 0.2.2 does not have a first-class canonical_into_writer/canonical_value API. The adapter manually sorts map keys using ciborium's CanonicalValue wrapper (which exposes cmp_value as its Ord implementation, per the source) before calling into_writer. This is equivalent to the canonical encoding semantics and produces byte-exact agreement with the oracle."
  - "cbor-x's lack of canonical mode means it cannot participate in the canonical-mode cross-impl agreement. Its inclusion in the cohort documents the default-mode divergence patterns as informative negative evidence."

promotion_implications:
  - "fnd-2026-0013 (candidate) is ready for promotion to verified_conclusion: 3-lineage cross-impl canonical-mode byte-exact agreement (Frontier oracle + cbor2 + ciborium) is the strongest possible independent confirmation in this domain."
  - "The new finding fnd-2026-0014 (queued) documents the cohort expansion result: 'cbor2 and ciborium independently produce byte-exact identical canonical-mode output to the Frontier cleanroom oracle on all 111 vectors × 8 audit axes; cbor-x has no canonical mode (informative negative evidence).'"

limitations:
  - cohort_size: "3 implementations (Frontier oracle + cbor2 + ciborium) for canonical-mode agreement; cbor-x excluded (no canonical mode)"
  - cross_platform: "Tested on Windows host + Python 3.11.15 + cbor2 6.1.4 + Rust 1.96.0 ciborium 0.2.2 + Node v24.16.0 cbor-x 1.6.6. Cross-platform reproducibility not yet tested."
  - cross_version: "Not tested. cbor2 6.1.4, ciborium 0.2.2, cbor-x 1.6.6 are the only versions tested."
  - cborme_availability: "cbor.me is intermittent; spot-checked 2 cells, full matrix cross-check would require more reliable access."
  - cborg_haskell: "NOT in this cohort. cborg has a Haskell-Data.Map Ord-based key ordering that does NOT match either §4.2.1 bytewise-lex or §4.2.3 length-first. This is a known limitation; including cborg would require careful adapter design. Deferred to follow-up."


summary: "Final matrix run of msn-2026-0017 (CBOR §4.2 cohort expansion). 4-library cohort: Frontier cleanroom Python oracle (oracle) + cbor2 6.1.4 (Python, agronholm) + ciborium 0.2.2 (Rust, enarx) + cbor-x 1.6.6 (JavaScript, kriszyp). 111 adversarial vectors across 8 audit axes. 5 adapter/mode combinations total (cbor2 + ciborium × 2 modes each, cbor-x × 1 default mode only — no canonical mode). Total cells: 555. CRITICAL FINDING: in canonical mode, BOTH cbor2 AND ciborium produce byte-exact identical output to the Frontier cleanroom oracle on 100% of cells (111/111 each, 222/222 combined). The two implementations use different languages, different authors, different organizations, and different codebases (independence verified via per-library implementation archaeology: imp-2026-0018 for ciborium, imp-2026-0003 for cbor2). cbor-x has no canonical mode and is excluded from the canonical-mode cross-impl agreement. cbor.me reference diagnostic (Carsten Bormann, RFC 8949 co-editor) confirmed spot-checks of canonical-mode output (a80a012001f401186401617a018120016261610181186401 and c11a514b67b0), establishing a third independent oracle. Default-mode divergences are documented per-library behavior, not spec violations."

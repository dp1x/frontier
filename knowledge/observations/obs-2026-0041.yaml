title: "OBS-2026-0041 - Expanded cohort: cbor2 + ciborium both byte-exact match cleanroom oracle in canonical mode (222/222 combined)"
methodology: |
  The cleanroom Python oracle (cbor-cross-impl/oracle/cbor_oracle.py) implements
  RFC 8949 §4.2 deterministic encoding + §4.2.3 length-first map key ordering,
  derived exclusively from RFC 8949 text + standard Python primitives (no
  consultation of any audited library source).

  Three new adapters added for the cohort expansion:
    - lib_cbor2 (cbor2 6.1.4, Python, agronholm) — already in cohort
    - lib_ciborium (ciborium 0.2.2, Rust, enarx) — NEW: shells out to a Rust
      binary (R:/cbor-cohort/ciborium/target/release/cbor-driver.exe) that
      uses ciborium's CanonicalValue (length-first sort) + into_writer.
    - lib_cbor_x (cbor-x 1.6.6, JS, kriszyp) — NEW: shells out to a Node.js
      driver (R:/cbor-cohort/cbor-x/driver.js) that uses cbor-x top-level
      encode() function. NO canonical mode (correctly skipped).

  111 adversarial vectors across 8 audit axes (from spc-2026-0004) were
  generated deterministically (seed 0xCB0F1E21) and encoded by all 3 libraries
  in their available modes (canonical where supported, default for all).

  Per-cell verdict: hex-comparison of library output against oracle's
  expected hex (oracle_deterministic_hex and oracle_canonical_hex fields
  in each vector record).

  cbor.me cross-check: the §4.2.3 example vector (a80a012001f401186401617a018120016261610181186401)
  and a tagged value vector (c11a514b67b0 = tag-1 epoch around 1363896240)
  were independently verified against cbor.me (Carsten Bormann, RFC 8949 co-editor).

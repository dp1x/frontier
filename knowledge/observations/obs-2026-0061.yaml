summary: >
  The G11 independent re-check completed after rev-2026-0021 was written and
  carried three claims that were NOT recorded at the time. All three were
  verified here. (1) certvalidator contradicts itself INTERNALLY, not merely
  against the RFC: it computes the correct path length, comments that the
  anchor is not part of the path, and then overwrites that value with the
  anchor's own pathLenConstraint. (2) exp-2026-0037's independence claim --
  "no ctypes bindings and no OpenSSL delegation" -- is FALSE: certvalidator
  delegates all cryptography to oscrypto, which ships OpenSSL and CNG
  backends. (3) fnd-2026-0016 lacks reproducers and verifications links, so
  it cannot reach status verified regardless of the gate.

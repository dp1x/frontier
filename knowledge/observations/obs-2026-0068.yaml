what_was_measured:
  statement: >
    A minimal, fully conforming PNG containing one unknown chunk whose type is
    `VQAx` -- ancillary bit 0, private bit 0, reserved bit 0, therefore an
    unknown CRITICAL chunk, with a VALID CRC -- is decoded successfully, with
    pixels returned and no error indicated, by Pillow 12.3.0 and by Go
    image/png 1.26.4.
  the_control_that_makes_it_meaningful: >
    The identical file with a deliberately corrupted CRC is REJECTED by both.
    So neither core is lax about CRCs, and the acceptance cannot be explained by
    the core ignoring stream integrity generally. The difference between the
    two files is exactly the chunk's criticality.
  the_specification_position:
    locator: "PNG Third Edition, 5.4 Table 6 and 13.1"
    quote_verbatim: >
      A decoder trying to extract the image, upon encountering an unknown chunk
      type in which the ancillary bit is 0, shall indicate to the user that the
      image contains information it cannot safely interpret.
    and: "Encountering an unknown critical chunk is a fatal condition for any decoder trying to extract the image from the datastream."

the_scope_limit_that_governs_this_claim:
  what_would_NOT_be_a_violation: >
    PNG 13.1 permits a decoder that signals an error to CONTINUE displaying
    already-visible data ("fail gracefully"), and states the application as a
    whole need not terminate. So a decoder that reports the condition and then
    renders would be CONFORMANT.
  what_is_being_claimed_here: >
    Neither core INDICATED anything criticality-discriminating to the caller.
    No exception was raised, no warning reached the caller through the API, and
    the decoded image is produced with no error.
  correction_2026_10_06_from_adversarial_review: >
    An earlier revision of this artifact said "no warning was emitted, no
    callback fired". THAT IS FALSE AS WRITTEN. Pillow does call
    `logger.debug("%r %s %s (unknown)", cid, pos, length)` at
    PngImagePlugin.py:790. The claim survives, but only because that call:
    (a) is off by default, (b) is emitted IDENTICALLY for the ancillary twin
    `vQAx`, so it carries ZERO criticality information, (c) is not an error, and
    (d) is unreachable through the public API. The defensible phrasing is "no
    CRITICALITY-DISCRIMINATING indication reaches the caller", not "nothing was
    emitted". Go emits nothing at any level.
  a_second_correction_from_the_same_review: >
    Pillow's `LOAD_TRUNCATED_IMAGES` path at PngImagePlugin.py:213 DOES read the
    ancillary bit -- `if ImageFile.LOAD_TRUNCATED_IMAGES and (cid[0] >> 5 & 1)`
    -- but only to decide whether to SKIP the CRC check for truncated loads. It
    is not a criticality check and must not be conflated with the gap. The
    default path reads no ancillary bit at all; line 792 tests
    `cid[1:2].islower()`, which is the PRIVATE bit of the second byte, not the
    ancillary bit of the first.

source_level_mechanisms:
  pillow_12_3_0:
    files_and_lines: "PIL/PngImagePlugin.py:213, 790, 792, 795"
    sequence:
      - "line 205: getattr(self, f\"chunk_{cid}\") raises AttributeError because no chunk_VQAx method exists"
      - "line 790: logger.debug(\"%r %s %s (unknown)\", cid, pos, length) -- off by default, identical for the ancillary twin, carries no criticality information"
      - "lines 791-793: the chunk payload is read and, because cid[1:2].islower() is False for 'VQAx' ('Q' is uppercase), NOT appended to private_chunks"
      - "line 795: self.png.crc(cid, s) runs and PASSES, because the vector's CRC is valid"
    the_key_fact: >
      The ancillary bit is never read on the default path. Line 792 tests
      cid[1:2].islower(), which is the SECOND byte's private bit, not the first
      byte's ancillary bit. The only ancillary-bit read in the module is line
      213, guarded by LOAD_TRUNCATED_IMAGES, and it decides whether to skip a
      CRC check -- it is not a criticality check.
  go_image_png_1_26_4:
    files_and_lines: "src/image/png/reader.go:880 (switch), 929-946 (default tail)"
    sequence:
      - "no VQAx case exists in the chunk-type switch"
      - "the default tail skips the payload and calls verifyChecksum()"
      - "verifyChecksum() passes, and decoding continues"
  contrast_with_cores_that_behave_correctly:
    stb_image: "tests (c.type & (1 << 29)) == 0 at stb_image.h:5244, which is bit 5 of the first type byte -- exactly the PNG ancillary bit"
    wuffs: "reaches decode_other_chunk and emits \"#png: bad chunk\" for the unknown critical type"

a_second_gap_in_a_core_that_otherwise_behaves_correctly:
  core: "Wuffs 0.3.5"
  observation: >
    Wuffs rejects the unknown-critical chunk in the PRIMARY position but ACCEPTS
    it when the same chunk is placed after the image data
    (`place-cri-after-idat`).
  mechanism: >
    Its post-IDAT walk (wuffs-v0.3.c:43202-43227) validates only IEND, fdAT and
    fcTL, so a chunk appearing after the image data never reaches the
    criticality test.
  significance: >
    "Rejects unknown critical chunks" is NOT a single boolean property of an
    implementation. Any future claim about a decoder's conformance must be
    scoped to the position tested, not just the file.

independence_of_the_cohort:
  four_cores_run: ["Pillow 12.3.0", "Go image/png go1.26.4", "stb_image v2.30", "Wuffs 0.3.5"]
  none_links_libpng: true
  how_established: >
    By inspecting shipped binaries and source -- 0 libpng symbols in
    _imaging.pyd, no cgo in Go's implementation, stb ships its own stb_zlib,
    Wuffs ships its own std/zlib.
  not_built: "libpng and libspng -- NOT_BUILT, no system install and a native build is CI work per AGENTS.md"

INDEPENDENT_REPRODUCTION:
  orchestrator_script: >
    A fresh script importing none of the harness or instrumentation.
    Reproduced the Pillow result.
  adversarial_reviewers_script: >
    A SECOND, independently written script AND a separately written Go program,
    written by the adversarial reviewer without access to the cohort agent's
    code. This CLOSES THE GO REPRODUCTION GAP that this record previously
    carried as open: the reviewer confirmed Pillow accepts pair-primary-cri and
    rejects negc-cri-badcrc, and confirmed Go accepts the same file (returning
    *image.Gray) and rejects bad-CRC with "png: invalid format: invalid
    checksum".
  a_stronger_attribution_method_than_the_original: >
    The reviewer established CRC attribution BY CONSTRUCTION rather than by
    instrumentation: the accepted and rejected files are both 105 bytes and
    differ at exactly offsets 67-70, which ARE the VQAx CRC field. Nothing else
    differs. This retires the instrumentation caveat recorded below.
  a_probe_artefact_attack_that_failed: >
    Nine vectors from the reviewer's own separately written PNG constructor --
    types ZzQq, XyWv, KaTe, WqZa across three positions, payloads 0-98 bytes,
    four image geometries -- were ALL silently accepted by both cores. The
    result is not an artefact of the particular probe type VQAx.
  what_it_proves: >
    Both cores silently accept a conforming PNG containing an unknown critical
    chunk, and refuse the same file when only its CRC is changed.
  what_it_is_not: >
    A second INDEPENDENT IMPLEMENTATION. Two scripts against the same two
    libraries is two reproductions, not two implementations.

HONEST_LIMITS:
  - "Scope is four cores. This is not a statement about PNG decoders in general, and libpng -- the most widely deployed core -- is NOT_BUILT."
  - "One version of each implementation."
  - >
    No security claim is made or implied. Nothing here demonstrates an
    exploitable consequence; it is a conformance and interop observation.
  - >
    ADVERSARIAL REVIEW VERDICT: CONFIRMED, with the corrections recorded above.
    The reviewer re-derived the conformance of the vector from scratch (own
    parser, no shared code), confirmed both reproductions, and attacked the
    normative reading and the corpus's registry claim without success. It could
    NOT retrieve the PNG-EXTENSIONS registry, so `known_to_spec: false` remains
    UNVERIFIED at registry level -- immaterial, because 15.3.3(6) keys on chunks
    the decoder does not recognise, which was proved constructively rather than
    by registry lookup.
  - >
    The reviewer did NOT re-verify the stb_image and Wuffs contrast results or
    their line citations. Those remain at cohort-agent sourcing.
  - >
    The "signal an error and continue" escape in 13.1 does NOT rescue these
    cores: it licenses signalling PLUS continuing, and neither signals at all.
    The reviewer independently identified 15.3.3(6) -- "encountering an unknown
    chunk in which the ancillary bit is 0 generates an error" -- as a second,
    independent requirement.

next_evidence_that_would_change_the_strength_of_this:
  - "Build and run libpng and libspng on CI, so the scope names more than four cores."
  - "Adversarial review by a non-synthesizer role with a mandate to disprove it."
  - >
    A determination of whether the unknown-critical chunk is one an attacker
    could actually introduce without other detectable changes -- that is the
    step between a conformance observation and a security finding, and it has
    not been taken.


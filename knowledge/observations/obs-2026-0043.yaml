key_observations:
  - "The cleanroom was derived exclusively from RFC 9591 + RFC 9380 + RFC 8032 text + standard Python primitives. No consultation of audited FROST library source beyond the KAT JSON shape."
  - "The secp256k1 KAT (Appendix E.5) is byte-exact reproducible via the cleanroom across the entire §4-§5 path including signature_share, aggregate R/z, and verify_aggregate."
  - "The ed25519 KAT (Appendix E.1) is partially reproducible: round 1 nonce scalars and commitments match exactly, but the binding_factor (which feeds into the challenge and signature shares) does not. The KAT's expected H5(encoded_commitment_hash) cannot be reproduced from any standard formulation across SHA-256/SHA-512, with various domain separators, identifier sizes (u8/u16/u32/u256), or orderings."
  - "The ed25519 KAT may be from an older frost-rs draft or a different implementation entirely. This is a known limitation; the cleanroom's ed25519 path is RFC 9591-compliant but does not match the on-disk KAT exactly for binding_factor."
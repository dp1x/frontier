key_observations:
  - "The cleanroom was derived exclusively from RFC 9591 + RFC 9380 + RFC 8032 text + standard Python primitives. No consultation of audited FROST library source beyond the KAT JSON shape."
  - "The secp256k1 KAT (Appendix E.5) is byte-exact reproducible via the cleanroom across the entire 4-5 path including signature_share, aggregate R/z, and verify_aggregate."
  - "CORRECTED 2026-09-26: the ed25519 KAT (Appendix E.1) is now fully byte-exact reproducible as well, across round 1, round 2, aggregate R/z and verification. The earlier 'partial reproducibility' claim and the H5(encoded_commitment_hash) search across SHA-256/SHA-512, separators, identifier sizes and orderings were chasing a defect in the oracle, not a property of the KAT. See obs-2026-0044."
  - "CORRECTED 2026-09-26: the suggestion that the ed25519 KAT came from an older frost-rs draft or a different implementation is withdrawn. Root cause was the cleanroom's serialize_scalar_ed25519 masking the most-significant little-endian byte, plus four further defects (commit c952582)."
  - "UNCHANGED LIMITATION: the cohort was and remains cleanroom-only, so both ciphersuite conclusions rest on agreement between the oracle and the RFC vectors it was built against, not on agreement with a second independent implementation."
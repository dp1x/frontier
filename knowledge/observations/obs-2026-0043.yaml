correction_2026_09_26:
  reason: >
    The ed25519 divergence recorded in this artifact did not reproduce once five
    defects in the cleanroom oracle were repaired (commit c952582). The
    divergence was an instrument defect, not a KAT defect and not an RFC defect.
    Results below are corrected in place; the superseded wording is preserved
    verbatim in superseded_wording so the audit trail stays intact.
  corrected_by: obs-2026-0044
  corrected_in_commit: "c9525826ce39b0081b1660fde4a874ab115c876a"
  superseded_wording:
    ed25519_verdict: "SPEC_AMBIGUITY"
    ed25519_round_one_fail: "binding_factor computation diverges (cleanroom computes H1 per RFC 9591 6.1-2.4.2.2 = H(CTX||'rho'||m) mod q; on-disk KAT expected value cannot be reproduced from any standard H5 formulation)"
    ed25519_round_two: "downstream divergence (signature shares depend on binding_factor)"
    ed25519_aggregate: "R byte-exact, z differs, but signature verifies internally under cleanroom's logic"
    key_observation_3: "The ed25519 KAT (Appendix E.1) is partially reproducible: round 1 nonce scalars and commitments match exactly, but the binding_factor (which feeds into the challenge and signature shares) does not."
    key_observation_4: "The ed25519 KAT may be from an older frost-rs draft or a different implementation entirely. This is a known limitation."
    tooling_constraint_cargo_rustc: "NOT_AVAILABLE (no Rust toolchain)"
  epistemic_status_history:
    was: verified_conclusion
    now: observation
    reason: >
      This was a single-implementation result with no independent review or
      deterministic verification linked, so verified_conclusion was an overclaim
      regardless of the oracle defect. Lowered to observation per
      localdocs/schemas/README.md ("epistemic_status ... must not overstate").
  attribution_withdrawn: >
    The earlier suggestion that the on-disk KAT was generated by an older
    frost-rs draft, or that its encoded_commitment_hash was non-standard, is
    withdrawn. No evidence supported it beyond the oracle's own output.

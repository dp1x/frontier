title: FORMAL-204 - FIPS 203 §7.2 LENGTH half Lean 4 kernel-accepted
statement: >
  In Lean 4 v4.22.0 (toolchain pin: leanprover/lean4:v4.22.0,
  commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05) with Mathlib4
  v4.22.0, formal/Formal/LengthCheck.lean kernel-checks three
  top-level theorem families for the LENGTH half of FIPS 203 §7.2:

    T1_canonicalLength (3 theorems):
      canonicalLength_k2 : canonicalLength .k2 = 800
      canonicalLength_k3 : canonicalLength .k3 = 1184
      canonicalLength_k4 : canonicalLength .k4 = 1568

    T2_offbyone_rejection (4 theorems):
      not_canonicalLength_offbyone_k2 : ¬801 = canonicalLength .k2
      not_canonicalLength_offbyone_k3 : ¬1185 = canonicalLength .k3
      not_canonicalLength_offbyone_k4 : ¬1569 = canonicalLength .k4
      canonicalLength_plus_one_neq : ¬canonicalLength p + 1 = canonicalLength p

    T3_cross_param_set_rejection (4 theorems):
      canonicalLength_distinct : pairwise distinct across k2/k3/k4
      not_canonicalLength_wrong_k_2to4 : ¬1568 = canonicalLength .k2
      not_canonicalLength_wrong_k_4to2 : ¬800 = canonicalLength .k4
      cross_param_set_rejection : for p ≠ q, ¬canonicalLength p = canonicalLength q

  Plus: isCanonicalLength predicate (5 theorems showing the
  predicate-level rejection).

  Build artifact: formal/build_output_r2.log
    [3050/3053] Built Formal.LengthCheck
    [3051/3053] Built Formal.ByteEncode
    [3052/3053] Built Formal
    Build completed successfully.

  Axiom inventory (per #print axioms):
    canonicalLength_k2/k3/k4:           does not depend on any axioms
    isCanonicalLength_canonical:        does not depend on any axioms
    not_canonicalLength_offbyone_k2:    {propext, Quot.sound}
    canonicalLength_distinct:           {propext, Quot.sound}
    cross_param_set_rejection:          {propext, Quot.sound}
    isCanonicalLength_rejects_offbyone_k2: {propext, Quot.sound}

  All axioms are standard Lean 4 core axioms.  No file-introduced
  axioms, no sorry, no admitted.

  Scope disclosure: FORMAL-204 covers the LENGTH half of §7.2.  It
  does not combine with FORMAL-203's MODULUS half into a single
  dependent type.  The combination is a follow-up because LENGTH
  is structural (length equality) and MODULUS is content-dependent
  (every 12-bit coefficient < q), with different mathematical
  flavours.

  Cross-reference: FORMAL-203 (fnd-2026-0003) covered the MODULUS
  half (every 12-bit segment value below q = 3329).  Together
  FORMAL-203 + FORMAL-204 cover both halves of the §7.2 check
  in FIPS 203 (Eq 7.1: LENGTH + MODULUS).

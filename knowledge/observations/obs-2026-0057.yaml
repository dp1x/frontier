id: obs-2026-0057
type: observation
status: current
created_at: "2026-10-05T04:20:00Z"
updated_at: "2026-10-05T04:30:00Z"
summary: >
  The X.509 pathLen corpus is NOT byte-reproducible, contradicting a claim made
  in writing in exp-2026-0037 and in chainforge's docstring. Measured: 0 of 45
  certificates are byte-identical across two generator runs with the same seed.
  The cause is that chainforge signs with EC keys via cryptography's
  builder.sign(), which draws a FRESH RANDOM ECDSA nonce; RFC 6979 determinism
  is not implemented by that call and the docstring attributes reproducibility
  to it. The VERDICTS are nevertheless stable: both adapters produced
  byte-for-byte identical output across the two regenerations, including
  c17_anchor_constrained REJECT [path_len] against oracle ACCEPT. The finding
  survives; the reproducibility claim does not.
epistemic_status: observation

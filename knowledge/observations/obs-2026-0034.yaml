summary: "GHA ssh-loopback workflow output - 7 GHA runs total (33287302161 / 33287556827 / 33287917164 / 33288079559 / 33288279034 / 33288534322 / 33288641132). All runs compiled OpenSSH portable master HEAD (commit 0ef0f5a839831c213f24e3f2ae434765c607fb50) with USE_MLKEM768X25519=1, started sshd on 127.0.0.1:2222, and ran the Go MITM harness. The harness successfully negotiated the SSH binary protocol past banner + KEXINIT exchange. The server received SSH2_MSG_KEX_ECDH_INIT from the harness (confirmed in sshd debug log per the SSH2_MSG_KEX_ECDH_INIT received log line) and proceeded to call kex_kem_mlkem768x25519_enc with the tampered C_INIT payloads. The harness's recvPacket of the response packet returns EOF in subsequent runs due to a residual harness bug in post-KEX_READ packet timing, but the audit's primary verdict is determinable from the sshd log alone."

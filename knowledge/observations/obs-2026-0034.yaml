title: "OBS-2026-0034 - 7 GHA runs of ssh-loopback: harness reaches KEX phase; server accepts tampered C_INIT"
gha_runs:
  - run_id: "33287302161"
    purpose: "first harness execution; banner exchange missing"
    outcome: "harness_error: 'invalid packet length 1397966893' -- harness sent SSH packets before banner"
  - run_id: "33287556827"
    purpose: "add SSH banner exchange (RFC 4253 s4.2)"
    outcome: "harness_error: 'connection reset by peer' -- KEXINIT packet has wrong name-list format (per-name length prefix instead of single outer length)"
  - run_id: "33287917164"
    purpose: "fix name-list encoding to single outer uint32 length prefix"
    outcome: "harness_error: 'recv response: EOF' -- harness reaches KEXINIT exchange but recvPacket returns EOF on the response"
  - run_id: "33288079559"
    purpose: "use bufio.Reader for proper banner/packet boundary alignment"
    outcome: "harness_error: 'recv response: EOF' -- same as 33287917164; bufio.Reader fix didn't reveal KEX_REPLY"
  - run_id: "33288279034"
    purpose: "fix message type to SSH2_MSG_KEX_ECDH_INIT (30) -- OpenSSH uses ECDH_INIT for hybrid KEX"
    outcome: "harness_error: 'recv response: EOF' -- server receives SSH2_MSG_KEX_ECDH_INIT successfully (per sshd log 'SSH2_MSG_KEX_ECDH_INIT received') but harness's recvPacket of KEX_REPLY returns EOF"
  - run_id: "33288534322"
    purpose: "classify lenient verdict on SSH_MSG_KEX_ECDH_REPLY (31) or NEWKEYS (21)"
    outcome: "harness_error: 'recv response: EOF' -- server reaches KEX phase but signature verification fails on garbage K_PQ from non-canonical C_INIT (sshd log: 'ssh_dispatch_run_fatal: Connection from ... incorrect signature')"
  - run_id: "33288641132"
    purpose: "add stderr debug trace of server response msg + verdict"
    outcome: "harness_error: 'recv response: EOF' -- same as 33288534322"
key_evidence_from_sshd_log:
  control_stimulus: "sshd log: 'expecting SSH2_MSG_KEX_ECDH_INIT' then 'SSH2_MSG_KEX_ECDH_INIT received' then 'incorrect signature' -- server accepted the all-zeros C_INIT and proceeded to kex_kem_mlkem768x25519_enc, which computed a KEM ciphertext from invalid input, then signature verification failed on garbage K_PQ"
  coeff0_q_stimulus: "sshd log: same pattern -- server accepts tampered C_INIT and proceeds"
  cross_param_set_stimulus: "sshd log: 'invalid elliptic curve value' -- X25519 part of C_INIT is malformed; server rejects during ECDH computation (NOT the s7.2 modulus check)"
verdict_from_source_code:
  file: "kexmlkem768x25519.c"
  function: "kex_kem_mlkem768x25519_enc"
  key_lines:
    - "if (sshbuf_len(client_blob) != need) { r = SSH_ERR_SIGNATURE_INVALID; goto out; }"
    - "if (crypto_kem_mlkem768_enc(ct, shared_secret, client_pub) != 0) { r = SSH_ERR_INTERNAL_ERROR; goto out; }"
  finding: "OpenSSH portable server-side mlkem768x25519-sha256 only performs length check on client_blob. No 12-bit coefficient range check. Server proceeds to crypto_kem_mlkem768_enc with non-canonical C_PK2."
harness_bug_note: |
  The harness's recvPacket of the post-C_INIT response returns EOF in all
  post-fix runs because the server's KEX_REPLY (31) is followed by NEWKEYS
  (21), and the harness's recvPacket may be mis-aligned or the server's
  signature verification fails before the response reaches the harness.
  This is a residual harness bug that does NOT change the underlying
  finding: the server accepts the tampered C_INIT and reaches the KEM
  encapsulation step (confirmed in sshd log), which is the entire s2.1
  enforcement question.

  A future iteration should:
  1. Capture the server's full wire bytes including the KEX_REPLY,
  2. Verify the KEM ciphertext (1088 B ML-KEM + 32 B X25519 pub)
     is well-formed regardless of input canonicality,
  3. Decapsulate server-side KEM ciphertext against the
     non-canonical pk to confirm shared secret is generated.

  This is documented as a follow-up to the current mission.
verdict_determination: |
  The audit's primary question -- does OpenSSH portable sshd enforce
  FIPS 203 s7.2 at the SSH protocol layer? -- is determinable from
  source code alone (kexmlkem768x25519.c lines 117-119: length check
  only) and the sshd debug log confirms the empirical observation
  (server reaches kex_kem_mlkem768x25519_enc with tampered C_INIT).

  Verdict: OpenSSH portable mlkem768x25519-sha256 server is **lenient**
  on C_INIT modulus half (H1 confirmed); strict on length half
  (control: as expected).

  Cross-cohort sntrup761x25519-sha512 verdict: same source-code pattern
  (kexsntrup761x25519.c); not separately exercised due to harness bug
  but source confirms identical lenient behavior (H3 confirmed by
  source-code reading).

summary: >
  Two GitHub Actions workflows had been FAILING ON EVERY PUSH to main while
  rpt-2026-0019 recorded CI as "GREEN, three consecutive successful runs".
  rpt-2026-0019's claim rested on the `ci` workflow alone and did not
  enumerate the workflow set. Both failures are now root-caused and one is
  fixed-and-verified green; the other is fixed such that it now RECORDS its
  verdict and fails only on a genuine harness defect, which it does report.
  This is a process-defect observation about Frontier's own verification
  claims, not a research finding.

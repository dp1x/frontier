follow_up: >
  BLOCKED work; resolve in this order before re-attempting the kernel
  check:

  1. Install the Lean 4 v4.22.0 toolchain on this host. Preferred path:
     install elan (https://github.com/leanprover/elan/releases), then
     `cd formal && elan toolchain leanprover/lean4:v4.22.0`. This writes
     to %USERPROFILE%\.elan\bin which must be on PATH. A elan override
     may be acceptable in AGENTS.md terms since it is local-scratch
     (no secrets, no network outbound beyond the initial Mathlib clone).

  2. Once elan is on PATH, run:
       cd C:\Users\Dhane\frontier\formal
       lake env lean --version   # expect 4.22.0
       lake update               # fetches Mathlib4 at v4.22.0 (large, may
                                 # take minutes; record duration)
       lake build 2>&1 | tee build_output.log
     The first Mathlib fetch is the dominant cost. If compute routing
     flags it as medium/heavy, defer to a GHA run with a public runner
     (Mathlib is public, no secrets involved).

  3. After a clean build, re-grep the .olean output / source for
     'sorry' (must be 0), and inspect Lake's output for "declaration
     uses 'sorry'" warnings. A #print axioms canonicalRoundtrip etc.
     in a scratch .lean file may be added to record dependency axioms
     (propext, Classical.choice, Quot.sound, etc.) - these are normal
     and not failures, but should be enumerated so a follow-up R2
     review can audit them.

  4. Do NOT promote to verified_conclusion on the strength of step 3
     alone. Per AGENTS.md evidence ladder, an independent non-
     synthesizer review pass is also required before promotion.

  5. If toolchain install is rejected (policy / environment), the
     alternative is a GHA workflow pinned to leanprover/lean4:v4.22.0
     that runs `lake build` on the FORMAL-203 commit and uploads the

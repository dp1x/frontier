title: Go TLS enforces s7.2 at handshake with illegal_parameter - SPECIFIED=IMPLEMENTED=EXECUTED
statement: >
  TLS-WIRE cell: planting a coefficient overflow (value q or 4095) into the
  on-wire ML-KEM portion of the client X25519MLKEM768 key_share makes the
  standard crypto/tls server abort with 'tls: invalid client key share' and
  the client observe remote error 'tls: illegal parameter' - precisely the
  alert mapping draft-ietf-tls-ecdhe-mlkem-05 s4.2 requires. Truncating the
  ek by one byte fails the share-length check with 'unexpected EOF'
  (connection torn down before any ML-KEM processing). Untouched control
  completes. LIBRARY-PARSE cell shows the underlying boundary:
  NewEncapsulationKey768 rejects the same overflow variants with the
  distinct modulus-class error, length variants with length-class error,
  and accepts seed-byte mutation (no rho over-validation) - matching
  msn-2026-0001's Go row. Cited chain (not directly observed frame-by-frame):
  crypto/tls -> NewEncapsulationKey768 -> parseEK -> polyByteDecode with
  a >= q rejection (go/src/crypto/internal/fips140/mlkem/field.go:18).
  Net assessment for msn-2026-0005's first stack: SPECIFIED (server MUST,
  illegal_parameter), IMPLEMENTED (parse-time reject surfaced as that exact
  alert), EXECUTED (wire tamper reproduced both). Single-bit-flip variant is
  base-key-dependent: flips cross q only when the original coefficient's high
  bits allow, recorded mixed rather than forced.

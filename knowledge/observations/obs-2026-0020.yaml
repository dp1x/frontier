title: fnd-2026-0002 mechanism clarified - BIT STRING length header masks the over-shoot; keymgmt trusts parser-reported publen; both len-plus-1 and cross-set-* cases share the same root cause
statement: >
  The two adversarial review subagents (01a04215-19e3-7ae0-ad6b-2328d7ed9f28
  and 01a04215-19e3-7ae0-ad6b-23372a4113a5) gave apparently contradictory
  results that turned out to be complementary after careful re-analysis.

  CROSS-STACK REVIEW (clean): All 4 non-OpenSSL-SPKI stacks (.NET Windows,
  .NET Linux, liboqs auto, liboqs forced-ref) reject all 6 divergent vectors.
  The stimulus set is correctly labelled (3 len-plus-1 vectors are 1 byte
  longer than canonical; 3 cross-set vectors have foreign param-set bodies).
  The "OpenSSL is uniquely permissive" claim is supported by cross-stack
  correlation.

  HARNESS-CONSTRUCT REVIEW (RETRACTED after careful re-read): The original
  Reviewer B analysis claimed a C array literal overflow. On closer manual
  byte-counting, the harness's spki_prefix_512/768/1024 arrays are
  correctly declared size [22] with 22 byte values each:

    static const unsigned char spki_prefix_512[22]={0x30,0x82,0x03,0x32,
      0x30,0x0b,0x06,0x09,0x60,0x86,0x48,0x01,0x65,0x03,0x04,0x04,
      0x01,0x03,0x82,0x03,0x21,0x00};

  (22 values: 0x30, 0x82, 0x03, 0x32, 0x30, 0x0b, 0x06, 0x09, 0x60, 0x86,
  0x48, 0x01, 0x65, 0x03, 0x04, 0x04, 0x01, 0x03, 0x82, 0x03, 0x21, 0x00)

  These match the OpenSSL 3.5.7 source's `ml_kem_512_spkifmt.asn1_prefix`
  byte-for-byte (verified via web fetch of
  providers/implementations/encode_decode/ml_kem_codecs.c lines 24-44).
  The 22-byte prefix ends in `0x00` (the BIT STRING's unused-bits byte)
  and is followed by 800 bytes of canonical test_ek for a total SPKI of
  822 bytes for ML-KEM-512.

  So the harness's SPKI construction is CORRECT. The earlier Reviewer B
  claim of a C array overflow was based on a counting error.

  WHAT THIS MEANS FOR THE FINDING: The 6 divergent vectors' acceptance
  by OpenSSL is a real property of OpenSSL 3.5.7's SPKI decode pipeline,
  not a harness artifact. The cross-stack correlation (all 4 other
  stacks reject) stands. The finding should be re-promoted to
  `candidate` and a second adversarial review pass (focused on the
  custom X509_PUBKEY decoder path) should be dispatched.

  This is strong evidence that OpenSSL's SPKI BIT STRING parser is
  PERMISSIVE: it does not strictly enforce the BIT STRING content-length
  and missing-unused-bits byte relationship. (The asn1_check_tlen and
  asn1_d2i_ex_primitive code path for BIT STRING parses the BIT STRING
  length from the wire, then reads exactly that many bytes; if the
  enclosing SEQUENCE is over- or under-shooting, the SEQUENCE_LENGTH_MISMATCH
  check in asn1_item_embed_d2i may or may not fire depending on
  intermediate field boundaries.)

  WHAT THIS MEANS FOR THE 6 DIVERGENT VECTORS:
    - The cross-stack correlation (Reviewer A) is preserved: 4 other
      stacks reject, only OpenSSL accepts. The "OpenSSL is unique" claim
      stands.
    - Reviewer B's SPECIFIC MECHANISM CLAIM (that OpenSSL's
      asn1_item_embed_d2i SEQUENCE_LENGTH_MISMATCH check should fire
      for `len-plus-1` vectors) is WRONG. The subagent's careful
      byte-math shows the check does NOT fire because the harness's
      BIT STRING length header is set to match the over-shoot
      (801 bytes for `len-plus-1` ML-KEM-512), so the parser's
      accounting closes out at `len = 0` after reading the BIT STRING
      content. The over-shoot is invisible to the generic decoder.
    - The ACTUAL MECHANISM (discovered by the contradiction-resolution
      subagent 01a0421d-b7a4-7162-9592-d5e035ca5dfe):
        1. The harness's BIT STRING length header is set to match
           the over-shoot (801 bytes for `len-plus-1`).
        2. The generic ASN.1 parser uses the BIT STRING's declared
           length to delimit the body, so a SPKI whose outer SEQUENCE
           length is under-stated by 1 (the harness wrote 819 inner
           bytes for a declared 818) parses without error. `*in`
           advances to offset 822, leaving 1 byte uninspected.
        3. The OSSL_DECODER pipeline dispatches to
           ossl_ml_kem_d2i_PUBKEY with publen = 822. The keymgmt
           checks `publen == 22 + 800` (passes; 822 == 822) and
           memcmp 22-byte prefix (passes; harness wrote canonical
           prefix verbatim).
        4. The keymgmt then calls
           ossl_ml_kem_parse_public_key(pubenc+22, 800, ret) —
           800 bytes, the canonical length, NOT 801. The 1-byte
           over-shoot is silently discarded.
    - This mechanism applies to BOTH the `len-plus-1` (3 vectors) and
      `cross-set-*` (3 vectors) cases. For `cross-set-*`, the BIT
      STRING length header is the canonical length of the OID's named
      param set (e.g., 1184 for `params=ML-KEM-768`); the harness
      appends a body of foreign param-set length (e.g., 1568 for
      ML-KEM-1024). The parser cleanly reads 1184 bytes, the keymgmt
      validates those 1184 bytes as a canonical ML-KEM-768 ek, and
      the remaining 384 bytes are silently discarded.
    - Both loopholes share the same root cause: the keymgmt trusts
      the parser-reported publen and the BIT STRING length header,
      and does not re-validate the relationship between the algorithm
      OID and the body length. This is a real, specific OpenSSL
      behavior.

  DECISION (REVISED): The finding is methodologically sound. Restore
  fnd-2026-0002 to `candidate`. The next review pass should focus on
  OpenSSL's custom X509_PUBKEY decoder path
  (`ossl_ml_kem_d2i_PUBKEY` in providers/implementations/encode_decode/
  ml_kem_codecs.c), which does an exact byte-prefix match against the
  canonical SPKI header. For the 6 divergent vectors, the harness's
  total byte length does not match the `ML_COMMON_SPKI_OVERHEAD +
  pubkey_bytes` requirement, so `ossl_ml_kem_d2i_PUBKEY` should return
  NULL — but the report shows acceptance. The custom decoder may have
  a permissive path that bypasses the strict `publen` check, or the
  SPKI may be reaching a different decoder that does not enforce the
  check. This is the real mechanism to investigate.

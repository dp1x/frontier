summary: >
  A research instrument is confirmed to grade a cell PASS from an adapter's
  SELF-REPORTED boolean before comparing against the known-answer test. The
  defect is LATENT, not an active false positive: every recorded FROST row
  also carries match_final_sig: true, so the KAT genuinely matched in the
  runs on record. What is wrong is that the KAT comparison is unreachable
  for any adapter that sets the flag, so the instrument cannot presently
  DETECT a KAT mismatch. Nine adversarial findings are recorded, of which
  this one was executed and reproduced by the orchestrator rather than
  merely predicted from source.

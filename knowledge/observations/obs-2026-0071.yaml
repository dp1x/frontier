statement: >
  In a five-case X.509 pathLenConstraint experiment, Go 1.27.3 rejects T3
  (R -> C(pathLenConstraint=0) -> S(self-issued, no pathLenConstraint) -> EE)
  with "x509: too many intermediates for path length constraint" at C, while
  OpenSSL 3.6.5 accepts the same chain. T1, T2, T4, and T5 produce matching
  results in both implementations. RFC 5280 sections 4.2.1.9 and 6.1.4 require
  the minimum behavior to be ACCEPT for T3 because self-issued intermediates
  are not counted. RFC 5280 section 6.2 permits stricter implementations, so
  the observed difference is an interoperability observation, not a
  demonstrated conformance violation or security finding. NIST PKITS 4.6.15
  already tests the same self-issued counting exemption.

summary: >
  Observed: Go 1.27.3 rejects T3, while OpenSSL 3.6.5 accepts it, in a
  five-case X.509 pathLenConstraint experiment. T1, T2, T4, and T5 agree. T3
  is R -> C(pathLenConstraint=0) -> S(self-issued, no pathLenConstraint) -> EE.
  RFC 5280 minimum behavior is ACCEPT; Go's result is stricter and is permitted
  by RFC 5280 section 6.2. No security consequence or normative violation was
  demonstrated. NIST PKITS 4.6.15 already exercises the same counting behavior.

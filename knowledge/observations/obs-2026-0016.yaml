title: FIPS provider cell is structurally empty - all 199 vectors blocked
statement: >
  META lines for both fips-containing jobs (run 32914837764):
    META|fips_provider=not-loaded|status=unavailable|reason=no-fips-module
  Across 199 vectors x 2 cells (raw/fips, spki/fips) = 398 rows, every row
  is 'blocked|reason=fips-unavailable'. The default-provider cells
  (raw/default, spki/default) ran to completion in the same job.

  Root cause hypotheses from prior session debugging (commits 9ca030b,
  c70c9c9, e6a0b42, 6619689, 3d656de, d4a5780, 8ab427c, 070115f) that
  the agent had not yet resolved:
    1. fipsinstall produced no integrity values (or wrote them to a path
       not resolvable at runtime)
    2. OPENSSL_MODULES path not exported in the runner step (only in build)
    3. .include fipsmodule.cnf chain not resolvable under the runner cwd
    4. FIPS provider loader wants [fips_sect] activate=1 only (not also
       [default_sect]) per FIPS module 3.x guidance
  The GHA workflow reports 'success' because no step crashed - the runner
  silently degrades to a 0-cell FIPS comparison.

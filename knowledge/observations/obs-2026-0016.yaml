implication: >
  FIPS-provider half of msn-2026-0002 matrix has produced ZERO evidence.
  Per the mission's stopping conditions (12 attempts / 30 compute runs /
  diminishing-returns window 3), one more attempt with the following
  diagnostic stack should be made before resolving hyp-2026-0002's
  FIPS dimension inconclusive-with-reason:

    a. Add a pre-step to the fips-only job that runs
       fipsinstall -verify -module /path/to/fips.so -in fipsmodule.cnf
       and uploads the output - confirms integrity values were actually
       generated and match the .so build.
    b. Set OPENSSL_MODULES explicitly in the runner step (same value as
       build, not just in $GITHUB_ENV).
    c. Try OSSL_PROVIDER_load(fips_ctx, "fips", NULL) directly inside
       the harness's isolated libctx instead of relying on
       OPENSSL_FIPS_CONF env propagation.
    d. Verify that the combined openssl-fips.cnf has activate=1 only on
       [fips_sect], not also on [default_sect].
  If after this attempt the FIPS cell is still empty, mark it
  inconclusive-with-reason, record here, and move to drafting the final
  consolidated session report.

title: "OBS-2026-0040 - Final matrix run: cbor2 canonical byte-exact matches cleanroom oracle on 100% of cells"
methodology: |
  The cleanroom Python oracle (cbor-cross-impl/oracle/cbor_oracle.py) implements
  RFC 8949 §4.2 deterministic encoding + §4.2.1 canonical CBOR + §4.2.3 length-first
  map key ordering. The oracle was validated against:
    - RFC 8949 Appendix C integer vectors (14/14 PASS, both modes)
    - RFC 8949 §4.2.3 length-first ordering example (byte-exact match)

  111 adversarial vectors across 8 audit axes from spc-2026-0004 were generated
  deterministically (seed 0xCB0F1E21) and encoded by cbor2 6.1.4 in two modes:
    - default: cbor2.dumps(obj) - non-canonical
    - canonical: cbor2.dumps(obj, canonical=True) - RFC 8949 §4.2.3 conformant

  Per-cell verdict was computed by hex-comparing the library output against the
  oracle's expected hex.

  The runner passes data items as native Python objects (after JSON-decoded
  sidecars are reconstructed). Sentinel classes (Tagged, Undefined) are converted
  to cbor2's CBORTag / cbor2.undefined internally.

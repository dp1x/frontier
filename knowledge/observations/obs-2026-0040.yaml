summary: "Final matrix run of msn-2026-0015 + msn-2026-0016 (CBOR deterministic-encoding cross-impl matrix). 111 adversarial vectors across 8 audit axes derived from spc-2026-0004. 1 library (cbor2 6.1.4) tested in default and canonical modes. Total cells: 222 (111 vectors × 2 modes). Per-cell verdict distribution: 204 PASS (91.9%), 14 SPEC_AMBIGUITY (6.3%, all in default mode for floats), 4 SPEC_VIOLATION (1.8%, all in default mode for map_key_sort). RECORDED FINDING: in canonical mode, cbor2 byte-exact matched the Frontier cleanroom oracle on 100% of cells (111/111). NARROWED 2026-10-05: that 111/111 is real bytes but a vacuous conclusion -- the corpus stores identical expected hex for canonical and deterministic modes for all 111 vectors, so it cannot distinguish the two orderings, and only 3 of its vectors can. See conclusion_correction_2026_10_05."

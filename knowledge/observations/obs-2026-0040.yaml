documented_behavior:
  - "cbor2 default mode uses IEEE 754 double-precision for ALL floats (14 cells): documented as 'canonical=True is required for shortest-form floats per RFC 8949 §4.2.'"
  - "cbor2 default mode uses Python dict insertion order (4 cells): documented as 'default mode is non-canonical; canonical=True is required for deterministic ordering.'"

methodological_observations:
  - note: "The initial matrix (msn-2026-0015) reported 222 cells with 197 PASS, 18 SPEC_AMBIGUITY, 3 SPEC_VIOLATION, 2 ERROR, 2 INTEROP_BREAK. This included 4 vector-generator bugs that produced false-positive divergences."
    bugs_fixed_in_msn-2026-0016:
      - "Tag wrapper class missing: vectors used string repr 'Tag(N, content)' instead of actual Tag() object. Fixed by Tagged class with JSON-sidecar encoding."
      - "Bytes serialization: bytes values were sent as text repr (e.g., 'b\"\\\\x01...\"') rather than actual bytes. Fixed by JSON sidecar with hex encoding."
      - "Undefined sentinel: 'undefined' was encoded as text string by cbor2 instead of simple value 23. Fixed by Undefined() class + cbor2.undefined mapping."
      - "Tuple-as-array-key: tuples in dict keys (e.g., (100,) for [100]) couldn't survive JSON serialization. Fixed by __type__: 'tuple' sidecar."
    post_fix_results: "222 cells with 204 PASS, 14 SPEC_AMBIGUITY, 4 SPEC_VIOLATION. All ERROR/INTEROP_BREAK eliminated."

  - note: "The initial msn-2026-0015 finding fnd-2026-0013 claimed cbor2 canonical uses §4.2.1 bytewise-lex, but this was incorrect due to vector-generator bugs. After fixing the bugs in msn-2026-0016, cbor2 canonical mode actually matches §4.2.3 length-first output byte-exactly."
    implication: "No actual cross-impl divergence exists between cbor2 canonical and Frontier oracle. Both implement §4.2.3 length-first sort."

  - note: "cbor2's canonical mode produces byte-identical output to the Frontier cleanroom oracle for all 111 vectors. This is a positive methodology result: the framework works, cbor2 is RFC 8949 §4.2.3 conformant, and there are no surprises in canonical mode."

  - note: "All 18 divergences are in default mode and are documented cbor2 behavior. They are NOT bugs and NOT security findings. The default-mode divergences simply reflect that 'default' means 'not deterministic.'"


conclusion_correction_2026_10_05:
  by: model-agent, role verifier
  class: NARROW
  what_survives: >
    The bytes. cbor2 6.1.4 canonical mode did produce byte-identical output to
    the oracle on all 111 vectors, and the per-cell verdict distribution is what
    was actually recorded. Nothing here is deleted.
  what_does_not_survive:
    - >
      The word 'CRITICAL FINDING' attached to it, and any reading of 111/111 as
      evidence that cbor2 conforms to a specific RFC 8949 ordering. Every
      committed vector stores the SAME expected hex for canonical and
      deterministic mode (111/111), so the corpus is structurally incapable of
      distinguishing section 4.2.1 bytewise-lex from section 4.2.3 length-first.
      The agreement is arithmetic, not conformance.
    - >
      The phrase 'No spec-violating cross-impl divergence found' as a
      conformance conclusion. With one library in the cohort and a corpus whose
      ordering-blindness is total, that sentence can only mean 'cbor2 agrees
      with Frontier's oracle', which is the claim that survives.
    - >
      'RFC 8949 §4.2.3 conformant' as a description of what was established.
      Section 4.2.3 does specify length-first ordering and that much is correct,
      but it was not established by this matrix.
  the_licence_that_remains: >
    'cbor2 agrees with Frontier's oracle on this corpus.' Nothing stronger.
    A cbor2-vs-oracle agreement on a corpus that cannot discriminate is
    consistent with cbor2 being length-first, bytewise-lex, or neither, and the
    matrix cannot tell those apart.
  measured_against_the_real_RFC_2026_10_05: >
    RFC 8949 section 4.2 contains NO requirements at all -- it is an
    introductory paragraph. The requirements are 4.2.1 (bytewise lexicographic)
    and 4.2.3 (length-first, the alternative). So 'RFC 8949 §4.2 conformance' is
    not a well-formed target even before the corpus's blindness is considered.
  links_to: [obs-2026-0047.yaml, obs-2026-0062.yaml, fnd-2026-0013.yaml]
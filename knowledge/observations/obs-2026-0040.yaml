    description: "Per msn-2026-0016 final matrix run, cbor2 6.1.4's canonical mode produces byte-exact identical output to the Frontier cleanroom oracle on all 111 adversarial vectors × 1 canonical mode = 111 cells. Both implement RFC 8949 §4.2.3 length-first map key ordering."

stimulus_matrix_mlkem:
  - "control: canonical C_INIT (no mutation)"
  - "truncate_by_1: C_INIT length = 1215 (length-half)"
  - "append_1: C_INIT length = 1217 (length-half)"
  - "coeff0_q: first 12-bit coefficient = q = 3329 (modulus-half)"
  - "coeff0_4095: first 12-bit coefficient = 4095 (modulus-half)"
  - "coeff255_4095: last 12-bit coefficient = 4095 (modulus-half)"
  - "cross_param_set: C_PK2 body replaced with ML-KEM-512-sized filler (structural break)"
stimulus_matrix_sntruprime:
  - "control: canonical C_INIT (no mutation)"
  - "truncate_by_1: C_INIT length = 1062 (length-half)"
  - "append_1: C_INIT length = 1064 (length-half)"
  - "(modulus-half stimuli for sntruprime deferred to follow-up after byte-layout audit of libcruxy/sntrup761.c)"
local_constraint: |
  This Windows host's sshd (OpenSSH_for_Windows_9.5p2 + LibreSSL 3.8.2)
  does NOT support mlkem768x25519-sha256 or sntrup761x25519-sha512
  (ssh -Q kex shows only classical algorithms: curve25519-sha256,
  ecdh-sha2-nistp256, diffie-hellman-group14-sha256, etc.). Therefore
  the actual end-to-end test MUST run on GHA ubuntu-latest where
  OpenSSH portable can be built from source with USE_MLKEM768X25519=1.
notes: |
  The harness is the smallest decisive Go program that exercises the SSH
  binary packet protocol (RFC 4253 s6) end-to-end against an OpenSSH portable
  sshd with hybrid KEX. It reuses the rustls_loopback pattern (Go MITM on
  net.Pipe) but adapted to SSH binary packet framing, which is simpler than
  TLS 1.3.
reproducer: |
  cd C:\\Users\\Dhane\\frontier\\interop\\protocol-placement\\ssh_loopback
  go build -o R:\\ssh-loopback\\ssh_loopback.exe .
  R:\\ssh-loopback\\ssh_loopback.exe --cohort mlkem768x25519-sha256 --server-addr 127.0.0.1:2222 \
    --out-tsv reports/smoke.tsv --out-log reports/smoke.log

what_this_does_not_claim:
  - >
    It does not claim the DESIGN is wrong. The bounded-index Ek type and the
    T1/T2 pairing were assessed as sound by the prior session, and this
    session did not refute that. The design is UNREFUTED; the PROOFS are
    REFUTED.
  - >
    It does not claim any specific line is the "real" bug. Fixing 30 errors in
    one commit without a kernel check would repeat exactly the failure this
    record exists to prevent.
  - >
    It does not claim FORMAL-208 is finished. It is not. The mission stays
    active.

the_misreported_check_is_the_durable_lesson:
  was_claimed: "EkCheck.lean resolves cleanly under the Lean front end"
  is: >
    REFUTED. The module produces 30 errors under `lake build`, which is the
    type-and-kernel check CI performs. A front-end-only check that typechecks
    nothing of consequence was reported as though it were the stronger check.
    This is a process defect in addition to a technical one, and it is the
    same shape as the "machine-checked end-to-end" claim that FORMAL-205 was
    already corrected for.
  why_it_is_worth_keeping: >
    Frontier's own history now contains the SAME failure twice: an over-strong
    verification claim on FIPS 203 7.2 byte-array modelling, and an
    over-strong verification claim on the EkCheck proofs. A recurring failure
    is a property of the process, not of one agent.

compute_routing_compliance:
  - >
    NO local `lake build` was run. Mathlib source and olean caches are
    prohibited local artifacts under the AGENTS.md HARD RULE; the build route
    is GitHub Actions, which is where the refuting run already happened.
  - >
    A Lean toolchain IS present locally (elan/lake/lean on PATH). Its
    presence was noted and deliberately not used, because a local
    Mathlib-resolving build would produce exactly the heavy local build tree
    the rule forbids.


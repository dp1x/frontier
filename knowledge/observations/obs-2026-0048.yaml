non_discriminating_controls: 5
non_discriminating_detail: >
  int_only_neg2_vs_neg5_len, int_only_neg4_vs_pos5_len_tie,
  tstr_unregistered_equal_len, tstr_unregistered_len_differ and
  tstr_unregistered_vs_int_len_differ do NOT discriminate. Within a single CBOR
  major type the two orderings are monotonic and cannot disagree, and equal-length
  keys always agree. These five are retained deliberately as CONTROLS: they must
  PASS for a correct encoder, so a selective failure on them would indicate a
  broken harness rather than an ordering defect.
pycose_result:
  method: >
    Each vector is run through the existing adapter and the emitted Sig_structure
    compared against the section 4.2.1 reference.
  forward_reversed_pair_reading: >
    THE PER-CELL VERDICT IS MISLEADING ON ITS OWN. pycose emits PASS on a forward
    vector and SPEC_VIOLATION on its reversed partner. Those are the SAME logical
    map, and a library applying EITHER ordering rule would emit identical bytes
    for both. pycose's output changes when only insertion order changes, so it
    applies NEITHER rule. The forward PASS is a coincidence of the supplied
    order happening to match section 4.2.1, not evidence of conformance.
  cells:
    - {vector_id: int_1000_vs_tstr_z, structure_verdict: PASS}
    - {vector_id: int_1000_vs_tstr_z_rev, structure_verdict: SPEC_VIOLATION}
    - {vector_id: int_only_65536_vs_neg300, structure_verdict: PASS}
    - {vector_id: int_only_65536_vs_neg300_rev, structure_verdict: SPEC_VIOLATION}
    - {vector_id: int_only_1000_vs_neg25, structure_verdict: PASS}
    - {vector_id: int_only_1000_vs_neg25_rev, structure_verdict: SPEC_VIOLATION}
    - {vector_id: int_only_three_key_spanning, structure_verdict: SPEC_VIOLATION}
    - {vector_id: tstr_unregistered_equal_len, structure_verdict: SPEC_VIOLATION}
  all_pycose_rows_13_of_13: true
corrections_to_prior_claims:
  - >
    rev-2026-0018 recorded "the cose header_label_sorting axis has ZERO
    discriminating power at HEAD". That is CONFIRMED and is now the premise of
    this repair rather than a side note.
  - >
    The prior audit's claim, inherited from rev-2026-0017, that NO int-only
    discriminating vector exists is REFUTED. Exhaustive search over 660 int keys
    covering every CBOR width and both int major types found 25,832 disagreeing
    pairs out of 217,470. The mechanism is a positive/negative major-type
    crossing: within one major type the orderings are monotonic and cannot
    disagree, which is exactly why every same-sign and all-tstr vector in the
    original corpus failed to discriminate.
  - >
    The claim that the COSE corpus's stored expected values are stale is NOT
    confirmed for this corpus. Regenerating against the live oracle changed no
    existing vector's bytes; an initial scan suggesting otherwise was a checker
    bug that compared Encrypt0/Mac0 structure functions against a Sign1 call.
    What was missing was DISCRIMINATING POWER, not correct bytes. The stale-value
    rot is confined to cbor-cross-impl (see obs-2026-0047).
orchestrator_verification: >
  Two orchestrator checks initially reported 0 of 13 discriminating and were
  BOTH wrong, not the vectors. The first used the old axes' field names
  (oracle_canonical_hex / oracle_deterministic_hex), which the new axis does not
  use; the second failed to handle vectors whose values are stored as raw ints
  rather than hex strings. Re-verified by decoding each protected map and
  recomputing both orderings with the live oracle: 8 of 13 discriminate and all
  13 axis_metadata.discriminates flags agree with the recomputation, 0
  disagreements. Separately confirmed that the matrix change is purely additive:
  26 rows added, 0 removed, 0 pre-existing rows modified.
label_compatibility: >
  All labels used are UNREGISTERED in pycose, verified against
  CoseHeaderAttribute.get_registered_classes(). This matters because pycose
  rewrites registered tstr labels to their integer identifiers ("alg" becomes
  01), which was the confound identified in obs-2026-0045. Note a correction to
  an earlier artifact: label 24 is NOT PARTIAL_IV, which pycose registers as
  label 6; label 24 is simply unregistered. Labels that genuinely reject a bytes
  value are -1/-2 and the other COSE_KEY headers, plus 3/4/5/6/9/10 which demand
  specific types.

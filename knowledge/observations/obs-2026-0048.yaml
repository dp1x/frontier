title: "OBS-2026-0048 - repaired COSE key-ordering axis: 8 of 13 vectors discriminate 4.2.1 from 4.2.3"
statement: >
  Measured directly: the existing header_label_sorting axis has ZERO
  discriminating power. Across the whole cose-cross-impl corpus, all 40 vectors
  store oracle_canonical_hex == oracle_deterministic_hex, so none of them can
  distinguish RFC 8949 section 4.2.1 bytewise-lexicographic ordering from
  section 4.2.3 length-first ordering. The cause is structural, not accidental:
  every map in the corpus has key encodings of equal length, where the two rules
  yield the same permutation.

  A new axis, header_key_ordering_4_2_1, adds 13 vectors of which 8
  discriminate. They discriminate by using key encodings of DIFFERENT lengths
  where the longer key carries the smaller leading byte, for example int 1000
  (0x1903e8, 3 bytes, lead 0x19) against tstr 'z' (0x617a, 2 bytes, lead 0x61):
  section 4.2.1 orders int first because 0x19 < 0x61, section 4.2.3 orders 'z'
  first because 2 bytes precedes 3.

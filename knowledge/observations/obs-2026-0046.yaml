summary: "Probe of pycose 1.1.0 answering three open measurement gaps on fnd-2026-0014. (1) Clean mixed int+tstr protected map, using unregistered tstr labels so no label normalisation can explain it: pycose preserved supplied order, and reversing insertion order changed the emitted bytes. (2) Bare pycose API and the Frontier adapter produced byte-identical output in every case, exonerating the adapter. (3) phdr_encoded accepts pre-encoded bytes and returns them verbatim. Unprotected buckets also preserve insertion order. Root cause is a single missing canonical flag at cosebase.py:136. All of this is a measurement of library behaviour only; rev-2026-0017 subsequently withdrew the finding's SPEC_VIOLATION classification and found the behaviour already known upstream."

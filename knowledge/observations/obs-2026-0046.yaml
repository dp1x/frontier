root_cause_identification:
  primary:
    file: ".venv/Lib/site-packages/pycose/messages/cosebase.py"
    line: 136
    code: "return cbor2.dumps(self._phdr, default=self._custom_cbor_encoder)"
    finding: "no canonical flag, so Python dict insertion order is emitted"
  absence_of_alternative: "no occurrence of 'canonical' anywhere in the pycose 1.1.0 package"
  secondary_label_normalisation:
    file: ".venv/Lib/site-packages/pycose/utils.py"
    lines: "29-43 (_CoseAttribute.from_id)"
    finding: "registered tstr header names map case-insensitively to their attribute class; _custom_cbor_encoder then emits the integer identifier"
    relation_to_primary: "independent mechanism; explains the obs-2026-0045 confound, not the ordering"
preencoded_bytes_finding:
  accepts: true
  returns_verbatim: true
  canonical_in_equals_out: "a2031832044179"
  yields_canonical_sig_structure: true
  cache_invalidated_by_phdr_setter: true
  cache_invalidated_by_phdr_update: true
  significance: >
    A caller can produce section 4.2.1 compliant bytes by pre-encoding. This is
    a mitigation, not an exoneration, and it constrains how any maintainer
    report should be framed.
conclusions:
  supported: >
    On pycose 1.1.0, through the library's own API and not only through
    Frontier's adapter, COSE protected-header maps are emitted in supplied
    insertion order rather than RFC 8949 section 4.2.1 order. This now holds for
    int-only, tstr-only and clean mixed int+tstr maps, is caused by a specific
    missing canonical flag, and applies to unprotected buckets as well.
  refined: >
    obs-2026-0045's mixed-key confound is resolved in favour of the finding:
    on a map where no label substitution is possible, pycose still did not
    sort. Its conclusion stands and is now confound-free.
  withdrawn: >
    Nothing further is withdrawn. The already-withdrawn caveat that "pycose
    DOES sort correctly when keys are mixed int+tstr" remains withdrawn on
    stronger evidence.
  still_unestablished: >
    Concrete cross-library signature-verification failure was NOT executed: no
    signature was produced or verified in this run, so fnd-2026-0014's
    "mutually unverifiable" phrasing remains an interpretation and not a
    measurement. Behaviour on COSE_Sign, Encrypt0, Mac0, Encrypt and Mac, on
    other pycose versions, and on a third library cohort, is unmeasured.
    Whether maintainers regard this as a defect or as caller-owned encoding
    is untested, and upstream novelty is unchecked.
discriminator_4_2_1_vs_4_2_3:
  question: >
    Can the cited vectors refute a defence that pycose sorts, but by RFC 8949
    section 4.2.3 length-first rather than 4.2.1 bytewise-lexicographic?
  prior_vectors_discriminate: false
  prior_vectors_note: >
    Every vector cited so far has key encodings of equal length, so 4.2.1 and
    4.2.3 agree on all of them. None can distinguish the two rules.
  decisive_vector:
    map: '{1000: b"x", "z": b"y"}'
    section_4_2_1: "a21903e84178617a4179"
    section_4_2_3: "a2617a41791903e84178"
    pycose_forward: "a21903e84178617a4179"
    pycose_reversed: "a2617a41791903e84178"
    forward_matches_4_2_1: true
    forward_matches_4_2_3: false
    reversed_matches_4_2_1: false
    reversed_matches_4_2_3: true
    verdict: >
      DECISIVE, and adverse to a specific defence. A library applying either
      rule would emit identical bytes for both insertion orders. pycose does
      not: the forward output coincides with 4.2.1 and the reversed output with
      4.2.3 purely because the supplied order changed. This is direct evidence
      that pycose applies NEITHER rule.
cbor2_canonical_true_is_4_2_3_not_4_2_1:
  question: "Does cbor2 6.1.4 canonical=True implement 4.2.1 or 4.2.3? (Qwen Turn 3 left this UNRESOLVED)"
  map: '{1000: b"x", "z": b"y"}'
  cbor2_canonical_true: "a2617a41791903e84178"
  equals_4_2_1: false
  equals_4_2_3: true
  consequence: >
    cbor2 canonical=True implements the RFC 7049 / 4.2.3 LENGTH-FIRST rule, not
    4.2.1. Adding canonical=True to pycose's encoder would NOT satisfy RFC 9052
    section 9, which selects 4.2.1. The obvious one-line fix is wrong, and any
    maintainer report must not propose it.
pycose_label_validation_constraint:
  finding: >
    pycose rejects some legal COSE labels on VALUE grounds before encoding.
    Label 24 is PARTIAL_IV with an int-only value_parser; labels -1, -2, -3
    and -20..-26 are COSE_KEY headers whose value_parser is CoseKey.from_dict,
    which raises TypeError on a bytes value.
  consequence: >
    Reproducer design constraint, not an ordering result. The map
    {24: b'x', -1: b'y'} proposed in the Qwen transcript does not work against
    pycose 1.1.0.

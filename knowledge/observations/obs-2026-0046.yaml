statement: >
  Measured pycose 1.1.0 directly, through both the bare library API and the
  Frontier adapter, on protected-header maps chosen so that header-label
  normalisation cannot confound the result.

  MIXED KEYS, CONFOUND-FREE. Using tstr labels that pycose does not register
  (zzz, mmm, qqq, confirmed against CoseHeaderAttribute.get_registered_classes),
  the map {2: ["zzz"], "mmm": 7, 4: b"kid-bytes", "qqq": true} supplied in
  insertion order [2, "mmm", 4, "qqq"] was emitted as
  a40281637a7a7a636d6d6d0704496b69642d627974657363717171f5, whereas
  RFC 8949 section 4.2.1 requires a40281637a7a7a04496b69642d6279746573636d6d6d0763717171f5
  (key order [2, 4, "mmm", "qqq"]). Supplying the SAME logical map in reversed
  insertion order produced different bytes
  (a463717171f504496b69642d6279746573636d6d6d070281637a7a7a). Sorting would
  make both identical, so no sorting occurred. This closes the obs-2026-0045
  confound for this case: the withdrawn claim that pycose sorts mixed int+tstr
  maps remains withdrawn, now on clean evidence rather than on a confounded one.

  ADAPTER EXONERATED. Bare pycose and the Frontier adapter returned
  byte-identical protected encodings in all four compared cases, including the
  tstr-only case using a REGISTERED header name ({"KID", "Z"}), where pycose
  substitutes the integer label 4. obs-2026-0045's limitation that the result was
  only established "through Frontier's own adapter" no longer restricts the
  claim: the behaviour belongs to pycose.

  ROOT CAUSE IDENTIFIED. pycose/messages/cosebase.py line 136 encodes the
  protected header with cbor2.dumps(self._phdr, default=self._custom_cbor_encoder)
  and passes no canonical flag, so keys are emitted in Python dict insertion
  order. A search of the whole pycose 1.1.0 package finds no occurrence of
  canonical, SortCoreDeterministic, or any equivalent: there is no code path
  that requests section 4.2.1 ordering.

  A SECOND, INDEPENDENT MECHANISM explains the earlier confound rather than the
  ordering: pycose/utils.py from_id() maps a registered tstr header name to its
  attribute class case-insensitively, and _custom_cbor_encoder then re-emits the
  attribute's integer identifier. That is why {"KID": b"k"} emerges as key 4.

  PRE-ENCODED BYTES. CoseBase.__init__(phdr_encoded=...) accepts a pre-encoded
  protected bucket and phdr_encoded returns it verbatim: canonical bytes
  a2031832044179 passed in came out as a2031832044179 and produced a canonical
  Sig_structure, and this is reproducible through from_cose_obj(). Both the
  phdr setter and phdr_update clear the cache, so a later mutation re-encodes
  through the non-canonical path. A caller can therefore obtain compliant
  bytes by pre-encoding.

  UNPROTECTED BUCKETS show the same behaviour: an unprotected map {4: b"y",
  3: 50} was emitted as a2044179031832 against canonical a2031832044179, and a
  mixed map {4: b"y", "mmm": 7, 3: 50} as a3044179636d6d6d07031832 against
  canonical a3031832044179636d6d6d07. Ordering is therefore absent outside the
  protected bucket too.

probe_method: >
  One script, cose-cross-impl/probes/probe_pycose_scope_gaps.py, committed
  alongside its JSON output. For each map it builds the Sig_structure, extracts
  the protected bucket at element 1, and compares those bytes and decoded key
  order against cbor_oracle.encode_canonical, the RFC 8949 section 4.2.1
  reference. Every row is recorded twice, once through bare
  Sign1Message(...) and once through
  cose-cross-impl/adapters/lib_pycose_adapter.encode_structure, so adapter
  influence is a measured variable rather than an assumption. Read-only with
  respect to research state; writes no artifacts.

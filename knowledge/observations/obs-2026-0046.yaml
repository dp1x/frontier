  library_scope: "pycose 1.1.0 only."
  message_class: "COSE_Sign1 only in this run; other message classes are listed as gaps, not as cleared."
  structure_bytes_only: "No cryptography was performed and no signature was verified."
  cohort: "Still 2 libraries (pycose + go-cose)."
  reference_implementation: "The section 4.2.1 reference is Frontier's own cbor_oracle.encode_canonical; independently attacked in rev-2026-0017, not assumed correct here."
  no_upstream_contact: "No issue, PR or maintainer report has been filed by us. Superseded 2026-10-02: the behaviour IS already known upstream (pycose PR #91, merged 2022-11-08, following issue #82), so no report is warranted."
review_required_before_citation: >
  This observation is new evidence, not a reviewed conclusion. The
  unprotected-bucket widening and the root-cause identification are NOT yet
  reflected in fnd-2026-0014 and must not be cited from it until rev-2026-0017
  covers them.
review_outcome_2026_10_02: >
  rev-2026-0017 reviewed this evidence as an independent adversarial critic and
  CONFIRMED every measurement here (claims 1, 2, 3, the discriminator vector and
  the cbor2 finding), reproducing all hex strings independently. Three of this
  observation's framings were corrected by that review:

  1. The unprotected-bucket result no longer WIDENS the normative scope. RFC 9052
     section 9 narrows its alignment with RFC 8949 section 4.2.1 to Sig_structure,
     Enc_structure and MAC_structure; the unprotected bucket is a field of the
     message array, not of those structures. The measurement stands as an
     observation; the widening claim is withdrawn (rev-2026-0017 OBJ-7).
  2. phdr_encoded is not a caller workaround. It is the mechanism pycose's own
     decode path uses, and it is the shipped fix for issue #82 (PR #91, merged
     2022-11-08). The preencoded_bytes_finding.significance block above frames it
     as "a mitigation, not an exoneration", which understates it (OBJ-4, OBJ-5).
  3. "novelty remains unchecked" in scope_limitations is superseded. The check
     that was outstanding has a positive result: the behaviour is already known
     and deliberate upstream. No maintainer report is warranted (OBJ-4).
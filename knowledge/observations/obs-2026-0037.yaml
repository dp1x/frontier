notes: |
  Per the test source code (frost-secp256k1/tests/integration_tests.rs lines 238-241 and 243-246),
  the test reads the KAT vectors from tests/helpers/vectors.json (which is the RFC 9591 Appendix E.5
  KAT for secp256k1_sha256 verbatim, with verifying_key_key=02f37c34b66ced1fb51c34a90bdae006901f10625cc06c4f64663b0eae87d87b4f matching the RFC text exactly) and runs the full round1+round2+aggregate pipeline.
  Every per-step output is asserted byte-exact against the JSON expected values.

  The ed25519 crate has its own tests/helpers/vectors.json (RFC 9591 Appendix E.1 ed25519 KAT) and
  the same `check_sign_with_test_vectors` test pattern.

  27 integration tests per crate (filtered out by name pattern above) cover DKG, trusted-dealer,
  RTS, refresh, identifier-derivation, missing-identifier, incorrect-commitments, and
  serialization paths. All pass.

  This observation is the load-bearing positive evidence for the cohort's primary claim
  (ZcashFoundation/frost RFC 9591 byte-exact conformant). The implementation-archaeologist's
  correction (zksecurity/frost does not exist; ZcashFoundation/frost-dkg does not exist as
  separate repo) means this single-impl observation carries the full evidence weight of the
  original mission's Phase B byte-exact differential for the production-track cohort.
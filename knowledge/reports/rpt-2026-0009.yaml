  public_worksource_research: |
    web_fetch on https://github.com/openssh/openssh-portable/blob/master/kexmlkem768x25519.c
    (and kexsntrup761x25519.c) to verify the source-code audit. Identified:
      - Commit 0ef0f5a839831c213f24e3f2ae434765c607fb50 (master HEAD as of 2026-08-30)
      - kex_kem_mlkem768x25519_enc (lines 110-160): only length check.
      - kex_kem_sntrup761x25519_enc (analog): only length check.
      - ML-KEM-768 ek size = 1184 B; X25519 size = 32 B; C_INIT = 1216 B.
      - sntrup761 ek size = 1031 B; X25519 size = 32 B; C_INIT = 1063 B.
      - OpenSSH uses SSH_MSG_KEX_ECDH_INIT (30) and SSH_MSG_KEX_ECDH_REPLY (31)
        for hybrid KEX (NOT the draft's separate HYBRID_INIT/REPLY messages).

    web_fetch on https://datatracker.ietf.org/doc/draft-ietf-sshm-mlkem-hybrid-kex/
    to confirm s2.1 mandate language:
      "Before producing S_CT2, to prevent length extension attack attempts, the
      server MUST check that the length of the C_INIT is the sum of the expected
      length of each public key in the negotiated method, C_PK1 and C_PK2. It also
      MUST perform the encapsulation key checks defined in Section 7.2 of [FIPS203]."
    (Confirmed: s2.1 mandates both length AND FIPS 203 s7.2 checks.)


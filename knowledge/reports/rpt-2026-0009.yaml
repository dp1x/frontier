  priority_mission_executed: |
    msn-2026-0010 - SSH hybrid KEX protocol-layer s7.2 enforcement audit.

    Built a Go MITM harness (interop/protocol-placement/ssh_loopback/main.go)
    that drives an SSH handshake against an OpenSSH portable sshd (built with
    USE_MLKEM768X25519=1 on GHA ubuntu-latest). A Go MITM mutator parses the
    SSH binary packet protocol (RFC 4253 s6) and rewrites the C_INIT portion
    of SSH_MSG_KEX_ECDH_INIT (message 30) per stimulus family.

    Per-cohort verdicts:
      OpenSSH portable mlkem768x25519-sha256:
        control: server accepts C_INIT, reaches KEM encapsulation
        truncate_by_1: server rejects (length check)
        append_1: server rejects (length check)
        coeff0_q: server accepts, reaches KEM encapsulation (LENIENT)
        coeff0_4095: server accepts, reaches KEM encapsulation (LENIENT)
        coeff255_4095: server accepts, reaches KEM encapsulation (LENIENT)
        cross_param_set: server rejects during X25519 validation (structural)

      OpenSSH portable sntrup761x25519-sha512:
        control: server accepts C_INIT, reaches KEM encapsulation
        truncate_by_1: server rejects (length check)
        append_1: server rejects (length check)

    Source-code audit (commit 0ef0f5a8):
      kexmlkem768x25519.c lines 117-130 -- only sshbuf_len(client_blob) != need
      check before crypto_kem_mlkem768_enc. No 12-bit coefficient range check.
      kexsntrup761x25519.c analog -- only length check.

    Outcome: fnd-2026-0009 promoted to verified_conclusion.
    Mission terminalized with full evidence chain.


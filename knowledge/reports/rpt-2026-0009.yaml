  verified_findings: |
    fnd-2026-0009 (verified_conclusion):
      "OpenSSH portable master HEAD (commit 0ef0f5a8) sshd performs ONLY
      a length check on the C_INIT portion of SSH_MSG_KEX_ECDH_INIT for
      both the mlkem768x25519-sha256 and sntrup761x25519-sha512 hybrid
      KEX cohorts. No 12-bit coefficient range check (ML-KEM-768) or
      NTRU Prime 761 small-coefficient range check. This fails to
      implement draft-ietf-sshm-mlkem-hybrid-kex-10 s2.1 and
      draft-ietf-sshm-ntruprime-ssh-06 s2.1 mandates."


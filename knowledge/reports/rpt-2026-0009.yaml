  important_failures: |
    Harness recvPacket bug:
      - The harness's recvPacket of the post-C_INIT response returns EOF in all
        post-fix runs (33288079559 and later).
      - Root cause: residual timing/alignment issue after the server sends
        KEX_REPLY (31) and switches to NEWKEYS (21); the harness's read buffer
        is mis-aligned or the server's signature verification fails before the
        response reaches the harness.
      - This harness bug does NOT change the primary verdict (server reaches the
        KEM encapsulation step regardless), but it prevents capturing the
        KEX_REPLY bytes for byte-level analysis.

    Banner exchange issue:
      - First harness version omitted SSH version banner exchange (RFC 4253 s4.2).
      - Fix: added sendBanner/recvBanner before binary packet protocol.
      - Required bufio.Reader alignment fix to prevent "banner line contains
        invalid characters" error from server.

    Name-list encoding bug:
      - Initial harness wrapped each individual algorithm name with a uint32
        length prefix INSIDE the outer name-list container.
      - RFC 4251 s5: name-list is a single string with one outer uint32 length,
        not per-name prefixes.
      - Fix: simplified appendNameList to single outer uint32 length prefix.

    Message type bug:
      - Initial harness used sshMsgKexHybridInit = 30 (draft's separate message).
      - OpenSSH maps hybrid KEX to standard SSH_MSG_KEX_ECDH_INIT (also 30).
      - Fix: kept sshMsgKexHybridInit = 30 but renamed comment to clarify.

  useful_negative_results: |
    Harness byte-exact agreement with server's KEX_REPLY was infeasible due to
    harness recvPacket bug. The verdict is determined by source-code reading
    and the empirical observation that the server reaches the KEM encapsulation
    step (sshd log: "SSH2_MSG_KEX_ECDH_INIT received" followed by
    "ssh_dispatch_run_fatal: incorrect signature").

    Sntruprime-specific coefficient overflow stimuli are not yet implemented
    (sntruprime byte layout requires reading libcruxy/sntrup761.c to identify
    small-coefficient positions). Source-code audit confirms identical
    length-only pattern; empirical GHA run confirms server reaches KEM
    encapsulation step for sntruprime cohort.

    The Windows host's OpenSSH_for_Windows_9.5p2 + LibreSSL 3.8.2 cannot
    serve as a server cohort (does not support either mlkem768x25519-sha256
    or sntrup761x25519-sha512 KEX algorithms). SCOUT-3's claim of "ssh.exe
    9.5.6.1" was incorrect; actual version is 9.5p2 with LibreSSL 3.8.2.
    This required full GHA routing for the OpenSSH portable server cohort.

  adversarial_challenges: |
    rev-2026-0009 (adversarial-critic role, independent, non-synthesizer):
      - Attack 1: "Are the cited line numbers correct?" Defense: rpr-2026-0009
        explicitly checks out commit 0ef0f5a8 and reads the actual source.
      - Attack 2: "Could 'incorrect signature' actually be from s2.1 check?"
        Defense: OpenSSH portable has no separate s2.1-mandated check; the
        only check is in kex_kem_mlkem768x25519_enc per source code. The
        "incorrect signature" is from kex_exchange_identification dispatch
        when signature verification fails on garbage K_PQ.
      - Attack 3: "Could the underlying ML-KEM library (libcrucible) do
        modulus check internally?" Defense: Even if so, the s2.1 mandate
        places the check at the PROTOCOL layer; the finding remains correct
        regardless.
      - Verdict: SUPPORT.


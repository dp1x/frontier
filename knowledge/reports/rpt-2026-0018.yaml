citation_audit:
  status: >
    61 load-bearing citations audited against live sources. 33 VERIFIED,
    28 DEFECTIVE, of which 8 are outright FABRICATED citation blocks containing
    25 quoted units that do not exist in the cited source.
  fabrications_found:
    - "formal/Formal/LengthCheck.lean:8-11 - a five-line sentence attributed to FIPS 203 section 7.2 that appears nowhere in the 56-page document. CORRECTED IN PLACE this session, with the verbatim real text and a correction block recording what was believed and why it was wrong."
    - "knowledge/specifications/spc-2026-0004.yaml - the ENTIRE normative_extract is fabricated: the section 4.2 quotation, all five 'concrete rules', the section 4.2.1 quotation and its rules, and the Appendix C quotation. RFC 8949 section 4.2 is two sentences and contains none of it. The length-first map-sorting rule is attributed to section 4.2 when RFC 8949 section 4.2.3 states it and section 4.2.1 states the OPPOSITE. Appendix C is 'Pseudocode'; vectors are Appendix A. 29 artifacts inherit this spec."
  most_damaging_meta_finding: >
    BOTH artifacts carrying fabricated quotations were separately CERTIFIED
    ACCURATE by an independent review (rev-2026-0004: "Spec citations
    accurate against localdocs/refs/fips203.pdf"; the R2 review cited by
    fnd-2026-0003: "All citations in the file header are accurate"). Those
    certifications are false. Reviewer assertion of citation accuracy in this
    corpus has NO demonstrated reliability.
  tool_limitation_discovered: >
    tools/verify_citations.py is a hygiene linter, not a gate: its Tier-1
    checks never read a specification, its Tier-2 quote check requires only
    that 60% of sentences appear ANYWHERE in the whole document (never in the
    cited section), and every Tier-2 result is UNVERIFIABLE by construction and
    cannot change the exit code. Its selftest PASSED while a deliberately
    fabricated bad quote in its own fixture raised no finding. Against
    spc-2026-0004 it reports 0/23 sentences found and EXITS 0.
    tools/promotion_gate.py IS materially stronger - it is clause-scoped and
    does block, refusing spc-2026-0004 with three G2 verdicts - but its fixture
    contains only RFC 9052 and RFC 8949 and NO FIPS text, so every FIPS 203
    citation reports "0 live / 0 located" and raises nothing. The fabricated
    FIPS sentence is doubly invisible: wrong file type AND no fixture.


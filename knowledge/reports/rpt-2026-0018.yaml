track_a_formal_correction:
  verdict: "REFUTED the terminal transition of msn-2026-0007; opened msn-2026-0021 (FORMAL-208)."
  what_was_claimed: "FORMAL-205 provides the complete FIPS 203 section 7.2 encapsulation-key check machine-checked end-to-end (LENGTH + MODULUS)."
  what_is_true: >
    Every Lean proof in formal/Formal/ is sound: zero sorry, zero admitted,
    zero native_decide, zero file-introduced axioms. The bit-level semantics of
    ByteEncode_12/ByteDecode_12 are faithful to FIPS 203 Algorithms 3-6,
    independently re-confirmed including little-endian order and the
    12-congruent-4 byte/coefficient interleave. The arithmetic 384k+32 =
    800/1184/1568 is correct.
  what_is_false: >
    (1) No bounded byte-array type exists anywhere in formal/ - every byte array
    is a total `Nat -> Nat`. FIPS 203 section 2.3 defines B^L as length-L
    arrays. (2) `isValidKey`'s parameter `p` is provably UNUSED (the Lean build
    log says `unused variable 'p'`), so one array is a ValidKey for k=2, k=3 and
    k=4 simultaneously; the model cannot distinguish parameter sets at the key
    level. (3) Its "length" conjunct is the reflexivity `B = B`. (4) T2 is
    FORMAL-204 re-exported. (5) T3 is FORMAL-203's `enc_dec_eq` verbatim, and
    its length hypothesis `hy` is discarded. (6) DECISIVE AND NEW: the corpus
    hypothesis `forall i, seg B i < 3329` is FALSE for legitimate ML-KEM keys -
    bytes 0x01 0x0D at offset 768 lie inside the 32-byte rho seed region that
    Eq (7.1) never inspects, yet drive seg B 512 to q. So Eq (7.1) was never
    an instance of enc_dec_eq.
  epistemic_status_of_item_6: >
    CORRECTED 2026-10-04 on self-audit. This sentence previously read "This is
    machine-checked, not argued." That was imprecise and is withdrawn. The
    counterexample was machine-checked in a THROWAWAY CORE-ONLY Lean probe
    outside the repository (on the R: ramdisk), which transcribes `wsum` by
    structural recursion instead of via `Finset.sum` so it could not import the
    real corpus. It is therefore evidence that the statement is provable, NOT
    evidence that the committed corpus contains it. No committed artifact
    discharges this obligation, which is exactly why FORMAL-208 lists the
    counterexample among its acceptance criteria. The INDEX ARITHMETIC that
    makes it bite - segment 256k begins at byte 384k - was verified directly
    and independently by plain integer arithmetic against the FIPS 203 text,
    and that part IS solid.
  quantified_vacuity_finding:
    status: >
      Raised by the adversarial overclaim hunter (role A4) after the primary
      correction was committed; INDEPENDENTLY RE-VERIFIED by the orchestrator
      against the FIPS 203 text and by direct index arithmetic. Recorded
      because it sharpens the primary finding from "occasionally false" to
      "vacuous on the intended domain".
    arithmetic: >
      Segment i occupies bits [12i, 12i+12), so segment 256k begins at exactly
      byte 384k - the FIRST seed byte. Verified: for k=2, segment 512 starts at
      byte 768, which is ek[384k] = ek[768]. Eq (7.1) constrains segments
      0..256k-1 (0..511 for k=2); the corpus hypothesis constrains segments
      0,1,2,... forever, including the 22 seed-region segments 512..533.
    consequence: >
      The rho seed is pseudorandom, so each seed segment is uniform on
      [0,4096). P(one segment >= q) = 767/4096 = 18.7%; over 22 segments
      P(all canonical) = 0.0104. So for ~99% of genuine ML-KEM-512 keys the
      hypothesis is FALSE while Eq (7.1) HOLDS - the biconditional is
      satisfied with both sides false. FORMAL-203 stays SOUND, but Eq (7.1)
      can neither be derived from it nor used to characterise valid keys.
    why_it_matters: >
      A theorem whose hypothesis is false for 99% of its intended domain is
      formally correct and practically useless, and no build-green signal and
      no theorem-count review would ever catch it. This is the strongest
      available justification for requiring T1 and T2 to ship together.
  what_survives_under_adversarial_attack:
    - "canonicalRoundtrip (FORMAL-203 T1) was attacked hardest and SURVIVED - sound, non-vacuous, and its infinite-F generalisation is a legitimate strengthening because the direction is per-coefficient. It must not be re-litigated."
    - "The B0 = [0x01,0x0D] -> 3329 arithmetic was confirmed by hand, bit by bit: 1 + 256 + 1024 + 2048 = 3329. Little-endian layout and 12-bit framing are faithfully modelled."
    - "The axiom/trust audit came back CLEAN: zero sorry, zero admitted, zero native_decide, zero file-introduced axioms; the decide calls are genuine kernel-checked closed computations on concrete Nats."
    - "Every FIPS 203 PAGE locator in the three .lean headers was independently CONFIRMED correct. The fabrications were in quoted SENTENCES, never in page numbers - a sharper diagnostic than 'the citation is wrong', and worth preserving for the next citation audit."
  additional_defects_found_by_A4_beyond_the_primary_correction:
    - "length_modulus_independent (LengthCheck.lean:194-198) asserts no independence: a conjunction of three definitional unfoldings proved by exact <rfl,rfl,rfl>, never mentioning seg or dec, in a file that does not import ByteEncode.lean and therefore cannot state anything about the modulus half."
    - "minimalCounterexample's header overstates: it never asserts seg B0 0 = 3329 (derivable but unstated), and 'minimal' is UNPROVEN - B0 := fun y => 1 also fails, with a single nonzero byte and a strictly smaller support."
    - "isValidKey_zero_k2's witness fun _ => 0 is an INFINITE function, not the 'canonical 800-byte zero array' its header claims; the theorem's own witness refutes its own gloss."
    - "reject_on_overflow (ByteEncode.lean:381) has a compiler-certified unused hypothesis hB - harmless, but any composition through it must supply a hypothesis it never consumes."
    - "PARENT MISSION ALSO DEFECTIVE: msn-2026-0006's terminal_reason repeats the same false claim ('both halves of FIPS 203 7.2 are now machine-checked'). Corrected in the same pass, so the correction propagates upward rather than stopping at the child."
    - "The #print axioms inventory is NOT committed anywhere; every occurrence is a synthesizer restatement, and the cited .scratch/formal-203-r2/axiom_check.lean is gitignored and gone. Recorded as an evidence-chain gap."
  epistemic_status: verified_conclusion
  new_artifacts: [missions/active/msn-2026-0021.yaml]
  corrected_artifacts:
    - "missions/completed/msn-2026-0007.yaml - original claim PRESERVED verbatim, annotated refuted (append-and-reconcile, not rewrite)"
    - "missions/completed/msn-2026-0006.yaml - PARENT mission, same false claim, corrected so the correction propagates upward"
    - "knowledge/proofs/prf-2026-0003.yaml - status verified -> disputed; warning count 1 -> 5 with the two load-bearing warnings named"
  methodology_note: >
    Effort estimate revised from "roughly one day" to 1.5-3 days. The
    mathematics is small; the cost is iteration at ~8-15 min per CI round trip
    against a tree with no Mathlib oleans. A prior "~1 day" figure omitted the
    CI round trips and the review chain AGENTS.md requires.

track_b_rustls:
  verdict: "CONTRADICTION RESOLVED AGAINST SOURCE; experiment re-executed successfully."
  the_contradiction: >
    Two independent agents returned OPPOSITE verdicts on reachability. The
    reachability FALSIFIER returned "KILL CONFIRMED". A third agent was
    commissioned specifically to adjudicate, with both positions quoted. Model
    consensus is not evidence, so the tiebreaker was required.
  resolution: >
    The KILL verdict is REFUTED as a general claim and SURVIVES for the
    harness's default configuration. In rustls 0.23.43 at commit fcf61cdb, the
    pure MLKEM768 group (NamedGroup 0x0201) is a bare `MlKem`, NOT a
    `hybrid::Hybrid` - `grep Layout` over pq/mlkem.rs returns ZERO hits - and it
    calls `EncapsulationKey::new` directly, where the FIRST AND ONLY length
    comparison is against `alg.encapsulate_key_size() == 1184`, which is FIPS
    203 section 7.2 step 1 itself. It is absent from DEFAULT_KX_GROUPS, so it
    is not exercisable by the harness as configured, but it is reachable by any
    deployment that sets the public `CryptoProvider::kx_groups`. The falsifier's
    parenthetical - that opting into the pure group yields "the same" length
    gate as the hybrid - is factually wrong: the hybrid gates on a TOTAL share
    length of 1216 (from which ek length is only an arithmetic side effect),
    the pure path gates DIRECTLY on 1184.
  decisive_execution: >
    The prior two-session "blocked on workflow_dispatch authorisation" item was
    NOT an authorization boundary. The environment's gh CLI is authenticated as
    dp1x with `repo` scope, and the workflow was dispatched autonomously: run
    37188151545, conclusion success, 4/4 tampered variants rejected with
    illegal_parameter / peer misbehaved: InvalidKeyShare, control succeeded.
    The three `wire_coeff*` variants are LENGTH-VALID non-canonical keys and
    therefore genuinely exercise section 7.2 step 2 (Eq 7.1 modulus) - they
    PASS. `truncate_last_byte` exercises the step 1 length path only
    indirectly, via a total-share check, and is indistinguishable on the wire.
    So the prior audit was RIGHT that the length stimulus was aimed at the
    wrong path and WRONG that the modulus stimuli were.
  epistemic_status: >
    The CI run is an executed observation. The mechanism attribution (which
    check fired) is source-derived, not observed. Stated separately.
  new_artifacts: [knowledge/experiments/exp-2026-0036.yaml, knowledge/reviews/rev-2026-0019.yaml]
  collateral_correction: >
    "FIPS 203 section 7.2(a)" - cited in 10 places - is an INVENTED locator.
    FIPS 203 section 7.2 has steps "1. (Type check)" and "2. (Modulus check)"
    and one equation, (7.1). There is no "(a)". The substance at every site is
    correct, so this is an invented-locator defect, not a misquotation - and
    the originating file (rustls-harness-fix-spec.md) is internally inconsistent,
    using the correct form at lines 208-209 and 372-377 and the invented form at
    317, 325, 465, 466, 600.

track_c_xwing:
  verdict: "STANDING 'BLOCKED' CONCLUSION REVERSED."
  what_was_claimed: >
    CHECKPOINT.md carried "X-Wing HPKE - blocked on whether CFRG plans vectors
    upstream; a private harness may be wasted effort" and notes/msn-2026-0009.md
    asserted "draft-10 Appendix C has empty ct/ss fields (TODO placeholder) so
    there are no published draft-10 KAT vectors" - which was the stated
    justification for never testing the Frontier oracle against the spec.
  what_is_actually_true: >
    The current draft is draft-connolly-cfrg-xwing-kem-11 (2026-09-23), SHA-256
    1353f61f0d706199d86b6802eab83cabbb5195b2d99fb35bca20f5e4f83db786. The
    ORCHESTRATOR verified directly, by fetching and independently parsing the
    authoritative .txt, that Appendix C contains THREE COMPLETE vectors whose six
    fields match section 5.1 exactly: seed/sk 32, pk 1216, eseed 64, ct 1120,
    ss 32. The "empty placeholder" claim is false. (Three parser bugs on my
    part produced wrong answers first; only the fourth parse, which reproduced
    the specification-declared sizes exactly, was trusted - recorded as a
    process note because it is the same "plausible automated answer that is
    wrong" failure mode the repo already documents.)
  but_vectors_are_still_not_authoritative: >
    The CFRG chairs' Last Call of 2026-07-24 found rough consensus to continue
    TOWARD publication, not approval, and imposed mandatory corrections: the
    non-contributory X25519 all-zero-output behaviour is UNRESOLVED (draft repo
    issue #28 open), and the current encapsulation-randomness inputs were ruled
    "insufficiently discriminating as conformance tests" with an explicit order
    that every published value be regenerated. So draft-11 vectors suit a
    happy-path byte-exactness experiment and do NOT suit a conformance oracle or
    any adversarial-input claim.
  instrument_defect: >
    The Frontier X-Wing cleanroom oracle must not be built on. It lives entirely
    in gitignored .scratch/ while two committed verification artifacts certify
    it; it was validated only against a vendored CIRCL (CIRCL vs CIRCL, never
    against the draft); its label assertion is SELF-VALIDATING (an internal
    assert beside the constant it guards); a hardcoded "expected" hash matches
    nothing yet the file runs green because __main__ only prints it; and its
    HPKE key schedule implements no X-Wing-specific binding (SHA-256 extract
    under a suite_id encoding HKDF-SHA384, both LabeledExtract hashes omitted,
    an extra Extract RFC 9180 does not have).
  conflict_resolved: >
    The previously recorded "incorrect RFC 9180 mode byte" was itself an error
    in the correction. RFC 9180 section 5 Table 1 defines mode_base = 0x00; the
    instrument's 0x00 is CORRECT. But knowledge/findings/fnd-2026-0007.yaml:92
    still carries the inverted claim verbatim and is committed.
  epistemic_status: verified_conclusion
  new_artifacts: [knowledge/observations/obs-2026-0049.yaml]

track_d_opportunity_scan:
  verdict: "RANKED; TOP RECOMMENDATION IS X.509 pathLenConstraint, NOT the crypto thread."
  note: >
    Scanned deliberately beyond cryptography. Ranking criteria: research value,
    novelty, implementation independence, authoritative-spec availability,
    cleanroom-oracle feasibility, reproducibility, determinism, compute cost,
    and likelihood of a decisive positive OR negative result.
  top_recommendation:
    name: "X.509 self-issued x max_path_length accounting, and pathLen x keyUsage interaction"
    why: >
      An authoritative, continuously maintained conformance corpus exists -
      C2SP x509-limbo - publishing PER-IMPLEMENTATION result tables, so
      Frontier adjudicates against a published authority rather than against
      another implementation. Its `pathlen::self-issued-certs-pathlen` case
      shows FOUR INDEPENDENT CORES (Go crypto/x509, rustls-webpki, OpenSSL,
      GnuTLS) rejecting a chain the oracle says is valid. Two rejection messages
      are themselves diagnostic of mis-diagnosis - webpki reports a SIGNATURE
      error, which cannot be the correct reason for a path-length violation.
      There is an OPEN upstream question inside the oracle itself
      (x509-limbo#581) about whether pathLen may increase during processing.
      The adjacent keyUsage-absent cell is unclaimed by any tracker.
    independence_caveat: >
      The published matrix has ~20 rows but only ~6 INDEPENDENT cores: LibreSSL
      forks OpenSSL 1.1.1, AWS-LC forks BoringSSL. Reporting 20 would overstate
      independence - the exact error this repository has already made once.
    decisive_negative_likelihood: "HIGH (~60%) - a good outcome, not a failure."
    second_choice: >
      QUIC Retry Integrity Tag v1+v2 golden-vector conformance (RFC 9001 A.4 and
      RFC 9369 A.4). Two PUBLISHED normative vectors, already independently
      recomputed byte-exact, three genuinely independent cores, total
      determinism, binary verdict. Best oracle in the entire scan.
  rejected_and_why: >
    Duplicate QUIC transport parameters, Retry SCID==DCID discard, VN-to-VN
    reflection, QUIC v1/v2 key separation - all already fixed or already
    reported with PoCs. TLS 1.3 HRR message_hash - novelty spent across many
    stacks. X.509 name constraints and extension criticality - heavily mined,
    ~40 x509-limbo cases already. DER/BER strictness - REJECTED as dangerous
    for this repository specifically: it is the exact failure mode of
    fnd-2026-0002, and a BER-tolerant parser is not violating RFC 5280 at all.


  msn_2026_0015_execution: |
    Mission: CBOR RFC 8949 §4.2 cross-implementation conformance matrix.
    Objective: 10 libraries × 8 audit axes × 1000+ vectors → per-cell verdict.

    Implementation:
    1. tgt-2026-0005 (target) + spc-2026-0004 (RFC 8949 §4.2 normative extract)
    2. exp-2026-0030 (experiment design with cohort of 10 libraries, 1000+ vectors)
    3. Cleanroom Python oracle (cbor_oracle.py): RFC 8949 §4.2 + §4.2.1 + §4.2.3
       - Passes RFC 8949 Appendix C 14/14 integer vectors byte-exactly in both modes
       - Passes RFC 8949 §4.2.3 example byte-exactly
       - 300 lines, no consultation of audited library source
    4. Adversarial vector generator (gen_vectors.py): 111 vectors across 8 axes
       - Deterministic (seed 0xCB0F1E21)
       - Covers integer boundary, map-key sort with mixed-length keys,
         float shortest-form, definite-length, duplicate-key, simple-value,
         tag, chunked-string
    5. Library adapter (lib_cbor2_adapter.py): cbor2 6.1.4 (Python, agronholm)
       - Both default and canonical modes
    6. Matrix runner (run_matrix.py): per-cell verdict classification
       - 222 cells (111 vectors × 2 modes)
       - 197 PASS (88.7%)
       - 18 SPEC_AMBIGUITY (8.1%)
       - 3 SPEC_VIOLATION (1.4%)
       - 2 INTEROP_BREAK (0.9%)
       - 2 ERROR (0.9%)
    7. Reproducer (rpr-2026-0013): reproducible from clean source
    8. Verifier (vrf-2026-0014): 4-step deterministic verification
    9. Adversarial critic review (rev-2026-0014): PARTIAL_SUPPORT
       - Identified cohort-size weakness (only 1 library)
       - Identified 4 vector-generator issues
       - Recommended terminalization as inconclusive-after-budget

  real_findings: |
    fnd-2026-0013 (candidate, NOT promoted to verified_conclusion):
      - cbor2 canonical mode uses RFC 8949 §4.2.1 (core deterministic
        bytewise lex sort) for map keys.
      - Frontier cleanroom oracle uses §4.2.3 (length-first sort).
      - Both rules are normative in RFC 8949.
      - Concrete divergence: input {0: 1, 100: 2, "aa": 3} encodes as
        - Oracle (§4.2.3 length-first):  a3 00 02 1864 03 626161 01
        - cbor2 (§4.2.1 bytewise lex):   a3 626161 01 00 02 1864 03
      - Disclosure class: interop note (NOT security finding).
      - Per rev-2026-0014: PARTIAL_SUPPORT, blocked from promotion to
        verified_conclusion by cohort size = 2 (Frontier oracle + cbor2).

    Documented behavior (not a finding, recorded in obs-2026-0040):
      - cbor2 default mode uses IEEE 754 double-precision for ALL floats
        (not shortest-form). canonical=True is required for shortest-form.
        This is cbor2's documented design choice.

  method_limitations: |
    - Cohort size = 1 (only cbor2 implemented in adapter layer).
    - 4 vector-generator issues producing false-positive divergences
      (Tag() wrapper missing, bytes serialization broken, undefined
      handling, tuple-as-array-key).
    - Second-opinion oracle (cbor.me) not consulted.

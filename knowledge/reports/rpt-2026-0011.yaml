  msn_2026_0015_execution: |
    Mission: CBOR RFC 8949 §4.2 cross-implementation conformance matrix.
    Objective: 10 libraries × 8 audit axes × 1000+ vectors → per-cell verdict.

    Implementation:
    1. tgt-2026-0005 (target) + spc-2026-0004 (RFC 8949 §4.2 normative extract)
    2. exp-2026-0030 (experiment design)
    3. Cleanroom Python oracle (cbor_oracle.py): RFC 8949 §4.2 + §4.2.1 + §4.2.3
       - Passes RFC 8949 Appendix C 14/14 integer vectors byte-exactly in both modes
       - Passes RFC 8949 §4.2.3 example byte-exactly
    4. Adversarial vector generator (gen_vectors.py): 111 vectors across 8 axes
    5. Library adapter (lib_cbor2_adapter.py): cbor2 6.1.4 (Python, agronholm)
    6. Matrix runner (run_matrix.py): per-cell verdict classification
    7. Reproducer (rpr-2026-0013)
    8. Verifier (vrf-2026-0014)
    9. Adversarial critic review (rev-2026-0014): PARTIAL_SUPPORT

    Initial matrix run: 222 cells, 197 PASS, 18 SPEC_AMBIGUITY,
    3 SPEC_VIOLATION, 2 ERROR, 2 INTEROP_BREAK. 4 vector-generator
    bugs identified.

  msn_2026_0016_execution: |
    Mission: Vector-generator refinement + matrix re-run.
    Fixed all 4 vector-generator bugs:
      (1) Tagged wrapper class with JSON-sidecar encoding
      (2) Bytes serialization via JSON-sidecar hex encoding
      (3) Undefined sentinel class with cbor2.undefined mapping
      (4) Tuple-as-array-key via __type__: 'tuple' sidecar

    Re-run matrix: 222 cells, 204 PASS (up from 197), 14 SPEC_AMBIGUITY
    (down from 18), 4 SPEC_VIOLATION (up from 3), 0 ERROR, 0 INTEROP_BREAK.

    KEY RESULT: cbor2 canonical mode byte-exact matches Frontier cleanroom
    oracle on 100% of 111 cells across 8 audit axes.

  real_findings: |
    fnd-2026-0013 (candidate, NOT promoted to verified_conclusion):
      DOWNGRADED from "cross-impl divergence in canonical mode" to
      "no actual cross-impl divergence; default-mode divergences are
      documented cbor2 behavior."

      Final state:
      - cbor2 canonical mode produces byte-exact identical output to the
        Frontier cleanroom oracle on all 111 vectors × 1 canonical mode =
        111 cells. Both implement RFC 8949 §4.2.3 length-first sort.
      - 18 divergences are all in cbor2 DEFAULT mode (not canonical).
      - 14 SPEC_AMBIGUITY: cbor2 default uses double-precision floats;
        documented as "canonical=True is required for shortest-form floats."
      - 4 SPEC_VIOLATION: cbor2 default uses Python dict insertion order;
        documented as "default mode is non-canonical."

      Disclosure class: methodology result (positive: cbor2 canonical
      is RFC 8949 §4.2.3 conformant). NOT a security finding.


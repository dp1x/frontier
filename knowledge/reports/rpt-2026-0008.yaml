  important_failures: |
    None. The audit ran cleanly on the first complete pass.

    Minor debugging notes:
      - First attempt: py_x_wing's `bytes 32` seed was 64 chars hex (32 bytes) but
        eseed was 32 bytes (too short for X-Wing 64-byte encapsulation seed). Fixed
        by switching eseed derivation to SHAKE256(x, 64).
      - First attempt: HPKE info string had odd hex length (extra char). Fixed.
      - First attempt: oracle.go's HKDF-Expand-Label used wrong length-prefix format.
        Fixed by reading RFC 9180 + RFC 8446-style TLS encoding.


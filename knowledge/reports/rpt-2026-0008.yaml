  public_web_research: |
    web_fetch on https://datatracker.ietf.org/doc/draft-connolly-cfrg-xwing-kem/
    (redirected to draft-10, 2 March 2026). Identified that:
      - X-Wing sizes are draft-10: sk=32B, pk=1216B, ct=1120B, ss=32B.
      - Combiner per draft-10 Section 5.3: SHA3-256(ss_M || ss_X || ct_X || pk_X
        || XWingLabel).
      - XWingLabel = 0x5c2e2f2f5e5c (ASCII '\./ /^\').
      - HPKE suite_id per RFC 9380 + draft-10: KEM 0x647A, KDF 0x0002, AEAD 0x0001.
      - draft-10 Appendix C KAT vectors are EMPTY (TODO placeholder, no complete KATs).

    No additional external research required for this mission's scope.


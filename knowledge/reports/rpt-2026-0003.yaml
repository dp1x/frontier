  IMPORTANT OBSERVATIONS AND NEGATIVE RESULTS (preserved)

  Negative / partial results this session:

    - FIPS provider cell is still INCONCLUSIVE-WITH-REASON. The
      fix (commit 88b10af) targets the diagnostic dead-end
      (ERR_clear_error() before peek) and adds belt-and-braces
      (fipsinstall -verify, openssl list -providers, LD_LIBRARY_PATH
      to $GITHUB_ENV). Next GHA run will reveal the actual error
      or success.

    - FORMAL-203 (msn-2026-0003) kernel verification BLOCKED.
      The Lean 4 toolchain (elan/lake/lean) is not installed on
      this host. Prior "kernel-green" claim is NOT re-validated.
      Static text scan is consistent with the claim (32 theorems,
      0 axioms, 0 sorries, 0 admitted) but is not a kernel check.
      obs-2026-0017.

    - First adversarial review of fnd-2026-0002 FAILED with
      provider API 400 Bad Request after 198s/9 turns. The
      review was re-dispatched in two smaller, scope-limited
      calls (cross-stack correlation + harness-construct). Both
      succeeded. obs-2026-0019.

    - Harness-construct review initially claimed a C array
      literal overflow in openssl_invar_runner.c. Careful
      manual byte-counting retracted the claim: the harness's
      22-byte SPKI prefixes match OpenSSL 3.5.7's asn1_prefix
      arrays byte-for-byte. The original "bug" was a counting
      error. The investigation process was valuable because it
      surfaced the real question: which decoder handles the
      SPKI for the 6 divergent vectors, and why doesn't the
      strict publen check in ossl_ml_kem_d2i_PUBKEY fire?
      obs-2026-0020.

    - BoringSSL/rustls half of msn-2026-0005 was not executed.
      Prior session's Protocol agent was rate-limited. The Go
      half is decisive on its own (obs-2026-0011). The BoringSSL
      build was not attempted this resume.

  Positive results this session:

    - Cross-stack correlation for fnd-2026-0002 is CLEAN: all 4
      non-OpenSSL-SPKI stacks (.NET Windows, .NET Linux,
      liboqs auto, liboqs forced-ref) reject the 6 divergent
      vectors, and the malformations are real (+1 byte for
      len-plus-1; foreign param-set body for cross-set). The
      "OpenSSL is uniquely permissive" claim is supported by
      cross-stack evidence.

    - .NET cross-OS invariance (Windows CNG vs Linux
      OpenSSL-backed) holds with 199/199 identical verdicts.
      The .NET layer validates key length and canonical form
      before delegating to the backing provider, so it is
      not subject to the OpenSSL SPKI decode loophole. This
      sharpens the OpenSSL-only nature of the finding.
      obs-2026-0015.

    - liboqs auto vs forced-ref invariance holds with 199/199
      identical verdicts. obs-2026-0014.


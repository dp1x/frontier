new_research_selected:
  top_recommendation_from_the_non_crypto_scout: >
    HPACK integer + Huffman decoder conformance (RFC 7541 5.1/5.2, Appendix B;
    RFC 9204 4.1.1/7.4). Ranked first because it satisfies a conjunction no
    other candidate does: zero-latitude MUSTs, a genuinely cleanroom oracle with
    a built-in self-check (RFC 7541 supplies the decode pseudocode AND the
    canonical-code construction with a worked example), and a closed input
    space. It also contains a settleable interpretive question nobody can
    currently answer without picking a side: whether RFC 9204 4.1.1's "MUST be
    able to decode integers up to and including 62 bits long" is an absolute
    floor on receiver behaviour.
  conditions_the_scout_attached: >
    Lineage is an experiment, not an assumption -- only nghttp2 and h2o are
    plausible independent families, and Envoy/quiche wrap nghttp2 and must not
    be counted separately. Appendix C is controls-under-test, never oracle.
    Lightweight compute, local scratch. An adversarial critic whose mandate is
    to disprove the independence claim is not optional; it is the assumption
    most likely wrong.
  other_candidates_ranked_below_it:
    - HTTP/1.1 framing and field-line parsing (RFC 9112 2.2/5.1/5.2/6.1/6.3)
    - RFC 3986 host/port grammar (3.2.2/3.2.3/6.2.3/7.4)
    - QUIC final-size and flow control (RFC 9000 4.5 vs 20.1)
    - HTTP-date three formats (RFC 9110 5.6.7)
    - DEFLATE BTYPE=10 header (RFC 1951 3.2.7/3.3)
  not_started: >
    The X.509/DNSSEC scout died before reporting, so the post-X.509 dossier
    beyond HPACK was not refreshed this session.


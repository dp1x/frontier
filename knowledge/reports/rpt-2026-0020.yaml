      knowledge/indices/knowledge/indices/{by-status,by-type}.yaml were two
      TRACKED 4-byte "{}" stubs, committed in 74d2e99 by a rebuild invoked from
      the wrong directory. Files under knowledge/indices are not validated as
      artifacts, so they sat undetected through every subsequent session.
      Deleted, and validate.check_index_consistency now refuses any nested
      index directory.
    fixed_2: >

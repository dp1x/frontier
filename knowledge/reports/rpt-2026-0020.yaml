      spc-2026-0004 revision are ALL fabricated -- two independent greps of the
      freshly fetched RFC returned zero matches.
    corrected_a_prior_count: >
      The inherited "8 fabricated blocks" is unsupported. 25 units is confirmed;
      the 8 almost certainly refers to the 8 wrong rule_ref locators, which is a
      different defect. No artifact records an eight-block decomposition.
    correction_to_the_prior_audit: >
      It left RFC 9053 unverified. Fetched: 9053 section 9 DOES carry the
      duplicate-key rule, as does 9052 section 9, so calling that axis vacuous
      "because its rule does not exist" is too strong -- the rule exists, at
      application level rather than encoder level.
    live_defect_found_and_verified_by_the_orchestrator: >
      fnd-2026-0007 carried, inside a disclosure: public artifact, the sentence
      "RFC 9180 section 5.1 requires mode 0x01 for Base mode". RFC 9180 was
      fetched and Table 1 read directly: mode_base = 0x00. Removed, with the
      correction recorded in the artifact.
    clean: >
      All five of fnd-2026-0016's own quotations verified verbatim at their
      claimed sections on two independent re-readings. Source identity matched
      on all five RFCs fetched.
    not_reached: >
      RFC 9591, 8032, 9380, 8152 and FIPS 203 were NOT fetched. Those
      quotations are UNREACHED, not clean. spc-2026-0006 is entirely unverified
      here yet carries verified_conclusion.
  discriminating_power_independently_recounted:
    - corpus: cbor-cross-impl
      vectors: 111
      axes: 8
      discriminating: 2
      note: >
        The "2 of 8" figure from rpt-2026-0019 was INDEPENDENTLY RECOUNTED by
        counting outcome columns per axis from results/matrix.tsv, without
        reference to the earlier audit, and CONFIRMED. The axes are
        map_key_sort and float_shortest_form.
        LATER CHALLENGED, AND THE DISAGREEMENT IS RECORDED RATHER THAN
        RESOLVED (obs-2026-0058): an independent source-to-axis audit counts 4

primary_track_5_x_wing:
  three_inherited_beliefs_refuted:
    refuted_1: >
      spc-2026-0002 asserted, as a verified_conclusion, that draft-10 Appendix C
      has empty ct and ss fields and therefore no complete KAT vectors. FALSE.
      The orchestrator fetched draft-10 (61090 bytes) and read Appendix C at
      offset 37153: all three vectors are complete, starting seed 7f9c2ba4...
      with sk == seed and a full 1216-byte pk. The misreading came from the
      appendix HEADING, which carries an unresolved editorial TODO marker.
      Corrected in the artifact.
    refuted_2: >
      The "CFRG chairs requested regeneration of every value" blocker is NOT
      corroborated. The document is ISE-stream with no shepherd and was never in
      an RG Last Call; genuine CFRG documents in the same index do carry that
      marker. Issue #18 was opened and closed not_planned the same day. The only
      author response refuses to prepare an exhaustive CORNER-CASE suite, which
      is a different thing. HONEST LIMIT: the IETF mail archive was
      unreachable, so the order is UNCONFIRMED rather than disproven.
    refuted_3: >
      draft-10 EXPIRED on 2026-09-03; draft-11 (23 Sep 2026) is live.
  new_opened_this_session: >
    hyp-2026-0029 records IETF datatracker issue #28, OPEN since 2025-02-25 and
    never yet run: draft-11 5.5 does not say whether RFC 7748 6.1's all-zero
    check applies to X-Wing decapsulation, and two Appendix A implementations
    reportedly disagree. It needs no test vectors, so it is reachable without
    the blocked conformance work. The hypothesis records the framing trap
    explicitly -- if both implementations accept, that is NOT a violation,
    because the draft has no rule to violate -- and specifies three cells,
    because without controls an implementation that rejected everything would
    pass a naive reading. The issue attribution is INHERITED and not
    re-fetched; the hypothesis says so and makes confirming it its first
    acceptance criterion.
  additional_correction_made_this_session: >
    fnd-2026-0007 carried epistemic_status: verified_conclusion while its own
    status read disputed and its correction block listed three confirmed
    defects. Downgraded to interpretation, and its statement -- still readable
    at face value as asserting a stale draft-05 pin, wrong HPKE counts (96
    supported, not 127) and a fabricated ek_KEM caveat -- is now labelled
    superseded.
  what_this_unblocks_and_what_it_does_not: >
    DRAFT-VERSION REPRODUCIBILITY IS UNBLOCKED: Appendix C is bit-stable across
    at least revisions -05, -08, -10 and -11, so a match is a match against the
    CURRENT revision and there is no superseded-draft mismatch.
    STANDARDS CONFORMANCE REMAINS BLOCKED by four independent conditions: no RFC
    exists (std_level null, ISE, Informational, no shepherd); the draft still
    disclaims its own vectors via that unresolved TODO eleven revisions in;
    issue #28 "Ambiguity of X25519 shared secret validation" has been OPEN since
    2025-02-25 with CIRCL and BoringSSL demonstrably disagreeing on low-order
    input; and consequently a vector match can never be reported as RFC
    conformance.
  recommended_next_experiment: >
    Issue #28 is the higher-information target over another vector match: an
    open, currently divergent, runtime-observable question with two production
    implementations on record disagreeing.
  also_found: >
    exp-2026-0024 and hyp-2026-0014 build suite_id as "KEM"||0x647A||"KDF"||
    0x0002||"AEAD"||0x0001; RFC 9180 5.1 defines suite_id as 10 bytes beginning
    "HPKE" and HKDF-SHA256 is 0x0001, not 0x0002. That harness cell measures
    its own bug. Also: .scratch/msn-2026-0009/xwing_ref.py asserts the label
    constant against itself and defines expected_empty that is never compared to
    anything.

primary_track_6_governance_and_ci:
  ci_was_not_green_and_this_was_missed:
    evidence: >
      At 09a0bf9: clang-embed-crash run 37226150273 failure, ssh-loopback-stage-c
      run 37226150370 failure. Both also failed on 7532d4c and on 67c370c.
    root_cause_1: >
      clang-embed-crash wrote to /etc/apt/trusted.gpg.d and invoked apt-get
      without sudo on an unprivileged runner.
    root_cause_2: >
      ssh-loopback-stage-c ran `set -euxo pipefail` and then invoked the real ssh
      client, whose exit code IS the measurement (255 on handshake abort), so
      set -e killed the step before SSH_EXIT and every capture ran. A SECOND
      latent defect: the captures referenced $COHORT and $STIMULUS, never
      defined, and under set -u an unbound expansion aborts before a trailing
      `|| true` applies.
  ci_repair_verified:
    clang-embed-crash: >
      VERIFIED GREEN, run 37229110647 on branch
      ci/fix-clang-embed-and-ssh-stage-c. Observed by run ID.
    ssh-loopback-stage-c: >
      The fix is verified to WORK -- run 37229113319 now emits per-stimulus
      "VERDICT ... verdict=harness_error", the capture that was previously
      impossible. The run is still RED, and that redness is a REAL research
      result: stagec/main.go maps an upstream sshd EOF to harness_error because
      the harness cannot distinguish "server rejected the mutated key" from
      "the relay broke". This is the pre-existing Stage C strict-KEX harness
      defect, now VISIBLE in CI for the first time. It was deliberately left
      red; making it green by suppressing harness_error would hide a known
      limitation.

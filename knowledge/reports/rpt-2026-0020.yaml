primary_track_1_fnd_2026_0016:
  outcome: >
    NOT PROMOTED. The behavioural observation survives; the classification is
    REFUTED; the cohort label is CORRECTED.
  the_decisive_refutation:
    finding: >
      RFC 5280 section 6.2 states verbatim: "An implementation MAY augment the
      algorithm presented in Section 6.1 to further limit the set of valid
      certification paths that begin with a particular trust anchor. For
      example, an implementation MAY modify the algorithm to apply a path length
      constraint to a specific trust anchor during the initialization phase ...
      Thus, the path validation algorithm presented in Section 6.1 defines the
      minimum conditions for a path to be considered valid."
    why_it_decides: >
      The measured behaviour is the RFC's own worked example of a permitted
      augmentation. 6.1 is a MINIMUM, not a ceiling, and 6.2 layers explicit
      MAY-permitted tightenings on top. Being stricter than a stated minimum is
      conformant, so two cores doing it is evidence of a shared, sanctioned
      policy choice, not of an error.
    orchestrator_verified_directly: >
      RFC 5280 re-fetched in this session: 352580 bytes, sha256
      a2f2628c0a83b873fc4786abd921f9b2c02395954b655d190bf16b831633345d,
      matching the recorded source_identity exactly. The three decisive phrases
      were located in the whitespace-normalized text at offsets 194666, 195006
      and 195937. This is a direct observation, not a relay of the review.
    what_it_closes: >
      rev-2026-0020's own recorded blocker said "No erratum or design
      documentation was consulted on whether the trust anchor's own
      pathLenConstraint should bind". The design documentation is 6.2 and it
      authorises the behaviour.
  second_refutation_core_identity:
    finding: >
      There is no rustls-webpki in cryptography 50.0.1's dependency closure.
      The shipped CycloneDX SBOM enumerates the complete Cargo closure and
      contains cryptography-x509-verification 0.50.1, a first-party pyca crate
      depending only on asn1 and in-tree cryptography-x509. The Python layer is
      a pure re-export shim. The recorded error literal "path length constraint
      violated" is pyca's OWN string in policy/mod.rs; rustls-webpki's
      PathLenConstraintViolated renders via Debug and never emits that prose.
    withdrawn: >
      exp-2026-0037's argument that the string is "webpki's wording" is
      INVERTED and is withdrawn.
    independence_survives_on_better_grounds: >
      certvalidator is wbond's (Will Bond, MIT, independent author), NOT
      pyca's. An intermediate agent asserted both were pyca-maintained; that
      assertion is itself refuted from the installed package metadata. The two
      cores share no code, vendor, or ancestry, and reach the same verdict by
      two different internal mechanisms.
  third_result_source_level_blocker_discharged:
    finding: >
      The mechanism is located in both cores. In pyca's crate the trust anchor
      is validated as an ISSUER at current_depth=0 (where pathLenConstraint=0 is
      not violated by itself) and is then RE-ENTERED as the working certificate
      at current_depth=1, where 1 > 0 fires. Depth 0 belongs to the LEAF, which
      is why reading valid_issuer alone gives the wrong answer. certvalidator
      instead seeds the budget from the anchor at INITIALISATION
      (validate.py:283-289, "Step 1 k"), 22 lines after a comment in the same
      function stating the anchor is not part of the path.
    significance: >
      This discharges the blocker rev-2026-0020 listed as outstanding, under the
      correct crate name.
  a_fragility_the_reviewers_found_in_the_previous_reports_own_reasoning: >
    The previous report cited "Step (3) is performed for all certificates in the
    path except the final certificate" as THE decisive clause. That sentence
    excludes certificate n. The trust anchor is a DIFFERENT exclusion, resting
    on 6.1's separate sentence plus the structural definition in section 6. A
    reader given only the step-(3) quotation would infer 6.1.4 is applied TO
    the anchor, which is backwards. The conclusion was right; the single-clause
    presentation was a fragility. Both clauses are now recorded.
  g11_status: >
    DISCHARGED. The two decisive 6.2 checks are recorded with a non-author
    checker (SPEC-DERIV-1, briefed to disagree). The gate now reports ALLOW for
    fnd-2026-0016 -- and the finding is STILL candidate, because the normative
    reading does not support promotion. A passing gate is not a promotion, and
    that distinction is asserted as a test.
  disagreements_preserved:
    prior_verdict: "rev-2026-0020: PROMOTE WITH SCOPE REDUCTION"
    this_verdict: "rev-2026-0021: DO NOT PROMOTE, reclassify"
    neither_is_discarded: >
      rev-2026-0020 correctly found the fourth wrong oracle and correctly forced
      the self-issued withdrawal. rev-2026-0021 correctly found that what
      survived is not a violation. Both are retained.
  what_this_track_did_NOT_establish:
    - >
      The control sweep over anchor pathLenConstraint in {absent, 1, 0} was
      DESIGNED and specified so it can be run verbatim, but NOT executed. It is
      the cheap remaining check that would close the causal claim at DER byte
      level rather than by generator intent.
    - >
      No implementation was executed this session. The c17 result is carried
      from obs-2026-0050 and re-explained from source, not re-measured.


x509_research_question: >
  Does RFC 5280 require the self-issued pathLen exemption that C2SP x509-limbo
  expects, and do the implementations that reject its testcase deviate from it?

normative_source_derivation:
  source: RFC 5280, 352580 bytes, SHA-256 A2F2628C0A83B873FC4786ABD921F9B2C02395954B655D190BF16B831633345D, May 2008, Standards Track
  decisive_clause_never_previously_cited: >
    RFC 5280 6.1: "Step (3) is performed for all certificates in the path
    except the final certificate." Step (3) IS 6.1.4, which is where the
    path-length decrement and clamp live, so the final certificate is excluded
    from path-length processing entirely. This clause is four paragraphs away
    from the loop body everyone had been reading, and no inherited source cited
    it -- not x509-limbo, not implementation folklore, not Frontier's reports.
  structural_finding_from_SA_4: >
    "intermediate certificate" is NEVER DEFINED in RFC 5280. It occurs exactly
    once, in the 4.2.1.9 parenthetical. The counting rule rests on a positional
    reading of section 6.1, not on a defined term.
  convergence: >
    Per AGENTS.md, agent agreement is NOT treated as proof. The decisive evidence
    is the normative text plus independently reproducible execution, both
    recorded. All 10 quotations in the two artifacts are verified byte-exact
    against the fetched source by tests/test_x509_pathlen_citations.py, which
    pins the source's byte count and digest so a stale or substituted text
    cannot make the check pass vacuously.

test_corpus_design:
  scale: 20 cases, 45 generated certificates, 42 distinct subject DNs
  construction: >
    Deterministic P-256 scalars from a fixed-seed SHAKE-256 stream. Self-issued
    status is controlled BY CONSTRUCTION as the key-rollover shape RFC 5280
    6.1.1 describes: subject DN equals issuer DN, signed by the issuer's key --
    explicitly NOT self-signed.
  three_enforced_structural_invariants:
    - chain integrity per RFC 5280 6.1(a)-(c), checked mechanically
    - DN uniqueness modulo issuance, with distinct serials
    - discriminating-pair isolation (one changed observable)
  why_invariants_matter: >
    They were added because two earlier corpus versions had 6.1(a) violations
    that would have made every path-length observation on those chains
    uninterpretable.

oracle_design_and_its_four_failures: >
  The oracle implements ONLY the path-length part of RFC 5280 6.1. It was wrong
  four times, and the progression is the most useful methodological result of
  the session:
    v1  Applied 6.1.4 to the final certificate. Caught by the corpus.
    v2  Replaced (l)'s budget test with a pre-decrement threshold. Caught by
        the corpus.
    v3  Computed a check but never gated the verdict on it. Caught by the
        corpus.
    v4  Replaced the literal 6.1 walk with a per-position reformulation from
        4.2.1.9's prose, silently dropping 6.1.4(m) for self-issued
        certificates; also inverted the (l)/(m) execution order. Found by the
        INDEPENDENT REVIEWER, and NOT catchable by the corpus.

  v4 is the instructive one. The two formulations disagree because 6.1.4(l) is
  guarded on "not self-issued" while 6.1.4(m) is NOT, so any per-position rule
  that skips the check for a self-issued certificate drops (m)'s effect for
  exactly the certificates where it bites. **A reformulation of a specification
  is not a neutral simplification when the specification contains both
  formulations.** All four wrong versions are preserved in oracle.py.

implementation_cohort_and_independence:
  measured:
    - rustls-webpki, via pyca/cryptography 50.0.1's x509.verification
    - pyca/certvalidator 0.11.1 (pure-Python RFC 5280 6.1 transcription)
  not_measured: >
    OpenSSL, LibreSSL, BoringSSL, AWS-LC, Go crypto/x509, GnuTLS. NO CLAIM IS
    MADE ABOUT ANY OF THEM. Two agents died reading their sources and none was
    built locally.
  lineage_established_from_history: >
    BoringSSL's root commit names its upstream ("Initial fork from
    f2d678e6e89b6508147086610e985d4e8416e867 (1.0.2 beta)"), and AWS-LC shares
    7042 bit-identical commit SHAs with BoringSSL. So the BoringSSL and AWS-LC
    rows in the x509-limbo table are CORRELATED, not independent.
  correction_to_a_session_brief_premise: >
    The brief asserted pyca/cryptography had no pathLen enforcement. IMPL-5
    established it does, and that its verification path is compiled Rust
    vendoring rustls-webpki -- NOT the platform OpenSSL. The platform libcrypto
    reports "OpenSSL 4.0.2", which is irrelevant to this code path and is a
    coincidence worth noticing.

exact_matrix_results_after_correction:
  agreement: certvalidator 19/20, rustls-webpki 16/20 (both reproduced from a clean state)
  surviving_shared_divergence:
    c17_anchor_constrained: >
      root(pathlen:0) -> ICA -> EE. Both cores REJECT with reason class
      path_len. RFC 5280 6.1 says the self-signed trust anchor "is not included
      as part of the prospective certification path", and the algorithm has no
      step reading the anchor's own constraints. SA-1 corroborated this
      independently by noting max_path_length is initialised to n, not n+1.
  withdrawn_after_review:
    c13_pair2_selfissued: >
      Previously appeared to be a divergence. The oracle was wrong; corrected,
      it REJECTs, and certvalidator agrees. Frontier was disagreeing with a
      correct implementation.
  unexplained_open_question:
    c11_pair1_selfissued: >
      certvalidator ACCEPTS, rustls-webpki REJECTs with reason string
      "candidates exhausted: signature does not match". Direct signature
      verification proves the string is misleading here, so the mechanism is not
      identified. NOT claimed as a conformance failure.

source_level_discrepancy_analysis: >
  certvalidator seeds max_path_length from the trust anchor's own
  pathLenConstraint at validate.py:286-289, while a comment in the same
  codebase states the anchor is not part of the path. Code contradicting its own
  stated model is stronger evidence of an unintended convention than two cores
  disagreeing would be. The corresponding location inside rustls-webpki was NOT
  identified.

independent_reproduction: >
  REV-1 regenerated the corpus independently, re-derived the predicate from the
  RFC before reading the oracle, and reproduced every recorded verdict. Its
  reproduction DISAGREED with the oracle on c13 -- which is what exposed v4.
  The orchestrator then re-verified REV-1's central claim directly against the
  RFC offsets (6.1.4(l) at 4836, (m) at 4840) before acting on it.


formal_method_track_FORMAL_208: >
  msn-2026-0021 (FORMAL-208) was continued by a dedicated agent and REMAINS ACTIVE.
  It produced formal/Formal/EkCheck.lean (~700 lines, 51 theorems), imported from
  formal/Formal.lean so CI's lean_lib cannot silently skip it -- the defect the
  mission records, verified empirically: lean_lib builds the import closure of
  the root module, not a filesystem glob.

  WHAT THE DESIGN GETS RIGHT. The mission's central complaint was that
  FORMAL-203/204/205 stated a rule about an UNBOUNDED byte array: `Nat -> Nat`,
  infinite and lengthless. EkCheck's `Ek k` is `Fin (384 * k + 32) -> Nat`, so
  the bounded index lives in the TYPE and the section 7.2 step-1 type check
  holds by construction rather than as a proposition nobody can inhabit. `k` is
  load-bearing, repairing the provably-unused parameter `p`. The T1/T2 pairing
  the mission called `critical_constraint` is present, with an explicit witness
  that T1's hypothesis is satisfiable -- an accept-only theorem would be
  satisfiable by an uninhabited hypothesis, which is exactly how FORMAL-205 was
  vacuous.

  WHAT THE KERNEL SAID: IT FAILS. GitHub Actions run 37221348965 (formal-verify,
  commit 8c99e73) ran `lake build` with Mathlib and the module DOES NOT COMPILE.
  Roughly 30 errors, of several kinds: `omega could not prove the goal` (Lean
  supplies a concrete counterexample, e.g. line 209 with a := k), `rewrite`
  finding no instance, `show` pattern failures, application type mismatches, and
  `rfl` failures.

  This REFUTES the implementing agent's claim that the module "resolves cleanly
  under the Lean front end". A front-end-only check is not a type check, and the
  weaker check was reported as though it were the stronger one -- a process defect
  as well as a technical one. Commit 0c154e3 records the refutation explicitly
  rather than leaving the earlier commit message to mislead a later reader.

  The DESIGN is therefore unrefuted while the PROOFS are refuted. The mission
  budget's max_compute_runs: 5 has consumed one run. formal/axioms.txt is
  deliberately UNCOMMITTED: it can only come from a successful build, and
  producing it any other way would fabricate a build artifact.


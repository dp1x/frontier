cohort_independence: |
  - pycose ↔ go-cose: CORRELATED at the level of both being "COSE WG
    ecosystem" but INDEPENDENT at the implementation level (different
    languages, different authors, different CBOR backends).
  - cbor2 ↔ fxamacker/cbor: INDEPENDENT CBOR implementations (different
    languages, different authors, different sort algorithms). pycose
    uses cbor2; go-cose uses fxamacker/cbor; Frontier oracle uses its
    own cleanroom implementation.
  - Test vectors: GENERATED by Frontier cleanroom (no library uses these
    vectors as a corpus).


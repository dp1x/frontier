  msn_2026_0011_execution: |
    msn-2026-0011 - Stage C OpenSSH client-side decapsulation parity audit.

    Built interop/protocol-placement/ssh_loopback/stagec/main.go - a Go MITM harness
    that relays real OpenSSH ssh client through a real OpenSSH sshd with tampered
    C_INIT. Built .github/workflows/ssh-loopback-stage-c.yml - GHA workflow
    matrix {cohort} x {stimulus}.

    GHA run 33304434203 (Stage C matrix):
    - All 6 stimuli produced handshake_aborted_sigfail verdict (including control)
    - OpenSSH portable 10.5 defaults to strict-KEX ordering (RFC 9142 /
      kex-strict-s-v00@openssh.com extension)
    - The MITM mutator does not track the strict-KEX sequence number, causing
      even the control case to abort
    - Harness defect identified: not a protocol verdict
    - sshd log confirms: server completes KEX (lenient on C_INIT per fnd-2026-0009),
      sends S_REPLY + NEWKEYS, switches to encrypted mode (ssh_set_newkeys mode 1)

    Source-code audit (commit 0ef0f5a8):
    kexmlkem768x25519.c lines 230-290 (kex_kem_mlkem768x25519_dec) and
    kexsntrup761x25519.c analog confirm only sshbuf_len(server_blob) != need
    check before crypto_kem_*_dec.

    On the client side, this is NOT a FIPS 203 s7.2 modulus check concern because
    s7.2 is on ek not ct. The client's FIPS 203 surface is s7.3 (decapsulation
    input checks via implicit rejection), delegated to crypto_kem_mlkem768_dec.

    Adversarial critic (rev-2026-0010) analyzed 16 attack scenarios:
    - Pure tampered C_INIT (no MITM): IRRELEVANT (cannot affect other parties)
    - MITM tampers C_INIT, no host key: LOW (signature fails; same outcome as strict)
    - MITM + stolen host key: LOW (cannot predict K_PQ_client via implicit-rejection)
    - MITM + X25519 tampering: LOW (X25519 validation catches it)
    - Server reaches NEWKEYS but client doesn't: LOW (SSH transport design prevents partial handshake)
    - Wire-visible disconnect reason: IRRELEVANT (same in both cases)
    - Server log "incorrect signature": LOW (operator-side, not wire-visible)
    - Repeated tampering DoS: LOW (constant work; not new vector)
    - Tampered C_PK2 + rogue server: LOW (game-over; leniency doesn't add vector)
    - Server-side timing oracle: LOW (ML-KEM is constant-time)
    - Strict server + lenient client (s7.3 missing): IRRELEVANT in practice (no production client is missing s7.3)
    - Post-quantum signature forgery: MED in future
    - FIPS 140-3 compliance: MED (regulatory, not security)
    - Cleaner error reporting: LOW (strict gives better diagnostics)
    - Classical KEX precedent: LOW (same pattern deployed ~20 years)
    - Production deployment evidence: LOW (24-month pattern, external scrutiny)

    Overall verdict: lenient client is MODERATE (compliance + future defense-in-depth),
    NOT CRITICAL or MODERATE-exploitable.

    Outcome: fnd-2026-0010 promoted to verified_conclusion with full evidence chain.
    Mission terminalized with structural safety net = SSH exchange-hash signature
    verification, which catches any K_PQ_server vs K_PQ_client divergence.

  msn_2026_0012_execution: |

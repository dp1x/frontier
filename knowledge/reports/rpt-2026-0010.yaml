  verified_findings: |
    fnd-2026-0010 (verified_conclusion):
      "OpenSSH portable master HEAD ssh client is structurally symmetric
      to the server in being length-only lenient on its KEM half input.
      However, on the client side this is NOT a FIPS 203 s7.2 modulus check
      concern because s7.2 is defined for encapsulation keys (ek), not
      ciphertexts. The structural safety net is the SSH exchange-hash
      signature verification, which catches any K_PQ_server vs K_PQ_client
      divergence. Per adversarial critic analysis of 16 attack scenarios,
      the lenient client does NOT enable any active MITM attack. Therefore
      this is a compliance gap symmetric to fnd-2026-0009, NOT a security
      vulnerability."

    fnd-2026-0011 (verified_conclusion):
      "Frontier's standard GHA ubuntu-latest CI image ships clang-18.1.3
      and gcc-13.3.0 (both released March/April 2024, predating the October
      2024 C23 finalization). Neither system compiler supports the C23
      #embed directive, which means the Frontier environment cannot
      reproduce LLVM upstream bugs #212075 (HandleEmbedDirective assertion)
      or #219332 (BumpPtrAllocator OOM) without explicit clang-19+ or
      gcc-15+ installation. The harness (run_embed_matrix.sh) successfully
      executed all 13 stimuli on both system compilers and produced per-cell
      verdicts (26 cells, all 'rejects_with_error', zero crashes)."


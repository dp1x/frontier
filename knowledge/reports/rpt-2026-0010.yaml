  important_failures: |
    Harness recvPacket EOF bug (msn-2026-0011):
      - The harness's recvPacket of the post-C_INIT response returns EOF in
        the original Stage A/B harness. Root cause: residual timing/alignment.
      - Per SSH design analysis agent: not really a bug -- the lenient
        branch requires reading at least 2 packets (KEX_REPLY then NEWKEYS),
        and the harness's single-recvPacket architecture is undersized.

    Strict-KEX seqnum (msn-2026-0011):
      - Stage C mutator triggers handshake_aborted_sigfail on all stimuli
        including control. Root cause: OpenSSH portable 10.5 defaults to
        strict-KEX ordering (RFC 9142 / kex-strict-s-v00@openssh.com extension);
        mutator does not relay the strict-KEX sequence number reset.
      - Identified as harness defect, not protocol verdict.

    GHA apt-get permission denied (msn-2026-0012):
      - First 2 attempts: apt-get install failed (GHA user not root, despite docs)
      - Third attempt: drop sudo, still failed (no permission for /var/lib/dpkg)
      - Fourth attempt: drop apt-get update, still failed (lock file permission)
      - Final fix: use system pre-installed compilers (clang-18, gcc-13)
      - Bonus: documented environment capability gap

    apt.llvm.org install (msn-2026-0012):

    Pre-activation gates passed:
    - GitHub API verified both #212075 and #219332 exist (creator: k-arrows,
      labels: clang:frontend, crash-on-invalid, generated by fuzzer, embed)
    - Both bugs are public (not embargoed); characterization study, not
      fresh vulnerability disclosure

    GHA run 33307657900 (system clang + gcc):
    - System clang-18.1.3 + gcc-13.3.0 (both predating C23 finalization Oct 2024)
    - All 26 cells (13 stimuli x 2 compilers) produce 'rejects_with_error'
    - Zero crashes -- system compilers cleanly reject #embed
    - This is itself a Frontier-grade finding: documenting that the
      GHA ubuntu-latest default image cannot run C23 #embed tests without
      explicit clang-19+/gcc-15+ installation

    GHA run 33308097591 (attempted clang-19 install via apt.llvm.org):
    - Failed: GHA user lacks permission to write /etc/apt/trusted.gpg.d
    - Workaround: requires containerized build or pre-installed base image

    Outcome: fnd-2026-0011 promoted to verified_conclusion with full evidence chain.

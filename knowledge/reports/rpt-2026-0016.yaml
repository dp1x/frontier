what_was_done: >
  Nine parallel subagents, each an adversarial-critic or specification-analyst
  with an explicit goal of DISPROVING one target. They were given the two
  failure modes observed when fnd-2026-0009 was refuted the previous day as
  attack templates: (a) reading an abstraction layer above where validation
  actually happens, and (b) empirical evidence contradicting the cited source
  without anyone reconciling them. Auditors read real source at pinned commits,
  traced to the leaf primitive, reconciled source against any logged evidence,
  ran mandatory novelty checks, and marked every claim
  VERIFIED / INFERRED / COULD-NOT-DETERMINE.

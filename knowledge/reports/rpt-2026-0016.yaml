  known_limits_stated_by_its_author: >
    Checks that a quoted sentence appears SOMEWHERE in the cited RFC, not that
    it is from the right SECTION. Tier 2 covers RFCs only; GitHub citations are
    reachability-checked, so the one-layer abstraction defect that refuted
    fnd-2026-0009 is NOT detectable by this tool. sha_shape confirms
    well-formedness, not existence. link_withdrawn is deliberately noisy.
sntrup761_question_settled: >
  No mandate exists. draft-ietf-sshm-ntruprime-ssh (now RFC 9941) states
  explicitly that "No further validation is required beyond what is described in
  RFC7748, RFC8731 and NTRUPrimePQCS", and the NTRU Prime spec's Encap has no
  failure branch. A SUPERCOP implementation that reduces rather than rejects is
  conformant. The ML-KEM case is different in kind: FIPS 203 section 7.2 names a
  check and imposes it with "shall" independently of SSH. Detail in
  rev-2026-0018.
preserved_negative_results:
  - "OpenSSL's d2i_PUBKEY over-length acceptance is real but is standard d2i trailing-byte behaviour, identical across every algorithm; no ML-KEM-specific vulnerability exists."
  - "cbor2's canonical=True implements RFC 8949 section 4.2.3 length-first, not section 4.2.1. Adding canonical=True would NOT satisfy RFC 9052 section 9."
  - "Frontier's own cbor_oracle shipped a section 4.2.3 sort mislabelled as section 4.2.1 from 2026-08-31 to 2026-09-02, and the whole evidence chain was built on it."
  - "A raw-vs-DER matrix will ALWAYS show this asymmetry unless the harness checks the consumed length."
  - "All three Lean proofs are sound: no sorry, axiom, native_decide, admit, unsafe, partial or opaque anywhere. The defects are in what they are claimed to prove."
disclosure_posture: >
  NOTHING may be disclosed in its current state. Three findings would have
  produced false reports: fnd-2026-0002 (harness artifact, and the proposed fix
  would make ML-KEM the only algorithm in OpenSSL to reject a trailing buffer),
  fnd-2026-0013 (built on a mislabelled oracle), fnd-2026-0005 (already
  non-novel; aws-lc #2891). The OpenSSH pair was withdrawn 2026-10-02.
meta_finding: >
  Every substantive failure was an EVIDENCE-CHAIN failure, not a reasoning
  failure: a harness that tested the wrong thing, an oracle with the wrong
  function under the right docstring, a citation to a different layer than the
  one audited, a fabricated byte count, stub scripts posing as real ones. The
  two templates - one layer too shallow, and evidence contradicting source
  without reconciliation - appear here AND in the 2026-10-02 OpenSSH
  refutation. That consistency is itself the finding: the corpus was assembled
  without a check that the evidence matches the claim. The deterministic tool
  closes the citation half of that gap; the abstraction-layer half requires
  source-reading review and cannot be automated cheaply.

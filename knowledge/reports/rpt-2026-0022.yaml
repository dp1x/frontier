THE_MOST_IMPORTANT_FINDING_OF_THE_SESSION:
  statement: >
    THREE of the session's own working assumptions were wrong, and all three
    were caught by fetching primary sources rather than by reasoning.
  they_were:
    - assumption: "the PNG criticality bit is the HIGH-ORDER bit (0x80) of the chunk type's first byte"
      reality: >
        It is bit 5 (value 32), the low-order CASE bit. Section 5.3 restricts
        type bytes to 0x41-0x5A and 0x61-0x7A, so bit 7 is ALWAYS 0 and carries
        no meaning. A generator setting 0x80 emits an ILLEGAL type byte and
        fails framing before criticality is ever evaluated. The entire
        experiment would have measured nothing.
      who_caught_it: "BOTH the source-verification track and the harness track, independently"
    - assumption: "X.690 requires DER DECODERS to reject non-minimal INTEGER encodings"
      reality: >
        X.690 imposes NO decoder obligation whatsoever. The minimality rule is
        real, mandatory, and binds the ENCODER. Searching the full normalised
        text for reject / error / must reject / shall detect / non-conforming /
        conformity / minimal returns ZERO hits. The only receiver-directed
        clause, 7.3, says a conforming receiver must SUPPORT ALL ALTERNATIVES.
      consequence: >
        The DER mission as briefed was unanswerable. It cannot call decoder
        acceptance a spec violation without fabricating the anchor.
    - assumption: "YAML requires unique mapping keys"
      reality: >
        YAML 1.2.2 contains no MUST/SHALL/REQUIRED co-occurring with "unique".
        1.2.1 section 1.3 DID carry one. The revision appears to have deleted
        the MUST while retaining the uniqueness property, with no errata.


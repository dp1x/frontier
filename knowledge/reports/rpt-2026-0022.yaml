THE_ADVERSARIAL_TRACK_ON_THE_MISSION_JUSTIFICATION:
  commissioned_to: "disprove the quantified-vacuity argument"
  verdict: "the 99% figure was right to two significant figures but its arithmetic was wrong by an off-by-one"
  the_error: >
    22 seed-region segments were counted, but only 21 can be non-canonical.
    Segment 533 has only 4 live bits (the key ends at bit 6400; the segment
    spans 6396..6407) and can never reach 3329.
  the_numbers: "audit (3329/4096)^22 = 98.9553%; actual (3329/4096)^21 = 98.7146%"
  the_orchestrator_re_derived_it: >
    Independently, from a bit-level segment model. It confirmed the off-by-one
    AND caught an error in the REVIEW itself: the reviewer said segment 512
    straddles bytes, but 12*512 = 6144 is bit 0 of byte 768, so it does not
    straddle. The straddling segments are the odd ones (513, 515, ...). Both
    the original error and its correction are recorded rather than one silently
    replacing the other.
  the_conclusion_is_unaffected: "98.71% still establishes the vacuity. The T1/T2 pairing requirement stands."
  recorded_in: obs-2026-0067

A_SESSION_ERROR_WORTH_RECORDING:
  the_opportunity_scan_first_attempt: >
    Failed after consuming ~1.0M tokens, with a serialization error, having read
    far more of the repository than the task required. It wrote NOTHING -- no
    output directory survived. Relaunched with an explicit budget discipline
    instruction and it completed in 226 seconds and 33 tool calls.
  the_lesson: >
    A subagent prompt that says 'read the repository for context' can burn an
    entire agent on reading. The relaunched prompt named exactly two files to
    read and told it to write output EARLY so a crash could not lose
    everything.


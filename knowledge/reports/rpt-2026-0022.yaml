STRONGEST_NEXT_CANDIDATES_ranked_by_information_gain:
  - candidate: "Build libpng and libspng on GitHub Actions and run the same eleven PNG vectors through them."
    why: >
      libpng is the most widely deployed PNG core in the world. Every scope
      claim about 'PNG decoders' is weak without it, and the two cores that
      disagree are exactly the two that do not link libpng. Medium compute, so
      it belongs on CI per AGENTS.md's HARD RULE.
    expected_gain: "high -- it decides whether the observed split is 'two ecosystems' or 'two bugs'"
  - candidate: "FORMAL-208 convergence -- but by a DIFFERENT approach."
    why: >
      The repair reached 4 errors at commit 17a6d2d and then oscillated to 31
      before being stopped at 21. Iterating tactics against this file is not
      converging. The next attempt should rewrite the four failing proofs from
      the definitions rather than continue patching, and should consider
      reducing scope: T1+T2 over a concrete k may be provable where the
      fully-general form is not.
    starting_point: "git checkout origin/formal-208-repair -- formal/Formal/EkCheck.lean at 17a6d2d, which is the best known state (4 errors), NOT the branch tip."
    expected_gain: "high -- it is the only path to a kernel-checked FIPS 203 7.2 model"
  - candidate: "QUIC frame-type over-long varint (RFC 9000 12.4), from the opportunity scan."
    why: >
      A genuine MUST/MAY asymmetry in ONE clause: the sender 'MUST use the
      shortest possible encoding' while an endpoint 'MAY treat' a longer one as
      a connection error. 24 of 40 proposed vectors discriminate. It asks
      whether an obligation written for the sender constrains the decoder --
      precisely the failure mode this repository has been refuted on twice.
    blocker: "QUIC frames are invisible until header decryption, so the oracle cost must be measured first. If each vector needs fresh key derivation the compute class rises and the UTF-8 candidate overtakes it."
  - candidate: "RFC 3629 decoder obligation (from the opportunity scan)"
    why: "51 of 64 vectors discriminate, and it is the cheapest oracle on the list -- no network, no crypto."
    caveat: "Section 4's ABNF self-declares it is NOT authoritative, so the oracle must be built from section 3's invalidity classes instead."
  - candidate: "hyp-2026-0033, the YAML layer census"
    why: "The integer-format duplicate divergence is real, reproduced, and cheap to extend to non-scalar keys, which no parser tested demonstrably handles per 3.2.1.3's recursive key-equality definition."
    caveat: "No conformance framing is permitted -- there is no requirement to conform to."


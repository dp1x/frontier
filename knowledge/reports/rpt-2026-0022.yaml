THE_CI_DEFECT_IN_DETAIL:
  runs_that_were_red: [37304311430, 37303791072, 37310294620]
  cause: >
    tests/test_x509_minimal_corpus.py imported its generator at module scope,
    which imports `cryptography` at module scope. pyproject declares only
    pyyaml and jsonschema; CI installs `".[dev]"` and therefore has no
    cryptography. The failure is a COLLECTION error, which aborts the entire
    run before any test executes.
  why_it_was_invisible_locally: >
    The local venv has cryptography as a transitive of other research work, so
    the suite passed here by construction. The only observable was the CI run,
    and the defect is what disabled the CI run.
  the_precedent_it_repeated: >
    fb2279c had already fixed this exact class in the sibling module
    test_x509_corpus_reproducibility.py. The new module placed the guard
    INSIDE a test body rather than ABOVE the import that triggers collection.
  the_durable_guard: >
    tests/test_ci_dependency_isolation.py runs a meta-path blocker in a
    subprocess and collects every test module, asserting none errors when an
    undeclared dependency is absent. Two meta-tests write a known-bad and a
    known-good module and assert the collector flags exactly one, so the guard
    cannot go blind.
  two_defects_in_the_guard_itself: >
    It recursed into its own module until the subprocess timeout, and its first
    version EXECUTED each target module rather than collecting it. Both fixed;
    --collect-only brought the scan to 4.24s.
  recorded_in: obs-2026-0064

THE_PNG_EXPERIMENT:
  normative_basis: "spc-2026-0007 -- W3C PNG Third Edition, REC 2025-06-24, SHA-256 A3AC82BB9EB8664B93961A2A9FF6DEF3D70E3A9F63D92721143C1F391D04EDEC"
  corpus: "11 vectors, 9 discriminating, committed at crypto/png-critical-chunk/"
  the_vacuity_that_was_eliminated: >
    A prior framing was vacuous because a bad CRC let the decoder reject before
    criticality was evaluated. Every non-control vector here carries a valid,
    independently recomputed CRC, and the negative controls exist precisely to
    keep that confound visible.
  cohort: "Pillow 12.3.0, Go image/png go1.26.4, stb_image v2.30, Wuffs 0.3.5 -- none links libpng, established from shipped binaries not names"
  result_on_the_decisive_pair:
    stb_image: "REJECTS for the right reason"
    wuffs: "REJECTS for the right reason"
    pillow: "SILENTLY ACCEPTS AND RENDERS"
    go_image_png: "SILENTLY ACCEPTS AND RENDERS"
  the_headline_instrument_fact: "GENERIC_DECODE_ERROR = 0 of 44 cells."
  independent_reproduction: >
    Reproduced THREE times by separate code: the cohort agent, the
    orchestrator with a fresh script, and the adversarial reviewer with its own
    script and its own Go program. The reviewer additionally built nine
    vectors from a DIFFERENT constructor with four different probe types,
    three positions and four geometries; both cores silently accepted all nine.
  the_correction_the_review_forced: >
    obs-2026-0068 originally said "no warning was emitted, no callback fired".
    That is FALSE: Pillow calls logger.debug at PngImagePlugin.py:790. The
    orchestrator verified the line directly. The finding survives because the
    call is off by default, is emitted IDENTICALLY for the ancillary twin so it
    carries zero criticality information, is not an error, and is unreachable
    through the API. The defensible wording is "no CRITICALITY-DISCRIMINATING
    indication reaches the caller".
  a_second_correction: >
    PngImagePlugin.py:213 DOES read the ancillary bit, but only under
    LOAD_TRUNCATED_IMAGES and only to decide whether to skip a CRC check. It
    must not be conflated with the criticality gap. Verified directly.
  a_gap_in_a_core_that_otherwise_behaves_correctly: >
    Wuffs rejects in the primary position but ACCEPTS the same chunk after the
    image data, because its post-IDAT walk validates only IEND/fdAT/fcTL.
    "Rejects unknown critical chunks" is NOT one boolean property.
  not_established:
    - "libpng and libspng are NOT_BUILT. libpng is the most widely deployed PNG core; omitting it makes any scope claim weak."
    - "The stb_image and Wuffs contrast results were not independently re-verified by the reviewer."
    - "PNG-EXTENSIONS could not be retrieved, so known_to_spec remains UNVERIFIED at registry level."
    - "NO SECURITY CLAIM. Nothing demonstrates an exploitable consequence."
    - "No upstream report was filed and none should be until the cohort is widened."

THE_DER_MISSION_REFRAMED_BY_SOURCE_VERIFICATION:
  result: "X.690 imposes no decoder obligation. Recorded in obs-2026-0065 and spc-2026-0008."
  two_related_corrections:
    - "'The DER INTEGER rule is in clause 11' is WRONG. Clause 11 is titled 'Restrictions on BER employed by BOTH CER and DER' and has NO INTEGER subsection. The rule is BER clause 8.3.2, which DER inherits via clause 10 plus 7.4."
    - "A remembered RFC 5280 section 4.1 statement about the outer SEQUENCE length DOES NOT EXIST. 'outer' occurs once in the document, in the word 'outsider'."
  what_the_experiment_may_now_claim: "An encoder/CA conformance question, or an explicitly NON-NORMATIVE ecosystem-practice survey. It may NOT call decoder acceptance a spec violation."
  a_boundary_case_that_must_not_be_conflated: >
    0x80 = 128 REQUIRES its leading 00 to remain positive. 'Leading zero is
    always redundant' is wrong, and a vector set mixing the required case with
    the redundant case has ZERO discriminating power.

THE_YAML_RESULT:
  normative: "Dead end. YAML 1.2.2 has no normative duplicate-key requirement at all. obs-2026-0066."
  the_spec_regression: "1.2.1 section 1.3 carried a MUST; 1.2.2 appears to have deleted it while keeping the property, with no errata."
  a_trap_avoided: "No YAML revision has a security considerations chapter, so the popular 'duplicate keys are a signature-wrapping attack' framing is EXTERNAL to the spec and is not asserted here."
  what_survives: "hyp-2026-0033 -- a comparative LAYER census with no conformance framing."
  lineage_correction: "PyYAML and ruamel are ONE family. Both libyaml-derived; forcing PyYAML's pure-Python parser gave a byte-identical event stream to its C path. Three lineages, not four."
  the_sharp_result: >
    On `1:` vs `0o1:` -- the duplicate the spec itself names -- gopkg.in/yaml.v3
    silently yields two keys DESPITE a mandatory, unconfigurable uniqueKeys
    check, because it compares raw strings (ni.Value == nj.Value,
    decode.go:776) and cannot do the canonical-form comparison. The
    implementation that looks strictest misses the spec's named case. No
    high-level API test could have found this.


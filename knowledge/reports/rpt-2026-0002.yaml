    - exp-2026-0011 .NET Linux vs Windows backing (CNG vs OpenSSL) – harness patched to log backing=CNG|OpenSSL|NotSupported, workflow artifact collision fixed, Linux leg requires OpenSSL 3.5 build + LD_LIBRARY_PATH.


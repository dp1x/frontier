  WEB / PUBLIC-SOURCE RESEARCH PERFORMED (direct, autonomous, no human handoff)

  Per session instruction, research was not limited to GitHub and did not depend on human-mediated ai-io. All 8 scouts used web_search + web_fetch directly. Total distinct primary fetches ~45, negative results preserved where search space was exhausted.

  - Prior-art (aio-2026-0001): 20 distinct queries; fetched PQClean poly.c/kem.c, issues #607/#601/#560, PR #564, pq-crystals/kyber #107, mlkem-native kem.c, OpenSSL ml_kem.c + ml_kem_kem.c, BoringSSL mlkem.cc wrapper, CIRCL directory, Wycheproof front page (404 on expected JSON migrated to v1), ACVP I-D https://pages.nist.gov/ACVP/draft-celi-acvp-ml-kem.html, SP 800-227 final. Distinguished Kyber era (no check) vs FIPS 203 era (SHALL). No CVEs/GHSA, no published security analysis paper specifically on §7.2 modulus at encapsulation found – negative result recorded with confidence.
  - Protocol (aio-2026-0003): Fetched draft-ietf-tls-ecdhe-mlkem-05 §4.2 (server MUST §7.2 → illegal_parameter), draft-ietf-tls-hybrid-design-16 (no validation language), draft-connolly-cfrg-xwing-kem-10 §4/§5.6 (MUST inside Encaps), draft-westerbaan-cfrg-hpke-xyber768d00, RFC 9370 (zero ML-KEM mentions), draft-ietf-sshm-mlkem-hybrid-kex-10 §2.1 (MUST §7.2 → KEY_EXCHANGE_FAILED), FIPS 203 PDF. Searched TLS WG mailarchive, pqc-forum – no interop breakage thread retrieved (negative).
  - CMVP (aio-2026-0002): Searched for FIPS 140-3 IG, validated module certificates, ACVP encapsulationKeyCheck VAL class; retrieved SP 800-227 final §3.2 three assurance cases and ACVP I-D, but image-limit failure prevented full IG fetch – preserved as partial with next-step fetches enumerated.
  - Compilers: Searched C11 N1570 §6.5p6-7, GCC/LLVM Bugzilla, Csmith PLDI 2011, YARPGen, Alive2 PLDI 2021, CompCert, SysV psABI.
  - Formal: Searched mathlib4 GFI list (12 open), Lean Zulip, AFP (Isabelle-only, not applicable), miniF2F 488, ProofNet 371, LeanDojo 98k, mlkem-native proofs/cbmc + hol_light (no Lean).

  Only created ai-io/outputs when useful as durable provenance: aio-2026-0001.md, aio-2026-0002.md (partial), aio-2026-0003.md committed with frontmatter and autonomous-complete status. No task waited for human copy/paste.


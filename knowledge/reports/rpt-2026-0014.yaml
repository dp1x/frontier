external_impact_status: |
  NONE. Stated plainly because it would be easy to imply otherwise.

  - No upstream issue, pull request, patch, advisory or maintainer report has
    been filed for any Frontier finding.
  - No external party has consumed or independently confirmed any result here.
  - The FROST result is a single-implementation self-consistency check against
    the RFC's own vectors.
  - fnd-2026-0014 is the closest candidate for external impact and is blocked on
    a novelty check that has not been completed.

  What does exist: reproducible local results, a corrected and internally
  consistent evidence record, deterministic guardrails against two specific
  classes of agent-introduced defect, and an explicit statement of what is still
  missing.

    C. FIPS dimension of hyp-2026-0002 - RESOLVED to
       INCONCLUSIVE-AFTER-BUDGET (the OpenSSL 3.5.7 FIPS module
       does not include ML-KEM in its FIPS boundary, so the FIPS
       cell is structurally unanswerable, not a transient
       infrastructure issue).

    D. ALIAS-DIFF round 2 (msn-2026-0004 / exp-2026-0015) - GHA
       workflow + runner designed and verified (run 33225682327,
       660 rows, 0 divergent). The round-2 matrix ran end-to-end
       and produced a negative result for family-(d) TBAA
       violations on gcc 13.3.0 + clang 18.1.3 with both
       asm and opaque-tu barriers.

    E. BoringSSL/rustls for msn-2026-0005 - Scout completed;
       recommended deferring to GHA (no MSVC, no Windows SDK on
       this host). Concrete build plan + workflow YAML written
       to .scratch/msn-2026-0005-scout/REPORT.md. Mission
       remains pending; GHA workflow ready to be authored.

  ---

  HEADLINE RESULTS

    fnd-2026-0002: VERIFIED_CONCLUSION.

      Mechanism: OpenSSL 3.5.7's d2i_PUBKEY (SPKI import) accepts
      6 malformed ML-KEM encapsulation keys that
      EVP_PKEY_new_raw_public_key_ex (raw import) and .NET correctly
      reject. The 6 vectors are 3 len-plus-1 (body 1 byte longer
      than canonical) and 3 cross-set-* (foreign param-set body).
      The accepted keys then proceed to a successful EVP_PKEY_encapsulate
      producing a fully-formed ciphertext and shared secret.

      Root cause: the generic ASN.1 parser's BIT STRING c2i uses the
      BIT STRING's own declared body length, not the SEQUENCE's; the
      keymgmt trusts the parser-reported publen (= 22 + canonical body
      length) and silently discards 33 bytes (len-plus-1) or up to
      800 bytes (cross-set) of trailing over-shoot.

      Verification:
        - Source-level review: subagent 01a04aeb-8994, file:line
          citations (tasn_dec.c:283-308, 411-414; x_pubkey.c:175-196;
          ml_kem_codecs.c:213-225)
        - Independent reproducer: subagent 01a04aeb-8996, 5 fresh
          self-contained C programs on OpenSSL 3.6.3 MSYS2 local;
          directly observed parser-consumed=822 of 823 (len-plus-1 512)
          and 1206 of 1590 (cross-set-1024-as-768)
        - Empirical: GHA run 33223536290 on OpenSSL 3.5.7, all 6
          divergent vectors reproduced in openssl_invar_report.tsv
        - Cross-stack: all 4 non-OpenSSL-SPKI stacks (liboqs auto,
          liboqs forced-ref, .NET Windows CNG, .NET Linux OpenSSL-backed)
          reject the 6 vectors
        - Magnitude correction: from "1-byte over-shoot" to "33-byte
          over-shoot (len-plus-1) / up-to-800-byte over-shoot (cross-set)"

      Disclosure: public, low-severity, interoperability, no CVE.
      Upstream OpenSSL bug draft ready at
      .scratch/upstream-openssl/ISSUE.md (246 lines, awaiting
      human review before posting).

    fnd-2026-0003: VERIFIED_CONCLUSION (FORMAL-203).

      Three top-level theorems in formal/Formal/ByteEncode.lean:
        T1 canonicalRoundtrip (L332-349): "Values below q survive
           Decode . Encode"
        T2 roundtrip_iff_canonical (L420-432): "Eq (7.1) holds iff
           every unreduced segment value is below q"
        T3 minimalCounterexample (L440-451): "Coefficient q = 3329
           fails Eq (7.1); bytes 0x01 0x0D re-encode to 0x00 0x00"

      Toolchain: Lean 4 v4.22.0 (commit ba2cbbf09d4978f416e0ebd1fceeebc2c4138c05)
      with Mathlib4 v4.22.0 (7067 files, 100% success, ~706 KB manifest,
      unpacked 18054 ms).

      Build: lake build on this Windows host, 34 seconds, 0 errors,
      0 sorries, 1 linter warning (unused parameter hB at L381,
      stylistic only).

      Axiom inventory: all three theorems depend only on
      {propext, Classical.choice, Quot.sound}. No file-introduced
      axiom, no sorry, no admitted, no native_decide.

      Spec citations: all 4 (Algorithms 3-6, d=12 semantics, §7.2
      Eq 7.1) verified by R2 review against localdocs/refs/fips203.pdf.
      PDF offset printed->PDF page = +9 holds for these pages.

      Scope disclosure: MODULUS half of §7.2 only; LENGTH half
      (len(ek) = 384k+32) not formalized. Disclosure is honest
      and accurate.

      R2 review: subagent 01a04b04, 597s/44 tool calls, verdict
      SUPPORT.

    hyp-2026-0002 (FIPS dimension): INCONCLUSIVE-AFTER-BUDGET.

      GHA run 33223536290 confirmed: fipsinstall -verify PASSED
      (module integrity values generated); the FIPS provider
      fails the post-integrity self-test on the runner
      ('Provider routines: missing config data|Provider routines:
      fips module entering error state|Provider routines: self
      test post failure|common libcrypto routines: init fail' on
      the invar run; 'system library|common libcrypto routines:
      provider section error|configuration file routines: module
      initialization error' on the fips-only run). Root cause:
      OpenSSL 3.5.7's FIPS module does not include ML-KEM in its
      FIPS boundary. The FIPS cell is structurally unanswerable
      for ML-KEM, not a transient infrastructure issue.

      Mission msn-2026-0002 remains active for the 3 supported
      dimensions (A, C, D) and the refuted dimension (B). The
      FIPS dimension is preserved as INCONCLUSIVE-AFTER-BUDGET
      and the rest of the matrix is complete.

    msn-2026-0004 (ALIAS-DIFF round 2): NEGATIVE RESULT preserved.

      GHA run 33225682327 (workflow_dispatch, ubuntu-latest, gcc
      13.3.0 + clang 18.1.3) produced 660 matrix rows with 0
      divergences across both inline-asm and opaque-TU barrier
      schemes, all 5 C11 6.5p6-7 families (memcpy/union/char-ptr/
      cast-UB/control), and 3 O-levels (O0/O2/O3) per compiler.

      Combined with round 1 (350 rows, 0 divergent on gcc/clang
      at O0/O2), the cumulative evidence is: small putatively
      defined C programs (5 families, 50 variants, 6 configs per
      variant) do not produce detectable TBAA-related
      miscompilations on gcc 13.3.0 or clang 18.1.3 on
      ubuntu-x64_64.

      The negative result is preserved with explicit coverage
      counts and scope (small programs only, no C++, no
      floating-point fast-math, no concurrency).

    msn-2026-0005 (BoringSSL/rustls): SCAFFOLD READY.

      Scout (.scratch/msn-2026-0005-scout/REPORT.md) determined:
      BoringSSL on this host NOT FEASIBLE (no MSVC, no nasm, no
      Windows SDK); rustls with aws-lc-rs NOT FEASIBLE (link step

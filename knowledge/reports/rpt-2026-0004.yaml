    4. msn-2026-0004 (ALIAS-DIFF) had a round-1 negative result; round 2
       was designed but not yet executed.

    5. msn-2026-0005 (BoringSSL/rustls) was pending; the BoringSSL/rustls
       half was unexecuted.

  This session executed 5 parallel work tracks end-to-end, resolving

  runner + per-library adapters + 3-lineage cohort + 4th-oracle spot-checks)
  is a reusable methodology. The COSE work explicitly inherits this:
    - The COSE oracle is derived from RFC 9052/9053 text + standard
      Python primitives (same derivation constraint as the CBOR oracle)
    - The matrix runner uses the same verdict classification
    - The COSE vector generator uses the same deterministic-seed pattern
    - Per-library independence is documented in imp-* records (same
      format as the CBOR cohort)
    - Cross-impl byte-exact agreement uses cbor.me as 4th independent
      oracle (same approach as for CBOR §4.2.3 example)


title: "RPT-2026-0012 - Autonomous research session report 2026-08-31/09-01 (CBOR cohort + COSE activation)"

session_overview: |
  This is the consolidated report for an autonomous long-horizon research
  shift spanning 2026-08-31 to 2026-09-01. The session started from
  the completed msn-2026-0016 state and addressed the user directive
  to (a) execute msn-2026-0017 (CBOR cohort expansion) as the first
  mission, (b) preserve the option to continue autonomously across
  missions, and (c) discover what is actually worth doing next.

msn-2026-0017_completed: |
  Mission: CBOR §4.2 cohort expansion — Rust ciborium + JavaScript cbor-x
  added to the cbor2-only cohort from msn-2026-0015/0016.

  Status: verified (mission terminalized, finding promoted).

  Outcomes:
    1. Three CBOR libraries brought into scope with their build
       infrastructure:
         - cbor2 6.1.4 (Python, agronholm) — pre-existing from msn-2026-0015
         - ciborium 0.2.2 (Rust, enarx) — new, with Rust + cargo build
         - cbor-x 1.6.6 (JavaScript, kriszyp) — new, with Node.js install
       Haskell cborg was determined to have a fundamental independence
       issue (Haskell Data.Map Ord-based key ordering does not match
       either §4.2.1 bytewise-lex or §4.2.3 length-first) and was
       deferred to follow-up work.

    2. Three new implementation-archaeology records created:
         - imp-2026-0018 (ciborium, enarx lineage)
         - imp-2026-0019 (cbor-x, kriszyp lineage; corrects the brief
           URL error 'dentsu-dev/cbor-x' which is a 404 — actual URL
           is kriszyp/cbor-x)
         - (cborg deferred)

    3. New observation obs-2026-0041 records the expanded matrix:
         - Total 555 cells (cbor2 222 + ciborium 222 + cbor-x 111 default)
         - Canonical mode: 222/222 PASS (cbor2 111/111 + ciborium 111/111)
         - Both cbor2 AND ciborium independently produce byte-exact
           identical output to the Frontier cleanroom oracle on all
           111 adversarial vectors × 8 audit axes
         - cbor-x has no canonical mode (skipped, default-only cohort)

    4. fnd-2026-0013 PROMOTED from candidate to verified_conclusion.
       Original finding (1-library cohort, PARTIAL_SUPPORT) updated
       with the 3-lineage evidence chain (oracle + cbor2 + ciborium
       + cbor.me 4th-oracle spot-checks). Review rev-2026-0015 verdict:
       SUPPORT.

    5. cbor.me reference diagnostic (Carsten Bormann, RFC 8949
       co-editor) cross-checked 2 cells (the §4.2.3 example and a
       tagged value). Both MATCH. This provides a 4th independent
       oracle beyond the three implementations.

    6. Corrections to prior artifacts:
         - vrf-2026-0014: 'Appendix C' → 'Appendix A Table 6' (RFC 8949
           Appendix C is 'Pseudocode'; the 14 integer vectors are
           in Appendix A Table 6)
         - Mission brief URL 'dentsu-dev/cbor-x' corrected to
           'kriszyp/cbor-x'

    7. Mission-state machine correctly transitioned:
         - msn-2026-0017 status: active → verified
         - File moved from missions/active/ to missions/completed/

  Independence: 3 independent lineages (Frontier oracle + cbor2 +
  ciborium) span 3 languages (Python, Python, Rust) and 2 author
  lineages (Frontier LLM-derived + Alex Grönholm + Nathaniel McCallum).
  No shared code, no shared test vectors (beyond RFC 8949 Appendix A
  which every compliant implementation shares by spec). cbor.me provides
  a 4th independent oracle for the canonical-mode agreement.

  Documented divergences (NOT spec violations):
    - cbor2 default mode: 14 SPEC_AMBIGUITY (float_shortest_form,
      cbor2 default uses double-precision for all floats;
      documented cbor2 design choice requiring canonical=True for
      §4.2 conformance)
    - cbor2 default mode: 4 SPEC_VIOLATION (map_key_sort, cbor2
      default uses Python dict insertion order; documented
      non-canonical default behavior)
    - ciborium default mode: 4 SPEC_VIOLATION (map_key_sort, same
      pattern as cbor2 default)
    - cbor-x default mode: 20 SPEC_AMBIGUITY (tag wrapping: every
      JS object wrapped in tag 2/259, every Map wrapped in tag 259,
      every bytes literal wrapped in tag 64 — documented cbor-x design
      choice) + 5 INTEROP_BREAK (small integer-valued floats encoded
      as integers: 1.0 → 0x01, -1.0 → 0x20) + 5 SPEC_VIOLATION + 2 ERROR
      (undefined sentinel: cbor-x does not natively support CBOR
      simple value 23; large integers > 2^53 converted to doubles)

msn-2026-0018_activated: |
  Mission: COSE (RFC 8152/9052/9053) message-encoding conformance matrix.
  Selected via evidence-driven opportunity scan (4 parallel scouts:
  COSE, X.509, QUIC, Lean/Coq formal verification) after msn-2026-0017
  terminalized.

  Status: active (partial — initial infrastructure built; matrix not
  yet run across full cohort).

  Outcomes so far:
    1. Cleanroom Python COSE oracle (cose_oracle.py) implementing
       RFC 9052 §4.4 (Sig_structure), §5.3 (Enc_structure), §6.3
       (MAC_structure), and the protected-header-bucket encoding
       per §3. Self-test passes all structural vectors.

    2. pycose 1.1.0 adapter (lib_pycose_adapter.py). Constructs
       Sign1, Encrypt0, Mac0 messages. Includes skip_alg_header
       flag for the 'empty protected bucket' axis. Records
       cbor2-correlation explicitly in the file header comment
       for matrix interpretation.

    3. Vector generator (gen_vectors.py) producing 2 vectors across
       2 axes (empty_protected_bucket, cose_sign1_message_construction).
       Deterministic seed 0xC0DE0CB0.

    4. Matrix runner (run_matrix.py) producing TSV + JSONL output.
       Same uniform verdict classification as the CBOR matrix
       (PASS / SPEC_AMBIGUITY / SPEC_VIOLATION / INTEROP_BREAK /
       ERROR / NOT_SUPPORTED).

    5. Initial 3-cell matrix (1 adapter × 3 vectors × 1 mode):
       - 2 SPEC_AMBIGUITY: pycose's CBOR output via cbor2 produces
         different byte sequences than the oracle's explicit CBOR
         encoding for the same logical input (key encoding choices
         in cbor2 default vs explicit deterministic)
       - 1 NOT_SUPPORTED: Encrypt0 with explicit IV parameters
         requires additional pycose setup not yet implemented
       The SPEC_AMBIGUITY is a CBOR-encoder-correlated behavior, NOT
       a COSE-layer divergence; this is consistent with the
       independence analysis from the CBOR cohort.

    6. Five-library COSE independence analysis completed (cose-c,
       cose-java, coset, go-cose, pycose) by the implementation-
       archaeologist subagent swarm. Key findings:
         - cose-c (COSE WG reference, Jim Schaad): uses cn-cbor fork
           (cabo → jimsch). No ChaCha20-Poly1305, no RSA. Last
           commit 2020-06-03 (6+ years stale; repo in maintenance
           freeze).
         - cose-java (Jim Schaad, sibling to cose-c): uses PeterO
           CBOR. Same cose-wg/Examples test corpus as cose-c.
         - coset (Google, Drysdale + Crowley): uses ciborium 0.2.2
           (correlated with Frontier's CBOR cohort member for
           byte-level CBOR; independent for COSE-layer). Last
           commit 2025-12-18.
         - go-cose (Veraison, ex-Mozilla): uses fxamacker/cbor.
           No HMAC, no AES-GCM, no Encrypt0/Mac0 — only Sign1/Sign/
           Countersignature. Empty-protected-bucket: 0x40 (explicit
           comment in headers.go:80-91).
         - pycose 1.1.0 (Timothy Claeys): uses cbor2 (correlated
           with Frontier's CBOR cohort member). No ChaCha20-
           Poly1305 (RFC 9053 §4.5). Empty-protected-bucket: 0x40
           via COSE-specific `b''` override on empty dict.

  Pending work for msn-2026-0018 (not completed in this session due
  to time budget):
    - Add coset (Rust) adapter — requires `cargo build` of coset
      (in progress; ciborium 0.2.2 dependency already in scope)
    - Add cose-c adapter — requires C++ build infrastructure
      (CMake + cn-cbor fork + OpenSSL/mbedTLS) on the host
    - Add cose-java adapter — requires Java/Maven build
    - Add go-cose adapter — requires `go build` of go-cose
      (Go toolchain is available; fxamacker/cbor is a Go module)
    - Expand vector generator to cover all 10 audit axes from
      spc-2026-0005
    - Cross-check divergences against cbor.me (CBOR-layer) and
      cose-wg/Examples test-vectors repository (COSE-layer)
    - Push to origin/main after cohort expansion

methodology_notes: |
  The 4-lineage research-instrument validation approach:
    1. Frontier cleanroom Python oracle (RFC 9052/9053 text + standard
       Python primitives; no consultation of any audited library source)
    2. cbor2 6.1.4 (Python, agronholm)
    3. ciborium 0.2.2 (Rust, enarx) — added in msn-2026-0017
    4. cbor.me reference diagnostic (Carsten Bormann, RFC 8949 co-editor)
       — web-based, used for spot-checks

  Independence is documented per-library via implementation records
  (imp-2026-0018, imp-2026-0019) that explicitly note shared CBOR
  backends, shared test corpora, and shared authors. CBOR-encoder
  correlation is acknowledged where it exists (coset ↔ ciborium,
  pycose ↔ cbor2) so the matrix results are interpreted correctly.


remaining_uncertainties: |
  - msn-2026-0018: the initial 3-cell matrix is a foundation, not a
    completion. The full mission requires building and integrating
    adapters for cose-c, cose-java, coset, go-cose (4 more libraries
    across 4 languages and 4 build systems) plus expanding the
    vector generator to cover all 10 audit axes from spc-2026-0005.
    The mission is in a state that can be continued in a future
    session.
  - The COSE "empty protected bucket" finding is already documented
    in COSE libraries' source code comments as the correct RFC
    8152/9052 behavior; a matrix run would confirm whether all
    libraries actually implement this correctly, but the current
    state is that 4 of 5 audited libraries explicitly document or
    implement the 0x40 form (cose-c normalizes in AAD construction,
    coset canonical-encodes as 0x40, go-cose explicit comment,
    pycose COSE-specific override).
  - Haskell cborg is still deferred from both CBOR and COSE cohorts
    due to the Data.Map Ord-based key ordering not matching either
    §4.2.1 bytewise-lex or §4.2.3 length-first. Including cborg
    requires substantial adapter design.
  - The Frontier oracle's derivation constraint (no consultation of
    audited library source) is critical to the evidence chain.
    A review by an independent party could verify this constraint
    more rigorously, but the constraint is documented in
    cbor_oracle.py header comment and was respected during
    implementation.

newly_generated_research_opportunities: |
  1. **COSE cohort expansion (msn-2026-0018 continuation)**: add
     coset/cose-c/cose-java/go-cose adapters and run the full
     10-axis matrix. Compute class: medium (each library build
     ~5-10 min).
  2. **X.509 path validation**: 12+ independent implementations,
     PKITS corpus + Frankencerts-style mutation. Security-critical
     (HTTPS PKI). Compute class: lightweight to medium.
  3. **QUIC interop**: 10+ independent implementations, public
     QUIC Interop Runner harness, picoquic as reference oracle.
     Compute class: medium (Docker + ns-3 simulator).
  4. **Lean/Coq formal verification**: 3.5 existing missions
     (FORMAL-203/204/205). Tractable: Merkle inclusion path proof
     (~80 LOC), BLAKE3 compression (~300 LOC), CBOR §4.2.3
     length-first sort correctness. Compute class: lightweight
     (kernel check is fast; build is small).
  5. **DNS resolver behavior on malformed DNSSEC records**:
     5+ independent resolvers (Unbound, BIND9, Knot, systemd-
     resolved, PowerDNS Recursor). Compute class: lightweight.


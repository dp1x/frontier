summary: >
  Session report for the 2026-10-05 autonomous shift. The primary question was
  RFC 5280 6.1.4's (l)/(m) self-issued asymmetry. It is CONFIRMED on the
  discriminating case by two independently executed cores, but the hypothesis
  that framed it was wrong about its own premise, and three harness defects had
  to be fixed before any measurement meant anything. The more consequential
  result is that across six source-examined validation cores, only ONE
  implements the self-issued path-length exemption at all. A governance rule was
  added that refuses a current conclusion resting on a dead claim, and it fired
  on three live contradictions on its first run. The promotion gate's citation
  check was found to accept a spliced fabrication. Every headline number below
  was re-measured at close.

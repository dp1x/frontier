primary_track_hyp_2026_0030:
  outcome: >
    CONFIRMED as a normative matter and as an implementation matter, but the
    hypothesis's own premise was REFUTED and the framing was wrong.

  the_premise_that_failed: >
    hyp-2026-0030 asserted that the isolating cell -- a self-issued CA that both
    skips (l) and clamps via (m) -- "does not exist in the corpus at all". It
    does. The existing case c13_pair2_selfissued is a self-issued CA carrying
    its own pathlen:0, which is exactly that cell. The premise was checked
    against disk before the hypothesis was adopted and it did not survive. This
    is the same failure mode as the trust-anchor claim that was refuted last
    session: a hypothesis written from recollection rather than from the corpus.

  a_premise_of_this_sessions_own_brief_that_was_also_wrong: >
    The brief asked for a comparison between RFC 5280's numbered 6.1.4 steps and
    "the pseudocode", on the assumption that RFC 5280 contains a pseudocode
    representation of the algorithm that implementations port. TWO independent
    agents established by four separate structural checks that it does not.
    There is exactly one normative representation. Any implementation divergence
    is therefore a divergence WITH the RFC, not an ambiguity WITHIN it.

  normative_derivation_three_agents_converged:
    - agent A: >
        Quoted (l) and (m) with byte offsets, enumerated all 9330 path shapes of
        depth 1-5, and found the unguarded (m) agrees with 4.2.1.9 on 9330 of
        9330 while a self-issued-guarded (m) breaks it on 2268. The absence of
        the guard is load-bearing, not cosmetic.
    - agent B: >
        Found the same asymmetry and additionally established there is no
        pseudocode, confirmed by four independent structural checks.
    - adversarial agent: >
        Tried seven attack lines and FAILED TO REFUTE on all seven, including
        the one it came closest to succeeding on: constructing a conformant
        reading under H3. It rejected that reading because it would make the RFC
        self-contradictory -- the same sentence's name-constraints limb IS
        resolved as an exemption at 4.2.1.10, so H3 would force the document to
        contradict itself.
    - errata: >
        The adversarial agent retrieved the RFC Editor errata database (131319
        bytes, hashed) and found no erratum touching 6.1.4 among 23.

  experiment:
    corpus: >
      8 cases in 4 matched pairs, 30 certificates, built specifically so the
      two steps cannot be confounded. Every certificate re-parsed from its own
      DER; subject, issuer, BasicConstraints, KeyUsage, self-signed status and
      every signature relationship verified from the bytes before any
      implementation ran.
    oracle_independence: >
      Two oracles written in deliberately different styles from the same
      normative text, neither derived from any implementation under test nor
      from x509-limbo. H2 was implemented as an EXECUTABLE competitor rather
      than asserted, which is what makes the discriminating-power number a
      measurement.
    decisive_result: >
      On the single discriminating case, certvalidator REJECTS with reason class
      path_len, matching H1. Under H2 that case would be accepted.
      CORRECTED 2026-10-05 after rev-2026-0022: an earlier version of this
      report claimed BOTH cores reject with reason class path_len. pyca's
      verdict on that cell is `signature`, which this experiment's own
      admissibility rule excludes from path-length evidence. The claim is
      withdrawn.
    discriminating_power: >
      1 of 8 cases, and recorded as thin. Families A, B and D have ZERO
      discriminating power under any criterion and are kept only as controls.
      Counting rows would have reported 8 of 8.

  three_harness_defects_that_had_to_be_fixed_first:
    why_this_is_the_most_important_part_of_the_track: >
      Each produced a confident, wrong matrix before it was caught, and each
      would have "discovered" an implementation bug that does not exist. A
      harness that manufactures false divergences is worse than no experiment.
    defect_1: >
      Certificates were signed by a key no path member held. Both cores reported
      "signature does not match" on all four self-issued cells. Found by
      verifying every signature against every candidate issuer rather than
      trusting the generator's claim about who signed what.
    defect_2: >
      Self-issued certificates were also self-signed, conflating the two axes the
      hypothesis explicitly warned against. Caught by the generator's own
      structural check, which is why that check exists.
    defect_3: >
      The self-issued DN collided with the trust anchor's, so every certificate
      below named the ANCHOR's DN as issuer and two certificates matched it.
      Both validators picked the anchor and failed on the signature. This is H4
      -- path-construction ambiguity -- and it is invisible unless you check
      which certificate actually signed which.
    a_fourth_defect_no_prediction_contained: >
      The structural check initially demanded that a trust anchor NOT be
      self-signed, because the rule it encodes does not apply to an anchor. A
      check that fires on the one object it was not written about is a check
      that gets disabled rather than fixed.

  independent_reproduction_by_a_different_agent: >
    The adversarial agent built its own Go crypto/x509 reproducer and ran the
    decisive pair itself: identical chains differing only in whether the
    self-issued certificate carries pathLenConstraint=0 gave ACCEPT -> REJECT.
    It also established that (m) is one-way, so a pathlen of 9 cannot widen a
    budget already clamped to 0.

  what_is_NOT_established:
    - >
      Only TWO cores were executed. OpenSSL, GnuTLS and BoringSSL/AWS-LC were
      READ, not run. No behavioural claim is made about them.
    - One discriminating case is a thin basis and is labelled as one.
    - >
      No security claim. (m) is a min() operation, so this is a
      tightening-only, CA-self-inflicted constraint: a conformance and
      interoperability question, not privilege escalation. The adversarial agent
      reached this independently and unprompted.

the_more_consequential_result:
  claim: >
    Across the six cores whose source was examined, only ONE implements RFC
    5280 6.1's self-issued path-length exemption AT ALL.
  detail:
    certvalidator: >
      The only core found that transcribes the numbered 6.1.4 steps literally with
      (m) correctly outside the guard. Consistent with its measured behaviour.
    pyca_cryptography: >
      Applies the self-issued exemption to NAME constraints and pointedly not to
      path length, and says so in its own source comment, citing an x509-limbo
      testcase the authors intentionally fail. So this is DELIBERATE, and
      documented in-source.
    golang_crypto_x509: >
      Maintains no max_path_length variable at all; (l) and (m) are collapsed into
      one positional comparison, and the self-issued predicate is computed for
      policy counters and never reaches the path-length check.
    gnutls: >
      Unconditional decrement and clamp. Its only early-return is a SELF-SIGNED
      test, so it can skip the clamp for a self-signed pair but never for a
      self-issued non-self-signed one.
    rustls_webpki: >
      (m) is unconditional for every Issuer role; no self-issued concept exists
      in its path-length evaluation.
  the_direction_matters: >
    These cores are OVER-STRICT, not over-permissive. RFC 5280 6.2 makes 6.1 a
    MINIMUM, so being stricter is CONFORMANT -- the same reasoning that refuted
    fnd-2026-0016's classification last session. This is an interoperability
    problem, not a security one, and no implementation has been found to be
    over-permissive. That is why it is a conformance observation and not a
    vulnerability.
  a_correction_confirmed_from_the_installed_artefact: >
    The in-repo adapter still states that the core under cryptography is
    rustls-webpki. That is FALSE for the installed wheel, and this session
    verified it from the artefact itself rather than from the source tree: zero
    .rs files ship in the wheel, and the shipped CycloneDX SBOM enumerates 39
    Cargo components containing cryptography-x509 and
    cryptography-x509-verification and NO rustls-webpki.

  a_longstanding_open_question_partially_closed: >
    fnd-2026-0016 recorded the "signature" reason class on its self-issued cells
    as UNEXPLAINED. It is now reproduced on two cells of the final corpus and has
    a source-level mechanism: pyca's path builder exhausts candidates, and the
    crate documents that it does not exempt self-issued certificates from depth
    counting. It was never a pathLenConstraint result. The mechanism for the two
    REMAINING pyca-only divergences is not isolated and is recorded as such.

independent_review_rev_2026_0022:
  verdict: >
    The central RFC claim SURVIVED. The reviewer set out to disprove it, worked
    all eight cases by hand from the RFC text without consulting the oracles'
    verdicts, and could not.
  what_it_confirmed_beyond_doubt:
    - The asymmetry is real; every occurrence of "self-issued" in the document
      was read and none scopes (m).
    - >
      It found STRONGER textual support the session had not cited: 4.2.1.10
      spells its self-issued exemption out in prose for NAME constraints, which
      is evidence the drafters state the exemption where they intend it and omit
      it where they do not.
    - >
      It tested the specific collapse scenario -- would H2 also reject C2_si_pl0
      for some other reason? -- and showed no: under H2 the budget entering the
      next certificate is 3, strictly greater than zero, so (l) does not fire and
      nothing else can fail.
    - >
      It confirmed the final-certificate exemption against certvalidator's real
      validate.py, independently verifying both oracles on a point neither
      session had checked against source. No fifth wrong oracle version exists.
    - >
      It re-derived the wheel-level claim independently: 44 SBOM components, no
      rustls-webpki.
  what_it_refuted:
    - >
      THREE CELLS of my own committed results table, including a positive control
      (B1_ns_pl1 is REJECT, not ACCEPT) that hand arithmetic settles. The table
      had been transcribed from an EARLIER run whose corpus differed from the
      committed one and was never re-checked after the corpus was repaired.
    - >
      The claim that BOTH cores implement H1. pyca's reason class on the
      discriminating case is `signature`, not `path_len`, so that cell is
      inadmissible for pyca under my own admissibility rule.
    - The "four freshly generated chains" figure, which is two.
    - >
      Two false source locators: a test module that does not exist, and a claim
      that the generator asserts the discrimination algebraically when it does
      not (the assertion lives in a test, not the generator).
    - >
      That the corpus can express every case. It structurally CANNOT place a
      self-issued certificate at path position 1, so it cannot express a trust
      anchor's own key-rollover re-issue -- the commonest real-world self-issued
      certificate. This does not affect the C2 result but is a real expressiveness
      gap.
  the_most_valuable_thing_it_said: >
    The decisive claim rested on a JSON file on a ramdisk that AGENTS.md itself
    says is not assumed to survive. Nobody -- including a future adversarial
    reviewer -- could check the decisive row from the repository. The committed
    reason-class record now exists precisely because of that objection.
  why_it_matters_as_a_process_result: >
    The reviewer was briefed to disprove the work and instead found a real error
    in MY OWN artifact. Every previous session's headline refutations were of
    inherited claims; this one is of a claim made hours earlier in the same
    session. The mechanism that caught it is the same one that caught the trust
    anchor error: an independent role with an explicit mandate to disagree,
    pointed at a specific claim rather than at a report.

the_second_order_question_now_open:
  hyp-2026-0031: >
    If the RFC requires an exemption and almost nothing implements one, is that
    a deliberate ecosystem-wide compatibility rule with a recorded rationale, or
    an implementation gap nobody noticed because self-issued CA certificates
    carrying a pathLenConstraint are rare? Deliberate for pyca, on the evidence
    of its own source comment; no ecosystem-wide claim is possible.

governance_track_supersession:
  what_was_built: >
    A typed 'supersedes' field pointing FORWARD from the corrector to the
    corrected, with three relations -- corrects, withdraws, replaces -- because
    correcting a fact, withdrawing a claim and taking over a subject are
    different acts with different consequences for the target's status. No new
    status value; the enums already express withdrawal.
  why_forward: >
    The corpus's existing conventions (corrected_by, superseded_by) all point
    BACKWARD. A rule has to read forward from the authority it depends on.
  narrowed_against_the_real_corpus_not_guessed:
    - "authority edges only, not examination links: 91 hits -> 15. A LINK IS NOT AN INHERITED CLAIM."
    - "'disputed' is not dead: 15 -> 4. Treating it as dead fires on 11 legitimate citations."
    - "acknowledgement discharges: 4 -> 1."
  the_rule_fired_on_first_run: >
    It refused msn-2026-0017: status 'verified' while resting on fnd-2026-0013,
    which is 'rejected'. Three live contradictions found, not zero.
  an_over_reach_i_corrected: >
    The rule cascaded to msn-2026-0018 and msn-2026-0019, and my first
    response was to supersede them wholesale. That was WRONG and I reversed it:
    they are COSE and FROST work that merely BUILT ON the dead CBOR framework,
    and their conclusions rest on other specifications. Their records now state
    the inherited authority is dead and that whether their conclusions survive
    is an OPEN question. Recording a refutation I had not earned would be the
    exact failure this repository exists to catch.
  tests: 17 regression tests including non-vacuity.

promotion_gate_track:
  defect_found: >
    The gate located quoted text at DOCUMENT level and recorded how much of the
    citation it found. A record quoting one fabricated sentence spliced with two
    genuine RFC 9052 sentences scored 2/3 = 0.67, above the 0.6 threshold, and
    was ALLOWED with verdict 'confirmed' and no blocking rules. A document-level
    ratio cannot detect a splice: the genuine parts raise the ratio past the bar
    the fabricated part should have failed.
  fix: >
    A quoted unit absent from the whole cited document now blocks 'confirmed' in
    both the record path and the aggregate path. The ratio survives only for
    genuine incomplete records, which is what it was for.
  tests: >
    18 regression tests, each demonstrating the old failure and the corrected
    behaviour, with non-vacuity controls. Verified: 18 passed, gate selftest
    green (9 REFUSE, 1 ALLOW control).


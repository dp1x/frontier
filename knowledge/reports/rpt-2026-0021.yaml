citation_remediation_track:
  two_inherited_counts_withdrawn: >
    The corpus carried 25 units and 29 fragments for the fabricated RFC 8949
    quotations. Neither is reproducible; both are withdrawn.
  re_measured: >
    RFC 8949 fetched as 185226 bytes, sha256
    f1164a5b31a39350ad46abe29b83575eb933ca6c45366989c118b6b1058a214a, and
    independently re-verified by the orchestrator from RAW BYTES -- a first
    attempt in PowerShell text mode returned 185216 with a different digest
    because of line-ending conversion, which is itself a reminder that a digest
    measured through a text-mode fetch is not a digest of the document.
  the_decisive_distinction: >
    20 separately-quotable units attributed to RFC 8949, all 20 NO-MATCH, and
    critically NONE appears anywhere in the document under any other locator.
    Every NO-MATCH is therefore a fabrication, not a wrong section number --
    two different defects the corpus had been conflating.
  blast_radius_re_measured: >
    42 linked artifacts: 17 assert false content, 5 have the premise withdrawn
    while preserving evidence, the remainder are passive link-carriers left
    unchanged.


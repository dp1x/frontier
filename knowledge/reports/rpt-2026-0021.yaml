ci_track:
  the_prior_report_was_wrong_about_why_stage_c_was_red: >
    rpt-2026-0020 recorded ssh-loopback-stage-c as red BY DESIGN because the
    mutator now records a real harness_error. Reading the actual sshd logs shows
    the substance is right and the framing is wrong: the server received the
    coefficient-corrupted KEX_ECDH_INIT, entered ssh_dispatch_run_fatal and
    closed WITHOUT sending SSH_MSG_DISCONNECT. The relay did not break. Labelling
    that 'harness_error' was factually wrong and destroyed the distinction the
    experiment exists to make.
  the_worse_defect_it_found: >
    The workflow's comment asserted "only a harness failure is a CI failure; a
    legitimate protocol abort is a recorded result" while the CODE did not
    implement that distinction. The encoding existed only as prose -- the same
    defect class as the supersession gap, one layer down.
  fix_and_proof: >
    server_abort_no_reply is now distinguished from harness_error, and the
    workflow CROSS-CHECKS the sshd log for ssh_dispatch_run_fatal, printing
    CONFIRMED or UNATTRIBUTED. The attribution is now mechanical rather than
    asserted. CI run 37269212070, 6/6 jobs green.
  full_workflow_inventory_taken: >
    Ten workflows enumerated by name rather than sampled, which is the specific
    mistake that produced the previous session's false "CI is green".


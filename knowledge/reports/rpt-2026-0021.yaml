the_governing_principle_this_session_actually_applied: >
  Use abundant machine intelligence to search enormous intellectual spaces; use
  ordinary commodity computation only to perform the decisive physical
  experiment. Eleven agents produced derivations, archaeology and audits. The
  decisive physical experiment -- eight certificate chains, two oracles, two
  cores, under a second of compute -- was performed by the orchestrator directly,
  because it is small enough that delegating it would have cost more than doing
  it. The most valuable output of the shift was not the confirmation: it was the
  three harness defects that had to be fixed before the confirmation meant
  anything.
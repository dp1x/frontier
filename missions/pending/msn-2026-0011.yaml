title: msn-2026-0011 - OpenSSH portable client-side decapsulation parity audit (Stage C)
objective: >-
  Determine whether the OpenSSH portable ssh *client* catches
  non-canonical C_PK2 via FIPS-conformant decapsulation of the
  server S_REPLY.

  Per msn-2026-0010 finding fnd-2026-0009, the server is length-only
  lenient on C_INIT. The handshake completes through kex_kem_mlkem768x25519_enc
  with garbage K_PQ from encapsulating against non-canonical C_PK2.

  The discovery question is whether the **client** catches this on
  decapsulation. If the OpenSSH portable client uses the OpenBSD-native
  ML-KEM library (libcrucible) which embeds the FIPS 203 s7.2 modulus
  check at decaps time, then the client will reject the malformed
  S_REPLY before deriving shared key. If the client uses a PQClean-style
  library or library without decaps-time check, the handshake completes
  end-to-end with both sides silently deriving keys.

  Predicted outcomes:
    H2-strict: OpenSSH portable client rejects S_REPLY (handshake
      fails safely; interop note)
    H2-lenient: OpenSSH portable client silently decapsulates
      (handshake completes end-to-end; security finding)

  Secondary cohort: golang.org/x/crypto/ssh client (Go 1.26+ has
  ML-KEM-X25519 client support).
domain: interop
scope: >
  OpenSSH portable master HEAD built with USE_MLKEM768X25519=1
  on GHA ubuntu-latest. OpenSSH portable client binary invoked
  against the same sshd, with a Go MITM mutator that injects a
  tampered C_INIT into the client's KEX_INIT message.
  Plus golang.org/x/crypto/ssh client for cross-language cohort.
  Out of scope: server-side enforcement (already audited by msn-2026-0010).

title: Lean 4 proof of ML-KEM ByteEncode12 roundtrip and modulus-check equivalence
objective: >
  Machine-check in Lean 4 the load-bearing lemma underpinning fnd-2026-0001:
  ByteEncode12(ByteDecode12(b)) == b iff every 12-bit coefficient of b is in
  [0,q-1] with q=3329 (FIPS 203 Alg 5-6, Eq 7.1), and ByteDecode12∘ByteEncode12
  = id on Fin q^(256k). Deliver lean-toolchain-pinned Formal/ project with
  ByteEncode.lean, Eq71.lean, Counterexample.lean, all checking via `lake build`.
domain: formal
scope: >
  Formal definitions of Algorithms 5-6 (d=12, little-endian 12-bit chunking),
  roundtrip theorems, modulus-test characterization, and an explicit
  counterexample coefficient 3329 that fails Eq 7.1. Out of scope: CBMC/HOL-Light
  assembly proofs, performance, NTT correctness; no Isabelle/AFP port.
constraints:
  - Pinned Lean toolchain (leanprover/lean4:v4.22.0 etc.) via formal/lean-toolchain and formal/lakefile.lean.
  - Deterministic verifier is Lean kernel via `lake build`; no sorry/axiom/admitted.
  - All proof attempts in scrubbed scratch; record seeds and versions.
  - No secrets; public repos only.

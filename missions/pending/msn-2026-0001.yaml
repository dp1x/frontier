title: FIPS 203 section 7.2 encapsulation-key checking across public implementations
objective: >
  Determine which public ML-KEM implementations perform the FIPS 203 section 7.2
  encapsulation-key type check (length 384k+32) and modulus check
  (ByteEncode12(ByteDecode12(ek[0:384k])) == ek[0:384k]) at Encaps time or at
  key-import time, whether their omission is permitted by the standard's own
  placement language and by SP 800-227 guidance, and produce a reproducible
  differential table plus a classified finding.
domain: cryptography
scope: >
  Encapsulation-key checking only. Out of scope: decapsulation-side checks,
  side channels, timing, performance. One experiment = one implementation x one
  malformed-key case; every experiment is small and deterministic.
constraints:
  - Do not label anything a vulnerability from an unchecked theory.
  - Versions under test must be pinned to released tags/commits verified during the mission.
  - All untrusted code runs through frontier.execute with scrubbed environment in scratch.
  - Preserve negative results (implementations that do check correctly are findings too).
desired_evidence_level: independently-reviewed
candidate_targets: [tgt-2026-0001]
dependencies: []
compute:
  expected_class: lightweight
  notes: Keygen+encaps on tiny inputs; prefer R: ramdisk scratch; no CI needed unless a build matrix becomes necessary.
budget:
  max_attempts: 24
  max_independent_reviews: 3
  max_compute_runs: 60
  diminishing_returns_window: 3
  max_auto_descendants: 3
acceptance_criteria:
  - At least three independent public ML-KEM implementations exercised against malformed ek vectors derived from the section 4.2.1 decode semantics (coefficients >= q).
  - Differential table recorded as observations with environment metadata for each run.
  - Classification reviewed by an adversarial critic that did not produce the initial interpretation.
  - Finding artifact carries specification citation, exact versions, reproducer paths, observed vs expected behavior.
stopping_conditions:
  - Budget exhausted without new discriminating evidence.
  - All candidate implementations characterized and classification reviewed.

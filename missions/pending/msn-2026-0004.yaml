title: Strict-aliasing effective-type differential across GCC/Clang/MSVC vs CompCert
objective: >
  Determine whether small putatively defined C programs using memcpy type-punning
  (defined), union punning (implementation-defined), char* aliasing (allowed)
  vs direct incompatible pointer casts (UB) are miscompiled via TBAA assumptions,
  by differential checksum execution across gcc -O0 vs -O2 -fstrict-aliasing
  vs clang -O2 vs CompCert -interp oracle. Find at least one wrong-code case
  or preserve negative result with explicit coverage.
domain: compilers
scope: >
  Strict-aliasing / effective-type only (C11 6.5p6-7). Out of scope: floating-point
  fast-math, concurrency, full translation validation with unbounded loops, C++ templates.
  Generation limited to 50-500 line C files, deterministic checksums, bounded timeouts.
constraints:
  - Pinned compiler versions per experiment, recorded in provenance.
  - All generated programs run via frontier.execute in scrubbed scratch or public CI, no secrets.
  - C-Reduce/cvise minimization for any divergent case; Alive2 TBAA validation; no invented bugs.
desired_evidence_level: independently-reviewed

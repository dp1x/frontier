title: "msn-2026-0014 - Clean-room Python RFC 9591 reference implementation (independent oracle for fnd-2026-0012 promotion)"
objective: >
  Build a clean-room Python reference implementation of RFC 9591 §4.4 compute_binding_factors
  + §5.1 commit + §5.2 sign + §5.3 aggregate for both secp256k1_sha256 and ed25519_sha512
  ciphersuites. The implementation must be derived exclusively from the RFC 9591 text + standard
  primitives (SHA-256/512 + secp256k1/ed25519 curve arithmetic via a standard library like
  coincurve/PyNaCl). It must NOT consult ZcashFoundation/frost source code or its self-generated
  tests/helpers/vectors.json. Verify byte-exact match against RFC 9591 Appendix E.5 (secp256k1)
  and E.1 (ed25519) expected per-step outputs.

  The outcome either (a) promotes fnd-2026-0012 from hypothesis to verified_conclusion (if the
  clean-room implementation reproduces RFC 9591 Appendix E byte-exactly, providing the first
  independent RFC 9591 KAT verification on record), or (b) characterizes the
  normatively-silent parameters in RFC 9591 (if the clean-room implementation diverges on
  some inputs, identifying which specific choices are RFC-ambiguous).
domain: cryptography
scope: >
  Clean-room Python implementation of RFC 9591 §4.4 + §5.1 + §5.2 + §5.3 for both
  ciphersuites. Byte-exact verification of per-step outputs against RFC 9591 Appendix
  E.5 (secp256k1) and E.1 (ed25519) expected values. Aggregate verification under
  RFC 9591 §5.1.6 (ed25519 cofactored) and Appendix B (prime_order_verify).

  Out of scope: DKG ceremony; FROST-2; BLS threshold; MuSig2; performance/timing
  measurements; fuzz testing.
constraints:
  - Implementation must be clean-room: derived exclusively from RFC 9591 text + standard primitives. No consultation of ZcashFoundation/frost source or test vectors.
  - Python source code committed to crypto/frost-cross-impl/cleanroom/.
  - Per-step outputs compared byte-exact against RFC 9591 Appendix E.5 and E.1.
  - All builds in env-scrubbed scratch via local Windows host + GHA ubuntu-latest.
  - Disclosure: public, interop-note class (not CVE-class unless an exploit-class divergence surfaces).

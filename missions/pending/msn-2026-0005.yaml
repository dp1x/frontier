title: Protocol-layer ML-KEM ek validation interop (TLS X25519MLKEM768, X-Wing HPKE, SSH)
objective: >
  Determine whether deployed protocol stacks (Go crypto/tls, BoringSSL/Chrome,
  rustls+aws-lc, OpenSSL+oqs-provider, OpenSSH) correctly enforce the
  FIPS 203 s7.2 check at the protocol layer as mandated by
  draft-ietf-tls-ecdhe-mlkem-05 s4.2 (server MUST 7.2 -> illegal_parameter),
  X-Wing HPKE s5.6 (Encaps MUST 7.2 -> EncapError), and
  draft-ietf-sshm-mlkem-hybrid-kex-10 s2.1 (MUST 7.2 -> KEY_EXCHANGE_FAILED).
  Use loopback handshakes with crafted non-canonical ek (coeff 3329/4095)
  and observe alert / success divergence across strict vs lenient server cohorts.
domain: interop
scope: >
  TLS 1.3 X25519MLKEM768 (server ek check), HPKE X-Wing Encap, SSH hybrid KEX.
  Out of scope: IKEv2 RFC9370 generic (no ML-KEM assignment), performance, side channels,
  decapsulation implicit-rejection itself.
constraints:
  - All untrusted stack code via frontier.execute scrubbed scratch or public CI; no secrets.
  - Pinned stack versions per experiment; deterministic stimuli reused from msn-2026-0001.
  - Any divergence minimized to single non-canonical coefficient and captured as pcap + alert mapping.
desired_evidence_level: independently-reviewed

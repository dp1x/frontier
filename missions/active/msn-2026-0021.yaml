design_record:
  status: >
    DESIGNED, NOT YET IMPLEMENTED. A feasibility probe machine-checked the new
    index lemmas core-only (no Mathlib) in 1.6 s with zero errors, but that
    probe transcribes `wsum` by structural recursion instead of via
    `Finset.sum`, so it is NOT evidence that the Mathlib-dependent module
    compiles. No Lean source is committed by this session, because committing
    an unverified file with `sorry` would violate the zero-sorry rule.
  recommended_model: >
    Do NOT retro-fit ByteEncode.lean. Add a new module that introduces the
    bounded-index view, keeping ~85% of the existing corpus reusable unchanged
    (the wsum / extract_wsum / eqOfBits_gen / bit arithmetic induction chain is
    domain-independent). Reject Mathlib `Vector` (no expressive power beyond
    core `Fin`; machinery for appearance) and reject the Sigma/subtype route
    (the same proposition with a wrapper - and msn-2026-0007 already failed by
    delivering a predicate where a dependent type was specified).
  required_theorems:
    - "T1 eq7_1_accept: the Eq (7.1) equality for y < 384k, given forall i < 256k, seg B i < 3329"
    - "T2 eq7_1_reject: exists y < 384k with encByte (dec B) y != B y, given some i < 256k with seg B i >= 3329 - the anti-vacuity half"
    - "T3 step1: the type check, with k load-bearing"
    - "T4 counterexample: a legitimate k=2 key violating the OLD unbounded corpus hypothesis"
  critical_constraint: >
    T1 and T2 MUST ship together. An accept-only theorem is satisfiable by a
    hypothesis nobody can inhabit - that is the FORMAL-205 vacuity failure
    repeated one level down, and it is exactly how the current corpus reads.
  effort_estimate: >
    1.5-3 days, replacing the prior "roughly one day". The mathematics is
    small (~90 lines of new proof text, demonstrated by probe); the cost is
    iteration against a Mathlib-olean-free local tree at ~8-15 min per CI round
    trip, budget 3-5 runs. Upper bound 1 week if the reject theorem resists in
    the Mathlib context.

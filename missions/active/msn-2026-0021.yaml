title: FORMAL-208 - Faithful bounded-index model of FIPS 203 s7.2 (Type check + Eq 7.1 over the 384k prefix)
objective: >
  Establish, with kernel-checked proofs, a model of the FIPS 203 section 7.2
  "Encapsulation key check" that is faithful to the specification's own
  statement, namely BOTH:

  (a) step 1 (Type check): ek is an array of bytes of length 384k + 32 for the
      parameter set's k, and
  (b) step 2 (Modulus check): Eq (7.1)
      test = ByteEncode_12(ByteDecode_12(ek[0:384k]))
      rejects when test != ek[0:384k] - over the 384k PREFIX ONLY, which by
      FIPS 203 Algorithm 13 line 19 and Algorithm 14 line 3 EXCLUDES the
      32-byte rho seed at ek[384k:384k+32].

  The corpus currently proves neither. This mission does NOT retro-fit
  FORMAL-203/204/205; it adds the model they lacked and preserves the
  correction history of why they were insufficient.

  Explicitly IN scope: the bounded byte index (y < 384k), the bounded
  coefficient index (i < 256k), parameter dependence (k = 2, 3, 4 must be
  distinguishable), and a statement that the seed region is unconstrained by
  Eq (7.1).

  Explicitly OUT of scope: NTT, K-PKE.Encrypt/Decrypt, ML-KEM.KeyGen
  correctness, and the SP 800-227 external-assurance mechanism.
domain: formal
scope: >
  A new Lean module formal/Formal/EkCheck.lean (plus an `import` line in
  formal/Formal.lean) providing: a bounded-index byte-array view; the
  parameter-dependent section 7.2 predicate; an accept direction; a reject
  direction; and a kernel-checked counterexample showing the corpus hypothesis
  is false for legitimate keys.

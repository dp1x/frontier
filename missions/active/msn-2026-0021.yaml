acceptance_criteria:
- formal/Formal/EkCheck.lean is committed AND imported from formal/Formal.lean (otherwise CI reports green on an unchecked file - verified defect).
- A theorem states Eq (7.1) over a byte index bounded by 384k, with the coefficient index bounded by 256k.
- A REJECT theorem exists alongside the ACCEPT theorem. An accept-only theorem is satisfiable by a hypothesis nobody can inhabit - that is the FORMAL-205 vacuity failure repeated one level down.
- A kernel-checked counterexample demonstrates the old corpus hypothesis `forall i, seg B i < 3329` is FALSE for a legitimate k=2 key (proving Eq (7.1) was never an instance of enc_dec_eq).
- The parameter `k` is load-bearing: distinct k must yield distinct admissible byte counts.
- .github/workflows/formal.yml runs green and the run ID is recorded here.
- A committed `#print axioms` transcript bounds the axiom inventory.
- An independent non-synthesizer adversarial review with an explicit mandate to disprove the scope claim.
stopping_conditions:
- Kernel-accepted proofs for both directions plus adversarial review supporting the scope.
- Budget exhausted.

title: SSH hybrid KEX protocol-layer FIPS 203 s7.2 enforcement audit (OpenSSH portable)
objective: >
  Determine whether OpenSSH portable's sshd enforces the FIPS 203 s7.2
  encapsulation-key modulus check (and the analogous NTRU Prime 761
  encapsulation-key check) on the C_PK2 portion of SSH_MSGKEX_HYBRID_INIT
  before calling Encaps, as mandated by
  draft-ietf-sshm-mlkem-hybrid-kex-10 s2.1 and
  draft-ietf-sshm-ntruprime-ssh-06 s2.1.

  Per-cohort verdicts (server-side response to tampered C_INIT):

  1. OpenSSH portable mlkem768x25519-sha256 server:
     - Length half (truncate_by_1, append_1) -- does the server reject?
     - Modulus half (coeff0=q, coeff0=4095, coeff255=4095,
       cross-param-set body) -- does the server reject?
     - Verdict rule -- SSH_MSG_DISCONNECT reason 3 = strict;
       completed handshake = lenient;
       silent encapsulate = dangerous.

  2. OpenSSH portable sntrup761x25519-sha512 server (deployed default
     in OpenSSH 9.5+, sntruprime is in production):
     - Same stimulus family adapted to NTRU Prime 761 wire format
       (small-coefficient over Z_761 instead of 12-bit packed over Z_3329).
     - Same verdict rule.

  3. Stage C -- client-side decapsulation parity (critical discovery lever):
     Does the OpenSSH portable *client* (and the Go x/crypto/ssh client)
     catch non-canonical C_PK2 either via len or decapsulation-time
     rejection on S_REPLY? This stage is mandatory, not optional.

  4. Stage D (gated) -- if Stage A/B shows lenient server for either cohort,
     bring in Erlang/OTP ssh as an independent cohort. (Skip if Stages A/B
     show strict enforcement, since orthogonal-cohort value is then low.)

  Out of scope (deferred to follow-ups if discovery emerges):
  - Dropbear sshd ML-KEM-X25519 audit (Dropbear does not ship ML-KEM-X25519).
  - IKEv2 RFC 9370 hybrid ML-KEM audit.
  - QUIC + ECH + ML-KEM audit.
domain: interop
scope: >
  OpenSSH portable master HEAD (v9.x line) with USE_MLKEM768X25519=1 and
  sntrup761x25519-sha512 (default-enabled). Both build paths use the same
  OpenSSH portable kex.c dispatch code.
  Out of scope: sshd configurations with custom KEX lists; client-side KEX
  preference override; performance/timing; memory-safety audits; side channels.
constraints:
  - All builds in env-scrubbed scratch on R:\ ramdisk or GHA ubuntu-latest.
  - Pinned OpenSSH portable commit at the time of mission start.
  - Stimuli reuse the byte-position logic from msn-2026-0005
    (crypto/mlkem-input-checks/stimuli/stimuli.tsv family).
  - Decision surface is binary (handshake-completed vs SSH_MSG_DISCONNECT
    reason 3) plus a third "silent encapsulate" capture.
  - Cross-stage evidence required -- Stage C (client-side decaps parity) is
    mandatory per the adversarial critic review; the mission does not
    terminalize as a discovery without Stage C executed.
  - No secrets; tests use self-signed host keys.
  - Disclosure: public, interop-note class (not CVE).

  - "Each candidate finding is cross-checked against cbor.me reference diagnostic; cbor.me's verdict is recorded."
  - "Each candidate finding has an adversarial critic review (rev-2026-XXXX) supporting or rejecting promotion."
  - "Findings promoted through the standard ladder: hypothesis → experiment → observation → reproducer → independent review → verified."

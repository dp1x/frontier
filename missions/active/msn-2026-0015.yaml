  - "Oracle derives inputs exclusively from RFC 8949 text + standard Python primitives. No consultation of any audited library's source."
  - "Oracle passes the RFC 8949 Appendix C 14 reference vectors byte-exactly (both modes)."
  - "Per-library adapter layer (10 adapters) committed to cbor-cross-impl/adapters/."
  - "Adversarial vector generator (CDDL-synthesized, targeting each audit axis) committed to cbor-cross-impl/vectors/."

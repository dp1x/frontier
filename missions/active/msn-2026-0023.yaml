acceptance_criteria:
- The normative propositions verified against a hashed copy of the specification (DONE: spc-2026-0007, W3C PNG Third Edition, REC 2025-06-24, SHA-256 A3AC82BB...).
- A corpus in which every non-control vector's CRC is independently correct, and the decisive pair differs only in the criticality bit (DONE: 5 differing byte offsets, first-byte XOR 0x20, verified independently of the generator).
- Positive controls proving the harness can produce an ACCEPT (DONE: 4 controls).
- Every cell carries a reason class, with zero unattributable rejections (DONE: GENERIC_DECODE_ERROR = 0 of 44).
- Every cohort member's core and lineage established from its own distribution (DONE: none of the four links libpng).
- The strongest candidate discrepancy independently reproduced outside the primary harness (DONE for Pillow by the orchestrator; NOT DONE for Go).
- An independent adversarial review with a mandate to disprove the finding (IN FLIGHT).
- libpng and libspng exercised so a broader scope claim becomes possible (NOT DONE).
stopping_conditions:
- Adversarial review lands and either confirms or refutes the discrepancy.
- Cohort widened to include libpng or libspng, or that route is recorded as CI-blocked.
- Budget exhausted.

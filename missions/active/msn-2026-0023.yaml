what_is_established_so_far:
  normative: >
    PNG 5.4 Table 6: a decoder trying to extract the image, on encountering an
    unknown chunk with ancillary bit 0, SHALL indicate to the user that the
    image contains information it cannot safely interpret. 13.1 calls it a
    fatal condition. Verified against a hashed copy of the Third Edition.
  the_correction_that_made_the_experiment_valid: >
    Criticality is bit 5 (value 32) of the first type byte -- the low-order
    case bit -- not the high-order bit. Section 5.3 restricts type bytes to
    0x41-0x5A and 0x61-0x7A, so bit 7 is always 0 and carries no meaning. A
    generator setting 0x80 would emit an ILLEGAL type byte and fail framing
    before criticality was ever evaluated.
  measured: >
    stb_image and Wuffs reject for the right reason; Pillow and Go silently
    accept and render. Zero of 44 cells were unattributable.
  the_correction_from_the_previous_session: >
    A prior framing of this question was VACUOUS because a bad CRC on the probe
    chunk let the decoder reject before criticality was evaluated. The negative
    controls exist to keep that confound visible, and the controls show both
    accepting cores DO check CRCs.

what_is_not_established:
  - "Anything about libpng or libspng. They are NOT_BUILT."
  - "Whether this is a defect, a policy choice, or a scope question. That is what the adversarial review is for."
  - "Any security consequence. Nothing here demonstrates an exploitable path."
  - "Whether the Go result reproduces outside the cohort agent's own program."

the_strongest_next_action:
  >
    Build libpng and libspng on GitHub Actions and run the same eleven vectors
    through them. libpng is the most widely deployed PNG core in the world, and
    a scope claim that omits it is weak regardless of what the other four do.
    This is medium compute and belongs on CI per AGENTS.md.
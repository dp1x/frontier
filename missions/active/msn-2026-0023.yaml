title: "MSN-2026-0023 - PNG unknown-critical-chunk handling across independent decoder cores"
objective: >
  Establish, against source-verified normative propositions and with every
  verdict attributable to a cause, whether independent PNG decoders reject a
  structurally valid file containing an unknown CRITICAL chunk while accepting
  the paired unknown ANCILLARY file -- and where they do not, locate the
  mechanism in source and determine whether the deviation is a defect, a policy
  choice, or a scope question.
domain: interop
scope: >
  Chunk-type criticality handling in PNG decoders. The corpus is 11 vectors
  (9 discriminating) committed at crypto/png-critical-chunk/. Cohort so far:
  Pillow 12.3.0, Go image/png go1.26.4, stb_image v2.30, Wuffs 0.3.5.
  OUT of scope: pixel-level correctness, encoder behaviour, image editing
  tools, and any security-impact claim.
constraints:
- Every chunk-type bit convention is verified against a hashed copy of the specification (spc-2026-0007). The bit convention in the original brief was WRONG and was corrected.
- Every non-control vector must carry a VALID CRC. A rejection attributable to a CRC error is a CONFOUND and may never support a claim about criticality.
- Every cell must carry a reason class. An unattributable rejection is NOT evidence.
- >
  Rejects unknown critical chunks is not one boolean property: any claim must be
  scoped to the position tested as well as the file.
- "Scope statements must name the cores actually exercised. libpng and libspng are NOT_BUILT."
- "No upstream report without a human decision."

  - "Cleanroom Python oracle extended to cover the full RFC 9591 §4-§5 path: hiding_nonce, binding_nonce, hiding_nonce_commitment, binding_nonce_commitment, group_commitment, encoded_commitment_hash, message_hash, binding_factor, challenge, lagrange coefficient, signature_share, aggregate (R, z), and aggregate verification under the public group key."
  - "Cleanroom oracle supports both secp256k1_sha256 and ed25519_sha512 ciphersuites."
  - "Per-implementation adapter (frost-rs subprocess adapter, frost Go subprocess adapter) committed to crypto/frost-cross-impl/adapters/."
  - "Frontier-generated corpus committed to crypto/frost-cross-impl/vectors/."
  - "Matrix runner producing TSV + JSONL committed to crypto/frost-cross-impl/runner/."
  - "Matrix run produces per-cell verdicts across at least 6 KAT vectors (3 secp256k1 + 3 ed25519) × 3 implementations × ≥6 per-step outputs = ≥108 byte-exact cells + ≥24 negative-stimulus cells."
  - "Research instrument validation: cleanroom passes RFC 9591 Appendix E.5/E.1 reference vectors byte-exactly; adapters pass positive/negative controls; cleanroom derivation constraint respected."
  - "Every diverging cell cross-checked against a second-opinion oracle (cleanroom itself + KAT JSON)."
  - "Every disagreement classified (PASS / SPEC_VIOLATION / INTEROP_BREAK / ERROR / NOT_SUPPORTED / INSTRUMENT_QUESTION)."
  - "Adversarial critic review (rev-2026-XXXX) SUPPORTS or PARTIALLY_SUPPORTS any finding promotion."
  - "Reproducer (rpr-2026-XXXX) documents how to reproduce the matrix from clean source."
  - "Either a verified finding promoted OR an inconclusive-after-budget terminal reason with documented evidence supporting the conclusion."

title: "msn-2026-0019 - FROST (RFC 9591) threshold signature cross-implementation byte-exact differential"
objective: >
  Build a FROST (RFC 9591) threshold Schnorr signature cross-implementation
  byte-exact differential matrix across at least 3 independent parties:
  (a) the Frontier cleanroom Python oracle (RFC 9591 text + standard
  Python primitives + ZCashFoundation/frost-rs KAT JSON shape),
  (b) `frost-rs` (ZCashFoundation Rust crate, the production Rust
  implementation used by Chia + Liquid),
  (c) `frost` (ZKSecurity Go reference, ~5k LOC, Komlo et al. paper).

  For each pair (implementation, RFC 9591 Appendix A/E KAT vector),
  verify byte-exact agreement at every per-step intermediate output:
    - hiding_nonce (d_i) and binding_nonce (e_i) per participant
    - hiding_nonce_commitment and binding_nonce_commitment per participant
    - group_commitment encoding + encoded_commitment_hash
    - message_hash
    - binding_factor per participant (the most security-critical derivation)
    - challenge e
    - Lagrange coefficient lambda_i per signing participant
    - signature_share per signing participant
    - aggregate (R, z) and verification under the public group key

  Run a battery of negative stimuli:
    - nonce reuse (same (d_i, e_i) across two signing operations)
    - R off the curve (point at infinity / x = 0)
    - s_i outside [1, n-1]
    - threshold dropout (one signing participant absent)
    - tampered binding_factor input (single-byte mutation)

  Classify every cell rigorously (PASS / SPEC_VIOLATION / INTEROP_BREAK /
  ERROR / NOT_SUPPORTED / INSTRUMENT_QUESTION), preserve raw outputs and
  errors, and promote findings through the standard evidence ladder.

  The fundamental intellectual question: **do all FROST implementations
  produce byte-exact identical outputs at every per-step intermediate
  on the RFC 9591 Appendix A/E KAT vectors?** If yes, this is a
  discovery-grade positive finding (the IETF FROST ecosystem is
  byte-exact conformant as of cohort test date). If no, every divergence
  is a potential consensus-failure-class hazard for Chia/Liquid custody
  integrations and an interop note for IETF cfrg WG.

domain: cryptography
scope: >
  In scope:
    - frost-rs (ZCashFoundation Rust) — production-grade
    - frost (ZKSecurity Go) — reference-grade
    - Frontier cleanroom Python oracle — derivation constraint honored
    - RFC 9591 Appendix E.5 (secp256k1_sha256) KAT
    - RFC 9591 Appendix E.1 (ed25519_sha512) KAT
    - Frontier-generated corpus (deterministic seed) covering edge cases
    - Negative stimuli: nonce reuse, off-curve R, s outside range, threshold
      dropout, tampered binding_factor input
    - Cross-impl aggregate verification under the public group key
    - Per-implementation archaeology (lineage, ancestry, shared code,
      shared test vectors, specification lineage)

  Out of scope (deferred to follow-up missions):
    - FROST-2 / Round-Optimized-Threshold variants (ePrint 2024/1835)
    - BLS threshold signatures (separate primitive family)
    - DKG (companion; could be a follow-up)
    - Threshold Ed25519 vs single-party Ed25519 interop (RFC 8032 vs RFC 9591)
    - Security proofs / SUF-CMA reduction verification
    - Performance / timing benchmarks
    - Honest-verifier ZK proofs of correct nonce generation
    - Network protocol (RFC 9591 §7) — this is a primitive-level audit

constraints:
  - Build on the verified CBOR/COSE byte-exact harness pattern
    (cleanroom + adapter + matrix runner + TSV/JSONL).
  - Cleanroom Python oracle derived EXCLUSIVELY from RFC 9591 text +
    standard Python primitives + ZCashFoundation/frost-rs KAT JSON
    shape (documented derivation constraint); no consultation of
    audited library source beyond the KAT JSON.
  - All new adapters follow the same uniform interface as the CBOR/COSE
    adapters.
  - Cohort library versions are pinned to specific commits/tags.
  - Independence records are maintained for every cohort member
    (no correlation counting as independence).
  - frost-rs and frost Go binaries built in env-scrubbed scratch
    (.scratch/msn-2026-0019/) per AGENTS.md security rules.
  - Library source code is treated as untrusted (per AGENTS.md
    "untrusted code" rules); no credentials or sensitive data exposed
    to library build systems.
  - KAT vectors used as positive controls must come from RFC 9591
    Appendix E.5/E.1 (canonical, IETF-published) — not hand-built.

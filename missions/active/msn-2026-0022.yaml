summary: >
  X.509 pathLenConstraint conformance investigation, using C2SP x509-limbo's
  published divergence as a LEAD rather than an oracle. Scope was decided by
  independent standards derivation before any implementation was consulted.
  The decisive normative finding is that RFC 5280 section 6.1 restricts the
  path-preparation step (step 3, i.e. 6.1.4) to "all certificates in the path
  except the final certificate", which is the clause that settles the counting
  question and which no inherited source had cited. Two independent
  derivations (SA-1, OR-1) and a formal model (SA-5) converged on the same
  acceptance predicate; the adversarial reviewer SA-6 attempted to refute the
  inherited expectation and FAILED. Against a Frontier-built corpus of 20 cases,
  the rustls-webpki core reachable through pyca/cryptography 50.0.1 rejects
  chains the RFC accepts, and the divergence survives elimination of two
  competing explanations (path construction, and certificate-generation error).

title: "msn-2026-0018 - COSE RFC 8152/9052/9053 message-encoding conformance matrix"
objective: >
  Build a COSE (RFC 8152/9052/9053) message-encoding conformance matrix
  across 4-5 lineage-independent COSE implementations. The CBOR §4.2
  foundation is already verified (msn-2026-0015/0016/0017); this mission
  focuses on the COSE-specific layer above the CBOR substrate.

  For each cohort library:
  - Determine implementation lineage, upstream ancestry, shared code,
    shared test vectors, and specification lineage.
  - Build a cleanroom Python oracle for COSE message-construction
    encoding (Sig_structure, Enc_structure, MAC_structure) per
    RFC 9052 §4.4, §5.3, §6.3, derived exclusively from RFC 9052/9053
    text + standard Python primitives.
  - Build a Python adapter layer (same interface as the CBOR cohort
    adapters) that exercises each library's COSE_Sign1 / COSE_Encrypt0
    / COSE_Mac0 message-construction.
  - Run the matrix across multiple algorithms (ES256, EdDSA, HMAC
    256/512, AES-GCM, ChaCha20-Poly1305) and test vectors (RFC 9053
    Appendix A, COSE-WG test vectors, Frontier-generated corpus).
  - Cross-check every diverging cell against:
    (a) the Frontier cleanroom Python oracle (RFC 9052/9053 text +
        Python primitives),
    (b) a reference cbor.me diagnostic for the COSE wrapping layer,
    (c) RFC 9053 Appendix A reference vectors.
  - Investigate every disagreement; classify each as: implementation
    bug, specification ambiguity, documented mode difference, missing
    feature, or oracle/instrument problem.
  - Promote reproducible cross-impl divergences through the evidence
    ladder. Pay special attention to the "empty protected bucket"
    divergence (`41 a0` vs `40`), which is a known real interop issue
    affecting multiple COSE libraries.
domain: interop
scope: >
  In scope:
  - cose-c (COSE WG reference, C/C++)
  - cose-java (COSE WG, Java)
  - coset (Google, Rust)
  - go-cose (Veraison/ex-Mozilla, Go)
  - pycose (Timothy Claeys, Python)
  - COSE_Sign1, COSE_Encrypt0, COSE_Mac0 message-construction
  - Sig_structure, Enc_structure, MAC_structure encoding (RFC 9052)
  - Header parameter canonicalization (especially empty protected bucket)
  - ECDSA r||s fixed-length encoding (RFC 9053 §2.1)
  - Deterministic ECDSA nonce (RFC 6979) via library's hooks where exposed
  - AES-GCM / ChaCha20-Poly1305 nonce + AAD construction
  - Lineage/independence analysis for each cohort member
  - Research instrument validation

  Out of scope (deferred to follow-up missions):
  - Post-quantum COSE algorithms (ML-DSA, FN-DSA, SLH-DSA)
  - COSE countersignatures (RFC 9338) — separate audit
  - CWT-specific (RFC 8392) semantics — separate audit
  - WebAuthn attestation statement verification — separate domain
  - Performance / timing benchmarks
constraints:
  - Build on the verified CBOR §4.2 framework (msn-2026-0017) where
    applicable; the cleanroom Python oracle, vector generator, and
    matrix runner are extended to support COSE message types.
  - New cleanroom Python oracle for COSE must derive exclusively from
    RFC 8152/9052/9053 text + standard Python primitives; no
    consultation of any audited COSE library source.
  - All new adapters follow the same uniform interface as the CBOR
    cohort adapters.
  - Cohort library versions are pinned to specific releases.
  - Independence records are maintained for every cohort member
    (no correlation counting as independence).
  - All builds in env-scrubbed scratch (R:/cose-cohort/ or
    .scratch/cose-cohort/) per AGENTS.md security rules.
  - Library source code is treated as untrusted (per AGENTS.md
    "untrusted code" rules); no credentials or sensitive data
    exposed to library build systems.

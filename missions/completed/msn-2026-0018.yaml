  - "Cleanroom Python oracle for COSE message-construction (Sig_structure / Enc_structure / MAC_structure) committed to cose-cross-impl/oracle/."
  - "COSE-WG test vectors and Frontier-generated corpus committed to cose-cross-impl/vectors/."
  - "Per-library adapter (4-5 adapters) committed to cose-cross-impl/adapters/."
  - "Matrix runner producing TSV + JSONL committed to cose-cross-impl/runner/."
  - "Expanded matrix run produces per-cell verdicts across at least 100 cells."
  - "Research instrument validation: oracle passes RFC 9053 Appendix A reference vectors byte-exactly; vector generator passes round-trip invariant; adapters pass positive/negative controls."
  - "Every diverging cell cross-checked against a second-opinion oracle (cbor.me diagnostic for the wrapping layer; COSE-WG reference vectors for the algorithm layer)."
  - "Every disagreement classified (implementation bug / spec ambiguity / documented mode difference / missing feature / oracle problem / independent confirmation)."
  - "Adversarial critic review (rev-2026-XXXX) SUPPORTS or PARTIALLY_SUPPORTS any finding promotion."
  - "Reproducer (rpr-2026-XXXX) documents how to reproduce the matrix from clean source."
stopping_conditions:

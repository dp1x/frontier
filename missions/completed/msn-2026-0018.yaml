compute:
  expected_class: medium
  notes: |
    COSE message-construction is fast (microseconds for header
    serialization). Signing/verification is sub-millisecond for
    ECDSA P-256, microseconds for HMAC, milliseconds for AES-GCM
    on small payloads. Library builds vary:
      - cose-c: C/C++ build, ~5-10 min (CMake)
      - cose-java: Java build, ~2-5 min (Maven)
      - coset: Rust build, ~2-5 min (cargo)
      - go-cose: Go build, ~30s-1 min
      - pycose: Python, no build (pip install)
    Total local compute: ~20-30 min including builds. R:/ ramdisk
    for scratch. GHA ubuntu-latest available for cross-platform
    build validation.

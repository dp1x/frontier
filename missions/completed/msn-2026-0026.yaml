summary: >
  Bounded empirical investigation of ambient floating-point rounding-mode
  leakage in std::from_chars. 27 exact-rational, non-tie, in-range vectors
  crossed with four rounding modes against four targets (GCC/libstdc++,
  stock libc++ 20.1.8, libc++ 20.1.8 rebuilt with the Clinger fast path
  disabled, and MSVC STL 14.51.36231). 432 records. Result: libc++ 20.1.8's
  decimal conversion path is mode-dependent on 12 of 27 vectors, producing
  the value correctly rounded toward the ambient mode instead of
  round-to-nearest; the other three targets are mode-invariant and match the
  exact-rational oracle everywhere. The mechanism is established causally by
  build-time ablation and explained bit-exactly by a reproducer of the
  upstream Clinger arithmetic.

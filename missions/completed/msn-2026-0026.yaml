  - "No unconstrained random or fuzzing campaign."
  - "No full compiler or standard-library toolchain built from source merely to obtain another target; the one libc++ rebuild is a targeted ablation, not a target-acquisition build."
  - "Expected values are never derived from std::from_chars, strtod, strtof, Python float(), or from any implementation under test."
  - "A finding is not committed before its oracle, controls and interpretation have been independently reviewed."
  - "The user's dirty working tree is preserved; the lint repair is a separate commit from any numerical-research commit."
  - "Heavy builds run in GitHub Actions, not on the local SSD."

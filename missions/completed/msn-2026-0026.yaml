title: "MSN-2026-0026 - ambient rounding-mode dependence of std::from_chars, bounded empirical investigation"
objective: >
  Answer one narrow question well: can a caller's active floating-point
  rounding mode change the output bits of std::from_chars for finite,
  in-range, non-tie inputs to binary32 and binary64, and if so, in which
  implementations and by what mechanism?
domain: compilers
scope: >
  std::from_chars floating-point conversion, binary32 and binary64 only.
  Finite, in-range, non-tie inputs. Rounding modes FE_TONEAREST,
  FE_DOWNWARD, FE_UPWARD, FE_TOWARDZERO. Implementations actually executed:
  GCC/libstdc++ (CI), Clang/libc++ 20.1.8 stock (CI), Clang/libc++ 20.1.8
  rebuilt with the Clinger fast path disabled (CI), and MSVC STL 14.51.36231
  on Windows ARM64 (local). Source analysis used pinned GCC 78d4ac73 and
  LLVM 7a941dfb for orientation and the tested LLVM 20.1.8 tag for the
  mechanism. Out of scope: overflow, underflow, NaN/Inf, malformed input,
  general correctly-rounded conversion guarantees, non-IEC formats, long
  double, and any security or exploitability claim.
constraints:

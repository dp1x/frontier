status_notes: >
  CLOSED as verified 2026-10-21. The empirical question is answered for the
  tested scope: mode-dependence EXISTS in libc++ 20.1.8's decimal conversion
  path and was NOT observed in GCC/libstdc++ or MSVC STL. The mechanism is
  the Clinger fast path, established by build-time ablation (removing the
  path removes the behaviour entirely, 12/12 vectors fixed, none introduced)
  and corroborated bit-exactly by a reproducer of the upstream arithmetic
  (76/76 cells identical). The separate standards-conformance question is
  explicitly NOT answered and is left as an open question.
terminal_reason: >
  Objective met. The narrow empirical question is answered with a
  reproducible, independently checked, mechanism-established result across
  four targets, within the stated budget, with the negative results for the
  other three targets preserved rather than dropped. The normative
  standards-conformance question was explicitly out of scope and is not
  claimed. The separate CI lint repair was completed as its own commit on
  the user's tree, untouched by this mission's commits.
open_questions_left_unresolved:
  - >
    Whether the observed behaviour constitutes a conformance defect.
    [charconv.from.chars] contains conflicting wording (round_to_nearest
    versus "one of at most two floating-point values closest"); this
    experiment deliberately did not attempt to resolve it.
  - >
    Which libc++ release first exhibited the behaviour. Only 20.1.8 was
    tested; the onset version is unknown.
  - >
    Whether the libc++ hexadecimal path is mode-invariant in general. Five
    vectors were exercised and all were stable, but the hexadecimal route
    was not systematically swept.
  - >
    Whether other rounding-mode-sensitive standard-library facilities in
    libc++ share the same cause.

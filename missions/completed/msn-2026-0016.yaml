terminal_reason: |
  Mission terminalized as inconclusive-after-budget. All 4 vector-generator
  bugs identified in obs-2026-0040 were fixed in this mission:
    (1) Tagged wrapper class with JSON-sidecar encoding
    (2) Bytes serialization via JSON-sidecar hex encoding
    (3) Undefined sentinel class with cbor2.undefined mapping
    (4) Tuple-as-array-key via __type__: 'tuple' sidecar

  After fixes, the matrix was re-run:
    - 222 cells (111 vectors × 2 modes)
    - 204 PASS (91.9%) — up from 197 PASS (88.7%) in msn-2026-0015
    - 14 SPEC_AMBIGUITY (default mode, all float_shortest_form, documented cbor2 behavior)
    - 4 SPEC_VIOLATION (default mode, all map_key_sort, documented cbor2 behavior)
    - 0 ERROR (was 2 in msn-2026-0015)
    - 0 INTEROP_BREAK (was 2 in msn-2026-0015)

  CRITICAL FINDING: in canonical mode, cbor2 byte-exact matches the
  Frontier cleanroom oracle on 100% of cells (111/111). Both implement
  RFC 8949 §4.2.3 length-first map key ordering.

  Per the corrected fnd-2026-0013:
    - The original claim that cbor2 canonical uses §4.2.1 bytewise-lex
      was INCORRECT. cbor2 canonical actually uses §4.2.3 length-first.
    - No actual cross-impl divergence exists between cbor2 canonical
      and Frontier oracle.
    - All 18 divergences are in default mode (non-canonical) and are
      documented cbor2 behavior.

  Acceptance criteria:
    MET: All 4 vector-generator bugs fixed
    MET: Vectors regenerated deterministically (seed 0xCB0F1E21)
    MET: Oracle self-test still passes RFC 8949 Appendix C 14/14
    MET: Oracle self-test still passes RFC 8949 §4.2.3 example
    MET: Undefined() sentinel correctly encoded as 0xf7
    MET: Tagged(N, content) wrapper correctly encoded as tag
    MET: bytes values correctly encoded as byte strings
    MET: Matrix re-run produces per-cell verdicts
    MET: False-positive divergences from msn-2026-0015 eliminated
    MET: cbor2 canonical mode 100% byte-exact match with oracle (111/111)
    NOT MET: Adversarial critic review not re-performed (mission terminalized)
    NOT MET: fnd-2026-0013 promoted to verified_conclusion (cohort too small)

  Follow-up missions queued:
    - msn-2026-0017: Add Rust ciborium + Haskell cborg + JS cbor-x to cohort
      (cross-impl confirmation). Verify same 100% canonical-mode PASS rate.
    - msn-2026-0018: cbor.me web cross-check on 2-3 sample cells
    - msn-2026-0019: COSE message-encoding audit (different domain)
    - msn-2026-0020: X.509 path validation audit (different domain)

  Budget consumption: 1 attempt (target reached), 1 verifier re-run,
  4 vector-generator bugs fixed, 1 finding downgraded (no actual
  divergence in canonical mode), 1 observation re-recorded.

  Per the charter's diminishing-returns window, the mission was
  terminalized. Cohort expansion (Rust + Haskell + JS) is queued for
  a follow-up mission; this requires significant build infrastructure
  that exceeds the current session budget.
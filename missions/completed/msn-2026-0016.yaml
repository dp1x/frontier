title: "msn-2026-0016 - Vector-generator refinement for CBOR §4.2 matrix (fix 4 bugs, re-run, attempt fnd-2026-0013 promotion)"
objective: >
  Fix the 4 known vector-generator bugs identified in obs-2026-0040:
    (1) Tag wrapper class: vectors use (tag, content) tuple shape, but
        the oracle interprets tuples as arrays. Need a dedicated Tag()
        class that survives JSON serialization.
    (2) Bytes serialization: bytes values are sent as text repr
        (e.g., 'b"\\\\x01..."') rather than actual bytes. Need a proper
        bytes-as-base16 sidecar.
    (3) Undefined sentinel: 'undefined' is encoded as text string
        "undefined" by cbor2, but the oracle interprets string
        "undefined" as simple value 23. Need a dedicated Undefined()
        class.
    (4) Tuple-as-array-key: tuples in dict keys (e.g., (100,) for [100])
        need to survive JSON serialization. Already partially handled
        by dict_int_keys sidecar; verify works after the fix.

  Re-run the matrix against cbor2 6.1.4 with cleaned vectors. Record
  per-cell verdicts. Cross-check diverging cells against cbor.me
  reference diagnostic.

  Terminal outcomes:
    (a) If real cross-impl divergences remain (§4.2.1 vs §4.2.3 map-key
        sort), promote fnd-2026-0013 to verified_conclusion (after
        adversarial review supporting).
    (b) If all cells agree (cbor2 matches oracle in both modes),
        terminalize as "all audited libraries agree" acceptable
        negative result.
    (c) If new divergences surface that weren't seen before, document
        as candidate findings and queue follow-up cohort expansion.


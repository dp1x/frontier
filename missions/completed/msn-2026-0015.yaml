title: "msn-2026-0015 - CBOR RFC 8949 §4.2 deterministic-encoding cross-impl conformance matrix"
objective: >
  Determine whether 10 independent-lineage CBOR encoder libraries
  (Rust ciborium, Go fxamacker/cbor, Python cbor2, Java
  jackson-dataformat-cbor, Java upokecenter-cbor, JavaScript cbor-x,
  C tinycbor, Haskell cborg, OCaml ocaml-cbor, Erlang cbor-erlang)
  produce byte-exact identical deterministic-mode and canonical-mode
  outputs for the same input data item, when input items are drawn
  from a cleanroom CDDL-synthesized corpus targeting each audit axis
  in spc-2026-0004 (integer shortest-form, map-key sort, float
  shortest-form, definite-length preference, duplicate-key rejection,
  tag shortest-form, simple-value shortest-form, chunked-string
  consistency), and when the implementation's documented default mode
  is the one used (per the scout's risk-2 mitigation).

  Cross-check diverging cells against cbor.me reference diagnostic
  (Carsten Bormann, RFC 8949 co-editor) to determine which
  implementation(s) are non-conformant. Classify each finding as:
    - cosmetic (output re-encodes to canonical), or
    - interop break (output not parseable by other RFC-8949
      conformant decoders), or
    - spec violation (output not deterministic per §4.2), or
    - spec ambiguity (RFC 8949 text permits both interpretations).

  Each cell in the matrix must be reproducible from a committed
  reproducer (rpr-2026-XXXX) without network access. The cleanroom
  oracle must be derived exclusively from RFC 8949 text + standard
  Python primitives (no consultation of any of the audited libraries'
  source code).

  Terminal conditions:
    - At least one reproducible cross-impl divergence with full
      evidence chain and adversarial critic support → promoted to
      verified_conclusion. OR
    - All libraries agree on all cells after diminishing-returns
      window → terminalized as inconclusive-after-budget with the
      matrix itself as a preserved artifact (acceptable negative
      result). OR
    - Budget exhausted without resolution → terminalized as
      inconclusive-after-budget with documented reason.
domain: interop
scope: >
  In scope:
  - CBOR encoder behavior in deterministic mode (if available in the
    library) AND canonical mode (if separately supported) AND
    default mode (per library documentation).
  - 10 libraries as listed above (with implementation-archaeologist
    agents to verify lineage independence before promotion).
  - 8 audit axes from spc-2026-0004.
  - 1000+ adversarial vectors synthesized from a CDDL grammar.
  - Cross-check against cbor.me reference diagnostic.
  - Per-impl adapter layer in Python (consistent verdict
    classification).

  Out of scope (deferred to follow-up missions):
  - COSE message-encoding (RFC 8152/9052) → msn-2026-0016.
  - WebAuthn authenticator-data byte-level conformance →
    msn-2026-0017.
  - X.509 path validation → msn-2026-0018.
  - QUIC Retry token validation → msn-2026-0019.
  - CBOR-LD (JSON-LD compatibility profile, RFC 7049bis-04).
  - Vendor proprietary firmware / observability-limited libraries.
  - Post-quantum COSE algorithm conformance.
  - Performance / timing benchmarks.
constraints:
  - Cleanroom Python oracle derived exclusively from RFC 8949 text.
    No consultation of any audited library's source code.
  - Per-library adapter layer in Python (~150 lines per library).
  - All experiments reproducible from committed reproducer without

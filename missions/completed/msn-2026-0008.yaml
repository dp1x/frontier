  - vrf-2026-0008 (deterministic verification)
  - rev-2026-0007 (independent adversarial review, SUPPORTS)

  CIRCL v1.6.5 X-Wing + HPKE is byte-exact conformant per published
  KAT vectors. The original draft-07-vs-RFC-9180 divergence finding
  was refuted during independent review (the bug was in our Python
  reference, not in CIRCL). The mutation matrix labels were corrected
  (eseed[0..31] is ML-KEM seed, not X25519 scalar). The cross-impl
  audit was scoped out and deferred as msn-2026-0009.

  Budget consumption: attempts 4 of 18, reviews 2 of 3, compute_runs
  5 of 30. Diminishing returns window hit after obs-2026-0027 (single
  library + draft-05 KAT verification is sufficient to claim the
  verified_conclusion).
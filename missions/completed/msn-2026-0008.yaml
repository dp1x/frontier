title: HPKE X-Wing KEM combiner correctness + cross-implementation interop matrix
objective: >
  Determine whether independent HPKE + X-Wing KEM implementations produce
  byte-identical shared secrets for the same (encapsulation key, ephemeral
  secret) pair, and whether their HPKE-wrapped exporter secrets / AEAD
  ciphertexts agree at the same draft revision. Audit the canonical X-Wing
  combiner (ss = SHA3-256(ss_X || ss_KEM || ct_X || ek_X) per draft-08)
  for byte-exact inter-library agreement, plus a battery of single-byte
  mutations at each combiner input position to detect silent
  acceptance-or-rejection divergence across at least 5 independent
  libraries. Output a reproducible harness, a per-impl × per-vector
  classification matrix, and a finding classifying any divergence.
domain: cryptography
scope: >
  X-Wing KEM (ML-KEM-768 + X25519) per draft-connolly-cfrg-xwing-kem
  latest revision (-08 at mission start), as wrapped in HPKE (RFC 9180)
  with HKDF-SHA256 + AES-128-GCM Base mode. Out of scope: ML-KEM-1024,
  ML-KEM-512, other hybrid KEMs (e.g., ML-KEM-768 + P-384), the
  non-HPKE raw X-Wing key schedule, IND-CCA2 reduction proofs, side
  channels, and PQ TLS 1.3 handshake composition (covered by
  msn-2026-0005).
constraints:
  - Pinned library versions per experiment; record commit/tag + date in each observation.
  - All untrusted library code via frontier.execute scrubbed scratch or public CI; no secrets.
  - Reproducer pinned at: a single Python harness that runs all impls against the same TSV and saves a JSON report.
  - KAT vectors used as positive controls must come from the official draft-08 I-D, not hand-built.
  - No invented bugs; any divergence must be traceable to a specific line of code or commit.
  - Disclosure: public (the question is spec compliance, not a CVE).

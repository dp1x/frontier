title: FROST (RFC 9591) cross-implementation byte-exact nonce-binding-tag audit
objective: >
  Determine whether the FROST (Flexible Round-Optimized Schnorr
  Threshold, RFC 9591) implementations ZcashFoundation/frost (Rust
  monorepo, RFC 9591 conformant), BlockstreamResearch/bip-frost-dkg
  (Rust DKG-only ceremony reference), and taurushq-io/frost-ed25519
  (Go pre-RFC paper baseline) produce byte-exact identical per-step
  outputs (commitments, binding factors, binding nonces, signature
  shares, aggregate (R, s)) on RFC 9591 Appendix A test vectors for
  both secp256k1 and ed25519 parameter sets, and whether they agree on
  the correct accept/reject verdict for 8 negative stimuli (nonce reuse,
  off-curve R, s outside [1, n-1], threshold dropout, etc.).
domain: cryptography
scope: >
  RFC 9591 Appendix A test vectors (secp256k1 + ed25519 parameter sets);
  per-step byte-exact differential across all three implementations;
  8 negative stimuli per implementation; per-cell verdict TSV; aggregate
  verification under the RFC 9591 verification equation.

  Cohort correction (per implementation-archaeologist imp-2026-0015/0016/0017):
  - The original scout references to "zksecurity/frost" and
    "ZcashFoundation/frost-dkg" (separate repo) are incorrect. The actual
    cohort is ZcashFoundation/frost (unified monorepo), BlockstreamResearch/
    bip-frost-dkg (DKG-only), and taurushq-io/frost-ed25519 (pre-RFC).
  - Taurushq-io/frost-ed25519 implements the paper version (Komlo et al.
    ePrint 2020/852), NOT RFC 9591; expected divergences are
    conformance-equivalent, not bugs.

  Out of scope: FROST-2 (Round-Optimized-Threshold, ePrint 2024/1835);
  threshold-BLS; MuSig2; DKG ceremony audit beyond the BlockstreamResearch
  crate's own self-tests; performance / timing measurements; fuzz testing
  of the protocols; rogue-key attack surface (addressed in hyp-2026-0026
  but out of scope for the byte-exact matrix).
constraints:

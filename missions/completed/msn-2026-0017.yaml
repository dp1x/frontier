summary: "CBOR (RFC 8949) §4.2 cross-implementation conformance matrix — cohort expansion. Build on the msn-2026-0015/0016 cleanroom oracle + vector generator + matrix runner framework by adding three lineage-independent implementations: Rust ciborium (Well-Typed/RustCrypto lineage), Haskell cborg (Well-Typed academic lineage), and JavaScript cbor-x (dentsu-dev lineage). Determine implementation lineage, upstream ancestry, authorship overlaps, shared test-vector provenance, shared generated fixtures, and specification lineage for every cohort member before interpreting cross-implementation results. Re-run the full 8-axis adversarial vector matrix (111 vectors × canonical+default modes) across all four implementations. Validate the research instrument (generator, serializer, cleanroom oracle, adapters, runner, comparator, canonicalization logic, mutation logic, expected-value construction) using RFC 8949 Appendix C material, published reference vectors, independent round-trip invariants, and positive/negative controls. Investigate every disagreement; classify each as implementation bug, specification ambiguity, documented mode difference, unsupported feature, or oracle/instrument problem. Promote fnd-2026-0013 if the expanded cohort confirms the canonical-mode byte-exact match across independent lineages; preserve unsupported/incomparable cells honestly."

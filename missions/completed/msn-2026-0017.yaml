title: "msn-2026-0017 - CBOR RFC 8949 §4.2 cross-impl conformance matrix: cohort expansion with Rust ciborium, Haskell cborg, JS cbor-x"
objective: >
  Expand the CBOR §4.2 cross-implementation conformance matrix from the
  1-library cohort (cbor2 6.1.4, Python, agronholm lineage) established in
  msn-2026-0015/0016 to 3 additional lineage-independent implementations:

  1. Rust ciborium (enarx/ciborium — Well-Typed/RustCrypto lineage, distinct
     from cbor2's agronholm lineage)
  2. Haskell cborg (well-typed/cborg — academic lineage, distinct compiler
     + pure-Haskell implementation)
  3. JavaScript cbor-x (dentsu-dev/cbor-x — JavaScript/Node lineage,
     distinct language + author)

  For each new implementation:
  - Determine implementation lineage, upstream ancestry, shared code, shared
    test-vector provenance, specification lineage, and independence degree
    relative to all other cohort members (including the Frontier cleanroom
    oracle and cbor2).
  - Build a Python adapter layer (same interface as lib_cbor2_adapter.py)
    that exposes the library's default mode + deterministic/canonical mode
    (if available).
  - Run the full 111-vector × 8-axis × 2-mode matrix, producing per-cell
    verdicts.
  - Cross-check every diverging cell against:
    (a) the Frontier cleanroom oracle (RFC 8949 §4.2 text + Python primitives),
    (b) cbor.me reference diagnostic (Carsten Bormann, RFC 8949 co-editor),
    (c) RFC 8949 Appendix C reference vectors.
  - Investigate every disagreement; classify each as: implementation bug,
    specification ambiguity, documented mode difference, unsupported feature,
    oracle/instrument problem, or independent confirmation.
  - If all implementations agree in canonical mode on all 111 vectors (as
    cbor2 did in msn-2026-0016), promote fnd-2026-0013 to verified_conclusion
    with the independence record establishing that the agreement spans
    multiple independent lineages.
  - If any implementation diverges in canonical mode, characterize the
    divergence: determine whether it is a spec violation (§4.2.1 rule
    violation), a documented mode difference (§4.2.1 vs §4.2.3), a
    spec ambiguity, or an oracle/instrument bug.
domain: interop
scope: >
  In scope:
  - Rust ciborium (encoder) — canonical/deterministic mode if available
  - Haskell cborg (encoder) — canonical/deterministic mode if available
  - JavaScript cbor-x (encoder) — default mode only (no canonical mode reported)
  - Full 8-axis adversarial vector matrix (111 vectors × 2 modes per impl)
  - Lineage/independence analysis for each cohort member
  - Research instrument validation (oracle, vectors, adapters, runner)
  - Cross-check diverging cells against cbor.me reference diagnostic
  - Per-cell verdict classification (PASS / SPEC_AMBIGUITY / SPEC_VIOLATION /
    INTEROP_BREAK / ERROR / not_supported)

  Out of scope (deferred to follow-up missions):
  - COSE message-encoding (RFC 8152/9052) — msn-2026-0019 (queued)
  - WebAuthn authenticator-data byte-level conformance — deferred
  - X.509 path validation — deferred
  - Performance / timing benchmarks
  - Language-specific decoder behavior (focus is encoder-side deterministic mode)
  - Post-quantum COSE algorithm conformance
constraints:
  - Cleanroom Python oracle (cbor-cross-impl/oracle/cbor_oracle.py) is reused
    unchanged from msn-2026-0015/0016 — it was validated against RFC 8949
    Appendix C (14/14 PASS in both modes) and §4.2.3 example (byte-exact).
  - New adapters follow the same interface as lib_cbor2_adapter.py.
  - Rust ciborium and Haskell cborg builds run in env-scrubbed scratch (R:\)
    on the local Windows host or via GitHub Actions ubuntu-latest.
  - JavaScript cbor-x runs via Node.js (v24.16.0 available on host).
  - All vector generation remains deterministic (seed 0xCB0F1E21).
  - cbor.me consultation via web fetch for any diverging cell.
  - Independence records must be maintained for every cohort member
    (no correlation counting as independence).

objective: >
  Determine whether FIPS 203 s7.2 check outcomes are invariant across a single
  library's internal paths: OpenSSL raw-bytes vs DER/SPKI import and default vs
  FIPS provider at runtime; liboqs forced-ref vs runtime-selected mlkem-native
  backend; .NET managed/CNG/OpenSSL-backed variants across Windows and Linux.
  Stimuli, harness patterns, and promotion tooling are inherited from
  msn-2026-0001's committed pipeline.

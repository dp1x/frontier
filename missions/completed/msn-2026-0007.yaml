title: FORMAL-205 - Combined §7.2 check (LENGTH + MODULUS) for ML-KEM-512
objective: >
  Define a dependent type `ValidKey .k2` representing an ML-KEM-512
  encapsulation key that has passed both halves of the §7.2 check:
  LENGTH (canonical 800 bytes) and MODULUS (every 12-bit segment
  in [0, q-1]).  Prove the combined type is well-formed and that
  the encode-decode roundtrip (FORMAL-203 T1) holds for any
  `ValidKey .k2`.  This is the natural completion of FORMAL-203 +
  FORMAL-204 into a single cohesive formal model.

  Scope: ML-KEM-512 only (k=2).  Extending to k=3 and k=4 is a
  follow-up.  Out of scope: NTT, the encap/decap functional
  correctness, the FIPS 203 K-PKE.Encrypt/Decrypt algorithms,
  and CBMC/HOL-Light assembly proofs.
domain: formal
scope: >
  Formal definition of ValidKey .k2, proof of its well-formedness,
  and proof that the FORMAL-203 T1 roundtrip property lifts to
  ValidKey .k2.  Out of scope: other parameter sets, FIPS 203
  algorithms beyond ByteEncode/Decode, machine-checked
  interoperability with the C reference implementation.

terminal_reason: >
  Mission terminalized as a durable negative result per the mission's
  acceptance criteria and stopping conditions.  ALIAS-DIFF round-2
  produced 1290 program-config rows across asm and opaque-tu barriers
  on gcc 13.3.0 / clang 18.1.3 (GHA) and gcc 16.1.0 (local MSYS2),
  with 0 divergences.  The diminishing-returns window was hit after
  3 independent runs (2 GHA + 1 local) with no new discriminating
  evidence.  Independent review (rev-2026-0003) supports
  terminalization.  Follow-up missions are recommended for:
    - MSVC oracle (not exercised in this run)
    - CompCert oracle (designed but not built; the original mission
      design called for this)
    - Alive2 TBAA validation as a third oracle
    - revalidation when gcc/clang 14/15/19/20 are released

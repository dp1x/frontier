terminal_reason: |
  Mission terminalized as verified_conclusion with full evidence chain.
  OpenSSH portable master HEAD commit 0ef0f5a8 sshd is length-only lenient
  on the C_INIT portion of SSH_MSG_KEX_ECDH_INIT (message 30) for both
  mlkem768x25519-sha256 and sntrup761x25519-sha512 hybrid KEX cohorts.
  Source-code audit of kexmlkem768x25519.c (lines 117-130) and
  kexsntrup761x25519.c (analog) confirms only sshbuf_len(client_blob) != need
  check is present before crypto_kem_*_enc is called. Empirical GHA run
  33288641132 confirms server reaches crypto_kem_mlkem768_enc despite
  tampered C_INIT (first 12-bit coefficient set to q=3329).

  Per draft-ietf-sshm-mlkem-hybrid-kex-10 s2.1, the server "MUST perform
  the encapsulation key checks defined in Section 7.2 of [FIPS203]".
  OpenSSH portable implements only the length half of the FIPS 203 s7.2
  check. H1 (OpenSSH portable is length-only lenient on C_INIT modulus
  half) is confirmed.

  Follow-up missions queued:
    - msn-2026-0011: Stage C client-side decapsulation parity
    - msn-2026-0012: Stage D Erlang/OTP ssh independent cohort
    - msn-2026-0013: Sntruprime byte-layout audit

  Budget consumption: 7 GHA runs (one per harness fix iteration), 1
  verified_conclusion finding, 1 reproducer, 1 verifier, 1 reviewer.
  All Stage A/B stimuli executed on both cohorts; Stage C/D deferred
  to follow-up missions due to harness recvPacket bug.

  Acceptance criteria partially MET:
    MET: Stage A/B for both cohorts; source-code reproducer pinned;
         adversarial review; verified_conclusion promotion.
    PARTIAL: Stage C (harness bug); Stage D (gated, not needed
              because source-code audit already shows lenient).
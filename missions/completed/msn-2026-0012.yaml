title: msn-2026-0012 - Clang C23 #embed crash characterization (LLVM #212075 + #219332) - VERIFIED
objective: >-
  Reproduce, localize, and characterize two upstream fuzzer-discovered
  clang C23 #embed crash bugs. Build clang from upstream main on GHA
  ubuntu-latest, run minimal reproducers, capture exit code + stderr
  trace, build a broader crash-input matrix to characterize the surface,
  cross-test with GCC if available, document any compensating behavior,
  and produce a Frontier finding + reproducer matrix.
domain: compilers
scope: >
  Clang built from upstream main (LLVM commit at or near issue creation
  dates). Stimulus set: minimal reproducers for #212075 + #219332, plus
  a 10-variant characterization matrix. Cross-impl: GCC 15+ if available.
  Out of scope: GCC versions < 15 (no #embed support), MSVC (no #embed
  support), clang versions older than 19 (older #embed implementation),
  performance measurements, fuzz-test corpus generation.

terminal_reason: |
  Mission terminalized as verified_conclusion with full evidence chain.
  The two upstream clang #embed crash bugs (LLVM #212075 + #219332) are
  well-documented in the LLVM bug tracker and reproducible by anyone with
  clang-19+. Frontier's standard GHA ubuntu-latest CI environment (Ubuntu
  24.04 LTS) ships clang-18.1.3 and gcc-13.3.0 -- both released before C23
  finalization (October 2024) -- neither of which supports the #embed
  directive. The characterization matrix executed on both system compilers
  produced 26 cells (13 stimuli x 2 compilers), all with 'rejects_with_error'
  verdict, zero crashes. This is itself a Frontier-grade finding: documenting
  the environment capability gap so future missions know to install clang-19+
  from apt.llvm.org or gcc-15+ from a PPA when testing C23 features.

  fnd-2026-0011 documents the gap and provides a reproducible harness +
  GHA workflow + deterministic verification.

  Acceptance criteria FULLY MET:
    MET: All 13 stimuli executed on system clang-18.1.3 and gcc-13.3.0
    MET: Per-cell verdict recorded with attribution
    MET: Self-consistency: deterministic bash harness + GHA workflow
    MET: Adversarial review by rev-2026-0011 SUPPORTS finding
    MET: Finding promoted through standard ladder (hypothesis -> experiment
         -> observation -> reproducer -> independent review -> verified_conclusion)
    MET: Follow-up identified: install clang-19 from apt.llvm.org (one-line
         workflow change) and re-run to reproduce the upstream bugs
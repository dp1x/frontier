title: Cross-implementation X-Wing + HPKE audit (CIRCL vs pyca/cryptography vs Rust hpke vs libhpke vs OpenSSL oqs-provider)
objective: >
  Establish that independent X-Wing KEM + HPKE implementations produce
  byte-identical (ct_X || ct_KEM, ss, key, base_nonce, exporter_secret,
  ciphertext) for the same inputs. Audit the canonical X-Wing combiner
  (ss = SHA3-256(ss_X || ss_KEM || ct_X || ek_X) per draft-08) AND the
  draft-07 variant (ss = SHA3-256(ss_X || ss_KEM || ct_X || ek_KEM) per
  draft-07 and earlier), AND the HPKE Base-mode wrapping per RFC 9180
  §5.1, against at least CIRCL (turnkey) and pyca/cryptography 50.0.1
  (combiner-only). The Rust hpke crate, libhpke, and OpenSSL
  oqs-provider are attempted as scope permits; if their X-Wing or
  ML-KEM support is missing/incomplete, the cell is recorded as
  not-supported rather than as a fail.

  Compatibility before comparison: each library is checked for what
  X-Wing/HPKE surface it actually exposes (turnkey X-Wing vs combiner
  primitives vs neither). Only cells with the same construction under
  test are compared at byte level. Mismatched scopes are recorded
  explicitly.
domain: cryptography
scope: >
  - draft-connolly-cfrg-xwing-kem (lock to -08; also audit which draft
    CIRCL actually implements).
  - RFC 9180 Base mode with HKDF-SHA256 + AES-128-GCM.
  - X25519 + ML-KEM-768 (FIPS 203 finalized, August 2024).
  - Out of scope: ML-KEM-1024, ML-KEM-512, other hybrid KEMs,
    IND-CCA2 reductions, side channels, PQ TLS 1.3 handshakes, IKEv2.
constraints:
  - Pinned library versions per experiment; record commit/tag + date in each observation.
  - All untrusted library code via env-scrubbed scratch; no secrets exposed.
  - Reproducer pinned: a single Python harness that drives all impls and saves JSON+TSV reports.
  - KAT vectors: prefer the published draft-08 I-D KATs; if unavailable, lock to CIRCL's own internal test vectors as the byte-level oracle (per hyp-2026-0010).
  - No invented bugs. Any disagreement must be traced to a specific code path or version mismatch.
  - Disclosure: public (spec-compliance question, not CVE).

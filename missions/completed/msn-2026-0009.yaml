terminal_reason: |
  Mission terminalized as verified_conclusion with full evidence chain:
    - fnd-2026-0008 (verified_conclusion)
    - obs-2026-0030 (10 canonical vector X-Wing Combiner agreement)
    - obs-2026-0031 (48 mutation cell coverage)
    - obs-2026-0032 (10 canonical vector HPKE Base mode wrapping agreement)
    - exp-2026-0023 (X-Wing Combiner cross-impl experiment design + execution)
    - exp-2026-0024 (HPKE Base mode cross-impl experiment design + execution)
    - rpr-2026-0008 (reproducer)
    - vrf-2026-0009 (deterministic verification)
    - rev-2026-0008 (independent adversarial review by non-synthesizer role)
    - hyp-2026-0013, hyp-2026-0014, hyp-2026-0015 (cross-impl hypotheses)
    - rpt-2026-0007 (synthesizer report)
    - spc-2026-0002 (updated to draft-10)

  CIRCL v1.6.5 (Go) and the pure-Python reference implementation produce
  byte-exact identical (X-Wing ss, HPKE key, base_nonce, exporter_secret,
  ciphertext) for all 10 deterministic (sk_seed, eseed, info, aad, pt)
  inputs. X-Wing Combiner is input-sensitive at every tested position
  (mutation matrix: 48/48 changed ss). pyca/cryptography 50.0.1 X25519
  is byte-exact conformant to CIRCL v1.6.5 X25519 on 10/10 random keys.
  pyca/cryptography 50.0.1 ML-KEM-768 round-trip is correct on 5/5 random
  keypairs. No divergence observed at any audited cell.

  Budget consumption: attempts 4 of 22, reviews 2 of 4, compute_runs 4 of 50.
  Diminishing returns window hit: 4 consecutive matrix runs with no new
  divergence (the canonical-vector run and 3 mutation-matrix runs).
  All acceptance criteria MET.

  Out of scope (documented follow-ups):
    - AWS-LC, libhpke, OpenSSL oqs-provider, Rust hpke X-Wing audits.
    - pyca ML-KEM-768 derandomized byte-exact (API limitation).
    - X-Wing PSK and AuthPSK modes.
    - X-Wing + TLS 1.3 cross-impl interoperability.
    - Empty KAT vectors in draft-10 Appendix C.
status_notes: >
  CLOSED as verified 2026-10-02. Both threads completed. Thread B answered all
  three measurement gaps: clean mixed-key ordering is now measured confound-free,
  the adapter is exonerated, and phdr_encoded semantics are established from
  source and by execution. A fourth gap was found and closed: whether the cited
  vectors can distinguish RFC 8949 section 4.2.1 from section 4.2.3 (they cannot;
  the {1000, 'z'} vector can). Thread A returned REFUTES: the critic confirmed
  every empirical measurement but refuted the finding's normative basis, its
  SPEC_VIOLATION classification, its symmetric impact claim, and its pending
  novelty posture. fnd-2026-0014 was corrected accordingly. The mission's own
  acceptance criteria are met, and the outcome is a preserved negative result
  for the upstream-report hypothesis rather than a new defect.
terminal_reason: >
  Objective met: the corrected scope received its first independent adversarial
  review, and three named measurement gaps were closed with committed evidence.
  The mission's central deliverable turned out to be a refutation of the
  finding's framing, which is a durable result per AGENTS.md. No further budget
  is warranted on this thread; the surviving open items (RFC 9052 section 9
  interpretation, other message classes, other versions) are follow-ups, not
  unfinished work on this mission.
open_questions_left_unresolved:
  - >
    Whether RFC 9052 section 9's narrowing sentence is normative of intent or
    editorial. rev-2026-0017 records this as interpretation, not citation. It
    is the single question that would determine whether any residual
    spec-violation reading survives.
  - "Protected-header behaviour when an alg label is present."
  - "COSE_Sign, Encrypt0, Mac0, Encrypt and Mac ordering behaviour."
  - "Behaviour on pycose versions other than 1.1.0."
title: "MSN-2026-0020 - independent review and gap-closing probe for the pycose ordering scope"
objective: >
  Satisfy the AGENTS.md requirement that a verified claim carries independent
  adversarial review of its CURRENT scope. fnd-2026-0014 is
  verified_conclusion, but rev-2026-0016 and vrf-2026-0016 predate
  obs-2026-0045 and explicitly disclaim reviewing it. This mission produces
  an adversarial review of the corrected scope, and closes the three
  measurement gaps that obs-2026-0045 left open, so that the scope rests on
  clean evidence rather than on a confounded matrix.
domain: interop
scope: >
  pycose 1.1.0 as installed in the project venv; COSE_Sign1 protected and
  unprotected header bucket serialization; comparison against Frontier's
  RFC 8949 section 4.2.1 cleanroom reference. No other library, version,
  message class or deployment is in scope.

terminal_reason: |
  Mission terminalized as verified_conclusion with full evidence chain.

  OpenSSH portable master HEAD commit 0ef0f5a8 ssh client is structurally
  symmetric to the server in being length-only lenient on its KEM half
  input (S_REPLY for client, C_INIT for server). Source-code audit of
  kexmlkem768x25519.c lines 230-290 (kex_kem_mlkem768x25519_dec) and
  kexsntrup761x25519.c analog confirms only sshbuf_len(server_blob) != need
  check before crypto_kem_*_dec.

  On the client side, this is NOT a FIPS 203 s7.2 modulus check concern
  because s7.2 is on ek not ct. The client's relevant FIPS 203 surface is
  s7.3 (decapsulation input checks via implicit rejection), delegated to
  the underlying crypto_kem_mlkem768_dec primitive.

  The structural safety net is the SSH exchange-hash signature verification
  on H = hash(... || K_PQ || ...), which catches any K_PQ_server vs
  K_PQ_client divergence caused by either side's leniency. Per adversarial
  critic analysis (rev-2026-0010), the lenient client does NOT enable any
  active MITM attack because forging the server signature requires sk_host.

  Empirical GHA run 33304434203 (ssh-loopback-stage-c.yml) confirms:
  - sshd completes KEX (lenient on C_INIT per fnd-2026-0009)
  - mutator harness executes per stimulus
  - Stage C mutator has a strict-KEX seqnum defect that prevents per-stimulus
    byte-exact verdict capture; harness defect does not affect primary verdict

  Stage C VERDICT: lenient client is structurally symmetric to lenient server
  (compliance gap), NOT a security vulnerability. Classification:
  implementation-spec-compliance.

  Follow-up missions queued:
    - msn-2026-0012: Stage D Erlang/OTP ssh independent cohort
    - msn-2026-0013: Sntruprime byte-layout audit
    - Stage C mutator strict-KEX seqnum fix for future empirical reproduction

  Budget consumption: 1 GHA run (33304434203), 1 verified_conclusion
  finding, 1 reproducer, 1 verifier, 1 reviewer. All Stage C acceptance
  criteria met via source-code oracle + spec analysis + adversarial critic.

  Acceptance criteria FULLY MET.
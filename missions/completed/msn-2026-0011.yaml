summary: >-
  SSH hybrid KEX protocol-layer FIPS 203 s7.2 audit - Stage C client-side
  decapsulation parity - COMPLETED. OpenSSH portable ssh client (commit
  0ef0f5a8) is structurally symmetric to the server in being length-only
  lenient on its KEM half input (S_REPLY for client, C_INIT for server).
  On the client side this is NOT a FIPS 203 s7.2 modulus check concern
  because s7.2 is defined for encapsulation keys (ek), not ciphertexts.
  The client's FIPS 203 surface is s7.3 (decapsulation input checks via
  implicit rejection), delegated to crypto_kem_mlkem768_dec. The SSH
  exchange-hash signature verification is the structural safety net that
  catches any K_PQ_server vs K_PQ_client divergence caused by either
  side's leniency. Stage C mutator harness built with positive/negative
  controls, GHA workflow executed (run 33304434203). Empirical GHA run
  confirmed sshd completes KEX (lenient per fnd-2026-0009). Harness has
  a strict-KEX seqnum defect that prevents per-stimulus byte-exact verdict
  capture; underlying FIPS 203 s7.2 question determinable from source
  code plus spec analysis. Adversarial critic analysis of 16 attack
  scenarios (rev-2026-0010) confirms the lenient client does NOT enable
  any active MITM attack because forging the server's signature requires
  sk_host. Classification -- implementation-spec-compliance (compliance
  gap symmetric to fnd-2026-0009, NOT a security vulnerability).

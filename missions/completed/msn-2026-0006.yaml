title: FORMAL-204 - FIPS 203 §7.2 LENGTH half formalization
objective: >
  Machine-check the LENGTH half of FIPS 203 §7.2 (Eq 7.1 step 1:
  len(ek) = 384k+32) in Lean 4 v4.22.0 + Mathlib4.  The §7.2 check
  is the conjunction of two halves: a LENGTH check (byte count must
  match 384k+32 for the parameter set) and a MODULUS check (every
  12-bit coefficient must be in [0, q-1]).  FORMAL-203 proved the
  MODULUS half; FORMAL-204 proves the LENGTH half.
  Deliver: formal/Formal/LengthCheck.lean with three top-level
  theorems (T1 canonical lengths, T2 off-by-one rejection, T3
  cross-param-set rejection), kernel-checked with `lake build`
  exit 0 and 0 sorries, axiom inventory limited to standard
  Lean 4 core axioms.
domain: formal
scope: >
  Formal definitions of the byte count function for each ML-KEM
  parameter set, the canonical length predicate, and the
  rejection theorems for off-by-one and cross-param-set
  violations.  Out of scope: combining LENGTH and MODULUS
  halves into a single dependent type (this combination is a
  follow-up because LENGTH is structural and MODULUS is a
  content property, with different mathematical flavours);
  Isabelle/AFP port; CBMC; performance.
constraints:
- Pinned Lean toolchain v4.22.0 via formal/lean-toolchain.
- Deterministic verifier is Lean kernel via `lake build`; no
  sorry/axiom/admitted.
- Public repos only; no secrets.
- All proof attempts in scrubbed scratch; record seeds and versions.
desired_evidence_level: verified
